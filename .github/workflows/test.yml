name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── openra_train engine wheel (sibling repo OpenRA-Rust) ─────
      # Without the wheel, 149+ engine-dependent tests skip at
      # collection (`pytest.importorskip("openra_train")`). Clone
      # the engine sibling, build the wheel via maturin, install it
      # into the same Python env, then verify importability before
      # pytest runs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clone OpenRA-Rust (sibling repo for engine wheel)
        uses: actions/checkout@v4
        with:
          repository: yxc20089/OpenRA-Rust
          path: OpenRA-Rust
          ref: main

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OpenRA-Rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('OpenRA-Rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install maturin
        run: pip install maturin

      # `maturin develop` requires a virtualenv. CI uses the runner's
      # system Python via setup-python@v5 — no venv. Build the wheel
      # explicitly and install via pip into the same Python env.
      - name: Build openra_train wheel
        working-directory: OpenRA-Rust/openra-train
        run: maturin build --release --out dist

      - name: Install openra_train wheel
        run: pip install --force-reinstall OpenRA-Rust/openra-train/dist/openra_train-*.whl

      - name: Verify engine wheel loaded
        run: python -c "import openra_train; print('engine OK:', openra_train.__file__)"

      # ── bench deps + tests ────────────────────────────────────────
      - name: Install bench dependencies
        run: |
          pip install pytest
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
