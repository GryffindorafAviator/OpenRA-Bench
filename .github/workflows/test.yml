name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── openra_train engine wheel (sibling repo OpenRA-Rust) ─────
      # Without the wheel, 149+ engine-dependent tests skip at
      # collection (`pytest.importorskip("openra_train")`). Clone
      # the engine sibling, build the wheel via maturin, install it
      # into the same Python env, then verify importability before
      # pytest runs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clone OpenRA-Rust (sibling repo for engine wheel)
        uses: actions/checkout@v4
        with:
          repository: yxc20089/OpenRA-Rust
          path: OpenRA-Rust
          ref: main

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OpenRA-Rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('OpenRA-Rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # `maturin develop` requires a virtualenv. Create one explicitly
      # so the PyO3 wheel installs into the same env pytest will run in.
      # Earlier attempts: (1) `maturin develop` with system Python failed
      # (no venv); (2) `maturin build --out dist && pip install` packaged
      # only the Python stub, missing the .abi3.so native binding.
      - name: Create venv + install maturin
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin

      # The crate uses PyO3 bindings but has no pyproject.toml, so
      # maturin 1.13+'s autodetect picks cffi-mode and produces a
      # pure-Python wheel (no .abi3.so → `from openra_train import
      # OpenRAEnv` fails). Write a minimal pyproject.toml that pins
      # bindings = "pyo3" so maturin packages the native module.
      - name: Pin maturin bindings via pyproject.toml
        run: |
          cat > OpenRA-Rust/openra-train/pyproject.toml <<'EOF'
          [build-system]
          requires = ["maturin>=1.0"]
          build-backend = "maturin"

          [project]
          name = "openra_train"
          version = "0.1.0"
          requires-python = ">=3.9"

          [tool.maturin]
          bindings = "pyo3"
          features = ["pyo3/extension-module"]
          EOF

      - name: Build + install openra_train wheel into venv
        working-directory: OpenRA-Rust/openra-train
        run: |
          source $GITHUB_WORKSPACE/.venv/bin/activate
          maturin develop --release

      - name: Verify engine wheel loaded
        run: .venv/bin/python -c "from openra_train import OpenRAEnv, Command; print('engine OK')"

      # ── bench deps + tests ────────────────────────────────────────
      - name: Install bench dependencies (into the same venv as the wheel)
        run: |
          .venv/bin/pip install pytest
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -v
