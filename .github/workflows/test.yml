name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── openra_train engine wheel (sibling repo OpenRA-Rust) ─────
      # Without the wheel, 149+ engine-dependent tests skip at
      # collection (`pytest.importorskip("openra_train")`). Clone
      # the engine sibling, build the wheel via maturin, install it
      # into the same Python env, then verify importability before
      # pytest runs.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clone OpenRA-Rust (sibling repo for engine wheel)
        uses: actions/checkout@v4
        with:
          repository: yxc20089/OpenRA-Rust
          path: OpenRA-Rust
          ref: main

      # Note: vendor RA YAML used to be cloned here from upstream
      # OpenRA at `release-20231010` (engine PR #15 made it strict-
      # required). The follow-up refactor embedded the YAML directly
      # into the engine source tree at
      # `openra-data/src/embedded/{rules,weapons}/*.yaml`, so the
      # wheel is fully self-contained and no longer needs the upstream
      # checkout. See `OpenRA-Rust/VENDOR_DATA.md` for provenance.

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OpenRA-Rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('OpenRA-Rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # `maturin develop` requires a virtualenv. Create one explicitly
      # so the PyO3 wheel installs into the same env pytest will run in.
      # Earlier attempts: (1) `maturin develop` with system Python failed
      # (no venv); (2) `maturin build --out dist && pip install` packaged
      # only the Python stub, missing the .abi3.so native binding.
      - name: Create venv + install maturin
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin

      # Note: a previous CI step wrote `OpenRA-Rust/openra-train/pyproject.toml`
      # on-the-fly to pin maturin's PyO3 bindings (the crate gates all
      # PyO3 code behind a `python` feature). That file is now checked
      # into the engine repo, so the bindings pin happens at clone
      # time and no extra step is needed here.

      - name: Build + install openra_train wheel into venv
        working-directory: OpenRA-Rust/openra-train
        run: |
          source $GITHUB_WORKSPACE/.venv/bin/activate
          maturin develop --release

      - name: Verify engine wheel loaded
        run: .venv/bin/python -c "from openra_train import OpenRAEnv, Command; print('engine OK')"

      # ── bench deps + tests ────────────────────────────────────────
      - name: Install bench dependencies (into the same venv as the wheel)
        run: |
          .venv/bin/pip install pytest pytest-timeout pytest-xdist
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        # --timeout=120 per-test (was hanging the workflow at 20+ min with
        # no progress; engine-bound scripted-policy tests can be slow, but
        # any single test taking >2 min is a hang or a bad-design bug.)
        # -n auto for parallel execution across CPU cores.
        # --maxfail=20 to cap noise on a broken commit and surface the
        # first 20 failures without burning the whole 6h budget.
        # RA unit/weapon data is now embedded in the engine wheel
        # (see OpenRA-Rust/VENDOR_DATA.md), so no OPENRA_VENDOR_DIR
        # is needed.
        run: |
          .venv/bin/python -m pytest tests/ -v \
            --timeout=120 \
            -n auto \
            --maxfail=20 \
            --tb=short
