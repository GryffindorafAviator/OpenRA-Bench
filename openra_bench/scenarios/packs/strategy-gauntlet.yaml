meta:
  id: strategy-gauntlet
  title: 'The Gauntlet — Run a Defended Corridor to Destroy the Enemy Economy'
  capability: reasoning
  real_world_meaning: "Reach the objective through a defended corridor: sequence and time the run so the force survives to the target — planning under attrition, not motor control."
  robotics_analogue: 'Autonomous traversal of a hazardous corridor: plan a timed run that survives staged threats to reach the goal.'
  author: ported-from-training
base_map: singles-gauntlet
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  actors:
  # ---- agent: concentrated armored column entering from the WEST ----
  - {type: 2tnk, owner: agent, position: [8, 18], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [8, 18], offset: 2}}}
  - {type: 2tnk, owner: agent, position: [8, 20], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [8, 20], offset: 2}}}
  - {type: 2tnk, owner: agent, position: [8, 22], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [8, 22], offset: 2}}}
  - {type: 2tnk, owner: agent, position: [6, 19], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [6, 19], offset: 2}}}
  - {type: 2tnk, owner: agent, position: [6, 21], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [6, 21], offset: 2}}}
  - {type: 2tnk, owner: agent, position: [6, 23], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [6, 23], offset: 2}}}
  - {type: 1tnk, owner: agent, position: [10, 18], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [10, 18], offset: 2}}}
  - {type: 1tnk, owner: agent, position: [10, 20], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [10, 20], offset: 2}}}
  - {type: 1tnk, owner: agent, position: [10, 22], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [10, 22], offset: 2}}}
  - {type: 1tnk, owner: agent, position: [10, 24], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [10, 24], offset: 2}}}
  - {type: jeep, owner: agent, position: [4, 17], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [4, 17], offset: 2}}}
  - {type: jeep, owner: agent, position: [4, 25], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [4, 25], offset: 2}}}
  - {type: medi, owner: agent, position: [6, 17], stance: 0, health: 100, facing: -1, count: 1}
  - {type: medi, owner: agent, position: [6, 25], stance: 0, health: 100, facing: -1, count: 1}
  - {type: 2tnk, owner: agent, position: [12, 19], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [12, 19], offset: 2}}}
  - {type: 2tnk, owner: agent, position: [12, 21], stance: 0, health: 100, facing: -1, count: 1, randomize: {position: {base: [12, 21], offset: 2}}}
  # ---- bait infantry near agent: lures "kill nearest unit" off-axis ----
  - {type: e1, owner: enemy, position: [22, 10], stance: 2, health: 100, facing: -1, count: 3}
  - {type: e1, owner: enemy, position: [22, 32], stance: 2, health: 100, facing: -1, count: 3}
  # ---- forward picket (mid-corridor gate) ----
  - {type: gun, owner: enemy, position: [38, 20], stance: 3, health: 100, facing: -1, count: 1}
  - {type: e3, owner: enemy, position: [40, 18], stance: 2, health: 100, facing: -1, count: 2}
  - {type: e3, owner: enemy, position: [40, 22], stance: 2, health: 100, facing: -1, count: 2}
  # ---- base ring (lighter than the gate) ----
  - {type: e3, owner: enemy, position: [60, 22], stance: 2, health: 100, facing: -1, count: 2}
  # ---- enemy economy (key buildings + flavor) ----
  - {type: harv, owner: enemy, position: [72, 8], stance: 0, health: 100, facing: -1, count: 1}
  - {type: harv, owner: enemy, position: [76, 10], stance: 0, health: 100, facing: -1, count: 1}
  - {type: fact, owner: enemy, position: [64, 20], stance: 3, health: 100, facing: -1, count: 1}
  - {type: powr, owner: enemy, position: [66, 23], stance: 3, health: 100, facing: -1, count: 1}
  - {type: barr, owner: enemy, position: [66, 17], stance: 3, health: 100, facing: -1, count: 1}
  - {type: proc, owner: enemy, position: [62, 18], stance: 3, health: 100, facing: -1, count: 1}
  tools:
  - move_units
  - attack_unit
  - attack_move
  - stop_units
  planning: true
  termination:
    max_ticks: 9000
    agent_units_killed: true
    enemy_units_killed: true
levels:
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # The Gauntlet — run the single defended corridor and destroy the
    # enemy's key economic buildings (construction yard + refinery). A
    # forward picket screens a base ring; a careless all-in charge is
    # ground down before reaching fact+proc, and chasing every stray
    # infantryman bleeds the column dry. Sequence the run: clear the gate,
    # then drive the surviving force onto the economy with a sustainable
    # attrition.
    description: >
      Enemy includes 6 rifle infantry, turrets, 6 rocket soldiers. Destroy the
      enemy construction yard, refinery. Lose at most 12. Within about 89
      turns.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - within_ticks: 8000
      - units_lost_lte: 12
    fail_condition:
      any_of:
      - after_ticks: 8001
      - not: {own_units_gte: 1}
      - not: {units_lost_lte: 12}
    max_turns: 90
  medium:
    description: >
      Enemy includes 6 rifle infantry, turrets, 6 rocket soldiers. Destroy the
      enemy construction yard, refinery. Lose at most 9. Within about 89
      turns.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - within_ticks: 8000
      - units_lost_lte: 9
    fail_condition:
      any_of:
      - after_ticks: 8001
      - not: {own_units_gte: 1}
      - not: {units_lost_lte: 9}
    max_turns: 90
  hard:
    description: >
      Same single corridor, same fact+proc objective, same attrition
      cap as medium; the new axis is a tight clock — the gauntlet must
      be cleared and the economy levelled fast, not at leisure.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - within_ticks: 4500
      - units_lost_lte: 9
    fail_condition:
      any_of:
      - after_ticks: 4501
      - not: {own_units_gte: 1}
      - not: {units_lost_lte: 9}
    max_turns: 55
