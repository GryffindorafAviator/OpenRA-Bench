meta:
  id: strict-production-bom
  title: 'Exact Build Order — Produce the Precise Bill of Materials Under Budget'
  capability: action
  real_world_meaning: >
    Produce an EXACT bill of materials under a hard budget: build only
    the tech-tree prerequisites needed, in the right order, and produce
    exactly the specified units — no more, no less. Overproducing one
    type, or erecting an unnecessary structure, exhausts the budget and
    fails the spec. The objective is instruction/spec fidelity itself,
    not combat — the OpenRA analogue of strict tool/function-calling
    benchmarks (BFCL / τ²-bench): do exactly and only what was asked.
  robotics_analogue: >
    Manufacturing-cell order fulfilment under a resource cap: satisfy a
    precise parts list respecting assembly prerequisites without
    over-building or wasting stock.
  author: openra-bench
base_map: rush-hour-arena
starting_cash: 3000
base:
  agent:
    faction: soviet
  enemy:
    faction: allies
  tools:
    - build
    - place_building
    - deploy
    - stop
  planning: true
  termination:
    max_ticks: 40000
  actors:
    - type: fact
      owner: agent
      position: [10, 18]
    - type: powr
      owner: agent
      position: [14, 18]
    - type: e1
      owner: enemy
      position: [110, 34]
      stance: 2
levels:
  easy:
    description: >
      Spec: exactly 3 e1 rifle infantry — requires building a barracks
      first (tech prerequisite). Budget covers the barracks + exactly 3
      e1; a 4th e1 or any extra structure breaks the spec.
    starting_cash: 2200
    win_condition:
      all_of:
        - unit_type_count_eq: {type: e1, n: 3}
        - within_ticks: 20000
    fail_condition:
      unit_type_count_gte: {type: e1, n: 4}   # overproduction = violation
    max_turns: 70
  medium:
    description: >
      Spec: exactly 3 e1 + 2 e3 (rocket). e3 shares the barracks tech
      but costs more — the budget forces correct allocation, no waste.
    starting_cash: 3000
    win_condition:
      all_of:
        - unit_type_count_eq: {type: e1, n: 3}
        - unit_type_count_eq: {type: e3, n: 2}
        - within_ticks: 18000
    fail_condition:
      any_of:
        - unit_type_count_gte: {type: e1, n: 4}
        - unit_type_count_gte: {type: e3, n: 3}
    max_turns: 80
  hard:
    description: >
      Spec: exactly 3 e1 + 2 e3 + 1 tesla coil (tsla). tsla adds a
      deeper tech path (power-dependent) and a tight budget — any
      overproduction or unnecessary building exhausts cash and fails.
    starting_cash: 4200
    win_condition:
      all_of:
        - unit_type_count_eq: {type: e1, n: 3}
        - unit_type_count_eq: {type: e3, n: 2}
        - building_count_gte: {type: tsla, n: 1}
        - within_ticks: 16000
    fail_condition:
      any_of:
        - unit_type_count_gte: {type: e1, n: 4}
        - unit_type_count_gte: {type: e3, n: 3}
        - building_count_gte: {type: tsla, n: 2}
    max_turns: 90
