# Validate: python -m openra_bench.scenarios.validate \
#   openra_bench/scenarios/packs/perception-count-the-threat.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# PERCEPTION focus, EXACT-COUNT variant: the win is set to the actual
# hidden enemy count K. The model must scout enough to see all K — no
# more, no less — within a tight clock. Under-scouting fails the
# enemies_discovered_gte bar; over-scouting (sweeping the whole map)
# blows the clock or the units_lost_lte cap because reaching the
# trailing decoys costs ticks/casualties. The model has to REASON
# about WHERE the K-th enemy could be hiding from the partial scout
# so far, not just expand fog area-greedily.

meta:
  id: perception-count-the-threat-small-k
  title: 'Count the Threat (small-K) — Discover Exactly K Hidden Enemy Squads'
  capability: perception
  real_world_meaning: >
    State-estimation under partial observability with a precise count
    target: identify the exact number of hidden entities by inferring
    where the remaining ones must be, given what has already been
    cleared, before the clock runs out and without burning the force
    on irrelevant ground.
  robotics_analogue: >
    Sensor-budgeted search for a known target count: locate all K
    survivors / contraband / contacts in a bounded area, where missing
    one fails the mission and over-searching exhausts the energy
    budget on already-cleared zones.
  benchmark_anchor:
    - "ERQA state-estimation under partial observability"
    - "POMDP exact-count sub-tasks"
    - "ScienceWorld inventory before-commit"
    - "ICU triage exact census"
  author: yiyu-tian
  # Companion to `perception-count-the-threat` (Wave 1 A7): both test
  # the same cell (exact-K perception) but along different stress axes.
  # A7 uses K=5 fixed medium / K seed-varied 4..7 hard with 2 spawn
  # groups (count discrimination + spawn robustness). This pack uses
  # K=2/3/4 with psychologically non-obvious hidden positions (the
  # "where could the K-th be hiding?" inference axis).

base_map: rush-hour-arena

base:
  agent: {faction: allies}
  enemy: {faction: soviet}
  tools: [move_units, attack_unit, stop_units]
  planning: true
  termination: {max_ticks: 12000}
  # The scout column is stance:0 (HoldFire). After the engine
  # stance-semantics fix, the default stance:3 (AttackAnything)
  # actively HUNTS — a stance:3 unit with no enemy in range advances
  # toward the nearest enemy on its own. Left at the default, the
  # scout column self-delivers across the map and discovers every
  # hidden squad WITHOUT a single agent order, collapsing the
  # perception task: a do-nothing stall would WIN for free. stance:0
  # pins the column at spawn so discovery requires deliberate
  # `move_units` scouting and a stall genuinely fails the
  # enemies_discovered_gte bar.
  actors:
    - {type: jeep, owner: agent, position: [6, 5], count: 3, stance: 0}
    - {type: 1tnk, owner: agent, position: [8, 8], count: 2, stance: 0}

levels:
  # Tick budgets aligned to 93 + 90·(max_turns - 1) so the timeout
  # fail actually fires within the run loop (eval_core.run_level
  # iterates max_turns, not termination.max_ticks — without this
  # alignment the after_ticks clause is unreachable and unmet wins
  # exit as draw, not loss; see CLAUDE.md).
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Exactly 2 enemy squads hidden in fog: one in the mid-corridor (near-
    # east) and one in the far-east. Find BOTH within 2200 ticks losing
    # <=1 unit. The two squads sit on different latitudes, so a single
    # straight sweep down one lane finds at most one — split the scout
    # column to cover both. Missing a squad, over-scouting past the clock,
    # or losing too many = loss.
    description: >
      Two enemy squads hide in fog — one in the mid-corridor near-east,
      one in the far-east — on different latitudes. A single straight
      sweep finds at most one; split the scout column to cover both.
      Discover both, at most one loss, within about 25 turns.
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [6, 5], count: 3, stance: 0}
        - {type: 1tnk, owner: agent, position: [8, 8], count: 2, stance: 0}
        # Two distinct enemy squads, deliberately count K=2. Each
        # squad is ONE actor (count:1) so `enemies_discovered_gte`
        # counts CLUSTERS, not bodies — discovering one squad is
        # worth exactly 1 toward K. (A count:2 squad would make the
        # K=2 win satisfiable by finding a SINGLE cluster.)
        - {type: e1, owner: enemy, position: [55, 15], stance: 2, count: 1}
        - {type: e3, owner: enemy, position: [105, 18], stance: 2, count: 1}
    win_condition:
      all_of:
        - enemies_discovered_gte: 2
        - within_ticks: 2200
        - units_lost_lte: 1
    fail_condition:
      any_of:
        - after_ticks: 2201
        - not: {own_units_gte: 1}
        - not: {units_lost_lte: 1}
    max_turns: 26   # ceiling 93 + 90·25 = 2343 > 2201 ✓

  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Exactly 3 enemy squads scattered in three different directions
    # (north-east, south-east, and a non-obvious mid-north pocket). Find
    # all 3 within 2800 ticks losing <=2. A naive east-only sweep finds 2
    # of 3 and runs out the clock searching the wrong half of the map; the
    # model must read where the remaining unexplored mass is after each
    # contact and commit there.
    description: >
      Three enemy squads hide in three different directions: NE, SE, and a
      non-obvious mid-north pocket. A naive east-only sweep finds only two
      before the clock runs out. Read where the unexplored mass is after
      each contact, then commit there. Discover three, two losses max,
      within about 32 turns.
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [6, 5], count: 3, stance: 0}
        - {type: 1tnk, owner: agent, position: [8, 8], count: 2, stance: 0}
        # Each squad is ONE actor (count:1) so enemies_discovered_gte
        # counts CLUSTERS toward K=3 — a 2-of-3 sweep gets only 2 < 3
        # and loses. The mid-N `dog` pocket is stance:0 (HoldFire):
        # after the engine stance-semantics fix, a stance:2 dog
        # actively chases a passing scout and runs it down off-route;
        # stance:0 makes it a passive perception target so the
        # intended careful split-scout can reveal it without the
        # chase, while a single-axis sweep still misses the pocket.
        - {type: e1, owner: enemy, position: [105, 8], stance: 2, count: 1}    # NE
        - {type: e3, owner: enemy, position: [105, 32], stance: 2, count: 1}   # SE
        - {type: dog, owner: enemy, position: [55, 4], stance: 0, count: 1}    # mid-N
    win_condition:
      all_of:
        - enemies_discovered_gte: 3
        - within_ticks: 2800
        - units_lost_lte: 2
    fail_condition:
      any_of:
        - after_ticks: 2801
        - not: {own_units_gte: 1}
    max_turns: 32   # ceiling 2883 > 2801 ✓

  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Exactly 4 enemy squads. Two are "obvious" (along the natural east-
    # bound axes the spawn pushes toward), one is in the far-NW strip
    # behind the spawn, and one is in a tight south-of-mid pocket. Loss
    # cap is 2, clock is 3500. A best-effort sweep finds 2–3; only
    # inferring from which fog masses remain after each contact identifies
    # all 4 in time. Over-scouting (visiting every remaining fog cell)
    # blows the clock.
    description: >
      Four enemy squads: two obvious on the east-bound axes, one behind
      the spawn in the far-NW strip, one tucked in a tight south-of-mid
      pocket. Best-effort sweeps find two or three; only inferring from
      remaining fog mass gets all four. Two losses max, within about 39
      turns.
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [6, 5], count: 3, stance: 0}
        - {type: 1tnk, owner: agent, position: [8, 8], count: 2, stance: 0}
        # Each squad is ONE actor (count:1) so enemies_discovered_gte
        # counts CLUSTERS toward K=4 — a best-effort sweep finds only
        # 2-3 and loses. The far-NW `dog` is stance:0 (HoldFire) — a
        # passive pocket the engine stance-fix would otherwise turn
        # into a chaser; the armed e1/e3/e2 squads stay stance:2 so a
        # charge-through still bleeds attrition.
        - {type: e1, owner: enemy, position: [105, 8], stance: 2, count: 1}
        - {type: e3, owner: enemy, position: [105, 32], stance: 2, count: 1}
        - {type: dog, owner: enemy, position: [115, 4], stance: 0, count: 1}    # far-NW relative to push
        - {type: e2, owner: enemy, position: [60, 28], stance: 2, count: 1}     # south-of-mid pocket
    win_condition:
      all_of:
        - enemies_discovered_gte: 4
        - within_ticks: 3500
        - units_lost_lte: 2
    fail_condition:
      any_of:
        - after_ticks: 3501
        - not: {own_units_gte: 1}
    max_turns: 40   # ceiling 3603 > 3501 ✓
