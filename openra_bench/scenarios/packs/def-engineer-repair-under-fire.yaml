# def-engineer-repair-under-fire — engineer repair load-bearing on a
# damaged critical refinery (proc) under sustained grenadier pressure.
#
# v1.0-sweep audit (Qwen 9B run-3 / 2026-05-24): the prior version of
# this pack gated WIN on `building_count_gte: proc + fact + kill_bar`,
# which was satisfied by a trivial tank brawl in ~2 turns — the
# engineer/repair capability was NOT load-bearing. A "brute" policy
# that just built tanks and attacked WON without ever issuing `repair`.
#
# Fix (forced-repair predicate): the agent's proc is PRE-PLACED at
# `health: 40` (40% HP — engine parser honours this; see CLAUDE.md
# "health: on a pre-placed actor NOW WORKS" + openra-data
# test_actor_health.rs). The WIN predicate requires the proc to be
# HEALED back up to ≥75% HP at win-time via the new
# `building_hp_pct_gte` predicate. A scheduled `spawn_actors` wave
# (grenadiers) chips the damaged proc — without `repair` the proc
# falls inside the within_ticks window, busting the WIN clause AND
# triggering the `not building_count_gte:proc` fail clause.
#
# ACTION capability. Engineer (e6) is on the roster for narrative
# alignment (the SCV / engineer field-repair anchor), but the
# load-bearing engine verb is `Command.repair([building_id])` —
# autorepair toggle on the damaged proc.
#
# Bar (every level + every seed 1..4):
#   - stall (only observe): LOSS — proc HP stays at 40%, the
#     scheduled grenadier wave razes the proc, WIN clause fails AND
#     fail clause `not building_count_gte:proc` latches.
#   - brute (build tanks + attack, never repair): LOSS — even if the
#     attackers die, the damaged proc is never healed; the
#     `building_hp_pct_gte: {proc, pct: 0.75}` clause never latches
#     before the clock. With low starting_cash + no harv, the brute
#     also runs out of cash before clearing the wave.
#   - wrong-target (repair the healthy fact instead of the damaged
#     proc): LOSS — wrong building heals (already ~100%), the
#     damaged proc stays low and falls to the grenadier wave.
#   - INTENDED triage (commit defenders via attack_unit AND repair
#     the damaged proc): WIN — autorepair tops the proc up past
#     75% while committed defenders + pbox clear the grenadier wave.
#
# Anchor: disaster-recovery triage — SC2 SCV repair doctrine; SRE
# incident-response playbook ("repair the critical subsystem WHILE
# the on-call team contains the attacker"); military combat-engineer
# field-repair doctrine.
#
# ENGINE FACTS (CLAUDE.md):
# - `health: N` on a pre-placed actor is honoured (parser + Health
#   trait; pinned by test_actor_health.rs + test_actor_health_field.py).
# - Building actor ids surface in `own_buildings` so `Command.repair
#   ([real_id])` actually targets the building (pinned by
#   test_repair_building_id.py). Autorepair toggle climbs HP over
#   time, drains cash.
# - The new `building_hp_pct_gte: {type, pct}` predicate reads
#   `render_state["own_buildings"][i]["hp"]` (fraction 0..1) — the
#   load-bearing forced-repair gate. Added in the same commit as
#   this pack rewrite.
# - `termination.enemy_units_killed: false` — the win predicate is
#   keyed on PROC SURVIVAL + HP-restore, not enemy elimination; the
#   default auto-`done` on enemy wipe would race past the
#   HP-restore clause. Pinned by env_termination_flags.rs.
# - `scheduled_events.spawn_actors` — mid-episode reinforcement
#   wave (pinned by test_scheduled_events). The grenadier band
#   arrives at tick 400 to attrite the damaged proc; without a
#   committed defence AND active repair the proc dies inside the
#   within_ticks window.
# - `e2` (grenadier) has good anti-structure DPS; an unmolested band
#   of 3-4 grenadiers will drop the 40%-HP proc inside ~600 ticks.
# - Engine auto-fires opportunistically on move; an attack_unit
#   order on the hold-fire defenders DOES commit them.
# - `pbox` is now an active direct-fire tower (M60mg, anti-infantry
#   Damage 1000 × Burst 5). Used here as the killing arm against
#   the grenadier wave.

meta:
  id: def-engineer-repair-under-fire
  title: 'Engineer Repair Under Fire — Heal the Damaged Refinery While Engaging'
  capability: action
  real_world_meaning: >
    Your refinery (ore refinery) starts the engagement DAMAGED at
    40% HP, and a grenadier-led attrition wave is closing on it. You
    must toggle `repair` (autorepair) on the damaged refinery to heal
    it back up AND commit your hold-fire defenders to clear the
    attackers. Stalling lets the refinery die. Building tanks and
    brawling without repairing lets cumulative grenade damage finish
    the refinery off — the repair toggle is load-bearing, not just a
    nice-to-have.
  robotics_analogue: >
    Disaster-recovery / SRE triage: a sustained incident has already
    damaged the critical income-bearing subsystem and the operator
    must (a) engage the repair organ on the damaged subsystem WHILE
    (b) the on-call team contains the attacker. The repair workflow
    is the load-bearing intervention; without it the subsystem dies
    even if the attacker is eventually contained.
  benchmark_anchor:
    - "disaster recovery"
    - "SC2 SCV repair"
    - "repair-order triage"
    - "combat engineer field repair"
  author: openra-bench

base_map:
  generator: arena
  name: def-engineer-repair-under-fire-arena
  width: 64
  height: 48
starting_cash: 800

base:
  agent:
    faction: allies
    cash: 800
  enemy:
    faction: soviet
    cash: 0
    bot_type: rusher
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - set_stance
    - stop
    # The load-bearing tool: toggles autorepair on a building.
    - repair
  planning: true
  # Re-decide the instant an attacker comes into sight or a defender
  # falls — repair triage is reactive, not on fixed ticks.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination:
    max_ticks: 12000
    # The win predicate is keyed on PROC SURVIVAL + HP-restore. Do
    # NOT let the engine auto-`done` on enemy elimination — that
    # would race past the HP-restore clause and collapse a clean
    # defence-without-repair play to a non-LOSS.
    enemy_units_killed: false
  actors: []

levels:
  # ── EASY ── light attrition. Damaged proc at (10, 8); 3 e1
  # defenders (hold-fire) + pbox + 1 e6 engineer near it; fact
  # tucked safe at (28, 36). Initial wave: 2 grenadiers + 2 rifle
  # close from the north. Scheduled mid-wave at tick 400: +2
  # grenadiers from the north. Win: proc HP ≥ 75% AND proc alive
  # AND fact alive AND ≥3 attackers killed AND within_ticks 2700.
  easy:
    description: >
      Your refinery (ore refinery — `proc`) at the north of your base
      is already damaged to 40% HP — a previous skirmish chipped it
      down. A grenadier-led attrition wave is closing on it from the
      north, with a second wave arriving mid-engagement. Three rifle
      defenders stand next to the refinery on HOLD-FIRE orders (they
      will not engage on their own, even when shot at). An engineer
      (`e6`) is also nearby. Toggle REPAIR on the damaged refinery
      to heal it AND commit the defenders via attack_unit to kill
      the attackers. Win when the refinery is healed back up to at
      least 75% HP, the construction yard (`fact`) is still standing,
      and at least three attackers are down, within about 30 turns.
      If the refinery falls, the construction yard falls, or the
      refinery is still under 75% HP when the clock expires, you
      lose.
    overrides:
      actors:
        # DAMAGED PROC — the forced-repair anchor. health:40 ⇒
        # ~40% HP. Engineer must heal this past 75% to WIN.
        - {type: proc, owner: agent, position: [10, 8], health: 40}
        # Three rifle defenders on HOLD-FIRE (stance:0). attack_unit
        # commits them; the engine auto-fires en-route regardless of
        # the HoldFire idle stance (CLAUDE.md move_units note).
        - {type: e1, owner: agent, position: [12, 10], stance: 0, count: 3}
        # Engineer — narrative anchor (the SCV / combat-engineer
        # field-repair doctrine). Decorative for the engine repair
        # verb (Command.repair toggles autorepair regardless of
        # engineer adjacency), but on the roster so the briefing's
        # "engineer repair" framing has a real engineer.
        - {type: e6, owner: agent, position: [13, 10], stance: 0, count: 1}
        # Pbox — the killing arm against the grenadier wave (M60mg,
        # anti-infantry burst). Placed close enough to the proc that
        # the northern attackers come into its 4-cell range.
        - {type: pbox, owner: agent, position: [12, 12]}
        # Fact — loss-critical, tucked safely south-east, away from
        # the north attrition vector.
        - {type: fact, owner: agent, position: [28, 36]}
        # Initial north wave — 1 grenadier + 2 rifle. Light enough
        # that the pbox + committed defenders can clear it inside
        # the within_ticks window.
        - {type: e2, owner: enemy, position: [10, 4], stance: 3, count: 1}
        - {type: e1, owner: enemy, position: [12, 4], stance: 3, count: 2}
        # Unarmed enemy fact far east — historical anti-DRAW marker.
        # With `termination.enemy_units_killed: false` this is no
        # longer strictly required, but kept as belt-and-braces.
        - {type: fact, owner: enemy, position: [56, 20]}
      # Mid-engagement reinforcement wave: 2 more grenadiers arrive
      # at tick 400 from the north. Without autorepair AND committed
      # defence, this second wave razes the already-damaged proc.
      scheduled_events:
        - tick: 400
          type: spawn_actors
          actors:
            - {type: e2, owner: enemy, position: [10, 4], stance: 3, count: 2}
    win_condition:
      all_of:
        - building_count_gte: {type: proc, n: 1}
        - building_count_gte: {type: fact, n: 1}
        - building_hp_pct_gte: {type: proc, pct: 0.75}
        - units_killed_gte: 3
        - within_ticks: 2700
    fail_condition:
      any_of:
        - after_ticks: 2701
        - not: {building_count_gte: {type: proc, n: 1}}
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 50

  # ── MEDIUM ── heavier attrition + tighter HP bar. Same base
  # layout; initial wave is 2 grenadiers + 2 rifle; scheduled wave
  # at tick 400 is 3 grenadiers. Win HP bar tightened to ≥80%.
  medium:
    description: >
      Same base layout as the easy tier — damaged refinery (40% HP),
      hold-fire defenders + engineer + pbox near it, safe
      construction yard south-east. The grenadier-led attrition wave
      is heavier this time (two grenadiers plus two riflemen
      initially, three more grenadiers arriving mid-engagement).
      Toggle REPAIR on the damaged refinery and commit the defenders
      via attack_unit. Win: refinery still standing AND healed back
      to at least 80% HP, construction yard still standing, and at
      least five attackers killed, within about 30 turns. Loss:
      refinery falls, construction yard falls, or refinery is still
      under 80% HP when the clock expires.
    overrides:
      actors:
        - {type: proc, owner: agent, position: [10, 8], health: 40}
        - {type: e1, owner: agent, position: [12, 10], stance: 0, count: 3}
        - {type: e6, owner: agent, position: [13, 10], stance: 0, count: 1}
        - {type: pbox, owner: agent, position: [12, 12]}
        - {type: fact, owner: agent, position: [28, 36]}
        - {type: e2, owner: enemy, position: [10, 4], stance: 3, count: 2}
        - {type: e1, owner: enemy, position: [12, 4], stance: 3, count: 2}
        - {type: fact, owner: enemy, position: [56, 20]}
      scheduled_events:
        - tick: 400
          type: spawn_actors
          actors:
            - {type: e2, owner: enemy, position: [10, 4], stance: 3, count: 3}
    win_condition:
      all_of:
        - building_count_gte: {type: proc, n: 1}
        - building_count_gte: {type: fact, n: 1}
        - building_hp_pct_gte: {type: proc, pct: 0.80}
        - units_killed_gte: 5
        - within_ticks: 2700
    fail_condition:
      any_of:
        - after_ticks: 2701
        - not: {building_count_gte: {type: proc, n: 1}}
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 50

  # ── HARD ── +1 controlled variable: TWO spawn_point groups
  # round-robin the AGENT base latitude (NORTH y=8 / SOUTH y=32) per
  # seed; the matching attrition band fires at the on-latitude proc.
  # Both seed-tagged bases carry the same damaged-proc + defenders
  # layout. Win HP bar at ≥80%.
  hard:
    description: >
      Your base — damaged refinery (40% HP), hold-fire defenders +
      engineer + pbox, safe construction yard — spawns in either the
      NORTH or SOUTH latitude by seed. A grenadier-led attrition wave
      hits from the matching latitude, with reinforcements arriving
      mid-engagement. Toggle REPAIR on the damaged refinery and
      commit the defenders via attack_unit. Win: refinery and
      construction yard standing, refinery healed back to at least
      80% HP, at least five attackers killed, within about 30 turns.
      Loss: refinery falls, construction yard falls, or refinery is
      still under 80% HP when the clock expires.
    overrides:
      actors:
        # NORTH base group (spawn_point 0).
        - {type: proc, owner: agent, position: [10, 8],  health: 40, spawn_point: 0}
        - {type: e1,   owner: agent, position: [12, 10], stance: 0, count: 3, spawn_point: 0}
        - {type: e6,   owner: agent, position: [13, 10], stance: 0, count: 1, spawn_point: 0}
        - {type: pbox, owner: agent, position: [12, 12], spawn_point: 0}
        - {type: fact, owner: agent, position: [28, 36], spawn_point: 0}
        # SOUTH base group (spawn_point 1) — mirror across y=20.
        - {type: proc, owner: agent, position: [10, 32], health: 40, spawn_point: 1}
        - {type: e1,   owner: agent, position: [12, 30], stance: 0, count: 3, spawn_point: 1}
        - {type: e6,   owner: agent, position: [13, 30], stance: 0, count: 1, spawn_point: 1}
        - {type: pbox, owner: agent, position: [12, 28], spawn_point: 1}
        - {type: fact, owner: agent, position: [28,  4], spawn_point: 1}
        # Per-spawn-group attrition bands.
        - {type: e2, owner: enemy, position: [10, 4],  stance: 3, count: 2, spawn_point: 0}
        - {type: e1, owner: enemy, position: [12, 4],  stance: 3, count: 2, spawn_point: 0}
        - {type: e2, owner: enemy, position: [10, 36], stance: 3, count: 2, spawn_point: 1}
        - {type: e1, owner: enemy, position: [12, 36], stance: 3, count: 2, spawn_point: 1}
        # Anti-DRAW marker duplicated across both enemy spawn groups.
        - {type: fact, owner: enemy, position: [56, 20], spawn_point: 0}
        - {type: fact, owner: enemy, position: [56, 20], spawn_point: 1}
      scheduled_events:
        - tick: 400
          type: spawn_actors
          actors:
            - {type: e2, owner: enemy, position: [10, 4], stance: 3, count: 3}
            - {type: e2, owner: enemy, position: [10, 36], stance: 3, count: 3}
    win_condition:
      all_of:
        - building_count_gte: {type: proc, n: 1}
        - building_count_gte: {type: fact, n: 1}
        - building_hp_pct_gte: {type: proc, pct: 0.80}
        - units_killed_gte: 5
        - within_ticks: 2700
    fail_condition:
      any_of:
        - after_ticks: 2701
        - not: {building_count_gte: {type: proc, n: 1}}
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 50
