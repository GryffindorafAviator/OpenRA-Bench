  # seed. The counter-battery DOCTRINE generalises across either
  # latitude; a memorised "drive to (27,21)" plan strikes empty
  # ground on the off-latitude seed. Battery size and kill bar match
  # medium (3 arty, K=14); the controlled axis is the spawn flip.
