      ringed by three pillboxes. A strike force of six medium tanks
      (2tnk) is staged just west of the base. The enemy is a deep
      frontline screen of twenty-one rifle infantry (e1) with THREE
      long-range artillery pieces (arty, range 7c) posted in the
      rear — the artillery out-ranges your pillboxes and is shelling
      the construction yard. The heavier three-gun battery razes the
      yard faster than easy's two-gun battery. Counter-battery
      doctrine: drive the tanks past the infantry screen and destroy
      ALL THREE artillery pieces FIRST, then mop up the screen.
      Grinding the infantry screen while the artillery keeps firing
      loses the base. Win when 14 enemy units are destroyed AND the
      construction yard is still standing, before tick 2700.
    overrides:
      actors:
        # Strike force — 6 medium tanks staged west of the base.
        - {type: 2tnk, owner: agent, position: [10, 16], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 22], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 24], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 26], stance: 1}
        # Base defences — three pillboxes (range 5c, out-ranged by
        # the artillery's range 7c).
        - {type: pbox, owner: agent, position: [16, 19]}
        - {type: pbox, owner: agent, position: [16, 21]}
        - {type: pbox, owner: agent, position: [16, 23]}
        - {type: fact, owner: agent, position: [20, 21]}
        # Infantry screen — 21 rifle infantry (e1) in 3 columns
        # (x=23,25,27) × 7 rows (y=15..27), stance:0 (passive
        # picket line).
        - {type: e1, owner: enemy, position: [23, 15], stance: 0}
        - {type: e1, owner: enemy, position: [23, 17], stance: 0}
        - {type: e1, owner: enemy, position: [23, 19], stance: 0}
        - {type: e1, owner: enemy, position: [23, 21], stance: 0}
        - {type: e1, owner: enemy, position: [23, 23], stance: 0}
        - {type: e1, owner: enemy, position: [23, 25], stance: 0}
        - {type: e1, owner: enemy, position: [23, 27], stance: 0}
        - {type: e1, owner: enemy, position: [25, 15], stance: 0}
        - {type: e1, owner: enemy, position: [25, 17], stance: 0}
        - {type: e1, owner: enemy, position: [25, 19], stance: 0}
        - {type: e1, owner: enemy, position: [25, 21], stance: 0}
        - {type: e1, owner: enemy, position: [25, 23], stance: 0}
        - {type: e1, owner: enemy, position: [25, 25], stance: 0}
        - {type: e1, owner: enemy, position: [25, 27], stance: 0}
        - {type: e1, owner: enemy, position: [27, 15], stance: 0}
        - {type: e1, owner: enemy, position: [27, 17], stance: 0}
        - {type: e1, owner: enemy, position: [27, 19], stance: 0}
        - {type: e1, owner: enemy, position: [27, 21], stance: 0}
        - {type: e1, owner: enemy, position: [27, 23], stance: 0}
        - {type: e1, owner: enemy, position: [27, 25], stance: 0}
        - {type: e1, owner: enemy, position: [27, 27], stance: 0}
        # The battery — THREE artillery pieces in the rear (x=27,
        # inside range 7c of the fact). stance:2 (Defend).
        - {type: arty, owner: enemy, position: [27, 19], stance: 2}
        - {type: arty, owner: enemy, position: [27, 21], stance: 2}
        - {type: arty, owner: enemy, position: [27, 23], stance: 2}
        - {type: fact, owner: enemy, position: [120, 21]}
    win_condition:
      all_of:
        # Kill bar 14 — above the ~6 kills a screen-first policy
        # reaches before the (faster) three-gun battery razes the
        # fact; the counter-battery strike clears it after saving
        # the yard.
        - {units_killed_gte: 14}
        - {building_count_gte: {type: fact, n: 1}}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {own_units_gte: 1}}
    max_turns: 30

