# build-defensive-tower-cluster — Concentrate Defenses on the High-Value Building
#
# REASONING focus: CONCENTRATED-DEFENSE topology. A single high-value
# building (the agent fact) is the protected asset. A heavy rush band
# is FORCED through a single narrow corridor (the chokepoint between
# two open lobes), then converges on the agent's centroid — which IS
# the fact. The right doctrine is a TIGHT CLUSTER of pillboxes
# WRAPPING the fact (overlapping fields of fire on the single cell the
# fact sits on), NOT a thin line spread between the fact and the
# corridor — because the line dissipates its kill rate across the
# 4-cell corridor mouth and cannot mass enough fire on the rush band
# before the band reaches the unprotected fact.
#
# The win predicate makes the topology decision load-bearing — total
# pbox count alone is not enough; ≥3 of the pillboxes must sit INSIDE
# a radius-4 disc around the fact. A pbox-LINE policy (the obvious
# sibling: pboxes strung between the fact and the corridor mouth)
# satisfies the count but FAILS the region bar AND lets the
# concentrated rifle/rocket band overwhelm the thin frontage at the
# fact — line LOSES, intended cluster WINS.
#
# Sibling to `build-defensive-tower-line` (which rewards a long-frontage
# line across a wide threat-axis); on THIS pack the threat is FOCUSED
# on a single point (the agent fact) by the corridor geometry, so the
# doctrine inverts.
#
# MAP (per tier, materialised via `chokepoint-arena` generator):
#   • All tiers — 96×40, cordon=2, single pinch wall at x=43..52
#     (pinch_width=10) with a 4-cell corridor at y=18..21 (the only
#     passable cells between west and east lobes).
#   • West lobe (x∈[2,42]) — agent base. Fact sits at the WEST EDGE
#     (x=10) so the rush MUST traverse the corridor THEN the entire
#     west lobe to reach the fact; the cluster wrapping the fact has
#     time to assemble before the band arrives.
#   • East lobe (x∈[53,93]) — attackers spawn here; the rusher bot
#     charges the agent fact, so its A* path is forced through the
#     single y=18..21 corridor (water elsewhere along x=43..52).
#   • Hard tier flips the fact NORTH (y=14) / SOUTH (y=26) by seed;
#     the corridor stays at y=20 so the rush still has to traverse it
#     AND then turn north/south to reach the active fact — the
#     cluster centre must follow the fact.
#
# Real-world anchor:
#   • ERQA spatial-commit primitive — place a small, finite resource set
#     onto a *single point* of the environment under a region predicate;
#   • military strongpoint doctrine — defense-in-depth around a single
#     critical asset (the fortress keep, the SAM hub, the data-centre
#     hardened core), not a perimeter cordon thin everywhere;
#   • asset protection / critical infrastructure protection — concentrate
#     overlapping inspection / fires AT the protected asset, not a thin
#     uniform spread across all approaches.
#
# Discrimination (four-script bar — scripted, no model needed):
#   • stall (observe-only): spends nothing, the rush funnels through
#     the corridor and razes the fact — fact-alive fail clause fires
#     → LOSS (no draw degeneracy because `after_ticks` also fires as a
#     backstop).
#   • pbox-line (the "build-defensive-tower-line" solution — pboxes
#     strung along the y=18..21 attack lane far from the fact): meets
#     the count clause but FAILS the region clause (0 line-pboxes land
#     inside the radius-4 disc around the fact) AND the spread lets
#     the rusher band slip through gaps to reach the fact → LOSS.
#   • pure-army (only e1, no pbox): FAILS the count clause AND the
#     region clause; the rifle wall alone cannot stop the heavier
#     medium/hard waves either → LOSS.
#   • intended CLUSTER (3-4 pboxes wrapping the fact within radius 4):
#     overlapping pbox fire shreds the focused rush at the fact;
#     count + region + kill + fact-alive clauses all satisfied → WIN.
#
# Why the spec works (engine combat sheet, per CLAUDE.md):
#   • pbox = pillbox (anti-infantry base defence; cost 400cr; dps very
#     high vs rifle infantry; 1×1 footprint, easy to cluster). The
#     defense queue is SEPARATE from infantry so parallel queues are
#     allowed (CLAUDE.md).
#   • A radius-4 disc around the fact contains ~50 cells; plenty of
#     room for ≥3 pboxes after the fact's 2×2 footprint plus the
#     pre-placed tent/powr are subtracted.
#   • `building_count_gte:{fact,1}` (PRESENT-TENSE) is the fact-alive
#     check — `has_building` is a one-shot ever-seen set that stays true
#     after the fact is razed (documented CLAUDE.md footgun).
#   • `after_ticks: BUDGET+1` fail clause is reachable within max_turns
#     (no interrupts ⇒ exactly 90 ticks/step ⇒ max tick = 93+90·(N-1));
#     stallers hit it and LOSE rather than draw.
#   • A persistent unarmed enemy `fact` at the far east edge keeps the
#     episode alive past full rusher elimination so the win/fail
#     evaluator sees the terminal frame (no DRAW collapse on
#     enemy-wipe auto-done). On a 96-wide map it sits at (90, *) —
#     well within the playable rectangle.
#   • The `rusher` bot relentlessly charges the agent's centroid (the
#     agent fact) — that's WHY a cluster at the fact wins and a line
#     between the fact and the corridor doesn't: the rush focal point
#     is the fact itself, and the corridor funnels the band so a
#     cluster sees the WHOLE band sequentially.
#   • Cash is intentionally tight (exactly 4×600cr = 2400 for the four
#     pboxes). A model that wastes cash on extra units cannot complete
#     the pbox count.
#   • Hard tier adds a SECOND reinforcement wave via `scheduled_events`
#     at tick 2700 (~30 turns in); the wave is heavier and timed AFTER
#     the cluster has had time to assemble, so the bar discriminates:
#     a working cluster shreds the wave too; a pbox-line / pure-army
#     defence cannot survive both waves.

meta:
  id: build-defensive-tower-cluster
  title: 'Defense Topology — Cluster Pillboxes Around the High-Value Building'
  capability: reasoning
  real_world_meaning: >
    A single high-value building (the construction yard — your construction yard) is
    the protected asset, and a concentrated enemy band funnelled
    through a single narrow corridor charges directly at it. Right
    doctrine: a TIGHT CLUSTER of pillboxes WRAPPING the construction yard,
    overlapping fields of fire on the single point that matters. Wrong
    doctrine: a thin LINE of pillboxes strung between the construction yard and the
    corridor mouth — the line satisfies a naive "we built N defences"
    count but cannot stop a focused rush from reaching the construction yard,
    because the firepower is too dispersed to mass on the threat.
    The win predicate makes the topology decision load-bearing: total
    pillbox count alone is not enough; ≥3 of the pillboxes must sit INSIDE
    the radius-4 disc around the construction yard, AND the construction yard must survive.
  robotics_analogue: >
    Critical-asset protection / defense-in-depth: when ONE node is the
    irreplaceable principal (the fortress keep, the SAM hub, the data-centre hardened core, the ambassador's residence), the right
    architecture is dense overlapping enforcement AT that asset, not a
    thin uniform perimeter that is everywhere but never massed where
    the threat actually comes. The same logic that gives you a single
    hardened crypto module behind layered firewalls — concentrate
    coverage AT the asset, not a uniform spread.
  benchmark_anchor:
    - "ERQA"
    - "military strongpoint"
    - "asset protection"
    - "defense-in-depth around critical infrastructure"
  author: "openra-bench"

# Base map: per-tier override below. The default below is the
# chokepoint geometry every level inherits (the only mode this pack
# supports — see the topology rationale at the top of the file).
base_map:
  generator: chokepoint-arena
  name: build-defensive-tower-cluster-chokepoint-96x40
  width: 96
  height: 40
  cordon: 2
  pinch_x: 48
  pinch_width: 10
  corridor_width: 4
  corridor_y: 20
  title: Cluster Chokepoint 96x40

base:
  agent: {faction: allies}
  enemy: {faction: soviet, bot_type: rusher}
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  # No interrupts — defense topology is a STATIC up-front decision; the
  # threat axis is known a priori (the rusher always charges the agent
  # fact through the only passable corridor). Disabling interrupts also
  # makes the tick budget deterministic (exactly 90 ticks/step ⇒
  # max_turns is a hard tick budget that the `after_ticks` fail clause
  # reliably bites in).
  interrupts: {}
  termination:
    max_ticks: 12000
  actors: []   # every level supplies its own actor list via overrides.

levels:
  # ── EASY ── bare CONCENTRATED-DEFENSE skill: budget covers exactly
  # 4 pbox (2400cr). Win requires ≥3 of the 4 INSIDE the radius-4 disc
  # around the fact at (10,20). A line layout (pbox strung at x=20..35
  # along the corridor band y=18..21) lands 0 pbox inside the disc →
  # region clause fails AND the spread can't mass enough fire on the
  # corridor mouth to stop the band. Stall loses (clock OR fact razed);
  # pure-army loses (count + fact razed).
  # max_turns 60 ⇒ reachable tick 93+90·59 = 5403; deadline 5400.
  easy:
    description: >
      A rifle band funnels through the single narrow corridor (y=18..21
      through the wall at x=43..52) and charges your construction yard
      on the west. Budget $2400 — build four pillboxes with at least
      three sitting within four cells of the yard. Keep the yard alive,
      kill three enemies, within about 60 turns.
    starting_cash: 2400
    overrides:
      actors:
        # Pre-placed agent base in the WEST lobe. Fact at (10,20);
        # tent and powr WEST of the fact (behind it) so they aren't in
        # the rush line of fire and they leave plenty of cells inside
        # the radius-4 disc free for cluster pboxes.
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: tent, owner: agent, position: [6,  18]}
        - {type: powr, owner: agent, position: [6,  22]}
        # 3 pre-placed e1 defenders flanking the fact (the cluster's
        # job is the wall; these are the supporting fire so the LINE
        # / pure-army counterfactuals can still be discriminated). All
        # at stance:2 (return fire) so they don't wander.
        - {type: e1,   owner: agent, position: [12, 19], stance: 2}
        - {type: e1,   owner: agent, position: [12, 20], stance: 2}
        - {type: e1,   owner: agent, position: [12, 21], stance: 2}
        # Rusher band in the EAST lobe — forced through the y=18..21
        # corridor on the way to the agent fact at (10,20). 5× e1 is
        # enough to overwhelm a thin line / no-pbox defence; a cluster
        # of ≥3 pbox (dps very high vs infantry, overlapping fields of
        # fire) shreds it as it funnels out of the corridor mouth.
        - {type: e1, owner: enemy, position: [70, 20], stance: 3, count: 5}
        # Unarmed high-HP marker (anti-DRAW): keeps the episode alive
        # past full rusher elimination so the win/fail check fires.
        # Far east corner of the east lobe.
        - {type: fact, owner: enemy, position: [90, 20]}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 4}}
        - {building_in_region: {type: pbox, x: 10, y: 20, radius: 4, count: 3}}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_killed_gte: 3}
        - {within_ticks: 5401}
    fail_condition:
      any_of:
        - {after_ticks: 5402}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60

  # ── MEDIUM ── +1 axis: heavier rush (canonical 6×e1 + 2×e3 band)
  # AND tighter cash (2400cr — still exactly 4 pbox, NO slack for
  # extra units). The region bar stays at 3-of-4 at the fact. A
  # line layout (1 at fact, 3 along the lane) still meets the count
  # but FAILS the region (1 of 4 inside the disc, not the required 3)
  # AND the line cannot mass enough firepower to stop the heavier
  # band funnelled through the corridor. The intended cluster (3
  # pbox INSIDE the disc + 1 spare nearby, OR all 4 inside the disc)
  # survives. Kill bar raised to 5 to require the cluster to actually
  # fight, not just absorb.
  # max_turns 60 ⇒ reachable tick 5403; deadline 5400.
  medium:
    description: >
      Heavier rush — rifles plus rocket soldiers — funnels through the
      single narrow corridor and charges your construction yard.
      Budget $2400, build four pillboxes with at least three within
      four cells of the yard. Keep it alive, kill five, within about
      60 turns.
    starting_cash: 2400
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: tent, owner: agent, position: [6,  18]}
        - {type: powr, owner: agent, position: [6,  22]}
        # 4 pre-placed e1 defenders (one more than easy) — the supporting
        # fire layer; the cluster pboxes are still the load-bearing wall.
        - {type: e1,   owner: agent, position: [12, 19], stance: 2}
        - {type: e1,   owner: agent, position: [12, 20], stance: 2}
        - {type: e1,   owner: agent, position: [12, 21], stance: 2}
        - {type: e1,   owner: agent, position: [8,  20], stance: 2}
        # Canonical heavy rush: 6× e1 + 2× e3 in the east lobe at
        # y=20, forced through the y=18..21 corridor on the way to
        # the agent fact. A line / pure-army defence is overrun in
        # ~6-8 turns; the cluster (overlapping pbox dps) holds.
        - {type: e1, owner: enemy, position: [70, 20], stance: 3, count: 6}
        - {type: e3, owner: enemy, position: [72, 20], stance: 3, count: 2}
        # Anti-DRAW marker (east edge).
        - {type: fact, owner: enemy, position: [90, 20]}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 4}}
        - {building_in_region: {type: pbox, x: 10, y: 20, radius: 4, count: 3}}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_killed_gte: 5}
        - {within_ticks: 5401}
    fail_condition:
      any_of:
        - {after_ticks: 5402}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60

  # ── HARD ── +1 axis: TWO seed-driven agent spawn_point groups so the
  # fact (and therefore the cluster centre) FLIPS between NORTH y=14
  # and SOUTH y=26 per seed. The win predicate's `any_of` accepts a
  # cluster around EITHER candidate fact location — but a single
  # memorised "build pboxes at (10,20) area" plan does NOT work
  # because the fact never sits at y=20 on hard. The model has to
  # READ the fact's latitude from observation and place the cluster
  # relative to it. Enemies don't honour spawn_point (engine:
  # oramap.rs::expand_scenario_actors per CLAUDE.md), so the rusher
  # band is staged at the corridor latitude (y=20) — the only
  # passable cells through the wall — and converges on whichever fact
  # is present this seed by turning north or south after emerging
  # from the corridor mouth. Additionally a `scheduled_events`
  # reinforcement wave fires at tick 2700 (~30 turns), giving the
  # cluster time to assemble first; the wave overwhelms a line /
  # pure-army defence but a real cluster handles both waves.
  # max_turns 60 ⇒ reachable tick 5403; deadline 5400.
  hard:
    description: >
      Same corridor and same focused rush, but the yard sits in the
      NORTH or SOUTH west-edge slot by seed, and a reinforcement wave
      arrives mid-episode. Budget $2400, build four pillboxes with at
      least three within four cells of the current yard. Keep it
      alive, kill six, within about 60 turns.
    starting_cash: 2400
    overrides:
      actors:
        # spawn_point 0 — NORTH base. Fact at (10,14); tent/powr WEST
        # of fact; pre-placed defenders flanking the fact.
        - {type: fact, owner: agent, position: [10, 14], spawn_point: 0}
        - {type: tent, owner: agent, position: [6,  12], spawn_point: 0}
        - {type: powr, owner: agent, position: [6,  16], spawn_point: 0}
        - {type: e1,   owner: agent, position: [12, 13], stance: 2, spawn_point: 0}
        - {type: e1,   owner: agent, position: [12, 14], stance: 2, spawn_point: 0}
        - {type: e1,   owner: agent, position: [12, 15], stance: 2, spawn_point: 0}
        - {type: e1,   owner: agent, position: [8,  14], stance: 2, spawn_point: 0}
        # spawn_point 1 — SOUTH base (mirror across y=20).
        - {type: fact, owner: agent, position: [10, 26], spawn_point: 1}
        - {type: tent, owner: agent, position: [6,  24], spawn_point: 1}
        - {type: powr, owner: agent, position: [6,  28], spawn_point: 1}
        - {type: e1,   owner: agent, position: [12, 25], stance: 2, spawn_point: 1}
        - {type: e1,   owner: agent, position: [12, 26], stance: 2, spawn_point: 1}
        - {type: e1,   owner: agent, position: [12, 27], stance: 2, spawn_point: 1}
        - {type: e1,   owner: agent, position: [8,  26], stance: 2, spawn_point: 1}
        # Enemies don't honour spawn_point (CLAUDE.md). Stage the rush
        # band at the corridor latitude (y=20) — the only passable
        # cells through the wall — so it funnels through and then
        # turns N/S after emerging into the west lobe toward the
        # active fact. Heavier than medium: 5×e1 + 2×e3.
        - {type: e1, owner: enemy, position: [70, 20], stance: 3, count: 5}
        - {type: e3, owner: enemy, position: [72, 20], stance: 3, count: 2}
        # Anti-DRAW marker on the symmetry axis (east edge).
        - {type: fact, owner: enemy, position: [90, 20]}
      # Mid-episode reinforcement wave (after the cluster has time to
      # assemble) — a working cluster shreds both waves; a line /
      # pure-army defence cannot survive the combined pressure.
      scheduled_events:
        - tick: 2700
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [70, 20], stance: 3, count: 4}
            - {type: e3, owner: enemy, position: [72, 20], stance: 3, count: 1}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 4}}
        - any_of:
            - {building_in_region: {type: pbox, x: 10, y: 14, radius: 4, count: 3}}
            - {building_in_region: {type: pbox, x: 10, y: 26, radius: 4, count: 3}}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_killed_gte: 6}
        - {within_ticks: 5401}
    fail_condition:
      any_of:
        - {after_ticks: 5402}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60
