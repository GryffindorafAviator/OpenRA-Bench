meta:
  id: def-in-depth
  title: 'Defense in Depth — Two Layers, Not One Thick Wall'
  capability: reasoning
  real_world_meaning: >
    Defense-in-depth doctrine: against a massed concentrated rush, a
    front line plus a second line at greater depth shreds the attacker
    after the first layer falls, where a single fortified line — even
    one with the same brick count — eventually collapses under sustained
    pressure and razes the base behind it. Picking concentration vs
    distribution is the reasoning load: the same four pillboxes massed
    in one cluster lose, the same four pillboxes spread thin in one
    long line lose, and only a 2+2 layered topology survives.
  robotics_analogue: >
    Multi-layer security architecture (defense-in-depth): a single
    perimeter firewall, however thick, eventually gets breached; the
    same defensive capacity deployed as outer + inner layers (each
    covering the same arc) absorbs the breach. Same total resources,
    different topology, qualitatively different survivability. Also:
    medieval keep + outer-wall design (attackers must take BOTH);
    redundant systems architecture (one component failure ≠ system
    failure).
  benchmark_anchor:
    - 'military defense-in-depth doctrine'
    - 'security multi-layer architecture (defense-in-depth)'
    - 'medieval keep + outer wall design'
    - 'redundant systems architecture'
  author: openra-bench

# Bespoke 64×40 arena (F3 §25 map-shrink). Agent base on the west
# (fact at (8,20) + tent + powr); rush band injected mid-episode via
# scheduled_events on the same row as the base. The rush drives WEST
# on y=20 toward the fact, passing through both the FRONT (x=25) and
# REAR (x=15) pbox bands. Pre-shrink the pack used rush-hour-arena
# (128×40) with ~85 cells of empty east traversal — `large-trivial`
# per F3 audit. The shrunk arena cuts the pre-engagement march to
# ~15 cells (rush spawns at x=50, fact at x=8) so the topology
# decision is the load-bearing axis, not the wave's pathfinder
# warm-up time.
#
# Defense-in-depth geometry (medium/easy):
#   • FRONT region centred at (25,20), radius 4 → x in [21..29]:
#     2 pbox here form the OUTER layer that absorbs the first impact.
#   • REAR region centred at (15,20), radius 4 → x in [11..19]:
#     2 pbox here form the INNER layer that shreds the rushers that
#     break through the front.
#   • Radii intentionally tight (r=3) so the two regions DO NOT
#     overlap (FRONT x ≥ 21, REAR x ≤ 19; x=20 falls in neither). A single 4-pbox cluster
#     cannot satisfy both region predicates — the model has to
#     choose the layered topology, not a tall stack at one x.
#
# pbox kill bar (F3 §20): a built pbox is now an active direct-fire
# tower (M60mg, Range 4c0, Burst 5, Damage 1000 — one burst one-shots
# an e1). The win clause adds `units_killed_gte: N` so a built pbox
# must actually FIRE on the rush; a single-cluster topology placed
# OFF the rush axis would satisfy the count clause but contribute
# zero kills → LOSS.
#
# Failure topologies (every one is a real reachable LOSS):
#   • STALL: no buildings → rush reaches the fact → LOSS via
#     `not building_count_gte:fact`.
#   • SPREAD-THIN (4 pbox in one column at x=18-21): rear-region
#     count = 0 (x=20/21 are outside both bands) → LOSS.
#   • SINGLE-CLUSTER (4 pbox at x=15, no front layer): front-region
#     count = 0 → LOSS.
#   • SINGLE-LINE-AT-FRONT (4 pbox at x=25): rear-region count = 0
#     → LOSS.
#   • INTENDED 2+2 LAYERED: front + rear regions both satisfied;
#     pbox kills clear the bar; fact intact → WIN.
#
# Budget: 2400cr — exactly 4 pbox (4×400 = 1600) plus 8 e1 (8×100 =
# 800) headroom for replacement defenders, OR 4 pbox alone with 800cr
# slack. The win does NOT require trained units beyond the pre-placed
# 3 (the `not own_units_gte:1` fail clause is satisfied by them) —
# the discriminator is topology, not throughput.
base_map:
  generator: arena
  name: def-in-depth-arena
  width: 128
  height: 40
starting_cash: 2400

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
    bot_type: rusher
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  # Re-decide on rusher spotted at the lane mouth (the cue to commit
  # placement) and on own loss (a defender or a pbox just fell).
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination:
    max_ticks: 8000
  actors: []

levels:
  # ── EASY ── the bare defense-in-depth skill. Single rush wave (5 e1
  # + 1 e3) injected at tick 1500 (after the 2-pbox rear build chain
  # completes at ~tick 1000). The 2+2 layout (front=(25,20) and rear=(15,20),
  # each radius 3) is required.
  easy:
    description: >
      A massed rush of five rifles and one rocket soldier drives
      straight west at your Construction Yard. You inherit a front
      line of two pillboxes (stationary defensive turrets) sitting east
      of the yard, and $2400 — enough to build four more. Keep the yard
      alive and have the towers actually fire on something, within
      about 60 turns.
    overrides:
      base_map:
        generator: arena
        name: def-in-depth-easy-arena
        width: 64
        height: 40
        cordon: 2
        title: def-in-depth easy 64x40
      actors:
        - {type: fact, owner: agent, position: [8, 20]}
        - {type: tent, owner: agent, position: [5, 18]}
        - {type: powr, owner: agent, position: [5, 22]}
        # FRONT line pre-placed (2 pbox at x=25): the agent inherits a
        # front-line firewall. The capability test is whether the agent
        # recognises that a single-thick line will eventually fall and
        # *adds depth* (a REAR layer at x=15).
        - {type: pbox, owner: agent, position: [25, 19]}
        - {type: pbox, owner: agent, position: [25, 21]}
        # ONE rear defender — covers turn-1 unit presence without
        # interposing on the rush corridor.
        - {type: e1, owner: agent, position: [3, 20], stance: 2}
        # Unarmed high-HP enemy marker far east keeps the episode
        # alive past attacker annihilation (anti-DRAW per CLAUDE.md).
        - {type: fact, owner: enemy, position: [60, 20]}
      # Scheduled rush wave — injected at tick 1500, AFTER the 2-pbox
      # rear chain completes at ~tick 1000 (serial Defense queue:
      # ~12 sec per pbox × 30 ticks/sec ≈ 360 ticks, plus the second
      # pbox starts after the first completes). The band drives
      # straight west on y=20 into the layered fire arcs.
      scheduled_events:
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [50, 20], stance: 3, count: 5}
            - {type: e3, owner: enemy, position: [52, 20], stance: 3, count: 1}
    win_condition:
      all_of:
        - building_count_gte: {type: pbox, n: 4}
        - building_in_region: {x: 25, y: 20, radius: 4, type: pbox, count: 2}
        - building_in_region: {x: 15, y: 20, radius: 4, type: pbox, count: 2}
        - units_killed_gte: 3
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 5400
    fail_condition:
      any_of:
        - after_ticks: 5401
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 110

  # ── MEDIUM ── +1 controlled variable: tighter clock (within_ticks
  # 4500 instead of 5400). Same band, same layout, less slack — the
  # agent has to commit to the layered topology immediately.
  medium:
    description: >
      A massed rush of five rifles and one rocket soldier drives west
      at your Construction Yard. You inherit a two-pillbox front line
      east of the yard plus $2400. Keep the yard alive and have the
      pillbox line actually fire on the attackers, within about 50 turns.
    overrides:
      base_map:
        generator: arena
        name: def-in-depth-medium-arena
        width: 64
        height: 40
        cordon: 2
        title: def-in-depth medium 64x40
      actors:
        - {type: fact, owner: agent, position: [8, 20]}
        - {type: tent, owner: agent, position: [5, 18]}
        - {type: powr, owner: agent, position: [5, 22]}
        - {type: pbox, owner: agent, position: [25, 19]}
        - {type: pbox, owner: agent, position: [25, 21]}
        - {type: e1, owner: agent, position: [3, 20], stance: 2}
        - {type: fact, owner: enemy, position: [60, 20]}
      scheduled_events:
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [50, 20], stance: 3, count: 5}
            - {type: e3, owner: enemy, position: [52, 20], stance: 3, count: 1}
    win_condition:
      all_of:
        - building_count_gte: {type: pbox, n: 4}
        - building_in_region: {x: 25, y: 20, radius: 4, type: pbox, count: 2}
        - building_in_region: {x: 15, y: 20, radius: 4, type: pbox, count: 2}
        - units_killed_gte: 3
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 4500
    fail_condition:
      any_of:
        - after_ticks: 4501
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 110

  # ── HARD ── +1 controlled variable: TWO spawn_point groups so the
  # AGENT base round-robins between NORTH (y=14) and SOUTH (y=26)
  # latitudes by seed. The rush is staged at the matching latitude
  # via scheduled_events (no spawn_point on the enemy side — both
  # bands spawn but only the band on the agent's latitude reaches a
  # defended fact; on the off-latitude there is nothing to attack).
  # A memorised "place rear at y=20" layout fails because the fact
  # is never at y=20 on hard.
  hard:
    description: >
      Two staggered rush waves hit your Construction Yard mid-episode,
      one from each latitude (the base spawns NORTH at y=14 or SOUTH
      at y=26 by seed). You inherit a two-pillbox front line at your
      matched latitude plus $2400. Keep the yard alive and have the
      pillbox line fire on the attackers, within about 50 turns.
    overrides:
      base_map:
        generator: arena
        name: def-in-depth-hard-arena
        width: 64
        height: 40
        cordon: 2
        title: def-in-depth hard 64x40
      actors:
        # spawn_point 0 — NORTH base at y=14.
        - {type: fact, owner: agent, position: [8, 14], spawn_point: 0}
        - {type: tent, owner: agent, position: [5, 12], spawn_point: 0}
        - {type: powr, owner: agent, position: [5, 16], spawn_point: 0}
        - {type: pbox, owner: agent, position: [25, 13], spawn_point: 0}
        - {type: pbox, owner: agent, position: [25, 15], spawn_point: 0}
        - {type: e1, owner: agent, position: [3, 14], stance: 2, spawn_point: 0}
        # spawn_point 1 — SOUTH base at y=26.
        - {type: fact, owner: agent, position: [8, 26], spawn_point: 1}
        - {type: tent, owner: agent, position: [5, 24], spawn_point: 1}
        - {type: powr, owner: agent, position: [5, 28], spawn_point: 1}
        - {type: pbox, owner: agent, position: [25, 25], spawn_point: 1}
        - {type: pbox, owner: agent, position: [25, 27], spawn_point: 1}
        - {type: e1, owner: agent, position: [3, 26], stance: 2, spawn_point: 1}
        # Far enemy marker (anti-DRAW). Placed on the y=20 axis (off
        # both base latitudes) so neither rush band targets it.
        - {type: fact, owner: enemy, position: [60, 20]}
      # Rush wave staged at the matching latitude. Enemy actors don't
      # honour spawn_point (per-owner filter inactive when no enemy
      # actor declares spawn_point) so BOTH waves spawn every seed —
      # but rushers target the agent's centroid which IS at the
      # spawned latitude, so the off-latitude wave wanders without
      # finding agent units to engage.
      scheduled_events:
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [50, 14], stance: 3, count: 4}
            - {type: e3, owner: enemy, position: [52, 14], stance: 3, count: 1}
            - {type: e1, owner: enemy, position: [50, 26], stance: 3, count: 4}
            - {type: e3, owner: enemy, position: [52, 26], stance: 3, count: 1}
    # The agent inherits FRONT coverage at its spawned latitude.
    # The test is whether it ADDS DEPTH at the matching y by building
    # 2 REAR pbox. Either rear-region (north y=14 OR south y=26)
    # satisfies the layered bar — the model picks the rear y that
    # matches its own fact position.
    win_condition:
      all_of:
        - building_count_gte: {type: pbox, n: 4}
        - building_count_gte: {type: fact, n: 1}
        - units_killed_gte: 3
        - within_ticks: 4500
        - any_of:
          - all_of:
            - building_in_region: {x: 25, y: 14, radius: 4, type: pbox, count: 2}
            - building_in_region: {x: 15, y: 14, radius: 4, type: pbox, count: 2}
          - all_of:
            - building_in_region: {x: 25, y: 26, radius: 4, type: pbox, count: 2}
            - building_in_region: {x: 15, y: 26, radius: 4, type: pbox, count: 2}
    fail_condition:
      any_of:
        - after_ticks: 4501
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 110
