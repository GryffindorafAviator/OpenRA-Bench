meta:
  id: economy-time-box
  title: Spend Well Against the Clock — Allocate a Fixed Budget Before Time Runs Out
  capability: reasoning
  real_world_meaning: 'Time-bounded capital deployment: a fixed budget must be converted into deployed
    capability AND a standing economy before a hard tick deadline. Cash left unspent at the deadline is
    wasted; spending it all on units leaves no production economy; the decision is the spend schedule
    and the unit/structure mix, not any single build.

    '
  robotics_analogue: 'A field robot with a finite, non-replenishing energy budget that must both perform
    mission work and stand up persistent infrastructure before a deadline — scheduling expenditure so
    the objective is met without exhausting the budget prematurely.

    '
  author: autonomous-loop
  status: quarantine
  quarantine_reason: redundant with economy-force-buildup (= force-buildup + a 'keep a building standing'
    clause, same budget-under-clock decision); economy-investment kept for the distinct economy-vs-military
    allocation choice.
base_map: rush-hour-arena
starting_cash: 4000
