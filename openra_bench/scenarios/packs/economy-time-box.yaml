levels:
  easy:
    description: 'Generous budget and clock. Field a small force and keep an economy building standing:
      the only failure is leaving the budget idle or spending it down to nothing.

      '
    starting_cash: 4000
    win_condition:
      all_of:
      - own_units_gte: 4
      - building_total_gte: 4
      - within_ticks: 22000
    max_turns: 60
  medium:
    description: 'Tighter budget and clock: the spend must start promptly and the mix must cover both
      fielded units and a power-dependent structure within the deadline.

      '
    starting_cash: 2400
    win_condition:
      all_of:
      - own_units_gte: 5
      - has_building: tent
      - building_total_gte: 4
      - within_ticks: 16000
    max_turns: 70
  hard:
    description: 'Lean budget, short clock, attrition cap: every credit and tick must convert to fielded
      force plus a standing economy while losing nothing.

      '
    starting_cash: 1500
    win_condition:
      all_of:
      - own_units_gte: 6
      - building_total_gte: 5
      - units_lost_lte: 0
      - within_ticks: 12000
    max_turns: 80
