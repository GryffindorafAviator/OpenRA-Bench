# combat-skirmish-then-disengage — ONE coordinated strike-then-pull-back
# (Wave-6 combat-micro pack; complement to combat-harass-balanced-hit-
# and-run which is the CYCLIC pulsed variant).
#
# The capability under test is SKIRMISHER DOCTRINE: a single big
# engagement done well — drive forward, score the kills, then pull the
# force back to a recovery zone before being overwhelmed. Unlike
# combat-harass-balanced (a cycle of small pulses with zero attrition),
# this pack is ONE coordinated engagement: kills are easy to score; the
# DISCRIMINATING decision is whether the agent stops fighting and
# disengages before attrition mounts past the survival bar — and gets
# the force HOME (recovery region around the start) before the clock.
#
# 2026-05-23 audit (Family-1 #21): briefing rewritten per
# audits/EDIT_PRINCIPLES.md; map shrunk rush-hour-arena 128x40 →
# tailored arena 64x40 per tier so the cluster sits ~24 cells east
# of the staging point — a short pulse-and-pull cycle.
#
# POSTURE FIX (2026-05-23): enemy rifle infantry bumped from
# stance:0 HoldFire to stance:1 ReturnFire. Previously the cluster
# sat passive while the jeeps strafed them — no incoming damage to
# the raiders, so "disengage to preserve force" was meaningless (the
# attrition cap could never be met). ReturnFire means the enemy
# fires back the instant the jeeps engage: each strike now does
# cost the raiders a slow trickle of damage, and a commit-and-stay
# play eventually loses jeeps past the own_units_gte:3 floor. The
# load-bearing decision — pull back BEFORE losses build — has real
# teeth. ReturnFire (st1) is chosen over Defend (st2) because the
# enemy must NOT fire FIRST (that would give the kill bar to a
# stall policy via auto-return-fire on idle jeeps); the jeeps must
# initiate combat explicitly via attack_unit / attack_move.
#
# Real-world anchors:
#   - SC2 skirmisher tactics: a controlled "pull back to base" call
#     after scoring damage, vs the "commit until dead" anti-pattern.
#   - Military reconnaissance-by-fire / armoured cavalry doctrine:
#     probe, score, withdraw to friendly lines for re-supply.
#   - Fire-and-maneuver doctrine in the SINGLE-engagement frame
#     (the pulsed/cyclic frame is combat-harass-balanced-hit-and-run).
#
# Idiom (the four-policy bar — every level):
#   • stall (only observe)            → LOSS. Kill bar unmet (≥3 kills
#     required); the jeeps' stance:0 (HoldFire) keeps them from
#     accidentally returning fire even when the e1 cluster eventually
#     fires at them — they must drive east and explicitly attack.
#   • never-engage (park at start)    → LOSS. units_in_region clause
#     is satisfied (jeeps already at the recovery zone), but the kill
#     bar (units_killed_gte:3) is unmet → after_ticks LOSS.
#   • commit-until-overwhelmed (charge east, never retreat)
#                                     → LOSS. Kill bar IS met (the
#     enemy infantry trade poorly vs 4× jeep MG), but the jeeps end
#     the run at the enemy cluster (~x=28), NOT in the recovery
#     region around the start. units_in_region_gte:{x:4,y:..,r:6,n:3}
#     is unmet → after_ticks LOSS. With ReturnFire enemies the
#     attrition trickle also bites: on medium/hard the commit play
#     eventually drops below own_units_gte:3.
#   • intended skirmish-then-disengage (drive east, kill ≥3, then
#     move_units back to the start) → WIN. All three clauses met
#     inside the 4500-tick budget.
#
# Distinct from combat-harass-balanced-hit-and-run: the BALANCED pack
# enforces zero attrition across a multi-pulse cycle (the "no loss"
# bar), and the win is "kill workers without losing raiders". HERE the
# win is "finish the kills BEFORE you get overwhelmed AND get the force
# back HOME" — a positional/temporal recovery bar, not an attrition
# bar. units_in_region_gte is the load-bearing clause that makes
# disengage required.
#
# Engine notes (load-bearing for the bar):
#   - Jeeps start `stance: 0` (HoldFire). With stance:0 they do NOT
#     auto-return-fire on approaching enemies — sitting idle while
#     ReturnFire e1 close in DOES NOT score kills (kill bar unmet).
#     The only way to score is to explicitly `attack_unit` (or
#     `attack_move`), which makes the agent's strike decision
#     load-bearing.
#   - Enemy `e1` at the mid-x cluster are placed at y=19/y=21 cells
#     (verified-placement rows per CLAUDE.md — `e1` at some mid-x
#     cells silently fails to surface; (28,19)/(28,21) are confirmed
#     working at the new 64-wide map width).
#   - Persistent unarmed enemy `fact` at far east (x=60) prevents the
#     engine from auto-`done`ing on enemy unit wipe (which would
#     collapse the run to DRAW before the within_ticks + region
#     predicates evaluate cleanly on the terminal frame).

meta:
  id: combat-skirmish-then-disengage
  title: 'Combat Skirmish — Strike, Score the Kills, Pull Back to Recovery'
  capability: action
  real_world_meaning: >
    SKIRMISHER doctrine in the single-engagement frame: four fast
    raiders (jeeps) must drive east into a slow infantry cluster,
    score AT LEAST 3 kills, and then PULL BACK to the recovery zone
    around the western start before the clock expires AND while
    keeping at least 3 raiders alive. The skill under test is the
    decision to STOP FIGHTING and disengage — committing until the
    enemy is wiped or until the strike force is destroyed both LOSE
    (commit leaves the raiders at the kill site instead of the
    recovery zone; over-commit on hard loses raiders to the
    hunt-bot spawn waves). Distinct from the BALANCED pulsed
    harass-retreat cycle (combat-harass-balanced-hit-and-run, which
    is many small pulses with zero attrition): this pack is ONE big
    engagement done well, with a positional recovery bar.
  robotics_analogue: >
    Mission-with-egress: a mobile manipulator must complete a
    threshold of reward-bearing actions in a contested workspace,
    then return to a safe staging region before a time or attrition
    budget expires. Knowing WHEN to stop the productive sub-task
    and start the egress is the decision under test — a
    productivity-only policy (greedy accumulation) leaves the agent
    far from the staging region at deadline and fails the egress
    clause.
  benchmark_anchor:
    - "SC2 skirmisher tactics"
    - "military reconnaissance-by-fire"
    - "harass-and-disengage doctrine"
    - "armoured cavalry doctrine"
  author: openra-bench

base_map:
  generator: arena
  name: combat-skirmish-then-disengage-arena
  width: 128
  height: 40

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  termination: {max_ticks: 6500}
  actors: []

levels:
  # ── EASY ────────────────────────────────────────────────────────────
  # Bare skirmish-then-disengage skill: 4 jeeps (stance:0, no
  # auto-fire — kills require explicit attack_unit) vs 4× slow rifle
  # infantry (e1, stance:1 ReturnFire — they fire BACK once shot at
  # but never first). The strike force easily scores ≥3 kills under
  # attack_unit (4× jeep MG vs ReturnFire rifles), but each shot
  # bought from the cluster comes with a slow trickle of return
  # damage; the load-bearing decision is whether the agent then
  # ORDERS THE RETREAT back to the recovery zone instead of mopping
  # up the last enemy in place. stall / never-engage LOSE on the
  # kill bar; commit-until-wiped LOSES because the jeeps end at
  # x≈28 instead of the (4,20,r=6) recovery region.
  easy:
    description: >
      Commander, this is a skirmish-and-disengage raid. You are given
      4 jeeps at the western staging point at (4,20). An enemy
      cluster of 4 riflemen holds a knot around (28,20). The riflemen
      are on Return-Fire orders — they only shoot back when shot at,
      never first. Your jeeps start on hold-fire so they will not
      engage on their own; you must order them in. Drive east, gun
      down at least three riflemen, then pull every survivor back
      into the 6-cell recovery disc around (4,20). Three kills,
      three jeeps back home, within about 50 turns.
    overrides:
      base_map:
        generator: arena
        name: combat-skirmish-easy-arena
        width: 64
        height: 40
        cordon: 2
        spawns: [[4, 20]]
        title: 'Combat Skirmish — Easy 64x40'
      actors:
        # Strike force: 4 jeeps at the western staging point.
        # stance:0 (HoldFire) — no auto-return-fire, so kills require
        # an explicit attack_unit / attack_move order (the load-
        # bearing decision under test).
        - {type: jeep, owner: agent, position: [4, 19], stance: 0}
        - {type: jeep, owner: agent, position: [4, 20], stance: 0}
        - {type: jeep, owner: agent, position: [4, 21], stance: 0}
        - {type: jeep, owner: agent, position: [5, 20], stance: 0}
        # Enemy infantry cluster — 4× e1 spread across rows y=19/y=21
        # at x=27-29 (CLAUDE.md confirms y=19/y=21 mid-x cells place
        # reliably). stance:1 ReturnFire — they fire BACK when shot
        # at but never open fire first, so a never-engage agent
        # never gets free kills, while a striking agent does bleed
        # damage from each shot.
        - {type: e1, owner: enemy, position: [27, 19], stance: 1}
        - {type: e1, owner: enemy, position: [29, 19], stance: 1}
        - {type: e1, owner: enemy, position: [27, 21], stance: 1}
        - {type: e1, owner: enemy, position: [29, 21], stance: 1}
        # Persistent far-east enemy fact — prevents engine auto-done
        # on enemy wipe collapsing the run to DRAW before the
        # within_ticks + region predicates evaluate.
        - {type: fact, owner: enemy, position: [60, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {own_units_gte: 3}
        - {units_in_region_gte: {x: 4, y: 20, radius: 6, n: 3}}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 52

  # ── MEDIUM ──────────────────────────────────────────────────────────
  # +1 controlled variable: the enemy cluster grows to 6× e1 (vs 4 on
  # easy). The kill bar (≥3) is unchanged, so the strike is still
  # easily achievable — but the larger cluster means a commit-until-
  # wiped policy spends MORE turns mopping up (more enemies = more
  # rounds at the cluster), which leaves it even further from being
  # able to RETREAT before the within_ticks deadline. The discriminator
  # — "stop attacking after 3 kills and order the disengage" — is
  # sharper.
  medium:
    description: >
      Commander, this is a skirmish-and-disengage raid. You are given
      4 jeeps at the western staging point at (4,20). The enemy
      cluster is bigger here — 6 riflemen knotted around (28,20),
      all on Return-Fire orders (they shoot back when shot at, never
      first). Your jeeps start on hold-fire. The cluster bleeds you
      every round you fight it, and mopping up all six eats the
      clock and leaves you stranded forward. Drive east, gun down
      three riflemen, then pull every survivor back into the 6-cell
      recovery disc around (4,20), keeping three jeeps alive, within
      about 50 turns.
    overrides:
      base_map:
        generator: arena
        name: combat-skirmish-medium-arena
        width: 64
        height: 40
        cordon: 2
        spawns: [[4, 20]]
        title: 'Combat Skirmish — Medium 64x40'
      actors:
        - {type: jeep, owner: agent, position: [4, 19], stance: 0}
        - {type: jeep, owner: agent, position: [4, 20], stance: 0}
        - {type: jeep, owner: agent, position: [4, 21], stance: 0}
        - {type: jeep, owner: agent, position: [5, 20], stance: 0}
        # 6× e1 cluster around (28,20). ReturnFire so the strike
        # bleeds the jeeps slowly. Verified-placement rows
        # (y=19/y=21).
        - {type: e1, owner: enemy, position: [27, 19], stance: 1}
        - {type: e1, owner: enemy, position: [27, 21], stance: 1}
        - {type: e1, owner: enemy, position: [29, 19], stance: 1}
        - {type: e1, owner: enemy, position: [29, 21], stance: 1}
        - {type: e1, owner: enemy, position: [31, 19], stance: 1}
        - {type: e1, owner: enemy, position: [31, 21], stance: 1}
        - {type: fact, owner: enemy, position: [60, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {own_units_gte: 3}
        - {units_in_region_gte: {x: 4, y: 20, radius: 6, n: 3}}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 52

  # ── HARD ────────────────────────────────────────────────────────────
  # +2 controlled variables vs medium:
  #   1. bot_type: hunt — the e1 cluster actively PURSUES the jeeps
  #      (jeeps remain stance:0 so they only score on explicit
  #      attack orders; the hunt bot turns the engagement into a
  #      tightening window — a slow retreat or commit-and-stay loses
  #      jeeps past own_units_gte:3). Spec's "hunt-bot pursues".
  #   2. Two agent spawn_point groups (NORTH y=10 or SOUTH y=30)
  #      round-robined by seed; the recovery zone is `any_of` over the
  #      two spawn corners so the agent must return to ITS OWN start
  #      corner (no "always retreat to (4,20)" memorisation). Spec's
  #      "2 spawn groups".
  # Enemy actors do NOT honour spawn_point on the agent-side idiom
  # (CLAUDE.md), so the e1 cluster sits symmetrically at the
  # mid-latitude (y=20) — both spawn corridors face the same eastern
  # threat geometry. Hunt bot upgrades enemy stance to st3 and adds
  # OrderMove on the agent centroid, so ReturnFire vs Defend on the
  # YAML stance is moot (bot wins). Cluster stays at 6 (matching
  # medium); the hunt bot is the threat-axis upgrade.
  hard:
    description: >
      Commander, this is a skirmish-and-disengage raid on a hostile
      cluster. You are given 4 jeeps at either the north staging
      point (4,10) or the south (4,30) by seed. An enemy cluster of
      6 riflemen sits at (28,20) and is actively HUNTING — surviving
      riflemen advance on whichever of your jeeps is closest. Your
      jeeps start on hold-fire. Drive east, gun down three riflemen,
      then pull every survivor back into the 6-cell recovery disc
      around YOUR matching staging point — either (4,10) or (4,30).
      Three kills, three jeeps in your recovery disc, within about
      50 turns. A slow retreat lets the hunters catch you.
    overrides:
      base_map:
        generator: arena
        name: combat-skirmish-hard-arena
        width: 64
        height: 40
        cordon: 2
        spawns: [[4, 10], [4, 30]]
        title: 'Combat Skirmish — Hard 64x40 (NORTH/SOUTH)'
      actors:
        # spawn_point 0 — NORTH staging (y=10)
        - {type: jeep, owner: agent, position: [4,  9], stance: 0, spawn_point: 0}
        - {type: jeep, owner: agent, position: [4, 10], stance: 0, spawn_point: 0}
        - {type: jeep, owner: agent, position: [4, 11], stance: 0, spawn_point: 0}
        - {type: jeep, owner: agent, position: [5, 10], stance: 0, spawn_point: 0}
        # spawn_point 1 — SOUTH staging (y=30)
        - {type: jeep, owner: agent, position: [4, 29], stance: 0, spawn_point: 1}
        - {type: jeep, owner: agent, position: [4, 30], stance: 0, spawn_point: 1}
        - {type: jeep, owner: agent, position: [4, 31], stance: 0, spawn_point: 1}
        - {type: jeep, owner: agent, position: [5, 30], stance: 0, spawn_point: 1}
        # 6× e1 cluster at (28,20). Hunt bot gives them stance:3 on
        # init and issues Attack orders that drive them west toward
        # the jeeps; the infantry walk to contact takes ~6-8 turns.
        - {type: e1, owner: enemy, position: [27, 19], stance: 1}
        - {type: e1, owner: enemy, position: [27, 21], stance: 1}
        - {type: e1, owner: enemy, position: [29, 19], stance: 1}
        - {type: e1, owner: enemy, position: [29, 21], stance: 1}
        - {type: e1, owner: enemy, position: [31, 19], stance: 1}
        - {type: e1, owner: enemy, position: [31, 21], stance: 1}
        # Persistent far-east enemy fact.
        - {type: fact, owner: enemy, position: [60, 20]}
      enemy: {faction: soviet, cash: 0, bot_type: hunt}
    # Hard win: recovery zone is `any_of` over the two spawn corners
    # — the agent must return to ITS OWN start corner. (A wrong-corner
    # return is geometrically infeasible inside the tick budget, but
    # encoded for predicate clarity.)
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {own_units_gte: 3}
        - any_of:
            - {units_in_region_gte: {x: 4, y: 10, radius: 6, n: 3}}
            - {units_in_region_gte: {x: 4, y: 30, radius: 6, n: 3}}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 52
