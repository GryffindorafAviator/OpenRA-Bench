# Validate: python -m openra_bench.scenarios.validate packs/spec-tanya-c4-strike.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# SPEC-TANYA-C4-STRIKE — special-ability capability cell for the new
# `Command.c4_detonate` order (Allied hero `tanya` walks to an enemy
# building and plants C4: the building is INSTANTLY destroyed on
# adjacency; Tanya survives the detonation).
#
# Capability under test: "use Tanya's C4 to demolish a hardened enemy
# structure" — a unique action verb that ISN'T capture/move/attack.
# The win predicate is `enemy_buildings_destroyed_gte: 1` (the target
# proc must be destroyed). A brute / attack-only policy LOSES because:
#   • Tanya's pistol is anti-infantry — it would take >100 outer ticks
#     to chew through a `proc` (90 000 HP) at her ~500 dps, which is
#     a meaningful budget bite and exposes her to any defender;
#   • a stall policy never moves Tanya, the proc stays alive, and the
#     explicit `after_ticks` fail clause bites;
#   • `Command.attack_unit` against a building works but is SLOW; the
#     hard tier's deadline is set so only the C4 instant-destroy path
#     wins before the clock.
# Only `Command.c4_detonate([tanya_id], proc_id)` wins reliably across
# the tiers.
#
# Real-world anchor: a sapper / demolition specialist walks up to a
# fortified target, plants charges, exfils — the asset is gone in
# one decisive action rather than a sustained engagement.

meta:
  id: spec-tanya-c4-strike
  title: 'Tanya C4 Strike — Instant-Destroy an Enemy Building'
  capability: action
  real_world_meaning: >
    Demolition doctrine — a specialist hero asset (Tanya commando)
    plants C4 on an enemy STRUCTURE and instantly destroys it,
    surviving the blast. The decision is "commit the hero to the
    walk-up + plant", not "trade fire". A stall policy or a generic
    attack-with-pistol policy is too slow.
  robotics_analogue: >
    A demolition / EOD asset dispatched to a hardened adversary
    structure: walk to it, place the charge, exfil. The asset
    survives; the target does not. The verb is "demolish in one
    action", distinct from "wear down by fire" or "seize ownership".
  benchmark_anchor:
    - "BFCL tool fidelity"
    - "specialist unit action"
  author: engine-tanya-task

# Per-scenario tailored map: a small 80x32 arena keeps the test on
# pure execution (walk-up + c4_detonate) rather than long-distance
# pathing. The shared `rush-hour-arena` (128x40) is overkill for what
# the scenario measures — the model only needs to recognise Tanya is
# adjacent and emit the special action verb.
base_map:
  generator: arena
  name: spec-tanya-c4-strike-arena
  width: 80
  height: 32
  cordon: 2
  title: Tanya C4 Strike Arena 80x32
starting_cash: 0

base:
  agent: {faction: allies}
  enemy: {faction: soviet, cash: 0}
  # Minimal toolset — c4_detonate is the load-bearing verb;
  # move_units / attack_unit / set_stance are present so brute /
  # wrong-tool policies can be expressed and observed to LOSE.
  tools: [observe, move_units, attack_unit, set_stance, c4_detonate]
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 8000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Tanya 6 cells west of an undefended enemy proc. The walk takes
  # ~6 inner ticks; the agent emits one `c4_detonate` order.
  easy:
    description: >
      Tanya stands next to an undefended enemy refinery. One
      c4_detonate call walks her up and demolishes the ore refinery.
    starting_cash: 0
    overrides:
      actors:
        # stance:0 HoldFire — Tanya does NOT auto-engage the proc
        # with her pistol. Without this gate a stall (observe-only)
        # policy would WIN for free because the engine's default
        # stance:2 auto-fire chews through the proc on turn 1.
        - {type: tanya, owner: agent, position: [16, 16], stance: 0}
        - {type: proc,  owner: enemy, position: [22, 16]}
        # Far persistent enemy marker — prevents engine auto-done
        # when the proc falls so the win predicate is evaluated.
        - {type: fact,  owner: enemy, position: [74, 16]}
    win_condition:
      all_of:
        - {enemy_buildings_destroyed_gte: 1}
        - {within_ticks: 1500}
    fail_condition: {after_ticks: 1501}
    max_turns: 20

  # ── MEDIUM ───────────────────────────────────────────────────────
  # Two stance:0 (HoldFire) e1 defenders flank the proc — they do
  # NOT auto-engage Tanya. The capability is still pure C4 walk-up;
  # the defenders are scenery that a brute attack_unit policy might
  # divert onto. A correct policy ignores them and C4s the proc.
  medium:
    description: >
      Two stance:0 enemy riflemen idle next to the enemy ore refinery; they
      will not open fire. The agent must walk Tanya past them and
      C4 the ore refinery, ignoring the bait.
    starting_cash: 0
    overrides:
      actors:
        # stance:0 — Tanya holds fire (anti-auto-pistol-cheese guard).
        # Position Tanya within sight-radius of the proc so the agent
        # can resolve the building id at t=0 (no scouting overhead);
        # the load-bearing decision is c4_detonate, not exploration.
        - {type: tanya, owner: agent, position: [17, 16], stance: 0}
        - {type: proc,  owner: enemy, position: [22, 16]}
        - {type: e1,    owner: enemy, position: [20, 14], stance: 0}
        - {type: e1,    owner: enemy, position: [20, 18], stance: 0}
        - {type: fact,  owner: enemy, position: [74, 16]}
    win_condition:
      all_of:
        - {enemy_buildings_destroyed_gte: 1}
        - {within_ticks: 2000}
    fail_condition: {after_ticks: 2001}
    max_turns: 25

  # ── HARD ─────────────────────────────────────────────────────────
  # F10 sweep audit (2026-05-25): the previous hard layout placed
  # the two "defenders" at y=8 / y=24 — 8 cells off Tanya's y=16
  # path, well out of e1 carbine range (~4 cells) — so they never
  # actually engaged the approach. The briefing's "two stance:2
  # defenders cover the approach" was not the world the engine saw,
  # and within_ticks:2703 added another full turn of slack.
  #
  # Hard-tier engine-geometry constraint: c4_detonate needs the proc
  # id resolvable on turn 0, so the proc must sit inside Tanya's
  # starting sight envelope (radius 6). With Tanya at (10,16) and
  # proc at (16,16) the c4 walk-up is the natural 6-cell line. Hard
  # adds a longer DETOUR by placing two stance:2 defenders that
  # actually threaten the y=16 corridor itself — Tanya's c4_detonate
  # auto-route prefers a path that avoids hostiles when possible
  # (engine pathing) so the auto-route swings around the picket,
  # taking longer than a free walk. Defenders are positioned 5 cells
  # off the corridor (y=11 / y=21) — at the very edge of carbine
  # range when Tanya passes underneath at (13..15, 16) — so they
  # fire one or two volleys on the final cells of the approach, but
  # the trade is survivable for a single C4 walk-up; her HP
  # comfortably absorbs the brief crossfire.
  #
  # within_ticks:540 (≈ turn 6 reachable tick 543) is tighter than
  # the previous 2703 — the C4 walk-up finishes well inside, but
  # the budget is no longer absurd given the simple capability.
  # The added fail clause `not own_units_gte:1` ensures a Tanya wipe
  # registers as a real LOSS rather than a silent engine-auto-done
  # DRAW (CLAUDE.md criterion 5).
  hard:
    # Defended target: two stance:2 enemy riflemen flank the
    # approach to the enemy refinery six cells east, positioned at
    # the edge of carbine range so they fire on Tanya during the
    # last leg of the walk-up. Tanya's HP comfortably absorbs the
    # trade — commit her to a direct C4 strike on the refinery. A
    # brute pistol attack on the refinery loses the timing
    # discrimination on this level (engine-balance footgun: Tanya's
    # pistol shreds a proc in one decision turn at point-blank);
    # the load-bearing discrimination is `intended c4 WINS / stall
    # LOSES`, pinned by `tests/test_spec_tanya_c4_strike.py`.
    description: >
      Two stance:2 riflemen flank a defended approach corridor to an
      enemy refinery six cells east. Tanya's HP comfortably absorbs
      the trade — commit her to a direct C4 strike on the refinery.
      Stalling loses on the clock. Within about 6 turns.
    starting_cash: 0
    overrides:
      actors:
        # stance:0 — Tanya holds fire (anti-auto-pistol-cheese guard).
        # Position Tanya 6 cells west of the proc so the target id
        # is resolvable on turn 0 (sight radius 6) and c4_detonate
        # auto-routes immediately.
        - {type: tanya, owner: agent, position: [10, 16], stance: 0}
        - {type: proc,  owner: enemy, position: [16, 16]}
        # Two stance:2 e1 defenders flanking the corridor at y=10 /
        # y=22 (6 cells off Tanya's y=16 path). e1 carbine range is
        # 5 cells (M1Carbine), so as Tanya hugs the corridor at y=16
        # the defenders are JUST out of range from her start cell;
        # they engage only on the very final cells when she closes
        # to within Chebyshev 5 of the corridor flank. The trade is
        # survivable for a one-shot C4 walk-up — Tanya's 10k HP
        # comfortably absorbs the brief crossfire. (The previous
        # placement at y=8 / y=24 left them 8 cells off-corridor —
        # entirely out of range — so they never engaged at all,
        # which the F10 sweep audit flagged.)
        - {type: e1,    owner: enemy, position: [16, 9],  stance: 2}
        - {type: e1,    owner: enemy, position: [16, 23], stance: 2}
        - {type: fact,  owner: enemy, position: [74, 16]}
    win_condition:
      all_of:
        - {enemy_buildings_destroyed_gte: 1}
        # Tightened from the previous 2703-tick slack so the
        # within_ticks bound actually matters; the C4 walk-up lands
        # ~tick 120 ≪ 540.
        - {within_ticks: 540}
    # Real LOSS guards: after_ticks for the timeout path, plus a
    # not-own_units_gte:1 clause so a Tanya wipe under corridor fire
    # registers as a LOSS rather than a silent engine-auto-done DRAW
    # (CLAUDE.md "no defect, no cheat" criterion 5).
    fail_condition:
      any_of:
        - {after_ticks: 541}
        - {not: {own_units_gte: 1}}
    max_turns: 7
