# Validate: python -m openra_bench.scenarios.validate packs/spec-tanya-c4-strike.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# SPEC-TANYA-C4-STRIKE — special-ability capability cell for the
# `Command.c4_detonate` order (Allied hero `tanya` walks to an enemy
# building and plants C4: the building is INSTANTLY destroyed on
# adjacency; Tanya survives the detonation).
#
# Capability under test: "use Tanya's C4 to demolish a hardened enemy
# structure" — a unique action verb that ISN'T capture/move/attack.
# The win predicate is `enemy_buildings_destroyed_gte: 1` (the target
# proc must be destroyed) plus a `not own_units_gte:1` fail clause that
# requires Tanya to SURVIVE — the destruction credit is only granted
# when an agent unit is within sight of the building's last cell at the
# moment it disappears (see `rust_adapter.py::enemy_buildings_destroyed`).
#
# No-cheat bar — every cheat policy LOSES on every level / seed:
#   • STALL (observe-only) — proc never falls; `after_ticks` bites.
#   • ATTACK (brute pistol vs proc) — engine-balance footgun: Tanya's
#     Colt45 pistol IS strong enough to chew a 90 000-HP proc in one
#     decision turn at pistol range. The defeat lever is a "rear
#     ambush": three stance:2 e1 riflemen are placed WEST of Tanya's
#     start at the edge of carbine range. Under `attack_unit` Tanya
#     stands at her start cell to fire — exposed to sustained carbine
#     fire that kills her BEFORE the proc dies; even if the proc
#     timing race were close, the `not own_units_gte:1` clause LOSES
#     the run because the destruction credit was never granted.
#   • WANDER (move east past the proc) — same, plus no kill.
#   • C4 (c4_detonate) — Tanya immediately walks EAST toward the proc,
#     OUT of the rear ambush's carbine range, plants C4 on adjacency
#     for an INSTANT destroy, and survives. Win clause satisfied,
#     fail clauses dormant.
# This makes the verb genuinely load-bearing: any policy that keeps
# Tanya stationary or routes her away from the proc burns through her
# HP under the rear ambush and forfeits the kill credit.
#
# Real-world anchor: a sapper / demolition specialist walks up to a
# fortified target, plants charges, exfils — the asset is gone in
# one decisive action rather than a sustained engagement.

meta:
  id: spec-tanya-c4-strike
  title: 'Tanya C4 Strike — Instant-Destroy an Enemy Building'
  capability: action
  real_world_meaning: >
    Demolition doctrine — a specialist hero asset (Tanya commando)
    plants C4 on an enemy STRUCTURE and instantly destroys it,
    surviving the blast. The decision is "commit the hero to the
    walk-up + plant", not "trade fire". A stall policy or a generic
    attack-with-pistol policy is too slow.
  robotics_analogue: >
    A demolition / EOD asset dispatched to a hardened adversary
    structure: walk to it, place the charge, exfil. The asset
    survives; the target does not. The verb is "demolish in one
    action", distinct from "wear down by fire" or "seize ownership".
  benchmark_anchor:
    - "BFCL tool fidelity"
    - "specialist unit action"
  author: engine-tanya-task

# Per-scenario tailored map: a small 80x32 arena keeps the test on
# pure execution (walk-up + c4_detonate) rather than long-distance
# pathing. The shared `rush-hour-arena` (128x40) is overkill for what
# the scenario measures — the model only needs to recognise Tanya is
# adjacent and emit the special action verb.
base_map:
  generator: arena
  name: spec-tanya-c4-strike-arena
  width: 80
  height: 32
  cordon: 2
  title: Tanya C4 Strike Arena 80x32
starting_cash: 0

base:
  agent: {faction: allies}
  enemy: {faction: soviet, cash: 0}
  # Minimal toolset — c4_detonate is the load-bearing verb;
  # move_units / attack_unit / set_stance are present so brute /
  # wrong-tool policies can be expressed and observed to LOSE.
  tools: [observe, move_units, attack_unit, set_stance, c4_detonate]
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 8000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Rear-ambush idiom (the load-bearing defence against the pistol-
  # cheese cheat). Tanya is 6 cells west of the enemy refinery with
  # three stance:2 e1 riflemen ~5 cells BEHIND her (west). A brute
  # `attack_unit` on the proc keeps Tanya stationary in pistol range
  # — exposed to sustained rear carbine fire that wipes her before
  # the 90 000 HP refinery falls; the `not own_units_gte:1` fail
  # clause then registers a clean LOSS. A correct `c4_detonate`
  # walks Tanya immediately EAST toward the refinery, OUT of the
  # rear ambush's range, and instant-destroys the building.
  easy:
    description: >
      Tanya stands six cells west of an enemy ore refinery with three
      enemy riflemen lurking five cells behind her. One c4_detonate
      call walks her east to the refinery and demolishes it; pistol-
      firing in place gets her killed from behind.
    starting_cash: 0
    overrides:
      actors:
        # stance:0 HoldFire — Tanya does NOT auto-engage the proc
        # with her pistol. Without this gate a stall (observe-only)
        # policy could WIN for free because the engine's default
        # stance:2 auto-fire chews through the proc on turn 1.
        - {type: tanya, owner: agent, position: [16, 16], stance: 0}
        - {type: proc,  owner: enemy, position: [22, 16]}
        # Rear ambush: 3x stance:2 e1 at distance ~5 west of Tanya.
        # Carbine range (M1Carbine, ~5 cells) lets them open fire
        # the instant Tanya stands still. Under c4_detonate Tanya
        # walks east and exits range within a few ticks; under
        # attack_unit / observe she stays in the kill zone and dies.
        - {type: e1,    owner: enemy, position: [11, 15], stance: 2}
        - {type: e1,    owner: enemy, position: [11, 16], stance: 2}
        - {type: e1,    owner: enemy, position: [11, 17], stance: 2}
        # Far persistent enemy marker — prevents engine auto-done
        # when the proc falls so the win predicate is evaluated.
        - {type: fact,  owner: enemy, position: [74, 16]}
    win_condition:
      all_of:
        - {enemy_buildings_destroyed_gte: 1}
        - {within_ticks: 1500}
    # Real LOSS guards: after_ticks for the timeout path, plus a
    # not-own_units_gte:1 clause so a Tanya wipe under rear fire
    # registers as a real LOSS rather than a silent engine-auto-done
    # DRAW (CLAUDE.md criterion 5). Required for the no-cheat bar:
    # without it, an attack_unit run where Tanya dies before the
    # proc destruction is credited would silently draw.
    fail_condition:
      any_of:
        - {after_ticks: 1501}
        - {not: {own_units_gte: 1}}
    max_turns: 20

  # ── MEDIUM ───────────────────────────────────────────────────────
  # Same rear-ambush idiom as easy, escalated to four e1's flanking
  # Tanya. Tanya starts one cell closer to the refinery; the c4 walk
  # is shorter (~5 cells) and still escapes the ambush quickly. A
  # brute pistol attack still loses because the ambush kills Tanya
  # before the proc falls and the not-own_units_gte:1 clause bites.
  medium:
    description: >
      Four stance:2 enemy riflemen lurk five cells behind Tanya, with
      an enemy ore refinery five cells ahead. Walk Tanya east and C4
      the refinery; standing in place to pistol the refinery gets her
      cut down from behind.
    starting_cash: 0
    overrides:
      actors:
        - {type: tanya, owner: agent, position: [17, 16], stance: 0}
        - {type: proc,  owner: enemy, position: [22, 16]}
        # Rear ambush: 4x stance:2 e1 at distance ~5 west of Tanya.
        # Heavier than easy; the c4 walk-up still clears the kill
        # zone in a handful of ticks, but attack_unit's stand-and-
        # fire stays exposed long enough to die.
        - {type: e1,    owner: enemy, position: [12, 14], stance: 2}
        - {type: e1,    owner: enemy, position: [12, 15], stance: 2}
        - {type: e1,    owner: enemy, position: [12, 17], stance: 2}
        - {type: e1,    owner: enemy, position: [12, 18], stance: 2}
        - {type: fact,  owner: enemy, position: [74, 16]}
    win_condition:
      all_of:
        - {enemy_buildings_destroyed_gte: 1}
        - {within_ticks: 2000}
    fail_condition:
      any_of:
        - {after_ticks: 2001}
        - {not: {own_units_gte: 1}}
    max_turns: 25

  # ── HARD ─────────────────────────────────────────────────────────
  # 2026-05-25 fix: the previous hard layout placed flank defenders
  # 6 cells off the y=16 corridor (out of carbine range) AND allowed
  # the brute pistol attack to one-shot the refinery from Tanya's
  # start cell — so attack_unit was winning in 1 turn (no-cheat bar
  # broken; see test_spec_tanya_c4_strike.py).
  #
  # The fix is the same rear-ambush idiom used on easy/medium,
  # escalated to four e1's around the corridor entry. Tanya starts
  # at (10,16) with the refinery at (16,16) — sight radius covers
  # the proc on turn 0. Four stance:2 e1's sit ~5 cells west at the
  # edge of carbine range, JUST able to fire on Tanya's start cell.
  # Under c4_detonate Tanya walks east; she crosses the kill zone
  # in 2-3 ticks, the C4Plant activity reaches adjacency and the
  # proc is instantly destroyed. Tanya survives — the
  # enemy_buildings_destroyed credit is granted, the win clause
  # fires before within_ticks:540.
  hard:
    description: >
      Four stance:2 enemy riflemen ambush from five cells behind
      Tanya; the enemy ore refinery is six cells east. Commit Tanya
      to an immediate C4 strike — pistol-firing in place gets her
      cut down from behind before the refinery falls. Within about
      6 turns.
    starting_cash: 0
    overrides:
      actors:
        - {type: tanya, owner: agent, position: [10, 16], stance: 0}
        - {type: proc,  owner: enemy, position: [16, 16]}
        # Rear ambush: 4x stance:2 e1 at distance ~5 west of Tanya.
        - {type: e1,    owner: enemy, position: [5, 14], stance: 2}
        - {type: e1,    owner: enemy, position: [5, 15], stance: 2}
        - {type: e1,    owner: enemy, position: [5, 17], stance: 2}
        - {type: e1,    owner: enemy, position: [5, 18], stance: 2}
        - {type: fact,  owner: enemy, position: [74, 16]}
    win_condition:
      all_of:
        - {enemy_buildings_destroyed_gte: 1}
        # within_ticks:540 (≈ turn 6 reachable tick 543) — the C4
        # walk-up lands ~tick 30 ≪ 540 so the budget is comfortable,
        # but tight enough to forbid long detours.
        - {within_ticks: 540}
    fail_condition:
      any_of:
        - {after_ticks: 541}
        - {not: {own_units_gte: 1}}
    max_turns: 7
