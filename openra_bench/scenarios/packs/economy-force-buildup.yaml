meta:
  id: economy-force-buildup
  title: 'Force Buildup — Spend a Limited Budget to Field the Strongest Army'
  capability: reasoning
  real_world_meaning: >
    Resource allocation under a hard budget and deadline: given finite
    funds and a production facility, decide how much to spend and when
    to commit, so a sufficient force is fielded before time runs out.
    Spend too slow and the deadline is missed; the budget caps how much
    is even possible — the decision is the spend/commit schedule.
  robotics_analogue: >
    Autonomous fleet/agent provisioning under an energy or money budget
    — deciding how many sub-agents to spin up and when, given a finite
    resource pool and a mission deadline.
  author: autonomous-loop

base_map: rush-hour-arena
# Pack-wide economy default; levels tighten it as the designed constraint.
starting_cash: 2000

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
  tools:
    - build
    - move_units
    - attack_unit
    - stop
  planning: true
  termination:
    max_ticks: 30000
  actors:
    - type: barr
      owner: agent
      position:
      - 10
      - 20
    - type: powr
      owner: agent
      position:
      - 14
      - 20
    - type: jeep
      owner: agent
      position:
      - 8
      - 18
    - type: e1
      owner: enemy
      position:
      - 112
      - 34
      stance: 2

levels:
  easy:
    description: >
      Generous budget and clock. Build a small force from the barracks;
      the only failure mode is not committing funds at all.
    starting_cash: 2000
    win_condition:
      all_of:
        - own_units_gte: 4        # jeep + >=3 produced infantry
        - within_ticks: 16000
    max_turns: 45
  medium:
    description: >
      Tighter budget — only a few units are affordable; spend must start
      promptly to make the deadline.
    starting_cash: 900
    win_condition:
      all_of:
        - own_units_gte: 5
        - within_ticks: 12000
    max_turns: 45
  hard:
    description: >
      Lean budget and a short clock with an attrition cap: every credit
      and tick must convert to fielded force, losing nothing.
    starting_cash: 700
    win_condition:
      all_of:
        - own_units_gte: 6
        - within_ticks: 9000
        - units_lost_lte: 0
    max_turns: 50
