meta:
  id: economy-force-buildup
  title: 'Force Buildup — Allocate a Fixed Budget to a Power+Force Mix'
  capability: reasoning
  real_world_meaning: >
    Resource allocation under a hard budget and a deadline. The budget
    buys exactly one coherent build: a structural investment (a second
    power plant) PLUS a force of capable units (anti-vehicle infantry,
    not the cheapest filler). Spamming the cheapest unit clears no
    structural bar and no quality bar; over-spending on the wrong item
    misses the deadline. The decision is the spend mix and its order,
    not the mechanics of any single build.
  robotics_analogue: >
    Autonomous fleet provisioning under an energy/money budget: the
    same pool must fund both a capacity upgrade (a charging/relay node)
    AND a set of capable mission agents — not a swarm of the cheapest
    drones — before a mission deadline; an unfocused spend yields
    neither in time.
  benchmark_anchor:
    - "SC2 build-order under fixed budget"
    - "PlanBench cost-bounded multi-goal allocation"
    - "fixed-budget force buildup"
  author: autonomous-loop

# ENGINE NOTE (verified 2026-05): harvest income is 0 in a runnable
# pack (no schema-valid ore source), and power_provided/power_drained
# read 0 even with preplaced power plants, so `power_surplus_gte` is
# inert here and is NOT used. The structural-investment axis is
# therefore expressed with `building_count_gte` (a *placed* second
# powr), and unit quality with `unit_type_count_gte` (e3 anti-vehicle
# infantry at 300cr, vs the 100cr e1 filler). `place_building`
# requires the item to be queued via `build` and completed first
# (two-step: build → place). Budgets/clocks measured with a scripted
# allocator (build powr → place → train e3): see commit message.
base_map:
  generator: arena
  name: economy-force-buildup-arena
  width: 120
  height: 48
# Pack-wide economy default; levels set the binding per-level budget.
starting_cash: 2400

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
  tools:
    - build
    - place_building
    - move_units
    - deploy
    - stop
  planning: true
  termination:
    max_ticks: 12000
  actors:
    - type: fact
      owner: agent
      position:
      - 10
      - 18
    - type: powr
      owner: agent
      position:
      - 14
      - 18
    - type: tent
      owner: agent
      position:
      - 10
      - 22
    # Persistent inert enemy marker — far east of the small arena,
    # HoldFire so it can't shoot back. Stops ConquestVictoryConditions
    # auto-`done` on enemy-wipe before the win/fail evaluator fires
    # (CLAUDE.md engine footgun).
    - type: e1
      owner: enemy
      position:
      - 42
      - 34
      stance: 0

levels:
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Allocate the budget to a structural upgrade PLUS a quality force:
    # build and place a second power plant (powr) and train at least 4
    # anti-vehicle infantry (e3). Spamming the cheap rifle (e1) clears
    # neither bar. Generous clock; the only failure is an unfocused or
    # late spend.
    description: >
      Commander, this is a fixed-budget force buildup. You hold a
      Construction Yard (fact), one Power Plant (powr) and an Allied
      Barracks (tent), with $2400 cash. Within about 30 turns, own at
      least two Power Plants and field at least four anti-vehicle
      rocket soldiers (e3).
    starting_cash: 2400
    win_condition:
      all_of:
        - building_count_gte: {type: powr, n: 2}
        - unit_type_count_gte: {type: e3, n: 4}
        - within_ticks: 2700
    # aligned to the tick reachable at max_turns (~90/turn): a
    # non-finisher LOSES (not draws). Intended allocator finishes by
    # tick ~993, well inside. (No `own_units_gte` fail clause: the
    # agent starts unit-less and must produce a force, so that clause
    # would mis-fire on turn 1.)
    fail_condition:
      after_ticks: 2703
    max_turns: 30
  medium:
    description: >
      Commander, this is a tighter fixed-budget force buildup. You
      hold a Construction Yard (fact), one Power Plant (powr) and an
      Allied Barracks (tent), with $1900 cash. Within about 28 turns,
      own at least two Power Plants, field at least five anti-vehicle
      rocket soldiers (e3), and keep at least five units alive.
    starting_cash: 1900
    win_condition:
      all_of:
        - building_count_gte: {type: powr, n: 2}
        - unit_type_count_gte: {type: e3, n: 5}
        - own_units_gte: 5
        - within_ticks: 2520
    fail_condition:
      after_ticks: 2523
    max_turns: 28
  hard:
    description: >
      Commander, this is the leanest fixed-budget force buildup under
      a short clock with zero-attrition. You hold a Construction Yard
      (fact), one Power Plant (powr) and an Allied Barracks (tent),
      with $2150 cash. Within about 24 turns, own at least two Power
      Plants and field at least six anti-vehicle rocket soldiers (e3)
      without losing a single unit.
    starting_cash: 2150
    win_condition:
      all_of:
        - building_count_gte: {type: powr, n: 2}
        - unit_type_count_gte: {type: e3, n: 6}
        - units_lost_lte: 0
        - within_ticks: 2160
    fail_condition:
      any_of:
        - after_ticks: 2163
        - not: {units_lost_lte: 0}
    max_turns: 24
