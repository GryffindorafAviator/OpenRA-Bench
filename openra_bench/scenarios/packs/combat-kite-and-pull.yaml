# combat-kite-and-pull — ACTION, kiting micro: hit-and-PULL a slow
# heavy enemy with a fast light strike force.
#
# 2026-05-23 audit (Family-1 #13): map shrunk from a tailored 128x40
# arena to 96x40 (3/4 the old width). The kite-and-pull cycle (fire
# then move-back across the lane) is the load-bearing decision; the
# previous arena was half-empty in the west and the engagement
# happened far east, so every probe of the kite cycle was preceded by
# a long, empty drive. The new 96x40 arena puts the engagement zone
# within ~40 cells of the kiter staging while preserving ~18 cells
# of westward retreat space (load-bearing — a tighter arena strands
# the kiter on the cordon before the kite cycle completes and turns
# stand-and-fight into a winning play). Same diagonal-lag geometry
# (kiter on y=10 corridor, heavy on y=20 mid latitude). Briefing
# rewritten in plain English per audits/EDIT_PRINCIPLES.md.
#
# The capability under test is the STRIKE-then-PULL cycle: a fast
# light unit closes to weapon range, FIRES, then retreats out of the
# heavy's lethal close-range window BEFORE the heavy can fire back —
# and repeats. The heavy out-trades the light force head-on, so
# standing and fighting LOSES; the light force's speed advantage is
# the only edge, and it only pays off if the agent strings together
# the move-away + attack_unit cycle every turn.
#
# Real-world anchors:
#   - SC2 kiting micro (vulture/muta vs marines, stalker-vs-zealot):
#     fast unit fires, steps back before the slower foe closes,
#     re-engages.
#   - Cavalry skirmish doctrine: light cavalry charges to contact,
#     looses a volley, then WHEELS AWAY before the heavier line can
#     engage.
#   - Economy-of-force: a small mobile force defeats a heavier,
#     concentrated foe by exploiting a mobility asymmetry.
#
# Engine note (verified 2026-05-23): bot_type:hunt + stance:2 on the
# enemy heavy DOES drive movement. The hunt bot issues an explicit
# Attack order each tick, and per CLAUDE.md "Explicit agent orders
# (attack_unit / attack_move) always override stance" — so the
# heavy actively closes on the kiters' centroid (not just shoots
# from out of range).
#
# Engine-realised pairing note: in OpenRA-Rust the literal jeep MG is
# anti-infantry and does not dent heavy armour, so the fast "kiter"
# is the allied medium tank 2tnk (faster than the soviet 3tnk heavy,
# and its cannon CAN damage heavy armour). The capability under test
# is the kite-and-pull cycle — the unit pairing is the vehicle for
# that test, not the point.
#
# Per-tier escalation in kiter count + chaser toughness:
#   easy   — 1 kiter vs 1 chaser at 35% HP   (bare kite skill;
#            survival bar ≥1)
#   medium — 2 kiters vs 1 chaser at 40% HP  (paired kite +
#            BOTH-survive bar)
#   hard   — 3 kiters vs 1 chaser at 70% HP, NORTH/SOUTH spawn
#            flip by seed (full-formation kite + ALL-THREE-
#            survive bar + tighter clock + spawn variation)
#
# The four-policy bar (CLAUDE.md "no defect, no cheat, no draw"):
#   - stall (observe only)            -> LOSS. The kiters are
#     stance:1 (ReturnFire); a passive stack that never kites is
#     out-traded and overrun by the closing heavy force.
#   - stand-and-fight (attack_move onto the heavy, never retreat)
#     -> LOSS. The heavy cannon out-trades the kiter stack head-on.
#   - brute / wrong-path (one attack_move order far east, chase the
#     heavy with no disengage) -> LOSS. Same close-range trade.
#   - intended kite-and-pull (each turn: if the heavy is within ~6
#     cells, MOVE the kiters AWAY along the lane; else attack_unit
#     the heavy; repeat) -> WIN.

meta:
  id: combat-kite-and-pull
  title: 'Combat Micro — Kite and Pull a Slow Heavy Force'
  capability: action
  real_world_meaning: >
    A fast light strike force must destroy a slower, heavier enemy
    that out-trades it head-on. The only winning play is the
    hit-and-PULL cycle: each turn, strike the heavy at weapon range,
    then RETREAT the strike force out of the heavy's lethal
    close-range window before it can fire back — and repeat. Standing
    and fighting LOSES: the heavy cannon collapses the light force's
    HP before its own runs out. The skill being measured is combat
    micro under a mobility asymmetry — exploit the speed edge by
    stringing together move-away + attack cycles instead of issuing
    one beeline charge.
  robotics_analogue: >
    A fast/light agent team defeating a slow/heavy adversary by
    exploiting a mobility asymmetry: a closed-loop evade-then-engage
    policy rather than a one-shot commit. The per-turn decision is
    proximity control — stay outside the adversary's lethal radius
    while delivering effect at standoff range.
  benchmark_anchor:
    - "SC2 kiting micro"
    - "cavalry skirmish doctrine"
    - "military fire-and-maneuver doctrine"
    - "economy-of-force"
  author: openra-bench

# Tailored 96x40 OPEN arena: playable x in [2..93], y in [2..37].
# Generator: arena, NO interior obstacles — every cell inside the
# cordon is clear ground so the kiter has unimpeded reverse-fire
# mobility along the lane. Single explicit mpspawn at (20,20) pins
# coordinates seed-invariantly.
base_map:
  generator: arena
  name: combat-kite-pull-arena
  width: 96
  height: 40
  cordon: 2
  spawns: [[20, 20]]
  title: Kite and Pull Arena 96x40

base:
  agent: {faction: allies, cash: 0}
  # hunt bot: the heavy actively PURSUES the kiters' centroid so the
  # engagement starts on contact (no fog-blind opening). The hunt
  # advance is what the agent must out-pace AND what brings the heavy
  # into vision so the kite cycle has a target.
  enemy: {faction: soviet, cash: 0, bot_type: hunt}
  tools: [observe, move_units, attack_unit, attack_move, stop]
  planning: true
  termination: {max_ticks: 7000}
  actors: []

levels:
  # ── EASY ────────────────────────────────────────────────────────
  # Bare 1v1 kite-and-pull skill: ONE medium-tank kiter vs ONE heavy
  # (3tnk) at 35% HP. The diagonal-lag geometry (kiter on north
  # corridor y=10, heavy on mid latitude y=20) opens the kite cycle's
  # reactive window. The reduced chaser HP is what makes 1v1
  # mathematically winnable — at full HP the chaser out-trades a solo
  # kiter even with a perfect cycle (the chaser's burst-2 105mm has
  # ~1.43× the kiter's effective DPS). Survival bar ≥1.
  easy:
    description: >
      Commander, this is a combat engagement against a single enemy
      heavy. You are given 1 medium tank at (20,10) on the north
      corridor, Return-Fire orders. The enemy is one wounded heavy
      tank at (80,20) at 35% HP — its cannon hits harder than yours
      and it out-trades you head-on. The heavy is on a hunt order
      and will close on you. Kill the heavy with your tank still
      alive, within 4500 ticks.
    overrides:
      actors:
        # KITER — 1 medium tank, stance:1 (ReturnFire).
        - {type: 2tnk, owner: agent, position: [20, 10], stance: 1}
        # THE HEAVY — soviet 3tnk under hunt bot at 35% HP (the
        # narrow band where every wrong policy LOSES and kite WINS).
        - {type: 3tnk, owner: enemy, position: [80, 20], stance: 2, health: 35}
        # Persistent unarmed far-east enemy marker — anti-DRAW.
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 1}
        - {own_units_gte: 1}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 51

  # ── MEDIUM ──────────────────────────────────────────────────────
  # +1 controlled variable vs easy: TWO kiters paired on the north
  # corridor, vs ONE chaser at 40% HP. The survival bar tightens to
  # `own_units_gte:2` — BOTH kiters must finish alive.
  medium:
    description: >
      Commander, this is a combat engagement against a single enemy
      heavy. You are given 2 medium tanks on the north corridor at
      (20,9) and (20,11), Return-Fire orders. One wounded enemy
      heavy tank at (80,20) at 40% HP hunts from the mid latitude;
      its cannon hits harder than yours and it out-trades you
      head-on. Kill the heavy with BOTH tanks alive, within 4500
      ticks.
    overrides:
      actors:
        # KITERS — paired ReturnFire formation, y=9 and y=11.
        - {type: 2tnk, owner: agent, position: [20,  9], stance: 1}
        - {type: 2tnk, owner: agent, position: [20, 11], stance: 1}
        # THE HEAVY — 40% HP, slightly tougher than easy.
        - {type: 3tnk, owner: enemy, position: [80, 20], stance: 2, health: 40}
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 1}
        - {own_units_gte: 2}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 2}}
    max_turns: 51

  # ── HARD ────────────────────────────────────────────────────────
  # +3 controlled variables vs medium:
  #   1. Kiter count rises to 3 (full formation), survival bar ≥3.
  #   2. Chaser HP rises to 70%. The kite cadence must be efficient.
  #   3. TWO agent spawn_point groups (NORTH y=10 / SOUTH y=30
  #      corridor) round-robined by seed, so the pull vector flips
  #      per seed. The heavy sits on the mid latitude (y=20) between
  #      the corridors so both spawns face symmetric geometry.
  # Heavy staged at x=36 (not x=40) so the hunting chaser enters the
  # kiters' vision with enough STANDOFF for the kite cycle to open.
  hard:
    description: >
      Commander, this is a combat engagement against a single enemy
      heavy. You are given 3 medium tanks (Return-Fire orders) on
      either the north corridor (y=10) or south corridor (y=30)
      depending on seed. One enemy heavy tank at 70% HP hunts from
      the mid latitude (y=20) — its cannon hits harder than yours
      and it out-trades you head-on. Kill the heavy with all 3
      tanks alive, within 3600 ticks.
    overrides:
      actors:
        # spawn_point 0 — NORTH corridor (y=10)
        - {type: 2tnk, owner: agent, position: [28,  9], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [30, 10], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [28, 11], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH corridor (y=30)
        - {type: 2tnk, owner: agent, position: [28, 29], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [30, 30], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [28, 31], stance: 1, spawn_point: 1}
        # One heavy on the mid latitude, 70% HP — staged at x=70 so
        # the hunting chaser enters vision with enough standoff for
        # the kite cycle to open.
        - {type: 3tnk, owner: enemy, position: [70, 20], stance: 2, health: 70}
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 1}
        - {own_units_gte: 3}
        - {within_ticks: 3600}
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {own_units_gte: 3}}
    max_turns: 41
