# EXPANSION-AGGRO-3-BASE-GREEDY — Group B (Mid-Late: AGGRO 3-base
# expansion, growth supremacy over defence).
#
# ENGINE NOTE (tier-progression audit, 2026-05-24): The audit flags
# this pack F-INVERT because max_losses grows e=1 → m=2 = h=2 and
# survival_strictness drops e=0.50 → m=0.33 = h=0.33. This is
# INTENTIONAL: easy gives 2 MCVs (must keep ≥1 alive) while
# medium/hard give 3 MCVs (must keep ≥1 alive, but the win
# REQUIRES deploying ALL THREE — fact_count_gte:3). The
# strictness fraction drops because the denominator grows; the
# survival floor is the SAME absolute "at least 1 unit alive" in
# the fail clause and the MCV win bar tightens 2→3 across tiers.
# Hard also adds seed-rotated NW vs SW spawns and tighter clock
# (e=5400 → m=3500 → h=3200). Not a real inversion.
#
# The AGGRO variant of the expansion triple. The agent has THREE MCVs
# clustered at a NW staging zone and must rush them out to THREE
# distinct eastern target regions (NE / E / SE) for a defenceless
# 3-base economy footprint. There is no starter base; no garrison; no
# army. The "greedy" play is to commit ALL THREE MCVs to expansion the
# moment the run starts and let the deadline expose stalls or
# half-commits.
#
# Why this is the AGGRO mirror of mcv-deploy-third-base:
#   - third-base hands the agent an existing west starter `fact` (a
#     pre-built first base) and tests "deploy ALL three of the spare
#     MCVs into distinct regions". The agent always has a home.
#   - this pack gives the agent ONLY the three MCVs (no starter base
#     at NW). The agent's first move IS the expansion. Skip even one
#     deploy → no third fact → LOSS. Stall → no facts at all → LOSS
#     via the early pre-fail.
#   - the enemy is intentionally weak (1–2 light e1 patrols on a wide
#     192×80 arena, won't reach the agent in budget). The pack is NOT
#     a combat puzzle — it's a commitment puzzle. Models who "play
#     safe" by garrisoning one MCV at NW lose the third region.
#
# Benchmark / real-world anchor:
#   - SC2 greedy 3-base macro / fastest 3-base timing (skip army, ramp
#     economy as fast as physically possible; bet the opponent is too
#     slow to punish).
#   - Startup blitzscale: sacrifice unit-economics / margin for
#     market-share growth.
#   - Aggressive land-grab: claim three sites before any competitor
#     contests them.
#   - Growth-vs-defence tradeoff (the classic capacity-vs-safety
#     dilemma).
#
# Wave-2 MCV deploy contract: `Command.deploy([mcv_id])` removes the
# MCV at (mx, my) and creates an agent `fact` at (mx-1, my-1). The
# pack's `building_in_region` predicates are tuned so that for each
# target region (cx, cy, radius 8), an MCV at any cell within the
# disc around (cx+1, cy+1) deploys into a fact inside the region.
#
# Engine tick/turn alignment (CLAUDE.md, ~90 ticks/turn):
#   within_ticks 5400 → reachable tick at 62 turns = 93 + 90·61 = 5583 ≥
#   5401 ✓ (the deadline bites; a stall emits a real LOSS, not a DRAW).
#
# Engine footguns applied:
#   - `spawn_mcvs: false` — engine default auto-seeds an extra MCV at
#     the mpspawn cells, polluting the deploy count and assignment.
#   - Persistent unarmed enemy `fact` MARKER at the far map edge
#     prevents the all-enemies-eliminated auto-`done` so non-winners
#     LOSE on the deadline (never DRAW).
#   - Agent starts with 3 MCVs (units, not buildings). The fail clause
#     `not own_units_gte:1` mis-fires on turn 1 only when the agent
#     starts unit-less (CLAUDE.md footgun); here the agent has units,
#     so the clause fires only after every MCV is destroyed AND zero
#     facts have been deployed (a true "lost everything" state).
#   - The "no fact" / commitment fail clause is gated on a pre-fail
#     tick so the agent has time to reach at least one region before
#     it bites — without this gate, a slow-march on turn 1 looks
#     identical to a stall and the run dies before the discrimination
#     signal can emerge.
#   - Hard tier: ≥2 agent spawn_point groups rotate the MCV cluster
#     between NW (15,15)..(15,25) and SW (15,55)..(15,65) so the
#     nearest target region per MCV flips per seed; symmetric enemy
#     placement (enemies don't honour spawn_point — CLAUDE.md).
#
# Region geometry on the 192×80 cordon-4 arena (playable
# x∈[4,188], y∈[4,76]):
#   - NE : centre (165, 15), radius 8
#   - E  : centre (165, 40), radius 8
#   - SE : centre (165, 65), radius 8
# Pre-deploy MCV target cells (so fact lands at region centre):
#   - NE → MCV at (166, 16) → fact (165, 15) ✓
#   - E  → MCV at (166, 41) → fact (165, 40) ✓
#   - SE → MCV at (166, 66) → fact (165, 65) ✓
#
# Mines at each target region let a follow-up `harvest` (post-deploy,
# post-build of a harvester) feed the new bases — flavour, not part of
# any predicate (income gates would shift the test from "commit to
# expansion" to "commit AND grow economy", a different capability).
# Mines are placed close enough to the deployed fact that an
# unattended harv built from each new base could meaningfully reach
# the ore patch; the tools list keeps `harvest` available for models
# that want to capitalise on the economy after expansion.

meta:
  id: expansion-aggro-3-base-greedy
  title: 'Expansion AGGRO — Rush to 3 Bases (Growth Supremacy, No Defence)'
  capability: reasoning
  real_world_meaning: >
    AGGRO triple-expansion: three indivisible base-builders are
    committed simultaneously to three DISTINCT geographies, with no
    surviving home base and no army held in reserve. The decision is
    whether to embrace the greedy growth play (race the clock; bet
    that no one punishes the open flank in time) or hedge by keeping
    one MCV back as defence (and forfeit the third region). The
    enemy in this scenario is intentionally too weak to punish a
    fully-greedy commit inside the budget — the discrimination is
    whether the model RECOGNISES that and commits, instead of
    defaulting to a "safe" partial expansion that fails the bar.
  robotics_analogue: >
    Autonomous fleet land-grab: three indivisible deployable platforms
    must each anchor at a distinct claim site before a deadline; the
    fleet has no escort and no fallback, and the only safe play is
    speed — any platform held back as a "rover reserve" leaves a claim
    uncontested and forfeits the multi-site network. Same idea in
    aggressive market-entry (claim three regional markets ahead of
    competitors) and in blitzscale (deploy capacity faster than rivals
    can react, accept the unit-economics hit).
  benchmark_anchor:
    - "SC2 greedy 3-base macro / fastest expansion timing"
    - "startup blitzscale: skip margin for growth"
    - "aggressive market-share land-grab"
    - "growth-vs-defence tradeoff"
  author: "openra-bench"

# Wider 192×80 arena — fits the NW staging zone PLUS three
# well-separated eastern target regions. The pack-level base_map is
# the rush-hour-arena sentinel (a known-supported string the loader
# can resolve before the per-level `overrides.base_map` generator
# spec replaces it). Per-level overrides materialise the actual
# arena .oramap.
base_map: expansion-aggro-3-base-greedy-arena

# starting_cash: 0 — the agent doesn't need to build anything to win
# (no income gate in the win predicate). The path to win is purely
# `move_units` + `deploy` x3. Mines at each target are flavour: a
# model that BUILDS a harv at a new base after deploying could begin
# harvesting income, but it's not required.
starting_cash: 0

base:
  agent: {faction: allies}
  enemy: {faction: soviet, cash: 0}
  # Tools include build/place_building/harvest so the tool list isn't
  # lying about engine capability, but with cash:0 and no harvesters
  # pre-placed, the load-bearing path is move_units + deploy only.
  tools: [observe, deploy, build, place_building, harvest, move_units, stop]
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 8500}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Degenerate-to-balanced variant: 2 MCVs / 2 regions (NE + SE only),
  # no enemy patrols, generous clock. The decision is solely "deploy
  # BOTH, not just one". Each MCV is already inside its target region
  # so no movement is needed.
  # max_turns 65 → reachable tick 93 + 90·64 = 5853 ≥ 5400 ✓
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # AGGRO expansion easy: TWO Construction Vehicles (MCV) are pre-
    # positioned at two distinct eastern regions (NE near (165,15) and SE
    # near (165,65)). Deploy EACH MCV in place — each deploy consumes the
    # MCV and creates a Construction Yard (fact) one cell up-and-left of
    # the MCV's position, inside its designated region. Win = you own ≥2
    # facts AND there is a fact near (165,15) AND a fact near (165,65),
    # before tick 5400. Deploying only one MCV (the "play safe / hold
    # reserve" play) leaves the other region uncovered and LOSES.
    description: >
      Two MCVs sit pre-positioned at distinct eastern regions — NE near
      (165,15) and SE near (165,65). Each can be deployed in place to
      create a Construction Yard at its region. Two yards, one at each
      target region, within about 60 turns.
    overrides:
      base_map:
        generator: arena
        name: expansion-aggro-3-base-greedy-arena
        width: 192
        height: 80
        cordon: 4
      actors:
        # Two MCVs already inside their designated regions. After
        # deploy, fact lands at (mcv_x-1, mcv_y-1):
        #   (166,16) → fact (165,15) — exactly NE region centre
        #   (166,66) → fact (165,65) — exactly SE region centre
        - {type: mcv, owner: agent, position: [166, 16]}
        - {type: mcv, owner: agent, position: [166, 66]}
        # Mines at each target region (flavour: a built harvester
        # could collect from these after deploy; not part of any
        # predicate).
        - {type: mine, owner: neutral, position: [160, 15]}
        - {type: mine, owner: neutral, position: [160, 65]}
        # Persistent unarmed enemy `fact` MARKER at the far east edge,
        # outside both target regions. Keeps the episode alive past
        # any partial outcome (engine auto-`done` on
        # all-enemies-eliminated is gated on this surviving) so a
        # non-winner emits a real reachable LOSS on the deadline.
        - {type: fact, owner: enemy, position: [185, 40]}
    win_condition:
      all_of:
        - building_count_gte: {type: fact, n: 2}
        - building_in_region: {x: 165, y: 15, radius: 8, type: fact, count: 1}
        - building_in_region: {x: 165, y: 65, radius: 8, type: fact, count: 1}
        - within_ticks: 5400
    fail_condition:
      any_of:
        - after_ticks: 5401
        # "Lost everything" — all MCVs destroyed AND zero facts ever
        # deployed (truly wiped, no progress). Gated on both clauses
        # so the agent's starting-without-buildings state doesn't
        # trigger it (the agent has 2 MCVs at start → own_units_gte:1
        # holds, so this clause is inert on turn 1).
        - all_of:
            - not: {own_units_gte: 1}
            - not: {has_building: fact}
    max_turns: 65

  # ── MEDIUM ───────────────────────────────────────────────────────
  # The AGGRO challenge proper: 3 MCVs / 3 regions; MCVs clustered at
  # the NW staging zone (NOT pre-positioned at their targets). The
  # agent must commit each MCV to a DISTINCT eastern region. A light
  # enemy patrol (1-2 e1) sits offset from each target — they will
  # not kill an MCV that takes the direct line in budget. The puzzle
  # is whether the model commits or hedges.
  # max_turns 65 → reachable tick 5853 ≥ 5401 ✓
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # AGGRO expansion medium: THREE Construction Vehicles (MCV) cluster at
    # your NW staging zone. There is NO starter base — your first move IS
    # your expansion. You must drive each MCV to a DISTINCT eastern target
    # region (NE near (165,15), E near (165,40), SE near (165,65)) and
    # deploy. A few light Soviet patrols loiter near the regions but
    # cannot reach you in time if you commit straight away. Win = you own
    # ≥3 facts AND there is a fact in EACH of the three target regions,
    # before tick 5400. Holding any MCV back as a "defence reserve"
    # forfeits a region and LOSES. Stalling produces no facts at all and
    # LOSES via the early pre-fail clause.
    description: >
      Three MCVs cluster at your NW staging; you have no starter base.
      Each MCV can be deployed in place to create a Construction Yard.
      Three target regions sit in the east — NE (165,15), E (165,40), SE
      (165,65). Light Soviet patrols loiter near the regions but can't
      catch a prompt commit. Three yards, one per region, within about 60
      turns.
    overrides:
      base_map:
        generator: arena
        name: expansion-aggro-3-base-greedy-arena
        width: 192
        height: 80
        cordon: 4
      enemy: {faction: soviet, cash: 0, bot_type: patrol}
      actors:
        # Three MCVs clustered at the NW staging zone. Distinct cells
        # (the engine refuses overlapping placements).
        - {type: mcv, owner: agent, position: [15, 15]}
        - {type: mcv, owner: agent, position: [15, 20]}
        - {type: mcv, owner: agent, position: [15, 25]}
        # Mines at each target region (flavour for post-deploy
        # harvest; not part of any predicate).
        - {type: mine, owner: neutral, position: [160, 15]}
        - {type: mine, owner: neutral, position: [160, 40]}
        - {type: mine, owner: neutral, position: [160, 65]}
        # Light Soviet patrols (stance:2 = return-fire-only; the
        # `patrol` bot oscillates around spawn cell). Offset from the
        # direct approach line so a committed MCV is not intercepted.
        # Won't actually kill anything important in budget — they're
        # atmospheric pressure.
        - {type: e1, owner: enemy, position: [150, 12], stance: 2}
        - {type: e1, owner: enemy, position: [150, 68], stance: 2}
        # Persistent far enemy marker (LOSS-not-DRAW guarantee).
        - {type: fact, owner: enemy, position: [185, 40]}
    win_condition:
      all_of:
        - building_count_gte: {type: fact, n: 3}
        - building_in_region: {x: 165, y: 15, radius: 8, type: fact, count: 1}
        - building_in_region: {x: 165, y: 40, radius: 8, type: fact, count: 1}
        - building_in_region: {x: 165, y: 65, radius: 8, type: fact, count: 1}
        - within_ticks: 5400
    fail_condition:
      any_of:
        - after_ticks: 5401
        # Pre-fail: if the agent has not produced ≥1 fact by tick
        # 3500 the run is essentially unwinnable (no time to reach
        # two more regions and deploy in 1900 ticks across a 192-wide
        # arena). Catches stalls / hesitation BEFORE the deadline so
        # playback shows the actual LOSS reason.
        - all_of:
            - after_ticks: 3500
            - not: {building_count_gte: {type: fact, n: 1}}
        # "Lost everything" — all MCVs destroyed AND zero facts ever
        # deployed (gated to never fire on turn 1).
        - all_of:
            - not: {own_units_gte: 1}
            - not: {has_building: fact}
    max_turns: 65

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 axis: TWO agent spawn_point groups rotate the MCV cluster
  # between NW (15..15..25) and SW (15,55..15,65). Target regions are
  # fixed (enemies don't honour spawn_point — CLAUDE.md), so which
  # region is "closest" to each MCV flips per seed. A memorised
  # MCV-i→region-j assignment generalises to one spawn but fails on
  # the other. Tighter clock + slightly more patrols.
  # max_turns 60 → reachable tick 93 + 90·59 = 5403 ≥ 4800 ✓
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # AGGRO expansion hard: same tri-region commitment under tighter
    # pressure. Three Construction Vehicles cluster at either your NW or
    # SW staging depending on the run — read your MCVs' positions and
    # assign each to the eastern target region (NE near (165,15), E near
    # (165,40), SE near (165,65)) it can reach fastest. A doubled Soviet
    # patrol sits near each target. Win = you own ≥3 facts AND there is a
    # fact in each of the three target regions, before tick 4800. Holding
    # any MCV back forfeits a region and LOSES; stalling LOSES via the
    # early pre-fail.
    description: >
      Three MCVs cluster at your NW or SW staging by seed. Three target
      regions sit in the east — NE, E, SE. Doubled patrols sit near every
      target. Three yards, one per region, within about 54 turns.
    objective_coords: relative
    overrides:
      base_map:
        generator: arena
        name: expansion-aggro-3-base-greedy-arena
        width: 192
        height: 80
        cordon: 4
      enemy: {faction: soviet, cash: 0, bot_type: patrol}
      actors:
        # NW MCV cluster (spawn_point 0) — closest target region by
        # symmetry is NE; SE is the far one.
        - {type: mcv, owner: agent, position: [15, 15], spawn_point: 0}
        - {type: mcv, owner: agent, position: [15, 20], spawn_point: 0}
        - {type: mcv, owner: agent, position: [15, 25], spawn_point: 0}
        # SW MCV cluster (spawn_point 1) — closest is SE; NE is far.
        # Inversion of group 0: a memorised "always send MCV-1 to NE"
        # generalises to group 0 but is the WORST assignment on
        # group 1 (it crosses the whole map).
        - {type: mcv, owner: agent, position: [15, 55], spawn_point: 1}
        - {type: mcv, owner: agent, position: [15, 60], spawn_point: 1}
        - {type: mcv, owner: agent, position: [15, 65], spawn_point: 1}
        # Mines at each target region (flavour).
        - {type: mine, owner: neutral, position: [160, 15]}
        - {type: mine, owner: neutral, position: [160, 40]}
        - {type: mine, owner: neutral, position: [160, 65]}
        # Doubled patrols (one extra unit per region vs medium). Still
        # offset from the direct approach so a straight-line commit
        # is unthreatened.
        - {type: e1, owner: enemy, position: [150, 12], stance: 2}
        - {type: e1, owner: enemy, position: [152, 14], stance: 2}
        - {type: e1, owner: enemy, position: [150, 40], stance: 2}
        - {type: e1, owner: enemy, position: [152, 42], stance: 2}
        - {type: e1, owner: enemy, position: [150, 68], stance: 2}
        - {type: e1, owner: enemy, position: [152, 66], stance: 2}
        # Persistent far enemy marker (LOSS-not-DRAW guarantee). NOT
        # tagged with spawn_point — enemy actors place regardless
        # (CLAUDE.md: spawn_point filter applies only to AGENT
        # actors).
        - {type: fact, owner: enemy, position: [185, 40]}
    win_condition:
      all_of:
        - building_count_gte: {type: fact, n: 3}
        - building_in_region: {x: 165, y: 15, radius: 8, type: fact, count: 1}
        - building_in_region: {x: 165, y: 40, radius: 8, type: fact, count: 1}
        - building_in_region: {x: 165, y: 65, radius: 8, type: fact, count: 1}
        - within_ticks: 4800
    fail_condition:
      any_of:
        - after_ticks: 4801
        - all_of:
            - after_ticks: 3200
            - not: {building_count_gte: {type: fact, n: 1}}
        - all_of:
            - not: {own_units_gte: 1}
            - not: {has_building: fact}
    max_turns: 60
