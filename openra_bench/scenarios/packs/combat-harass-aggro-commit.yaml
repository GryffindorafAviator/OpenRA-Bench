# combat-harass-aggro-commit — AGGRO variant of the harvester-harass
# triple: fight THROUGH the defender for the higher kill score.
#
# 2026-05-23 audit (Family-1 #9): map shrunk from rush-hour-arena
# (128x40) to a tailored 56x40 arena. The decision under test is the
# threat-priority commit (focus the defender first, then mop up the
# harvesters) — on the old map ~70 cells of empty drive separated the
# raiders' staging from the harvester cluster, turning every probe of
# the doctrine into a search-and-approach. The 56x40 arena keeps the
# same engagement geometry: raiders at x=4, defender(s) at x=36 on the
# centroid latitude, harvester cluster at x=40-44 around the proc.
# Briefing rewritten in plain English per audits/EDIT_PRINCIPLES.md.
#
# Family: AGGRO node of the harvester-harass triple.
#   - TURTLE — covered by `mid-economy-under-fire` (you defend YOUR
#     harvesters against an incoming raider).
#   - BALANCED — `combat-harass-balanced-hit-and-run` (hit-and-run
#     with retreats).
#   - AGGRO — THIS pack (commit and kill everything).
#
# Discrimination (the four script-policy bar — unchanged):
#   - stall (observe only): raiders never engage; kill bar unmet ->
#     after_ticks LOSS.
#   - retreat-only: drive raiders back to spawn. The defender is
#     stance:2 with no bot (holds post) so retreat is safe but
#     scoreless -> after_ticks LOSS.
#   - attack-harv-only-ignore-defender: raiders rush the harvs while
#     standing inside the defender 3tnk's range; the 3tnk picks them
#     off one by one. Kill ratio collapses before the kill bar is met
#     -> own_units_gte:1 trips OR within_ticks busts -> LOSS.
#   - intended focus-defender-then-harv: concentrate the raiders' fire
#     on the 3tnk first (3-vs-1 tank trade favours the attacker), then
#     mop up the now undefended harvs. >=1 raider survives, kill bar
#     met -> WIN.

meta:
  id: combat-harass-aggro-commit
  title: 'Combat Harass — AGGRO Commit: Fight Through the Defender'
  capability: action
  real_world_meaning: >
    A small raider force is staged west; a cluster of enemy harvesters
    works an ore patch around their refinery in the centre-east, with
    a single heavy tank standing on-post as the defender. The high-score doctrine is to COMMIT — concentrate fire on the defender
    first (3-vs-1 tank trade favours the attacker), then mop up the
    undefended harvesters. Stalling or pure retreat misses the kill
    bar; attacking the harvesters while ignoring the defender lets
    the heavier heavy tank pick off the raiders one by one. The intended
    play accepts some attrition to score both targets: aggro raid
    doctrine, not skirmish-and-pull-back.
  robotics_analogue: >
    Military forward-attrition / aggressive raid doctrine — a small
    expeditionary force commits to a higher-impact engagement
    (defender + payload) rather than disengaging at first contact,
    accepting losses to achieve the larger objective. The decision is
    threat-priority and commitment, not micromanagement of retreats.
  benchmark_anchor:
    - "SC2 aggressive worker harass with commit"
    - "military forward attrition warfare"
    - "RTS aggro doctrine: accept losses for higher kill ratio"
    - "guerrilla raids with kill-everything objective"
  author: openra-bench

# Tailored 56x40 open arena: cordon-only (no interior obstacles) so
# the engagement geometry is pure unit-on-unit. Same shape as the
# legacy rush-hour-arena layout (west-staging vs centre-east cluster)
# but shrunk to remove the empty pre-engagement drive.
base_map:
  generator: arena
  name: combat-harass-aggro-arena
  width: 56
  height: 40
  cordon: 2
  spawns: [[4, 20]]
  title: Combat Harass Aggro Arena 56x40

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: ''}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  termination: {max_ticks: 6000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare aggro skill: 4 raiders, 1 defender + 2 harvs (kill bar 3).
  # Forgiving force ratio — even the attack-harv-only policy may
  # squeak by here on luck. Stall and retreat-only still LOSE.
  easy:
    description: >
      Commander, this is an aggressive raid against an enemy economy.
      You are given 4 medium tanks on the west edge (x=4). An enemy
      Ore Refinery sits at (40,20) with 2 harvesters (unarmed
      ore-collector trucks) working the patch around it. A single
      heavy tank (heavier than yours; out-trades a medium tank
      one-on-one) stands guard at (36,20). Three of your tanks
      shooting the guard at once still win the trade — focus your
      fire on the heavy first, then sweep the harvesters. Charging
      the harvesters while the heavy is alive lets it pick you off.
      Score 3 kills (the guard plus both harvesters) with at least
      1 tank surviving, within about 50 turns.
    overrides:
      actors:
        # Raider strike force — 4 medium tanks at the west edge.
        - {type: 2tnk, owner: agent, position: [4, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 22], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 20], stance: 1}
        # Enemy harv cluster around the proc at (40,20).
        - {type: harv, owner: enemy, position: [38, 19]}
        - {type: harv, owner: enemy, position: [42, 21]}
        # The lone defender, on-post just west of the cluster.
        - {type: 3tnk, owner: enemy, position: [36, 20], stance: 2}
        # Enemy refinery (the thematic anchor — not a kill target).
        - {type: proc, owner: enemy, position: [40, 20]}
        # Far persistent enemy marker: prevents engine auto-done if
        # the agent accidentally engages the proc.
        - {type: fact, owner: enemy, position: [52, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {own_units_gte: 1}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 51

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 axis: bigger payload (3 harvs, kill bar 4) and the canonical
  # 3-vs-1 force ratio. Now attack-harv-ignore-defender consistently
  # LOSES (the 3tnk has time to whittle the raiders before they
  # outscore the kill bar). Intended focus-defender-first WINS.
  medium:
    description: >
      Commander, this is an aggressive raid against an enemy economy.
      You are given 3 medium tanks on the west edge (x=4). An enemy
      Ore Refinery sits at (40,20) with 3 harvesters working
      the patch. A single heavy tank stands guard at (36,20) — it
      out-trades a medium tank one-on-one, but three of yours firing
      together still beat it. Focus all three on the guard first, then
      sweep the harvesters. Splitting fire or attacking the workers
      while the heavy is alive trades raiders you cannot spare. Score
      4 kills (the guard plus all three harvesters), one tank
      surviving, within about 60 turns.
    overrides:
      actors:
        # Raider strike force — 3 medium tanks at the west edge.
        - {type: 2tnk, owner: agent, position: [4, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 22], stance: 1}
        # Three enemy harvs around the proc at (40,20).
        - {type: harv, owner: enemy, position: [38, 19]}
        - {type: harv, owner: enemy, position: [42, 21]}
        - {type: harv, owner: enemy, position: [42, 18]}
        # The lone defender, on-post just west of the cluster.
        - {type: 3tnk, owner: enemy, position: [36, 20], stance: 2}
        - {type: proc, owner: enemy, position: [40, 20]}
        - {type: fact, owner: enemy, position: [52, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 4}
        - {own_units_gte: 1}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 62

  # ── HARD ─────────────────────────────────────────────────────────
  # +2 axes vs medium:
  #   1. TWO defenders + 4 harvs (kill bar 6). Splitting fire across
  #      two 3tnks loses; the raider force has to focus-down one
  #      defender at a time then the other before turning on the
  #      harvs.
  #   2. The raider strike force stages from TWO seed-driven
  #      spawn_point groups (north or south west-edge corridor) so
  #      the engagement geometry varies per seed. Enemy garrison is
  #      symmetric — both spawns face an equivalent puzzle.
  hard:
    description: >
      Commander, this is an aggressive raid against an enemy economy.
      You are given 3 medium tanks staged in the north corridor
      (y=10..14) or the south corridor (y=26..30) depending on seed.
      An enemy Ore Refinery sits at (40,20) with 4 harvesters working
      the patch and TWO heavy tanks on guard — one north at (36,16),
      one south at (36,24). Each heavy out-trades a medium tank
      one-on-one. Focus all three of your tanks on ONE guard at a
      time, then the second, then sweep the four harvesters.
      Splitting fire across both heavies lets them grind you down.
      Six kills, one raider surviving, within about 95 turns.
    overrides:
      actors:
        # spawn_point 0 — NORTH staging corridor (y=10..14)
        - {type: 2tnk, owner: agent, position: [4, 10], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 12], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 14], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH staging corridor (y=26..30)
        - {type: 2tnk, owner: agent, position: [4, 26], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 28], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 30], stance: 1, spawn_point: 1}
        # Four enemy harvs around the proc — two north, two south.
        - {type: harv, owner: enemy, position: [38, 17]}
        - {type: harv, owner: enemy, position: [42, 18]}
        - {type: harv, owner: enemy, position: [38, 23]}
        - {type: harv, owner: enemy, position: [42, 22]}
        # Two defenders — one north, one south of the proc (the
        # garrison is symmetric across the y-axis so either spawn
        # group faces equivalent geometry to the engagement).
        - {type: 3tnk, owner: enemy, position: [36, 16], stance: 2}
        - {type: 3tnk, owner: enemy, position: [36, 24], stance: 2}
        - {type: proc, owner: enemy, position: [40, 20]}
        - {type: fact, owner: enemy, position: [52, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {own_units_gte: 1}
        - {within_ticks: 8553}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 95
