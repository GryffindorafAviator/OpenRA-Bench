# rob-unit-loss-recovery — rebuild force structure after attrition
#
# REASONING capability — react to an exogenous COMBAT-UNIT loss event by
# (1) recognising the surviving force is below establishment, (2)
# commissioning replacements from the war-factory with the reserve cash,
# and (3) executing the original offensive (kill the eastern garrison
# defending the enemy fact) — fast enough that the deadline still bites.
#
# Real-world anchor: PlanBench replanning after exogenous loss (gold
# standard); SC2 rebuild-after-trade; military force-regen / unit
# replacement under mid-mission attrition; ScienceWorld error recovery.
#
# Discrimination (the four-script policy bar):
#   • stall (only `observe`): the enemy strike force grinds down the
#     stationary agent column, the enemy garrison at x=80 is never
#     touched → kill bar (5) unmet, or the column is wiped → LOSS.
#   • no-rebuild (attack_move east but skip `build`): the moving
#     column out-trades the strikers without loss and clears the
#     garrison so kills ≥5, BUT the starting column (4 3tnk) is BELOW
#     the establishment quota N and a policy that never builds a 3tnk
#     can never satisfy `unit_type_count_gte: {type: 3tnk, n: N}` →
#     timeout LOSS even with kills ≥5.
#   • intended (build the 3tnk establishment up to N + attack_move
#     east): build('3tnk') until the 3tnk count reaches N, attack_move
#     the live force east. The garrison falls, unit-type-count and
#     kill-bar both pass → WIN.
#
# RECALIBRATED (2026-05) after the engine movement fixes — the earlier
# design relied on the opening 4tnk strike shaving exactly one 3tnk
# off the column, but bench-wide combat rebalancing made that casualty
# unreliable (a moving heavy-tank column now out-trades the strikers
# without loss). The discriminator is now DETERMINISTIC and combat-
# RNG-free: the agent's starting column is BELOW the establishment
# quota N, so fielding the missing tank(s) is a mandatory build verb
# that does not depend on a casualty. The quota is 5 (easy/medium,
# one build) and 6 (hard, two builds).
#
# ENGINE NOTES:
#  - Combat unit is `3tnk` (heavy tank, Soviet faction). Production
#    requires `fact + weap + fix`. Cost 1150 cr per replacement.
#  - The enemy uses the `turtle` scripted bot (botgen.py / scripted_
#    bot.rs) so the eastern e1 garrison HOLDS POSITION instead of
#    surging west; the kill bar is reachable from a single east-bound
#    assault.
#  - Strikers are stance:3 (AttackAnything) so they fire on the agent
#    column from tick 0 — they are anti-stall teeth (a stationary
#    column is ground down) and kill fodder (a moving column kills
#    them in passing, padding the kill count). They are NOT relied on
#    to destroy an agent tank: the establishment quota, not a combat
#    casualty, is the load-bearing build trigger.
#  - The far enemy `fact` at (120,20) is the engine-auto-done guard
#    (CLAUDE.md): without a persistent MustBeDestroyed enemy, the
#    engine ends the episode the moment the last garrison e1 falls,
#    which can collapse a clean run to DRAW before the win/fail
#    evaluator sees the terminal frame.
#  - Tick budget (CLAUDE.md): max_turns=60 ⇒ ceiling tick 5403 ⇒
#    within_ticks 5400 + after_ticks 5401 both reachable; a non-
#    finisher LOSES (not draws).
#  - `not own_units_gte: 1` mis-fires on turn 1 when the agent starts
#    unit-less (CLAUDE.md footgun). This pack starts with a 4-tank
#    3tnk column + fact, so `own_units_gte: 1` is safe.

meta:
  id: rob-unit-loss-recovery
  title: 'Force-Regen After Attrition — Rebuild Combat Force Mid-Episode'
  capability: reasoning
  real_world_meaning: >
    Reactive replan to bring a force up to establishment. An ongoing
    offensive operation begins UNDER-STRENGTH — the standing column is
    below the force structure the mission requires; the agent has
    reserve cash to commission the missing units from the war factory;
    the offensive deadline is real. The model must notice the gap
    (units_summary shows fewer combat tanks than the required
    establishment), commit the reserve to building the combat type
    (not to a different unit or to nothing), AND continue the original
    mission (clear the eastern garrison defending the enemy
    construction yard) fast enough that the deadline still bites.
  robotics_analogue: >
    Military force-regen / SC2 rebuild-after-trade. A theater operation
    is fielded below establishment and must build up to strength from
    the rear-area production base mid-mission; the supervisor has a
    discrete replacement budget; the operational objective and
    timeline are fixed. The discrimination is whether the model
    recognises the gap in the advertised force structure AND issues
    the production order in time to keep the offensive on schedule;
    ignoring the gap (assaulting with the reduced force) under-strengths
    the assault and busts the establishment bar; spending the budget
    on the wrong unit type breaks the offensive composition; doing
    nothing busts the deadline.
  benchmark_anchor:
    - "PlanBench replanning under exogenous loss"
    - "ScienceWorld error recovery"
    - "military force-regen / unit replacement"
    - "SC2 rebuild-after-trade"
  author: "openra-bench"

base_map: rush-hour-arena
starting_cash: 1500  # per-level override below

base:
  agent:
    faction: soviet
  enemy:
    faction: allies
    # `turtle` (Wave-2 scripted bot) — enemy units hold position and
    # return fire only. This keeps the eastern e1 garrison at x=80
    # from surging west, so the kill bar is satisfied by an eastbound
    # assault rather than by absorbing waves into the base. The
    # pre-placed `4tnk` strikers (stance:3 AttackAnything) handle the
    # loss event independently — they fire on contact at tick 0.
    bot_type: turtle
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  termination:
    max_ticks: 7000

levels:
  # ── EASY ────────────────────────────────────────────────────────
  # The bare skill: the column starts at 4 3tnk, one below the
  # establishment quota of 5 — fielding the 5th is one mandatory
  # build. Generous garrison (5 e1) means the kill bar is easily
  # reachable; the strikers ground a stalling column down.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # You command 4 heavy tanks (3tnk) at a forward staging area (x=22,
    # y=18..24) with a production base (fact + powr + weap + fix) behind
    # you. Two enemy heavy tanks (4tnk) picket the lane mouth (x=24) and
    # engage on contact — do NOT let the column sit idle in their fire. An
    # eastern garrison of 5 rifle infantry (e1) at x=80 defends the enemy
    # construction yard. Your column of 4 is BELOW the required
    # establishment of 5 heavy tanks: the intended play is to build ONE
    # more 3tnk (your reserve of 1500 cr covers the 1150 cr tank) AND
    # attack_move east to clear the garrison. Win when you have killed ≥5
    # enemy units AND you have ≥5 heavy tanks alive AND your construction
    # yard is intact, before tick 5400. Stalling, or assaulting without
    # building up to establishment, both LOSE.
    description: >
      Four heavy tanks staged at (22, 18..24) in front of a production
      base (yard, power, war factory, depot). Two enemy mammoth tanks
      picket the lane mouth at x=24; five rifles guard the enemy yard at
      x=80. Your column is BELOW the five-tank establishment — your $1500
      reserve covers exactly one more 3tnk. Build it, attack east. Five
      tanks alive, five kills, yard standing, within about 60 turns.
    starting_cash: 1500
    overrides:
      actors:
        # Agent base: fact + powr + weap + fix at the west edge.
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: powr, owner: agent, position: [10, 18]}
        - {type: weap, owner: agent, position: [12, 18]}
        - {type: fix,  owner: agent, position: [14, 18]}
        # 4 combat tanks (3tnk) at the forward staging line — ONE
        # below the establishment quota of 5; fielding the 5th is the
        # mandatory build verb the intended policy must execute.
        - {type: '3tnk', owner: agent, position: [22, 18], stance: 2}
        - {type: '3tnk', owner: agent, position: [22, 20], stance: 2}
        - {type: '3tnk', owner: agent, position: [22, 22], stance: 2}
        - {type: '3tnk', owner: agent, position: [22, 24], stance: 2}
        # Lane-mouth pickets: 2× 4tnk at stance:3 (fire on contact;
        # range covers the staging line at x=22). Anti-stall teeth +
        # kill fodder — a moving column out-trades them.
        - {type: '4tnk', owner: enemy, position: [24, 19], stance: 3}
        - {type: '4tnk', owner: enemy, position: [24, 23], stance: 3}
        # Eastern garrison: 5 rifle infantry defending the enemy fact.
        # Stance:1 ReturnFire so they hold but engage when fired upon.
        - {type: e1, owner: enemy, position: [80, 18], stance: 1}
        - {type: e1, owner: enemy, position: [80, 20], stance: 1}
        - {type: e1, owner: enemy, position: [80, 22], stance: 1}
        - {type: e1, owner: enemy, position: [80, 24], stance: 1}
        - {type: e1, owner: enemy, position: [82, 20], stance: 1}
        # Persistent enemy `fact` far east (engine auto-done guard).
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {unit_type_count_gte: {type: '3tnk', n: 5}}
        - {units_killed_gte: 5}
        - {has_building: fact}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {own_units_gte: 1}}
        - {not: {has_building: fact}}
    max_turns: 60

  # ── MEDIUM ──────────────────────────────────────────────────────
  # +1 controlled variable: TIGHTER strike (3× 4tnk strikers instead
  # of 2) AND larger garrison (6 e1 vs 5). The establishment quota
  # stays at 5 (one build); the difficulty axis is the heavier
  # anti-stall pressure and the longer dwell at the garrison.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Tougher version: THREE enemy heavy tanks (4tnk) picket the lane
    # mouth (x=24, y=18..24) and engage on contact — a stalling column is
    # ground down fast. The eastern garrison is now 6 rifle infantry at
    # x=80. Your column of 4 is BELOW the required establishment of 5
    # heavy tanks; reserve cash (1500 cr) covers the one 3tnk you must
    # build. Win when you have killed ≥5 enemy units AND you have ≥5 heavy
    # tanks alive AND your construction yard is intact, before tick 5400.
    # Stalling, and assaulting without building up to establishment, both
    # LOSE.
    description: >
      Same production base and column of four. THREE enemy heavies picket
      the lane mouth and six rifles guard the eastern yard. Reserve covers
      one more 3tnk — build up to the five-tank establishment and attack
      east. Five tanks alive, five kills, yard standing, within about 60
      turns.
    starting_cash: 1500
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: powr, owner: agent, position: [10, 18]}
        - {type: weap, owner: agent, position: [12, 18]}
        - {type: fix,  owner: agent, position: [14, 18]}
        # 4 combat tanks — ONE below the establishment quota of 5.
        - {type: '3tnk', owner: agent, position: [28, 18], stance: 2}
        - {type: '3tnk', owner: agent, position: [28, 20], stance: 2}
        - {type: '3tnk', owner: agent, position: [28, 22], stance: 2}
        - {type: '3tnk', owner: agent, position: [28, 24], stance: 2}
        # 3 lane-mouth pickets (4tnk, stance:3): broader anti-stall
        # footprint than easy; kill fodder for a moving column.
        - {type: '4tnk', owner: enemy, position: [24, 18], stance: 3}
        - {type: '4tnk', owner: enemy, position: [24, 21], stance: 3}
        - {type: '4tnk', owner: enemy, position: [24, 24], stance: 3}
        # Garrison: 6 e1 at x=80..82.
        - {type: e1, owner: enemy, position: [80, 18], stance: 1}
        - {type: e1, owner: enemy, position: [80, 20], stance: 1}
        - {type: e1, owner: enemy, position: [80, 22], stance: 1}
        - {type: e1, owner: enemy, position: [80, 24], stance: 1}
        - {type: e1, owner: enemy, position: [82, 20], stance: 1}
        - {type: e1, owner: enemy, position: [82, 22], stance: 1}
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {unit_type_count_gte: {type: '3tnk', n: 5}}
        - {units_killed_gte: 5}
        - {has_building: fact}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {own_units_gte: 1}}
        - {not: {has_building: fact}}
    max_turns: 60

  # ── HARD ────────────────────────────────────────────────────────
  # +2 controlled variables vs medium:
  #   1. TWO seed-driven AGENT spawn_point groups (NORTH y=14 vs
  #      SOUTH y=28 e1 scout). The central combat force (4× 3tnk at
  #      y=18..24) and base buildings are SHARED across the two
  #      groups so the strike geometry is symmetric, but a memorised
  #      opening cannot generalise: the scout's location flips per
  #      seed and reveals it. (CLAUDE.md: enemy actors are NOT
  #      spawn-filtered, so the 3 strikers + garrison + far fact
  #      always place; only AGENT actors honour `spawn_point`, and
  #      ANY agent actor with a spawn_point causes every agent
  #      actor WITHOUT one to be filtered out — so base buildings
  #      are duplicated across BOTH spawn groups at identical cells.)
  #   2. A higher establishment quota (6 ⇒ TWO mandatory builds) with
  #      a 3450 cr reserve to cover them. The triage failure is
  #      sharper at the higher quota — a single build is no longer
  #      enough.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Hard tier: TWO seed-driven base orientations (a NORTH-flank scout at
    # (16,14) on spawn 0; a SOUTH-flank scout at (16,28) on spawn 1) keep
    # the strike geometry symmetric but defeat a memorised opening. Three
    # enemy heavy tanks (4tnk) picket the lane mouth; the eastern garrison
    # is 6 rifle infantry at x=80. Your column of 4 is BELOW the required
    # establishment of 6 heavy tanks; reserve cash (3450 cr) covers the
    # two 3tnk you must build. Win when you have killed ≥5 enemy units AND
    # you have ≥6 heavy tanks alive AND your construction yard is intact,
    # before tick 5400. Stalling, and assaulting without building up to
    # establishment, both LOSE; the intended play is to build BOTH missing
    # tanks AND attack_move east in parallel.
    description: >
      Same task, but the column scout spawns NORTH (y=14) or SOUTH (y=28)
      by seed. Three enemy heavies picket the lane mouth; six rifles guard
      the eastern yard. $3450 reserve covers TWO more 3tnks — build to a
      six-tank establishment AND attack-move east in parallel. Six tanks
      alive, five kills, yard standing, within about 60 turns.
    starting_cash: 3450
    overrides:
      actors:
        # SPAWN 0 — NORTH-flank scout at (16,14).
        # Base buildings + central combat force duplicated across
        # both spawn groups (per CLAUDE.md: ANY agent actor with a
        # spawn_point causes agent actors WITHOUT spawn_point to be
        # filtered out — so EVERY agent actor must declare
        # spawn_point).
        - {type: fact, owner: agent, position: [8, 18], spawn_point: 0}
        - {type: powr, owner: agent, position: [10, 18], spawn_point: 0}
        - {type: weap, owner: agent, position: [12, 18], spawn_point: 0}
        - {type: fix,  owner: agent, position: [14, 18], spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [28, 18], stance: 2, spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [28, 20], stance: 2, spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [28, 22], stance: 2, spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [28, 24], stance: 2, spawn_point: 0}
        - {type: e1, owner: agent, position: [16, 14], stance: 0, spawn_point: 0}
        # SPAWN 1 — SOUTH-flank scout at (16,28).
        - {type: fact, owner: agent, position: [8, 18], spawn_point: 1}
        - {type: powr, owner: agent, position: [10, 18], spawn_point: 1}
        - {type: weap, owner: agent, position: [12, 18], spawn_point: 1}
        - {type: fix,  owner: agent, position: [14, 18], spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [28, 18], stance: 2, spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [28, 20], stance: 2, spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [28, 22], stance: 2, spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [28, 24], stance: 2, spawn_point: 1}
        - {type: e1, owner: agent, position: [16, 28], stance: 0, spawn_point: 1}
        # 3 lane-mouth pickets (4tnk, stance:3; enemy actors place on
        # every seed — enemy actors do NOT honour spawn_point).
        - {type: '4tnk', owner: enemy, position: [24, 18], stance: 3}
        - {type: '4tnk', owner: enemy, position: [24, 21], stance: 3}
        - {type: '4tnk', owner: enemy, position: [24, 24], stance: 3}
        - {type: e1, owner: enemy, position: [80, 18], stance: 1}
        - {type: e1, owner: enemy, position: [80, 20], stance: 1}
        - {type: e1, owner: enemy, position: [80, 22], stance: 1}
        - {type: e1, owner: enemy, position: [80, 24], stance: 1}
        - {type: e1, owner: enemy, position: [82, 20], stance: 1}
        - {type: e1, owner: enemy, position: [82, 22], stance: 1}
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {unit_type_count_gte: {type: '3tnk', n: 6}}
        - {units_killed_gte: 5}
        - {has_building: fact}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {own_units_gte: 1}}
        - {not: {has_building: fact}}
    max_turns: 60
