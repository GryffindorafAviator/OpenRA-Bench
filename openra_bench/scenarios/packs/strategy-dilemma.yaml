meta:
  id: strategy-dilemma
  title: 'Risk Dilemma — Destroy the Enemy Economy via the Safer Route'
  capability: reasoning
  real_world_meaning: 'Two routes to the objective: a safe-but-long path vs a short-but-lethal
    one. The decision is route risk assessment under a deadline, not pathfinding itself.'
  robotics_analogue: Field-robot route selection rejecting a hazardous shortest path
    for a survivable longer one within a time window.
  benchmark_anchor:
    - "PlanBench"
    - "ARC spatial reasoning"
    - "risk-aware route selection"
  author: ported-from-training
