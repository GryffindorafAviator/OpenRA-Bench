levels:
  easy:
    # ENGINE NOTE (contributors): the lethal central cluster blocks the
    # direct west-to-east lane; a flanking detour past the cluster exists
    # and is the survivable route. Briefing per F1 \u00a79.5 names the cluster
    # and the objective but NOT the route by direction.
    description: >
      Raze the enemy's economic core (construction yard and ore refinery)
      to the east. A heavy defensive cluster — two pillboxes (stationary
      defensive turrets), one Tesla coil, four rifle and rocket infantry
      — sits across the middle of the map and shreds anything that drives
      straight through. Reach the base and eliminate construction yard
      and ore refinery within about 50 turns.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - within_ticks: 4500
    fail_condition:
      any_of:
      - not: {within_ticks: 4500}
      - not: {own_units_gte: 1}
    max_turns: 55
  medium:
    # ENGINE NOTE (contributors): same as easy, plus a tighter clock and
    # a 7-loss attrition cap that punishes a brawl through the cluster.
    description: >
      Same yard-and-refinery objective, same lethal central defensive
      cluster — but a tighter clock and a hard cap of seven losses. A
      costly brawl no longer wins even if you reach the base. Finish
      within about 40 turns.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - within_ticks: 3600
      - units_lost_lte: 7
    fail_condition:
      any_of:
      - not: {within_ticks: 3600}
      - not: {units_lost_lte: 7}
      - not: {own_units_gte: 1}
    max_turns: 45
  hard:
    description: >
      Same yard-plus-refinery objective and the same central cluster of
      pillboxes, Tesla coil, and rocket soldiers. The clock tightens to
      about 30 turns and the loss cap drops to five. The direct lane is
      unsurvivable at this attrition cap.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - within_ticks: 2700
      - units_lost_lte: 5
    fail_condition:
      any_of:
      - not: {within_ticks: 2700}
      - not: {units_lost_lte: 5}
      - not: {own_units_gte: 1}
    max_turns: 35
