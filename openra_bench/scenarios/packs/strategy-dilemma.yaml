levels:
  easy:
    description: >
      Risk Dilemma \u2014 destroy the enemy's key economic buildings
      (construction yard + refinery). A heavy defensive cluster (two
      pillboxes, a Tesla coil and four rifles) blocks the DIRECT
      west-to-east lane; charging straight through it gets the force
      wiped before it ever reaches the base. The NORTHERN flank past
      that cluster is lightly held \u2014 take the safer route, reach the
      base, eliminate fact+proc before the clock runs out.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - within_ticks: 4500
    fail_condition:
      any_of:
      - not: {within_ticks: 4500}
      - not: {own_units_gte: 1}
    max_turns: 55
  medium:
    description: >
      Same objective (fact+proc) and the same lethal central cluster,
      but a tighter clock AND an attrition cap: a costly brawl no longer
      counts as a win even if you reach the base. Take the safer
      northern flank \u2014 losing more than 7 units fails the raid.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - within_ticks: 3600
      - units_lost_lte: 7
    fail_condition:
      any_of:
      - not: {within_ticks: 3600}
      - not: {units_lost_lte: 7}
      - not: {own_units_gte: 1}
    max_turns: 45
  hard:
    description: >
      fact+proc destroyed, tight clock, strict attrition: only a clean
      raid that takes the lightly-held northern flank and avoids the
      central pillbox/Tesla cluster wins; brute-forcing the direct lane
      (or dithering) loses. Lose more than 5 units and the raid fails.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - within_ticks: 2700
      - units_lost_lte: 5
    fail_condition:
      any_of:
      - not: {within_ticks: 2700}
      - not: {units_lost_lte: 5}
      - not: {own_units_gte: 1}
    max_turns: 35
