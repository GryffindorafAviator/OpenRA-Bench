meta:
  id: adversarial-skirmish
  title: 'Adversarial: Outnumbered Skirmish'
  capability: adversarial
  real_world_meaning: "Win while outnumbered by trading space for time:\
    \ pick fights, retreat, and re-engage a reactive enemy on favourable\
    \ terms instead of a head-on brawl — asymmetric tactical reasoning."
  robotics_analogue: "Asymmetric adversarial control: a smaller agent team\
    \ must defeat a larger reactive force by engagement selection."
  author: openra-bench
base_map: rush-hour-arena
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  actors:
  - type: 2tnk
    owner: agent
    position: [6, 9]
    stance: 3
    health: 100
    facing: -1
    count: 2
  - type: e1
    owner: enemy
    position: [30, 20]
    stance: 3
    health: 100
    facing: -1
    count: 4
levels:
  easy:
    description: 'Rung 1 — 2 tanks vs 4 rifle: doable if you fight smart.'
    win_condition:
      all_of:
      - units_killed_gte: 4
      - within_ticks: 14000
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 60
  medium:
    description: 'Rung 2 — 2 tanks vs 6 mixed: must split the enemy.'
    overrides:
      actors:
      - type: 2tnk
        owner: agent
        position: [6, 9]
        stance: 3
        health: 100
        facing: -1
        count: 2
      - type: e1
        owner: enemy
        position: [30, 20]
        stance: 3
        health: 100
        facing: -1
        count: 4
      - type: 1tnk
        owner: enemy
        position: [35, 24]
        stance: 3
        health: 100
        facing: -1
        count: 2
    win_condition:
      all_of:
      - units_killed_gte: 6
      - within_ticks: 12000
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 70
  hard:
    description: 'Rung 3 — 3 tanks vs 8, loss-capped: maneuver or lose.'
    overrides:
      actors:
      - type: 2tnk
        owner: agent
        position: [6, 9]
        stance: 3
        health: 100
        facing: -1
        count: 3
      - type: e1
        owner: enemy
        position: [30, 20]
        stance: 3
        health: 100
        facing: -1
        count: 5
      - type: 1tnk
        owner: enemy
        position: [35, 24]
        stance: 3
        health: 100
        facing: -1
        count: 3
    win_condition:
      all_of:
      - units_killed_gte: 8
      - within_ticks: 10000
      - units_lost_lte: 2
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 80
