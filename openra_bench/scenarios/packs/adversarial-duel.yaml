meta:
  id: adversarial-duel
  title: 'Adversarial: Force Duel'
  capability: adversarial
  real_world_meaning: "Defeat a reactive opposing force of escalating strength:\
    \ focus-fire, target priority and kiting against an enemy that fights\
    \ back — head-to-head tactical reasoning, not micro against a dummy."
  robotics_analogue: "Adversarial multi-agent engagement: prevail over a\
    \ reactive opponent team whose strength increases each ladder rung."
  author: openra-bench
base_map: rush-hour-arena
# The ladder: easy/medium/hard are rungs of increasing enemy strength.
# A model's adversarial rating = the highest rung it can clear (see
# adversarial.ladder_rating); models are Elo-ranked on shared rungs.
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  actors:
  - type: 2tnk
    owner: agent
    position: [6, 8]
    stance: 3
    health: 100
    facing: -1
    count: 2
    randomize:
      position:
        base: [6, 8]
        offset: 2
  - type: 1tnk
    owner: agent
    position: [6, 11]
    stance: 3
    health: 100
    facing: -1
    count: 2
  - type: e1
    owner: enemy
    position: [34, 22]
    stance: 3
    health: 100
    facing: -1
    count: 3
levels:
  easy:
    description: 'Rung 1 — even-ish duel: 4 agent vehicles vs 3 enemy rifle.'
    win_condition:
      all_of:
      - units_killed_gte: 3
      - within_ticks: 14000
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 60
  medium:
    description: 'Rung 2 — outnumbered: same force vs a reactive armour mix.'
    overrides:
      actors:
      - type: 2tnk
        owner: agent
        position: [6, 8]
        stance: 3
        health: 100
        facing: -1
        count: 2
        randomize:
          position:
            base: [6, 8]
            offset: 2
      - type: 1tnk
        owner: agent
        position: [6, 11]
        stance: 3
        health: 100
        facing: -1
        count: 2
      - type: e1
        owner: enemy
        position: [34, 22]
        stance: 3
        health: 100
        facing: -1
        count: 4
      - type: 1tnk
        owner: enemy
        position: [38, 26]
        stance: 3
        health: 100
        facing: -1
        count: 2
    win_condition:
      all_of:
      - units_killed_gte: 6
      - within_ticks: 12000
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 70
  hard:
    description: >
      Rung 3 — badly outnumbered + a loss cap, and the agent force
      starts from a seed-chosen corner (two spawn_point groups → the
      env round-robins start position by seed, so a single memorised
      opening can't generalise). Enemy sits mid-map beyond initial
      sight: must close under fog.
    overrides:
      actors:
      # spawn_point 0 — top-left staging
      - type: 2tnk
        owner: agent
        position: [6, 8]
        stance: 3
        health: 100
        facing: -1
        count: 2
        spawn_point: 0
        randomize:
          position:
            base: [6, 8]
            offset: 3
      - type: 1tnk
        owner: agent
        position: [6, 11]
        stance: 3
        health: 100
        facing: -1
        count: 2
        spawn_point: 0
      # spawn_point 1 — lower-left staging (different approach axis)
      - type: 2tnk
        owner: agent
        position: [6, 40]
        stance: 3
        health: 100
        facing: -1
        count: 2
        spawn_point: 1
        randomize:
          position:
            base: [6, 40]
            offset: 3
      - type: 1tnk
        owner: agent
        position: [6, 43]
        stance: 3
        health: 100
        facing: -1
        count: 2
        spawn_point: 1
      - type: e1
        owner: enemy
        position: [34, 22]
        stance: 3
        health: 100
        facing: -1
        count: 5
      - type: 2tnk
        owner: enemy
        position: [40, 28]
        stance: 3
        health: 100
        facing: -1
        count: 3
    win_condition:
      all_of:
      - units_killed_gte: 8
      - within_ticks: 10000
      - units_lost_lte: 3
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 80
