meta:
  id: adversarial-duel
  title: '1v1 Combat Duel — Beat a Reactive Enemy at Close Range'
  capability: adversarial
  real_world_meaning: >
    A close-quarters force-on-force fight against an enemy that shoots
    back: the decision is combat micro — concentrate fire on one
    target, retreat damaged units, trade favourably. The enemy starts
    just to the east, in or near sight, so this is a DUEL, not a
    search (finding scattered enemies on a big map is tested
    separately). Difficulty escalates the opponent, not the search.
  robotics_analogue: >
    Adversarial multi-agent engagement at close range: prevail over a
    reactive opponent team by target selection and damage trading.
  author: openra-bench
# Per-pack tailored 64×40 arena. The duel is INTENTIONALLY close-range
# — the agent's force at x=6 and the enemy's at x=17..20 are 11..14
# cells apart, well inside 2tnk weapon range (~5c) after one move
# turn. A 128-cell-wide map is overkill; the smaller 64x40 arena
# matches the duel's "this is a fight, not a search" thesis and
# isolates the capability from any long-distance pathing concern.
# Hard tier's spawn_point=0/1 staging (y=19..21 north / y=33..35
# south) fits cleanly inside the smaller height (h=40, playable
# y in [2..37]); enemy units at y=20..22 stay near the centreline
# under either spawn so the seeded engagement geometry is identical.
base_map:
  generator: arena
  name: adversarial-duel-arena
  width: 64
  height: 40
  cordon: 2
  title: 'Adversarial Duel — 64x40 Close-Range Arena'
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  # Re-decide the instant contact happens or a unit is lost, instead
  # of only on fixed tick boundaries — combat is reactive.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  actors:
  - type: 2tnk
    owner: agent
    position: [6, 19]
    stance: 0
    health: 100
    facing: -1
    count: 2
  - type: 1tnk
    owner: agent
    position: [6, 21]
    stance: 0
    health: 100
    facing: -1
    count: 2
  # Enemy just east, same latitude — move right to engage.
  - type: e1
    owner: enemy
    position: [17, 20]
    stance: 3
    health: 100
    facing: -1
    count: 3
levels:
  easy:
    description: >
      Even duel: your 4 vehicles vs 3 enemy rifle infantry a short
      move east. Win by destroying the enemy force without losing all
      of yours.
    win_condition:
      all_of:
      - units_killed_gte: 3
      - within_ticks: 2400
    # within_ticks 2400 is the non-stalling deadline (reachable: tick
    # ≈ 93+90·(max_turns-1) = 2703 at turn 30). A staller hits
    # after_ticks 2401 and LOSES instead of drawing; the intended
    # attack-east play wins by ~tick 360, far inside the budget.
    fail_condition:
      any_of:
      - after_ticks: 2401
      - {not: {own_units_gte: 1}}
    max_turns: 30
  medium:
    description: >
      Tougher opponent: the enemy rifle squad is backed by light
      armour. Same close engagement; concentrate fire to win the trade.
    overrides:
      actors:
      - type: 2tnk
        owner: agent
        position: [6, 19]
        stance: 0
        health: 100
        facing: -1
        count: 2
      - type: 1tnk
        owner: agent
        position: [6, 21]
        stance: 0
        health: 100
        facing: -1
        count: 2
      - type: e1
        owner: enemy
        position: [17, 20]
        stance: 3
        health: 100
        facing: -1
        count: 3
      - type: 1tnk
        owner: enemy
        position: [19, 21]
        stance: 3
        health: 100
        facing: -1
        count: 2
    win_condition:
      all_of:
      - units_killed_gte: 5
      - within_ticks: 3000
    # Deadline reachable within max_turns (tick ≈ 3603 at turn 40);
    # after_ticks 3001 makes a staller LOSE. Intended win ≈ tick 450.
    fail_condition:
      any_of:
      - after_ticks: 3001
      - {not: {own_units_gte: 1}}
    max_turns: 40
  hard:
    description: >
      Outnumbered + a loss cap, starting from a seed-chosen corner
      (two spawn_point groups). Win the close fight by maneuver, not
      attrition.
    overrides:
      actors:
      - type: 2tnk
        owner: agent
        position: [6, 19]
        stance: 0
        health: 100
        facing: -1
        count: 2
        spawn_point: 0
        randomize:
          position: {base: [6, 19], offset: 3}
      - type: 1tnk
        owner: agent
        position: [6, 21]
        stance: 0
        health: 100
        facing: -1
        count: 2
        spawn_point: 0
      - type: 2tnk
        owner: agent
        position: [6, 33]
        stance: 0
        health: 100
        facing: -1
        count: 2
        spawn_point: 1
        randomize:
          position: {base: [6, 33], offset: 3}
      - type: 1tnk
        owner: agent
        position: [6, 35]
        stance: 0
        health: 100
        facing: -1
        count: 2
        spawn_point: 1
      - type: e1
        owner: enemy
        position: [17, 20]
        stance: 3
        health: 100
        facing: -1
        count: 5
      - type: 2tnk
        owner: enemy
        position: [20, 22]
        stance: 3
        health: 100
        facing: -1
        count: 3
    win_condition:
      all_of:
      - units_killed_gte: 8
      - within_ticks: 4000
      - units_lost_lte: 3
    # Deadline reachable within max_turns (tick ≈ 4503 at turn 50);
    # after_ticks 4001 makes a staller LOSE. Exceeding the loss cap
    # (units_lost > 3) also loses immediately rather than drawing.
    # Intended maneuvering win ≈ tick 540, far inside the budget.
    fail_condition:
      any_of:
      - after_ticks: 4001
      - {not: {units_lost_lte: 3}}
      - {not: {own_units_gte: 1}}
    max_turns: 50
# Runnable configurations (each a distinct cell):
#   easy   = the duel with STRUCTURED-TEXT fog (no minimap image)
#   medium = the duel with the PNG MINIMAP fog
configs:
- {name: easy,   level: easy,   fog_mode: structured}
- {name: medium, level: medium, fog_mode: vision}
