# ECON-SECOND-BASE-RACE — symmetric tempo expansion to a contested
# centre resource. The agent and a scripted enemy bot ("turtle")
# mirror each other on opposite edges of the map; each side owns a
# Construction Yard, a Power Plant, and an idle Ore Truck. ONE rich
# ore patch (declared via the resource-wave `ore_patches:` knob)
# sits at the dead centre of the map; the enemy has a mirrored
# patch on its side that it can already exploit from t=0. Neither
# side starts with a refinery on the agent's arc (the enemy has a
# pre-placed `proc` for its OWN local patch only). Distance from
# the agent base to the contested centre patch is large (~50 cells),
# so a refinery placed BACK AT THE BASE leaves the harvester with
# a 100-cell round-trip — income too slow to clear the cash bar
# inside the clock. The intended play is to expand FORWARD: spend
# the 1400 on a `proc` and drop it adjacent to the centre patch so
# the harv's round-trip is a handful of cells. The capability under
# test is the TEMPO decision to seize the contested resource hex
# BEFORE the clock — not how many refineries to build, not which
# faction to pick, just whether to commit the second-base spend to
# the centre.
#
# Migration note (2026-05-22): this pack originally used neutral
# `{type: mine, owner: neutral}` actors to seed ore at the centre
# and at the enemy's side. The previous author flagged that the
# `ore_patches:` top-level YAML knob "did not materialise in this
# wheel" — that was actually a bench-side schema bug (the top-level
# field was silently dropped by pydantic because `ScenarioPack` did
# not declare it). Schema fix lives in
# `openra_bench/scenarios/schema.py::ScenarioPack.ore_patches`; the
# wheel was already correctly seeding ore from the engine YAML
# whenever the field reached it. This pack is now migrated to use
# `ore_patches:` directly (canonical resource-wave wiring,
# consistent with `econ-mine-and-grow` and `econ-contested-
# expansion`), which also surfaces the centre cells in the
# `ore_cells:` observation channel — the model can SEE where to
# place the proc instead of having to remember the centre
# coordinate.
#
# The enemy is a real opponent on this map — the agent observes a
# mirrored enemy fact+powr+proc+harv on the opposite side, a
# `turtle` scripted bot keeps the enemy's units passive (they hold
# spawn, return-fire only, never advance on the agent), and the
# enemy harv has its own pre-mined ore patch + proc adjacent so the
# enemy economy runs from t=0. The race FRAMING is symmetric
# (visible mirror in the obs) even though the win predicate is
# clock-vs-cash. Per-player `enemy_cash` is NOT surfaced by the
# observation adapter in this wheel — the predicate grammar has
# no `enemy_cash_gte` (see `win_conditions.py`) — so the loss
# clause is a clean `after_ticks` clock buzzer, NOT a comparison of
# economies. The enemy's running economy is narrative flavor, not a
# scoring axis. The agent that stalls or expands toward home
# watches (in the unit_positions / ore_cells channels) the enemy
# harv cycling on its own patch while their own harv sits idle.
#
# Win  (intended): build('proc') + place_building('proc', x, y)
#       adjacent to the CENTRE ore patch, then move_units(harv,
#       x, y) to the patch and harvest(harv, x, y). The auto-spawn
#       harvester that `place_building` ships with the new refinery
#       (engine quirk #1 below) lands ON the patch and cycles
#       immediately; tight round-trip clears the cash bar before
#       the clock.
# Lose (stall):    no proc placed, no orders → harv idle → no
#       income → after_ticks fires → LOSS (clean clock loss; the
#       turtle bot won't approach so there is no force-wipe DRAW
#       risk).
# Lose (defensive): build defensive pbox towers at home, no proc
#       → still no income → after_ticks LOSS.
# Lose (own-base): place the proc at the AGENT'S BASE (x≈15) →
#       harv round-trip to centre patch is ~100 cells per bale →
#       throughput too low → cash bar missed → LOSS. In practice
#       the harv's FSM, when ordered to harvest at a target ~50
#       cells away with a refinery 50 cells in the wrong direction,
#       enters "harvesting" status without actually pathing
#       (engine quirk #2 — long-range harvest-from-distant-proc
#       falls through to idle), so the own-base play is even less
#       productive than the naive round-trip arithmetic suggests.
#
# Engine facts used (verified against the installed wheel, per
# CLAUDE.md, re-confirmed on the post-migration scripted-policy
# probe at /tmp/probe.py):
#
# 1. `ore_patches:` (resource-wave) — each `{x, y, amount, radius}`
#    materialises as a disk of harvestable cells; per-cell density
#    is `clamp(amount / cells, 1, 12)` (see `seed_ore_patch` in
#    `openra-sim/src/resource.rs`). amount=12000, radius=4 → 49
#    cells × 12/cell = 588 ore units total, which converts to
#    ~5100 cash by the per-tick stored→cash drain. Plenty of
#    margin over the hard 4500 bar, and the patch IS depleted by
#    a single intended-play harvester by T≈30 (so the bar HEIGHT
#    is what separates the tiers, not patch lifetime).
# 2. `place_building('proc', x, y)` AUTO-SPAWNS a free `harv`
#    adjacent to the new refinery cell (the engine ships the
#    "worker that came with the queued refinery"). This is what
#    makes the FORWARD-placement intended play actually work: the
#    auto-spawn harv lands ON the centre patch and starts cycling
#    immediately on the very tick the proc finishes. The
#    scenario-placed harv at (18, 20) does NOT successfully
#    auto-route to a centre patch 50 cells away in this wheel
#    even when given an explicit `harvest(id, cx, cy)` order — it
#    flips to "harvesting" status but stays in place. The bar is
#    tuned so the auto-spawn harv alone is sufficient.
# 3. `proc` requires `powr` (gamerules.rs). Both sides have a
#    pre-placed `powr`; the only build decision in the agent's
#    arc is `proc` (and where to drop it).
# 4. `place_building` does not enforce build-adjacency — the
#    agent can legally drop the new proc at the centre patch
#    even though it's ~50 cells from the agent's fact
#    (CLAUDE.md). This is what makes the forward-expand play
#    possible.
# 5. `cash_gte: N` reads `economy.cash` (post-deposit drain).
#    `economy_value_gte: N` reads `cash + stored ore`. We use
#    `economy_value_gte` so an in-flight bale (unloaded ore on
#    its way to cash) counts toward the bar — the timing is
#    less brittle than waiting for the per-tick stored→cash
#    drain. Bars are tuned ABOVE the post-build residual
#    (2000 − 1400 = 600) so passive-cash-only never wins; the
#    deposits do.
# 6. Tick alignment: `within_ticks ≤ 93 + 90·(max_turns − 1)`.
#    All three tiers use max_turns 40 → ceiling 93 + 90·39 =
#    3603 ≥ 3600 ✓. The bar HEIGHT, not the clock, separates
#    the tiers (easy 2400, medium 3500, hard 4500 economy_value)
#    so the deadline always bites as a real LOSS not a draw.
#    Empirical separation (from the 4-policy validation grid):
#    intended (forward placement, auto-spawn on patch) reaches
#    ~5100 by T≈30 (patch depletion ceiling); own_base (home
#    placement + harvest-from-distance order) NEVER deposits and
#    sits at the 600 post-build residual; stall and defensive
#    sit at 600 / 1400 respectively.
# 7. The enemy `turtle` scripted bot holds its spawn position
#    and only return-fires (openra_bench/botgen.py). It will not
#    advance on the agent base, so this pack is a CLEAN clock
#    race — no enemy force-wipe DRAW risk, no agent-elimination
#    fail surprise.
# 8. Persistent far-edge enemy `fact` sentinel at the east edge
#    of the map keeps engine auto-`done` from collapsing the
#    episode to DRAW the instant the agent eliminates the enemy
#    (the agent has no incentive to attack on this pack, but the
#    sentinel is the CLAUDE.md belt-and-braces guarantee).
# 9. `spawn_point` filter is PER OWNER (Wave-9). On the hard
#    tier the AGENT base is round-robined NORTH (y=14) / SOUTH
#    (y=26) by seed; the enemy base + the centre patch shift to
#    matching latitudes. Two things are duplicated across BOTH
#    spawn groups: the persistent enemy sentinel (per the
#    CLAUDE.md auto-`done` mitigation) AND the centre/enemy ore
#    patches (top-level `ore_patches:` do not honour
#    `spawn_point`, so both latitudes' patches materialise every
#    seed; only the one on the agent's active latitude is
#    actually within the harv's reach). A memorised "place at
#    (60, 20)" opening fails because the centre shifts
#    vertically with the spawn.

meta:
  id: econ-second-base-race
  title: 'Econ Second-Base Race — Expand to the Contested Centre Patch'
  capability: reasoning
  real_world_meaning: >
    Tempo expansion to a contested centre resource under a real
    opponent. The agent owns a Construction Yard, a Power Plant,
    and an idle Ore Truck on one side of the map; a mirrored
    enemy owns the same composition plus a pre-running local
    refinery on the opposite side, and a single rich ore patch
    sits between them. The agent's base is too far from the
    centre for a refinery placed at home to be productive — the
    harvester's round-trip dominates throughput (and in practice
    the engine FSM refuses to even path a harv that far on a
    single harvest order). The capability under test is the
    TEMPO decision to commit the second-base spend (the 1400 for
    a refinery) to the contested hex BEFORE the clock, rather
    than building defensively at home or stalling. Reading the
    symmetric obs (own + enemy economy running in parallel via
    the ore_cells channel and the mirrored buildings_summary)
    and choosing forward placement is the load-bearing choice.
  robotics_analogue: >
    Forward-deploy a processing depot at a contested resource
    site faster than a peer agent. Two autonomous extraction
    operations arrive simultaneously on opposite sides of a
    shared deposit; each has a collector vehicle and a budget
    for one processing module. The team that drops its module
    adjacent to the deposit captures cycle-time-bounded
    throughput; the team that processes at base or sits on its
    budget loses the cash race. The decision is geographic
    commitment under a hard deadline with a peer in the loop.
  benchmark_anchor:
    - "SC2 expansion timing / second-base race"
    - "RTS contested-expand idiom (gold/ore in the middle)"
    - "tempo decision under symmetric initial conditions"
  author: openra-bench

base_map: rush-hour-arena
starting_cash: 2000

base:
  # Per-player cash plumbing is now load-bearing (per the recent
  # engine fix pinned by `tests/test_per_player_starting_cash.py`):
  # the bench's PlayerSetup defaults `agent.cash: 0` and `enemy.cash:
  # 0`, and the engine now honours per-player overrides *over* the
  # top-level `starting_cash`. Without `agent: {cash: 2000}` here the
  # agent starts at 0 and the build('proc') queue stalls at 0
  # progress (insufficient funds), so every policy LOSSes the cash
  # bar trivially — masking the real intended capability under test.
  # The top-level `starting_cash: 2000` (above) is still emitted as
  # the back-compat fallback for any player slot that omits the
  # per-player override.
  agent: {faction: allies, cash: 2000}
  enemy: {faction: soviet, cash: 0, bot_type: turtle}
  tools: [observe, build, place_building, move_units, harvest, stop]
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 8000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Symmetric mirror on y=20. Agent at (15,20), enemy at (113,20).
  # CENTRE ore patch at (64,20), radius 4 amount 12000 (588 ore
  # units → ~5100 cash ceiling). Bar economy_value 2400, within
  # 3600 ticks (max_turns 40). The enemy's proc + local patch run
  # silently — the agent's job is to spend the 1400 on a proc,
  # DROP IT NEAR the centre patch (e.g. (60, 20) — the
  # `place_building` auto-spawn lands the new harv adjacent on the
  # patch), and order harvest at the centre. Stall = no proc →
  # idle harv → after_ticks 3601 LOSS. Own-base placement = harv
  # can't path to centre patch (engine quirk #2) → 0 deposits →
  # bar missed → LOSS. Intended forward-expand placement clears
  # the bar by T≈14 (well before the buzzer).
  easy:
    description: >
      You have a Construction Yard ('fact'), a Power Plant ('powr'),
      and one idle Ore Truck ('harv') on the WEST side of the map.
      A mirrored ENEMY base (turtle bot — passive, return-fire only)
      sits on the east side; the enemy is already harvesting its
      local ore patch. ONE rich ore patch is visible in the
      ore_cells channel at the CENTRE of the map, around (64, 20).
      You have $2000. Build an Ore Refinery ('proc', cost 1400) and
      place it ADJACENT to the CENTRE patch — `place_building`
      auto-spawns a fresh harvester next to the new refinery, which
      starts cycling immediately. Win = economy_value (cash +
      stored ore) ≥ 2400 before tick 3600. Stalling leaves the
      harv idle (no income); placing the refinery at your base
      makes the round-trip too long and (in practice) leaves the
      harv unable to path to the distant patch; both lose on the
      clock.
    starting_cash: 2000
    overrides:
      actors:
        # AGENT base — west side, y=20 lane.
        - {type: fact, owner: agent, position: [15, 20]}
        - {type: powr, owner: agent, position: [15, 18]}
        - {type: harv, owner: agent, position: [18, 20]}
        # ENEMY base — east-side mirror. Pre-placed proc + harv so
        # the enemy economy runs from t=0 (the mirror in the obs
        # gives the race its narrative).
        - {type: fact, owner: enemy, position: [113, 20]}
        - {type: powr, owner: enemy, position: [113, 18]}
        - {type: proc, owner: enemy, position: [108, 20]}
        - {type: harv, owner: enemy, position: [110, 20]}
        # Persistent far-edge enemy sentinel — engine auto-`done`
        # mitigation per CLAUDE.md. Placed past the enemy base at
        # the playable east edge.
        - {type: fact, owner: enemy, position: [124, 20]}
      ore_patches:
        # CONTESTED CENTRE patch. radius 4 → 49 cells × 12/cell =
        # 588 ore (~5100 cash ceiling). Plenty of margin over the
        # hard tier's 4500 bar.
        - {x: 64, y: 20, amount: 12000, radius: 4}
        # ENEMY local patch adjacent to the enemy proc. Smaller
        # (radius 2, amount 3000 → ~2000 cash) so the enemy
        # economy is visibly running but not infinite; pure
        # narrative flavor, not a scoring axis (no enemy_cash
        # predicate in the grammar).
        - {x: 105, y: 20, amount: 3000, radius: 2}
    win_condition:
      all_of:
        - has_building: proc
        - economy_value_gte: 2400
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
    max_turns: 40

  # ── MEDIUM ───────────────────────────────────────────────────────
  # Same geography as easy, tighter bar (3500). A forward
  # placement adjacent to the centre patch still clears (intended
  # hits 3500 by T≈20 in the validation grid, ~5100 ceiling).
  # Home placement deposits nothing → LOSS. The enemy's economy
  # is identical to easy, so the mirrored obs still drives the
  # "race" framing.
  medium:
    description: >
      Same geography as easy — mirrored bases west (agent) and
      east (passive turtle enemy), one rich CENTRE ore patch at
      (64, 20). Tighter bar: economy_value ≥ 3500 before tick
      3600. The harvester's round-trip time per bale dominates
      throughput, so the refinery's placement relative to the
      centre patch is the only decision that matters. Stall,
      defensive-only, or own-base placement all lose on the
      clock.
    starting_cash: 2000
    overrides:
      actors:
        - {type: fact, owner: agent, position: [15, 20]}
        - {type: powr, owner: agent, position: [15, 18]}
        - {type: harv, owner: agent, position: [18, 20]}
        - {type: fact, owner: enemy, position: [113, 20]}
        - {type: powr, owner: enemy, position: [113, 18]}
        - {type: proc, owner: enemy, position: [108, 20]}
        - {type: harv, owner: enemy, position: [110, 20]}
        - {type: fact, owner: enemy, position: [124, 20]}
      ore_patches:
        - {x: 64, y: 20, amount: 12000, radius: 4}
        - {x: 105, y: 20, amount: 3000, radius: 2}
    win_condition:
      all_of:
        - has_building: proc
        - economy_value_gte: 3500
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
    max_turns: 40

  # ── HARD ─────────────────────────────────────────────────────────
  # Two distinct seed-driven spawn groups via spawn_point
  # (CLAUDE.md ≥2 hard-tier requirement). The AGENT base is
  # round-robined NORTH (y=14) or SOUTH (y=26) by seed; the
  # mirrored ENEMY base shifts to the matching latitude. The
  # CENTRE ore patches and the ENEMY local patches live at the
  # top-level `ore_patches:` block, which does NOT honour
  # `spawn_point` — both north and south patches materialise on
  # every seed (only the one on the agent's active latitude is
  # within harv reach; the other is harmless flavor). Per
  # CLAUDE.md the persistent far-edge sentinel is duplicated
  # across both enemy spawn groups. Highest bar (4500) on the
  # same 3600-tick clock as easy/medium — the intended forward
  # placement still reaches ~5100 cash by T≈30 (the patch
  # depletion ceiling), but a memorised "place at (60, 20)"
  # opening fails because the centre patch is on y=14 or y=26
  # per seed and the proc footprint at (60,20) blockades
  # nothing useful at the wrong y.
  hard:
    description: >
      Your Construction Yard, Power Plant, and idle Ore Truck
      spawn in the NORTH or SOUTH half of the map depending on
      the seed; the mirrored enemy base (passive turtle bot)
      mirrors your latitude. ONE rich ore patch sits on YOUR
      spawn latitude (north patch on a north spawn; south patch
      on a south spawn); a second mirror patch exists on the
      OTHER latitude but is too far from your harv to be useful.
      Build an Ore Refinery, place it ADJACENT to your latitude's
      centre patch — `place_building` auto-spawns a harvester on
      the patch — and order harvest there. economy_value ≥ 4500
      before tick 3600. Stalling, defensive-only play, and
      own-base placement all lose on the clock.
    starting_cash: 2000
    overrides:
      actors:
        # spawn_point 0 — NORTH agent base (y=14). Mirrored
        # enemy base on the north latitude. Persistent sentinel
        # duplicated for this spawn group.
        - {type: fact, owner: agent, position: [15, 14], spawn_point: 0}
        - {type: powr, owner: agent, position: [15, 12], spawn_point: 0}
        - {type: harv, owner: agent, position: [18, 14], spawn_point: 0}
        - {type: fact, owner: enemy, position: [113, 14], spawn_point: 0}
        - {type: powr, owner: enemy, position: [113, 12], spawn_point: 0}
        - {type: proc, owner: enemy, position: [108, 14], spawn_point: 0}
        - {type: harv, owner: enemy, position: [110, 14], spawn_point: 0}
        - {type: fact, owner: enemy, position: [124, 14], spawn_point: 0}
        # spawn_point 1 — SOUTH agent base (y=26). Mirror.
        - {type: fact, owner: agent, position: [15, 26], spawn_point: 1}
        - {type: powr, owner: agent, position: [15, 28], spawn_point: 1}
        - {type: harv, owner: agent, position: [18, 26], spawn_point: 1}
        - {type: fact, owner: enemy, position: [113, 26], spawn_point: 1}
        - {type: powr, owner: enemy, position: [113, 28], spawn_point: 1}
        - {type: proc, owner: enemy, position: [108, 26], spawn_point: 1}
        - {type: harv, owner: enemy, position: [110, 26], spawn_point: 1}
        - {type: fact, owner: enemy, position: [124, 26], spawn_point: 1}
      ore_patches:
        # Both centre patches materialise on every seed (ore_patches
        # do not honour spawn_point); only the one on the agent's
        # active latitude is reachable.
        - {x: 64, y: 14, amount: 12000, radius: 4}
        - {x: 64, y: 26, amount: 12000, radius: 4}
        # Enemy local patches, both latitudes, same justification.
        - {x: 105, y: 14, amount: 3000, radius: 2}
        - {x: 105, y: 26, amount: 3000, radius: 2}
    win_condition:
      all_of:
        - has_building: proc
        - economy_value_gte: 4500
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
    max_turns: 40
