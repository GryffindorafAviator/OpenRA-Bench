# combat-kite-jeep-vs-tank — combat micro: KITE a slow heavy unit
# with fast light raiders (Wave-4, Group D).
#
# 2026-05-23 audit (Family-1 #14): map shrunk from a tailored 128x40
# arena to 96x40 (3/4 the old width). The kite cycle's
# reactive-window geometry — kiters on the y=10 corridor, heavy on
# the y=20 mid latitude, hunt-bot chase along the diagonal — is
# preserved at the same engagement distances (heavy x=70/80, kiters
# x=28-30). The west retreat space (~26 cells from kiter start at
# x=28 to the cordon) is load-bearing and would not survive further
# shrinking. Briefing rewritten in plain English per
# audits/EDIT_PRINCIPLES.md.
#
# Engine note (verified 2026-05-23): bot_type:hunt + stance:2 on the
# enemy heavy DOES drive movement. The hunt bot issues an explicit
# Attack order each tick, and per CLAUDE.md "Explicit agent orders
# (attack_unit / attack_move) always override stance" — so the
# heavy actively closes on the kiters' centroid.
#
# Real-world anchors:
#   - SC2 kiting micro (vulture/muta vs marines): fast light unit
#     repeatedly moves into range, fires, retreats before the slower
#     bursty heavy unit can close and one-shot.
#   - Cavalry-vs-pikeman maneuver doctrine (charge to contact,
#     retreat, wheel, re-engage).
#   - Military fire-and-maneuver doctrine; skirmisher tactics.
#
# Idiom (the four-policy bar):
#   - stall (only observe) -> LOSS. The hunt-bot heavy closes on the
#     raiders' centroid; kill bar unmet -> after_ticks LOSS.
#   - stand-and-shoot (commit at range, never move) -> LOSS. The
#     heavy cannon out-trades raider weapons head-on; the raiders
#     die before the tank's HP runs out -> own_units_gte:3 busts.
#   - brute attack_move east -> LOSS. Same as commit.
#   - intended kite (move-AWAY when tank close, then attack_unit at
#     range; repeat) -> WIN.
#
# Pack-name note: catalogue id is `combat-kite-jeep-vs-tank` for
# continuity with the Wave-4 brainstorm. In OpenRA-Rust the jeep MG
# is anti-infantry and does not dent heavy armour, so the
# engine-realised "raider" is the allied medium tank 2tnk (faster
# than 3tnk and can damage heavy armour). The capability under test
# is the kite cycle — the unit pairing is the vehicle.

meta:
  id: combat-kite-jeep-vs-tank
  title: 'Combat Micro — Kite a Slow Heavy Tank with Fast Raiders'
  capability: action
  real_world_meaning: >
    Three fast tank raiders must kill ONE enemy heavy tank that is
    actively HUNTING the raiders' centroid. The only winning play is
    kiting: each turn, if the heavy tank is closing into one-shot
    range, MOVE the raiders AWAY (using their speed advantage) and
    attack_unit the heavy from outside its lethal close-range
    window. Repeat until the heavy falls. Stand-and-fight LOSES — the
    heavy tank's cannon out-trades raider weapons at close range and
    a static engagement collapses raider HP before the heavy's. The
    skill being measured is combat micro: target a moving threat,
    exploit the unit-speed asymmetry, and string together a sequence
    of move-away + attack_unit cycles instead of issuing one beeline
    order.
  robotics_analogue: >
    Fast/light agents defeating a slow/heavy adversary by exploiting
    a mobility asymmetry: a closed-loop policy of evade-then-engage,
    rather than a one-shot beeline. The decision under test is per-turn
    proximity control (stay outside lethal radius, fire at range).
  benchmark_anchor:
    - "SC2 kiting micro (vulture/muta-vs-marines)"
    - "cavalry-vs-pikeman maneuver"
    - "military fire-and-maneuver doctrine"
    - "skirmisher tactics"
  author: openra-bench

# Tailored 96x40 OPEN arena: playable x in [2..93], y in [2..37].
# Generator: arena with NO interior obstacles — every cell inside
# the cordon is clear ground so the raider has unimpeded reverse-
# fire mobility along the lane. Single explicit mpspawn at (6,20)
# pins coordinates seed-invariantly.
base_map:
  generator: arena
  name: combat-kite-jeep-vs-arena
  width: 96
  height: 40
  cordon: 2
  spawns: [[6, 20]]
  title: Kite Jeep vs Tank Arena 96x40

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: hunt}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  termination: {max_ticks: 6500}
  actors: []

levels:
  # ── EASY ────────────────────────────────────────────────────────────
  # Bare kite skill. The heavy stages CLOSER (x=70) than on
  # medium/hard so the kite-band is widest; the chaser HP is full,
  # the difficulty axis is the band width.
  easy:
    description: >
      Commander, this is a combat engagement against a hunting enemy
      heavy tank. You are given 3 fast medium-tank raiders
      (Return-Fire orders) on the north corridor at (28,9), (30,10),
      and (28,11). The enemy heavy tank at (70,20) on the mid
      latitude is actively closing on you; its cannon hits harder
      than yours and can one-shot a raider at close range. Kill the
      heavy with all 3 raiders alive, within 4500 ticks.
    overrides:
      actors:
        # RAIDERS — 3 medium tanks spread across three cells off the
        # heavy's centroid latitude (y≈10, not the heavy's y=20) so
        # the hunt-bot must close DIAGONALLY — the y-axis lag gives
        # the kite cycle its reactive window.
        - {type: 2tnk, owner: agent, position: [28,  9], stance: 1}
        - {type: 2tnk, owner: agent, position: [30, 10], stance: 1}
        - {type: 2tnk, owner: agent, position: [28, 11], stance: 1}
        # THE HEAVY — 3tnk Soviet heavy, staged CLOSER (x=70) so the
        # kite band is widest.
        - {type: 3tnk, owner: enemy, position: [70, 20], stance: 2}
        # Persistent far-east enemy fact — anti-DRAW.
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 1}
        - {own_units_gte: 3}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 3}}
    max_turns: 51

  # ── MEDIUM ──────────────────────────────────────────────────────────
  # +1 controlled variable vs easy: the heavy stages FURTHER east
  # (x=80 vs x=70 on easy), so it has more closing distance and the
  # kite-band narrows.
  medium:
    description: >
      Commander, this is a combat engagement against a hunting enemy
      heavy tank, staged deeper east. You are given 3 fast
      medium-tank raiders (Return-Fire orders) on the north corridor
      at (28,9), (30,10), and (28,11). The enemy heavy tank at
      (80,20) on the mid latitude is actively closing; its cannon
      hits harder than yours and one-shots a raider at close range.
      Kill the heavy with all 3 raiders alive, within 4500 ticks.
    overrides:
      actors:
        # Raiders stage off the tank's centroid latitude (y=10
        # corridor, not the tank's y=20) so the hunt-bot heavy must
        # close DIAGONALLY.
        - {type: 2tnk, owner: agent, position: [28,  9], stance: 1}
        - {type: 2tnk, owner: agent, position: [30, 10], stance: 1}
        - {type: 2tnk, owner: agent, position: [28, 11], stance: 1}
        # Heavy tank further east than easy — hunts the y=10 centroid.
        - {type: 3tnk, owner: enemy, position: [80, 20], stance: 2}
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 1}
        - {own_units_gte: 3}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 3}}
    max_turns: 51

  # ── HARD ────────────────────────────────────────────────────────────
  # +2 controlled variables vs medium:
  #   1. Tighter deadline (~3600 ticks instead of ~4500).
  #   2. TWO agent spawn_point groups (NORTH y=10 / SOUTH y=30) so
  #      the kite vector flips per seed.
  hard:
    description: >
      Commander, this is a combat engagement against a hunting enemy
      heavy tank. You are given 3 fast medium-tank raiders
      (Return-Fire orders) on either the north corridor (y=10) or
      the south corridor (y=30), depending on seed. The enemy heavy
      tank at (80,20) on the mid latitude is actively closing on
      your corridor; its cannon out-trades raider weapons at close
      range. Kill the heavy with all 3 raiders alive, within 3600
      ticks.
    overrides:
      actors:
        # spawn_point 0 — NORTH corridor (y=10)
        - {type: 2tnk, owner: agent, position: [28, 9],  stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [30, 10], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [28, 11], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH corridor (y=30)
        - {type: 2tnk, owner: agent, position: [28, 29], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [30, 30], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [28, 31], stance: 1, spawn_point: 1}
        # Heavy tank centred on the mid-latitude — symmetric pursuit
        # geometry from either spawn corridor.
        - {type: 3tnk, owner: enemy, position: [80, 20], stance: 2}
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 1}
        - {own_units_gte: 3}
        - {within_ticks: 3600}
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {own_units_gte: 3}}
    max_turns: 41
