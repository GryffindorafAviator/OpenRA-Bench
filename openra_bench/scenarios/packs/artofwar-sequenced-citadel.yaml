meta:
  id: artofwar-sequenced-citadel
  title: 'Staged Assault — Reach the Waypoints In Order, Then Seize the Citadel'
  capability: reasoning
  real_world_meaning: >
    攻其無備 — strike where unprepared, but only after the prerequisite
    moves. The mission is a STRICT ordered sub-goal chain: stage at A,
    then transit B, then seize the citadel C — and only after a
    deliberate hold (the strike is timed, not rushed). Reward lands
    only at C; A and B are unrewarded prerequisites whose ORDER is
    enforced (reaching C without having passed A then B counts for
    nothing). Long-horizon sub-goal sequencing with delayed terminal
    credit; a greedy beeline to C, or idling, fails.
  robotics_analogue: >
    Ordered multi-waypoint mission (stage → transit → objective) where
    only terminal success is rewarded, step order is hard-enforced
    (not merely graded), and the terminal action must wait out a hold
    — the Blocksworld/GAIA-style long-horizon plan.
  author: openra-bench

# Per-pack tailored 128×40 arena. The map identity matches the pack's
# topology: a strict ORDERED chain of waypoints from the agent west
# spawn through staging A (mid-west), transit B (north-centre on
# easy/medium; mid-south on hard's 4-point chain) to the citadel C
# at the far east. The arena is OPEN — the chain is enforced by the
# `waypoint_sequence` predicate and the timed window, not by terrain
# obstacles. The tailored identity is the long-axis 128×40 footprint
# with the citadel at x=110 (east-of-centre, anchoring the third/
# fourth waypoint as a deep objective) and the agent staging at x=6
# (a 100+-cell run-up so the chain takes meaningful turns to clear).
base_map:
  generator: arena
  name: artofwar-sequenced-citadel-arena
  width: 128
  height: 40
  cordon: 2
  title: 'Sequenced Citadel — 128x40 Ordered Waypoint Chain'

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: ''}
  tools: [move_units, attack_unit, stop]
  planning: true
  termination: {max_ticks: 12000}
  actors:
    - {type: 2tnk, owner: agent, position: [6, 20], stance: 1, count: 3}
    # Light pickets near B/C — contest the route, not a combat wall.
    - {type: e1, owner: enemy, position: [70, 12], stance: 2, count: 2}
    - {type: e1, owner: enemy, position: [104, 20], stance: 2, count: 2}
    # Citadel marker at C: unarmed high-HP landmark; also prevents the
    # enemy-elimination auto-terminal (so the ordered chain must be
    # completed — a picket-wipe can't end the episode early).
    - {type: fact, owner: enemy, position: [110, 20]}

levels:
  # ── EASY ── the bare ordered chain: A → B → C in order, then a
  # modest hold before the citadel counts. Generous clock. A beeline
  # straight to C never satisfies the ordered latch → timeout LOSS.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Strict ordered chain: first reach staging point A (mid-west),
    # then transit point B (north-centre), then seize the citadel C
    # (far east) — IN THAT ORDER. Reaching C without having passed A
    # then B counts for nothing. The strike is timed: C only counts
    # after the hold. A greedy beeline to C, or idling, loses on the
    # clock.
    description: >
      Visit staging point A (mid-west), transit point B (north-centre),
      then seize the citadel at C (far east) IN ORDER. C only counts
      after turn 13 and before turn 26. Light pickets contest the
      route.
    overrides: {}
    win_condition:
      all_of:
        - waypoint_sequence:
            id: S
            radius: 6
            points:
              - {x: 35, y: 20}
              - {x: 70, y: 12}
              - {x: 110, y: 20}
        - {after_ticks: 1100}
        - {within_ticks: 2300}
    fail_condition:
      any_of:
        - {after_ticks: 2301}
        - {not: {own_units_gte: 1}}
    max_turns: 30

  # ── MEDIUM ── +1 controlled variable: a longer prerequisite hold and
  # a tighter terminal deadline (the band is narrower — the strike must
  # be timed, not just ordered).
  medium:
    description: >
      Same ordered chain (A → B → C) but a longer prerequisite hold and
      a tighter terminal deadline — the strike window is narrow, so the
      order AND the timing both bind.
    win_condition:
      all_of:
        - waypoint_sequence:
            id: S
            radius: 6
            points:
              - {x: 35, y: 20}
              - {x: 70, y: 12}
              - {x: 110, y: 20}
        - {after_ticks: 1300}
        - {within_ticks: 2300}
    fail_condition:
      any_of:
        - {after_ticks: 2301}
        - {not: {own_units_gte: 1}}
    max_turns: 30

  # ── HARD ── +1 controlled variable: seed-chosen staging latitude
  # (two spawn_point groups, in-bounds — the approach can't be
  # memorised) + a four-point chain + an attrition cap.
  hard:
    description: >
      Four-point ordered chain from a seed-chosen latitude, narrow
      timed window, and a loss cap — seize the citadel with the force
      near-intact, in order, inside the band.
    overrides:
      actors:
        # spawn_point 0 — northern staging
        - {type: 2tnk, owner: agent, position: [6, 12], stance: 1, count: 3, spawn_point: 0}
        # spawn_point 1 — southern staging (same ordered task)
        - {type: 2tnk, owner: agent, position: [6, 30], stance: 1, count: 3, spawn_point: 1}
        - {type: e1, owner: enemy, position: [70, 12], stance: 2, count: 3}
        - {type: e1, owner: enemy, position: [104, 20], stance: 2, count: 3}
        - {type: fact, owner: enemy, position: [110, 20]}
    win_condition:
      all_of:
        - waypoint_sequence:
            id: S
            radius: 6
            points:
              - {x: 30, y: 20}
              - {x: 60, y: 30}
              - {x: 90, y: 10}
              - {x: 110, y: 20}
        - {after_ticks: 1400}
        - {within_ticks: 2300}
        - {units_lost_lte: 1}
    fail_condition:
      any_of:
        - {after_ticks: 2301}
        - {not: {units_lost_lte: 1}}
        - {not: {own_units_gte: 1}}
    max_turns: 32
