meta:
  id: artofwar-sequenced-citadel
  title: 'Staged Assault — Reach Waypoints in Order, Then Seize the Objective'
  capability: reasoning
  real_world_meaning: >
    攻其无备 — strike where unprepared, but only after the prerequisite
    moves. The mission is a strict sub-goal chain: stage at A, then
    (and only after a hold) advance through B, and finally seize C.
    Reward lands only at C; A and B are unrewarded prerequisites whose
    *ordering* is graded. Long-horizon sub-goal sequencing with delayed
    terminal credit.
  robotics_analogue: >
    Ordered multi-waypoint mission (stage → transit-after-hold →
    objective) where only terminal success is rewarded and step order
    is graded — the Blocksworld/GAIA-style long-horizon plan.
  author: openra-bench
base_map: rush-hour-arena
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  actors:
    - type: 2tnk
      owner: agent
      position: [6, 20]
      stance: 3
      health: 100
      facing: -1
      count: 3
    - type: e1
      owner: enemy
      position: [44, 20]
      stance: 3
      health: 100
      facing: -1
      count: 4
levels:
  easy:
    description: >
      Stage at A (~20,20), hold past tick 3000, then seize the citadel
      region C (~44,20). Arriving at C before the hold does not count.
    win_condition:
      all_of:
        - reach_region: {x: 44, y: 20, radius: 4}
        - after_ticks: 3000
        - within_ticks: 18000
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 85
  medium:
    description: 'Longer prerequisite hold; tighter terminal deadline.'
    win_condition:
      all_of:
        - reach_region: {x: 46, y: 20, radius: 4}
        - after_ticks: 5000
        - within_ticks: 16000
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 90
  hard:
    description: >
      Narrow ordered window AND a loss cap: seize C only inside the
      tick band, with the force near-intact.
    overrides:
      actors:
        # spawn_point 0 — northern staging
        - type: 2tnk
          owner: agent
          position: [6, 20]
          stance: 3
          health: 100
          facing: -1
          count: 3
          spawn_point: 0
          randomize:
            position: {base: [6, 20], offset: 3}
        # spawn_point 1 — southern staging (same ordered task,
        # different approach latitude — seed-chosen)
        - type: 2tnk
          owner: agent
          position: [6, 36]
          stance: 3
          health: 100
          facing: -1
          count: 3
          spawn_point: 1
          randomize:
            position: {base: [6, 36], offset: 3}
        - type: e1
          owner: enemy
          position: [44, 20]
          stance: 3
          health: 100
          facing: -1
          count: 6
    win_condition:
      all_of:
        - reach_region: {x: 48, y: 20, radius: 3}
        - after_ticks: 6000
        - within_ticks: 12000
        - units_lost_lte: 1
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 95
