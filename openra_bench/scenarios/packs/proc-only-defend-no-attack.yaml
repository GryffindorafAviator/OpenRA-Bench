# proc-only-defend-no-attack — defensive ROE under a strict no-attack
# tool ban. The agent's BASE (`fact` at 16,20) is being probed by a
# scripted `patrol` enemy that oscillates onto the asset row and CHIPS
# the fact each swing. The defenders are 5 riflemen clustered at the
# fact, STARTED on stance:0 (HoldFire) — they will NOT auto-engage
# without an explicit stance change. The mission is a defensive ROLE
# brief: the defenders are FORBIDDEN to take offensive action. The
# allowlist is `[move_units, set_stance, stop, observe]` — calling
# `attack_unit` or `attack_move` is an instant procedural violation
# (`tool_violations_gte: 1` ⇒ LOSS), regardless of tactical outcome.
#
# The intended-capability policy is:
#   1. RAISE the defenders' stance from HoldFire to Defend (2) or
#      AttackAnything (3) via `set_stance` — they then auto-fire on
#      any patroller that walks into range,
#   2. (optional) reposition defenders with `move_units` to keep them
#      between the fact and the probe vector — but NEVER `attack_unit`
#      / `attack_move`. The kills are racked up by the engine's
#      stance-driven auto-fire (the agent never CHOSE to attack).
#
# Real-world anchor: a security guard's standing orders — "fire only
# if engaged; do not pursue, do not initiate". The guard's role is
# positional + stance-driven; the offensive tool is off-limits even
# when an intruder is in view. This mirrors IFBench's negative
# instruction adherence ("do NOT X") and the military rules-of-
# engagement drill for a defensive role: stance and positioning are
# permitted; pursuit / attack orders are forbidden.
#
# Distinct from sibling procedural-compliance packs:
#   • proc-no-attack-passive-only: scout/recon role — the discipline
#     is movement-only and the engagement is the DISTRACTOR.
#   • strict-toolban-fidelity-under-pressure: transit task — distractor
#     patrol; movement-only allowlist; no stance verb on the allowlist.
#   • THIS pack:  defensive role — `set_stance` IS on the allowlist
#     (positional + stance discipline is the toolkit); the kills are
#     a CONSEQUENCE of correct stance setting, not of issuing an
#     attack command. The agent must DEFEND with positioning, not
#     by attacking.
#
# Failure modes (all real, reachable LOSSES; no draw degeneracy):
#   • Brute (attack_unit on the probe): tool_violations_gte:1 fires
#     on the first turn that issues the forbidden command. Tactically
#     winning the engagement is irrelevant — the mission is forfeit.
#   • Stall (only `observe`): defenders stay on stance:0 (HoldFire) so
#     they never engage; the patroller chips the fact unopposed until
#     it razes ⇒ `not has_building:fact` LOSS. (And the kill count
#     stays at 0, which independently busts `units_killed_gte:2`.)
#   • Intended (set_stance to Defend (2) + optionally reposition):
#     defenders auto-fire on every patrol swing-in; probes die in
#     waves; fact survives; ≥2 kills logged before the deadline → WIN.
#
# Engine-footgun notes (re-asserted on every level):
#   • `set_stance` is a first-class agent tool (openra_bench/agent.py
#     describes 0=HoldFire, 1=ReturnFire, 2=Defend, 3=AttackAnything).
#     Defenders started at stance:0 will NOT auto-fire until the agent
#     calls set_stance to lift it — this is what makes the discipline
#     load-bearing (a stall policy cannot win by accident).
#   • The bench's tool_violations counter (eval_core._cmd_tool_name)
#     counts each agent-invoked tool name BEFORE the engine evaluates
#     the order — even an attack_unit on a non-existent target id
#     counts as a violation. There is no escape hatch via invalid
#     arguments. (tests/test_forbidden_tools.py covers the primitive.)
#   • Persistent enemy marker (`fact` at the far east) keeps the
#     episode alive past the moment the probes die — without it the
#     engine would auto-done on enemy-wipe and collapse the deadline-
#     bound win evaluator to DRAW (CLAUDE.md engine fact #5).
#   • Tick budget: ~90 ticks/turn ⇒ max_tick ≤ 93 + 90·(max_turns-1).
#     after_ticks: 4501 with max_turns: 55 ⇒ 4501 ≤ 4953 ✓ (deadline
#     bites; non-win is a real LOSS, not a draw).
#   • patrol bot oscillates ±8 cells along x from each probe's spawn
#     (PATROL_RADIUS=8 in openra-sim/src/scripted_bot.rs); probes at
#     anchor (26,20) bounce [18,20]<->[34,20], coming into rifle range
#     of defenders on x=14..18 only when defenders are NOT
#     stance:0 — i.e. only when the agent has lifted the stance.
#
# Hard-tier curation: this pack IS spawn-varied on hard (defenders'
# staging latitude round-robins NORTH y=18 / SOUTH y=22 by seed —
# both cover the same fact column). Registered in
# tests/test_hard_tier.py::UPGRADED.
#
# Benchmark anchor: IFBench negative-instruction compliance; military
# rules-of-engagement (defensive role); BFCL V4 relevance / allowlist;
# security-guard doctrine (react only, don't pursue).

meta:
  id: proc-only-defend-no-attack
  title: 'Defensive ROE — Hold the Base Using Stance and Positioning, Not Attack Orders'
  capability: action
  real_world_meaning: >
    A defensive rules-of-engagement drill: the unit's brief is to hold
    a fixed asset (the base `fact`) against probing raiders, but the
    offensive tool (`attack_unit` / `attack_move`) is OFF-LIMITS. The
    only permitted commands are positional (`move_units`) and stance
    changes (`set_stance`) — the defenders auto-fire on intruders
    once their stance is lifted from HoldFire. A single forbidden
    attack order forfeits the mission. The skill is procedural: hold
    the role discipline (react only; do not pursue; do not initiate)
    even when the obvious local-solve is to call the attack tool.
  robotics_analogue: >
    A security guard's standing orders. Fire only if engaged; do not
    pursue, do not initiate. The guard's role is positional plus
    stance-driven; the offensive command is off the allowlist even
    when an intruder is in view. The mission succeeds when the
    asset is intact and the intruders that walked into the defended
    footprint were neutralised by the stance-driven auto-fire — NOT
    by the guard issuing an attack order.
  benchmark_anchor:
    - "IFBench negative-instruction compliance (do-NOT-X adherence)"
    - "military rules-of-engagement drill: defensive role"
    - "BFCL V4 relevance / allowlist (out-of-set tool calls = invalid)"
    - "security-guard doctrine: react only, don't pursue"
  author: "openra-bench"

base_map: rush-hour-arena

# Movement + stance allowlist. attack_unit / attack_move deliberately
# OMITTED from `tools:` AND listed in `forbidden_tools:` on every level.
# The bench's tool_violations counter is the BINDING rule — a model that
# ignores the tools: hint and calls attack_unit anyway is still measured
# by forbidden_tools.
base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: patrol}
  tools: [move_units, set_stance, stop, observe]
  planning: true
  termination: {max_ticks: 6000}
  actors:
    # The asset to defend: agent `fact` (the home base). has_building:fact
    # in the win condition enforces its survival; `not has_building:fact`
    # in the fail condition makes its loss an instant LOSS.
    - {type: fact, owner: agent, position: [16, 20]}
    # 5 defender riflemen clustered AT the fact, HoldFire (stance:0).
    # They DO NOT auto-engage unless the agent lifts the stance. This
    # is what makes the discipline load-bearing: a stall policy cannot
    # win by accident (defenders never fire; the probe chips fact).
    - {type: e1, owner: agent, position: [14, 18], stance: 0}
    - {type: e1, owner: agent, position: [14, 20], stance: 0}
    - {type: e1, owner: agent, position: [14, 22], stance: 0}
    - {type: e1, owner: agent, position: [13, 19], stance: 0}
    - {type: e1, owner: agent, position: [13, 21], stance: 0}
    # Persistent enemy marker far east — keeps the episode alive past
    # the moment the patrol probes die, so the win/fail evaluator sees
    # the terminal `has_building:fact` + deadline state instead of an
    # engine auto-done on enemy-wipe (CLAUDE.md engine fact #5).
    - {type: fact, owner: enemy, position: [120, 20]}

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare skill: ONE patrol probe; the agent must call set_stance once
  # to lift defenders from HoldFire and let them auto-engage. Stall →
  # 0 kills + fact chipped to death → LOSS on either clause. Brute →
  # instant tool_violations_gte:1 LOSS. Intended → ≥2 kills logged
  # before the deadline (the probe bounces back and forth, dies on the
  # first sustained contact ⇒ +1 kill from the probe itself; the
  # mission requires ≥2 so the agent must keep stance lifted across
  # respawn — wait, patrol doesn't respawn, so we provide TWO probes
  # to make the units_killed_gte:2 kill target reachable on easy).
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # DEFENSIVE ROE: hold your base (`fact` at 16,20) against THREE
    # probing raiders patrolling the central corridor (anchor ~22,20,
    # oscillating roughly 14..30). Your 5 riflemen sit on HOLD-FIRE
    # (stance:0) — they will NOT engage unless you lift their stance. You
    # may use `move_units` and `set_stance` to position and arm them. You
    # are FORBIDDEN to call `attack_unit` or `attack_move` — a single
    # forbidden call fails the mission immediately. Win when ≥2 raiders
    # are dead AND the fact still stands, before tick 4500. Stalling (the
    # fact gets chipped to death), force-loss past the cap, and timeout
    # all LOSE.
    description: >
      Defensive ROE: hold your yard at (16,20) against three raiders
      patrolling the central corridor. Your five rifles are on HoldFire —
      only set_stance and move_units are available; attack_unit and
      attack_move are FORBIDDEN, one call is an instant fail. Lift their
      stance, position them, kill two raiders. Yard alive, within about 50
      turns.
    overrides:
      actors:
        - {type: fact, owner: agent, position: [16, 20]}
        - {type: e1, owner: agent, position: [14, 18], stance: 0}
        - {type: e1, owner: agent, position: [14, 20], stance: 0}
        - {type: e1, owner: agent, position: [14, 22], stance: 0}
        - {type: e1, owner: agent, position: [13, 19], stance: 0}
        - {type: e1, owner: agent, position: [13, 21], stance: 0}
        # THREE patrol probes stacked at the central anchor (22,20).
        # Oscillation arc ±8 ⇒ [14,20]<->[30,20]; the western swing
        # puts the probes ON TOP OF the defender cluster (x=13..14)
        # so stance-lifted defenders auto-engage on every swing. Three
        # probes makes units_killed_gte:2 reachable with margin even
        # if one survives long enough to escape east between swings
        # (kills come from stance-driven auto-fire, not agent attack
        # orders).
        - {type: e1, owner: enemy, position: [22, 20], stance: 2, count: 3}
        - {type: fact, owner: enemy, position: [120, 20]}
    forbidden_tools: [attack_unit, attack_move]
    win_condition:
      all_of:
        - {has_building: fact}
        - {units_killed_gte: 2}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {has_building: fact}}
        - {tool_violations_gte: 1}
    max_turns: 55

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable vs easy: the probe count is bumped to 4 —
  # the chip-volley accelerates, the stall failure mode (fact razed)
  # arrives sooner; the intended set-stance policy still wins (more
  # targets reach the defended footprint → more kills accrue, the
  # ≥2 kill target is easier on the bigger volley; the discipline
  # pressure is what changes).
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # DEFENSIVE ROE: hold your base (`fact` at 16,20) against FOUR probing
    # raiders patrolling the central corridor (anchor ~22,20, oscillating
    # roughly 14..30). Your 5 riflemen are on HOLD-FIRE; use `move_units`
    # and `set_stance` to position and arm them. `attack_unit` and
    # `attack_move` are FORBIDDEN — one call is an INSTANT FAIL. Win when
    # ≥2 raiders are dead AND the fact still stands, before tick 4500.
    # Stalling, force-loss, and timeout all LOSE.
    description: >
      Same defensive ROE, four raiders on the central corridor. Use
      set_stance and move_units to position and arm the five rifles;
      attack orders fail the run instantly. Two kills, yard alive, within
      about 50 turns.
    overrides:
      actors:
        - {type: fact, owner: agent, position: [16, 20]}
        - {type: e1, owner: agent, position: [14, 18], stance: 0}
        - {type: e1, owner: agent, position: [14, 20], stance: 0}
        - {type: e1, owner: agent, position: [14, 22], stance: 0}
        - {type: e1, owner: agent, position: [13, 19], stance: 0}
        - {type: e1, owner: agent, position: [13, 21], stance: 0}
        # FOUR probes at the central anchor (22,20) — same oscillation
        # arc as easy (14..30 along x). Bigger chip-volley, tighter
        # window before fact razes if defenders stay on HoldFire.
        - {type: e1, owner: enemy, position: [22, 20], stance: 2, count: 4}
        - {type: fact, owner: enemy, position: [120, 20]}
    forbidden_tools: [attack_unit, attack_move]
    win_condition:
      all_of:
        - {has_building: fact}
        - {units_killed_gte: 2}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {has_building: fact}}
        - {tool_violations_gte: 1}
    max_turns: 55

  # ── HARD ─────────────────────────────────────────────────────────
  # +2 controlled variables versus medium:
  #   1. FIVE probes (was 4) AND TWO seed-driven SPAWN groups for the
  #      defenders — staging latitude rotates NORTH (y=17..19) vs
  #      SOUTH (y=21..23) by seed. The fact column (x=16) is constant;
  #      both staging slots cover the same defended footprint, but a
  #      memorised "move defenders to (14,20)" plan no longer fits
  #      both starts (the cluster geometry varies). spawn_point
  #      round-robin is honoured by Env on reset(seed) (CLAUDE.md
  #      engine fact: ONLY agent actors honour spawn_point; enemy
  #      probes always place regardless).
  #   2. The kill target tightens to ≥3 (the agent must keep the
  #      stance lifted across the FULL patrol cycle, not just the first
  #      swing — the 5-probe volley still has surplus targets even
  #      after the first round of kills, so the tighter target is
  #      reachable on a sustained stance lift but NOT on a one-shot
  #      lift-then-drop policy).
  # The intended set-stance policy still wins. Stall: stance:0 holds,
  # probes raze the fact. Brute: instant tool_violations LOSS.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # DEFENSIVE ROE: hold your base (`fact` at 16,20) against FIVE probing
    # raiders. Your 5 riflemen are HoldFire; their staging latitude (NORTH
    # ≈ y=18 or SOUTH ≈ y=22) is seed-driven and both slots cover the same
    # fact column. Use `move_units` and `set_stance` only — `attack_unit`
    # / `attack_move` are FORBIDDEN (one call = INSTANT FAIL). Win when ≥3
    # raiders are dead AND the fact still stands, before tick 4500.
    # Stalling, force-loss, and timeout all LOSE.
    description: >
      Same defensive ROE with FIVE raiders; your rifles stage at the NORTH
      (y≈18) or SOUTH (y≈22) row by seed, both covering the yard at
      (16,20). Position and arm with set_stance/move_units only — attack
      calls fail instantly. Three kills, yard alive, within about 50
      turns.
    overrides:
      actors:
        # The fact lives outside the spawn_point system (no spawn_point
        # tag on this actor — it's a building, always placed). But:
        # if ANY agent actor declares spawn_point, every agent actor
        # WITHOUT spawn_point is filtered OUT (CLAUDE.md engine fact)
        # — so we duplicate the fact across BOTH spawn groups at the
        # same cell.
        - {type: fact, owner: agent, position: [16, 20], spawn_point: 0}
        - {type: fact, owner: agent, position: [16, 20], spawn_point: 1}
        # spawn_point 0 — defenders staged NORTH of the fact row
        # (y=17..19). Cover the fact column from the north flank.
        - {type: e1, owner: agent, position: [14, 17], stance: 0, spawn_point: 0}
        - {type: e1, owner: agent, position: [14, 18], stance: 0, spawn_point: 0}
        - {type: e1, owner: agent, position: [14, 19], stance: 0, spawn_point: 0}
        - {type: e1, owner: agent, position: [13, 17], stance: 0, spawn_point: 0}
        - {type: e1, owner: agent, position: [13, 19], stance: 0, spawn_point: 0}
        # spawn_point 1 — defenders staged SOUTH of the fact row
        # (y=21..23). Same column, mirrored latitude.
        - {type: e1, owner: agent, position: [14, 21], stance: 0, spawn_point: 1}
        - {type: e1, owner: agent, position: [14, 22], stance: 0, spawn_point: 1}
        - {type: e1, owner: agent, position: [14, 23], stance: 0, spawn_point: 1}
        - {type: e1, owner: agent, position: [13, 21], stance: 0, spawn_point: 1}
        - {type: e1, owner: agent, position: [13, 23], stance: 0, spawn_point: 1}
        # FIVE patrol probes at central anchor (enemies always place
        # regardless of spawn_point — CLAUDE.md). Closer anchor
        # (22,20) brings the western swing ON TOP OF the defenders
        # (x=13..14) so stance-lifted auto-fire engages on every
        # swing; the bigger volley keeps ≥3 kills reachable inside
        # the tick budget even after early probe attrition.
        - {type: e1, owner: enemy, position: [22, 20], stance: 2, count: 5}
        - {type: fact, owner: enemy, position: [120, 20]}
    forbidden_tools: [attack_unit, attack_move]
    win_condition:
      all_of:
        - {has_building: fact}
        - {units_killed_gte: 3}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {has_building: fact}}
        - {tool_violations_gte: 1}
    max_turns: 55
