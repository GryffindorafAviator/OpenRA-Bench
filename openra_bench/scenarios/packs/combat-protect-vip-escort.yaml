# combat-protect-vip-escort — Get the fragile VIP through, preserve it.
#
# ACTION focus: a single unique `harv` is the VIP — the only one of
# its type on the map AND structurally unarmed (the harvester
# carries no weapon: it can never return fire even on stance:3).
# It must reach the east extraction point (~100, 20). Four 2tnk
# escorts at the same west staging zone must clear the enemy
# interception force strung along the route AND time the VIP's
# crossing so the escort goes first.
#
# Real-world anchor: VIP-protection / diplomatic-escort detail —
# the principal (POTUS limo, ambassador convoy, SecDef movement)
# is unarmed and must not engage; the protective detail moves in
# bounding formation ahead and to the flanks, neutralising threats
# along the route before the principal traverses. SC2 VIP-survival
# missions, MicroRTS fragile-target preservation, and military
# convoy doctrine all encode the same constraint: the high-value
# unit is preserved by the escort's offence, not by its own fight.
#
# Mechanism (engine-load-bearing — verified by scripted-policy
# smoke runs, all seeds 1–4 × every tier; recalibrated after the
# engine move-fire / no-teleport-attack fixes):
#   • The route interception force is a `guard` bot (NOT static
#     defenders). The `guard` bot holds post but LUNGES at the
#     nearest foe within GUARD_AGGRO ~16 and snaps back past leash
#     ~18. The load-bearing piece is a Soviet heavy tank (3tnk)
#     inside the guard force.
#   • The VIP starts FRAGILE — `health: 70` (70% HP). This is the
#     post-move-fix lever: with moving units now firing and being
#     fired on en route, a harv crossing WITH the escort column
#     eats the guard 3tnk's focus while in motion, and a 70%-HP
#     harv does not survive that hot crossing. The intended escort
#     holds the VIP back and the VIP only ever crosses a CLEARED
#     (cold) route — so it arrives untouched at 70%, alive.
#   • easy / medium carry ONE full-HP guard 3tnk on the y=20 route
#     axis (the harv's lane) + e1 rifle filler. hard carries TWO
#     guard 3tnk — one aligned to EACH seed-chosen staging lane —
#     each at `health: 55`. Post the no-teleport attack-chase fix a
#     single y=20-axis 3tnk can no longer catch a harv-led column
#     that funnels off-axis, so each hard lane needs its own
#     lane-aligned interceptor. The 55% health floor on the hard
#     heavies is what keeps the 4-tank escort able to clear BOTH in
#     budget — two FULL-HP heavies out-trade the escort and break
#     the intended-WINS half of the bar.
#   • e1 rifle infantry is anti-infantry filler: it barely dents
#     the armoured harv and is a cheap escort kill — it pads the
#     route's kill envelope without out-trading the escort.
#   • The intended escort holds the VIP at the staging zone until
#     the escort has cleared the route, THEN sends it across a cold
#     corridor. Sending the VIP in the column (VIP-leads-charge) or
#     alone (VIP-alone) exposes the 70%-HP VIP to live heavy fire
#     and it dies before the route is clear.
#
# Discrimination (the four-script bar — scripted, no model):
#   • stall (observe-only): nothing moves; the VIP never reaches
#     the extraction → after_ticks 4501 LOSS (no draw degeneracy).
#   • VIP-alone: only the harvester is moved east; with no escort
#     the guard 3tnk lunges at the lone harv and destroys it →
#     `not unit_type_count_gte:{harv,1}` fail clause fires → LOSS
#     on every level/seed.
#   • VIP-leads-charge: harv + tanks dispatched in a single column.
#     The 70%-HP VIP moves through the hot route alongside the
#     escort; with the engine move-fire fix it takes the guard
#     3tnk's focus while in motion and dies before the escort
#     finishes clearing → LOSS on every level/seed.
#   • intended escort-clears-path: the escort tanks attack the
#     interception force AHEAD of the VIP (focus-firing the guard
#     3tnk and the e1s); the VIP HOLDS at the staging zone until
#     the escort has cleared the route AND reached the extraction
#     latitude, then sprints across uncontested → harv arrives at
#     the extraction alive within budget → WIN.
#
# Engine guardrails (per CLAUDE.md):
#   • Map: rush-hour-arena (128 × 40 playable; x in [2..126], y in
#     [2..38]). All actor / region cells are inside.
#   • CLAUDE.md footgun: enemy clusters at (50,20) silently FAIL to
#     place — the interceptor sits at x=49, off that column.
#   • A persistent far enemy `fact` at (120,20) keeps the episode
#     alive past the route enemies being cleaned out (so the
#     win/fail evaluator sees the terminal frame; no DRAW collapse).
#   • after_ticks fail clauses are reachable within max_turns
#     (tick ≤ 93 + 90·(max_turns-1)); within_ticks 4500 < 4503 at
#     max_turns 50; staller hits after_ticks 4501 and LOSES, not
#     draws.
#   • unit_type_count_gte:{type:harv,n:1} as a NEGATED fail clause
#     fires the instant the VIP dies (signals.units_summary loses
#     the harv entry → count == 0 → not(...) == True). That is the
#     "VIP died" loss condition, distinct from total force wipe.
#   • Interrupts are LEFT DISABLED in this pack: enemy_unit_spotted
#     fires on each route enemy and step_until_event advances only
#     ~5 ticks per interrupt — with a dozen route enemies the
#     per-turn tick rate collapses and even the intended escort
#     cannot reach the extraction inside the 4500-tick budget.
#     Without interrupts each turn advances ~90 ticks uniformly and
#     the escort completes well inside budget.
#   • Spawn-driven hard tier: enemy actors don't honour spawn_point
#     (CLAUDE.md), so the route enemies always place identically.
#     Variation comes from the AGENT staging row (NORTH y=16 /
#     SOUTH y=24). Each lane carries its own y-aligned guard 3tnk so
#     both staging rows face an equivalent contested route to the
#     y=20 extraction.
#   • health: on a pre-placed actor now works (CLAUDE.md) — the
#     `health: 70` VIP and the `health: 55` hard heavies are
#     load-bearing tuning, not cosmetic.

meta:
  id: combat-protect-vip-escort
  title: 'Protect the VIP — Escort a Fragile Unit Through the Hazard'
  capability: action
  real_world_meaning: >
    A single fragile high-value unit (the VIP — an unarmed
    harvester, the only one of its kind on the map) must reach
    the east extraction point. Four medium tanks at the same west
    staging zone are the protective detail. The VIP cannot fight
    (no weapon); an enemy interception force — a Soviet heavy tank
    backed by rifle infantry — patrols the route and runs the lone
    VIP down. The escort must move AHEAD, destroy the interceptors,
    and only then let the VIP cross. Sending the VIP alone or at
    the head of the column gets it caught and killed; the escort's
    offence preserves the VIP.
  robotics_analogue: >
    Protected-asset transit / VIP detail / diplomatic convoy: a
    high-value principal (unarmed, fragile) must traverse a
    contested route. The protective detail moves in bounding
    formation ahead and to the flanks, neutralising threats along
    the route before the principal traverses. The principal does
    not engage directly — its survival depends on the detail's
    offence, not its own fight.
  benchmark_anchor:
    - "SC2 VIP-survival missions"
    - "military VIP protection doctrine"
    - "diplomatic security / convoy escort"
    - "fragile-target preservation tactics"
  author: "openra-bench"

base_map:
  generator: arena
  name: combat-protect-vip-escort-arena
  width: 144
  height: 40
  cordon: 2
  title: 'Protect the VIP - Long Lane 144x40'

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: guard}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  # Interrupts DISABLED — enemy_unit_spotted on a route with a
  # dozen enemies collapses per-turn ticks (step_until_event
  # advances only ~5 ticks per interrupt) and the deadline becomes
  # unreachable even for the intended escort. The model still sees
  # the full per-turn state on every decision boundary; reactive
  # micro is not the controlled capability of this pack.
  interrupts: {}
  termination: {max_ticks: 6000}
  actors: []   # every level supplies its own actor list via overrides.

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare VIP-escort skill: a single guard interception clump at the
  # route centre (x=49) — ONE Soviet heavy tank (3tnk) plus 4× e1
  # rifle filler. The guard 3tnk is the load-bearing anti-VIP
  # threat: it lunges at and destroys an unescorted harvester. The
  # escort must lead, destroy the interceptors, then bring the VIP
  # across. Generous tick budget.
  easy:
    description: >
      Commander, this is a VIP escort mission across a long 144x40 lane.
      You are given 1 harvester (an unarmed ore-collector truck — your
      VIP, cannot fight back, starting at 70% HP) at (6,20), plus 4
      medium tank escorts straddling it at (6, 18/19/21/22). The
      harvester is the ONLY one of its type on the map; if it dies the
      mission is lost. Two ambushes block the route east: at x=49 sits
      a guard force of 1 enemy heavy tank (hits harder than your
      mediums; will lunge at and run down a lone harvester) plus 4
      riflemen, and at x=85 sits a smaller picket — 1 anti-tank rocket
      soldier (Dragon launcher, range 5 — punches the harvester's
      armour) with 2 rifle flankers. Move the escort tanks AHEAD to break each
      ambush in turn while
      holding the VIP back at staging; only after the route is cleared,
      send the harvester across to the extraction disc around (130,20).
      Within about 60 turns.
    overrides:
      actors:
        # VIP — single unique harvester at the west staging zone.
        # health:70 — fragile principal (engine move-fire fix makes
        # this load-bearing: a harv crossing the hot route in the
        # column eats live heavy fire and dies; the intended escort
        # holds the VIP back so it only ever crosses a cleared
        # (cold) corridor and arrives at 70% untouched).
        - {type: harv, owner: agent, position: [6, 20], stance: 0, health: 70}
        # Escort — 4 medium tanks straddling the VIP at the west
        # staging zone. stance:1 return-fire so they only engage
        # when contacted or ordered.
        - {type: 2tnk, owner: agent, position: [6, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 21], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 22], stance: 1}
        # AMBUSH 1 @ x=49 — guard force of 1× 3tnk + 4× e1. The
        # 3tnk is the load-bearing anti-VIP interceptor (lunges at
        # and destroys an unescorted harv). Off the (50,20)
        # silently-failing column per CLAUDE.md.
        - {type: 3tnk, owner: enemy, position: [49, 20], stance: 3}
        - {type: e1, owner: enemy, position: [49, 17], stance: 3}
        - {type: e1, owner: enemy, position: [49, 18], stance: 3}
        - {type: e1, owner: enemy, position: [49, 22], stance: 3}
        - {type: e1, owner: enemy, position: [49, 23], stance: 3}
        # AMBUSH 2 @ x=85 — anti-armour picket on the long lane.
        # One rocket soldier (e3, Dragon launcher, range 5) on the
        # y=20 axis can damage the harv's armour as it passes — a
        # column charge takes Dragon fire en route and the 70%-HP
        # harv dies. Two rifle flankers pad the picket.
        - {type: e3, owner: enemy, position: [85, 20], stance: 3}
        - {type: e1, owner: enemy, position: [85, 18], stance: 3}
        - {type: e1, owner: enemy, position: [85, 22], stance: 3}
        # Persistent far enemy fact — engine auto-done mitigation.
        - {type: fact, owner: enemy, position: [140, 20]}
    win_condition:
      all_of:
        - {units_of_type_in_region_gte: {type: harv, x: 130, y: 20, radius: 6, n: 1}}
        - {unit_type_count_gte: {type: harv, n: 1}}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
    max_turns: 61

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 axis vs easy: the guard interception clump gains two more e1
  # rifle (6× e1, vertically widened to y=16..24 around the heavy
  # tank). The taller corridor means a harv-led column charge takes
  # more cumulative exposure before clearing. The single guard 3tnk
  # is unchanged (a second would out-trade the escort). Stall /
  # VIP-alone / VIP-leads-charge LOSE; intended escort WINS.
  medium:
    description: >
      Commander, this is a VIP escort mission across a long 144x40 lane.
      You are given 1 harvester (an unarmed ore-collector truck — your
      VIP, cannot fight back, starting at 70% HP) at (6,20), plus 4
      medium tank escorts straddling it at (6, 18/19/21/22). The
      harvester is the ONLY one of its type on the map; if it dies the
      mission is lost. Two ambushes block the route east: at x=49 sits
      a tall guard line of 1 enemy heavy tank (hits harder than your
      mediums; will lunge at a lone harvester) plus 6 riflemen spread
      across y=16..24, and at x=85 sits a line of 3 anti-tank rocket
      soldiers (Dragon launchers, range 5 — they punch the harvester's
      armour) with 2 rifle flankers. Move the escort tanks AHEAD to
      break each ambush in turn while
      holding the VIP back at staging; only after the route is cleared,
      send the harvester across to the extraction disc around (130,20).
      Within about 60 turns.
    overrides:
      actors:
        - {type: harv, owner: agent, position: [6, 20], stance: 0, health: 70}
        - {type: 2tnk, owner: agent, position: [6, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 21], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 22], stance: 1}
        # AMBUSH 1 @ x=49 — guard force of 1× 3tnk + 6× e1 vertical
        # corridor (y=16..24). The taller line means a harv-led
        # column charge takes more cumulative exposure.
        - {type: 3tnk, owner: enemy, position: [49, 20], stance: 3}
        - {type: e1, owner: enemy, position: [49, 16], stance: 3}
        - {type: e1, owner: enemy, position: [49, 17], stance: 3}
        - {type: e1, owner: enemy, position: [49, 18], stance: 3}
        - {type: e1, owner: enemy, position: [49, 22], stance: 3}
        - {type: e1, owner: enemy, position: [49, 23], stance: 3}
        - {type: e1, owner: enemy, position: [49, 24], stance: 3}
        # AMBUSH 2 @ x=85 — anti-armour pickets on the long lane.
        # Three e3 rocket soldiers + rifle flankers; Dragon fire
        # punches the 70%-HP harv's armour during a column charge.
        - {type: e3, owner: enemy, position: [85, 19], stance: 3}
        - {type: e3, owner: enemy, position: [85, 20], stance: 3}
        - {type: e3, owner: enemy, position: [85, 21], stance: 3}
        - {type: e1, owner: enemy, position: [85, 17], stance: 3}
        - {type: e1, owner: enemy, position: [85, 23], stance: 3}
        - {type: fact, owner: enemy, position: [140, 20]}
    win_condition:
      all_of:
        - {units_of_type_in_region_gte: {type: harv, x: 130, y: 20, radius: 6, n: 1}}
        - {unit_type_count_gte: {type: harv, n: 1}}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
    max_turns: 61

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 axis vs medium: TWO seed-driven spawn groups (NORTH staging
  # y≈16 OR SOUTH staging y≈24 — round-robined per seed). Each lane
  # carries its OWN lane-aligned guard heavy (a 3tnk at y=16 and a
  # 3tnk at y=24), both at health:55. Post the engine move-fire fix
  # a single y=20-axis 3tnk can no longer catch a harv-led column
  # that funnels off-axis, so the hard escalation is a per-lane
  # interceptor: whichever lane the seed picks, the harv-led charge
  # crosses a lane-aligned heavy. The 55% health floor keeps the
  # 4-tank escort able to clear BOTH heavies in budget (two
  # FULL-HP heavies would out-trade the escort and break the
  # intended-WINS half of the bar).
  hard:
    description: >
      Commander, this is a VIP escort mission across a long 144x40 lane,
      with seed-rotated staging. You are given 1 harvester (an unarmed
      ore-collector truck — your VIP, cannot fight back, starting at
      70% HP) plus 4 medium tank escorts, staged together at either the
      NORTH row (around y=16) or the SOUTH row (around y=24) depending
      on seed — read your actual starting row from the observation. The
      harvester is the ONLY one of its type on the map; if it dies the
      mission is lost. The route holds two enemy heavy tanks at x=49 —
      one aligned to each staging lane, each at 55% HP, each able to
      lunge at and destroy an unescorted harvester — backed by a wide
      rifle filler at x=55, plus a smaller second rifle clump at x=85
      spanning y=18..22 — the rifles cap the route latitude so neither
      lane offers a free sprint after the first ambush. Move the escort tanks AHEAD to break the
      interceptors while holding the VIP back at staging; only after
      the route is clear, send the harvester across to the extraction
      disc around (130,20). Within about 60 turns.
    overrides:
      actors:
        # spawn_point 0 — NORTH staging at y ≈ 16.
        - {type: harv, owner: agent, position: [6, 16], stance: 0, spawn_point: 0, health: 70}
        - {type: 2tnk, owner: agent, position: [6, 14], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 15], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 17], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 18], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH staging at y ≈ 24 (mirrored).
        - {type: harv, owner: agent, position: [6, 24], stance: 0, spawn_point: 1, health: 70}
        - {type: 2tnk, owner: agent, position: [6, 22], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 23], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 25], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 26], stance: 1, spawn_point: 1}
        # AMBUSH 1 @ x=49 — TWO 3tnk heavies (ONE per lane, y=16 N
        # and y=24 S) at health:55 + 5× e1 spanning the corridor.
        # The 55% HP floor keeps a 4-tank escort able to clear BOTH
        # heavies in budget (intended-WINS); a harv-led column
        # crosses a lane-aligned heavy and the 70%-HP VIP dies
        # (VIP-leads-charge LOSES). Two FULL-HP heavies would
        # out-trade the escort — the health:55 floor is the
        # load-bearing tuning.
        - {type: 3tnk, owner: enemy, position: [49, 16], stance: 3, health: 55}
        - {type: 3tnk, owner: enemy, position: [49, 24], stance: 3, health: 55}
        - {type: e1, owner: enemy, position: [55, 16], stance: 3}
        - {type: e1, owner: enemy, position: [55, 20], stance: 3}
        - {type: e1, owner: enemy, position: [55, 24], stance: 3}
        # AMBUSH 2 @ x=85 — small rifle band on the long lane
        # spanning y=16..24. On hard the load-bearing anti-VIP
        # threat is the dual lane-aligned heavies at x=49; the x=85
        # rifle band caps the route latitude so neither lane offers
        # a free sprint after the first ambush, without out-trading
        # the four-tank escort.
        - {type: e1, owner: enemy, position: [85, 18], stance: 3}
        - {type: e1, owner: enemy, position: [85, 20], stance: 3}
        - {type: e1, owner: enemy, position: [85, 22], stance: 3}
        # Persistent far enemy fact — engine auto-done mitigation.
        - {type: fact, owner: enemy, position: [140, 20]}
    win_condition:
      all_of:
        - {units_of_type_in_region_gte: {type: harv, x: 130, y: 20, radius: 6, n: 1}}
        - {unit_type_count_gte: {type: harv, n: 1}}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
    max_turns: 61
