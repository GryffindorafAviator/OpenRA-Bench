# combat-protect-vip-escort — Get the fragile VIP through, preserve it.
#
# ACTION focus: a single unique `harv` is the VIP — the only one of
# its type on the map AND structurally unarmed (the harvester
# carries no weapon: it can never return fire even on stance:3).
# It must reach the east extraction point (~100, 20). Four 2tnk
# escorts at the same west staging zone must clear the enemy
# interception force strung along the route AND time the VIP's
# crossing so the escort goes first.
#
# Real-world anchor: VIP-protection / diplomatic-escort detail —
# the principal (POTUS limo, ambassador convoy, SecDef movement)
# is unarmed and must not engage; the protective detail moves in
# bounding formation ahead and to the flanks, neutralising threats
# along the route before the principal traverses. SC2 VIP-survival
# missions, MicroRTS fragile-target preservation, and military
# convoy doctrine all encode the same constraint: the high-value
# unit is preserved by the escort's offence, not by its own fight.
#
# Mechanism (engine-load-bearing — verified by scripted-policy
# smoke runs, all seeds 1–4 × every tier):
#   • The route interception force is a `guard` bot (NOT static
#     defenders). The `guard` bot holds post but LUNGES at the
#     nearest foe within GUARD_AGGRO ~16 and snaps back past leash
#     ~18. The load-bearing piece is exactly ONE Soviet heavy tank
#     (3tnk) inside the guard force: a guard 3tnk catches and
#     destroys an UNESCORTED harvester (it can keep pace with the
#     harv and out-damages it), but when the escort tanks are
#     present and forward the guard 3tnk lunges at the CLOSER tanks
#     instead — the escort's body draws the interceptor off the VIP.
#   • Why a single 3tnk and no more: 4× 2tnk can focus-fire ONE
#     guard 3tnk down before taking crippling losses; a SECOND
#     guard 3tnk out-trades the escort and even the intended play
#     loses. The remaining route enemies are e1 rifle filler —
#     cheap kills that make up the kill envelope and (on hard) form
#     a tall corridor so a harv-led column charge takes real
#     exposure.
#   • The harvester is heavily armoured and, when SPRINTING (a
#     long-distance move order), effectively outpaces fire from
#     static threats — so the threat that makes "VIP alone" lose is
#     the MOBILE guard interceptor, not a stationary gun line. The
#     intended escort holds the VIP at the staging zone until the
#     escort has cleared the route, THEN sprints it across.
#
# Discrimination (the four-script bar — scripted, no model):
#   • stall (observe-only): nothing moves; the VIP never reaches
#     the extraction → after_ticks 4501 LOSS (no draw degeneracy).
#   • VIP-alone: only the harvester is moved east; with no escort
#     the guard 3tnk lunges at the lone harv and destroys it →
#     `not unit_type_count_gte:{harv,1}` fail clause fires → LOSS
#     on every level/seed.
#   • VIP-leads-charge: harv + tanks dispatched in a single column
#     with the harv at the front. The guard interceptor + the e1
#     corridor focus the leading harv → VIP dies before extraction
#     → LOSS on every level/seed.
#   • intended escort-clears-path: the escort tanks attack the
#     interception force AHEAD of the VIP (focus-firing the guard
#     3tnk and the e1s); the VIP HOLDS at the staging zone until
#     the escort has cleared the route AND reached the extraction
#     latitude, then sprints across uncontested → harv arrives at
#     the extraction alive within budget → WIN.
#
# Engine guardrails (per CLAUDE.md):
#   • Map: rush-hour-arena (128 × 40 playable; x in [2..126], y in
#     [2..38]). All actor / region cells are inside.
#   • CLAUDE.md footgun: enemy clusters at (50,20) silently FAIL to
#     place — the interceptor sits at x=49, off that column.
#   • A persistent far enemy `fact` at (120,20) keeps the episode
#     alive past the route enemies being cleaned out (so the
#     win/fail evaluator sees the terminal frame; no DRAW collapse).
#   • after_ticks fail clauses are reachable within max_turns
#     (tick ≤ 93 + 90·(max_turns-1)); within_ticks 4500 < 4503 at
#     max_turns 50; staller hits after_ticks 4501 and LOSES, not
#     draws.
#   • unit_type_count_gte:{type:harv,n:1} as a NEGATED fail clause
#     fires the instant the VIP dies (signals.units_summary loses
#     the harv entry → count == 0 → not(...) == True). That is the
#     "VIP died" loss condition, distinct from total force wipe.
#   • Interrupts are LEFT DISABLED in this pack: enemy_unit_spotted
#     fires on each route enemy and step_until_event advances only
#     ~5 ticks per interrupt — with a dozen route enemies the
#     per-turn tick rate collapses and even the intended escort
#     cannot reach the extraction inside the 4500-tick budget.
#     Without interrupts each turn advances ~90 ticks uniformly and
#     the escort completes well inside budget.
#   • Spawn-driven hard tier: enemy actors don't honour spawn_point
#     (CLAUDE.md), so the route enemies always place identically.
#     Variation comes from the AGENT staging row (NORTH y=14 /
#     SOUTH y=26). The hard e1 corridor is vertically widened
#     (y=14..26) so both staging rows face an equivalent contested
#     route to the y=20 extraction.

meta:
  id: combat-protect-vip-escort
  title: 'Protect the VIP — Escort a Fragile Unit Through the Hazard'
  capability: action
  real_world_meaning: >
    A single fragile high-value unit (the VIP — an unarmed
    harvester, the only one of its kind on the map) must reach
    the east extraction point. Four medium tanks at the same west
    staging zone are the protective detail. The VIP cannot fight
    (no weapon); an enemy interception force — a Soviet heavy tank
    backed by rifle infantry — patrols the route and runs the lone
    VIP down. The escort must move AHEAD, destroy the interceptors,
    and only then let the VIP cross. Sending the VIP alone or at
    the head of the column gets it caught and killed; the escort's
    offence preserves the VIP.
  robotics_analogue: >
    Protected-asset transit / VIP detail / diplomatic convoy: a
    high-value principal (unarmed, fragile) must traverse a
    contested route. The protective detail moves in bounding
    formation ahead and to the flanks, neutralising threats along
    the route before the principal traverses. The principal does
    not engage directly — its survival depends on the detail's
    offence, not its own fight.
  benchmark_anchor:
    - "SC2 VIP-survival missions"
    - "military VIP protection doctrine"
    - "diplomatic security / convoy escort"
    - "fragile-target preservation tactics"
  author: "openra-bench"

base_map: rush-hour-arena

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: guard}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  # Interrupts DISABLED — enemy_unit_spotted on a route with a
  # dozen enemies collapses per-turn ticks (step_until_event
  # advances only ~5 ticks per interrupt) and the deadline becomes
  # unreachable even for the intended escort. The model still sees
  # the full per-turn state on every decision boundary; reactive
  # micro is not the controlled capability of this pack.
  interrupts: {}
  termination: {max_ticks: 6000}
  actors: []   # every level supplies its own actor list via overrides.

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare VIP-escort skill: a single guard interception clump at the
  # route centre (x=49) — ONE Soviet heavy tank (3tnk) plus 4× e1
  # rifle filler. The guard 3tnk is the load-bearing anti-VIP
  # threat: it lunges at and destroys an unescorted harvester. The
  # escort must lead, destroy the interceptors, then bring the VIP
  # across. Generous tick budget.
  easy:
    description: >
      A single ore harvester (the VIP — unique unit type, unarmed,
      cannot fight) is staged at (8,20) with four medium tank
      escorts. The VIP must reach the EAST extraction point
      (x ≈ 100, y ≈ 20, radius 6) before tick 4500, and MUST be
      alive on arrival (the harv is the only one of its type; a
      destroyed harv fails the run). A guard interception force
      holds the route centre at x ≈ 49: one Soviet heavy tank
      (3tnk) and four rifle infantry (e1). The guard heavy tank
      lunges at the nearest foe — it runs down a lone, unescorted
      VIP. The escort tanks must move AHEAD, destroy the
      interceptors, and only then send the VIP across.
    overrides:
      actors:
        # VIP — the single unique harvester at the west staging
        # zone. Unique-unit-type marker: the only harv on the map,
        # so the "VIP alive" check is exactly
        # `unit_type_count_gte:{harv,1}`. stance:0 (HoldFire)
        # documents convoy discipline (the harv is unarmed anyway).
        - {type: harv, owner: agent, position: [8, 20], stance: 0}
        # Escorts — 4 medium tanks at the same west staging zone,
        # straddling the VIP. stance:1 (return fire) so the escorts
        # retaliate when contacted but don't wander.
        - {type: 2tnk, owner: agent, position: [8, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [8, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [8, 21], stance: 1}
        - {type: 2tnk, owner: agent, position: [8, 22], stance: 1}
        # Guard interception force — ONE 3tnk (the load-bearing
        # anti-VIP interceptor) + 4× e1 rifle filler at the route
        # centre. Off the (50,20) silently-failing column.
        - {type: 3tnk, owner: enemy, position: [49, 20], stance: 3}
        - {type: e1, owner: enemy, position: [49, 17], stance: 3}
        - {type: e1, owner: enemy, position: [49, 18], stance: 3}
        - {type: e1, owner: enemy, position: [49, 22], stance: 3}
        - {type: e1, owner: enemy, position: [49, 23], stance: 3}
        # Persistent far enemy `fact` — keeps the episode alive
        # past the route enemies being cleaned out so the win/fail
        # evaluator sees the terminal frame (no DRAW collapse).
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_of_type_in_region_gte: {type: harv, x: 100, y: 20, radius: 6, n: 1}}
        - {unit_type_count_gte: {type: harv, n: 1}}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
    max_turns: 50

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 axis vs easy: the guard interception clump gains two more e1
  # rifle (6× e1, vertically widened to y=16..24 around the heavy
  # tank). The taller corridor means a harv-led column charge takes
  # more cumulative exposure before clearing. The single guard 3tnk
  # is unchanged (a second would out-trade the escort). Stall /
  # VIP-alone / VIP-leads-charge LOSE; intended escort WINS.
  medium:
    description: >
      A single ore harvester (the VIP — unique unit type, unarmed,
      cannot fight) is staged at (8,20) with four medium tank
      escorts. The VIP must reach the EAST extraction point
      (x ≈ 100, y ≈ 20, radius 6) before tick 4500, alive. A guard
      interception force holds the route centre at x ≈ 49: one
      Soviet heavy tank (3tnk) and six rifle infantry (e1) arrayed
      across y=16..24. The escort tanks must lead — destroy the
      heavy interceptor and the rifle corridor — because the
      unarmed VIP is caught and killed if it enters the route
      unescorted or at the head of the column.
    overrides:
      actors:
        - {type: harv, owner: agent, position: [8, 20], stance: 0}
        - {type: 2tnk, owner: agent, position: [8, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [8, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [8, 21], stance: 1}
        - {type: 2tnk, owner: agent, position: [8, 22], stance: 1}
        # Guard interception force — ONE 3tnk + 6× e1 corridor.
        - {type: 3tnk, owner: enemy, position: [49, 20], stance: 3}
        - {type: e1, owner: enemy, position: [49, 16], stance: 3}
        - {type: e1, owner: enemy, position: [49, 17], stance: 3}
        - {type: e1, owner: enemy, position: [49, 18], stance: 3}
        - {type: e1, owner: enemy, position: [49, 22], stance: 3}
        - {type: e1, owner: enemy, position: [49, 23], stance: 3}
        - {type: e1, owner: enemy, position: [49, 24], stance: 3}
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_of_type_in_region_gte: {type: harv, x: 100, y: 20, radius: 6, n: 1}}
        - {unit_type_count_gte: {type: harv, n: 1}}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
    max_turns: 50

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 axis vs medium: TWO seed-driven spawn groups (NORTH staging
  # y≈14 OR SOUTH staging y≈26 — round-robined per seed). The guard
  # heavy interceptor sits on the y=20 symmetry axis and the e1
  # filler is widened into a TWO-column corridor (x=52 and x=58,
  # y=14..26) so BOTH staging rows face an equivalent contested
  # route to the y=20 extraction — a single memorised staging-to-
  # extraction vector cannot generalise. The single guard 3tnk is
  # unchanged.
  hard:
    description: >
      A single ore harvester (the VIP — unique unit type, unarmed,
      cannot fight) is staged with four medium tank escorts at the
      NORTH staging row (y ≈ 14) or the SOUTH staging row (y ≈ 26),
      chosen by seed for anti-memorisation. The VIP must reach the
      EAST extraction point (x ≈ 100, y ≈ 20, radius 6) before tick
      4500, alive. A guard interception force holds the route: one
      Soviet heavy tank (3tnk) on the centre axis backed by a
      two-column rifle-infantry corridor (e1 across y=14..26). The
      escort tanks must lead and destroy the interceptors; the
      unarmed VIP is caught and killed if it enters the route
      unescorted or at the head of the column.
    overrides:
      actors:
        # spawn_point 0 — NORTH staging at y ≈ 14.
        - {type: harv, owner: agent, position: [8, 14], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [8, 12], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [8, 13], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [8, 15], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [8, 16], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH staging at y ≈ 26 (mirrored across
        # y=20).
        - {type: harv, owner: agent, position: [8, 26], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [8, 24], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [8, 25], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [8, 27], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [8, 28], stance: 1, spawn_point: 1}
        # Guard interception force — ONE 3tnk on the y=20 symmetry
        # axis + a two-column e1 corridor (x=52, x=58) spanning
        # y=14..26 so both staging rows face an equivalent route.
        - {type: 3tnk, owner: enemy, position: [49, 20], stance: 3}
        - {type: e1, owner: enemy, position: [52, 14], stance: 3}
        - {type: e1, owner: enemy, position: [52, 17], stance: 3}
        - {type: e1, owner: enemy, position: [52, 20], stance: 3}
        - {type: e1, owner: enemy, position: [52, 23], stance: 3}
        - {type: e1, owner: enemy, position: [52, 26], stance: 3}
        - {type: e1, owner: enemy, position: [58, 14], stance: 3}
        - {type: e1, owner: enemy, position: [58, 17], stance: 3}
        - {type: e1, owner: enemy, position: [58, 20], stance: 3}
        - {type: e1, owner: enemy, position: [58, 23], stance: 3}
        - {type: e1, owner: enemy, position: [58, 26], stance: 3}
        # Persistent far enemy fact — engine auto-done mitigation.
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_of_type_in_region_gte: {type: harv, x: 100, y: 20, radius: 6, n: 1}}
        - {unit_type_count_gte: {type: harv, n: 1}}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
    max_turns: 50
