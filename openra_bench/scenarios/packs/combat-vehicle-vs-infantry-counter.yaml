# combat-vehicle-vs-infantry-counter
#
# REASONING capability — rock-paper-scissors hard-counter selection.
# The agent has cash to commit to EITHER mass anti-tank rocket
# infantry (e3) OR a small armoured fist (2tnk); the enemy is PURE
# rifle infantry (e1). Tanks hard-counter rifles (heavy armour
# absorbs small-arms; tank dps + range shred infantry); rockets
# are the WRONG counter (anti-tank ordnance against soft targets —
# short e3 stand-off + slow projectiles + the e1 mass closes inside
# rocket range and out-DPSes a smaller rocket squad on attrition).
# Building only e1 from the production queue matches enemy strength
# 1:1 and loses on attrition. Stalling never reaches the kill bar.
#
# Real-world anchor: capability counter-selection in defense
# procurement — buying anti-tank platforms is wrong against a soft-
# target infantry threat; armoured vehicles are the right tool. SC2
# hard-counter doctrine: roach vs marine (the right tier counters
# the WHOLE army), stalker vs marauder. Military RPS: tank-vs-
# infantry, infantry-vs-rocket, rocket-vs-tank.
#
# Pre-placed (each spawn group): agent `fact` + `tent` (infantry
# trainer; enables e1 and e3) + `weap` (vehicle trainer; enables
# 2tnk) + a single starter `jeep` (allies scout vehicle; visibility
# over the enemy composition). The starter jeep is `stance: 0`
# (HoldFire) so it NEVER auto-fires — it scouts, it does not fight.
# This is the load-bearing anti-stall guard (CLAUDE.md: an armour-
# class engine fix made pre-placed agent combat units auto-fire
# effectively, so a HoldFire jeep cannot rack up kills on its own).
# The tent+weap pair makes BOTH counter compositions buildable from
# turn 1 — the decision the model faces is composition, not tech-up.
#
# The win predicate requires `unit_type_count_gte: 2tnk:3` — the
# agent must have ACTUALLY FIELDED 3 medium tanks (the right
# counter). A stall policy never builds tanks; a wrong-counter
# policy (e3 / e1) never builds 2tnk — neither can satisfy the win
# regardless of how many kills the entrenched enemy concedes. Only
# building + commanding the 3-tank fist clears the bar.
#
# Discrimination on EASY / MEDIUM (single enemy cluster, both
# compositions are buildable from t=1). The win predicate is
# `unit_type_count_gte 2tnk:3 AND units_killed_gte K AND
# has_building fact` — the 2tnk:3 clause means ONLY a policy that
# actually builds the 3-tank fist can clear the bar:
#   • stall (only observe): builds nothing; the HoldFire jeep never
#     fires → 0 kills, 0 tanks. The entrenched e1 swarm eventually
#     hunts down the idle jeep → force-wipe (not own_units_gte:1)
#     LOSS (or after_ticks LOSS if the jeep is never reached).
#   • build-only-e1 (match enemy 1:1 with cheap rifles): never
#     builds 2tnk → the 2tnk:3 clause is structurally unmet; even
#     a full kill count cannot win → after_ticks / force-wipe LOSS.
#   • build-only-e3 (anti-armour rockets against infantry — the
#     wrong counter): never builds 2tnk → the 2tnk:3 clause is
#     structurally unmet; the rocket squad is also OUT-SHOT by the
#     e1 mass on raw infantry-vs-infantry numbers (e3 hp45 < e1
#     hp50; slow anti-armour projectiles under-perform vs small
#     targets) → after_ticks / force-wipe LOSS.
#   • intended build-2tnk (3× medium tanks @ $800 = $2400): the
#     right counter — heavy armour soaks small-arms fire, tank
#     dps22 + rng 4.75 + sight 6c walks through a static e1 mass.
#     2tnk:3 clause met, kill bar met, fact intact → WIN.
#
# Discrimination on HARD (+1 axis: 2 agent spawn_point groups):
#   • The agent base seed-rotates between NORTH (y=12) and SOUTH
#     (y=28). The enemy cluster always places at centre x=70 (enemy
#     actors don't honour spawn_point — CLAUDE.md), so the geometry
#     differs per seed but the composition decision is the same. A
#     memorised "always tanks" opening generalises across seeds, but
#     a memorised "tanks at y=12, march east on y=20" opening does
#     NOT — the agent must derive the lane from its actual spawn
#     latitude.
#
# Engine guardrails (CLAUDE.md):
#   • Map: rush-hour-arena (128 × 40, playable x in [2..126],
#     y in [2..38]).
#   • Far persistent enemy `fact` at (124, 20) prevents engine
#     auto-done when the live infantry cluster falls (the kill bar
#     is satisfied on units killed, not buildings; the marker keeps
#     the episode running through the win/fail evaluator's terminal
#     frame).
#   • `after_ticks` fail clauses reachable within max_turns:
#     empirically the engine advances ~90 ticks/turn here so
#     max_turns 60 reaches tick ~5400 BUT the engine auto-`done`s
#     much earlier once the live e1 swarm finishes hunting (turn
#     ~36 on medium/hard with the 12-strong cluster, turn ~50 on
#     easy with the 8-strong cluster). within_ticks 2700 /
#     after_ticks 2701 fits well inside the earliest auto-done
#     envelope (~3243 ticks on medium/hard) so a staller LOSES via
#     after_ticks on every tier, never DRAWS. Intended-build-2tnk
#     wins at ~tick 1623 (~18 turns) on every level, leaving ~1000
#     ticks of headroom.
#   • Starting `jeep` is `stance: 0` (HoldFire) — it scouts but
#     never auto-fires, so a pure-observe stall policy cannot score
#     kills with it. The win predicate's `unit_type_count_gte`
#     2tnk:3 is the real anti-cheat: only the agent that builds the
#     3-tank fist can clear the bar. The fail clause is
#     `after_ticks | not has_building:fact` — a stalled policy hits
#     after_ticks 2701 and LOSES; a base-wipe (stance:3 e1 swarm
#     marches west and destroys the fact) hits `not has_building:fact`
#     and LOSES. The previous `not own_units_gte:1` fail clause was
#     dropped (Qwen-9B triage B.4): it punished the briefing-mandated
#     scout doctrine — the jeep is sent forward to scout the fogged
#     cluster, dies in 4-5 turns, and the run instant-failed at
#     tick ~300 long before the 3-tank fist was built. The base-wipe
#     clause still keeps a stalled-and-overrun episode from
#     degenerating to a DRAW because the entrenched stance:3 e1
#     swarm hunts west and destroys the agent fact.
#   • The vehicle queue (`weap` war factory) needs `powr` online
#     AND a `fix` service depot present for `2tnk` to clear its
#     prerequisites — both are pre-placed in every base so the
#     tank counter is producible from turn 1 (the decision is
#     composition, not tech-up). `tent` produces e1/e3 with `powr`
#     alone.
#   • Spawn-group footgun (CLAUDE.md oramap): on hard, ANY agent
#     actor with `spawn_point` filters OUT every agent actor without
#     one — so BOTH bases (fact + powr + tent + weap + fix + jeep)
#     are duplicated under BOTH spawn_point groups at their
#     respective coords. The single far enemy fact at (124,20) and
#     the centre enemy cluster have NO spawn_point and place on
#     every seed.
#   • starting_cash $2550 = exactly 3× 2tnk; 8× e3 = $2400 (cash
#     unspent); 25× e1 = $2500. Neither rocket nor rifle mass is
#     dominant against the entrenched enemy.
#   • Faction = allies (so the starter scout `jeep` and barracks
#     `tent` are native; vehicle queue from `weap` produces 2tnk —
#     the allies medium tank).

meta:
  id: combat-vehicle-vs-infantry-counter
  title: 'Hard-Counter Selection — Tanks vs Rockets vs an Infantry Threat'
  capability: reasoning
  real_world_meaning: >
    A fixed cash budget funds EITHER a small armoured fist (3× medium tank
    medium tanks @ $800) OR a mass anti-tank rocket squad (8× rocket soldier
    rocket soldiers @ $300) OR a rifle company (up to 25× rifle infantry @ $100).
    The enemy is PURE rifle infantry (rifle infantry mass entrenched at centre).
    The correct rock-paper-scissors counter is armour: heavy tanks
    soak small-arms fire and shred soft targets at range. Rockets
    are the WRONG counter — anti-tank munitions against soft
    infantry waste cost-per-effect and the rocket squad's short
    stand-off + low HP gets out-DPSed by the rifle mass on
    attrition. Matching the enemy with own rifles is a 1:1 trade
    with no positional advantage and loses. Stalling never reaches
    the kill bar. The capability under test is hard-counter
    SELECTION: scout the threat composition, infer it has no anti-armour, and commit the WHOLE budget to the dominant counter.
  robotics_analogue: >
    Capability counter-selection in defense procurement / fleet
    composition: buying anti-tank guided missiles is wrong against
    a soft-target infantry threat (cost-per-effect waste), buying
    rifle squads matches the threat 1:1 with no advantage, buying
    armoured vehicles is the dominant choice. The decision under
    test is reading the threat profile and committing the whole
    capital budget to the dominant counter rather than hedging
    across categories.
  benchmark_anchor:
    - "SC2 hard-counter"
    - "military RPS counter"
    - "capability-based defense"
  author: openra-bench

# Tailored 64×40 arena (cordon 2 ⇒ playable x in [2..61], y in
# [2..37]). The decision happens at the agent base (build composition)
# and against a single fixed-position enemy cluster; the 128-cell
# rush-hour-arena padded the engagement with 60+ cells of empty drive
# between base and cluster. The 64-cell arena leaves ~30 cells between
# base (x=8-16) and cluster (x=40), enough for a scout jeep round-trip
# without making the map a search-and-destroy.
base_map:
  generator: arena
  name: combat-vehicle-vs-infantry-counter-arena
  width: 64
  height: 40
  cordon: 2
  spawns: [[4, 20]]
  title: 'Combat Vehicle vs Infantry Counter Arena 64x40'
starting_cash: 2550

base:
  agent: {faction: allies}
  enemy: {faction: soviet}
  tools: [build, place_building, move_units, attack_unit, attack_move, stop]
  planning: true
  termination: {max_ticks: 8000}
  # Default base (overridden on hard). The starter jeep gives turn-1
  # scouting (sight 7c). It is `stance: 0` (HoldFire) so it never
  # auto-fires — a stall policy cannot score kills with it.
  actors:
    - {type: fact, owner: agent, position: [10, 20]}
    - {type: powr, owner: agent, position: [10, 16]}
    - {type: tent, owner: agent, position: [14, 18]}
    - {type: weap, owner: agent, position: [14, 22]}
    - {type: fix,  owner: agent, position: [18, 20]}
    - {type: jeep, owner: agent, position: [12, 20], stance: 0}
    # Far persistent enemy marker — prevents engine auto-done when
    # the live infantry cluster falls so the win/fail evaluator sees
    # the terminal frame.
    - {type: fact, owner: enemy, position: [60, 20]}

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare counter-selection skill: a small visible enemy infantry
  # cluster (8× e1) on the centre lane. Cash $2550 funds 3× 2tnk
  # (the right counter) cleanly. The win requires fielding 3× 2tnk
  # AND 6 kills; stall / wrong-counter never field the tanks → kill
  # bar + 2tnk:3 clause unmet → after_ticks LOSS.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Cash $2550. The enemy is a small cluster of 8 rifle infantry (e1)
    # entrenched at the centre of the map. You start with a construction
    # yard (fact), a barracks (tent), a war factory (weap), and a single
    # scout jeep. The barracks and war factory are both ONLINE from turn 1
    # — you can build EITHER mass anti- tank rocket soldiers (e3 @ $300,
    # up to 8 for $2400) OR a small armoured fist (2tnk @ $800, exactly 3
    # for $2400 with $150 residual) OR rifle infantry (e1 @ $100, up to
    # 25). Scout the enemy
    # with the jeep, pick the correct hard counter, and commit the whole
    # budget. Win when you have fielded 3 medium tanks (2tnk) AND 6 enemy
    # units are killed AND your construction yard still stands, before
    # tick 2700. Stalling or picking the wrong counter never fields the
    # 3-tank fist and fails the bar.
    description: >
      Commander, this is a hard-counter selection mission. You are given
      a full starter base on the west — Construction Yard, Power Plant,
      Infantry Barracks, War Factory, Service Depot — plus a scout jeep
      on hold-fire orders (it scouts, it does not fight). You have $2550
      cash. The enemy is a cluster of 8 pure rifle infantry around
      (40,20); tanks crush riflemen easily (Heavy armour soaks small-arms
      fire). Your budget buys exactly one dominant composition: 3 medium
      tanks at $800 each ($2400 total, $150 residual). Mass rockets waste cost-per-effect
      against soft targets; matching with own rifles is a 1:1 trade with
      no advantage. Build the three tanks from the War Factory and crush
      the cluster. Hold the Construction Yard, ≥6 kills, within about 60
      turns.
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: powr, owner: agent, position: [10, 16]}
        - {type: tent, owner: agent, position: [14, 18]}
        - {type: weap, owner: agent, position: [14, 22]}
        - {type: fix,  owner: agent, position: [18, 20]}
        - {type: jeep, owner: agent, position: [12, 20], stance: 0}
        # 8× e1 entrenched cluster — stance:3 (attack anything in
        # range). Spread over a 3×3 grid centred on (40,20) so the
        # mass can be engaged from any approach axis.
        - {type: e1, owner: enemy, position: [40, 18], stance: 3}
        - {type: e1, owner: enemy, position: [40, 19], stance: 3}
        - {type: e1, owner: enemy, position: [40, 20], stance: 3}
        - {type: e1, owner: enemy, position: [40, 21], stance: 3}
        - {type: e1, owner: enemy, position: [40, 22], stance: 3}
        - {type: e1, owner: enemy, position: [42, 19], stance: 3}
        - {type: e1, owner: enemy, position: [42, 20], stance: 3}
        - {type: e1, owner: enemy, position: [42, 21], stance: 3}
        - {type: fact, owner: enemy, position: [60, 20]}
    win_condition:
      all_of:
        - {unit_type_count_gte: {type: 2tnk, n: 3}}
        - {units_killed_gte: 6}
        - {has_building: fact}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {has_building: fact}}
    max_turns: 60

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 axis: heavier enemy (12× e1) AND the composition is fogged.
  # The model must scout (the starter jeep) to read the threat — the
  # brief tells the model the enemy is "pure infantry" but the
  # specific composition (no e3, no tanks) is something the model
  # has to verify on the minimap. Both pure-rocket and pure-rifle
  # build LOSE; 3× 2tnk WINS cleanly.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Cash $2550. The enemy holds a centre garrison (~12 rifle infantry)
    # entrenched on the central lane; their exact composition is fogged —
    # scout with the starter jeep to verify they are anti-armour-WEAK (no
    # anti-tank rocket soldiers, no tanks). Your construction yard,
    # barracks, and war factory are online from turn 1; commit the whole
    # $2550 to the dominant counter — armoured medium tanks (3× 2tnk @
    # $800 = $2400, $150 residual) walk through small-arms fire. Mass
    # rockets (e3 @ $300)
    # waste cost- per-effect against soft targets and get out-DPSed by the
    # rifle mass on attrition; matching with own rifles (e1 @ $100) is a
    # 1:1 trade with no advantage. Win when you have fielded 3 medium
    # tanks (2tnk) AND 8 enemy units are killed AND your fact still
    # stands, before tick 2700.
    description: >
      Commander, this is a hard-counter selection mission. You are given
      a full starter base on the west — Construction Yard, Power Plant,
      Infantry Barracks, War Factory, Service Depot — plus a scout jeep
      on hold-fire orders. You have $2550 cash. The enemy holds the
      centre with 12 rifle infantry around (40,20) under fog of war;
      scout with the jeep to verify they carry no anti-tank threats
      hiding among them. Three medium tanks ($2550 exactly) walk through
      small-arms fire; rockets waste cost-per-effect and own rifles are
      a 1:1 trade with no advantage. Build the trio, kill eight, hold
      the Construction Yard, within about 60 turns.
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: powr, owner: agent, position: [10, 16]}
        - {type: tent, owner: agent, position: [14, 18]}
        - {type: weap, owner: agent, position: [14, 22]}
        - {type: fix,  owner: agent, position: [18, 20]}
        - {type: jeep, owner: agent, position: [12, 20], stance: 0}
        # 12× e1 entrenched cluster — deeper centre mass.
        - {type: e1, owner: enemy, position: [40, 17], stance: 3}
        - {type: e1, owner: enemy, position: [40, 18], stance: 3}
        - {type: e1, owner: enemy, position: [40, 19], stance: 3}
        - {type: e1, owner: enemy, position: [40, 20], stance: 3}
        - {type: e1, owner: enemy, position: [40, 21], stance: 3}
        - {type: e1, owner: enemy, position: [40, 22], stance: 3}
        - {type: e1, owner: enemy, position: [40, 23], stance: 3}
        - {type: e1, owner: enemy, position: [42, 18], stance: 3}
        - {type: e1, owner: enemy, position: [42, 19], stance: 3}
        - {type: e1, owner: enemy, position: [42, 21], stance: 3}
        - {type: e1, owner: enemy, position: [42, 22], stance: 3}
        - {type: e1, owner: enemy, position: [44, 20], stance: 3}
        - {type: fact, owner: enemy, position: [60, 20]}
    win_condition:
      all_of:
        - {unit_type_count_gte: {type: 2tnk, n: 3}}
        - {units_killed_gte: 8}
        - {has_building: fact}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {has_building: fact}}
    max_turns: 60

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 axis: 2 agent spawn_point groups (NORTH base y=12 / SOUTH base
  # y=28), seed-driven round-robin. The centre infantry cluster has
  # NO spawn_point (per CLAUDE.md, enemy actors don't honour it) and
  # places on every seed at (70, 20) — equidistant from both bases,
  # so the composition decision is the same but the lane the agent
  # must commit to (NE→SE or SE→NE) flips per seed. Per CLAUDE.md,
  # ANY agent actor with spawn_point filters out every agent actor
  # WITHOUT — so the entire base (fact + tent + weap + jeep) is
  # duplicated under BOTH spawn_point groups.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Cash $2550. The enemy holds a centre garrison (~12 rifle infantry)
    # entrenched on the central lane (y=20); their composition is fogged —
    # scout with the starter jeep to verify they are anti-armour-WEAK (no
    # e3, no tanks). Your base spawns either at the NORTH (y=12) or SOUTH
    # (y=28) corner (chosen by seed). Commit the whole $2550 to the
    # dominant counter — 3× medium tanks (2tnk) walk through small-arms
    # fire; mass rockets (e3) waste cost-per-effect against soft targets
    # and get out- DPSed on attrition; matching with own rifles is a 1:1
    # trade with no advantage. Win when you have fielded 3 medium tanks
    # (2tnk) AND 8 enemy units are killed AND your fact still stands,
    # before tick 2700.
    description: >
      Commander, this is a hard-counter selection mission with
      seed-varied staging. You are given a full starter base — Construction
      Yard, Power Plant, Infantry Barracks, War Factory, Service Depot
      — plus a scout jeep on hold-fire orders. The base spawns either
      NORTH (y=12) or SOUTH (y=28) depending on seed — read your own
      position from the map. You have $2550 cash. The enemy holds the
      central lane around (40,20) with 12 rifle infantry under fog of
      war; scout with the jeep to verify they carry no anti-tank threats.
      Three medium tanks ($2550 exactly) walk through small-arms fire;
      rockets and own rifles both lose the trade. Build the trio, kill
      eight, hold a Construction Yard, within about 60 turns.
    overrides:
      actors:
        # ── AGENT spawn 0 — NORTH base (y=12) ─────────────────────
        - {type: fact, owner: agent, position: [10, 12], spawn_point: 0}
        - {type: powr, owner: agent, position: [10, 8], spawn_point: 0}
        - {type: tent, owner: agent, position: [14, 10], spawn_point: 0}
        - {type: weap, owner: agent, position: [14, 14], spawn_point: 0}
        - {type: fix,  owner: agent, position: [18, 12], spawn_point: 0}
        - {type: jeep, owner: agent, position: [12, 12], stance: 0, spawn_point: 0}
        # ── AGENT spawn 1 — SOUTH base (y=28) ─────────────────────
        - {type: fact, owner: agent, position: [10, 28], spawn_point: 1}
        - {type: powr, owner: agent, position: [10, 32], spawn_point: 1}
        - {type: tent, owner: agent, position: [14, 26], spawn_point: 1}
        - {type: weap, owner: agent, position: [14, 30], spawn_point: 1}
        - {type: fix,  owner: agent, position: [18, 28], spawn_point: 1}
        - {type: jeep, owner: agent, position: [12, 28], stance: 0, spawn_point: 1}
        # ── CENTRE ENEMY CLUSTER — pure infantry (always places) ──
        # 12× e1 entrenched on the central lane. Per CLAUDE.md, enemy
        # actors do not honour spawn_point — this cluster lands on
        # every seed regardless of the agent's spawn corner.
        - {type: e1, owner: enemy, position: [40, 17], stance: 3}
        - {type: e1, owner: enemy, position: [40, 18], stance: 3}
        - {type: e1, owner: enemy, position: [40, 19], stance: 3}
        - {type: e1, owner: enemy, position: [40, 20], stance: 3}
        - {type: e1, owner: enemy, position: [40, 21], stance: 3}
        - {type: e1, owner: enemy, position: [40, 22], stance: 3}
        - {type: e1, owner: enemy, position: [40, 23], stance: 3}
        - {type: e1, owner: enemy, position: [42, 18], stance: 3}
        - {type: e1, owner: enemy, position: [42, 19], stance: 3}
        - {type: e1, owner: enemy, position: [42, 21], stance: 3}
        - {type: e1, owner: enemy, position: [42, 22], stance: 3}
        - {type: e1, owner: enemy, position: [44, 20], stance: 3}
        # Far persistent enemy marker — prevents engine auto-done
        # when the centre cluster falls.
        - {type: fact, owner: enemy, position: [60, 20]}
    win_condition:
      all_of:
        - {unit_type_count_gte: {type: 2tnk, n: 3}}
        - {units_killed_gte: 8}
        - {has_building: fact}
        - {within_ticks: 2700}
    fail_condition:
