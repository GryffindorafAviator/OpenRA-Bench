  # ── HARD ────────────────────────────────────────────────────────────
  # +1 controlled variable: TWO enemy spawn groups (the larger force
  # stages from a NORTH cluster OR a SOUTH cluster, round-robined by
  # seed) so the lane the enemy funnels down from — and hence the
  # direction the squad must face as it holds the choke — varies per
  # seed. A single memorised opening cannot generalise; the
  # hold-the-corridor doctrine does (the corridor is the only path
  # regardless of where the force staged). Because the enemy actors
  # declare `spawn_point`, the per-owner spawn filter activates on the
  # enemy side, so the silo walls (also enemy-owned) are duplicated
  # across BOTH spawn groups — otherwise the unmatched copy would be
  # filtered out and the corridor would vanish (CLAUDE.md per-owner
  # spawn_point note). Force size 16, kill quota >=9.
  hard:
    description: >
      Four medium tanks (2tnk) hold a narrow corridor. Two silo walls
      split the map; the ONLY path between the west and east halves is
      a 3-cell-tall lane (y=19,20,21) running x=44..96. Your squad is
      pre-placed inside the corridor at the choke. A force of SIXTEEN
      enemy light tanks (1tnk) stages in the EAST OPEN — from a NORTH
      or a SOUTH cluster, chosen by seed — and hunts your squad
      through the corridor. Win by destroying at least NINE enemy
      units while keeping at least THREE of your tanks alive and your
      construction yard intact, before tick 5400. HOLD THE CORRIDOR
      regardless of which side the force funnels from: keep your four
      tanks anchored in the lane and concentrate fire on the frontmost
      enemy. The corridor is the only path whichever cluster the enemy
      staged in; meeting the force in the open gets your squad
      surrounded and focus-fired down.
    overrides:
      actors:
        # SQUAD — 4 medium tanks PRE-PLACED at the choke, inside the
        # corridor lane (y=19,20,21). stance:2 Defend: auto-fire in
        # range, never advance. The intended play keeps them anchored
        # here and FOCUS-FIRES the frontmost enemy; abandoning the
        # corridor (charging east, or pulling west into the open) loses.
        - {type: 2tnk, owner: agent, position: [52, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [52, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [52, 21], stance: 2}
        - {type: 2tnk, owner: agent, position: [53, 20], stance: 2}
        # OBJECTIVE LANDMARK — construction yard far west, out of the
        # fight. building_count_gte:fact:1 in the win clause; razed
        # only if the enemy breaks the hold and reaches the west base.
        - {type: fact, owner: agent, position: [10, 20]}
        # ENEMY FORCE — 16 light tanks, two spawn_point groups.
        # spawn_point 0: NORTH cluster (x=104..110, y=15..18,
        # in the east open just north of the corridor lane).
        - {type: 1tnk, owner: enemy, position: [104, 15], stance: 3, count: 1, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [104, 16], stance: 3, count: 1, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [104, 17], stance: 3, count: 1, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [104, 18], stance: 3, count: 1, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [106, 15], stance: 3, count: 1, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [106, 16], stance: 3, count: 1, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [106, 17], stance: 3, count: 1, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [106, 18], stance: 3, count: 1, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [108, 15], stance: 3, count: 1, spawn_point: 0}
