# combat-hold-chokepoint — hold a narrow pass: a small medium-tank
# squad plugs a generator-carved corridor so a numerically larger
# light-tank force can only feed a few units at a time. Per-tier the
# corridor TIGHTENS (width 4 -> 3 -> 2) — the pinch geometry is THE
# multiplier; meeting the enemy on open ground loses on every tier.
#
# CANONICAL USE CASE of the `chokepoint-arena` generator
# (openra_bench.mapgen._chokepoint_arena). The map is a 96x40 arena
# split at x=48 by a single 7-cell-thick WATER wall (impassable
# terrain) with a per-tier-wide CLEAR corridor at y=20. There are no
# silo-as-wall actors; the chokepoint geometry is carried entirely by
# the materialised terrain.
#
# Note on attacker counts: the user-provided design table called for
# 6 / 10 / 14 attackers on easy / medium / hard. Empirical validation
# (verified 2026-05-23) showed that with 3 defenders at the mouth and
# a 4-cell-wide corridor, a static stance:2 squad's auto-fire is
# sufficient to grind 6-10 light tanks WITHOUT any active focus-fire
# — stall WINS at those force ratios, collapsing the discrimination
# bar (CLAUDE.md: stall must LOSS on every tier / seed). Counts were
# raised to 12 / 14 / 14 to keep the bar load-bearing: stall LOSES
# on every tier, the intended focus-fire hold WINS, abandon-corridor
# brute/retreat LOSE. The per-tier corridor_width (4 / 3 / 2) and
# defender counts (3 / 4 / 4) remain as specified.
#
# Real-world / benchmark anchors:
#   - Military chokepoint defense: a narrow pass (a defile, a bridge,
#     a mountain saddle) lets a small force defeat a much larger one
#     because the terrain caps how many attackers can bring weapons to
#     bear at once. The defender trades on FRONTAGE, not numbers.
#   - Thermopylae (480 BC): ~7,000 Greeks held the Persian host in a
#     pass barely wide enough for a handful of men abreast — the choke
#     neutralised the Persian numerical advantage for days. The losing
#     alternative was always to march out and meet the Persians on the
#     open plain, where numbers decide.
#   - StarCraft 2 ramp hold: a small squad parked ON the ramp (the
#     map's natural chokepoint) defeats a larger army because only a
#     few enemy units fit on the ramp's width; the same squad caught
#     in the open is surrounded and focus-fired down.
#
# Mechanism (engine-load-bearing physics):
#   - The map carries a WATER wall along x=45..51 across the full map
#     height, EXCEPT for a per-tier-wide CLEAR corridor centred on
#     y=20 (chokepoint-arena generator: `pinch_x=48`, `pinch_width=6`,
#     `corridor_y=20`, `corridor_width=4|3|2`). Water is impassable to
#     the pathfinder; the corridor is the ONLY path between the WEST
#     lobe (agent base, x in [2..44]) and the EAST lobe (enemy
#     staging, x in [52..93]). An attacker cannot go around — it must
#     funnel through the lane.
#   - The agent commands medium tanks (2tnk) PRE-PLACED on the AGENT
#     side of the corridor mouth (x=43..44) at the choke. The
#     attackers are LIGHT tanks (1tnk) staged DEEP in the opposing
#     (east) lobe and hunt the squad through the corridor; the lane
#     funnels them to (corridor_width)-abreast at most.
#   - HOLD THE CHOKE (intended): keep the tanks anchored AT the mouth
#     (x=43..44, in the corridor rows) and FOCUS-FIRE the frontmost
#     attacker. The water bracketing the lane confines attackers to
#     the (corridor_width)-row column the whole length of the
#     corridor, so the squad only ever faces a narrow-front trickle.
#     Concentrating fire on one target at a time clears the lead
#     attacker quickly, opening the queue. The funneled force is
#     destroyed piecemeal.
#   - FIGHT IN THE OPEN (every losing play): if the squad charges
#     EAST through the corridor into the open enemy lobe, OR pulls
#     back WEST out of the corridor mouth, the full enemy force
#     surrounds the tanks and focus-fires them down. The loss cap
#     (own_units_gte:2 in the fail clause) busts before the kill
#     quota is met -> LOSS.
#
# Discrimination bar (script-policy proxies — tests/
# test_combat_hold_chokepoint.py):
#   • stall (only observe)            -> LOSS. The pre-placed squad
#     auto-fires (stance:2 Defend) but each tank picks its own nearest
#     target — fire is SPREAD across the narrow front instead of
#     concentrated, the kill rate is too low, and the larger force
#     wears the squad down: tanks lost -> loss cap busts AND the kill
#     quota is unmet.
#   • brute attack_move east          -> LOSS. The squad charges east
#     through the corridor into the open enemy lobe; the whole force
#     converges and focus-fires the squad down before the kill quota.
#   • wrong-path retreat WEST         -> LOSS. Pulling out of the
#     corridor mouth into the west open lets the enemy spill out and
#     fan around the squad; same surround-and-focus-fire outcome.
#   • intended hold-the-choke         -> WIN. The squad stays
#     anchored at the corridor mouth and focus-fires the frontmost
#     attacker; the funneled queue is ground down piecemeal; the
#     squad keeps enough tanks AT the mouth and hits the kill quota.
#
# Engine guardrails (per CLAUDE.md / SCENARIO_REVIEW_CHECKLIST.md):
#   - Map: chokepoint-arena 96x40 (cordon 2 -> playable x in [2..93],
#     y in [2..37]). Wall x=45..51 carries water; corridor row band
#     centred on y=20 (width per tier). Agent fact (objective
#     landmark) far WEST at (8,20), out of the fight. Persistent
#     unarmed enemy `fact` at (92,20) — east of the attackers —
#     absorbs the engine auto-done-on-enemy-wipe so the win/fail
#     evaluator sees the terminal frame (CLAUDE.md).
#   - Defenders stance:2 Defend (CLAUDE.md footgun: default stance is
#     3 AttackAnything, which would have the defenders ADVANCE toward
#     the nearest visible enemy when no in-range target, abandoning
#     the chokepoint advantage). With stance:2 they auto-fire on the
#     closest in-range enemy but never move — a stall play still
#     auto-fires but spreads the damage and loses on time.
#   - The enemy 1tnk force is stance:3 (hunt) so it converges on the
#     squad through the corridor without scripting.
#   - All deadlines reachable within max_turns: after_ticks 5401 <=
#     93 + 90*(75-1) = 6753; within_ticks 5400 likewise reachable.
#     In sustained combat ticks advance slower than the decision-only
#     ~90/turn, so max_turns 75 keeps the deadline biting.
#   - No actors on the documented silent-fail cells (50,20), (60,28),
#     (90,30) (CLAUDE.md): defenders sit at x=43..44 y=18..21;
#     attackers stage at x=78..88 y=10..30; enemy fact at (92,20).

meta:
  id: combat-hold-chokepoint
  title: 'Combat Micro — Hold a Narrow Pass Against a Larger Force'
  capability: action
  real_world_meaning: >
    A small medium-tank squad must defeat a numerically larger enemy
    light-tank force by HOLDING the chokepoint — a per-tier-wide
    corridor that is the only path across the map. The terrain caps
    how many attackers can bring weapons to bear at once: anchored at
    the corridor mouth, the squad faces only the few enemies that fit
    the lane abreast and grinds the larger force down piecemeal. The
    same squad fighting in the OPEN — having charged east through the
    corridor, or having pulled west and let the enemy spill into the
    open — is surrounded by the whole force at once and focus-fired
    down. The decision under test is positional: anchor the squad IN
    the chokepoint where the geometry does the work.
  robotics_analogue: >
    Defensive positioning at a terrain bottleneck: a small team holds
    a corridor / doorway / bridge so an adversary's numerical
    advantage is neutralised by frontage — only as many opponents as
    the bottleneck is wide can engage simultaneously. Choosing to
    fight where the geometry caps the enemy's effective force (rather
    than on open ground where the full force concentrates) is the
    load-bearing spatial-reasoning decision. Anchors: military
    chokepoint / defile defense, Thermopylae (480 BC), the StarCraft 2
    ramp hold.
  benchmark_anchor:
    - 'military chokepoint defense'
    - 'Thermopylae'
    - 'SC2 ramp hold'
  author: openra-bench

# Top-level base_map is the EASY chokepoint-arena spec — that satisfies
# is_map_supported (materializes the .oramap on load); medium and hard
# override with their own tier-specific corridor_width via `overrides:`.
base_map:
  generator: chokepoint-arena
  name: combat-hold-chokepoint-easy-arena
  width: 96
  height: 40
  cordon: 2
  pinch_x: 48
  pinch_width: 6
  corridor_y: 20
  corridor_width: 4

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: hunt}
  tools: [observe, move_units, attack_unit, attack_move, stop]
  planning: true
  # React the instant a tank is lost or an enemy is spotted — holding
  # a choke is reactive: re-concentrate fire on the next unit through
  # the corridor, and hold the line if a tank falls.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 8000}
  actors: []

levels:
  # ── EASY ────────────────────────────────────────────────────────────
  # Corridor width 4 (rows 18..21). 3 medium-tank defenders at the
  # corridor mouth (x=43..44) versus 12 light tanks staged deep in the
  # east lobe. The 4-wide corridor caps the engagement front at 4
  # abreast; concentrated fire from 3 mediums on the front rank clears
  # the queue faster than the queue can attrit the squad. Static
  # spread fire (stall) cannot keep up — the squad is worn down.
  easy:
    description: >
      Commander, this is a chokepoint defence on a 96x40 arena. You are
      given 3 medium tanks parked at the mouth of a four-cell-wide
      corridor (around x=44, y=18..21) and a Construction Yard far
      west at (8,20). The corridor is the only opening through an
      impassable water wall that splits the map at x=45..51. Twelve
      enemy light tanks stage deep in the eastern lobe and hunt you
      through the corridor. Stay anchored at the mouth and concentrate
      ALL three tanks' fire on the lead attacker — the water forces
      the swarm to a four-abreast trickle, so a focused front kills
      faster than the queue can attrit you. Abandoning the mouth
      (charging east or retreating west into the open) lets the full
      force surround you. Nine kills, at least two tanks still alive
      at the mouth, Construction Yard intact, within about 60 turns.
    overrides:
      # Map already declared at the pack level (chokepoint-arena 96x40
      # with corridor_width=4) — no level-level base_map override.
      actors:
        # SQUAD — 3 medium tanks at the corridor mouth on the AGENT
        # side (just west of the wall at x=45). stance:2 Defend:
        # auto-fire in range, never advance. Spread across the
        # 4-cell-wide lane rows.
        - {type: 2tnk, owner: agent, position: [44, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [44, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [44, 21], stance: 2}
        # OBJECTIVE LANDMARK — agent construction yard far WEST, out
        # of the fight (building_count_gte:fact:1 in the win clause).
        - {type: fact, owner: agent, position: [8, 20]}
        # ENEMY FORCE — 12 light tanks staged DEEP in the east lobe
        # (x in [80..88]) hunting the squad (stance:3). The corridor
        # funnels them to ≤4 abreast through the lane; the squad
        # has to actively focus-fire to keep up.
        - {type: 1tnk, owner: enemy, position: [80, 19], stance: 3}
        - {type: 1tnk, owner: enemy, position: [80, 20], stance: 3}
        - {type: 1tnk, owner: enemy, position: [80, 21], stance: 3}
        - {type: 1tnk, owner: enemy, position: [82, 19], stance: 3}
        - {type: 1tnk, owner: enemy, position: [82, 20], stance: 3}
        - {type: 1tnk, owner: enemy, position: [82, 21], stance: 3}
        - {type: 1tnk, owner: enemy, position: [84, 19], stance: 3}
        - {type: 1tnk, owner: enemy, position: [84, 20], stance: 3}
        - {type: 1tnk, owner: enemy, position: [84, 21], stance: 3}
        - {type: 1tnk, owner: enemy, position: [86, 19], stance: 3}
        - {type: 1tnk, owner: enemy, position: [86, 20], stance: 3}
        - {type: 1tnk, owner: enemy, position: [86, 21], stance: 3}
        # Persistent enemy `fact` BEHIND the attackers (further east)
        # — absorbs engine auto-done-on-enemy-wipe so the win/fail is
        # evaluated on the terminal frame.
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 9}
        - {own_units_gte: 2}
        - {building_count_gte: {type: fact, n: 1}}
        # HOLD THE MOUTH — ≥2 of 3 tanks must still be at the corridor
        # mouth. A squad that charged east (brute) or pulled west into
        # the open (wrong-path) fails this even with the kills.
        - {units_in_region_gte: {x: 44, y: 20, radius: 6, n: 2}}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {own_units_gte: 2}}
    max_turns: 75

  # ── MEDIUM ──────────────────────────────────────────────────────────
  # +1 controlled variable: corridor TIGHTENS to width 3 (rows 19..21)
  # AND the attacking force grows to 14 light tanks. 4 defenders. The
  # narrower 3-cell lane caps the engagement front tighter; the larger
  # force takes longer to grind down. Quota and survival cap scale
  # accordingly.
  medium:
    description: >
      Commander, this is a chokepoint defence on a 96x40 arena. You are
      given 4 medium tanks at the mouth of a three-cell-wide corridor
      (around x=43..44, y=19..21) and a Construction Yard far west at
      (8,20). The corridor is the only opening through an impassable
      water wall that splits the map at x=45..51. Fourteen enemy light
      tanks stage in the eastern lobe and hunt you through the corridor.
      Anchor at the mouth and concentrate fire on the lead attacker —
      the water forces the swarm to a three-abreast trickle.
      Abandoning the mouth (charging east or retreating west into the
      open) lets the full force surround you. Eleven kills, at least
      three tanks anchored at the mouth, Construction Yard intact,
      within about 60 turns.
    overrides:
      base_map:
        generator: chokepoint-arena
        name: combat-hold-chokepoint-medium-arena
        width: 96
        height: 40
        cordon: 2
        pinch_x: 48
        pinch_width: 6
        corridor_y: 20
        corridor_width: 3
      actors:
        # SQUAD — 4 medium tanks at the corridor mouth. The 3-wide
        # lane (y=19..21) fits 3 across at x=44; the 4th sits one
        # cell back at (43,20) as a reserve that can swap forward
        # when a front-row tank takes damage.
        - {type: 2tnk, owner: agent, position: [44, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [44, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [44, 21], stance: 2}
        - {type: 2tnk, owner: agent, position: [43, 20], stance: 2}
        - {type: fact, owner: agent, position: [8, 20]}
        # ENEMY FORCE — 14 light tanks staged in the east lobe in
        # multiple ranks (x=80..86). The 3-wide lane caps the engaged
        # front; only active focus-fire from 4 mediums clears the
        # queue faster than the attrition rate.
        - {type: 1tnk, owner: enemy, position: [80, 19], stance: 3}
        - {type: 1tnk, owner: enemy, position: [80, 20], stance: 3}
        - {type: 1tnk, owner: enemy, position: [80, 21], stance: 3}
        - {type: 1tnk, owner: enemy, position: [82, 19], stance: 3}
        - {type: 1tnk, owner: enemy, position: [82, 20], stance: 3}
        - {type: 1tnk, owner: enemy, position: [82, 21], stance: 3}
        - {type: 1tnk, owner: enemy, position: [84, 19], stance: 3}
        - {type: 1tnk, owner: enemy, position: [84, 20], stance: 3}
        - {type: 1tnk, owner: enemy, position: [84, 21], stance: 3}
        - {type: 1tnk, owner: enemy, position: [86, 19], stance: 3}
        - {type: 1tnk, owner: enemy, position: [86, 20], stance: 3}
        - {type: 1tnk, owner: enemy, position: [86, 21], stance: 3}
        - {type: 1tnk, owner: enemy, position: [82, 18], stance: 3}
        - {type: 1tnk, owner: enemy, position: [84, 22], stance: 3}
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 11}
        - {own_units_gte: 3}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_in_region_gte: {x: 44, y: 20, radius: 6, n: 3}}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {own_units_gte: 2}}
    max_turns: 75

  # ── HARD ────────────────────────────────────────────────────────────
  # +1 controlled variable: corridor TIGHTENS further to width 2 (rows
  # 19..20) — the geometry multiplier at its strongest. Attacking
  # force is 14 light tanks (matches the user-spec count; the tighter
  # corridor compensates for the same force size by capping engagement
  # at 2 abreast). The 4-defender squad concentrating fire grinds the
  # queue down one leader at a time; the same 4 defenders in the open
  # are folded by the 14-strong force.
  # Per CLAUDE.md item 7 (UPGRADED hard tier must vary by seed): the
  # 14-tank enemy force stages from a NORTH cluster (y=10..14) OR a
  # SOUTH cluster (y=26..30), round-robined by seed (enemy-side
  # `spawn_point` filter activates per-owner — CLAUDE.md per-owner
  # spawn_point note). The corridor is the only path regardless of
  # which cluster the force staged in; the hold-the-choke doctrine
  # generalises while a memorised opening does not.
  hard:
    description: >
      Commander, this is a chokepoint defence on a 96x40 arena, the
      tightest tier. You are given 4 medium tanks at the mouth of a
      two-cell-wide corridor (around x=43..44, y=19..20) and a
      Construction Yard far west at (8,20). The corridor is the only
      opening through an impassable water wall that splits the map at
      x=45..51. Fourteen enemy light tanks stage in the eastern lobe —
      from a north (y=10..14) OR south (y=26..30) cluster depending on
      seed — and hunt you through the corridor. Anchor at the mouth and
      concentrate fire on the lead attacker; the water forces the
      swarm to a two-abreast queue regardless of which side they
      staged from. Abandoning the mouth lets the full force surround
      you. Nine kills, at least three tanks anchored at the mouth,
      Construction Yard intact, within about 60 turns.
    overrides:
      base_map:
        generator: chokepoint-arena
        name: combat-hold-chokepoint-hard-arena
        width: 96
        height: 40
        cordon: 2
        pinch_x: 48
        pinch_width: 6
        corridor_y: 20
        corridor_width: 2
      actors:
        # SQUAD — 4 medium tanks. The 2-wide lane (y=19..20) fits 2
        # across; 2 at the mouth (x=44) and 2 one cell back (x=43)
        # form a two-deep formation that absorbs losses while keeping
        # at least one tank in each lane row.
        - {type: 2tnk, owner: agent, position: [44, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [44, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [43, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [43, 20], stance: 2}
        - {type: fact, owner: agent, position: [8, 20]}
        # ENEMY FORCE spawn_point 0 — NORTH cluster (y=10..14, in the
        # east lobe NORTH of the corridor lane). 14 light tanks.
        - {type: 1tnk, owner: enemy, position: [78, 10], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [80, 10], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [82, 10], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [78, 12], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [80, 12], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [82, 12], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [84, 12], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [78, 14], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [80, 14], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [82, 14], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [84, 14], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [86, 14], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [80, 11], stance: 3, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [84, 11], stance: 3, spawn_point: 0}
        # ENEMY FORCE spawn_point 1 — SOUTH cluster (y=26..30, in the
        # east lobe SOUTH of the corridor lane). 14 light tanks.
        - {type: 1tnk, owner: enemy, position: [78, 26], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [80, 26], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [82, 26], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [78, 28], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [80, 28], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [82, 28], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [84, 28], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [78, 30], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [80, 30], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [82, 30], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [84, 30], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [86, 30], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [80, 27], stance: 3, spawn_point: 1}
        - {type: 1tnk, owner: enemy, position: [84, 27], stance: 3, spawn_point: 1}
        # Persistent enemy `fact` BEHIND the attackers — duplicated
        # across BOTH spawn groups (enemy-side spawn_point filter
        # would otherwise drop the unmatched copy).
        - {type: fact, owner: enemy, position: [92, 20], spawn_point: 0}
        - {type: fact, owner: enemy, position: [92, 20], spawn_point: 1}
    win_condition:
      all_of:
        - {units_killed_gte: 9}
        - {own_units_gte: 3}
        - {building_count_gte: {type: fact, n: 1}}
        # HOLD THE MOUTH — ≥3 of 4 tanks must still be at the corridor
        # mouth. Critical on hard: with the tighter lane a wrong-path
        # retreat could scrape the kill quota by kiting; the geometry
        # clause makes that a LOSS.
        - {units_in_region_gte: {x: 44, y: 20, radius: 6, n: 3}}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {own_units_gte: 2}}
    max_turns: 75
