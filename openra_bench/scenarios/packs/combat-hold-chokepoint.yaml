# combat-hold-chokepoint — hold a narrow pass: 4x 2tnk plug a 3-cell
# corridor so a larger enemy force can only feed a few units at a time.
#
# Wave-11 OpenRA-Bench scenario seed (capability: action).
#
# Real-world / benchmark anchors:
#   - Military chokepoint defense: a narrow pass (a defile, a bridge,
#     a mountain saddle) lets a small force defeat a much larger one
#     because the terrain caps how many attackers can bring weapons
#     to bear at once. The defender trades on FRONTAGE, not numbers.
#   - Thermopylae (480 BC): ~7,000 Greeks held the Persian host in a
#     pass barely wide enough for a handful of men abreast — the choke
#     neutralised the Persian numerical advantage for days. The losing
#     alternative was always to march out and meet the Persians on the
#     open plain, where numbers decide.
#   - StarCraft 2 ramp hold: a small squad parked ON the ramp (the
#     map's natural chokepoint) defeats a larger army because only a
#     few enemy units fit on the ramp's width; the same squad caught
#     in the open is surrounded and focus-fired down.
#
# Mechanism (engine-load-bearing physics):
#   - The map carries a CORRIDOR: two `silo` walls (impassable to the
#     pathfinder — the "buildings-as-walls" idiom proven in
#     navigation-confined-hard-only) fill the whole playable height
#     EXCEPT a 3-cell-tall lane at y=19,20,21, for the x-band 44..96.
#     The corridor is the ONLY path between the WEST half of the map
#     (where the agent's construction yard sits) and the EAST half
#     (where the enemy force stages). The walls reach the map edges,
#     so an attacker cannot go around — it must funnel through the
#     3-wide lane.
#   - The agent commands 4 medium tanks (2tnk), PRE-PLACED inside the
#     corridor at the choke (around x=52..53, y=19..21). A larger
#     enemy force (`hunt` bot — every enemy unit drives at the nearest
#     agent unit and pursues) stages in the EAST OPEN and must funnel
#     through the corridor to reach the squad.
#   - HOLD THE CHOKE (intended): keep the 4 tanks anchored IN the
#     corridor and FOCUS-FIRE the frontmost enemy. The bracketing
#     walls confine the attackers to the 3-row lane the whole length
#     of the corridor, so the squad only ever faces a 3-abreast front
#     — never the whole force at once. Four medium tanks out-trade a
#     funneled 3-abreast trickle of light tanks; the larger force is
#     destroyed piecemeal. The squad keeps >=3 tanks and racks up the
#     kill count.
#   - FIGHT IN THE OPEN (every losing play): if the squad charges
#     EAST out of the corridor into the open ground beyond, OR pulls
#     back WEST out of the corridor (letting the enemy spill into the
#     west open and fan around the squad), the full enemy force
#     surrounds all 4 tanks at once and focus-fires them down. The
#     loss cap (own_units_gte:2 in the fail clause) busts before the
#     kill quota is met -> LOSS. Empirically (verified 2026-05-20),
#     4x 2tnk in the open are wiped by a >=10-strong 1tnk force; the
#     same 4 tanks holding the corridor beat 12-16 light tanks for
#     the loss of at most one tank.
#
# Discrimination bar (script-policy proxies — tests/
# test_combat_hold_chokepoint.py):
#   • stall (only observe)            -> LOSS. The pre-placed squad
#     auto-fires (stance:2 Defend) but each tank picks its own
#     nearest target — the fire is SPREAD across the 3-abreast front
#     instead of concentrated, so the squad kills too slowly, the
#     front never thins, and the squad is worn down -> own_units_gte:2
#     busts (verified: killed ~4, lost 3).
#   • brute attack_move east          -> LOSS. The squad charges out
#     of the corridor's east mouth into the open; the whole enemy
#     force converges and focus-fires all 4 tanks -> loss cap busted
#     before any kills (verified: killed 0, lost 3).
#   • intended hold-the-choke         -> WIN. The 4 tanks stay
#     anchored in the corridor and focus-fire the frontmost enemy;
#     the 3-abreast funnel is ground down piecemeal; the squad keeps
#     >=3 tanks and hits the kill quota before the deadline -> WIN
#     (verified: killed 11-12, lost 0-1, all seeds).
#
# Engine guardrails (per CLAUDE.md / SCENARIO_REVIEW_CHECKLIST.md):
#   - Map: rush-hour-arena (128x40, playable x in [2..126], y in
#     [2..38]). Corridor walls span x=44..96, filling y=2..18 and
#     y=22..38; the lane is y=19,20,21. Agent fact (objective
#     landmark) far WEST at (10,20); enemy force stages in the east
#     open around x=104..112.
#   - `silo` walls block PATHING but not weapons fire — so the
#     chokepoint works by CONFINING the attacker to a 3-row lane
#     (capping how many enemies can be within weapon range of the
#     squad at once), not by blocking line of sight. This is why the
#     corridor must bracket the lane along its whole length: a thin
#     single wall would let attackers stack against the wall face in
#     every row and all fire through it.
#   - `silo` walls are stance:0 HoldFire (inert obstacles, never
#     fire). The squad's tanks are stance:2 Defend so a stall play
#     still auto-fires on whatever is in range but never advances —
#     a stall LOSES anyway because stance:2 SPREADS fire instead of
#     concentrating it.
#   - Persistent agent `fact` at (10,20) is the objective landmark
#     (building_count_gte:fact:1 in the win clause); far from the
#     fight, it survives a winning hold and satisfies the engine's
#     need for a surviving own building.
#   - The enemy `hunt` force is the only `MustBeDestroyed` adversary;
#     a winning hold wipes it, so a persistent unarmed enemy `fact`
#     far EAST at (122,20) absorbs the engine auto-done-on-enemy-wipe
#     so the win/fail evaluator sees the terminal frame (CLAUDE.md).
#   - All deadlines reachable within max_turns: after_ticks 5401 <=
#     93 + 90*(75-1) = 6753; within_ticks 5400 likewise reachable.
#     In sustained combat ticks advance slower than the decision-only
#     ~90/turn, so max_turns 75 keeps the deadline biting.
#   - No actors on the documented silent-fail cells (50,20), (60,28),
#     (90,30): the squad stages at x=52..53 y=19..21 (three tanks
#     abreast in the lane at x=52 plus one reserve directly behind at
#     (53,20)); the enemy stages at x=104..112 y=18..21 (clear of
#     (90,30)).

meta:
  id: combat-hold-chokepoint
  title: 'Combat Micro — Hold a Narrow Pass Against a Larger Force'
  capability: action
  real_world_meaning: >
    Four medium tanks (2tnk) must defeat a numerically larger enemy
    force by HOLDING a chokepoint — a narrow 3-cell corridor that is
    the only path across the map. The terrain caps how many attackers
    can bring weapons to bear at once: anchored inside the corridor,
    the four tanks face only the ~3 enemies that fit the lane abreast
    and grind the larger force down piecemeal. The same four tanks
    fighting in the OPEN — having charged east out of the corridor,
    or having let the enemy spill into the open ground behind — are
    surrounded by the whole enemy force at once and focus-fired down.
    The decision under test is positional: anchor the squad IN the
    chokepoint where the geometry does the work, rather than meeting
    the enemy on open ground where numbers decide.
  robotics_analogue: >
    Defensive positioning at a terrain bottleneck: a small team holds
    a corridor / doorway / bridge so an adversary's numerical
    advantage is neutralised by frontage — only as many opponents as
    the bottleneck is wide can engage simultaneously. Choosing to
    fight where the geometry caps the enemy's effective force (rather
    than on open ground where the full force concentrates) is the
    load-bearing spatial-reasoning decision. Anchors: military
    chokepoint / defile defense, Thermopylae (480 BC), the StarCraft 2
    ramp hold.
  benchmark_anchor:
    - 'military chokepoint defense'
    - 'Thermopylae'
    - 'SC2 ramp hold'
  author: openra-bench

base_map: rush-hour-arena

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: hunt}
  tools: [observe, move_units, attack_unit, attack_move, stop]
  planning: true
  # React the instant a tank is lost or an enemy is spotted — holding
  # a choke is reactive: re-concentrate fire on the next unit through
  # the corridor, and hold the line if a tank falls.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 8000}
  actors: []

levels:
  # ── EASY ────────────────────────────────────────────────────────────
  # Bare chokepoint-hold skill. 4x 2tnk vs a force of 12 light tanks
  # (1tnk) hunting from the east. Holding the 3-cell corridor caps the
  # enemy to a 3-abreast trickle — the squad out-trades it. Charging
  # into the open east, or letting the enemy fan into the open west,
  # gets the squad surrounded. Win: kill >=8, keep >=3 tanks, fact
  # alive, before tick 5400.
  easy:
    description: >
      Four medium tanks (2tnk) hold a narrow corridor. Two silo walls
      split the map; the ONLY path between the west and east halves is
      a 3-cell-tall lane (y=19,20,21) running x=44..96. Your squad is
      pre-placed inside the corridor at the choke (around x=52..53). A
      force of TWELVE enemy light tanks (1tnk) stages in the EAST OPEN
      and hunts your squad — every enemy drives at the nearest tank
      and pursues. Win by destroying at least EIGHT enemy units while
      keeping at least THREE of your tanks alive and your construction
      yard intact, before tick 5400. HOLD THE CORRIDOR: keep your four
      tanks anchored in the lane and concentrate their fire on the
      frontmost enemy — the walls confine the attackers to a 3-abreast
      trickle you can grind down. Charging EAST out of the corridor
      into the open, or pulling WEST and letting the enemy fan out,
      lets all twelve enemies surround you at once and focus-fire your
      squad down.
    overrides:
      actors:
        # SQUAD — 4 medium tanks PRE-PLACED at the choke, inside the
        # corridor lane (y=19,20,21). stance:2 Defend: auto-fire in
        # range, never advance. The intended play keeps them anchored
        # here and FOCUS-FIRES the frontmost enemy; abandoning the
        # corridor (charging east, or pulling west into the open) loses.
        - {type: 2tnk, owner: agent, position: [52, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [52, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [52, 21], stance: 2}
        - {type: 2tnk, owner: agent, position: [53, 20], stance: 2}
        # OBJECTIVE LANDMARK — construction yard far west, out of the
        # fight. building_count_gte:fact:1 in the win clause; razed
        # only if the enemy breaks the hold and reaches the west base.
        - {type: fact, owner: agent, position: [10, 20]}
        # ENEMY FORCE — 12 light tanks hunting from the east open.
        # They converge on the squad and pursue; the corridor funnels
        # them to a 3-abreast trickle through the lane.
        - {type: 1tnk, owner: enemy, position: [104, 19], stance: 3, count: 1}
        - {type: 1tnk, owner: enemy, position: [104, 20], stance: 3, count: 1}
        - {type: 1tnk, owner: enemy, position: [104, 21], stance: 3, count: 1}
        - {type: 1tnk, owner: enemy, position: [106, 19], stance: 3, count: 1}
        - {type: 1tnk, owner: enemy, position: [106, 20], stance: 3, count: 1}
        - {type: 1tnk, owner: enemy, position: [106, 21], stance: 3, count: 1}
        - {type: 1tnk, owner: enemy, position: [108, 19], stance: 3, count: 1}
