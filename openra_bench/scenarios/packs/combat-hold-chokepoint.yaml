  # ── MEDIUM ──────────────────────────────────────────────────────────
  # +1 controlled variable: a LARGER enemy force (16 light tanks
  # instead of 12) and a higher kill quota (>=9). The corridor
  # geometry is unchanged — the only way 4 tanks beat 16 is to hold
  # the lane so the numbers never all bear at once. In the open the
  # 16-tank force overwhelms the squad even faster.
  medium:
    description: >
      Four medium tanks (2tnk) hold a narrow corridor. Two silo walls
      split the map; the ONLY path between the west and east halves is
      a 3-cell-tall lane (y=19,20,21) running x=44..96. Your squad is
      pre-placed inside the corridor at the choke. A force of SIXTEEN
      enemy light tanks (1tnk) stages in the EAST OPEN and hunts your
      squad. Win by destroying at least NINE enemy units while keeping
      at least THREE of your tanks alive and your construction yard
      intact, before tick 5400. HOLD THE CORRIDOR: keep your four
      tanks anchored in the lane and concentrate fire on the frontmost
      enemy so the sixteen-strong force can only feed a 3-abreast
      trickle. Meeting the sixteen-tank force in the open, on either
      side of the corridor, gets your squad surrounded and focus-fired
      down before the kill quota is met.
    overrides:
      actors:
        # SQUAD — 4 medium tanks PRE-PLACED at the choke, inside the
        # corridor lane (y=19,20,21). stance:2 Defend: auto-fire in
        # range, never advance. The intended play keeps them anchored
        # here and FOCUS-FIRES the frontmost enemy; abandoning the
        # corridor (charging east, or pulling west into the open) loses.
        - {type: 2tnk, owner: agent, position: [52, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [52, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [52, 21], stance: 2}
        - {type: 2tnk, owner: agent, position: [53, 20], stance: 2}
        # OBJECTIVE LANDMARK — construction yard far west, out of the
        # fight. building_count_gte:fact:1 in the win clause; razed
        # only if the enemy breaks the hold and reaches the west base.
        - {type: fact, owner: agent, position: [10, 20]}
