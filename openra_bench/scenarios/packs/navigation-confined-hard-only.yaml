        - {type: silo, owner: enemy, position: [42, 31], stance: 0}
        - {type: silo, owner: enemy, position: [42, 32], stance: 0}
        - {type: silo, owner: enemy, position: [42, 33], stance: 0}
        - {type: silo, owner: enemy, position: [42, 34], stance: 0}
        - {type: silo, owner: enemy, position: [42, 35], stance: 0}
        # Egress marker (always-on): high-HP non-combatant fact at
        # the far SE corner of the egress zone — gives the model a
        # visible "where to" landmark on the minimap.
        - {type: fact, owner: enemy, position: [55, 30], stance: 0, health: 100}
    win_condition:
      all_of:
        - all_units_in_region: {x: 55, y: 30, radius: 6}
        - within_ticks: 2700
        - units_lost_lte: 0
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {units_lost_lte: 0}}
    max_turns: 31
