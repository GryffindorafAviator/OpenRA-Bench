      - {type: e1, owner: agent, position: [62, 31], stance: 0}
      - {type: e1, owner: agent, position: [63, 31], stance: 0}
      # Attackers — three groups of 6 e1 each, aligned with the bridges.
      - {type: e1, owner: enemy, position: [28, 4], stance: 3}
      - {type: e1, owner: enemy, position: [29, 4], stance: 3}
      - {type: e1, owner: enemy, position: [30, 4], stance: 3}
      - {type: e1, owner: enemy, position: [31, 4], stance: 3}
