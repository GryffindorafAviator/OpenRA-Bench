      - {type: e1, owner: enemy, position: [62, 4], stance: 3}
      - {type: e1, owner: enemy, position: [63, 4], stance: 3}
      - {type: e1, owner: enemy, position: [64, 4], stance: 3}
      - {type: e1, owner: enemy, position: [65, 4], stance: 3}
      - {type: e1, owner: enemy, position: [92, 4], stance: 3}
      - {type: e1, owner: enemy, position: [93, 4], stance: 3}
      - {type: e1, owner: enemy, position: [94, 4], stance: 3}
      - {type: e1, owner: enemy, position: [95, 4], stance: 3}
      - {type: e1, owner: enemy, position: [96, 4], stance: 3}
      - {type: e1, owner: enemy, position: [97, 4], stance: 3}
      - {type: fact, owner: enemy, position: [120, 4]}
    win_condition:
      all_of:
      - units_killed_gte: 8
      - has_building: fact
      - within_ticks: 3150
      - building_count_gte:
          type: proc
          n: 3
    fail_condition:
      any_of:
      - after_ticks: 3151
      - not:
          has_building: fact
      - not:
          building_count_gte:
            type: proc
            n: 3
    max_turns: 40
