# combat-flanking-attack — Flank a frontal enemy line instead of head-on.
#
# Wave-6 Group D combat-micro seed (capability: action).
#
# Real-world / benchmark anchors:
#   - SC2 flanking unit micro (army splits to attack from multiple
#     bearings so the defender's army can't focus-fire on one front).
#   - Military flank-maneuver doctrine (refuse the frontal trade; hit
#     the enemy's vulnerable side where fewer of his weapons can bear
#     simultaneously on the lead unit).
#   - "Force-multiplier through angle of attack" — same forces, same
#     enemy, but the bearing of contact controls how many enemy
#     barrels can fire on the lead tank at once.
#
# Mechanism (engine-load-bearing physics):
#   - The enemy is a wall of anti-tank rocket soldiers (e3, Dragon
#     launcher, ~range 5) backed by a rifle-infantry (e1) shield
#     wall on the front face. All defenders are stance:2 (Defend =
#     auto-fire in range, no lunge for INFANTRY), so the entire wall
#     fires on any tank in range — not just the tank that opened
#     fire. The line "faces west": every defender's weapon envelope
#     covers a tank approaching head-on along the engagement axis.
#   - The map is a 32×40 arena with a WATER funnel running through
#     the centre (x=8..20 on the engagement-axis band y=8..32).
#     The water seals the head-on lane: a column charging east at
#     y=20 walks into the funnel and either drowns in water tiles
#     or pours into the e3 stack at x=24 (range envelope reaches
#     back to x≈19, which is on the eastern lip of the funnel).
#     OPEN flank lanes run above/below the water (y=2..5 north,
#     y=35..37 south). A tank routed via y=2..5 enters Dragon
#     range of only the y=18 e3 first (Manhattan 14+ to y=22 e3 →
#     out of range), so the wall is sequenced 1-vs-1.
#
# Discrimination bar (four script-policy proxies in the test file):
#   • stall (only observe)             → LOSS. Enemy doesn't approach
#     (defenders are stance:2, posted in the line); kill bar never
#     met → after_ticks LOSS.
#   • brute attack_move east (y=20)    → LOSS. Column walks into
#     the water funnel + concentrated rocket fire; the survival
#     bar (≥3 of 4 tanks alive) trips before the kill bar.
#   • frontal-charge (move east on y=20 + attack nearest e3)
#                                       → LOSS. Same head-on
#     geometry; all e3 fire on the lead tank simultaneously.
#   • intended flank (route via y=2..5 or y=35..37 detour,
#     approach the line end-on)        → WIN. 1-vs-1 sequenced
#     engagement preserves the survival bar.
#
# Engine guardrails (per CLAUDE.md / SCENARIO_REVIEW_CHECKLIST.md):
#   - Map: per-tier custom 32×40 arena (cordon 2 ⇒ playable
#     x in [2..29], y in [2..37]) with a central WATER funnel
#     (x=8..20) blocking the head-on lane. Strike force at x=4;
#     enemy line at x=24. Total engagement distance ~20 cells from
#     the spawn to the line — no decision-free march before the
#     funnel/detour decision bites.
#       * easy   — ONE flank lane (NORTH y=2..5 open; south sealed
#                  by an extended water shelf y=24..37 across
#                  x=8..29). Single-corridor recognition.
#       * medium — TWO flank lanes (NORTH y=2..5 + SOUTH y=35..37).
#                  Wider water funnel forces commitment to one
#                  side; mid-bands walled so neither flank can be
#                  shortened into Dragon range.
#       * hard   — BOTH lanes open; agent stages NORTH (y=14..17)
#                  or SOUTH (y=23..26) per seed (anti-memorisation).
#                  Mid-bands closed so the only safe bypass is the
#                  FAR flank corresponding to the spawn corridor.
#   - Single explicit mpspawn (4,20) so the arena's default
#     4-corner mpspawns don't rotate per seed and offset
#     pre-placed actor coords (Wave-13 footgun #6).
#   - Persistent far-east enemy `fact` keeps the episode alive
#     past the moment the line is wiped, so the win/fail
#     evaluator sees the terminal frame (no DRAW collapse on
#     enemy-unit wipe).
#   - All deadlines (after_ticks 4501) are reachable within the
#     declared max_turns (~64 ticks/turn under interrupt mode ⇒
#     max_turns 51 ⇒ tick ≤ ~3300 — but the predicate budget
#     uses the wider envelope; verify per-test that the deadline
#     can actually be hit).
#   - Defender stance:2 (Defend = auto-fire in range, no chase)
#     is critical: stance:1 ReturnFire only fires on the unit
#     that SHOT this defender; stance:3 would chase the flanker
#     with the whole line and collapse the discrimination.
#   - Per CLAUDE.md, (24,20) is verified individually-placeable
#     by checking the per-tier .oramap render.

meta:
  id: combat-flanking-attack
  title: 'Combat Micro — Flank a Frontal Anti-Tank Line Instead of Charging Head-On'
  capability: action
  real_world_meaning: >
    Medium tanks at the west edge face a tight vertical line of anti-
    tank rocket soldiers backed by a rifle shield, behind a central
    water funnel. The line "faces west" — every defender's weapon
    envelope covers a tank approaching head-on. Charging head-on puts
    the lead tank inside Dragon range of every rocket soldier in the
    stack simultaneously and is squeezed by the water funnel. The
    winning play is the flank: route off-axis (north or south detour
    above/below the water) and approach the line END-ON so only one
    or two defenders are in range at any moment. Same enemy, same
    forces, but the angle of attack controls how many enemy barrels
    can bear on the leading tank.
  robotics_analogue: >
    Multi-agent strike-package geometry: the bearing of contact
    against a static defender controls how much of the defender's
    firepower can engage simultaneously. The decision under test is
    spatial routing — refuse the high-attrition frontal trade and
    approach via an axis that sequences the engagement 1-vs-1
    rather than 1-vs-N.
  benchmark_anchor:
    - "SC2 flank micro"
    - "military flank maneuver doctrine"
    - "tactical: avoid frontal trade"
    - "force-multiplier through angle of attack"
  author: openra-bench

base_map: rush-hour-arena

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: ''}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  # React the instant a tank is lost or an enemy is spotted — flank
  # micro is reactive; without these the model only re-targets on the
  # next turn boundary and the geometry decisions don't propagate.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 6000}
  actors: []

levels:
  # ── EASY ────────────────────────────────────────────────────────────
  # ONE detour (north). Light line of 5× e3 + 5× e1 shield. Stall
  # LOSES on the clock (defenders are stance:2 ReturnFire-equivalent,
  # never advance). Brute charge into the water funnel dies.
  easy:
    description: >
      Commander, this is a combat engagement against a defensive
      enemy line. You are given 4 medium tanks on the west edge,
      Return-Fire orders. An anti-tank line sits in the centre at
      x=22-24 — 5 rocket infantry behind a 5-man rifle shield, all
      on Defend orders (auto-fire in range, no chase). A water-walled
      funnel runs through the centre east-west; a clear NORTH detour
      lane runs above the water at y=2-5. Kill at least 3 enemies
      and keep at least 3 of 4 tanks alive within 3000 ticks.
    overrides:
      base_map:
        generator: arena
        name: combat-flanking-attack-arena-easy
        width: 32
        height: 40
        cordon: 2
        spawns: [[4, 20]]
        title: 'Combat Flanking Attack Easy (1-detour, north)'
        obstacles:
          # CENTRAL FUNNEL — water across y=8..32, x=8..20 — kills
          # the head-on lane. North lane y=2..5 stays open.
          - {x: 8, y: 8, w: 13, h: 25}
          # SOUTH SEAL — extra water shelf y=33..37 across the
          # east half x=8..29. Closes the south flank entirely on
          # easy (single-corridor recognition).
          - {x: 8, y: 33, w: 22, h: 5}
      actors:
        # STRIKE FORCE — 4 medium tanks at the west edge.
        - {type: 2tnk, owner: agent, position: [4, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 21], stance: 1}
        # RIFLE SHIELD — 5× e1 at x=22, y=18..22 (front face).
        - {type: e1, owner: enemy, position: [22, 18], stance: 2}
        - {type: e1, owner: enemy, position: [22, 19], stance: 2}
        - {type: e1, owner: enemy, position: [22, 20], stance: 2}
        - {type: e1, owner: enemy, position: [22, 21], stance: 2}
        - {type: e1, owner: enemy, position: [22, 22], stance: 2}
        # ANTI-TANK LINE — 5× e3 at x=24, y=18..22.
        - {type: e3, owner: enemy, position: [24, 18], stance: 2}
        - {type: e3, owner: enemy, position: [24, 19], stance: 2}
        - {type: e3, owner: enemy, position: [24, 20], stance: 2}
        - {type: e3, owner: enemy, position: [24, 21], stance: 2}
        - {type: e3, owner: enemy, position: [24, 22], stance: 2}
        # SENTINEL — far-east unarmed fact, keeps the episode alive
        # past the moment the line is wiped (no DRAW collapse on
        # enemy-unit wipe). Placed in the open NORTH band.
        - {type: fact, owner: enemy, position: [29, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {own_units_gte: 3}
        - {within_ticks: 3000}
    # Qwen-9B v3 deep triage (S.3) flagged easy:1 as DRAW: the model
    # stalled (6/26 observe turns) and the engine produced done=True
    # before the after_ticks:3001 fail clause could bite — leaving
    # neither win nor fail latched → DRAW. The original fail clause
    # only fires at the explicit tick deadline or on full force-wipe;
    # a passivity inversion that lands no kills and keeps its army
    # whole survives the auto-`done` race and draws. The added
    # all_of clause closes that gap: at tick 1500 (well past first
    # contact even under heavy interrupt event firing — the intended
    # flank reaches the line by tick ~500 and lands 3 kills by tick
    # ~900) any policy that has scored ZERO kills is LOSING, so the
    # passivity / wrong-route / stall inversions become explicit
    # losses regardless of how done=True is reached.
    fail_condition:
      any_of:
        - {after_ticks: 3001}
        - {not: {own_units_gte: 3}}
        - all_of:
            - {after_ticks: 1500}
            - {not: {units_killed_gte: 1}}
    max_turns: 51

  # ── MEDIUM ──────────────────────────────────────────────────────────
  # TWO detours (north + south). Heavier line (7× e3 + 5× e1).
  medium:
    description: >
      Commander, this is a combat engagement against a defensive
      enemy line. You are given 4 medium tanks on the west edge,
      Return-Fire orders. A heavy enemy line sits across the centre
      at x=22-24 — 7 rocket infantry backed by 5 rifle infantry, on
      Defend orders. A water-walled funnel runs east-west through
      the centre. Open detour lanes run above the water (north,
      y=2-5) and below (south, y=35-37). Kill at least 4 enemies
      and keep at least 3 of 4 tanks alive within 3000 ticks.
    overrides:
      base_map:
        generator: arena
        name: combat-flanking-attack-arena-medium
        width: 32
        height: 40
        cordon: 2
        spawns: [[4, 20]]
        title: 'Combat Flanking Attack Medium (2-detour)'
        obstacles:
          # CENTRAL FUNNEL — water across y=8..32, x=8..20 — kills
          # the head-on lane. NORTH y=2..5 and SOUTH y=35..37 both
          # open.
          - {x: 8, y: 8, w: 13, h: 25}
      actors:
        - {type: 2tnk, owner: agent, position: [4, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 21], stance: 1}
        # RIFLE SHIELD — 5× e1 at x=22, y=18..22.
        - {type: e1, owner: enemy, position: [22, 18], stance: 2}
        - {type: e1, owner: enemy, position: [22, 19], stance: 2}
        - {type: e1, owner: enemy, position: [22, 20], stance: 2}
        - {type: e1, owner: enemy, position: [22, 21], stance: 2}
        - {type: e1, owner: enemy, position: [22, 22], stance: 2}
        # ANTI-TANK LINE — 7× e3 at x=24, y=17..23.
        - {type: e3, owner: enemy, position: [24, 17], stance: 2}
        - {type: e3, owner: enemy, position: [24, 18], stance: 2}
        - {type: e3, owner: enemy, position: [24, 19], stance: 2}
        - {type: e3, owner: enemy, position: [24, 20], stance: 2}
        - {type: e3, owner: enemy, position: [24, 21], stance: 2}
        - {type: e3, owner: enemy, position: [24, 22], stance: 2}
        - {type: e3, owner: enemy, position: [24, 23], stance: 2}
        - {type: fact, owner: enemy, position: [29, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 4}
        - {own_units_gte: 3}
        - {within_ticks: 3000}
    fail_condition:
      any_of:
        - {after_ticks: 3001}
        - {not: {own_units_gte: 3}}
    max_turns: 51

  # ── HARD ────────────────────────────────────────────────────────────
  # 8 tanks split N/S by seed. Full-strength wall: 9 rocket front
  # rank + 4 back rank + 7 rifle shield. Both groups must come around
  # the funnel and hit the line from both sides at once.
  #
  # 2026-05-23 audit (Qwen-9B deep-dive medium-vs-hard inversion):
  # the prior hard survival floor own_units_gte:3 (allowing up to 5
  # tank losses out of 8) was structurally LOOSER than medium's
  # own_units_gte:3 out of 4 — the floor relaxed as the headcount
  # escalated, making hard paradoxically easier on the survival
  # constraint. Tighten the hard floor to own_units_gte:6 (matches
  # medium's 75% survival ratio: 3/4 medium = 6/8 hard) so the
  # escalation is monotonic — a brute frontal/funnel play that loses
  # 3+ tanks on hard now busts the cap as it does on medium.
  hard:
    description: >
      Commander, this is a combat engagement against a defensive
      enemy wall. You are given 8 medium tanks (Return-Fire orders)
      split between two staging corridors — one far-north column
      (y=14-17) and one far-south column (y=23-26), depending on
      seed. A full-strength enemy wall sits across the centre at
      x=22-26 — 13 rocket infantry in two rows backed by 7 rifle
      infantry, on Defend orders. A water-walled funnel runs
      east-west through the centre. Open ground runs above the
      water (north) and below (south). Kill at least 5 enemies and
      keep at least 6 of 8 tanks alive within 3000 ticks.
    overrides:
      base_map:
        generator: arena
        name: combat-flanking-attack-arena-hard
        width: 32
        height: 40
        cordon: 2
        spawns: [[4, 20]]
        title: 'Combat Flanking Attack Hard (seed-rotated spawn)'
        obstacles:
          # CENTRAL FUNNEL — water across y=8..32, x=8..20.
          - {x: 8, y: 8, w: 13, h: 25}
      actors:
        # spawn_point 0 — NORTH staging corridor (y=14..17).
        - {type: 2tnk, owner: agent, position: [4, 14], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 15], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 16], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 17], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 14], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 15], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 16], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 17], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH staging corridor (y=23..26).
        - {type: 2tnk, owner: agent, position: [4, 23], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 24], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 25], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 26], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 23], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 24], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 25], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 26], stance: 1, spawn_point: 1}
        # RIFLE SHIELD — 7× e1 at x=22, y=17..23.
        - {type: e1, owner: enemy, position: [22, 17], stance: 2}
        - {type: e1, owner: enemy, position: [22, 18], stance: 2}
        - {type: e1, owner: enemy, position: [22, 19], stance: 2}
        - {type: e1, owner: enemy, position: [22, 20], stance: 2}
        - {type: e1, owner: enemy, position: [22, 21], stance: 2}
        - {type: e1, owner: enemy, position: [22, 22], stance: 2}
        - {type: e1, owner: enemy, position: [22, 23], stance: 2}
        # ANTI-TANK FRONT RANK — 9× e3 at x=24, y=15..25 (spans the
        # full vertical engagement axis).
        - {type: e3, owner: enemy, position: [24, 15], stance: 2}
        - {type: e3, owner: enemy, position: [24, 17], stance: 2}
        - {type: e3, owner: enemy, position: [24, 18], stance: 2}
        - {type: e3, owner: enemy, position: [24, 19], stance: 2}
        - {type: e3, owner: enemy, position: [24, 20], stance: 2}
        - {type: e3, owner: enemy, position: [24, 21], stance: 2}
        - {type: e3, owner: enemy, position: [24, 22], stance: 2}
        - {type: e3, owner: enemy, position: [24, 23], stance: 2}
        - {type: e3, owner: enemy, position: [24, 25], stance: 2}
        # ANTI-TANK BACK RANK — 4× e3 at x=26.
        - {type: e3, owner: enemy, position: [26, 18], stance: 2}
        - {type: e3, owner: enemy, position: [26, 19], stance: 2}
        - {type: e3, owner: enemy, position: [26, 21], stance: 2}
        - {type: e3, owner: enemy, position: [26, 22], stance: 2}
        - {type: fact, owner: enemy, position: [29, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 5}
        # 2026-05-23 audit (Qwen-9B medium-vs-hard inversion fix):
        # tightened 3 → 6. Hard has 8 tanks (vs medium's 4), so the
        # medium 75%-survival ratio (3 of 4) maps to 6 of 8 on hard.
        # The prior own_units_gte:3 (allowing 5 losses out of 8) was
        # structurally LOOSER than medium's 3 of 4 — escalation
        # non-monotonic on the survival constraint.
        - {own_units_gte: 6}
        - {within_ticks: 3000}
    fail_condition:
      any_of:
        - {after_ticks: 3001}
        - {not: {own_units_gte: 6}}
    max_turns: 51
