# combat-tanya-vs-rush — Tanya commando holds the line vs an e1 rush.
#
# Real-world: hero / commando doctrine — a single high-DPS asset
# kept active is worth a whole squad of soft conscripts, but only if
# it is actively engaging; an idle hero with hold-fire stance loses
# the trade.
#
# Discrimination (the script-policy bar):
#   • stall (only observe): tanya defaults to no-orders; with stance
#     set to 0 (HoldFire) on the actor she never fires back. The rush
#     of 4-6 e1 walks up and shreds her ⇒ own_units_gte:1 fails ⇒ LOSS.
#   • brute attack_move with the WRONG stance (stance:0 hold-fire):
#     the engine respects HoldFire on auto-engage, so tanya still
#     never fires. Hidden defect: the actor was placed stance:0; the
#     policy must explicitly flip stance OR issue attack orders.
#   • intended explicit attack-move (or attack_unit on each e1):
#     tanya's pistol (5x M1Carbine damage, 2x fire rate) kills the
#     e1 rush faster than they can dent her 150k HP. ≥4 kills AND
#     tanya alive → WIN.
#
# Why the spec works (verified against the engine combat sheet
# from `unit_codex` — vendored C# RA YAML):
#   • Tanya is the Allied `E7` actor: HP 10000, weapon Colt45 (10000
#     damage × reload 7 ticks × range 7c0 — one-shots an e1 at point
#     blank, fires faster than e1 reloads).
#   • A scenario `type: tanya` resolves to E7 via the engine alias
#     installed in `gamerules::GameRules::from_ruleset` (so the bench
#     can keep using the canonical name "tanya" without diverging
#     from the C# YAML actor id). Without the alias, "tanya" had no
#     ruleset entry and the engine spawned her weaponless with the
#     fallback "default" 100-dps weapon — the original
#     unsolvable-doctrine root cause.
#   • e1 carries M1Carbine (PRIMARY): 1000 dmg × Versus None:150% =
#     1500 effective per shot × reload 20 ticks = 75 dps per e1. (The
#     C# yaml also lists `Armament@GARRISONED: Vulcan` for use inside
#     APC/pillbox cargo; `from_ruleset` now filters GARRISONED so a
#     non-garrisoned e1 fires its real PRIMARY weapon, NOT the
#     stronger garrison weapon — pinned by
#     `openra-sim/tests/test_tanya_alias.rs`.)
#   • The discrimination is "actively engage with set_stance + attack
#     orders" vs "stall / blind attack-move without stance flip".
#     A stance:0 Tanya never fires even when shot; a brute attack_move
#     east without a stance flip walks into the enemies and stands
#     idle (HoldFire blocks auto-engage). The intended policy issues
#     `set_stance(tanya, 2)` (Defend — auto-fires on the closest in-
#     range enemy without abandoning post to hunt the persistent fact
#     marker) AND explicit `attack_unit(tanya, e1)` per turn so each
#     reload cycle picks a fresh target the moment the previous dies.

meta:
  id: combat-tanya-vs-rush
  title: 'Tanya vs e1 Rush — Hero Engagement'
  capability: action
  real_world_meaning: >
    A single Allied commando (Tanya) holds the centre against a small
    rush of conscript rifle infantry. Tanya is a hero unit: 3x the HP
    of a basic rifleman, fast, and her sidearm out-DPSes a small rifle infantry
    pack. But she spawns on hold-fire stance — a do-nothing policy
    leaves her standing still under fire and she dies. The decision
    is "actively engage the hero asset" vs "observe / stall". The
    intended policy issues attack-move (or flips her stance to defend
    /attack-anything) and wins; stall loses.
  robotics_analogue: >
    Hero / commando doctrine — a single high-DPS asset is force-multiplying only when active. A door-kicker robot held in
    standby while threats approach is wasted. The capability is
    "commit the hero asset to the engagement" — operators who fail
    to commit, lose the asset and the engagement.
  benchmark_anchor:
    - "RA hero unit (Tanya commando)"
    - "RTS micro: engage the hero"
    - "asymmetric high-value asset doctrine"
  author: openra-bench

# Tailored 32×40 arena (cordon 2 ⇒ playable x in [2..29], y in
# [2..37]). The rush engagement happens in a tiny localised area
# (Tanya at (12,20) vs e1 cluster at (16..19, 20)); a 128-cell map
# leaves most of the arena as empty padding. Explicit single mpspawn
# pins coordinates seed-invariantly (Wave-13 mpspawn-rotation footgun).
base_map:
  generator: arena
  name: combat-tanya-vs-rush-arena
  width: 32
  height: 40
  cordon: 2
  spawns: [[4, 20]]
  title: 'Combat Tanya vs Rush Arena 32x40'
starting_cash: 0

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: ''}
  tools: [move_units, attack_unit, attack_move, stop, set_stance]
  planning: true
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 4500}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # One Tanya at (60,20), HoldFire stance (stance:0). Four e1 rush
  # in from the east at (64..67, 20), stance:3 (AttackAnything) so
  # they march toward tanya and open fire on contact. A stall policy
  # never orders her to act; she stands while the four e1s shred her
  # ⇒ own_units_gte:1 fails ⇒ LOSS. The intended policy issues
  # attack_move east (or attack_unit per e1) and tanya kills the
  # rush before she dies.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # A single Allied Tanya commando stands at (60,20) on hold-fire
    # stance. A rush of FOUR Soviet rifle infantry (e1) advances from the
    # east edge of the centre (x=64..67, y=20) on attack-anything stance.
    # Tanya's pistol out-DPSes a small e1 pack at point blank, but she
    # will not fire unless you order her to. Issue attack_move (or
    # attack_unit on each e1) and tanya kills the rush; observe and she
    # dies. Win when ≥4 enemy units are killed AND tanya is still alive,
    # before tick 2700.
    description: >
      Commander, this is a hero engagement. You are given Tanya at
      (12,20) — an elite commando: fast, tough, with a pistol that
      one-shots riflemen. She starts on hold-fire (she will NOT engage
      even if shot at). The enemy rushes from the east on
      attack-anything stance: 4 riflemen in a line at x=16-19, y=20.
      Lift Tanya's hold-fire order and attack the riflemen — at
      point-blank her pistol cuts down all four faster than they can
      dent her 150k HP. Sitting idle lets them surround her and she
      dies. Four kills, Tanya alive, within about 30 turns.
    overrides:
      actors:
        # Tanya — stance:0 HoldFire so a stall policy (or a blind
        # auto-engage) does NOT win for free. The capability is
        # active engagement.
        - {type: tanya, owner: agent, position: [12, 20], stance: 0}
        # Four e1 rushers — stance:3 AttackAnything, so they advance
        # toward tanya and open fire on contact (no need for the
        # enemy to be ordered; they deliver themselves).
        - {type: e1, owner: enemy, position: [16, 20], stance: 3}
        - {type: e1, owner: enemy, position: [17, 20], stance: 3}
        - {type: e1, owner: enemy, position: [18, 20], stance: 3}
        - {type: e1, owner: enemy, position: [19, 20], stance: 3}
        # Far persistent enemy marker — prevents engine auto-done
        # when the rush is wiped so the win/fail evaluator sees the
        # terminal frame (no DRAW collapse).
        - {type: fact, owner: enemy, position: [28, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 4}
        - {own_units_gte: 1}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {own_units_gte: 1}}
    max_turns: 30

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 axis: bigger rush (6 e1 total), but split into TWO WAVES via
  # scheduled_events so Tanya's hero engagement is a real DPS test:
  # she clears wave A (3 e1), recovers a few ticks while wave B walks
  # in from off-map, then clears wave B (3 more e1). A stall policy
  # lets wave A overwhelm her at the start; a brute-but-late commit
  # bleeds too much HP on wave A and dies to wave B; the intended
  # policy stance-flips + attacks each e1 at point-blank, finishing
  # each in one Colt45 shot (10000 dmg ≥ e1 HP 5000).
  #
  # Why two waves (not 6 stacked): 6 e1 firing M1Carbine (1500 eff
  # dmg per shot, reload 20) at Tanya HP 10000 dump ~9000 dmg in the
  # ENGAGE tick before she can return fire — she'd be 1-shot. A wave
  # of 3 deals ~4500 dmg in the same window, leaving ~5500 HP for
  # her to clear them and prep for wave B.
  medium:
    description: >
      Commander, this is a hero engagement against a denser rush. You
      are given Tanya at (12,20) — an elite commando: fast, tough,
      with a pistol that one-shots riflemen. She starts on hold-fire
      (she will NOT engage even if shot at). The enemy rushes from
      the east in two waves on attack-anything stance: wave A of 3
      riflemen at (16, 19-21) NOW, and a SECOND wave of 3 more
      riflemen appears at (20, 19-21) about 4 turns in. Lift Tanya's
      hold-fire order and attack each rifleman at point-blank — her
      Colt45 one-shots them. Sitting idle lets wave A gang up on her.
      Six kills, Tanya alive, within about 30 turns.
    overrides:
      actors:
        - {type: tanya, owner: agent, position: [12, 20], stance: 0}
        # Wave A — three e1 in a single rank at x=16, y=19..21 (the
        # initial engagement). Single rank (not 2×3 block) keeps
        # simultaneous DPS on Tanya at ~4500 dmg/shot-cycle, leaving
        # her ~5500 HP to clear them with Colt45.
        - {type: e1, owner: enemy, position: [16, 19], stance: 3}
        - {type: e1, owner: enemy, position: [16, 20], stance: 3}
        - {type: e1, owner: enemy, position: [16, 21], stance: 3}
        - {type: fact, owner: enemy, position: [28, 20]}
      # Wave B — 3 more e1 inject mid-episode (after ~3.3 turns ≈ 300
      # ticks) so Tanya has time to clear wave A first. They spawn
      # close to the original cluster zone (x=20) and walk in.
      scheduled_events:
        - tick: 300
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [20, 19], stance: 3}
            - {type: e1, owner: enemy, position: [20, 20], stance: 3}
            - {type: e1, owner: enemy, position: [20, 21], stance: 3}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {own_units_gte: 1}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {own_units_gte: 1}}
    max_turns: 30

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 axis: the rush approaches from ONE of TWO seed-driven corridors
  # (NORTH y=16..17 OR SOUTH y=23..24) so Tanya cannot pre-aim — the
  # policy has to read the spawn direction at runtime and commit. Same
  # hero-engagement bar; the spawn-axis variation is anti-memorisation.
  #
  # 6 e1 split into TWO WAVES per corridor (3 + 3 via scheduled_events
  # at tick 300, mirroring medium's wave structure). A single 6-e1
  # cluster all in M1Carbine range deals ~9000 dmg to Tanya before she
  # can return fire — un-survivable. Two waves of 3 deal ~4500 dmg
  # per wave with a recovery window in between.
  hard:
    description: >
      Commander, this is a hero engagement with seed-varied rush
      direction. You are given Tanya at (12,20) — an elite commando:
      fast, tough, with a pistol that one-shots riflemen. She starts
      on hold-fire (she will NOT engage even if shot at). The enemy
      rushes from one of two corridors depending on seed: 3 riflemen
      attack from either the NORTH band (y=16-17) OR the SOUTH band
      (y=23-24), all at x=16. A SECOND wave of 3 more riflemen
      reinforces along the same axis a few turns later. Read the
      rush direction, lift Tanya's hold-fire order, and attack the
      riflemen at point-blank. Sitting idle lets them gang up on her.
      Six kills, Tanya alive, within about 30 turns.
    overrides:
      actors:
        - {type: tanya, owner: agent, position: [12, 20], stance: 0}
        # spawn_point 0 — NORTH corridor, 6 e1 deep column (x=16..21,
        # y=17). Column not block: only the closest 2-3 e1 are in
        # M1Carbine range (5 cells) at the start; the others walk in
        # one at a time, giving Tanya time to clear them serially.
        # x=16: dist=4 (in range), x=17: dist=5 (in range), x=18: 6
        # (out of range until walk-in), …, x=21: 9 (out of range).
        - {type: e1, owner: enemy, position: [16, 17], stance: 3, spawn_point: 0}
        - {type: e1, owner: enemy, position: [17, 17], stance: 3, spawn_point: 0}
        - {type: e1, owner: enemy, position: [18, 17], stance: 3, spawn_point: 0}
        - {type: e1, owner: enemy, position: [19, 17], stance: 3, spawn_point: 0}
        - {type: e1, owner: enemy, position: [20, 17], stance: 3, spawn_point: 0}
        - {type: e1, owner: enemy, position: [21, 17], stance: 3, spawn_point: 0}
        # spawn_point 1 — SOUTH corridor, 6 e1 deep column (x=16..21,
        # y=23). Symmetric to NORTH.
        - {type: e1, owner: enemy, position: [16, 23], stance: 3, spawn_point: 1}
        - {type: e1, owner: enemy, position: [17, 23], stance: 3, spawn_point: 1}
        - {type: e1, owner: enemy, position: [18, 23], stance: 3, spawn_point: 1}
        - {type: e1, owner: enemy, position: [19, 23], stance: 3, spawn_point: 1}
        - {type: e1, owner: enemy, position: [20, 23], stance: 3, spawn_point: 1}
        - {type: e1, owner: enemy, position: [21, 23], stance: 3, spawn_point: 1}
        # Per the enemy-side spawn_point rule (CLAUDE.md): persistent
        # enemy markers must be duplicated across every enemy spawn
        # group so they place every seed.
        - {type: fact, owner: enemy, position: [28, 20], spawn_point: 0}
        - {type: fact, owner: enemy, position: [28, 20], spawn_point: 1}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {own_units_gte: 1}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {own_units_gte: 1}}
    max_turns: 30
