levels:
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Two-Body Coordination — you command TWO squads that start on
    # OPPOSITE edges of the map. There are TWO enemy bases: one on the
    # WEST (near 24,20), one on the EAST (near 78,20), each with a
    # construction yard (fact) and refinery (proc). You must raze
    # fact+proc at BOTH bases. The map's center is a lethal turret wall: a
    # squad cannot cross it to reach the far base, so a single squad or a
    # do-one-then-the-other plan cannot finish in time. Drive BOTH squads
    # forward at once — left squad onto the west base, right squad onto
    # the east base — simultaneously.
    description: >
      You command TWO squads starting on opposite edges. TWO enemy bases —
      one in the WEST near (24,20), one in the EAST near (78,20) — each
      with a yard and refinery; you must raze construction yard+ore refinery at BOTH. The map's
      centre is a lethal turret wall, so a single squad can't reach the
      far base in time. Drive both squads forward simultaneously, within
      about 95 turns.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - enemy_key_buildings_destroyed_in_region:
          {x: 24, y: 21, radius: 9, types: [fact, proc]}
      - enemy_key_buildings_destroyed_in_region:
          {x: 78, y: 21, radius: 9, types: [fact, proc]}
      - within_ticks: 8500
    fail_condition:
      any_of:
      - not: {within_ticks: 8500}
      - not: {own_units_gte: 1}
    max_turns: 100
  medium:
    description: >
      Same two-body objective — construction yard+ore refinery razed at BOTH the WEST (24,20)
      and EAST (78,20) bases — with the lethal centre and tighter clock.
      Commit both squads at once and accept no more than ten losses total.
      Within about 72 turns.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - enemy_key_buildings_destroyed_in_region:
          {x: 24, y: 21, radius: 9, types: [fact, proc]}
      - enemy_key_buildings_destroyed_in_region:
          {x: 78, y: 21, radius: 9, types: [fact, proc]}
      - within_ticks: 6500
      - units_lost_lte: 10
    fail_condition:
      any_of:
      - not: {within_ticks: 6500}
      - not: {units_lost_lte: 10}
      - not: {own_units_gte: 1}
    max_turns: 90
  hard:
    description: >
      Both bases razed (construction yard+ore refinery each), tight clock, strict attrition:
      both squads must strike their own base in parallel and clean.
      Any serialized or single-squad attempt blows the clock or the
      attrition cap.
    win_condition:
      all_of:
      - enemy_key_buildings_destroyed: {types: [fact, proc]}
      - enemy_key_buildings_destroyed_in_region:
          {x: 24, y: 21, radius: 9, types: [fact, proc]}
      - enemy_key_buildings_destroyed_in_region:
          {x: 78, y: 21, radius: 9, types: [fact, proc]}
      - within_ticks: 5000
      - units_lost_lte: 6
    fail_condition:
      any_of:
      - not: {within_ticks: 5000}
      - not: {units_lost_lte: 6}
      - not: {own_units_gte: 1}
    max_turns: 80
