meta:
  id: strategy-twobody
  title: 'Two-Pronged Attack — Two Squads, Two Bases, One Clock'
  capability: action
  real_world_meaning: 'Two separated squads must be driven simultaneously, each
    razing one of two far-apart enemy bases under a single shared deadline.
    A lethal defended center makes any one-group or do-this-then-that plan
    impossible: only true parallel control of both squads at once wins.'
  robotics_analogue: 'Concurrent multi-robot task dispatch: two independent
    teams must each clear their own objective in parallel — serializing one
    team behind the other blows the global time budget.'
  benchmark_anchor:
    - "robotics multi-agent coordination"
    - "SC2 unit micro"
    - "concurrent multi-robot task dispatch"
  author: ported-from-training
base_map: singles-twobody
