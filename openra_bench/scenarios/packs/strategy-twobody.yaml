  title: 'Two-Pronged Attack — Coordinate Two Squads to Destroy the Enemy Economy'
  capability: action
  real_world_meaning: 'Two separated squads must be driven in parallel and converged
    through a weak gap to reach the objective: simultaneous multi-group control, not
    serial play.'
  robotics_analogue: 'Coordinated multi-robot rendezvous: independently steer two
    teams to a common staging point.'
  author: ported-from-training
