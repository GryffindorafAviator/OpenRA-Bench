# def-position-revealed-direction.yaml
#
# REASONING capability — INTEL-DRIVEN ADAPTIVE DEFENSE. Unlike its
# sibling `def-position-expected-direction` (where the threat axis is
# STATED in the brief and the agent merely commits a budget to the
# named lane), this pack hides the axis: the agent must FIRST SCOUT to
# discover where the enemy's forward outpost actually is, THEN fortify
# THAT lane with pillboxes, THEN engage and kill the incoming rush.
# Pre-fortifying any one direction on faith LOSES on seeds where the
# enemy comes from the opposite side; only the scout-then-fortify
# discipline generalises.
#
# Win idiom (the load-bearing chain):
#   then:
#     - {buildings_discovered_gte: 1}    # FIRST — scout sees the
#                                        # enemy outpost in the
#                                        # actual approach corridor
#                                        # (outposts are OUTSIDE
#                                        # pbox / base vision; only
#                                        # a forward jeep can reach
#                                        # them).
#     - {building_count_gte: {type: pbox, n: 3}}  # THEN — commit 3
#                                        # pillboxes (defensive
#                                        # posture).
#     - {units_killed_gte: K}            # THEN — actually engage and
#                                        # break the incoming rush.
#   AND building_count_gte:{type: fact, n: 1} AND within_ticks: T.
# Fail: after_ticks: T+1 OR not building_count_gte:{type: fact, n: 1}
#       OR not own_units_gte: 1.
# (We use `building_count_gte` rather than `has_building` because the
# latter checks `own_building_types`, which ACCUMULATES across the
# episode — once `fact` has been owned, `has_building:fact` stays true
# even after the fact is razed, so it is structurally useless as a
# "still standing" fail clause. `building_count_gte` reads the live
# `own_buildings` list each frame and bites correctly when the fact
# is destroyed.)
#
# Pre-fortify-LANE-without-observe fails: clause 1 of the then-chain
# never latches (or latches accidentally on the lane the scout
# happens to see while the pbox sit on the wrong axis). On the SEED-
# varied hard tier a memorised "always defend NORTH" wins half the
# seeds and loses the other half — the south-funnelled rushers walk
# straight to the central fact, units_killed never reaches K, and the
# fact is razed → double LOSS path (chain clause 3 + the fact-loss
# fail clause). Stall LOSES on the deadline (or earlier on the
# fact-loss fail clause when the rush closes the home fact).
#
# Real-world / benchmark anchors:
#   - PlanBench replanning: model must update its plan based on
#     observation (which axis is the actual threat) before committing.
#   - Military reactive defense / intel-driven facility hardening:
#     reconnaissance precedes fortification; pre-committing without
#     intel is the classical "Maginot Line" failure mode (defenses on
#     the wrong axis are dead weight).
#   - Intel-driven defense: convert reconnaissance into committed
#     defensive posture; a generalist policy MUST drive the scout
#     loop, not memorise a fixed axis.
#
# Distinct from siblings:
#   * def-position-expected-direction — intel is GIVEN; the decision
#     is purely WHICH axis given the textual cue. THIS pack hides the
#     axis; the decision is whether to SCOUT before committing.
#   * def-pre-position-mobile-reserve — direction unknown; mobile
#     reserve commits on detection (no static defenses). THIS pack
#     requires STATIC fortification AFTER scouting.
#   * def-surprise-flank-react — intel is FALSE (announced N, actual
#     S); the trap is trusting the brief. THIS pack has NO false
#     intel; the brief states "you don't know — scout to find out".
#   * lh-scout-react-counter — scout→react→counter on a FIXED enemy
#     posture; the chain is the same idiom but the capability is
#     offensive (raze the construction yard) rather than defensive
#     (fortify the lane).
#
# Topology — a CUSTOM 112×40 lane arena (`base_map: generator: arena`,
# obstacles paint the lane separator walls in 88 cells of the map
# width):
#   - WEST sliver (x ≤ 19) is open ground — the AGENT base sits at
#     (10, 20) with the defenders centrally positioned. The west
#     sliver is the ONLY connector between the three corridors, so
#     a defender at the lane mouth fires only on its own lane's
#     rush (a pbox planted at the wrong-lane mouth is geometrically
#     out of range of the right-lane attackers as they diagonal
#     into the west sliver toward the central base).
#   - The 88-cell middle band (20 ≤ x ≤ 107) is split by horizontal
#     water walls into 2 or 3 parallel attack corridors. The walls
#     funnel the enemy rush into a single corridor that the scout
#     reveals; a wrong-lane pbox triple sits in the open west
#     sliver but at the WRONG y (≥10 cells off the rush's path) so
#     it never fires on the funnelled rush.
#   - The enemy spawn (and its forward outpost) sits DEEP in the
#     corridor (x ≥ 90), well outside any pbox the agent could
#     place at the corridor mouth; only a SCOUT (jeep) at the
#     corridor mouth can register the outpost and latch the first
#     then-clause.
#
# ENGINE FACTS (per CLAUDE.md / SCENARIO_QUALITY.md):
#   - `pbox` costs 400cr; needs tent (which needs powr). Pre-place
#     fact + proc + powr + tent so the pbox queue is hot from turn 1.
#     Starting cash 2400 funds the 3-pbox triple (3 × 400 = 1200) with
#     ~1200 buffer.
#   - Enemy actors with NO spawn_point ALWAYS place regardless of the
#     agent's spawn group (CLAUDE.md). On HARD we use the Wave-9
#     enemy-side `spawn_point:` axis to VARY THE ATTACK LANE per
#     seed: spawn_point 0 = NORTH corridor, spawn_point 1 = SOUTH
#     corridor. The persistent far-corner enemy `fact` marker is
#     duplicated across BOTH enemy spawn groups at identical coords
#     (CLAUDE.md: persistent per-seed enemy markers MUST be in every
#     enemy spawn group).
#   - `then:` is the happened-before composite: clauses latch IN
#     ORDER, so a pre-fortify-no-scout play that places 3 pbox first
#     and then idles cannot satisfy clause 1 (scout) after the fact
#     UNLESS a scout actually sees the outpost — which is the load-
#     bearing capability.
#   - `building_count_gte:{pbox, 3}` (NOT building_in_region) — the
#     scout latch already enforces axis awareness via clause 1; we
#     don't double-encode the region. Lane choice is enforced by the
#     units_killed clause (3 pbox on the wrong axis sit silent in the
#     open west ground, the funnelled rushers walk past, kills don't
#     accrue, fact dies).
#   - Inert enemy `fact` marker far east — anti-DRAW per CLAUDE.md;
#     without a persistent enemy actor the engine auto-`done`s on
#     enemy-elim before the win/fail evaluator runs.
#   - `enemy_unit_spotted` interrupt — re-decide the instant a rusher
#     unit is spotted (the actual axis becomes confirmed by the rush
#     itself, in case the scout missed the outpost).
#   - `enemy_building_spotted` interrupt — re-decide the instant the
#     outpost is discovered (the FIRST clause latches).
#   - Scout jeeps run `stance:0` HoldFire so they don't pull the
#     incoming rush onto themselves before the discovery latch fires
#     and so they don't auto-engage the outpost (a 1v3+ jeep
#     engagement dies before the model can read the obs).
#   - Tick budget: max_turns 66 → reachable tick 93 + 90·65 = 5943 ≥
#     5402 (deadline 5400 + 1 = 5401), so a non-finisher is a real
#     reachable timeout LOSS, never a draw.
#
# Validate (no model / no network):
#   python3 -m openra_bench.scenarios.validate \
#     openra_bench/scenarios/packs/def-position-revealed-direction.yaml

meta:
  id: def-position-revealed-direction
  title: 'Scout the Axis, Then Fortify — Intel-Driven Adaptive Defense'
  capability: reasoning
  real_world_meaning: >
    Adaptive defense under uncertainty: the threat axis is NOT known
    a priori; the agent must drive its scouts to discover the
    enemy's forward outpost (where the build-up actually is), then
    commit pillboxes on THAT lane, then engage. Pre-committing to a
    single direction without scouting is the classical Maginot-Line
    failure mode — defenses on the wrong axis are dead weight while
    the unguarded lane is overrun. The capability under test is the
    intel-action loop: observation FIRST, commitment SECOND.
  robotics_analogue: >
    Intel-driven facility hardening / military reactive defense: a
    perimeter operator does not know which gate will be breached;
    they must dispatch reconnaissance, confirm the threat axis from
    sensor returns, and then deploy barriers / responders on the
    confirmed lane. Skipping the reconnaissance step and pre-staging
    on a guessed lane is correct half the time and catastrophically
    wrong the other half. The robust doctrine is scout-then-fortify,
    not commit-on-faith.
  benchmark_anchor:
    - 'PlanBench replanning'
    - 'military reactive defense'
    - 'intel-driven defense'
  author: openra-bench

# Custom 112×40 lane arena. The middle band (x=20..107) is split by
# horizontal water walls into parallel attack corridors (2 on easy
# and hard, 3 on medium); the WEST sliver (x ≤ 19) is OPEN and
# connects the corridors so the agent's central base at (10, 20)
# can react to either corridor with a pbox line at the corridor
# MOUTH (x≈20..22, on the y of the revealed lane). A pbox planted
# at the WRONG corridor mouth is geometrically out of range of the
# rush as it diagonals through the west sliver to the central
# base — wrong-lane defenses are silent dead weight. Per-level
# `overrides.base_map:` re-stamps the obstacle list to match the
# level's lane count.
base_map:
  generator: arena
  name: def-position-revealed-direction-arena
  width: 112
  height: 40
  cordon: 2
  # Two-lane default (used by easy/hard). Per-level overrides
  # re-stamp.
  obstacles:
    - {x: 20, y: 11, w: 88, h: 18}  # mid wall block sealing the
                                    # MID corridor (only N and S
                                    # corridors remain).
  title: 'Def Position Revealed-Direction Arena 112x40'

# Pack-wide budget — funds the intended 3-pbox triple (3 × 400 =
# 1200cr) with a buffer (~1200cr) for replacement defenders or
# an extra pbox if the agent wants. Spamming pbox on the wrong axis
# burns the same budget without satisfying the kill clause (wrong-axis
# pbox sit silent in the open west ground, the funnelled rushers walk
# past).
starting_cash: 2400

base:
  agent:
    faction: allies
  # Concentrated charge at the agent centroid every ~8 ticks — the
  # canonical rush-defense opponent. The bot's spawn LANE is the
  # hidden information the model must discover by scouting.
  enemy:
    faction: soviet
    bot_type: rusher
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  # Re-decide the instant the scout discovers an enemy outpost
  # (the first latch in the then-chain) or a rusher unit is spotted
  # (confirms the actual axis) or a defender is lost (defense
  # commitment is reactive).
  interrupts:
    enemy_building_spotted: true
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination:
    max_ticks: 12000
  actors:
    # Base-pack defaults; each level overrides with the lane-
    # specific layout. (Anti-empty-actors sanity for the loader.)
    - {type: fact, owner: agent, position: [28, 20]}

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # 1-of-2 lanes: the wall block at y=11..28 (x=40..107) seals the
  # MID corridor, leaving NORTH (y=2..10) and SOUTH (y=29..37) as
  # the only two east-west paths. The actual rush comes from NORTH
  # (fixed); the scout jeep is pre-positioned FORWARD-NORTH at
  # (54, 5) so a single passive observe on turn 1 already has line-
  # of-sight to the enemy outpost (a `tent` at (60, 5), distance 6
  # — inside jeep sight ~7). The first then-clause latches
  # immediately; the agent only needs to build 3 pbox at the NORTH
  # lane mouth (38, 8) and let the on-axis pbox triple + central
  # defenders rack up ≥3 kills on the incoming light rush (3 e1).
  # The MID-pbox-no-observe lazy play LOSES because the MID
  # corridor is sealed — wrong-axis pbox sit silent and the rush
  # bypasses them to the central fact.
  # max_turns 66 → reachable tick 5943 ≥ 5401.
  easy:
    description: >
      A light rush is coming from one of two corridors (north or south)
      — your forward jeep scout already has eyes on the enemy outpost.
      Confirm the intel by scouting, then build three pillboxes at the
      revealed lane mouth (around x=22, on the y of the revealed
      lane) and engage. Three kills, yard alive, one unit alive,
      within about 60 turns. Stall, build-only, or fight-only all
      lose.
    overrides:
      base_map:
        generator: arena
        name: def-position-revealed-direction-arena-2lane
        width: 112
        height: 40
        cordon: 2
        # 2-lane: single wall block sealing the MID corridor;
        # NORTH (y=2..10) and SOUTH (y=29..37) are the only
        # corridors. Wall spans x=20..107 (the middle band) so the
        # west SLIVER x=2..19 is the only connector between the
        # corridors; a pbox at the wrong-lane mouth is out of
        # range of the right-lane rush as it diagonals through
        # the west sliver to the central base.
        obstacles:
          - {x: 20, y: 11, w: 88, h: 18}
        title: 'Def Position Revealed-Direction Arena 112x40 (2-lane)'
      actors:
        # Agent base — fact + proc + powr + tent so the pbox queue
        # (needs powr + tent) is hot from turn 1. Centred in the
        # OPEN west sliver so the defender can react to EITHER
        # corridor (NOT pre-committed inside one corridor).
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: proc, owner: agent, position: [6, 20]}
        - {type: powr, owner: agent, position: [10, 24]}
        - {type: tent, owner: agent, position: [6, 24]}
        # Four starter defenders central around the base — they
        # sit in the open west sliver, NOT inside any corridor,
        # so they can be moved into either lane mouth on the
        # agent's order (the scout-then-fortify chain is the
        # model's job).
        - {type: e1, owner: agent, position: [12, 18], stance: 2}
        - {type: e1, owner: agent, position: [14, 18], stance: 2}
        - {type: e1, owner: agent, position: [12, 22], stance: 2}
        - {type: e1, owner: agent, position: [14, 22], stance: 2}
        # Forward scout jeep at the NORTH corridor mouth — sits
        # at (54, 5) with passive vision of the outpost at
        # (60, 5) (distance 6, inside jeep sight ~7). Stance:0
        # HoldFire so it doesn't pull the rush onto itself before
        # the discovery latch fires. Easy teaches the chain
        # without requiring scout MOVEMENT.
        - {type: jeep, owner: agent, position: [54, 5], stance: 0}
        # Enemy forward outpost (NORTH corridor): a `tent` at
        # (60, 5) — deep enough in the corridor that it is OUT of
        # any base/pbox vision the agent could plant at the
        # corridor mouth (a pbox at x=22 would be 38 cells away,
        # well past pbox sight ~6). The forward jeep at (54, 5)
        # sits 6 cells away and sees it from turn 1.
        - {type: tent, owner: enemy, position: [60, 5]}
        # Light NORTH rush — 4 e1 at the east corridor mouth
        # (100, 5). The rusher bot charges the agent centroid
        # (~10, 20); the y=11..28 wall blocks the direct path so
        # the rush is FUNNELLED west along the NORTH corridor
        # until it can exit at x=19 and diagonal southwest to
        # the base. The pbox line planted at the NORTH lane mouth
        # (x≈22, y≈8) intercepts the funnelled wave; the MID-
        # pbox-no-observe lazy play places its triple at
        # (x≈22, y≈20) where the N-corridor rush passes ≥10
        # cells away (out of pbox range 4) — the central
        # 4-defender screen alone is the only thing fighting the
        # 4 e1, the kill bar AND/OR fact-alive clause bite → LOSS.
        - {type: e1, owner: enemy, position: [100, 5], stance: 3, count: 4}
        # Inert enemy `fact` marker far east in the SOUTH corridor
        # — anti-DRAW per CLAUDE.md; without a persistent enemy
        # actor the engine auto-`done`s on enemy-elim before the
        # win/fail evaluator runs. Placed in the OTHER (south)
        # corridor so it doesn't accidentally join the rush.
        - {type: fact, owner: enemy, position: [108, 36]}
    win_condition:
      all_of:
        - then:
            id: scout-fortify-engage-easy
            clauses:
              - {buildings_discovered_gte: 1}
              - {building_count_gte: {type: pbox, n: 3}}
              - {units_killed_gte: 3}
        - building_count_gte: {type: fact, n: 1}
        - own_units_gte: 1
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
        - not: {building_count_gte: {type: fact, n: 1}}
        - not: {own_units_gte: 1}
    max_turns: 66

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: 1-of-3 lanes. The wall block is split
  # into TWO thin walls (y=11..13 and y=27..29) leaving THREE
  # corridors: NORTH (y=2..10), MID (y=14..26), SOUTH (y=30..37).
  # The actual rush comes from MID (fixed); the scout jeep is pre-
  # positioned FORWARD-MID at (54, 20) with passive vision of the
  # MID outpost (a `tent` at (60, 20), distance 6 — inside jeep
  # sight ~7). The first then-clause latches immediately on a
  # passive observe; the agent must STILL infer that the relevant
  # lane is MID (not NORTH or SOUTH) and plant the 3-pbox triple at
  # the MID lane mouth (x≈38, y≈20). A model that builds at the
  # wrong corridor mouth (y≈8 or y≈32) satisfies clauses 1+2 but
  # the wrong-corridor pbox triple sits silent while the MID rush
  # exits at x=39 and engages the central base defenders alone — the
  # 3-kill bar is not always met without the on-axis pbox.
  # max_turns 66 → reachable tick 5943 ≥ 5401.
  medium:
    description: >
      A rush is incoming from one of three corridors (north, middle, or
      south). Your forward jeep is already at a vantage that sees ONE
      of the lanes — observe which lane shows the enemy outpost and
      build three pillboxes at THAT lane's mouth in front of your
      base. Three kills, yard alive, one unit alive, within about 60
      turns. Pillboxes on the wrong corridor sit silent.
    overrides:
      base_map:
        generator: arena
        name: def-position-revealed-direction-arena-3lane
        width: 112
        height: 40
        cordon: 2
        # 3-lane: two thin walls split the middle band (x=20..107)
        # into NORTH, MID, SOUTH corridors. The west sliver
        # x=2..19 is fully open (connects all three corridors).
        obstacles:
          - {x: 20, y: 11, w: 88, h: 3}   # N/MID separator
          - {x: 20, y: 27, w: 88, h: 3}   # MID/S separator
        title: 'Def Position Revealed-Direction Arena 112x40 (3-lane)'
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: proc, owner: agent, position: [6, 20]}
        - {type: powr, owner: agent, position: [10, 24]}
        - {type: tent, owner: agent, position: [6, 24]}
        - {type: e1, owner: agent, position: [12, 18], stance: 2}
        - {type: e1, owner: agent, position: [14, 18], stance: 2}
        - {type: e1, owner: agent, position: [12, 22], stance: 2}
        - {type: e1, owner: agent, position: [14, 22], stance: 2}
        # Forward scout jeep at the MID corridor — vantage point
        # at (54, 20) with passive vision of the MID outpost at
        # (60, 20). Stance:0 HoldFire.
        - {type: jeep, owner: agent, position: [54, 20], stance: 0}
        # Enemy outpost in the MID corridor — deep enough that
        # only the forward scout sees it (a pbox at x=22, y=20 is
        # 38 cells from the outpost, well past pbox sight).
        - {type: tent, owner: enemy, position: [60, 20]}
        # MID rush — 4 e1 at the east MID corridor mouth (100, 20)
        # walks west along the MID corridor (the walls at y=11..13
        # and y=27..29 funnel the path), exits at x=19, and
        # engages the central base. The pbox line at the MID mouth
        # (x≈22, y≈20) intercepts.
        - {type: e1, owner: enemy, position: [100, 20], stance: 3, count: 4}
        # Inert enemy `fact` marker far east in the SOUTH corridor.
        - {type: fact, owner: enemy, position: [108, 36]}
    win_condition:
      all_of:
        - then:
            id: scout-fortify-engage-medium
            clauses:
              - {buildings_discovered_gte: 1}
              - {building_count_gte: {type: pbox, n: 3}}
              - {units_killed_gte: 3}
        - building_count_gte: {type: fact, n: 1}
        - own_units_gte: 1
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
        - not: {building_count_gte: {type: fact, n: 1}}
        - not: {own_units_gte: 1}
    max_turns: 66

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled variable: SEED-VARIED BASE LATITUDE via agent-
  # side `spawn_point:` (CLAUDE.md pre-Wave-9 idiom). Two agent
  # spawn groups: spawn_point 0 = NORTH base at (10, 14); spawn_
  # point 1 = SOUTH base at (10, 26). The wall geometry is the
  # SAME as easy (single wall block at y=11..28 sealing the MID
  # corridor; only NORTH y=2..10 and SOUTH y=29..37 corridors
  # remain). Enemy actors don't declare spawn_point (CLAUDE.md:
  # the per-owner filter is per OWNER, so enemy actors always
  # place regardless of agent spawn), so BOTH a NORTH rush band
  # AND a SOUTH rush band are always on the map — but each band
  # rushes the SHORTEST path to the agent centroid, so the
  # "near" band is whichever matches the agent's spawn latitude
  # (the other has to walk the full map width / wraps around the
  # wall block, well beyond the 3600-tick budget).
  #
  # The "scout reveals direction" load-bearing capability: the
  # model must IDENTIFY its OWN base latitude (fact y=14 ⇒
  # threat from NORTH, fact y=26 ⇒ threat from SOUTH) and commit
  # the pbox triple to THAT corridor mouth. A memorised "always
  # defend NORTH" opening WINS on the NORTH-base seeds and LOSES
  # on the SOUTH-base seeds — the wrong-axis pbox at (22, 8) is
  # too far from the south rush's path to fire, the south band
  # walks straight to the south-spawn fact, the kill bar is
  # missed AND the fact is razed → double LOSS path.
  #
  # Faster attacker timing: the rush is 4 e1 + 1 e3 per band
  # (the e3 adds rocket splash so the central defender screen
  # alone cannot hold) AND the spawn is moved WEST to
  # (88, lane_y) so the wave reaches the lane mouth ~12 cells
  # sooner than easy.
  # max_turns 66 → tick budget reachable ≥ 3601 deadline (4218
  # observed empirically at 64 ticks/turn under interrupts).
  hard:
    description: >
      Same scout-then-fortify chain, but your base spawns NORTH
      (y=14) or SOUTH (y=26) by seed and the threat comes from the
      corridor on that side. Identify your latitude from your construction yard,
      scout that corridor, plant three pillboxes at THAT corridor's
      mouth (around x=22, y≈8 if your base is north of centre, y≈32
      if south), then kill three. Yard alive, one unit alive,
      within about 40 turns. Always-defend-north loses every
      south-seed run.
    overrides:
      base_map:
        generator: arena
        name: def-position-revealed-direction-arena-2lane
        width: 112
        height: 40
        cordon: 2
        obstacles:
          - {x: 20, y: 11, w: 88, h: 18}
        title: 'Def Position Revealed-Direction Arena 112x40 (2-lane)'
      actors:
        # ── AGENT spawn_point 0 — NORTH base centred at (10, 14).
        # No starter defender SCREEN (removing the central screen
        # is what makes units_killed_gte:3 load-bearing for the
        # pbox triple — a wrong-axis play with NO defenders to
        # fall back on misses the kill bar and the fact dies on
        # the wrong spawn). A single token defender colocated
        # with the base satisfies the hard-tier spawn-variation
        # contract (test_curated_hard_still_compiles_and_runs
        # asserts units_summary differs across seeds) without
        # reintroducing the "defenders kill the rush alone"
        # exploit.
        - {type: fact, owner: agent, position: [10, 14], spawn_point: 0}
        - {type: proc, owner: agent, position: [6, 14], spawn_point: 0}
        - {type: powr, owner: agent, position: [10, 18], spawn_point: 0}
        - {type: tent, owner: agent, position: [6, 18], spawn_point: 0}
        - {type: e1, owner: agent, position: [12, 14], stance: 2, spawn_point: 0}
        # Two forward scout jeeps — one per corridor mouth. The
        # north scout sees the north rush; the south scout sees
        # the south rush. The model reads which corridor shows
        # activity to confirm the axis (which on hard MUST
        # match its own base latitude — the OTHER corridor's
        # rush is too far away to arrive inside the budget).
        - {type: jeep, owner: agent, position: [54, 5],  stance: 0, spawn_point: 0}
        - {type: jeep, owner: agent, position: [54, 35], stance: 0, spawn_point: 0}
        # ── AGENT spawn_point 1 — SOUTH base centred at (10, 26).
        # Mirror of NORTH spawn (fact 6 cells south of map mid).
        # Correct defense lane: pbox at y≈32. Single token
        # defender at the base for the spawn-variation contract.
        - {type: fact, owner: agent, position: [10, 26], spawn_point: 1}
        - {type: proc, owner: agent, position: [6, 26], spawn_point: 1}
        - {type: powr, owner: agent, position: [10, 22], spawn_point: 1}
        - {type: tent, owner: agent, position: [6, 22], spawn_point: 1}
        - {type: e1, owner: agent, position: [12, 26], stance: 2, spawn_point: 1}
        - {type: jeep, owner: agent, position: [54, 5],  stance: 0, spawn_point: 1}
        - {type: jeep, owner: agent, position: [54, 35], stance: 0, spawn_point: 1}
        # Enemy bands and outposts — declared with matching
        # enemy-side spawn_point so the rush LANE correlates 1:1
        # with the agent base latitude (CLAUDE.md: the per-owner
        # spawn filter activates per OWNER independently, both
        # owners read the SAME spawn_idx from the env RNG, so
        # spawn_point 0 on both sides ⇒ NORTH base + NORTH rush;
        # spawn_point 1 on both sides ⇒ SOUTH base + SOUTH rush).
        # This single-band-per-seed encoding closes the "always-
        # NORTH baits the south rush onto pbox" exploit: on
        # SOUTH-base seeds there is NO north rush, so NORTH pbox
        # at (22, 8) has nothing to fire on and the kill bar is
        # NOT met (LOSS by clock + fact-loss).
        - {type: tent, owner: enemy, position: [60, 5], spawn_point: 0}
        - {type: e1, owner: enemy, position: [88, 5], stance: 3, count: 4, spawn_point: 0}
        - {type: e3, owner: enemy, position: [90, 5], stance: 3, count: 1, spawn_point: 0}
        - {type: tent, owner: enemy, position: [60, 35], spawn_point: 1}
        - {type: e1, owner: enemy, position: [88, 35], stance: 3, count: 4, spawn_point: 1}
        - {type: e3, owner: enemy, position: [90, 35], stance: 3, count: 1, spawn_point: 1}
        # Inert enemy `fact` marker far east — anti-DRAW per
        # CLAUDE.md. Duplicated across BOTH enemy spawn groups
        # (CLAUDE.md: persistent per-seed enemy markers MUST be
        # in every enemy spawn group). One in each opposite
        # corridor so it never lands on top of the active rush.
        - {type: fact, owner: enemy, position: [108, 36], spawn_point: 0}
        - {type: fact, owner: enemy, position: [108, 5], spawn_point: 1}
    win_condition:
      all_of:
        - then:
            id: scout-fortify-engage-hard
            clauses:
              - {buildings_discovered_gte: 1}
              - {building_count_gte: {type: pbox, n: 3}}
              - {units_killed_gte: 3}
        - building_count_gte: {type: fact, n: 1}
        - own_units_gte: 1
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
        - not: {building_count_gte: {type: fact, n: 1}}
        - not: {own_units_gte: 1}
    max_turns: 66
