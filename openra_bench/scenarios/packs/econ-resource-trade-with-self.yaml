# Validate: python -m openra_bench.scenarios.validate packs/econ-resource-trade-with-self.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# ECON-RESOURCE-TRADE-WITH-SELF (track-D capital allocation: the agent
# "trades with itself" by SELLING a building it no longer needs to
# unlock the cash required to satisfy the win clause).
#
# Real-world anchor: divestiture / asset rotation / SC2 mid-game sell.
# A producer holds a portfolio of assets, some of which are idle or
# redundant given the current operating regime. Selling a redundant
# asset frees working capital that can be deployed into a productive
# investment. The hedge: hoarding the redundant asset lets capital sit
# trapped in tangible form; selling at the right moment converts that
# capital back into cash so it can fund the next operation.
#
# Engine mechanic exercised (CLAUDE.md / OpenRA-Rust):
#   * `Command.sell([building_id])` issues a Sell order on the named
#     building. Engine refund: cost / 2 (world.rs:1383 — verified). So
#     `weap` (cost 2000) refunds 1000; `proc` (1400) refunds 700;
#     `fix` (1000) refunds 500; `barr` / `tent` (400) refunds 200.
#   * The sold building is removed; its actor id stops appearing in
#     `own_buildings`; the cash hits the player's bank within the
#     same tick.
#
# Pack frame: the agent owns a working economy (fact + proc + powr +
# harv on an ore patch) AND a redundant `weap` (war factory) that is
# not needed for the current win clause. Starting cash is too low to
# afford the required action (build a second proc — cost 1400 — to
# scale up). Selling the redundant weap returns 1000 cash, which when
# combined with one round of harvested income clears the 1400 proc
# cost AND lands the cash bar by the deadline.
#
# Four-policy discrimination bar (no defect, no cheat, no draw):
#   * STALL (only observe): no income action — the win cash bar is
#     never met → real reachable timeout LOSS.
#   * HOARD (harvest the patch but never sell the redundant weap):
#     the single harvester's income alone does not afford both the
#     2nd proc build AND clear the cash bar inside the deadline →
#     LOSS.
#   * SELL-AND-INVEST (sell the redundant weap → +1000 cash → build
#     a 2nd proc → cash bar clears with the doubled income before the
#     deadline): WIN.
#   * SELL-ONLY (sell the weap but don't build the 2nd proc): the
#     single-harv income alone still cannot reach the cash bar in
#     time → LOSS. (The sell is necessary but not sufficient — the
#     freed cash must be deployed.)
#
# Engine facts used (CLAUDE.md):
#   * sell refund = cost/2 (verified: world.rs:1383
#     `estimate_building_sell_value`).
#   * place_building has no adjacency requirement, so the 2nd proc
#     can be placed anywhere in-bounds.
#   * place_building('proc') auto-spawns a new harvester at the new
#     proc's footprint and binds it by path distance (CLAUDE.md fix).
#     Placed next to the patch, the new harv mines a short cycle and
#     income roughly doubles.
#   * `cash_gte` reads the player bank only (NOT stored ore). The
#     win clause uses cash_gte to make the sell→cash conversion
#     load-bearing (stored ore in the proc would not satisfy it).
#   * `not has_building:weap` is NOT a fail clause — the sell of the
#     weap is the intended verb; the only fail clauses are timeout,
#     fact-loss, and proc-loss.
#   * Far inert enemy `fact` marker prevents engine auto-`done` via
#     the all-enemies-eliminated path.
#   * Tick alignment: within_ticks ≤ 93 + 90·(max_turns − 1);
#     after_ticks = within_ticks + 1 so a non-finisher LOSES.

meta:
  id: econ-resource-trade-with-self
  title: 'Resource Trade With Self — Sell A Redundant Building To Fund The Win'
  capability: reasoning
  real_world_meaning: >
    The agent owns a working economy plus a redundant tech building
    (a second war factory) that the current win clause does not need.
    Starting cash is too low to afford the cash bar by the deadline
    on harvest income alone. Selling the redundant building returns
    cash/2 — enough, combined with one round of harvested income, to
    fund a second refinery whose doubled income compounds past the
    cash bar inside the clock. Stalling never earns enough income;
    hoarding the redundant building leaves capital trapped in tangible
    form and the cash bar misses; selling without re-investing the
    freed cash also misses. The pack tests the divestiture verb:
    recognise the redundant asset, sell it, redeploy the cash.
  robotics_analogue: >
    Asset rotation / portfolio divestiture for an autonomous
    operations stack. The fleet holds a piece of legacy equipment
    whose capability is not exercised by the current operating
    profile; the same capital, freed by selling that equipment and
    redeployed into a productive new asset, compounds throughput
    inside the planning horizon. The intended move is the trade —
    sell what isn't earning, fund what will.
  author: track-D-econ
  benchmark_anchor:
    - SC2 sell-and-rebuild
    - divestiture
    - asset rotation
    - capital recycling
    - "FIFO perishable inventory cap"

# MAP — per-scenario bespoke arena (replaces rush-hour-arena 128x40,
# flagged `large-trivial` on every tier in audits/family2_economy.csv).
# The decision is purely base-internal: sell the redundant weap, build
# a 2nd proc near a patch. All pre-placed actors fit within x<=22, and
# hard tier latitudes span y=10..28 — a 48x40 arena (playable 2..44,
# 2..36) fits with margin. Anti-DRAW enemy fact moved from (120,20)
# to (42,34) within the new bounds.
base_map:
  generator: arena
  name: econ-resource-trade-with-self-48x40
  width: 48
  height: 40
  cordon: 2
  title: Econ Resource Trade With Self Arena 48x40
starting_cash: 500

base:
  agent: {faction: allies}
  enemy: {faction: soviet, cash: 0}
  # The decision surface: sell (the load-bearing verb) + build +
  # place_building (deploy the freed cash) + harvest + move_units +
  # observe + stop.
  tools:
    - observe
    - build
    - place_building
    - harvest
    - move_units
    - sell
    - stop
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 8000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare sell-and-redeploy skill. Pre-placed: fact + proc + powr +
  # 1× harv + 1× redundant weap. Starting cash 500. Win = cash_gte
  # 3500 by tick 2700 with fact intact. Hoard (just harvest, no
  # sell) tops out near 2900 cash by deadline. Sell-and-invest
  # (sell weap → +1000 → build 2nd proc → doubled income) clears
  # the bar comfortably.
  easy:
    description: >
      Commander, this is a divestiture drill. You hold a Construction
      Yard (fact), Ore Refinery (proc), Power Plant (powr) and one
      harvester (harv, an unarmed ore-collector truck), plus a
      redundant War Factory (weap) left over from a previous operation,
      with $500 in the bank. Selling a building refunds half its cost —
      the War Factory ($2000) refunds $1000. Within about 30 turns,
      reach cash $5500 with the Construction Yard standing. Pure
      harvesting plateaus around $4500; sell the idle War Factory and
      redeploy the freed cash into a second Refinery near a patch to
      double income.
    starting_cash: 500
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: powr, owner: agent, position: [10, 20]}
        - {type: harv, owner: agent, position: [14, 18]}
        # The redundant war factory — not needed for the win clause.
        # Selling it (refund 1000) is the load-bearing verb.
        - {type: weap, owner: agent, position: [16, 22]}
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 22]}
        # Anti-DRAW: prevents engine auto-done.
        - {type: fact, owner: enemy, position: [42, 34]}
    win_condition:
      all_of:
        - cash_gte: 5500
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 2700
    fail_condition:
      any_of:
        - after_ticks: 2701
        - not: {building_count_gte: {type: fact, n: 1}}
        - not: {has_building: proc}
    max_turns: 30

  # ── MEDIUM ───────────────────────────────────────────────────────
  # Tighter cash bar. Hoard (harvest-only) tops out near 5500 by the
  # deadline; sell-and-invest clears the bar with the freed cash +
  # doubled income from a second proc.
  medium:
    description: >
      Commander, this is a divestiture drill with a tighter cash bar.
      You hold a Construction Yard (fact), Ore Refinery (proc), Power
      Plant (powr) and one harvester (harv, an unarmed ore-collector
      truck), plus a redundant War Factory (weap), with $500 in the
      bank. Selling the War Factory refunds $1000 (half cost). Within
      about 40 turns, reach cash $7500 with the Construction Yard
      standing. Pure harvesting plateaus around $6000; sell the idle
      War Factory and reinvest the freed cash into a second Refinery
      near the other patch to double income.
    starting_cash: 500
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: powr, owner: agent, position: [10, 20]}
        - {type: harv, owner: agent, position: [14, 18]}
        - {type: weap, owner: agent, position: [16, 22]}
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 22]}
        - {type: fact, owner: enemy, position: [42, 34]}
    win_condition:
      all_of:
        - cash_gte: 7500
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
        - not: {building_count_gte: {type: fact, n: 1}}
        - not: {has_building: proc}
    max_turns: 40

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 axis: base spawns NORTH (y=10) or SOUTH (y=28) by seed. Same
  # sell-and-invest decision per spawn. The redundant weap and the
  # near-patch pair sit at the active latitude; the 2nd proc must
  # land near YOUR live yard.
  hard:
    description: >
      Commander, this is a divestiture drill with seed-rotated base
      latitude. You hold a Construction Yard (fact), Ore Refinery
      (proc), Power Plant (powr) and one harvester (harv, an unarmed
      ore-collector truck), plus a redundant War Factory (weap), at
      either the NORTH (y=10) or SOUTH (y=28) latitude with $500 in
      the bank. Selling the War Factory refunds $1000. Within about
      50 turns, reach cash $9000 with the Construction Yard standing.
      Sell the idle War Factory and reinvest into a second Refinery
      near YOUR live yard — a memorised placement misses on the flip.
    starting_cash: 500
    overrides:
      actors:
        # ── spawn 0 — NORTH base (y=10) ─────────────────────────────
        - {type: fact, owner: agent, position: [8, 10], spawn_point: 0}
        - {type: proc, owner: agent, position: [12, 10], spawn_point: 0}
        - {type: powr, owner: agent, position: [10, 12], spawn_point: 0}
        - {type: harv, owner: agent, position: [14, 10], spawn_point: 0}
        - {type: weap, owner: agent, position: [16, 14], spawn_point: 0}
        # ── spawn 1 — SOUTH base (y=28) ─────────────────────────────
        - {type: fact, owner: agent, position: [8, 28], spawn_point: 1}
        - {type: proc, owner: agent, position: [12, 28], spawn_point: 1}
        - {type: powr, owner: agent, position: [10, 26], spawn_point: 1}
        - {type: harv, owner: agent, position: [14, 28], spawn_point: 1}
        - {type: weap, owner: agent, position: [16, 24], spawn_point: 1}
        # Neutral mines duplicated at both spawn latitudes
        # (neutral / enemy actors don't honour spawn_point filter).
        - {type: mine, owner: neutral, position: [22, 10]}
        - {type: mine, owner: neutral, position: [22, 14]}
        - {type: mine, owner: neutral, position: [22, 28]}
        - {type: mine, owner: neutral, position: [22, 24]}
        - {type: fact, owner: enemy, position: [42, 34]}
    win_condition:
      all_of:
        - cash_gte: 9000
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 4500
    fail_condition:
      any_of:
        - after_ticks: 4501
        - not: {building_count_gte: {type: fact, n: 1}}
        - not: {has_building: proc}
    max_turns: 50
