# coord-converge-on-target.yaml
#
# ACTION capability — triple-prong convergent attack. Three armoured
# squads start at three different bearings (NORTH, WEST-of-objective,
# SOUTH) and must CONVERGE on a single defended enemy objective
# (`fact`) at mid-east. The win predicate requires ALL NINE tanks
# (every tank from all three squads) inside the objective region with
# the yard destroyed: a stall delivers zero tanks, a single squad
# delivers three, a two-squad attempt delivers six — none reaches the
# n=9 region threshold. Only a true three-prong convergence, every
# column committed, satisfies the bar.
#
# Real-world anchor: military convergent / envelopment attack and SC2
# triple-prong assault — multiple columns striking from different
# bearings to overwhelm a defender that would defeat any single
# column. Robotics analogue: synchronous multi-team rendezvous on a
# shared objective under a tight common deadline.
#
# Engine notes (per CLAUDE.md):
#   - `fact` is `MustBeDestroyed`: razing it would auto-`done` the
#     engine and a within-ticks check could collapse to DRAW. A
#     SENTINEL enemy `fact` is placed in the far north (out of the
#     combat zone) so the episode persists past the objective fact's
#     destruction long enough for the win/fail predicates to evaluate.
#   - Bot `guard` (GUARD_AGGRO ≈ 16, GUARD_LEASH ≈ 18) holds post,
#     auto-fires in range, lunges at the nearest foe within ≈16
#     cells, snaps back past ≈18 — the leashed-defender idiom that
#     gives the objective a thematic garrison.
#   - `units_in_region_gte` n=9 on the 9 tanks is the load-bearing
#     convergence clause: each squad is 3 tanks, so reaching 9 inside
#     the (100,20,r=8) region REQUIRES every one of the three squads
#     to be dispatched and arrive. A stall delivers 0, a single
#     squad 3, a two-squad attempt 6 — all short of n=9. Only a
#     three-prong converge satisfies the predicate; the objective
#     fact must also be destroyed.
#   - Squad positions are balanced equidistant (~27-34 cells from the
#     objective) so a naive simultaneous attack-move from all three
#     squads arrives together and no squad is left isolated.
#   - Enemy actors are NOT filtered by `spawn_point` (CLAUDE.md). The
#     hard tier varies the AGENT staging — both groups share the
#     3-prong N/W/S shape, but staging cells are shifted (the W-squad
#     column flips by ~6 cells and the N/S latitudes shift) — while
#     the defender garrison stays symmetric.

meta:
  id: coord-converge-on-target
  title: 'Convergent Attack — Three Squads, One Defended Target'
  capability: action
  real_world_meaning: >
    Three armoured columns start on three different bearings (NORTH,
    WEST-of-objective, SOUTH) and must converge on a single defended
    enemy construction yard from three different directions. The win
    requires every tank of all three columns to reach the objective
    region with the yard destroyed: a single-column tour delivers
    only a third of the force, a serialized two-column attempt only
    two thirds — neither reaches the joint-arrival threshold. The
    advertised capability is synchronous multi-fleet convergence on a
    shared objective; a stall loses on the clock.
  robotics_analogue: >
    Synchronous multi-robot rendezvous on a contested objective: each
    team must dispatch on a different ingress vector so that all
    teams arrive at the goal; dispatching only one or two teams
    leaves the joint payload threshold (≥n teammates on the goal)
    unmet and the objective unfulfilled.
  benchmark_anchor:
    - "SC2 triple-prong assault timing"
    - "military convergent attack / pincer movement"
    - "SMAC squad convergence"
    - "envelopment doctrine: hit from multiple directions simultaneously"
  author: openra-bench

base_map: rush-hour-arena

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: guard}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  termination: {max_ticks: 12000}
  actors: []   # every level supplies its own actor list via overrides.

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # The bare convergent-attack skill: 3 leashed guards (distributed
  # around the objective fact), 9 tanks total. Win requires all 9
  # tanks inside the objective region — a stall, a single squad (3),
  # or a two-squad attempt (6) all fall short of n=9.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # THREE squads of medium tanks (3× 2tnk each, 9 tanks total) start at
    # three different bearings around the enemy construction yard (`fact`
    # at ~100,20): NORTH (~70,6), WEST (~66,20), SOUTH (~70,34). The yard
    # is defended by 3 leashed rifle-infantry guards (e1, bot_type guard)
    # that hold post, auto-fire in range, and lunge at the nearest
    # approaching foe. Win when at least 9 of your 9 tanks are inside an
    # 8-cell radius of (100,20) AND the enemy construction yard is
    # destroyed, before tick 4500. A single squad delivers only 3 tanks,
    # two squads only 6 — both short of the 9-tank convergence threshold.
    # A stall loses on the clock.
    description: >
      Three tank squads — three mediums each — stage north (70,6), west
      (66,20), and south (70,34) of the defended enemy yard at (100,20).
      Three leashed riflemen guard it. Drive all three squads in together;
      one or two alone can't put nine tanks in the (100,20) disc. Raze the
      yard, within about 50 turns.
    overrides:
      actors:
        # NORTH squad — 3 medium tanks at (70,6).
        - {type: 2tnk, owner: agent, position: [70, 6],  stance: 1, count: 3}
        # WEST squad — 3 medium tanks at (66,20). Equidistant from
        # the objective (~34 cells) so a naive simultaneous launch
        # arrives together.
        - {type: 2tnk, owner: agent, position: [66, 20], stance: 1, count: 3}
        # SOUTH squad — 3 medium tanks at (70,34).
        - {type: 2tnk, owner: agent, position: [70, 34], stance: 1, count: 3}
        # The OBJECTIVE: enemy construction yard.
        - {type: fact, owner: enemy, position: [100, 20]}
        # 3 GUARDS distributed around the objective (W / E / N faces)
        # so every ingress bearing enters guard aggro.
        - {type: e1, owner: enemy, position: [98, 18]}
        - {type: e1, owner: enemy, position: [102, 22]}
        - {type: e1, owner: enemy, position: [100, 17]}
        # SENTINEL: persistent enemy fact in the far north so the
        # engine does not auto-`done` the instant the objective fact
        # dies; lets within_ticks / region predicates evaluate
        # cleanly on the terminal frame.
        - {type: fact, owner: enemy, position: [120, 4]}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 100, y: 20, radius: 8, n: 9}}
        - {enemy_key_buildings_destroyed: {types: [fact]}}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 54

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: 4 guards (one per cardinal face of the
  # objective). The convergence threshold is unchanged (n=9) — a
  # single squad delivers 3, a two-squad attempt 6, only a full
  # three-prong converge delivers all 9 tanks to the objective.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # THREE squads of medium tanks (3× 2tnk each, 9 tanks total) from
    # NORTH (~70,6), WEST (~66,20), SOUTH (~70,34) must converge on the
    # enemy construction yard (`fact` at ~100,20) defended by 4 leashed
    # rifle-infantry guards (one on each cardinal face). All three squads
    # must arrive: win when all 9 of your 9 tanks are inside an 8-cell
    # radius of (100,20) AND the yard is destroyed, before tick 4500. A
    # single squad delivers only 3 tanks, two squads only 6. A stall loses
    # on the clock.
    description: >
      Same three squads from N, W, and S — but the yard at (100,20) now
      has four leashed riflemen, one on each face. All nine tanks must
      arrive in the (100,20) disc and the yard must fall. Send every squad
      at once, within about 50 turns.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [70, 6],  stance: 1, count: 3}
        - {type: 2tnk, owner: agent, position: [66, 20], stance: 1, count: 3}
        - {type: 2tnk, owner: agent, position: [70, 34], stance: 1, count: 3}
        - {type: fact, owner: enemy, position: [100, 20]}
        # 4 guards: one on each cardinal face of the objective.
        - {type: e1, owner: enemy, position: [98, 20]}
        - {type: e1, owner: enemy, position: [102, 20]}
        - {type: e1, owner: enemy, position: [100, 17]}
        - {type: e1, owner: enemy, position: [100, 23]}
        - {type: fact, owner: enemy, position: [120, 4]}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 100, y: 20, radius: 8, n: 9}}
        - {enemy_key_buildings_destroyed: {types: [fact]}}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 54

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 more controlled variable: TWO seed-driven agent spawn groups
  # round-robined per seed. Both groups share the 3-prong N/W/S
  # convergent shape, but the staging cells are shifted between
  # groups (group 0: 70,6/66,20/70,34; group 1: 76,5/72,18/76,32);
  # the W-squad column flips by ~6 cells and the N/S latitudes shift
  # so a memorised single-cell opening cannot generalise across
  # seeds. The defender garrison stays symmetric (4 guards, one on
  # each cardinal face) so both spawns face the same convergent
  # geometry. Per CLAUDE.md, "if ANY agent actor declares
  # spawn_point, every agent actor WITHOUT spawn_point is filtered
  # OUT", so every agent actor declares its spawn_point and the two
  # full squad layouts are listed explicitly.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # THREE squads of medium tanks (3× 2tnk each, 9 tanks total) must
    # converge on the enemy construction yard (`fact` at ~100,20) defended
    # by 4 leashed rifle-infantry guards (one on each cardinal face). The
    # squad staging cells flip per seed: one spawn stages NORTH (~70,6) /
    # WEST (~66,20) / SOUTH (~70,34); the other stages a shifted variant —
    # NORTH (~76,5) / WEST (~72,18) / SOUTH (~76,32). Both layouts are
    # balanced equidistant (~27-34 cells per squad) so a synchronised
    # launch arrives together; a memorised single-cell opening cannot
    # generalise. Win when all 9 of your 9 tanks are inside an 8-cell
    # radius of (100,20) AND the yard is destroyed, before tick 4500. A
    # single squad delivers 3 tanks, two squads 6 — both short of the n=9
    # convergence threshold.
    description: >
      Three squads of three medium tanks each from N, W, and S, with the
      exact staging cells shifted per seed. The defended yard at (100,20)
      still wears four leashed riflemen. Launch synchronously so all nine
      tanks converge in the (100,20) disc; raze the yard within about 50
      turns.
    overrides:
      actors:
        # spawn_point 0 — NORTH / WEST-of-objective / SOUTH.
        - {type: 2tnk, owner: agent, position: [70, 6],  stance: 1, count: 3, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [66, 20], stance: 1, count: 3, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [70, 34], stance: 1, count: 3, spawn_point: 0}
        # spawn_point 1 — shifted N/W/S layout: NORTH (76,5), WEST
        # (72,18), SOUTH (76,32). Same convergent shape as group 0
        # but the staging cells are shifted (per-seed start
        # variation), keeping all three squads approximately
        # equidistant (~27-28 cells) from the objective so the
        # naive simultaneous launch still arrives together. The W
        # squad's exact column / latitude flips per seed, so a
        # memorised opening cannot generalise across seeds.
        - {type: 2tnk, owner: agent, position: [76, 5],  stance: 1, count: 3, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [72, 18], stance: 1, count: 3, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [76, 32], stance: 1, count: 3, spawn_point: 1}
        # The OBJECTIVE.
        - {type: fact, owner: enemy, position: [100, 20]}
        # 4 guards: one on each cardinal face. Symmetric: equally
        # covers both lateral ingress bearings (W and E).
        - {type: e1, owner: enemy, position: [98, 20]}
        - {type: e1, owner: enemy, position: [102, 20]}
        - {type: e1, owner: enemy, position: [100, 17]}
        - {type: e1, owner: enemy, position: [100, 23]}
        # SENTINEL: persistent enemy fact in the far north so the
        # engine does not auto-`done` on objective raze.
        - {type: fact, owner: enemy, position: [120, 4]}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 100, y: 20, radius: 8, n: 9}}
        - {enemy_key_buildings_destroyed: {types: [fact]}}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {own_units_gte: 1}}
    max_turns: 54
