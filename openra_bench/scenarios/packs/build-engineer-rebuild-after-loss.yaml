# Validate: python -m openra_bench.scenarios.validate packs/build-engineer-rebuild-after-loss.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# BUILD-ENGINEER-REBUILD-AFTER-LOSS (Wave-8 REASONING: keep at least
# one Power Plant alive through an in-world enemy strike on the
# forward base — power-grid continuity via either reactive rebuild at
# the safe rear OR preemptive redundancy).
#
# Real-world anchor: PlanBench replanning under exogenous loss /
# disaster recovery after a critical-infrastructure loss / SC2 rebuild-
# after-trade / two-site continuity engineering (primary + standby).
#
# REDESIGNED (v2): the previous version used `scheduled_events:
# destroy_actors` to externally kill the agent's only powr and gated
# the win on a `then:[lost powr, rebuilt powr]` sequence — a
# predicate-gated failure mode that leaked the strategy and shipped
# without an in-world loss-cause. The redesign per the user's design
# intent and audits/EDIT_PRINCIPLES.md §9.5 (no-solution-leak):
#
#   - Two bases: a FORWARD base (east) carrying powr / proc / fact,
#     with a pre-placed enemy strike force adjacent that destroys
#     EVERY building there inside the first few turns of in-world
#     simulation. The agent SEES this happen.
#   - A HOME base (west) carrying only fact + harv + a small
#     garrison. NO pre-placed powr — the agent must BUILD one
#     somewhere to satisfy the win predicate.
#   - The enemy strike force is `stance:3` (AttackAnything) and
#     `count: 3` — strong enough to destroy any new build at the
#     forward base (the tanks linger and auto-hunt new visible
#     enemies in that region), but too few / too slow to reach the
#     home base before the deadline.
#   - Win = state-based: `building_count_gte:{type:powr, n:1}`
#     INSIDE `within_ticks:N`. Translation: "at least one Power
#     Plant alive at the deadline, ANYWHERE on the map". Reactive
#     and preemptive both satisfy this naturally — the agent can
#     rebuild at home after watching the forward powr die, OR build
#     a redundant home powr immediately. No `then:` latch, no
#     scheduled-event destruction.
#
# LOSS MODES (all in-game, no predicate-gated trickery):
#   (a) STALL — never builds anything. The forward powr is destroyed
#       by the enemy strike force within ~1 turn. Live powr count
#       drops to 0 and never recovers. At the deadline tick the win
#       predicate `building_count_gte:powr:1` is FALSE → reachable
#       timeout LOSS via after_ticks.
#   (b) FORWARD-ONLY rebuild — agent rebuilds powr at the forward
#       base. The lingering stance:3 4tnks see the new powr (the
#       enemy 4tnk sight radius covers the forward base footprint)
#       and destroy it. Live powr count stays 0 → LOSS.
#   (c) HOME rebuild (intended reactive) — agent waits, sees the
#       forward powr die, builds a fresh powr at the safe home base
#       out of the strike force's reach. Live powr count recovers to
#       1 → WIN.
#   (d) HOME preemptive — agent builds a redundant powr at the
#       safe home base on turn 1 BEFORE the strike lands. Live powr
#       count goes 1 → 2 (briefly) → 1 (after the strike) → WIN.
#
# Per CLAUDE.md "no defect, no cheat" the (a)/(b) lazy plays must
# LOSE on every level × hard seed (1-4); (c) and (d) must WIN.
#
# Difficulty axis (one new controlled variable per tier):
#   • easy   — 2× 4tnk strike (clean opening, no defenders to
#              chew through, easy to recognise the doomed forward
#              base) on a 96x40 arena. Generous deadline
#              (max_turns 40 → reachable tick 3603 > within_ticks
#              3500).
#   • medium — 3× 4tnk strike (heavier — guarantees forward
#              rebuild also dies inside 2-3 turns of placement,
#              tightening the "you cannot save the forward base"
#              signal). Same deadline.
#   • hard   — TWO seed-driven AGENT spawn_point groups (NORTH
#              y=14 / SOUTH y=26 home base, FORWARD at the matching
#              latitude). Per CLAUDE.md `spawn_point` rules the full
#              base on each latitude must be duplicated across both
#              spawn groups; enemy strike force is duplicated at
#              both latitudes (enemies don't honour spawn_point). A
#              memorised "build powr at (8,18)" loses on the SOUTH
#              seed (the home there is at y=26 and the new powr
#              would land in mid-map, possibly in range of the
#              foreign-latitude strike).
#
# ENGINE FACTS (CLAUDE.md):
#   1. `powr` cost = 300 (vendor RA YAML). 500 cash funds one
#      rebuild with $200 slack.
#   2. `building_count_gte` reads the LIVE `own_buildings` list per
#      frame (win_conditions.py): satisfied iff at least one alive
#      powr exists at the win check. A destroyed powr drops the
#      count by one immediately; a placed powr raises it the moment
#      construction completes. Pairs naturally with `within_ticks`
#      for "at least one alive at the deadline".
#   3. `place_building` does NOT enforce build-adjacency (CLAUDE.md)
#      — a `build('powr') + place_building` chain works at arbitrary
#      in-bounds coords, so the agent can rebuild at the home base
#      well outside the forward strike radius.
#   4. Enemy stance:3 4tnks at AttackAnything auto-fire on contact
#      at tick 0 AND advance toward the nearest visible enemy when
#      no target is in range (CLAUDE.md stance semantics). Their
#      sight is ~6-8 cells; the strike clears the forward base
#      footprint (~5-cell radius). After the forward base falls
#      they advance westward but the home base is ~40 cells away
#      and the strike force is too small to push that far inside
#      the deadline (the small home garrison + the deadline arrive
#      first).
#   5. `4tnk` Range ~5 cells, Speed ~0.1 cell/tick → a 4tnk needs
#      ~10 ticks/cell to advance. 40 cells of separation between
#      enemy strike (x≈52) and home base (x≈8) ⇒ ~400 ticks of
#      walk time alone, longer than the strike force lasts after
#      it bites the home garrison.
#   6. Persistent unarmed enemy `fact` marker far east keeps the
#      engine's all-enemies-eliminated auto-`done` path gated, so
#      non-winners reach the deadline as LOSS (not DRAW).
#   7. Tick alignment: max_turns 40 → ceiling 93 + 90·39 = 3603 >
#      3500 ✓. within_ticks 3500; fail after_ticks 3501.
#   8. Hard tier `spawn_point` rule (CLAUDE.md oramap.rs): ANY
#      agent actor with spawn_point causes agent actors WITHOUT
#      spawn_point to be FILTERED OUT — the FULL base is duplicated
#      across both spawn groups at spawn-matched cells. Enemy
#      actors don't honour spawn_point and are duplicated at BOTH
#      y-latitudes to keep per-spawn strike geometry symmetric.

meta:
  id: build-engineer-rebuild-after-loss
  title: 'Build-Engineer: Keep Power Online Through a Forward-Base Strike'
  capability: reasoning
  real_world_meaning: >
    Power-grid continuity through an in-world loss event. The agent
    operates two bases: a FORWARD base (east) with a Power Plant,
    Refinery, and Construction Yard, and a HOME base (west) with a
    Construction Yard, harvester, and small garrison but NO Power
    Plant. A pre-placed enemy heavy-tank strike force adjacent to
    the forward base destroys its buildings inside the first turns
    of in-world play; the home base is too far away for the strike
    force to reach inside the deadline. The agent wins by ensuring
    at least one Power Plant is alive anywhere on the map at the
    deadline — either by REBUILDING a Power Plant at the safe home
    base after observing the forward loss, or by PRE-EMPTIVELY
    building a redundant Power Plant at the home base before the
    strike lands. Both are rational operator solutions; the win
    predicate is state-based and accepts either. Stalling lets the
    forward Power Plant die with no replacement; placing the
    replacement back at the forward base lets the enemy destroy it
    again; both fail.
  robotics_analogue: >
    Two-site critical-infrastructure continuity. The autonomous
    operator runs a primary site under imminent environmental damage
    and a remote standby site that is geographically out of reach
    of the damage. Continuity is preserved by ensuring a working
    power node exists at any site at the deadline — typically by
    commissioning a power node at the standby site, either after
    observing the primary's failure or pre-emptively before it.
    Persisting in repairing the primary in place is a real-world
    losing play: the damage event recurs and the repaired node is
    lost again. The right play is to stand up the redundant capacity
    where the threat cannot reach.
  benchmark_anchor:
    - "PlanBench replanning under exogenous loss"
    - "disaster recovery"
    - "exogenous loss"
    - "two-site business continuity"
  author: openra-bench-wave-8

base_map:
  generator: arena
  name: build-engineer-rebuild-after-loss-arena
  width: 96
  height: 40
  cordon: 2
  title: Build Engineer Rebuild After Loss Arena 96x40

# Rebuild reserve: 500 cr funds one `powr` (300 cr) with $200 slack.
# A model that spends the reserve on an extra build (e.g. `e1` at
# 100 cr four times) starves the powr rebuild → LOSS.
starting_cash: 500

base:
  agent: {faction: allies}
  # No scripted bot — the strike force is a small pre-placed `4tnk`
  # squad at stance:3 (AttackAnything). Their job is to destroy the
  # forward base buildings on tick 0..200 and to keep destroying
  # anything the agent rebuilds at the forward site. They are too
  # few to fight their way west to the home base inside the deadline
  # (~40 cells of travel + small home garrison) so the home is a
  # safe rebuild site by geometry, not by predicate.
  enemy: {faction: soviet, cash: 0}
  # Build-engineer toolset: build + place_building drive the rebuild;
  # move_units + attack_unit let the agent defend if needed; harvest
  # keeps the ore income credible (the harv is present in actors).
  tools: [observe, build, place_building, harvest, move_units, attack_unit, stop]
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 4000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare two-base recognition skill. 2× 4tnk strike on the forward
  # base: clean, identifiable, and unmistakably wins the engagement
  # there. No agent defenders at the forward base — the loss event
  # is unambiguous (no chance to micro-trade the forward buildings).
  # max_turns 40 → reachable tick 3603 > 3500 ✓.
  easy:
    description: >
      You hold two bases. Your HOME base sits in the west around
      (8,18) — a Construction Yard, a harvester, and a small rifle
      garrison — but NO Power Plant. Your FORWARD base sits in the
      east around (46,18) — a Construction Yard, a Power Plant, and
      a Refinery. Two enemy heavy tanks are positioned adjacent to
      your forward base. Your task is to keep at least one Power
      Plant alive anywhere on the map within about 40 turns. You
      have $500 in the bank.
    starting_cash: 500
    overrides:
      actors:
        # ── HOME base (WEST, safe rear) — fact + harv + ore patch
        # + 2 e1 garrison. NO powr: the agent must build one
        # somewhere to satisfy `building_count_gte:{powr,1}`.
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: harv, owner: agent, position: [10, 20]}
        - {type: mine, owner: neutral, position: [14, 18]}
        - {type: e1, owner: agent, position: [10, 16], stance: 2}
        - {type: e1, owner: agent, position: [10, 22], stance: 2}
        # ── FORWARD base (EAST, doomed) — fact + powr + proc.
        # These will be destroyed by the strike force; the agent
        # OBSERVES the in-world loss event.
        - {type: fact, owner: agent, position: [44, 18]}
        - {type: powr, owner: agent, position: [46, 18]}
        - {type: proc, owner: agent, position: [48, 18]}
        # ── ENEMY strike: 2× 4tnk stance:3 adjacent to the
        # forward powr. They one-shot the forward buildings inside
        # the first few turns AND linger to destroy any forward
        # rebuild. Too few to reach the home base before the
        # deadline (40+ cells of travel, home garrison absorbs
        # stragglers).
        - {type: '4tnk', owner: enemy, position: [52, 17], stance: 3}
        - {type: '4tnk', owner: enemy, position: [52, 19], stance: 3}
        # Persistent far enemy marker — LOSS-not-DRAW guarantee.
        - {type: fact, owner: enemy, position: [88, 30]}
    win_condition:
      all_of:
        # `after_ticks: 800` is the END-STATE gate: the agent's
        # initial forward `powr` will be destroyed inside the first
        # 100-200 ticks; we only check power continuity AFTER the
        # strike has had time to land. With the persistent enemy
        # fact marker far east the engine never auto-`done`s on
        # enemy-elimination, so `after_ticks` in win is safe here
        # (CLAUDE.md: incompatible only with ConquestVictoryConditions
        # — i.e. when the LAST MustBeDestroyed enemy building falls;
        # the marker prevents that). The state-based powr/fact
        # checks are live per-frame: at the gating tick the agent
        # must own at least one Power Plant ANYWHERE on the map. The
        # reactive play (rebuild at home after observing the forward
        # loss) and the preemptive play (build redundancy at home
        # turn 1) both satisfy the predicate naturally.
        - {after_ticks: 800}
        - building_count_gte: {type: powr, n: 1}
        # Must still own a Construction Yard somewhere (the home
        # fact survives by geometry; this clause just prevents a
        # degenerate "lose everything" tie).
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 3500
    fail_condition:
      any_of:
        - after_ticks: 3501
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 40

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: HEAVIER strike (3× 4tnk vs easy's 2).
  # The third tank guarantees fast clearance of any forward rebuild
  # (a single 4tnk vs a fresh powr is ~3 turns; 3 tanks is ~1).
  # Tightens the "forward is unholdable" signal — a model that
  # tries to micro-rebuild the forward base loses faster and more
  # visibly. Same deadline, same home geometry, same 500 cash.
  medium:
    description: >
      You hold two bases. Your HOME base in the west around (8,18)
      has a Construction Yard, a harvester, and a small rifle
      garrison but NO Power Plant. Your FORWARD base in the east
      around (46,18) has a Construction Yard, a Power Plant, and a
      Refinery — and THREE enemy heavy tanks are positioned beside
      it. Keep at least one Power Plant alive anywhere on the map
      within about 40 turns. You have $500 in the bank.
    starting_cash: 500
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: harv, owner: agent, position: [10, 20]}
        - {type: mine, owner: neutral, position: [14, 18]}
        - {type: e1, owner: agent, position: [10, 16], stance: 2}
        - {type: e1, owner: agent, position: [10, 22], stance: 2}
        - {type: fact, owner: agent, position: [44, 18]}
        - {type: powr, owner: agent, position: [46, 18]}
        - {type: proc, owner: agent, position: [48, 18]}
        # HEAVIER strike: 3× 4tnk surrounding the forward powr.
        - {type: '4tnk', owner: enemy, position: [52, 17], stance: 3}
        - {type: '4tnk', owner: enemy, position: [52, 19], stance: 3}
        - {type: '4tnk', owner: enemy, position: [50, 16], stance: 3}
        - {type: fact, owner: enemy, position: [88, 30]}
    win_condition:
      all_of:
        - {after_ticks: 800}
        - building_count_gte: {type: powr, n: 1}
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 3500
    fail_condition:
      any_of:
        - after_ticks: 3501
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 40

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled variable on top of medium: TWO seed-driven AGENT
  # spawn_point groups (NORTH home y=14 / SOUTH home y=26) round-
  # robined by seed. Per CLAUDE.md `spawn_point` rules:
  #   * ANY agent actor with spawn_point ⇒ agent actors WITHOUT
  #     spawn_point are filtered out, so the FULL base (home fact
  #     + harv + garrison + forward fact + powr + proc) is
  #     DUPLICATED across both spawn groups at spawn-matched cells.
  #   * Enemy actors do NOT honour spawn_point (always place); so
  #     we DUPLICATE the 3× 4tnk strike at BOTH y-latitudes (NORTH
  #     y=14 and SOUTH y=26) to keep per-spawn strike geometry
  #     symmetric. The foreign-latitude strikers sit at the
  #     dormant forward powr location (filtered out by the spawn
  #     round-robin) and never engage active agent assets unless
  #     the agent's home is at their latitude — which it isn't on
  #     the foreign spawn.
  hard:
    description: >
      You hold two bases. Your HOME base sits in the west around
      x=8, but at a north-or-south latitude (y=14 or y=26) chosen
      by seed — it has a Construction Yard, a harvester, and a
      small rifle garrison but NO Power Plant. Your FORWARD base
      sits on the SAME latitude around x=46 with a Construction
      Yard, a Power Plant, and a Refinery — and THREE enemy heavy
      tanks are positioned beside it. Keep at least one Power Plant
      alive anywhere on the map within about 40 turns. You have
      $500 in the bank.
    starting_cash: 500
    overrides:
      actors:
        # ── SPAWN 0 (NORTH y=14) home + forward base ──────────────
        - {type: fact, owner: agent, position: [8, 14], spawn_point: 0}
        - {type: harv, owner: agent, position: [10, 16], spawn_point: 0}
        - {type: e1, owner: agent, position: [10, 12], stance: 2, spawn_point: 0}
        - {type: e1, owner: agent, position: [10, 18], stance: 2, spawn_point: 0}
        - {type: fact, owner: agent, position: [44, 14], spawn_point: 0}
        - {type: powr, owner: agent, position: [46, 14], spawn_point: 0}
        - {type: proc, owner: agent, position: [48, 14], spawn_point: 0}
        # ── SPAWN 1 (SOUTH y=26) home + forward base ──────────────
        - {type: fact, owner: agent, position: [8, 26], spawn_point: 1}
        - {type: harv, owner: agent, position: [10, 28], spawn_point: 1}
        - {type: e1, owner: agent, position: [10, 24], stance: 2, spawn_point: 1}
        - {type: e1, owner: agent, position: [10, 30], stance: 2, spawn_point: 1}
        - {type: fact, owner: agent, position: [44, 26], spawn_point: 1}
        - {type: powr, owner: agent, position: [46, 26], spawn_point: 1}
        - {type: proc, owner: agent, position: [48, 26], spawn_point: 1}
        # Neutral mines shared across both spawns (neutrals always
        # place — same rule as enemy actors).
        - {type: mine, owner: neutral, position: [14, 14]}
        - {type: mine, owner: neutral, position: [14, 26]}
        # ── Enemy strike (duplicated at both latitudes; enemy
        # actors do NOT honour spawn_point — CLAUDE.md). The
        # active-latitude strikers do the forward-base demolition;
        # the foreign-latitude strikers sit dormant at the
        # filtered-out forward powr coords and never engage
        # active assets.
        - {type: '4tnk', owner: enemy, position: [52, 13], stance: 3}
        - {type: '4tnk', owner: enemy, position: [52, 15], stance: 3}
        - {type: '4tnk', owner: enemy, position: [50, 12], stance: 3}
        - {type: '4tnk', owner: enemy, position: [52, 25], stance: 3}
        - {type: '4tnk', owner: enemy, position: [52, 27], stance: 3}
        - {type: '4tnk', owner: enemy, position: [50, 24], stance: 3}
        # Persistent far enemy marker — LOSS-not-DRAW guarantee.
        - {type: fact, owner: enemy, position: [88, 20]}
    win_condition:
      all_of:
        - {after_ticks: 800}
        - building_count_gte: {type: powr, n: 1}
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 3500
    fail_condition:
      any_of:
        - after_ticks: 3501
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 40
