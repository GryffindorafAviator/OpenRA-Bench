levels:
  easy:
    description: >
      Rush Hour Sweep \u2014 easy. Find and destroy >=5 scattered enemy
      units within the time budget, losing <=6 of your own. Timeout
      or total force destruction is a loss, not a draw.
    win_condition:
      all_of:
      - units_killed_gte: 5
      - within_ticks: 16000
      - units_lost_lte: 6
    fail_condition:
      any_of:
      - not: {own_units_gte: 1}
      - after_ticks: 16001
  medium:
    description: >
      Rush Hour Sweep \u2014 medium. Tighter clock and attrition cap:
      destroy >=7 enemy units in 13000 ticks, losing <=4. Timeout is
      a loss.
    win_condition:
      all_of:
      - units_killed_gte: 7
      - within_ticks: 13000
      - units_lost_lte: 4
    fail_condition:
      any_of:
      - not: {own_units_gte: 1}
      - after_ticks: 13001
  hard:
    description: >
      Rush Hour Sweep \u2014 hard. The agent force already round-robins
      between two base spawn_point groups by seed (start corner varies,
      anti-memorisation); hard adds a tight clock, an attrition cap,
      and a real loss on force destruction or timeout.
    win_condition:
      all_of:
      - units_killed_gte: 9
      - within_ticks: 10000
      - units_lost_lte: 3
    fail_condition:
      any_of:
      - not: {own_units_gte: 1}
      - after_ticks: 10001
