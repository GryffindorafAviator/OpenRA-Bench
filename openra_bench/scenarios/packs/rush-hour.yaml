    stance: 1
    health: 100
    facing: -1
    count: 2
    randomize:
      position: {base: [118, 31], offset: 2}
  - type: e1
    owner: enemy
    position: [22, 20]
    stance: 1
    health: 100
    facing: -1
    count: 2
  - type: e1
    owner: enemy
    position: [50, 19]
    stance: 1
    health: 100
    facing: -1
    count: 2
  - type: e1
    owner: enemy
    position: [78, 20]
    stance: 1
    health: 100
    facing: -1
