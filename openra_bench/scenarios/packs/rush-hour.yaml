meta:
  id: rush-hour
  title: 'Search & Destroy \u2014 Find and Eliminate Scattered Enemy Squads'
  capability: action
  real_world_meaning: >
    A large arena hides several separate enemy groups in fog. The task
    is to SEARCH the map, locate each group, and destroy enough of
    them before the clock runs out \u2014 the skill is coordinated coverage
    of unknown space (spread out, scout, converge), not single-unit
    micro. This is the find-the-enemy counterpart to the close-range
    1v1 duel.
  robotics_analogue: >
    Multi-robot search-and-destroy: sweep and clear a bounded area
    with several dispersed targets within a time budget.
  author: ported-from-training
base_map: rush-hour-arena
