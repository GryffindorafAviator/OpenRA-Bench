meta:
  id: rush-hour
  title: 'Search & Destroy - Sweep a Scattered Enemy Off the Arena'
  capability: action
  real_world_meaning: >
    A wide arena hides a chain of separate enemy squads, scattered in a
    zigzag across the whole map and in fog. The task is to SWEEP the
    arena - spread a small armoured team across the off-axis groups,
    reveal and destroy enough of them before the clock runs out, without
    losing the team. The skill is coordinated coverage of unknown space
    (spread out, scout, converge), not single-unit micro or a one-spot
    auto-brawl. This is the find-the-enemy counterpart to the
    close-range 1v1 duel.
  robotics_analogue: >
    Multi-robot search-and-destroy: sweep and clear a bounded area with
    several dispersed targets within a time budget, keeping the team
    intact.
  author: ported-from-training
base_map: rush-hour-arena
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  # A lean armoured sweep team (durable 2tnk core + fast jeep scouts),
  # NOT a 48-unit auto-battle blob: coverage of the scattered groups
  # must be deliberately driven, not emergent from stance-3 mass.
  # Four seed-driven spawn corners (round-robined by seed) so a single
  # memorised opening cannot generalise.
  actors:
  - type: 2tnk
    owner: agent
    position: [6, 6]
    stance: 3
    health: 100
    facing: -1
    count: 4
    spawn_point: 0
    randomize:
      position: {base: [6, 6], offset: 2}
  - type: jeep
    owner: agent
    position: [9, 8]
    stance: 3
    health: 100
    facing: -1
    count: 2
    spawn_point: 0
  - type: 2tnk
    owner: agent
    position: [122, 6]
    stance: 3
    health: 100
    facing: -1
    count: 4
    spawn_point: 1
    randomize:
      position: {base: [122, 6], offset: 2}
  - type: jeep
    owner: agent
    position: [119, 8]
    stance: 3
    health: 100
    facing: -1
    count: 2
    spawn_point: 1
  - type: 2tnk
    owner: agent
    position: [6, 33]
    stance: 3
    health: 100
    facing: -1
    count: 4
    spawn_point: 2
    randomize:
      position: {base: [6, 33], offset: 2}
  - type: jeep
    owner: agent
    position: [9, 31]
    stance: 3
    health: 100
    facing: -1
    count: 2
    spawn_point: 2
  - type: 2tnk
    owner: agent
    position: [122, 33]
    stance: 3
    health: 100
    facing: -1
    count: 4
    spawn_point: 3
    randomize:
      position: {base: [122, 33], offset: 2}
  - type: jeep
    owner: agent
    position: [119, 31]
    stance: 3
    health: 100
    facing: -1
    count: 2
    spawn_point: 3
  # Enemy: a zigzag chain of 11 light squads spanning the full 128x40
  # arena across THREE bands (north y=9, mid y=19, south y=31-32). A
  # straight east-only walk on any single row catches at most ~8 of 22
  # units (below the medium/hard kill bars); only a real spread across
  # north + mid + south clears the kill AND explore bars in time.
  # Stance:1 (ReturnFire) so they only engage attackers - the sweep
  # capability is enforced by the win condition, not enemy auto-aggro.
  - type: e1
    owner: enemy
    position: [22, 9]
    stance: 1
    health: 100
    facing: -1
    count: 2
    randomize:
      position: {base: [22, 9], offset: 2}
  - type: e1
    owner: enemy
    position: [50, 9]
    stance: 1
    health: 100
    facing: -1
    count: 2
    randomize:
      position: {base: [50, 9], offset: 2}
  - type: e1
    owner: enemy
    position: [78, 9]
    stance: 1
    health: 100
    facing: -1
    count: 2
    randomize:
      position: {base: [78, 9], offset: 2}
  - type: e1
    owner: enemy
    position: [106, 9]
    stance: 1
    health: 100
    facing: -1
    count: 2
    randomize:
      position: {base: [106, 9], offset: 2}
  - type: e1
    owner: enemy
    position: [38, 31]
    stance: 1
    health: 100
    facing: -1
    count: 2
    randomize:
      position: {base: [38, 31], offset: 2}
  - type: e1
