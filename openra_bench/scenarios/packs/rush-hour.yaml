levels:
  easy:
    description: "Rush Hour Sweep \u2014 easy difficulty (ported)."
    win_condition:
      all_of:
      - units_killed_gte: 3
      - within_ticks: 16000
  medium:
    description: "Rush Hour Sweep \u2014 medium difficulty (ported)."
    win_condition:
      all_of:
      - units_killed_gte: 6
      - within_ticks: 13000
  hard:
    description: >
      Rush Hour Sweep \u2014 hard. The agent force already round-robins
      between two base spawn_point groups by seed (start corner varies,
      anti-memorisation); hard adds a tight clock, an attrition cap,
      and a real loss on force destruction.
    win_condition:
      all_of:
      - units_killed_gte: 9
      - within_ticks: 10000
      - units_lost_lte: 3
    fail_condition:
      not: {own_units_gte: 1}
