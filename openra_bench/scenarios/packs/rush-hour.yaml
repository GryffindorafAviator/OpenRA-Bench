  title: Rush Hour Sweep
  capability: action
  real_world_meaning: "Sweep a contested arena and eliminate a dispersed enemy force:\
    \ multi-squad search-and-destroy under a clock \u2014 the real task is coordinated\
    \ coverage, not single-unit micro."
  robotics_analogue: Multi-robot patrol-and-clear of a bounded area within a time
    budget.
  author: ported-from-training
