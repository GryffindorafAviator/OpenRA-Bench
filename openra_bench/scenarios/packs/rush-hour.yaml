  tools:
  - move_units
  - attack_unit
  - attack_move
  - stop_units
  planning: true
  termination:
    max_ticks: 10000
    agent_units_killed: true
    enemy_units_killed: true
levels:
  easy:
    description: >
      Rush Hour Sweep - easy. Sweep the arena: spread your team across
      the scattered squads, reveal the map and destroy >=7 enemy units
      within the time budget, losing <=5 of your own. Sitting still,
      marching one straight line down a single row, or piling onto a
      single squad cannot reach the kill AND map-coverage bars in time
      - that is a loss, not a draw, and so is timing out or losing the
      team.
    win_condition:
      all_of:
      - units_killed_gte: 7
      - explored_pct_gte: 18
      - within_ticks: 3603
      - units_lost_lte: 5
    fail_condition:
      any_of:
      - not: {own_units_gte: 1}
      - not: {units_lost_lte: 5}
      - after_ticks: 3603
  medium:
    description: >
      Rush Hour Sweep - medium. Wider coverage and a tighter attrition
      cap: destroy >=9 enemy units and reveal >=28% of the arena
      before tick 3603, losing <=4. A single-row sweep tops out at 8
      kills - clearing both the north and south bands is required.
      Partial or passive sweep, timeout, force loss, or busting the
      attrition cap is a loss.
    win_condition:
      all_of:
      - units_killed_gte: 9
      - explored_pct_gte: 28
      - within_ticks: 3603
      - units_lost_lte: 4
    fail_condition:
      any_of:
      - not: {own_units_gte: 1}
      - not: {units_lost_lte: 4}
      - after_ticks: 3603
  hard:
    description: >
      Rush Hour Sweep - hard. The team round-robins between four base
      spawn corners by seed (start corner varies each run,
      anti-memorisation), and the objective is given by compass
      description, not coordinates: you must localise the scattered
      squads on the minimap yourself. Destroy >=10 enemy units and
      reveal >=32% of the arena before tick 3603, losing <=4. A
      single-row sweep cannot reach the kill bar; only a real spread
      across north, mid and south clears it. Partial sweep, timeout,
      force loss, or attrition bust is a loss.
    objective_coords: relative
    win_condition:
      all_of:
      - units_killed_gte: 10
      - explored_pct_gte: 32
      - within_ticks: 3603
      - units_lost_lte: 4
    fail_condition:
      any_of:
      - not: {own_units_gte: 1}
      - not: {units_lost_lte: 4}
      - after_ticks: 3603
