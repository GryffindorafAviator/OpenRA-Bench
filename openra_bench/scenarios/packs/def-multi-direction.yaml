# def-multi-direction.yaml
#
# REASONING capability — Wave-7 Group C DISTRIBUTED-DEFENSE seed.
# The construction yard sits in the MIDDLE of the arena and enemy
# bands close on it from MULTIPLE cardinal directions concurrently.
# The agent commands a central defender pool and must SPLIT it
# evenly across all open lanes — concentrating on any single lane
# leaves the others uncontested and those waves stride to the fact.
#
# Per-tier lane SCALE (the controlled variable):
#   * EASY  — TWO lanes (NORTH + SOUTH). Bare distributed-defence
#     skill: 4 tanks must split 2/2 between the two lane mouths.
#   * MEDIUM — THREE lanes (NORTH + SOUTH + EAST). 6 tanks split
#     2/2/2; an extra `units_lost_lte` cap punishes a sloppy
#     intercept that bleeds the line.
#   * HARD  — FOUR lanes (NW + NE + SW + SE — the four diagonal
#     corners). 8 tanks split 2/2/2/2 across the four corners,
#     AND the base latitude rotates by seed (NORTH base y=14 /
#     SOUTH base y=26 via two agent spawn_point groups), so a
#     memorised absolute-zone quad cannot generalise.
#
# Per-tier MAP (rebuilt by `openra_bench.mapgen` at compile time):
# every tier is a 128×40 `arena` with WATER obstacles painted to
# carve each lane's approach into a SEPARATE corridor — the lanes
# are physically distinct (a unit cannot cross between corridors
# en route, so concentration on one corridor really does leave the
# others uncontested). The base sits in the CENTRE column (x=64,
# y=20 on easy/medium; y in {14,26} per spawn on hard).
#
# Real-world anchors (binding meta.benchmark_anchor):
#   - Graph min-cut / multi-source attack: the optimal defence
#     allocates capacity to EVERY active cut, not the loudest one.
#     A concentrated defence at one cut leaves the others wide open.
#   - Distributed-systems load balancing: serving traffic across N
#     concurrent request streams requires AT LEAST one worker per
#     stream — pinning all workers to a single stream starves the
#     others (queue-builds, SLA breaches, eventual outage).
#   - Military multi-front doctrine: an army facing concurrent
#     advances on multiple axes MUST hold each axis (the canonical
#     "two-front war" failure mode is leaving one axis uncontested
#     and being enveloped). The same defensive capacity, distributed
#     across all active fronts, beats the same capacity concentrated
#     on the loudest one.
#   - Air-defence sector coverage: each sector needs its own SAM
#     battery; pooling all batteries in one sector means the other
#     sectors are wide open to attack.
#
# DISCRIMINATIONS (the bar — every lazy / wrong-commit play LOSES,
# only the intended even-split WINS):
#
#   - stall (only `observe`): the tanks idle at central staging at
#     stance:2 (Defend — auto-fire on an in-range enemy but never
#     advance). They sit ~8 cells from the nearest lane defensive
#     zone so the LANE `units_in_region_gte` clauses see ZERO tanks
#     in every lane zone. The two/three/four `hunt` bands close on
#     the central knot; the clustered tanks fire on whatever enters
#     weapon range but cannot occupy all lane zones at once, and
#     the unintercepted bands raze the fact → real LOSS on
#     `not has_building:fact` (the lane zone clauses also stay
#     empty).
#
#   - concentrate-on-one-lane (whole reserve sent to a single zone):
#     the one lane-zone clause is satisfied; the other lane zone
#     clauses are EMPTY (0 < 1) and fail the conjunction. Beyond
#     the predicate-level LOSS, the unopposed lanes' `hunt` bands
#     path straight to the fact and raze it → `not has_building:
#     fact` bites too. Real reachable LOSS.
#
#   - intended even-split (>=1 tank in EACH lane's defensive zone):
#     all lane zone clauses hold; each band is met and destroyed
#     by the pair the agent allocated to its lane (2tnk vs e1 is
#     ~1-shot dominance per CLAUDE.md / combat-focus-fire-
#     priority); the kill bar clears; fact intact → WIN.
#
# ENGINE FACTS used (CLAUDE.md / SCENARIO_QUALITY.md):
#   - `hunt` bot — each enemy unit attacks the NEAREST agent unit,
#     so a band placed in lane Y engages whatever defenders the
#     agent allocated to lane Y; the lanes are genuinely
#     independent threats. The distributed-defence test is enforced
#     both by the lane geometry AND by the per-lane
#     `units_in_region_gte` zone clauses (concentration satisfies
#     one and fails the rest). (`rusher` was used pre-engine-balance
#     pass — it pools all bands onto the agent centroid, collapsing
#     the lanes into a single fight; under the corrected stance
#     semantics that no longer exercises per-lane coverage.)
#   - Agent tanks are `stance:2` (Defend): they auto-fire on an
#     in-range enemy but NEVER advance — so a stall cluster cannot
#     self-deliver across the map, and the agent must actively
#     order each lane's pair to engage its band. (`stance:3`
#     AttackAnything was used pre-fix; under the corrected stance
#     semantics it auto-hunts the entire map, letting a stall
#     policy clear every band for free — the no-cheat bar broke.)
#   - Per-tier MAP via `openra_bench.mapgen.materialize`: an arena
#     128x40 with WATER obstacles painted as wall segments between
#     adjacent lane mouths so each enemy band's `hunt` path stays
#     in its own corridor. The base centre is open (defenders can
#     fan to any zone) but the obstacles prevent a unit from
#     sliding sideways between two lane corridors mid-approach.
#   - Enemy actors with NO spawn_point ALWAYS place regardless of
#     the agent's spawn group (CLAUDE.md). All lane bands always
#     materialise every seed — the "react to all lanes" capability
#     is enforced by every lane being active.
#   - Inert enemy `fact` marker far corner (anti-DRAW): without a
#     persistent enemy actor the engine auto-`done`s on enemy-elim
#     before the win/fail evaluator runs (CLAUDE.md footgun).
#   - `enemy_unit_spotted` interrupt → defenders re-decide the
#     instant any rusher band becomes visible.
#   - `own_unit_destroyed` interrupt → re-decide when a defender
#     falls (so a damaged lane can be reinforced from a quiet one).
#   - `units_in_region_gte: {x, y, radius, n}` — load-bearing
#     distribution clause: requires >=1 tank in EACH lane's zone
#     (n=1, not n=2 — the 2-per-lane doctrine remains the agent's
#     recommended allocation but the predicate floors at n=1 to
#     absorb the inevitable one-per-lane attrition from heavier
#     waves). A concentration in one zone fails the other zones.
#   - 2tnk vs e1 dominance per CLAUDE.md / combat-focus-fire-
#     priority. 2 tanks reliably clear a 2-3-rifle wave without
#     losing the lane.
#   - Tick budget: ~90 ticks/turn fixed-step, ~60 ticks/turn in
#     interrupt mode. max_turns 50 → reachable tick ~3000 in
#     interrupt mode and ~4503 fixed-step; `within_ticks: 2700`
#     and `after_ticks: 2701` are both reachable well inside
#     max_turns so stall hits the deadline as a real LOSS (not a
#     draw degeneracy).
#
# Validate (no model / no network):
#   python3 -m openra_bench.scenarios.validate \
#     openra_bench/scenarios/packs/def-multi-direction.yaml

meta:
  id: def-multi-direction
  title: 'Distributed Defense — Split Across Concurrent Lanes'
  capability: reasoning
  real_world_meaning: >
    Enemy waves attack the centrally-placed base concurrently from
    multiple cardinal directions. Distributing defenders evenly
    across each active lane holds every approach; concentrating on
    one lane leaves the other lanes uncontested — those waves
    stride untouched to the construction yard and raze it. This is
    the canonical multi-front / graph min-cut allocation problem:
    defensive capacity must be matched to the cardinality of
    concurrent threats, not to the loudest single threat.
  robotics_analogue: >
    Distributed-systems load balancing under N concurrent request
    streams: each stream needs at least one worker, or its queue
    builds without bound and the SLA breaks regardless of how well
    the other streams are served. Likewise air-defence sector
    coverage: pooling all batteries in one sector leaves the others
    open. Same total capacity, different topology, qualitatively
    different system survivability.
  benchmark_anchor:
    - "distributed-systems load balancing"
    - "graph min-cut"
    - "military multi-front"
  author: openra-bench

# Default base_map (overridden per tier with a tailored geometry).
base_map:
  generator: arena
  name: def-multi-direction-arena
  width: 128
  height: 40
starting_cash: 0

base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    # `hunt`: each enemy unit attacks the nearest agent unit, so
    # each band engages whichever defenders the agent placed in
    # that band's lane — the lanes are genuinely independent.
    # The DISTRIBUTED-DEFENCE discriminator is the per-lane
    # `units_in_region_gte` zone clauses in the win predicate:
    # tanks MUST be in EVERY lane's zone simultaneously, so a
    # concentration policy satisfies one zone and fails the rest.
    bot_type: hunt
  # Combat-only toolset (no build / no harvest): the test is
  # ALLOCATION of a fixed defender pool across concurrent threats,
  # not production.
  tools:
    - observe
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  # React the INSTANT a rusher band becomes visible or a defender
  # falls — the multi-lane allocation needs immediate re-decision
  # the moment the agent learns one lane is contested.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination:
    max_ticks: 6000
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare distributed-defense skill: TWO concurrent lanes (NORTH +
  # SOUTH), light waves (2 e1 per lane = 4 total). The base sits
  # in the centre (64,20) with 4 medium tanks staged adjacent. The
  # map has horizontal WATER walls at y=11..12 and y=28..29 that
  # block every column EXCEPT a 12-cell gap at x=58..69 — so the
  # NORTH band at (64,4) must funnel south through (64,12) (the N
  # defensive zone) and the SOUTH band at (64,36) must funnel
  # north through (64,28) (the S defensive zone). Defenders MUST
  # occupy BOTH lane zones (2 `units_in_region_gte` clauses,
  # n=1 each) or the unopposed lane's band walks to the fact.
  easy:
    description: >
      Yard at the centre (64,20); four medium tanks at central staging.
      Two concurrent rifle rushes are inbound — NORTH (spawn 64,4) and
      SOUTH (spawn 64,36). The map's east-west walls force each band
      through a single chokepoint per lane (N at 64,12 and S at 64,28).
      Split the tanks 2/2 between the two zones; concentration on one
      side leaves the other open. Three kills, two alive, yard intact,
      within about thirty turns.
    overrides:
      # Custom arena: horizontal walls (water bands at y=11..12 and
      # y=28..29) with a single central gap (x=58..69) per band.
      # The gap is the ONLY way for the N/S bands to reach the
      # central staging — the gap centre IS the defensive zone.
      base_map:
        generator: arena
        name: def-multi-direction-easy
        width: 128
        height: 40
        cordon: 2
        title: 'Multi-Direction Defense — 2 Lanes (N+S)'
        obstacles:
          # North wall (y=11..12), west half — blocks NW flanking.
          - {x: 4,  y: 11, w: 54, h: 2}
          # North wall (y=11..12), east half — blocks NE flanking.
          - {x: 70, y: 11, w: 55, h: 2}
          # South wall (y=28..29), west half — blocks SW flanking.
          - {x: 4,  y: 28, w: 54, h: 2}
          # South wall (y=28..29), east half — blocks SE flanking.
          - {x: 70, y: 28, w: 55, h: 2}
      actors:
        # Agent construction yard — CENTRE of the map (the rusher
        # target). Both lanes converge on (64,20).
        - {type: fact, owner: agent, position: [64, 20]}
        # 4x 2tnk defensive force staged adjacent to the fact.
        # stance:2 (Defend) — auto-fires on an in-range enemy but
        # never advances; the agent must actively split them N/S.
        - {type: 2tnk, owner: agent, position: [62, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [63, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [62, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [63, 20], stance: 2}
        # NORTH band at (64,4) — must funnel through (64,12) gap.
        - {type: e1, owner: enemy, position: [64,  4], stance: 3, count: 2}
        # SOUTH band at (64,36) — must funnel through (64,28) gap.
        - {type: e1, owner: enemy, position: [64, 36], stance: 3, count: 2}
        # Inert enemy `fact` marker far NE (anti-DRAW). Placed in
        # the walled-off NE quadrant so it never sits on a band's
        # approach line.
        - {type: fact, owner: enemy, position: [120, 4]}
    win_condition:
      all_of:
        # Kill bar (3 of 4 e1) is a soft floor — the load-bearing
        # discriminator is the TWO lane zone clauses below.
        - {units_killed_gte: 3}
        - {own_units_gte: 2}
        - {has_building: fact}
        # TWO lane defensive zones — each MUST hold >=1 tank.
        # Stall (everyone at centre y=20) leaves both zones empty
        # (distance 8 > radius 5); concentrate-N puts 4 in N but
        # 0 in S — S clause fails.
        - {units_in_region_gte: {x: 64, y: 12, radius: 5, n: 1}}
        - {units_in_region_gte: {x: 64, y: 28, radius: 5, n: 1}}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {has_building: fact}}
        - {not: {own_units_gte: 1}}
    max_turns: 50

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 lane vs easy: THREE concurrent lanes (NORTH + SOUTH + EAST)
  # with HEAVIER waves (3 e1 per lane = 9 total). Plus a LOSS CAP
  # (`units_lost_lte: 3`) — a sloppy intercept that bleeds more
  # than 3 defenders busts the cap. Map adds a vertical wall east
  # of the central staging with a single (108,18..22) gap that
  # channels the EAST band through (108,20) — the E defensive
  # zone. The 2/2/2 split across (64,12), (64,28), (108,20) wins;
  # concentration on any single zone fails the other two clauses.
  medium:
    description: >
      Same central yard with six tanks staging adjacent — but now THREE
      concurrent lanes converge (NORTH, SOUTH, and a third lane from the
      EAST). Each lane is heavier (nine rifles total). Walls funnel each
      band through one chokepoint per lane (N at 64,12; S at 64,28; E at
      108,20). Maintain the 2/2/2 split, hold the loss cap at three,
      kill six, keep three tanks alive and the yard standing, within
      about thirty turns.
    overrides:
      base_map:
        generator: arena
        name: def-multi-direction-medium
        width: 128
        height: 40
        cordon: 2
        title: 'Multi-Direction Defense — 3 Lanes (N+S+E)'
        obstacles:
          # North horizontal walls — gap x=58..69 for N lane.
          - {x: 4,   y: 11, w: 54, h: 2}
          - {x: 70,  y: 11, w: 35, h: 2}   # stops at x=104 so E lane is open
          # South horizontal walls — gap x=58..69 for S lane.
          - {x: 4,   y: 28, w: 54, h: 2}
          - {x: 70,  y: 28, w: 35, h: 2}
          # East vertical walls — gap y=18..22 for E lane (channels
          # E band at (124,20) through (108,20) into the centre).
          - {x: 106, y: 4,  w: 2, h: 14}
          - {x: 106, y: 23, w: 2, h: 15}
      actors:
        - {type: fact, owner: agent, position: [64, 20]}
        # 6x 2tnk central staging (2 cols x 3 rows around the fact).
        - {type: 2tnk, owner: agent, position: [62, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [63, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [62, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [63, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [62, 21], stance: 2}
        - {type: 2tnk, owner: agent, position: [63, 21], stance: 2}
        # Three concurrent rush bands — N at (64,4), S at (64,36),
        # E at (124,20). e1-only so 2 tanks per lane dominates the
        # engagement.
        - {type: e1, owner: enemy, position: [64,   4], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [64,  36], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [124, 20], stance: 3, count: 3}
        # Inert enemy `fact` marker far NE (anti-DRAW); inside the
        # walled-off NE quadrant.
        - {type: fact, owner: enemy, position: [120, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {own_units_gte: 3}
        - {units_lost_lte: 3}
        - {has_building: fact}
        - {units_in_region_gte: {x: 64,  y: 12, radius: 5, n: 1}}
        - {units_in_region_gte: {x: 64,  y: 28, radius: 5, n: 1}}
        - {units_in_region_gte: {x: 108, y: 20, radius: 5, n: 1}}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {has_building: fact}}
        - {not: {own_units_gte: 1}}
        - {not: {units_lost_lte: 3}}
    max_turns: 50

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 lane vs medium: FOUR concurrent lanes (NW + NE + SW + SE —
  # the four diagonal corners). PLUS the base latitude rotates by
  # seed via two agent spawn_point groups (NORTH base y=14 / SOUTH
  # base y=26), so the canonical four-zone quad shifts with the
  # base — a memorised absolute zone layout wins one seed and
  # loses the other. 8 tanks split 2/2/2/2 across the four
  # corners. Heavier waves (3 e1 per lane x 4 active lanes = 12
  # total) with the same loss cap (units_lost_lte:3) and clock.
  hard:
    description: >
      Your yard and eight tanks spawn in the NORTH (y=14) or SOUTH
      (y=26) band by seed. Four concurrent rush lanes hit the four
      diagonal corners (NW, NE, SW, SE). Split the defenders 2/2/2/2
      across the four forward zones at YOUR latitude; a memorised
      mid-map plan only wins one seed. Eight kills, three alive, loss
      cap three, yard intact, within about thirty turns.
    overrides:
      base_map:
        generator: arena
        name: def-multi-direction-hard
        width: 128
        height: 40
        cordon: 2
        title: 'Multi-Direction Defense — 4 Lanes (NW/NE/SW/SE)'
        obstacles:
          # Central column wall (x=63..64) separates W half from
          # E half EXCEPT at the two candidate base latitudes
          # (y=12..16 and y=24..28) where the base sits. This
          # forces the western bands to stay west of x=64 and the
          # eastern bands to stay east of x=64 — the four corner
          # lanes are physically distinct.
          - {x: 63, y: 4,  w: 2, h: 8}    # y=4..11 (above N base)
          - {x: 63, y: 17, w: 2, h: 6}    # y=17..22 (between bases)
          - {x: 63, y: 29, w: 2, h: 9}    # y=29..37 (below S base)
          # Central row wall (y=19..20) separates N half from S
          # half EXCEPT at the central x corridor (x=39..88)
          # where the bases sit. This puts the SW/SE bands south
          # of y=21 and the NW/NE bands north of y=19, ensuring
          # the corner lanes converge at distinct corners.
          - {x: 4,  y: 19, w: 35, h: 2}   # y=19..20 west half
          - {x: 89, y: 19, w: 35, h: 2}   # y=19..20 east half
      actors:
        # spawn_point 0 — NORTH base (y=14). Lane-zone latitudes
        # at y=8 (north pair) and y=20 (south pair).
        - {type: fact, owner: agent, position: [64, 14], spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [62, 13], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [63, 13], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [65, 13], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [62, 14], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [65, 14], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [62, 15], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [63, 15], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [65, 15], stance: 2, spawn_point: 0}
        # spawn_point 1 — SOUTH base (y=26). Lane-zone latitudes
        # at y=20 (north pair) and y=32 (south pair).
        - {type: fact, owner: agent, position: [64, 26], spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [62, 25], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [63, 25], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [65, 25], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [62, 26], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [65, 26], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [62, 27], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [63, 27], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [65, 27], stance: 2, spawn_point: 1}
        # Eight enemy bands — one per (candidate-base x corner)
        # combination. For spawn 0 (NORTH base y=14): the four
        # "active" lanes are NW (28,2), NE (100,2), SW (28,24),
        # SE (100,24). For spawn 1 (SOUTH base y=26): the four
        # "active" lanes are NW (28,16), NE (100,16), SW (28,38),
        # SE (100,38). Off-spawn bands path at the wrong-latitude
        # defenders and don't engage in time.
        - {type: e1, owner: enemy, position: [28,   2], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [100,  2], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [28,  16], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [100, 16], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [28,  24], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [100, 24], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [28,  38], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [100, 38], stance: 3, count: 3}
        # Inert enemy `fact` marker far east mid-latitude (anti-
        # DRAW). Placed at (120,20) — between the two candidate
        # base latitudes so it never sits on a band's approach.
        - {type: fact, owner: enemy, position: [120, 20]}
    # `any_of` across the two candidate four-zone layouts. Spawn 0
    # (NORTH base y=14) ⇒ zones at NW(36,8), NE(92,8), SW(36,20),
    # SE(92,20). Spawn 1 (SOUTH base y=26) ⇒ zones at NW(36,20),
    # NE(92,20), SW(36,32), SE(92,32). A model that always picks
    # the same four zones wins one seed and loses the other.
    win_condition:
      all_of:
        # Kill bar 8 of 24 e1 — the off-spawn four bands path at
        # the wrong-latitude defenders and may not engage in time;
        # the active four bands (~12 e1) carry the kill bar.
        - {units_killed_gte: 8}
        - {own_units_gte: 3}
        - {units_lost_lte: 3}
        - {has_building: fact}
        - {within_ticks: 2700}
        - any_of:
          - all_of:
            - {units_in_region_gte: {x: 36, y:  8, radius: 5, n: 1}}
            - {units_in_region_gte: {x: 92, y:  8, radius: 5, n: 1}}
            - {units_in_region_gte: {x: 36, y: 20, radius: 5, n: 1}}
            - {units_in_region_gte: {x: 92, y: 20, radius: 5, n: 1}}
          - all_of:
            - {units_in_region_gte: {x: 36, y: 20, radius: 5, n: 1}}
            - {units_in_region_gte: {x: 92, y: 20, radius: 5, n: 1}}
            - {units_in_region_gte: {x: 36, y: 32, radius: 5, n: 1}}
            - {units_in_region_gte: {x: 92, y: 32, radius: 5, n: 1}}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {has_building: fact}}
        - {not: {own_units_gte: 1}}
        - {not: {units_lost_lte: 3}}
    max_turns: 50
