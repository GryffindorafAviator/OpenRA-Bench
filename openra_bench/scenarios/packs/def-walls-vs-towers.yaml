# def-walls-vs-towers — Walls vs Towers (tier-differentiated doctrine)
#
# MAP-FIT DECISION (Wave-13 group C audit, 2026-05-24): NO MAP CHANGE.
# All three tiers already use bespoke 112x48 arenas (matching the
# easy-tier "fit" geometry the F1 audit asked for). The pack was
# tailored in commit b174a99 ("def-walls-vs-towers: tailor 112x48
# doctrine maps per tier"); the family3_defense.csv labels for the
# medium/hard tiers as "rush-hour-arena/large-trivial" are stale.
# Only the briefings are touched in this audit (no-solution-leak per
# F1 sect 9.5).
#
# REASONING focus: the agent must choose between PASSIVE OBSTACLE (brik
# concrete walls — 200cr, HP 40000, NO Armament) and ACTIVE TURRET (pbox
# pillbox — 600cr, M60mg burst — anti-infantry direct fire). The correct
# answer DIFFERS PER TIER, so a single memorised "always build towers"
# (or "always build walls") fails one of the tiers. Each tier's geometry
# and predicate make exactly one doctrine correct.
#
#   EASY    — frontal rush in the open. Walls kill nothing and the rush
#             walks around a thin barrier. ACTIVE pbox cluster wraps the
#             fact and shreds the wave. Win requires pbox count + kills.
#
#   MEDIUM  — a numerically overwhelming horde funnels at the fact on
#             one lane. The win predicate REQUIRES a wall belt PLUS a
#             pbox at the choke: a wall barrier funnels the horde to a
#             single-cell pass where a single pbox serially shreds the
#             queue. Pure-walls (0 kills) and pure-pbox (no brik) both
#             FAIL the predicate.
#
#   HARD    — mixed approach: a HEAVY infantry horde on the agent's
#             current lane AND a separate probe on the opposite lane.
#             The agent must allocate budget across BOTH postures:
#             wall+pbox choke for the horde, flanking pbox for the
#             probe. Predicate requires pbox count, brik count, AND a
#             kill quota. The fact also flips between two seed-driven
#             y-positions (hard-tier contract), so the build cannot be
#             memorised by coord.
#
# Real-world anchor:
#   • Doctrine selection — the SAME budget buys different defensive
#     postures (open-arc covering fires vs channelised killbox); only
#     the right posture for THIS geometry wins. A general who always
#     builds towers loses on the horde lane; a general who always
#     builds walls loses on the open arc.
#
# Engine facts (per CLAUDE.md):
#   • pbox = pillbox; cost 400; HP 40000; Allied; prereq tent. The
#     engine now assigns M60mg (damage 1000, burst 5, reload 30, range 4)
#     to garrison-only defenses with no explicit Armament (pinned by
#     tests/test_pbox_fires.py). A built pbox shoots — kills count
#     toward `units_killed_gte`.
#   • brik = concrete wall; cost 200; HP 40000; NO Armament — inert
#     obstacle that channels and delays a charge but produces zero
#     kill output.
#   • The rusher bot relentlessly charges the agent centroid (the fact)
#     so the scheduled wave converges on the protected asset whatever
#     defence is built in front of it. A wall in the path FORCES the
#     rusher to detour, channelising it through whatever gap is left.
#   • place_building works at any in-bounds cell (no adjacency check),
#     so the wall/pbox cluster can be assembled anywhere reachable.
#   • Each pack step ≈ 90 ticks. max_turns=60 ⇒ max reachable tick
#     93+90·59 = 5403; deadlines (within_ticks 5400, after_ticks 5401)
#     sit safely below ⇒ a non-finisher reaches a real LOSS rather
#     than draws.
#   • An unarmed enemy `fact` marker at the far east keeps the episode
#     alive past full wave elimination (engine auto-`done` mitigation).
#   • Hard tier defines TWO agent spawn_point groups (north y=14 /
#     south y=26) so the fact and the whole defence cluster flip by
#     seed, satisfying the hard-tier contract.

meta:
  id: def-walls-vs-towers
  title: 'Defense Doctrine — Walls vs Towers per Tier'
  capability: reasoning
  real_world_meaning: >
    Defensive doctrine selection: the same budget buys different
    postures. An open frontal arc needs ACTIVE covering fires (pillbox
    pillboxes). A numerically overwhelming horde on one lane needs
    PASSIVE channelisation (a brik wall barrier) plus a single pillbox
    at the choke to shred the queue. A mixed two-lane attack forces
    a TRADEOFF: choke one lane, cover the other. A memorised
    "always-towers" or "always-walls" play fails the tier where its
    posture is wrong.
  robotics_analogue: >
    Defensive doctrine: an open arc demands covering fires; a single
    overwhelming axis demands channelisation (obstacle belt + fires
    at the choke); a mixed threat demands force allocation across
    postures. The same budget produces wildly different outcomes
    depending on which doctrine matches the geometry — a general who
    always builds towers loses the horde lane and one who always
    builds walls loses the open arc.
  benchmark_anchor:
    - 'security architecture'
    - 'passive vs active mitigation'
    - 'military fortification'
  author: openra-bench

base_map:
  generator: arena
  name: def-walls-vs-towers-arena
  width: 128
  height: 40

base:
  agent: {faction: allies}
  enemy: {faction: soviet, bot_type: rusher}
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  # Static posture decision: the threat axis is known up-front (the
  # rusher always charges the fact). Disabling interrupts also makes
  # the tick budget deterministic (exactly 90 ticks/step ⇒ max_turns
  # is a hard tick budget the `after_ticks` fail clause bites in).
  interrupts: {}
  termination:
    max_ticks: 12000
  actors: []   # every level supplies its own actor list via overrides.

levels:
  # ── EASY ── frontal rush in the open. Budget 2400cr = 4 pbox
  # (4×600) OR 12 brik (12×200). The rush wave is 8×e1 on the lane,
  # injected at tick 1800 (after the intended 4-pbox build completes).
  # Win requires 4 pbox built AND ≥4 kills AND the fact alive. A
  # walls-only spend kills 0 → fails the kill clause → LOSS via
  # after_ticks. Pure-army and stall LOSE for the same reason.
  easy:
    description: >
      Commander, your Construction Yard sits at (10,20) with a
      Barracks and two Power Plants on a fully OPEN arena (no
      terrain channels). You have $2400 and the Defense queue (cost
      reference: pillbox 600cr active anti-infantry turret with
      M60mg burst, range 4 cells; concrete wall 200cr passive
      obstacle, HP 40000, no weapon). Eight riflemen will charge the
      yard from the east on a single open lane mid-episode. Win bar:
      four pillboxes BUILT, four kills, yard standing, within about
      sixty turns.
    starting_cash: 2400
    overrides:
      # 112×48 OPEN arena — frontal-rush geometry with NO walls. The
      # taller canvas (playable y=2..45) keeps the y=20 fact lane
      # well clear of the impassable cordon, and lets the SW corner
      # non-combatant park at y=42 — a more distant non-combatant
      # cell than rush-hour's 36 and well outside any pbox arc.
      base_map:
        generator: arena
        name: def-walls-vs-towers-easy-arena
        width: 112
        height: 48
        cordon: 2
        title: def-walls-vs-towers easy open-front 112x48
      actors:
        # Pre-placed agent base — fact + tent + 2×powr. NO combat
        # units near the base; pre-placed defenders would rack up
        # kills for free and let a walls-only spend pass the kill
        # clause off them. Two powr cover the 4-pbox power draw
        # (4×-20=-80; 2×powr=+200).
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: tent, owner: agent, position: [6,  18]}
        - {type: powr, owner: agent, position: [6,  22]}
        - {type: powr, owner: agent, position: [6,  16]}
        # ONE non-combatant agent e1 parked in the far SW corner,
        # well clear of the y=20 rush lane (zero kill contribution;
        # exists only so `units_summary` is non-empty for the
        # hard-tier env-reset check).
        - {type: e1,   owner: agent, position: [3, 42], stance: 2}
        # Unarmed high-HP marker (anti-DRAW): keeps the episode alive
        # past full rush elimination so the win/fail check fires.
        # x=108 inside the 112-wide playable area (was x=120 on the
        # rush-hour 128-wide canvas).
        - {type: fact, owner: enemy, position: [108, 20]}
      scheduled_events:
        - tick: 1800
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [60, 20], stance: 3, count: 8}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 4}}
        - {units_killed_gte: 4}
        - {building_count_gte: {type: fact, n: 1}}
        - {within_ticks: 5403}
    fail_condition:
      any_of:
        - {after_ticks: 5404}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60

  # ── MEDIUM ── numerically overwhelming horde. The walls+pbox CHOKE
  # is the correct doctrine. Budget 2400cr funds (1 pbox + 9 brik) =
  # 600 + 1800 = 2400 with cash to spare for any extra wall.
  #
  # Predicate doctrine — REQUIRE both wall belt AND pbox AND kills:
  #   building_count_gte:{pbox,1} ⇒ at least one active turret at
  #     the choke (kills come from here).
  #   building_count_gte:{brik,6} ⇒ a genuine wall belt (not 1-2
  #     incidental walls); the channelisation must be real.
  #   units_killed_gte:10 ⇒ the choke + pbox must actually kill
  #     half the horde; a single pbox at the choke serially kills
  #     queued e1 fast enough to clear this bar.
  #
  # This makes pure-pbox (no brik clause met → fail) and pure-walls
  # (0 kills → fail) both LOSE; only the wall+pbox combo wins.
  medium:
    description: >
      Commander, your Construction Yard sits at (10,20) with a
      Barracks and two Power Plants on a chokepoint-corridor arena
      (an impassable wall at x=55..65 with a 5-cell-wide horizontal
      passage at y=18..22 — the only westward route). You have $2400
      and the Defense queue (cost reference: pillbox 600cr active
      anti-infantry turret; concrete wall 200cr passive obstacle, HP
      40000, no weapon). A massive horde — sixteen riflemen plus four
      rocket soldiers — will charge from the east through the corridor
      toward the yard mid-episode. Win bar: at least one pillbox AND
      at least six walls BUILT, ten kills, yard standing, within
      about sixty turns.
    starting_cash: 2400
    overrides:
      # 112×48 chokepoint-arena — the LONG E-W approach corridor the
      # inventory recommends for the WORKS_BUT_BETTER defense bucket.
      # `pinch_x: 60` puts a vertical impassable wall at x=55..65 with
      # a 5-cell-wide horizontal corridor at y=18..22 (`corridor_y:
      # 20`, `corridor_width: 5`). The corridor is the ONLY westward
      # passage; the horde funnels through it toward the fact at
      # (10,20). The map geometry now physically REINFORCES the
      # walls-plus-pbox doctrine the predicate enforces — the brik
      # belt that channels the horde now ALSO buttresses the natural
      # corridor mouth, while a pure-pbox spend still fails the brik
      # count clause and a pure-walls spend still fails the kill
      # clause.
      base_map:
        generator: chokepoint-arena
        name: def-walls-vs-towers-medium-arena
        width: 112
        height: 48
        cordon: 2
        pinch_x: 60
        pinch_width: 10
        corridor_y: 20
        corridor_width: 5
        title: def-walls-vs-towers medium chokepoint-corridor 112x48
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: tent, owner: agent, position: [6,  18]}
        - {type: powr, owner: agent, position: [6,  22]}
        - {type: powr, owner: agent, position: [6,  16]}
        # Non-combatant SW corner — y=42 outside the corridor band,
        # west of the wall column (x=3, well clear of x=55..65 wall).
        - {type: e1,   owner: agent, position: [3, 42], stance: 2}
        # Anti-DRAW marker east of the wall on the corridor lane
        # (y=20 is passable east of the wall for x=66..109).
        - {type: fact, owner: enemy, position: [108, 20]}
      # Overwhelming horde — 16 e1 + 4 e3, staged east of the wall on
      # the corridor lane (y=20). The rusher concentrates on the
      # agent fact at (10,20), so the column funnels through the
      # corridor mouth (y=18..22 at x=55..65) on its way west.
      scheduled_events:
        - tick: 1800
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [70, 20], stance: 3, count: 16}
            - {type: e3, owner: enemy, position: [72, 20], stance: 3, count: 4}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 1}}
        - {building_count_gte: {type: brik, n: 6}}
        - {units_killed_gte: 10}
        - {building_count_gte: {type: fact, n: 1}}
        - {within_ticks: 5403}
    fail_condition:
      any_of:
        - {after_ticks: 5404}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60

  # ── HARD ── MIXED approach + seed-driven fact flip. The fact sits
  # at y=14 (NORTH) for some seeds and y=26 (SOUTH) for others — the
  # build cannot be memorised by coord. On EVERY seed two simultaneous
  # waves arrive: a HEAVY horde (10×e1 + 2×e3) on each lane. The rusher
  # converges on the agent centroid (the active fact's lane); the
  # off-lane wave still pours toward the centroid and a flanking pbox
  # is required to interdict it. Predicate requires pbox count + brik
  # count + a kill quota — solving only one lane fails the kill quota.
  # Budget 3000cr = 2 pbox (1200) + 9 brik (1800) — the minimum
  # walls-plus-towers spend that satisfies both lanes.
  hard:
    description: >
      Commander, your Construction Yard spawns at (10,14) NORTH or
      (10,26) SOUTH by seed, with a Barracks and two Power Plants on
      a fully OPEN arena (no terrain channels). You have $3000 and
      the Defense queue (cost reference: pillbox 600cr active anti-
      infantry turret; concrete wall 200cr passive obstacle, HP
      40000, no weapon). TWO simultaneous waves arrive from the east
      mid-episode: a HEAVY horde on the same latitude as your yard
      (twelve attackers) AND a separate heavy wave on the opposite
      latitude (twelve attackers) that will detour to your yard
      across the y=20 midline. Win bar: at least two pillboxes AND at
      least six walls BUILT, ten kills, yard standing, within about
      sixty turns.
    starting_cash: 3000
    overrides:
      # 112×48 OPEN arena — NO walls; the hard tier intentionally
      # uses an open canvas so a single-axis chokepoint cannot trap
      # one of the two waves while leaving the other untouched. Both
      # NORTH (y=14) and SOUTH (y=26) base latitudes sit safely
      # inside the playable y=2..45 frame, and the 16-cell margin
      # between each base and the impassable cordon leaves room for
      # the wall belt + pbox tradeoff on either lane without bumping
      # into the map edge.
      base_map:
        generator: arena
        name: def-walls-vs-towers-hard-arena
        width: 112
        height: 48
        cordon: 2
        title: def-walls-vs-towers hard two-lane 112x48
      actors:
        # spawn_point 0 — NORTH base. Fact at (10,14).
        - {type: fact, owner: agent, position: [10, 14], spawn_point: 0}
        - {type: tent, owner: agent, position: [6,  12], spawn_point: 0}
        - {type: powr, owner: agent, position: [6,  10], spawn_point: 0}
        - {type: powr, owner: agent, position: [6,  16], spawn_point: 0}
        - {type: e1,   owner: agent, position: [3, 42], stance: 2, spawn_point: 0}
        # spawn_point 1 — SOUTH base (mirror).
        - {type: fact, owner: agent, position: [10, 26], spawn_point: 1}
        - {type: tent, owner: agent, position: [6,  24], spawn_point: 1}
        - {type: powr, owner: agent, position: [6,  28], spawn_point: 1}
        - {type: powr, owner: agent, position: [6,  22], spawn_point: 1}
        - {type: e1,   owner: agent, position: [3,  4], stance: 2, spawn_point: 1}
        # Anti-DRAW marker on the symmetry axis (x=108 inside the
        # 112-wide playable area).
        - {type: fact, owner: enemy, position: [108, 20]}
      # Two simultaneous waves on BOTH lanes (the spawn_actors list is
      # not spawn_point-filtered, so both lanes always spawn). The
      # rusher converges on the agent centroid (the active fact's
      # lane); the off-lane wave is a LIGHT probe (4×e1) that a single
      # flanking pbox at the active-lane choke can mop up as it walks
      # past, while the heavy on-lane horde is shredded by the wall
      # belt + pbox choke. Heavy ON the active lane forces the wall
      # belt; light probe OFF the active lane is the "flank" budget
      # tradeoff the predicate enforces.
      scheduled_events:
        - tick: 1800
          type: spawn_actors
          actors:
            # NORTH-lane wave — HEAVY horde (12 attackers) plus a
            # LIGHT probe (4 e1). On a NORTH-base seed the heavy
            # horde is on-lane (channeled by the wall belt); on a
            # SOUTH-base seed the heavy north wave is off-lane and
            # detours through y=20 to reach the south fact, walking
            # past the choke on its way down.
            - {type: e1, owner: enemy, position: [60, 14], stance: 3, count: 10}
            - {type: e3, owner: enemy, position: [62, 14], stance: 3, count: 2}
            # SOUTH-lane wave — symmetric. Both waves always spawn;
            # whichever wave matches the active fact's latitude is
            # the "on-lane" horde the wall belt channels, the other
            # is the "off-lane" wave a 2nd pbox + the wall belt
            # together kill as they detour past.
            - {type: e1, owner: enemy, position: [60, 26], stance: 3, count: 10}
            - {type: e3, owner: enemy, position: [62, 26], stance: 3, count: 2}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 2}}
        - {building_count_gte: {type: brik, n: 6}}
        - {units_killed_gte: 10}
        - {building_count_gte: {type: fact, n: 1}}
        - {within_ticks: 5403}
    fail_condition:
      any_of:
        - {after_ticks: 5404}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60
