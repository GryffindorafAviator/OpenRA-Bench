# ECON-MINE-AND-GROW — placement of the first refinery is load-bearing.
#
# A new engine wave (the resource layer) lets a scenario declare ore
# patches directly via a top-level `ore_patches:` list, and an idle
# scenario-placed harvester now auto-routes to the nearest ore the
# moment the owner has a `proc`. This pack is the minimal worked
# example: agent has a Construction Yard, a power plant, and a
# harvester sitting idle. ONE near ore patch is visible from turn 1.
# The agent's task is to drop the refinery adjacent to the ore so
# the harv's round-trip is short enough to clear the cash bar.
#
# Win  (intended): place_building('proc') ADJACENT to the ore patch —
#       the harv auto-mines and cash grows past 3000 well before the
#       clock.
# Lose (stall):    no `proc` placed → harv stays idle (auto-route
#       requires a refinery) → no income → clock runs out.
# Lose (brute):    `proc` placed FAR from the ore patch → harv round-
#       trip is too long → income too slow → clock runs out.
#
# Engine facts used (verified against the wip-resource engine wave):
#
# 1. `ore_patches:` (NEW, top-level YAML). Each entry `{x, y, amount,
#    radius}` is materialised by the env at world-build time into a
#    disk of ore cells of density `clamp(amount / cells, 1, 12)`.
#    See `openra-sim/src/resource.rs::seed_ore_patch` +
#    `openra-data/src/oramap.rs::read_ore_patches`.
# 2. Scenario-placed `harv` actors now AUTO-ROUTE the moment their
#    owner has a `proc`. The per-tick `World::auto_route_idle_harvesters`
#    installs a `Harvest` activity on any owned, idle harvester whose
#    owner owns a refinery. No explicit `harvest`/`move_units` order
#    is required — placement of the `proc` IS the order.
# 3. Harvest income is strongly distance-dependent (the harvest FSM
#    walks the harv FindingOre → MovingToOre → Harvesting →
#    MovingToRefinery → Unloading; a far refinery makes
#    MovingToRefinery dominate the cycle).
# 4. `proc` requires `powr` (gamerules.rs). We pre-place `powr` so the
#    only build decision left is the refinery — the capability under
#    test is PLACEMENT, not the build chain.
# 5. `place_building` does not enforce build-adjacency, so a brute
#    "anywhere" placement is plausible — but it loses on throughput.
# 6. `cash_gte: 3000` reads `economy.cash` directly (after the per-tick
#    stored→cash drain converts deposited ore). The bar is reachable
#    only by deposits, not by starting cash (we set starting_cash
#    BELOW the bar).
# 7. Tick alignment: engine advances ~90 ticks per decision turn, so
#    `within_ticks ≤ 93 + 90·(max_turns − 1)` is required for the
#    clock to actually bite (CLAUDE.md). `max_turns: 40` →
#    ceiling 93 + 90·39 = 3603 > 3600 ✓.
# 8. The persistent unarmed enemy `fact` marker at the far edge keeps
#    the engine from auto-`done`-ing on "all enemies eliminated"
#    before the win/fail clause is evaluated (CLAUDE.md footgun).

meta:
  id: econ-mine-and-grow
  title: 'Econ Mine and Grow — Place the Refinery on the Ore Patch'
  capability: reasoning
  real_world_meaning: >
    Geographic placement of a processing facility relative to the raw
    resource. The agent owns a Construction Yard, a power plant, and
    an idle Ore Truck; ONE ore patch is visible on the map. The
    decision is where to drop the refinery — adjacent to the patch
    yields short round-trips and steady income; far from the patch
    starves throughput; not placing it at all leaves the harvester
    idle. The capability is reading the ore-cells map channel and
    siting infrastructure near the demand point.
  robotics_analogue: >
    Drop a processing depot at the well-head. An autonomous extraction
    operation arrives at a site with a collector vehicle and a budget
    for one processing module. Placing the module beside the resource
    yields cycle-time-bounded throughput; placing it across the
    facility yields throughput dominated by transit time; not placing
    it leaves the collector idle. The mission deadline is real.
  author: resource-wave
  benchmark_anchor:
    - "SC2LE CollectMineralsAndGas (placement variant)"
    - "facility-siting near a raw-resource node"
    - "RTS first-refinery-on-the-patch idiom"

base_map: rush-hour-arena
starting_cash: 2000

base:
  agent: {faction: allies}
  enemy: {faction: soviet, cash: 0}
  tools: [observe, build, place_building, move_units, stop]
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 8000}
  actors: []

# NEW: top-level ore_patches. Each materialises as a disk of ore on
# the terrain (independent of the actor list). Cells are surfaced in
# the observation as `ore_cells: [{cell_x, cell_y, amount}, ...]`.
# Levels can override via `overrides.ore_patches: [...]`.
ore_patches:
  - {x: 24, y: 20, amount: 2000, radius: 2}

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # One ore patch immediately east of the base. Generous clock,
  # generous bar. Intended: build proc, place at (21, 20) — adjacent
  # to the patch. Stall = no proc → no income. Brute = place at the
  # far west of the base (e.g. (10, 20)) → too slow.
  # max_turns 40 → ceiling 93 + 90·39 = 3603 > 3600 ✓.
  easy:
    description: >
      You have a Construction Yard ('fact'), a Power Plant ('powr'),
      and one Ore Truck ('harv'), and an ore patch is visible on the
      ore-cells channel centred at (24, 20). You have $2000. Build an
      Ore Refinery ('proc', cost 1400) and place it ADJACENT to the
      ore patch — the harvester auto-mines as soon as a refinery
      exists. Win = cash ≥ 3000 before tick 3600. Stalling leaves the
      harv idle (no income). Placing the refinery far from the patch
      (e.g. at your base) makes the round-trip too long and misses
      the bar.
    starting_cash: 2000
    overrides:
      actors:
        - {type: fact, owner: agent, position: [15, 20]}
        - {type: powr, owner: agent, position: [15, 18]}
        - {type: harv, owner: agent, position: [18, 20]}
        # Persistent far enemy marker — LOSS-not-DRAW guarantee.
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - has_building: proc
        - cash_gte: 3000
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
    max_turns: 40

  # ── MEDIUM ───────────────────────────────────────────────────────
  # Tighter bar (4000) on the same one-patch geometry. A NEAR-placed
  # proc still clears; a slightly-off placement (e.g. (19,20),
  # 5 cells from the patch) misses by a small margin.
  medium:
    description: >
      Same geography as easy (one ore patch at (24, 20)), tighter
      bar: cash ≥ 4000 before tick 3600. The harvester's round-trip
      time per bale dominates throughput, so the refinery's placement
      relative to the patch is the only decision that matters. Stall,
      far placement, or skipping the refinery all lose.
    starting_cash: 2000
    overrides:
      actors:
        - {type: fact, owner: agent, position: [15, 20]}
        - {type: powr, owner: agent, position: [15, 18]}
        - {type: harv, owner: agent, position: [18, 20]}
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - has_building: proc
        - cash_gte: 4000
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
    max_turns: 40

  # ── HARD ─────────────────────────────────────────────────────────
  # TWO ore patches — one near, one far. The model must pick the
  # nearer patch to site the refinery against. The agent base is
  # seed-rotated NORTH/SOUTH so a memorised opening fails. Higher
  # bar (5000) within the same clock.
  hard:
    description: >
      Your Construction Yard, Power Plant, and idle Ore Truck spawn
      in the NORTH or SOUTH half of the map depending on the seed.
      TWO ore patches are visible on the ore-cells channel — one
      near your spawn, one far across the map. Place the refinery
      adjacent to the NEAR patch and the harvester auto-mines a
      tight round-trip; place it on the far patch and the harv
      crosses the map per bale and you miss the bar. cash ≥ 5000
      before tick 3600.
    starting_cash: 2000
    overrides:
      actors:
        # spawn_point 0 — NORTH base (y=14). The near patch is the
        # NORTH patch at (24, 14); the SOUTH patch is the far one.
        - {type: fact, owner: agent, position: [15, 14], spawn_point: 0}
        - {type: powr, owner: agent, position: [15, 12], spawn_point: 0}
        - {type: harv, owner: agent, position: [18, 14], spawn_point: 0}
        # spawn_point 1 — SOUTH base (y=26). The near patch is the
        # SOUTH patch at (24, 26); the NORTH patch is the far one.
        - {type: fact, owner: agent, position: [15, 26], spawn_point: 1}
        - {type: powr, owner: agent, position: [15, 28], spawn_point: 1}
        - {type: harv, owner: agent, position: [18, 26], spawn_point: 1}
        # Persistent far enemy marker (shared across spawns).
        - {type: fact, owner: enemy, position: [120, 20]}
      ore_patches:
        - {x: 24, y: 14, amount: 2000, radius: 2}
        - {x: 24, y: 26, amount: 2000, radius: 2}
    win_condition:
      all_of:
        - has_building: proc
        - cash_gte: 5000
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
    max_turns: 40
