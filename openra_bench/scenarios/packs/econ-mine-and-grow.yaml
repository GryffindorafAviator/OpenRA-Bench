# ECON-MINE-AND-GROW — placement of the first refinery is load-bearing.
#
# A new engine wave (the resource layer) lets a scenario declare ore
# patches directly via a top-level `ore_patches:` list, and an idle
# scenario-placed harvester now auto-routes to the nearest ore the
# moment the owner has a `proc`. This pack is the minimal worked
# example: agent has a Construction Yard, a power plant, and a
# harvester sitting idle. ONE near ore patch is visible from turn 1.
# The agent's task is to drop the refinery adjacent to the ore so
# the harv's round-trip is short enough to clear the cash bar.
#
# Win  (intended): place_building('proc') ADJACENT to the ore patch —
#       the harv auto-mines and cash grows past 3000 well before the
#       clock.
# Lose (stall):    no `proc` placed → harv stays idle (auto-route
#       requires a refinery) → no income → clock runs out.
# Lose (brute):    `proc` placed FAR from the ore patch → harv round-
#       trip is too long → income too slow → clock runs out.
#
# Engine facts used (verified against the wip-resource engine wave):
#
# 1. `ore_patches:` (NEW, top-level YAML). Each entry `{x, y, amount,
#    radius}` is materialised by the env at world-build time into a
#    disk of ore cells of density `clamp(amount / cells, 1, 12)`.
#    See `openra-sim/src/resource.rs::seed_ore_patch` +
#    `openra-data/src/oramap.rs::read_ore_patches`.
# 2. Scenario-placed `harv` actors now AUTO-ROUTE the moment their
#    owner has a `proc`. The per-tick `World::auto_route_idle_harvesters`
#    installs a `Harvest` activity on any owned, idle harvester whose
#    owner owns a refinery. No explicit `harvest`/`move_units` order
#    is required — placement of the `proc` IS the order.
# 3. Harvest income is strongly distance-dependent (the harvest FSM
#    walks the harv FindingOre → MovingToOre → Harvesting →
#    MovingToRefinery → Unloading; a far refinery makes
#    MovingToRefinery dominate the cycle).
# 4. `proc` requires `powr` (gamerules.rs). We pre-place `powr` so the
#    only build decision left is the refinery — the capability under
#    test is PLACEMENT, not the build chain.
# 5. `place_building` does not enforce build-adjacency, so a brute
#    "anywhere" placement is plausible — but it loses on throughput.
# 6. `cash_gte: 3000` reads `economy.cash` directly (after the per-tick
#    stored→cash drain converts deposited ore). The bar is reachable
#    only by deposits, not by starting cash (we set starting_cash
#    BELOW the bar).
# 7. Tick alignment: engine advances ~90 ticks per decision turn, so
#    `within_ticks ≤ 93 + 90·(max_turns − 1)` is required for the
#    clock to actually bite (CLAUDE.md). `max_turns: 40` →
#    ceiling 93 + 90·39 = 3603 > 3600 ✓.
# 8. The persistent unarmed enemy `fact` marker at the far edge keeps
#    the engine from auto-`done`-ing on "all enemies eliminated"
#    before the win/fail clause is evaluated (CLAUDE.md footgun).
#
# MAP — per-scenario (replaces the generic rush-hour-arena, 2026-05).
# The capability under test is GEOGRAPHIC PLACEMENT of one building
# relative to ONE (or two) ore patches; nothing else on the map matters.
# A bespoke 96x40 open arena makes the near-vs-far throughput gap the
# only axis of variation:
#   * Width 96 (vs rush-hour-arena's 128) — the agent's base anchors at
#     x≈10 and the ore patch sits at x≈60, so a refinery placed AT the
#     base is ~47 cells from the patch but a refinery placed ADJACENT
#     to the patch is ~3 cells. The far/near throughput gap is the
#     entire test.
#   * Height 40 — leaves room for the hard tier's NORTH (y=12) / SOUTH
#     (y=28) spawn-point rotation while keeping the easy/medium row at
#     y=20 well clear of either spawn band (no actor overlap risk).
#   * Cordon 2 — the standard impassable frame; playable area is
#     (2..94, 2..38), and every authored cell sits inside it.
#   * Open (no obstacles / no water) — the harv path-length is
#     proportional to Chebyshev distance, so the cash-bar/clock
#     arithmetic is predictable. Obstacle bands would just inject
#     pathfinding noise without sharpening the placement axis.

meta:
  id: econ-mine-and-grow
  title: 'Econ Mine and Grow — Place the Refinery on the Ore Patch'
  capability: reasoning
  real_world_meaning: >
    Geographic placement of a processing facility relative to the raw
    resource. The agent owns a Construction Yard, a power plant, and
    an idle Ore Truck; ONE ore patch is visible on the map. The
    decision is where to drop the refinery — adjacent to the patch
    yields short round-trips and steady income; far from the patch
    starves throughput; not placing it at all leaves the harvester
    idle. The capability is reading the ore-cells map channel and
    siting infrastructure near the demand point.
  robotics_analogue: >
    Drop a processing depot at the well-head. An autonomous extraction
    operation arrives at a site with a collector vehicle and a budget
    for one processing module. Placing the module beside the resource
    yields cycle-time-bounded throughput; placing it across the
    facility yields throughput dominated by transit time; not placing
    it leaves the collector idle. The mission deadline is real.
  author: resource-wave
  benchmark_anchor:
    - "SC2LE CollectMineralsAndGas (placement variant)"
    - "facility-siting near a raw-resource node"
    - "RTS first-refinery-on-the-patch idiom"

# Per-scenario arena. Materialised once by `mapgen.materialize` into
# `data/maps/econ-mine-and-grow-arena.oramap`; the spec is content-
# addressed by name so the same byte-identical file is reused across
# runs. See the MAP block in the header comment for the design rationale.
base_map:
  generator: arena
  name: econ-mine-and-grow-arena
  width: 96
  height: 40
  cordon: 2
  title: Mine and Grow Arena 96x40
starting_cash: 2000

base:
  agent: {faction: allies}
  enemy: {faction: soviet, cash: 0}
  tools: [observe, build, place_building, move_units, stop]
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 8000}
  actors: []

# NEW: top-level ore_patches. Each materialises as a disk of ore on
# the terrain (independent of the actor list). Cells are surfaced in
# the observation as `ore_cells: [{cell_x, cell_y, amount}, ...]`.
# Levels can override via `overrides.ore_patches: [...]`.
# Pack-level default (used by easy + medium): one east-side patch at
# (60, 20), well clear of the agent's west-side base at x≈10.
# Sizing: amount=20000 with radius=4 yields a ~49-cell disk where the
# engine's `clamp(amount/cells, 1, 12)` saturates at 12 ore per cell
# (≈588 total harvestable ore). At ~25 cash per ore, that's a ceiling
# of ~14000 cash from one patch — enough headroom for the highest
# cash_gte: 5000 bar with margin. A radius=2 (13-cell) disk only
# produces ~156 ore (~3900 cash ceiling) which falls SHORT of the
# medium/hard bars even with a perfectly-placed refinery.
ore_patches:
  - {x: 60, y: 20, amount: 20000, radius: 4}

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # One ore patch east of the base on the central east-west axis.
  # Intended: build proc, place adjacent to the patch (e.g. (57, 20)).
  # Stall = no proc → no income. Brute = place at the base (e.g.
  # (14, 20), ~45 cells from the patch) → too slow.
  # max_turns 40 → ceiling 93 + 90·39 = 3603 > 3600 ✓.
  easy:
    description: >
      Commander, this is a refinery-placement drill. You hold a
      Construction Yard (fact), a Power Plant (powr) and one idle
      harvester (harv, an unarmed ore-collector truck), with $2000 in
      the bank. An ore patch is visible on the ore-cells channel east
      of base, centred near (60,20). Within about 40 turns, own an Ore
      Refinery and reach cash $3000. The harvester auto-mines as soon
      as a refinery exists.
    starting_cash: 2000
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: powr, owner: agent, position: [10, 18]}
        - {type: harv, owner: agent, position: [13, 20]}
        # Persistent far enemy marker — LOSS-not-DRAW guarantee.
        - {type: fact, owner: enemy, position: [90, 20]}
    win_condition:
      all_of:
        - has_building: proc
        - cash_gte: 3000
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
    max_turns: 40

  # ── MEDIUM ───────────────────────────────────────────────────────
  # Tighter bar (4000) on the same one-patch geometry. A NEAR-placed
  # proc still clears; a slightly-off placement (e.g. (30, 20),
  # halfway along the east-west axis) misses by a margin.
  medium:
    description: >
      Commander, this is a refinery-placement drill with a tighter
      bar. You hold a Construction Yard (fact), a Power Plant (powr)
      and one idle harvester (harv, an unarmed ore-collector truck),
      with $2000 in the bank. An ore patch is visible on the ore-cells
      channel east of base, centred near (60,20). Within about 40
      turns, own an Ore Refinery and reach cash $4000. The harvester
      auto-mines as soon as a refinery exists.
    starting_cash: 2000
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: powr, owner: agent, position: [10, 18]}
        - {type: harv, owner: agent, position: [13, 20]}
        - {type: fact, owner: enemy, position: [90, 20]}
    win_condition:
      all_of:
        - has_building: proc
        - cash_gte: 4000
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
    max_turns: 40

  # ── HARD ─────────────────────────────────────────────────────────
  # TWO ore patches — one near, one far. The model must pick the
  # nearer patch to site the refinery against. The agent base is
  # seed-rotated NORTH/SOUTH so a memorised opening fails. Higher
  # bar (5000) within the same clock.
  hard:
    description: >
      Commander, this is a refinery-placement drill with seed-rotated
      base latitude. You hold a Construction Yard (fact), a Power Plant
      (powr) and one idle harvester (harv, an unarmed ore-collector
      truck) at either the NORTH (y=12) or SOUTH (y=28) latitude, with
      $2000 in the bank. Two ore patches are visible — one near your
      spawn, one across the map on the opposite latitude. Within about
      40 turns, own an Ore Refinery and reach cash $5000.
    starting_cash: 2000
    overrides:
      actors:
        # spawn_point 0 — NORTH base (y=12). The near patch is the
        # NORTH patch at (60, 12); the SOUTH patch is the far one.
        - {type: fact, owner: agent, position: [10, 12], spawn_point: 0}
        - {type: powr, owner: agent, position: [10, 10], spawn_point: 0}
        - {type: harv, owner: agent, position: [13, 12], spawn_point: 0}
        # spawn_point 1 — SOUTH base (y=28). The near patch is the
        # SOUTH patch at (60, 28); the NORTH patch is the far one.
        - {type: fact, owner: agent, position: [10, 28], spawn_point: 1}
        - {type: powr, owner: agent, position: [10, 30], spawn_point: 1}
        - {type: harv, owner: agent, position: [13, 28], spawn_point: 1}
        # Persistent far enemy marker (shared across spawns).
        - {type: fact, owner: enemy, position: [90, 20]}
      ore_patches:
        - {x: 60, y: 12, amount: 20000, radius: 4}
        - {x: 60, y: 28, amount: 20000, radius: 4}
    win_condition:
      all_of:
        - has_building: proc
        - cash_gte: 5000
        - within_ticks: 3600
    fail_condition:
      any_of:
        - after_ticks: 3601
    max_turns: 40
