# combat-focus-fire-priority — Focus-fire the highest-DPS target FIRST.
#
# Real-world: SC2 focus-fire micro / military strike-package doctrine
# (hit the AA / anti-tank threat before the soft escort); MicroRTS
# target prioritization; RPS-counter unit prioritization.
#
# Discrimination (the four script-policy bar):
#   • stall (only observe): tanks idle west, never engage; kill bar
#     unmet → after_ticks LOSS.
#   • brute attack_move (attack-anything): all 4 tanks attack-move
#     east into the cluster; engine auto-targets the NEAREST hostile
#     (typically the closer e1s) so the e3 survives long enough to
#     pick off ≥2 tanks → busts units_lost_lte:1 → LOSS.
#   • spread-attack-e1-first: explicitly attack_unit one e1 at a time
#     with all tanks; the rocket soldier e3 keeps firing for ≥4
#     decision turns and kills ≥2 tanks → LOSS.
#   • intended focus-e3-first: attack_unit ALL 4 tanks onto the e3
#     FIRST (4-vs-1 concentrates ~400 HP of armour against ~50 HP of
#     infantry — e3 dies in 1-2 decision ticks before it can land
#     more than ~1 rocket); then mop up the e1s. ≤1 tank lost, kill
#     bar met → WIN.
#
# Why the spec works (verified against engine combat sheet):
#   • e3 = anti-tank rocket soldier (Dragon launcher, ~range 5, high
#     anti-armour DPS). One e3 can kill ≥1 2tnk in <600 ticks if left
#     alive; two e3 (hard) can kill ≥2 tanks together in the same
#     window — that is the "attrition cap busted" failure mode.
#   • e1 = basic rifle infantry. Per-shot damage vs 2tnk armour is
#     low; 3-4 e1 alone cannot bust units_lost_lte:1 inside the
#     budget if the e3 dies fast.
#   • 4× 2tnk concentrated fire on a single e3 kills it in 1-2
#     decision turns (each 2tnk shell roughly 1-shots an e3); the
#     same fire spread across 4 separate targets kills the e3 in 3-4
#     turns, giving it 200-300 ticks of free anti-tank shots.
#   • The spread vs focus delta is what discriminates the capability.
#
# Engine guardrails:
#   • Map: rush-hour-arena (128 × 40, playable x in [2..126],
#     y in [2..38]). Tanks stage at x=6, enemies at x=70-72.
#   • Far enemy `fact` at (120,20) prevents engine auto-done when the
#     last infantry falls (the kill bar is satisfied on units, not
#     buildings; the fact survives to keep the episode running until
#     the win/fail evaluator sees the terminal frame).
#   • after_ticks fail clauses are reachable within max_turns
#     (tick ≤ 93 + 90·(max_turns-1)); within_ticks 2700 < 2703 at
#     max_turns 30; staller hits after_ticks 2701 and LOSES, not draws.

meta:
  id: combat-focus-fire-priority
  title: 'Focus-Fire Priority — Kill the Anti-Tank Threat FIRST'
  capability: action
  real_world_meaning: >
    Four medium tanks face a small mixed enemy squad at close range:
    a single high-DPS rocket soldier (anti-vehicle) escorted by 2-3
    rifle infantry, all visible in the centre. The decision is target
    prioritization: concentrate ALL tanks' fire on the rocket soldier
    FIRST (4-vs-1 kills it in 1-2 decision turns before it can fire
    more than a couple of rockets), then mop up the infantry. Spreading
    fire across the squad — via attack_move auto-targeting or by
    starting on the closer rifle infantry — leaves the rocket soldier
    alive long enough to kill ≥2 tanks, busting the attrition cap.
    A brute attack-anything play LOSES; the focus-fire play WINS.
  robotics_analogue: >
    Military strike-package doctrine — when engaging a mixed enemy
    package, the high-value / high-DPS asset (AA battery, anti-armour
    weapon, command vehicle) is neutralised FIRST, even when it is
    not the nearest target. The lower-DPS escort is mopped up after.
    Target prioritization under fire is the controlled capability:
    nearest-first or auto-target spreads damage and lets the priority
    threat keep firing.
  benchmark_anchor:
    - "SC2 focus-fire micro"
    - "MicroRTS target prioritization"
    - "military strike-package: hit AA first"
    - "RPS-counter unit prioritization"
  author: openra-bench

base_map:
  generator: arena
  name: combat-focus-fire-priority-arena
  width: 128
  height: 40
starting_cash: 0

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: ''}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  # React the instant contact happens or a tank is lost — combat
  # micro is reactive; without these interrupts the focus-fire policy
  # only re-targets on the next turn boundary and the e3 gets free
  # shots in the gap.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 6000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare focus-fire skill: 4 tanks vs a STATIC squad of 4 e1 shield +
  # 3 e3 rocket soldiers, kill bar 7 (the whole squad), ZERO
  # attrition cap. The enemy squad is stance:2 (Defend — auto-fires
  # on the closest in-range tank but never advances), so the
  # formation holds as a static shield wall and the focus-fire
  # priority is a meaningful decision. The intended focus-e3-first
  # play kills all three rocket soldiers in the first 1-2 decision
  # turns (4-vs-1 concentrated cannon fire one-shots an e3) and
  # clears the squad losing zero tanks → WIN. A brute attack_move
  # spreads fire on the nearer e1 shield-line and a spread/e1-first
  # play kills the soft infantry first; either way a rocket soldier
  # survives long enough to land a tank kill, busting the ZERO cap →
  # LOSS. Stall never engages → kill bar unmet → after_ticks LOSS.
  #
  # Recalibrated after the engine movement fixes (moving units now
  # take fire en route and attack_unit closes at real speed): the
  # post-fix combat sheet means even ONE surviving rocket soldier
  # lands a tank kill during a spread mop-up, so the attrition cap
  # tightened from 1 to 0 — the focus-fire play is the ONLY play
  # that keeps all four tanks alive.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Four medium tanks stage at the west edge (x=6, y=18..21).
    # The centre enemy squad is a shield wall of FOUR rifle infantry
    # (e1) at x=70 backed by THREE rocket soldiers (e3, anti-tank,
    # Dragon launcher) in the rear at x=71. Focus-fire doctrine:
    # concentrate ALL FOUR tanks' fire on ONE rocket soldier first
    # (kill it in 1-2 decision turns), then the next, then the
    # third, then mop up the rifle infantry. Spreading fire across
    # the squad — via attack_move auto-targeting the nearer e1
    # shield-line, or by attacking rifle infantry first — leaves
    # the rocket soldiers firing through the whole engagement and
    # they score tank kills. Win when 7 enemy units are killed AND
    # ZERO tanks lost, before tick 2700.
    description: >
      Four medium tanks face a centre enemy squad: a rifle-infantry
      shield wall backed by THREE anti-tank rocket soldiers. Kill all
      seven enemies with ZERO tanks lost, within about 30 turns. The
      rocket soldiers are the priority threat.
    overrides:
      actors:
        # Strike force — 4 medium tanks at the west edge.
        - {type: 2tnk, owner: agent, position: [6, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 21], stance: 1}
        # Enemy squad — centre. Shield wall of FOUR rifle infantry
        # along x=70 (the nearer target ⇒ engine auto-target picks
        # them under attack_move) backed by THREE rocket soldiers in
        # the rear at x=71 (still inside Dragon range 5 of the front
        # line). All enemies stance:2 (Defend — auto-fire on the
        # closest in-range tank but never advance) so the formation
        # holds as a static shield wall: the focus-fire priority is
        # a real decision, not a melee.
        - {type: e1, owner: enemy, position: [70, 17], stance: 2}
        - {type: e1, owner: enemy, position: [70, 19], stance: 2}
        - {type: e1, owner: enemy, position: [70, 21], stance: 2}
        - {type: e1, owner: enemy, position: [70, 23], stance: 2}
        - {type: e3, owner: enemy, position: [71, 18], stance: 2}
        - {type: e3, owner: enemy, position: [71, 20], stance: 2}
        - {type: e3, owner: enemy, position: [71, 22], stance: 2}
        # Far persistent enemy marker — prevents engine auto-done
        # when the squad falls so the win/fail evaluator sees the
        # terminal frame (no DRAW collapse).
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 7}
        - {units_lost_lte: 0}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {units_lost_lte: 0}}
        - {not: {own_units_gte: 1}}
    max_turns: 30

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 axis: ZERO attrition cap (any tank loss = fail), bigger
  # squad (8 e1 shield + 2 e3 in the rear, kill bar 10) — a STATIC
  # stance:2 (Defend) formation that holds its shield wall and
  # auto-fires on in-range tanks without advancing. Brute attack-
  # move and spread-attack-e1-first both LOSE: the engine auto-
  # targets the e1 shield-line and the rocket soldiers fire through
  # the mop-up, scoring ≥1 tank kill. Intended focus-e3-first WINS —
  # concentrating all four tanks on each rocket soldier in turn ends
  # it in 1-2 decision ticks before it can land more than ~1 rocket,
  # keeping all four tanks alive.
  #
  # Recalibrated after the engine movement fixes: with moving tanks
  # now taking fire en route, a 64-cell blind march from x=6 spent
  # ~10 decision turns out of squad sight, so the focus-fire policy
  # could not even SEE the e3s until it was already inside Dragon
  # range — it lost a tank before landing a focused kill. Fix: stage
  # the strike force at x=60 (just outside Dragon range 5 of the
  # x=71 rocket rear-rank — a stalling force is never engaged, a
  # clean timeout LOSS) so the focus-fire policy spots the squad and
  # opens fire on the priority threat from turn 1; and drop the
  # rocket rear-rank from 3 to 2 (post-fix, 3 e3 out-damage a 4-tank
  # focus before it can clear them — the scenario became unwinnable
  # for the intended capability, defect class A4).
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Four medium tanks stage near the centre (x=60, y=18..21),
    # just outside the rocket soldiers' Dragon range. The centre
    # enemy squad is a shield wall of EIGHT rifle infantry (e1) at
    # x=70 backed by TWO rocket soldiers (e3, anti-tank, Dragon
    # launcher) in the rear at x=71. Focus-fire doctrine:
    # concentrate ALL FOUR tanks' fire on ONE rocket soldier first
    # (kill in 1-2 decision turns), then the second rocket soldier,
    # then mop up the rifle infantry. Spreading fire across the
    # squad — via attack_move auto-targeting the nearer e1 shield-
    # line, or by attacking rifle infantry first — leaves a rocket
    # soldier firing through the e1 mop-up and it scores a tank
    # kill. Win when 10 enemy units are killed AND ZERO tanks lost,
    # before tick 2700.
    description: >
      Four medium tanks face a larger centre squad: an eight-strong
      rifle-infantry shield wall backed by TWO anti-tank rocket
      soldiers. Kill all ten enemies with ZERO tanks lost, within
      about 45 turns. The rocket soldiers are the priority threat.
    overrides:
      actors:
        # Strike force staged at x=60 — one cell outside the x=71
        # rocket rear-rank's Dragon range 5 (reaches x=66), so a
        # stall policy is never engaged (clean timeout LOSS) and the
        # focus-fire policy can spot the squad and open fire from
        # turn 1 rather than marching in blind under fire.
        - {type: 2tnk, owner: agent, position: [60, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [60, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [60, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [60, 21], stance: 1}
        # Shield wall of EIGHT rifle infantry along x=70 (y=15..25)
        # — the engine auto-target picks the nearest hostile under
        # attack_move; this wide e1 line is what each of the four
        # tanks engages, soaking ~3-4 decision turns of cannon fire
        # before the brute reaches the rear ranks. All enemies
        # stance:2 (Defend — auto-fire on the closest in-range tank
        # but never advance) so the formation holds as a static
        # shield wall and the focus-fire priority is a real choice.
        - {type: e1, owner: enemy, position: [70, 15], stance: 2}
        - {type: e1, owner: enemy, position: [70, 17], stance: 2}
        - {type: e1, owner: enemy, position: [70, 18], stance: 2}
        - {type: e1, owner: enemy, position: [70, 19], stance: 2}
        - {type: e1, owner: enemy, position: [70, 21], stance: 2}
        - {type: e1, owner: enemy, position: [70, 22], stance: 2}
        - {type: e1, owner: enemy, position: [70, 23], stance: 2}
        - {type: e1, owner: enemy, position: [70, 25], stance: 2}
        # TWO rocket soldiers tucked tightly behind the shield wall
        # (x=71): close enough that tanks engaging the wall are also
        # inside Dragon range 5 of the e3s, so the rockets fire as
        # soon as a tank closes; not so close that they're the
        # nearest target (e1s at x=70 are 1 cell closer ⇒ engine
        # auto-target picks them under attack_move). With 2 e3s
        # firing through 3-4 decision turns of e1-mop-up, the brute
        # / e1-first policy takes ≥1 tank kill via rocket fire and
        # busts the attrition cap (units_lost_lte: 0).
        - {type: e3, owner: enemy, position: [71, 18], stance: 2}
        - {type: e3, owner: enemy, position: [71, 22], stance: 2}
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 10}
        - {units_lost_lte: 0}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {units_lost_lte: 0}}
        - {not: {own_units_gte: 1}}
    # 2026-05-24 audit (Qwen 9B v3 deep triage, S.1): medium runs in
    # interrupt mode (interrupts.enemy_unit_spotted +
    # own_unit_destroyed); under the per-event tick clamp the engine
    # advances 1-`max_ticks` ticks per turn rather than the
    # non-interrupt 30. With the prior max_turns 30 the final tick
    # landed ABOVE the within_ticks 2700 deadline but max_turns ran
    # out FIRST — so a near-win seed (kills=8, lost=0) could not
    # close inside the turn budget and the deadline never bit ⇒
    # DRAW. Bump max_turns 30 → 45 so the 2700-tick window is
    # reachable in interrupt mode (parallels the hard-tier bump from
    # 30 → 120 in the earlier B.1 fix); the after_ticks 2701 floor
    # still bites a real timeout LOSS for stall.
    max_turns: 45

  # ── HARD ─────────────────────────────────────────────────────────
  # +2 axes vs medium:
  #   1. Bigger squad — TWELVE rifle infantry shield + 2 rocket
  #      soldiers (kill bar 14), ZERO attrition cap. The focus-fire
  #      policy must take down each e3 cleanly before the next opens
  #      up; a survivor e3 firing through the e1 mop-up scores a
  #      tank kill.
  #   2. Strike force stages from TWO seed-driven spawn_point groups
  #      (north y=15..18 OR south y=22..25 corridor) so the
  #      engagement geometry varies per seed. The shield+rocket
  #      formation is COMPACT around y=20 and symmetric across it —
  #      either spawn corridor can reach the entire squad (no
  #      out-of-reach DRAW) and faces the same priority decision
  #      (focus one e3 → next e3 → mop up).
  #
  # Recalibrated after the engine movement fixes. The previous hard
  # was unwinnable for the intended capability on two counts: (a) a
  # 6-rocket rear-rank out-damages a 4-tank focus before it can be
  # cleared (defect class A4), and (b) the enemy squad spanned
  # y=14..26 while the strike force spawned in two far west-edge
  # corridors at y=10..13 / y=27..30, so a north-spawn force could
  # not reach the south enemies inside the budget — the residual
  # enemies caused a timeout DRAW (forbidden). Fix: drop the rocket
  # rear-rank to 2, stage the strike force at x=60 (just outside
  # Dragon range), and make the squad COMPACT (y=17..23) with both
  # spawn corridors immediately adjacent to it so every tank can
  # reach every enemy.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Four medium tanks stage at ONE of two centre corridors
    # (north y=15..18 OR south y=22..25, x=60, chosen by seed,
    # anti-memorisation). The compact centre enemy squad is a
    # shield wall of TWELVE rifle infantry (e1) at x=70..72 backed
    # by TWO rocket soldiers (e3, anti-tank, the priority threats)
    # in the rear at x=73. Focus-fire doctrine: concentrate ALL
    # FOUR tanks on ONE rocket soldier at a time — kill it cleanly,
    # then the next. Splitting fire, or starting on the rifle
    # infantry, leaves a rocket soldier firing through the whole
    # engagement and it scores a tank kill. Win when 14 enemy units
    # are killed AND ZERO tanks lost, before tick 2700.
    description: >
      Four medium tanks (north or south corridor, seed-chosen) face a
      compact centre squad: twelve rifle-infantry shield backed by TWO
      anti-tank rocket soldiers. Kill all fourteen enemies with ZERO
      tanks lost, within about 30 turns. Rockets are the priority threat.
    overrides:
      actors:
        # spawn_point 0 — NORTH staging corridor (y=15..18, x=60).
        # x=60 is one cell outside the x=73 rocket rear-rank's
        # Dragon range 5 (reaches x=68), so a stall policy is never
        # engaged → clean timeout LOSS.
        - {type: 2tnk, owner: agent, position: [60, 15], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [60, 16], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [60, 17], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [60, 18], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH staging corridor (y=22..25, x=60)
        - {type: 2tnk, owner: agent, position: [60, 22], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [60, 23], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [60, 24], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [60, 25], stance: 1, spawn_point: 1}
        # COMPACT THREE-COLUMN shield wall of TWELVE rifle infantry
        # spanning y=17..23 at x=70..72 (engine auto-target picks
        # the nearest hostile under attack_move ⇒ each of the 4
        # tanks chews through three e1 columns for 3-4 decision
        # turns before reaching the rear rank). The depth is what
        # makes the spread / e1-first policy run long enough that
        # the rear-rank rockets accumulate ≥1 tank kill of damage.
        # All enemies stance:2 (Defend — auto-fire on the closest
        # in-range tank but never advance) so the formation holds
        # as a static shield wall and the focus-fire priority is a
        # real decision. Compact around y=20 and symmetric across
        # it so either spawn corridor (north y=15..18 or south
        # y=22..25) can reach the WHOLE squad — no out-of-reach
        # timeout DRAW — and faces an equivalent priority decision.
        - {type: e1, owner: enemy, position: [70, 17], stance: 2}
        - {type: e1, owner: enemy, position: [70, 19], stance: 2}
        - {type: e1, owner: enemy, position: [70, 21], stance: 2}
        - {type: e1, owner: enemy, position: [70, 23], stance: 2}
        - {type: e1, owner: enemy, position: [71, 17], stance: 2}
        - {type: e1, owner: enemy, position: [71, 19], stance: 2}
        - {type: e1, owner: enemy, position: [71, 21], stance: 2}
        - {type: e1, owner: enemy, position: [71, 23], stance: 2}
        - {type: e1, owner: enemy, position: [72, 17], stance: 2}
        - {type: e1, owner: enemy, position: [72, 19], stance: 2}
        - {type: e1, owner: enemy, position: [72, 21], stance: 2}
        - {type: e1, owner: enemy, position: [72, 23], stance: 2}
        # TWO rocket soldiers in the back rank (x=73): inside Dragon
        # range 5 of any tank at x=68 or further east; the e1 wall
        # keeps tanks at the western edge of the formation for 3-4
        # turns, during which both e3s fire rockets. Symmetric
        # across y=20 so either spawn faces an equivalent focus-fire
        # decision.
        - {type: e3, owner: enemy, position: [73, 18], stance: 2}
        - {type: e3, owner: enemy, position: [73, 22], stance: 2}
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 14}
        # 2026-05-23 audit: hard attrition cap loosened 0 → 1.
        # The hard arena is tight; the lead tank takes one Dragon
        # shot during its approach before the focus-fire policy can
        # drop the first e3. The 0-cap was infeasible. Brute
        # attack_move still LOSES (spreads fire ⇒ ≥2 tank kills);
        # spread-attack-e1-first still LOSES (same).
        - {units_lost_lte: 1}
        - {within_ticks: 2700}
    fail_condition:
      any_of:
        - {after_ticks: 2701}
        - {not: {units_lost_lte: 1}}
        - {not: {own_units_gte: 1}}
    # 2026-05-23 audit (Qwen-9B deep-dive, B.1): hard runs in interrupt
    # mode (interrupts.enemy_unit_spotted + own_unit_destroyed), under
    # which the engine advances 1-`max_ticks` ticks per turn (variable;
    # typical 5) rather than the non-interrupt 30. With max_turns 30 the
    # final tick lands at ~2073-2358 — BELOW the within_ticks 2700
    # deadline — so a near-win (seed 4: 13/14 killed, 0 lost) cannot
    # close inside the budget and the deadline never bites ⇒ DRAW.
    # Bump max_turns 30 → 120 so the 2700-tick window is reachable in
    # interrupt mode; the after_ticks 2701 floor still bites a real
    # timeout LOSS for stall and the within_ticks 2700 cap still gates
    # the win.
    max_turns: 120
