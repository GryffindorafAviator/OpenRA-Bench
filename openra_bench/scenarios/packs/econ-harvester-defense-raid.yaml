# econ-harvester-defense-raid — keep the harv ALIVE under live raider waves.
#
# ACTION capability — live-economy defense under harvester harass.
# Differs from `econ-protect-harvester-route` (which tests CONVOY
# ESCORT across a long commute) and `mid-economy-under-fire` (which
# rings the patch with auto-firing tanks at base-sight): THIS pack
# tests STANCE management on the escort. The escort is pre-placed
# at the proc on stance:0 (HoldFire) — even with PERFECT positioning,
# a "place defenders and observe" policy LOSES because stance:0 units
# never auto-engage, so the raider chews through the harv unopposed.
# The load-bearing verb is `set_stance(escort, 2 or 3)` + escort
# movement onto the harv's lane.
#
# MAP — econ-harvester-defense-raid-arena (96×40 chokepoint-arena)
# ----------------------------------------------------------------
# Per-scenario map (replaces the generic rush-hour-arena). A single
# vertical water wall at x=46..54 with one open corridor at y=18..21
# splits the playable area into a WEST lobe (the agent's base + the
# harv + the off-axis ore patch) and an EAST lobe (the raider spawn
# axis + the persistent far-east enemy fact). The corridor at
# y=18..21 is the ONE lane any raid wave must use to cross from the
# east into the west lobe — there is no other route around the wall.
#
# The ore patch sits OFF-AXIS from the agent base (easy/medium: base
# at y=10..14, patch at y=28; hard NORTH: base at y=8, patch at
# y=12; hard SOUTH: base at y=32, patch at y=28). Off-axis means the
# harv commutes between proc and mine on a y-band that is NOT the
# raid corridor's y-band — so the agent can read the raid vector
# (the single corridor mouth at the west wall, x≈44..46, y=18..21)
# INDEPENDENTLY of where its own harv currently is, and plant the
# defense on that one lane.
#
# This is what the scenario MEASURES: reading the raid vector from
# the map geometry (one corridor, one mouth) and positioning the
# escort there — not spamming defense everywhere or following the
# harv around. set_stance + escort movement onto the corridor mouth
# is the load-bearing capability the chokepoint exposes.
#
# DESIGN
# ------
# Agent has fact + powr + proc + 1× harv + ONE NEAR ore patch (mine
# OFF-AXIS from the base). The proc seeds the harv's auto-harvest
# loop (per world.rs::auto_route_idle_harvesters — a scenario-placed
# idle harv auto-routes once its owner owns a refinery), so the harv
# cycles proc ↔ mine WITHOUT an explicit harvest order. Income is
# steady AS LONG AS THE HARV LIVES.
#
# Threat: enemy `bot_type: raider` (openra-sim/src/scripted_bot.rs:
# ScriptedBehavior::Raider) — its tick() picks the agent's harv
# specifically via `harv_foes()` and issues an Attack on the nearest
# one every 12 ticks (the raider interval). New units added to the
# raider's roster (via scheduled_events::spawn_actors) are picked up
# on the next own_mobile() scan, so SCHEDULED raid waves all chase
# the harv. Because the wall blocks every other east→west route,
# each spawned raider MUST enter the west lobe through the single
# corridor at (~50, 18..21).
#
# Wave schedule (scheduled_events: spawn_actors):
#   easy:   1 wave  — 1× 2tnk at tick 600   from (75,20)
#   medium: 2 waves — 1× 2tnk at tick 600, 1× 2tnk at tick 1500 — both at (75,20)
#   hard:   3 waves on the central east corridor — see hard tier comment
#
# Escort: 2× 2tnk at base, stance:0 (HoldFire). The escort SITS at
# the proc; even when a raider walks into its weapon range the
# stance:0 units do not fire (verified per CLAUDE.md stance fix:
# stance:0 never auto-engages, even when shot at, even when an enemy
# is sitting on top of them). The agent must EITHER:
#   (a) `set_stance(escort, 3)` and move them onto the corridor
#       mouth — Hunt: idle escort actively advances on visible
#       enemies (raider walks into LOS as it exits the corridor,
#       escort engages); OR
#   (b) `set_stance(escort, 2)` AND `attack_move(escort, corridor
#       mouth)` — Defend stance auto-fires on whatever enters weapon
#       range, so move the escort EAST onto the west mouth of the
#       corridor (x≈44..46, y=18..21) to INTERCEPT the raid wave; OR
#   (c) `attack_unit(escort, raider_id)` — explicit order overrides
#       stance:0, escort closes and kills the raider.
# Any of (a), (b), (c) clears the bar. The capability is "flip the
# escort from passive to active AND plant it on the corridor mouth"
# — same verb as combat-tanya-vs-rush plus a positioning read.
#
# THE NO-CHEAT BAR (every lazy / stall / wrong-shape policy LOSES on
# every level and every hard seed; the intended capability WINS):
#
#   • stall (only observe): escort stays stance:0 at base, never
#     engages. Raider wave 1 traverses the corridor, detours to the
#     active harv latitude and kills it. unit_type_count_gte:
#     {harv,1} fails → fail_condition fires → LOSS.
#
#   • defensive-but-passive (place / re-issue HoldFire on escort,
#     observe): identical outcome — the escort is structurally
#     incapable of engaging. Harv dies → LOSS.
#
#   • spam-defense-everywhere (escort split across the base
#     perimeter, neither piece on the corridor mouth): the raider
#     walks straight through the corridor on the same lane every
#     wave; whichever escort piece is on the wrong band never
#     contributes. On medium/hard the second/third wave finishes
#     the harv → LOSS.
#
#   • intended (set_stance(escort, 2 or 3) and/or attack_move escort
#     onto the corridor mouth ~x=44..46, y=18..21): the wall geometry
#     forces every raider through the escort's fire envelope on its
#     approach, escort kills each raid wave before contact with the
#     harv, harv survives, auto-route loop continues, cash bar
#     clears → WIN.
#
# ENGINE FACTS (CLAUDE.md):
#   - Tick budget ~90/turn. easy max_turns=35 ⇒ ceiling 93+90·34=3153;
#     within_ticks:3000, after_ticks:3001 both bite. medium=45 ⇒
#     ceiling 4053; within_ticks:3900, after_ticks:3901. hard=50 ⇒
#     ceiling 4503; within_ticks:4300, after_ticks:4301.
#   - `auto_route_idle_harvesters` auto-installs a Harvest activity
#     on any owned idle harv whose owner owns a proc — no explicit
#     harvest order needed. The harvest tool is provided so the
#     agent CAN re-issue if needed, but is not strictly required.
#   - `bot_type: raider` issues an Attack on the nearest agent harv
#     every 12 ticks; new bot units added mid-episode (via
#     scheduled_events::spawn_actors) join the bot's tick loop.
#   - stance:0 (HoldFire) per CLAUDE.md never auto-engages — the
#     "defensive but passive" failure mode is structurally enforced
#     by the pre-placed stance.
#   - stance:2/3 (Defend / AttackAnything) per CLAUDE.md: stance:2
#     auto-fires on in-range enemies but does not advance; stance:3
#     additionally advances on visible enemies. Either is a valid
#     intended path; the load-bearing verb is the stance flip OR
#     an explicit attack order (which overrides stance per the
#     CLAUDE.md stance fix).
#   - Persistent far enemy `fact` at (90,20) in the EAST lobe —
#     anti-DRAW per CLAUDE.md (engine auto-`done`s on enemy-elim
#     before win/fail evaluates; the inert far marker keeps the
#     episode alive past the raider being destroyed). The wall
#     prevents agent units from reaching it without crossing the
#     corridor, so an intended-defense play does not incidentally
#     destroy the marker.
#   - `unit_type_count_gte: {harv, 1}` in fail_condition is the
#     hard harv-survival predicate — the moment the harv dies the
#     fail clause fires and the LOSS is immediate.
#   - hard tier uses TWO seed-driven AGENT spawn_point groups (base
#     latitude NORTH y=8 vs SOUTH y=32). Each group has its own
#     fact/powr/proc/harv/escort + mine on its own y-band. The
#     load-bearing decision is the same (flip + position escort on
#     the corridor mouth) but the LATITUDE of the base varies per
#     seed, so a memorised opening from the wrong latitude leaves
#     the harv unprotected. This satisfies the ≥2-distinct-seed-
#     driven-spawn-groups hard-tier requirement (CLAUDE.md §7).
#
# Validate (no model / no network):
#   python3 -m openra_bench.scenarios.validate \
#     openra_bench/scenarios/packs/econ-harvester-defense-raid.yaml

meta:
  id: econ-harvester-defense-raid
  title: 'Econ Harvester Defense — Keep the Harv Alive Under Raid Waves'
  capability: action
  real_world_meaning: >
    A live extraction operation under recurring asset-targeted
    harass. The agent owns a refinery, a single harvester running an
    auto-harvest loop on a nearby ore patch, and a small escort
    parked at the depot on hold-fire. The harvester's income is the
    sole revenue stream, and a recurring raider drives at the
    harvester specifically (not the base, not the escort). The
    decision is to FLIP the escort from passive to active — set its
    stance to defend / attack-anything, or order it onto the
    harvester's lane to intercept — so the raider dies on the
    escort's fire envelope before reaching the harvester. The map
    geometry funnels every raider through a single corridor mouth,
    so the right place to plant the escort is unambiguous if the
    agent reads the map. Stalling, leaving the escort on hold-fire,
    or spreading defense everywhere instead of on the corridor mouth
    all let the harvester die.
  robotics_analogue: >
    Mining-fleet protection under recurring asset-targeted attack —
    an autonomous extraction site with an extractor robot, a
    processing depot, and a static defense detail. If the defense
    detail is in safe-mode (hold fire) the recurring attacker
    destroys the extractor on the first cycle; the operator must
    flip the detail to engage and reposition it onto the single
    access route the attacker must use.
  benchmark_anchor:
    - "SC2 harvester harass defense (Lambo, Reaper drops on workers)"
    - "convoy / extractor protection under recurring harass"
    - "RTS stance management — flip escort from passive to active"
    - "SOC active-vs-passive monitoring posture"
    - "chokepoint defense — plant the line on the one route"
  author: openra-bench

# Per-scenario map: chokepoint-arena 96×40 with a vertical water wall
# at x=46..54 broken by a single 4-cell corridor at y=18..21. The
# corridor is the ONE lane any raider must use to cross from the east
# raid-spawn lobe into the west base/patch lobe. Top-level base_map
# is the readable slug; each level's overrides: re-declares the full
# generator spec so materialize() builds the .oramap deterministically.
base_map: econ-harvester-defense-raid-arena
starting_cash: 0  # ALL income via harv survival; bar measures live throughput.

base:
  agent: {faction: allies, cash: 0}
  # Enemy bot is `raider` — scripted_bot.rs ScriptedBehavior::Raider
  # targets the agent's harv specifically via harv_foes(); new
  # actors added via scheduled_events::spawn_actors are picked up
  # by own_mobile() on the next tick, so every raid wave chases the
  # harv.
  enemy: {faction: soviet, cash: 0, bot_type: raider}
  # Toolset: harvest is provided (the harv auto-routes from t=0 once
  # the proc exists, but the agent can re-issue if needed);
  # set_stance is the load-bearing verb; attack_unit / attack_move
  # are valid alternates (explicit orders override stance:0).
  tools: [observe, harvest, move_units, attack_unit, attack_move, set_stance, stop]
  planning: true
  # Interrupts left disabled — per econ-protect-harvester-route, the
  # per-turn tick rate would collapse on enemy_unit_spotted under
  # recurring raid waves and the cash bar wouldn't be reachable.
  interrupts: {}
  termination: {max_ticks: 6000}
  actors: []  # every level supplies its own actor list via overrides.

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare skill: ONE raid wave (1× 2tnk) at tick 600 from (75,20) in
  # the EAST lobe. Harv cycles proc(10,12)↔mine(30,28) on auto-route
  # entirely inside the WEST lobe. Escort: 2× 2tnk at base stance:0.
  # Stall / passive: raider crosses the corridor (only route), detours
  # south to the harv on its commute and kills it → LOSS. Intended:
  # set_stance(escort, 2 or 3) and/or attack_move escort east to the
  # west corridor mouth (~x=44..46, y=18..21); escort engages every
  # raider on exit from the corridor, harv survives, cash accumulates.
  # Bar: cash >= 1200 before tick 3000.
  # max_turns 35 ⇒ ceiling 93+90·34=3153 > 3001 ✓.
  easy:
    description: >
      Commander, this is a harvester-defense drill. You hold a
      Construction Yard (fact), Power Plant (powr) and Ore Refinery
      (proc) in the north-west corner, one harvester (harv, an unarmed
      ore-collector truck) auto-cycling to an off-axis ore patch at
      (30,28), and two medium tanks (2tnk) parked at the refinery on
      HOLD-FIRE stance. A vertical water wall at x=46..54 splits the
      map; the only crossing is a 4-cell corridor at y=18..21. At tick
      600 an enemy heavy tank spawns at (75,20) and drives for your
      harvester through that corridor. Within about 35 turns, finish
      with cash at least $1200 and keep your harvester and refinery
      alive. Flip your escort to Defend or AttackAnything stance and
      move them onto the corridor mouth (about x=44..46, y=18..21) so
      the raider dies on approach.
    starting_cash: 0
    overrides:
      base_map:
        generator: chokepoint-arena
        name: econ-harvester-defense-raid-arena
        width: 96
        height: 40
        cordon: 2
        pinch_x: 50
        pinch_width: 8
        corridor_width: 4
        corridor_y: 20
      actors:
        # Agent base — NW corner; fact + powr seed the construction
        # & power; proc seeds the harv auto-harvest loop.
        - {type: fact, owner: agent, position: [8, 10]}
        - {type: powr, owner: agent, position: [8, 8]}
        - {type: proc, owner: agent, position: [10, 12]}
        # Single harv — pre-placed adjacent to proc. With proc on the
        # field, world.rs::auto_route_idle_harvesters installs a
        # Harvest activity on the next tick; harv cycles proc<->mine.
        - {type: harv, owner: agent, position: [12, 12]}
        # Escort: 2× 2tnk at the proc on stance:0 (HoldFire). The
        # capability under test is "flip the escort active AND
        # position it on the corridor mouth" — stance:0 never auto-
        # engages, and a "place defenders at base and observe"
        # policy LOSES because the corridor is too far east for
        # base-bound defenders to fire on.
        - {type: 2tnk, owner: agent, position: [14, 12], stance: 0}
        - {type: 2tnk, owner: agent, position: [14, 14], stance: 0}
        # OFF-AXIS ore patch — south of base; the harv's auto-route
        # target. Diagonal commute proc(10,12)↔mine(30,28) stays
        # entirely in the WEST lobe (x<46), so the harv never
        # touches the corridor.
        - {type: mine, owner: neutral, position: [30, 28]}
        # Persistent far enemy fact — east lobe, anti-DRAW (engine
        # auto-done mitigation). Behind the wall and reachable only
        # via the corridor, so an intended defense play does not
        # incidentally destroy the marker.
        - {type: fact, owner: enemy, position: [90, 20]}
      scheduled_events:
        # Single raid wave at tick 600 — one 2tnk spawned in the
        # east lobe. The raider bot's harv_foes() picks the agent's
        # harv; the wall forces the approach through the corridor.
        - tick: 600
          type: spawn_actors
          actors:
            - {type: 2tnk, owner: enemy, position: [75, 20]}
    win_condition:
      # Ordered `then:` enforces "harv must SURVIVE past the raid
      # window and THEN keep refining to the bar" — clause 1
      # (after_ticks: 1700) latches only past wave 1's typical
      # kill-window. A stall run loses its harv well before clause 1
      # latches; the `unit_type_count_gte:{harv,1}` clause has
      # already failed → fail_condition fires first. The intended
      # escort engagement at the corridor mouth kills each raider,
      # harv keeps cycling, cash crosses 1200 well after tick 1700,
      # all_of latches → WIN.
      all_of:
        - then:
            id: econ-harvester-defense-raid-easy
            clauses:
              - {after_ticks: 1700}
              - {cash_gte: 1200}
        - {unit_type_count_gte: {type: harv, n: 1}}
        - {has_building: proc}
        - {within_ticks: 3000}
    fail_condition:
      any_of:
        - {after_ticks: 3001}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
        - {not: {has_building: proc}}
    max_turns: 35

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: TWO raid waves (tick 600, tick 1500) and
  # a tighter bar (cash >= 2200 ≈ 5..6 refines). A one-time "kill the
  # first raider" play has to ALSO hold the corridor against the
  # second wave — the escort must be RETURNED to (or kept on) the
  # corridor mouth (or kept on AttackAnything stance:3) so the late
  # wave dies on approach too.
  # max_turns 45 ⇒ ceiling 4053 > 3901 ✓.
  medium:
    description: >
      Commander, this is a harvester-defense drill against two raid
      waves. You hold a Construction Yard (fact), Power Plant (powr)
      and Ore Refinery (proc) in the north-west corner, one harvester
      (harv, an unarmed ore-collector truck) auto-cycling to an
      off-axis ore patch at (30,28), and two medium tanks (2tnk) parked
      at the refinery on HOLD-FIRE stance. A vertical water wall at
      x=46..54 leaves a single 4-cell corridor at y=18..21. Enemy heavy
      tanks spawn at (75,20) at tick 600 and again at tick 1500, both
      driving for your harvester through the corridor. Within about 45
      turns, finish with cash at least $2200 and keep your harvester
      and refinery alive. Flip the escort to Defend or AttackAnything
      and hold the corridor mouth so BOTH waves die on approach.
    starting_cash: 0
    overrides:
      base_map:
        generator: chokepoint-arena
        name: econ-harvester-defense-raid-arena
        width: 96
        height: 40
        cordon: 2
        pinch_x: 50
        pinch_width: 8
        corridor_width: 4
        corridor_y: 20
      actors:
        - {type: fact, owner: agent, position: [8, 10]}
        - {type: powr, owner: agent, position: [8, 8]}
        - {type: proc, owner: agent, position: [10, 12]}
        - {type: harv, owner: agent, position: [12, 12]}
        - {type: 2tnk, owner: agent, position: [14, 12], stance: 0}
        - {type: 2tnk, owner: agent, position: [14, 14], stance: 0}
        - {type: mine, owner: neutral, position: [30, 28]}
        - {type: fact, owner: enemy, position: [90, 20]}
      scheduled_events:
        - tick: 600
          type: spawn_actors
          actors:
            - {type: 2tnk, owner: enemy, position: [75, 20]}
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: 2tnk, owner: enemy, position: [75, 20]}
    win_condition:
      # `then:` forces cash bar to be reached AFTER tick 2700 — past
      # the second raid wave's kill-window (wave 2 spawns at tick
      # 1500, reaches harv ~tick 2000, kills undefended harv by
      # ~tick 2600). Aggressive-no-corridor-hold (drive escort
      # east past the corridor) lets wave 1 chip the harv and wave
      # 2 finish it; the harv dies before clause 1 latches → fail
      # clause unit_type_count_gte:{harv,1} fires → LOSS.
      all_of:
        - then:
            id: econ-harvester-defense-raid-medium
            clauses:
              - {after_ticks: 2700}
              - {cash_gte: 2200}
        - {unit_type_count_gte: {type: harv, n: 1}}
        - {has_building: proc}
        - {within_ticks: 3900}
    fail_condition:
      any_of:
        - {after_ticks: 3901}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
        - {not: {has_building: proc}}
    max_turns: 45

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 axis vs medium: TWO seed-driven AGENT spawn_point groups —
  # base latitude NORTH y=8 vs SOUTH y=32, round-robined per seed.
  # Each group has its own fact/powr/proc/harv/escort/mine on its
  # own y-band, ENTIRELY inside the west lobe (above the corridor
  # for NORTH, below for SOUTH). The agent's load-bearing decision
  # is the same (flip + position escort onto the corridor mouth)
  # but the harv's latitude varies per seed, so a memorised opening
  # that ignores the active base latitude leaves the harv exposed
  # on the wrong y after the raider exits the corridor.
  #
  # Hard tier ≥2-spawn-groups requirement (CLAUDE.md §7): satisfied
  # via two AGENT spawn_point groups (spawn_point: 0 / 1) — every
  # agent actor is duplicated across both groups; the active group
  # is round-robined by seed.
  #
  # Three raid waves (ticks 600, 1500, 2400) spawn on the central
  # east axis at (75,20). Per the raider bot, each one targets the
  # active harv; the wall forces every approach through the
  # corridor (y=18..21), then the raider detours north or south to
  # the active harv latitude (NORTH y=8 needs a ~10-cell detour
  # north of the corridor; SOUTH y=32 needs a ~11-cell detour
  # south). The corridor mouth (x≈44..46, y=18..21) is the SHARED
  # defensive position for BOTH spawn groups, so the load-bearing
  # capability — read the corridor + plant escort there — is
  # invariant across seeds; only the escort's STARTING position
  # changes (north base vs south base).
  # max_turns 50 ⇒ ceiling 4503 > 4301 ✓.
  hard:
    description: >
      Commander, this is a harvester-defense drill with seed-rotated
      base latitude against three raid waves. You hold a Construction
      Yard (fact), Power Plant (powr) and Ore Refinery (proc) at either
      the NORTH (y=8) or SOUTH (y=32) latitude, one harvester (harv, an
      unarmed ore-collector truck) auto-cycling to an off-axis ore patch
      on the matched latitude (mine at (30,12) NORTH or (30,28) SOUTH),
      and three medium tanks (2tnk) parked at the refinery on HOLD-FIRE
      stance. A vertical water wall at x=46..54 leaves a single 4-cell
      corridor at y=18..21. Enemy heavy tanks arrive at ticks 600, 1500
      and 2400 from (75,20) and detour to your harvester's latitude after
      crossing. Within about 50 turns, finish with cash at least $2800
      and keep your harvester and refinery alive. Flip the escort to
      Defend or AttackAnything and attack-move it onto the corridor
      mouth (about x=44..46, y=18..21) so all three waves die on
      approach.
    starting_cash: 0
    overrides:
      base_map:
        generator: chokepoint-arena
        name: econ-harvester-defense-raid-arena
        width: 96
        height: 40
        cordon: 2
        pinch_x: 50
        pinch_width: 8
        corridor_width: 4
        corridor_y: 20
      actors:
        # spawn_point 0 — NORTH base (y=8). CLAUDE.md: agent actors
        # must be duplicated across both spawn_point groups (the
        # filter drops any group-untagged actor on either side).
        # THREE escort tanks per spawn — the hard tier fires THREE
        # raid waves so a 2-tank escort is whittled down by wave 2.
        - {type: fact, owner: agent, position: [8, 8], spawn_point: 0}
        - {type: powr, owner: agent, position: [8, 6], spawn_point: 0}
        - {type: proc, owner: agent, position: [10, 8], spawn_point: 0}
        - {type: harv, owner: agent, position: [12, 8], spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 7], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 9], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 11], stance: 0, spawn_point: 0}
        # spawn_point 1 — SOUTH base (y=32). Symmetric.
        - {type: fact, owner: agent, position: [8, 32], spawn_point: 1}
        - {type: powr, owner: agent, position: [8, 34], spawn_point: 1}
        - {type: proc, owner: agent, position: [10, 32], spawn_point: 1}
        - {type: harv, owner: agent, position: [12, 32], spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 31], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 33], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 29], stance: 0, spawn_point: 1}
        # Two ore patches — one per latitude, BOTH entirely in the
        # west lobe (x<46) and on their respective sides of the
        # corridor. Mines are neutral, so the spawn_point filter
        # (agent-side) does not affect them; both place every seed.
        # The active harv only uses ITS OWN patch (auto-route picks
        # the nearest ore the owner can reach, which on each seed
        # is the on-latitude one).
        - {type: mine, owner: neutral, position: [30, 12]}
        - {type: mine, owner: neutral, position: [30, 28]}
        # Persistent far enemy fact — east lobe, anti-DRAW.
        - {type: fact, owner: enemy, position: [90, 20]}
      scheduled_events:
        # Three raid waves spawn on the central east corridor axis
        # at (75,20). Each raider is bot-controlled and must traverse
        # the single corridor (y=18..21) — the wall blocks every
        # other east→west route — then detour ~10-11 cells north or
        # south to reach the on-latitude harv. The detour gives the
        # escort time to intercept at the corridor mouth, but ONLY
        # if the escort is actually parked there. A memorised
        # "send escort east along base latitude" opening drops them
        # at y=8 (NORTH) or y=32 (SOUTH), well off the corridor;
        # the raider exits the corridor unopposed and reaches the
        # harv unmolested.
        - tick: 600
          type: spawn_actors
          actors:
            - {type: 2tnk, owner: enemy, position: [75, 20]}
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: 2tnk, owner: enemy, position: [75, 20]}
        - tick: 2400
          type: spawn_actors
          actors:
            - {type: 2tnk, owner: enemy, position: [75, 20]}
    win_condition:
      # `then:` forces cash bar AFTER tick 3500 — past wave 3
      # (spawns tick 2400, reaches harv ~tick 2900, kills
      # undefended harv by ~tick 3400). Stall / passive / off-axis
      # all lose their harv before tick 3500 → unit_type_count_gte
      # fail clause fires → LOSS. Intended (escort planted on the
      # corridor mouth) kills each wave on approach; harv cycles
      # uninterrupted through all three waves and accumulates
      # cash past tick 3500.
      all_of:
        - then:
            id: econ-harvester-defense-raid-hard
            clauses:
              - {after_ticks: 3500}
              - {cash_gte: 2800}
        - {unit_type_count_gte: {type: harv, n: 1}}
        - {has_building: proc}
        - {within_ticks: 4300}
    fail_condition:
      any_of:
        - {after_ticks: 4301}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
        - {not: {has_building: proc}}
    max_turns: 50
