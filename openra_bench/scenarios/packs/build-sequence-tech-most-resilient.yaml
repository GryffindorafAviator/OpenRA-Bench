# build-sequence-tech-most-resilient.yaml
#
# REASONING capability — robust build-order planning under spatial
# attrition. The two-base strategic-retreat template (task #81):
#
#   START
#     • HOME — a complete safe base in the deep west (fact + proc +
#       powr + harv + ore patch).
#     • FORWARD — a partial doomed base on the east side (fact +
#       proc + powr). Convenient-looking (has a refinery, has
#       power, near the front), but every asset there is on a
#       repeated strike-rotation kill list.
#
#   THREAT
#     • `scheduled_events: destroy_actors` razes the entire forward
#       zone at THREE ticks (1200, 2400, 3600). Anything the agent
#       builds inside the strike region between waves is killed by
#       the NEXT wave. HOME (deep west) is well outside the strike
#       radius and stays untouched.
#
#   WIN  (state-based, evaluated at the deadline — no `then:` chain)
#     • a War Factory (`weap`) alive
#     • 3 medium tanks (`2tnk`) alive
#     • a Power Plant (`powr`) alive
#     • the Construction Yard (`fact`) alive
#     • within the deadline
#
# Both bases count toward the win. A rational operator who builds at
# HOME wins; a redundancy-fan who builds at BOTH bases also wins
# (HOME assets survive even if the FORWARD copies are razed). The
# pack DOES NOT punish preemptive redundancy — it punishes only
# building at FORWARD ONLY (no surviving copy) and not building at
# all.
#
# This is the resilient-planning idiom reframed as a goal-state
# predicate rather than a sequence-of-events latch:
#   • the disturbance is real (the strike rotation razes the forward
#     zone repeatedly);
#   • a build order that places the war factory and tanks in the
#     safe HOME base survives the disturbance;
#   • a build order that places them in the doomed FORWARD base
#     loses everything to the next strike wave;
#   • a stall builds nothing and runs out the clock.
#
# ── ENGINE FACTS verified on the live engine (2026-05-24) ─────────
#
#  1. `scheduled_events: destroy_actors` (Wave-9 engine feature,
#     oramap.rs::read_scheduled_events / env.rs::fire_scheduled_events)
#     removes every agent actor inside `filter.region` when
#     `world_tick >= tick`. Re-firing on tick 1200/2400/3600 means
#     even buildings placed AFTER the first wave will be razed by
#     the next wave if they sit inside the forward strike region.
#  2. `place_building` does NOT enforce build-adjacency (CLAUDE.md);
#     a `build('weap') + place_building` chain works at arbitrary
#     in-bounds coords. The HOME and FORWARD bases each carry a
#     `fact` so either location can host a fresh `weap` placement.
#  3. `2tnk` (medium tank) costs 800; its build prerequisites are
#     `weap` AND `fix` — BUT a `fact` is the implicit construction
#     yard prerequisite, and `weap` alone unlocks medium-tank
#     production when the pack drops `fix` from prereqs in the
#     vendor ruleset path. We pre-place `fix` at HOME as well so
#     the tech path is intact whether the agent builds the war
#     factory at HOME or copies it at FORWARD.
#  4. `weap` (war factory) costs 2000; its prerequisite is `proc`
#     (pre-placed at both HOME and FORWARD).
#  5. `building_count_gte` reads the LIVE `own_buildings` list per
#     frame, so a `weap` razed in a forward strike wave drops the
#     clause back to FALSE for the rest of the episode (unless
#     a HOME copy is also alive). This is the load-bearing teeth
#     on the placement decision.
#  6. The persistent unarmed enemy `fact` marker far east keeps the
#     engine all-enemies-eliminated auto-`done` path gated, so a
#     non-winner reaches the deadline as a real reachable timeout
#     LOSS, not a DRAW (CLAUDE.md engine auto-`done` footgun).
#  7. Tick alignment (CLAUDE.md): max tick = 93 + 90·(max_turns−1).
#     easy max_turns 60 → ceiling 5403 ≥ within_ticks 5400, fail
#     after_ticks 5401 ✓. medium/hard max_turns 50 → ceiling 4503
#     ≥ within_ticks 4500, fail after_ticks 4501 ✓.
#  8. Hard `spawn_point` rule (CLAUDE.md oramap.rs): ANY agent
#     actor with a spawn_point causes agent actors WITHOUT one to
#     be filtered out — the FULL HOME + FORWARD base pair is
#     DUPLICATED across both spawn groups at spawn-matched cells.
#     Enemy / neutral actors do NOT honour spawn_point; the strike
#     region is duplicated per latitude.
#
# ── THE BAR (CLAUDE.md "no defect, no cheat") ─────────────────────
#
#   • stall (observe only) — builds nothing; no weap, no tanks ⇒
#     LOSS on every (level, seed).
#   • build-at-FORWARD (place weap + tanks at the forward base) —
#     the next strike wave razes the forward weap and any tanks
#     that haven't moved out of the strike radius ⇒ LOSS on every
#     (level, seed).
#   • build-at-HOME (place weap + tanks at the safe west base) —
#     all assets survive; production runs to completion ⇒ WIN on
#     every (level, seed).
#   • build-at-BOTH (redundancy: copies at HOME and at FORWARD) —
#     HOME copies survive the strike rotation even if the FORWARD
#     copies are razed ⇒ WIN on every (level, seed). The pack
#     credits the redundancy play instead of punishing it.
#
# Validate (no model / no network):
#   cd /Users/berta/Projects/OpenRA-Bench && \
#   python3 -m pytest tests/test_build_sequence_tech_most_resilient.py -q

meta:
  id: build-sequence-tech-most-resilient
  title: 'Resilient War Factory — Build in the Safe Zone, Not the Strike Lane'
  capability: reasoning
  real_world_meaning: >
    Robust build-order planning under spatial attrition. The agent has
    two bases: a SAFE one in the deep rear and a FORWARD one in a
    contested zone that suffers periodic enemy strikes. The agent must
    end up with a war factory online and an armoured force in the
    field. A naive build order places the war factory and tanks at the
    convenient-looking forward base (closer to the front, has its own
    refinery) and loses everything to the next strike wave. A resilient
    build order places the critical tech in the safe rear, where it
    survives. Both bases count toward the goal, so preemptive
    redundancy (build at both) is also credited — only building in the
    strike lane with no rear copy loses. Tests whether the model plans
    around a foreseeable spatial threat rather than taking the
    shortest-distance shortcut.
  robotics_analogue: >
    Site selection under a known hazard. An autonomous operator runs
    two facilities — a hardened rear site and a forward site in a
    hazard zone with periodic outages. The operator must deliver
    finished goods by a deadline. Placing the assembly line at the
    forward site (closer to inputs) is the shortest-path play, but
    every hazard cycle razes whatever is there. Standing the assembly
    line up at the hardened rear site delivers on the deadline;
    running parallel lines at both is also acceptable (the rear line
    carries the deadline when the forward line is razed). Provisioning
    only the forward line is the failure mode the rear site exists to
    prevent.
  benchmark_anchor:
    - "PlanBench robust planning"
    - "site selection under known hazard"
    - "spatial redundancy"
  author: openra-bench-wave-11

base_map:
  generator: arena
  name: build-sequence-tech-most-resilient-64x40
  width: 64
  height: 40
  cordon: 2
  title: Build Sequence Tech Most Resilient Arena 64x40

base:
  agent: {faction: allies}
  # No scripted bot — the only threat is the scripted forward-zone
  # strike rotation. A hunt bot would convert this into a combat
  # survival test rather than a placement-decision test.
  enemy: {faction: soviet, bot_type: ''}
  # Build palette: build + place_building drive the war factory + tank
  # army; harvest keeps income credible; move_units + stop let the
  # agent reposition. No offensive verbs — this is a placement-
  # decision pack.
  tools: [observe, build, place_building, harvest, move_units, stop]
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 8000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare skill: recognise that the forward base sits in a recurring
  # strike zone, build the war factory and tanks in the safe HOME
  # base, end with weap + 3× 2tnk + powr + fact alive at tick 5400.
  # max_turns 60 → ceiling 5403 ✓.
  easy:
    description: >
      You hold two bases. The western base has a Construction Yard,
      a Refinery, a Power Plant, a Service Depot, and an Ore Truck
      on a nearby ore patch. The eastern base has a Construction
      Yard, a Refinery, and a Power Plant. Enemy raiders sweep the
      eastern zone in three waves — at roughly turn 13, turn 27,
      and turn 40 — and any of your assets caught inside that
      eastern strike radius are destroyed each wave. $6000 in the
      bank. End the episode owning a War Factory ('weap', $2000),
      three medium tanks ('2tnk', $800 each), a Power Plant, and a
      Construction Yard, within about 60 turns.
    starting_cash: 6000
    overrides:
      actors:
        # ── HOME (safe, deep west) ────────────────────────────────
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: powr, owner: agent, position: [8, 22]}
        - {type: fix,  owner: agent, position: [16, 18]}
        - {type: harv, owner: agent, position: [12, 22]}
        - {type: mine, owner: neutral, position: [20, 22]}
        # ── FORWARD (doomed, east) ────────────────────────────────
        - {type: fact, owner: agent, position: [40, 18]}
        - {type: proc, owner: agent, position: [44, 18]}
        - {type: powr, owner: agent, position: [40, 22]}
        # Persistent far enemy marker — LOSS-not-DRAW guarantee.
        - {type: fact, owner: enemy, position: [56, 30]}
      scheduled_events:
        # Three strike waves on the forward zone. Region is a wide
        # disc around the forward base (radius 8) — large enough to
        # catch any weap / tank placed at the forward fact. HOME
        # (x≈8..16) is ~24 cells away and never caught.
        - tick: 1200
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 20, radius: 8}
        - tick: 2400
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 20, radius: 8}
        - tick: 3600
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 20, radius: 8}
    win_condition:
      all_of:
        # War Factory alive — either at HOME or a surviving forward
        # copy. A forward-only build is razed by the next strike.
        - building_count_gte: {type: weap, n: 1}
        # 3 medium tanks alive — production-line throughput proof.
        - unit_type_count_gte: {type: '2tnk', n: 3}
        # Power Plant alive — HOME powr is safe; forward powr is
        # razed waves 1/2/3 but the HOME copy keeps this true.
        - building_count_gte: {type: powr, n: 1}
        # Construction Yard alive — mirrors the fail clause.
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 5403
    fail_condition:
      any_of:
        - after_ticks: 5404
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 60

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: the clock tightens (within_ticks 4500,
  # max_turns 50 → ceiling 4503 ✓). The safe HOME build still wins
  # comfortably, but a hesitant opening that dallies before
  # committing the war factory now risks the deadline. The
  # build-at-FORWARD failure mode loses exactly as on easy.
  medium:
    description: >
      Same two-base layout as easy — a complete western base and a
      partial eastern base with three strike waves sweeping the
      eastern zone around turns 13, 27, and 40. $6000 in the bank,
      and the deadline is now about 50 turns. End the episode owning
      a War Factory, three medium tanks, a Power Plant, and a
      Construction Yard, within the tighter clock.
    starting_cash: 6000
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: powr, owner: agent, position: [8, 22]}
        - {type: fix,  owner: agent, position: [16, 18]}
        - {type: harv, owner: agent, position: [12, 22]}
        - {type: mine, owner: neutral, position: [20, 22]}
        - {type: fact, owner: agent, position: [40, 18]}
        - {type: proc, owner: agent, position: [44, 18]}
        - {type: powr, owner: agent, position: [40, 22]}
        - {type: fact, owner: enemy, position: [56, 30]}
      scheduled_events:
        - tick: 1200
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 20, radius: 8}
        - tick: 2400
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 20, radius: 8}
        - tick: 3600
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 20, radius: 8}
    win_condition:
      all_of:
        - building_count_gte: {type: weap, n: 1}
        - unit_type_count_gte: {type: '2tnk', n: 3}
        - building_count_gte: {type: powr, n: 1}
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 4503
    fail_condition:
      any_of:
        - after_ticks: 4504
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 50

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled variable on top of medium: TWO seed-driven AGENT
  # spawn_point groups (NORTH band y=12 / SOUTH band y=26) round-
  # robined by seed. Per CLAUDE.md `spawn_point` rules: ANY agent
  # actor with spawn_point ⇒ agent actors WITHOUT one are filtered
  # out, so the FULL HOME + FORWARD base pair is DUPLICATED across
  # both spawn groups at spawn-matched cells. Enemy / neutral actors
  # do NOT honour spawn_point; the strike regions are duplicated per
  # latitude (a `destroy_actors` whose region misses the active
  # latitude simply removes nothing). A memorised "place weap at
  # (14,18)" opening cannot generalise — the agent must read the
  # actual HOME Construction Yard latitude and place the war factory
  # beside it there.
  hard:
    description: >
      Same two-base, three-strike-wave task as medium, but your
      bases may spawn in the NORTH band (y=12) or the SOUTH band
      (y=26) depending on seed. Read the actual Construction Yard
      coordinates from the observation — a memorised placement cell
      will mis-place on the flipped seed. End with a War Factory,
      three medium tanks, a Power Plant, and a Construction Yard
      alive within about 50 turns.
    starting_cash: 6000
    overrides:
      actors:
        # ── SPAWN 0 (NORTH bases, y=12) ───────────────────────────
        # HOME (safe west)
        - {type: fact, owner: agent, position: [8, 12],  spawn_point: 0}
        - {type: proc, owner: agent, position: [12, 12], spawn_point: 0}
        - {type: powr, owner: agent, position: [8, 16],  spawn_point: 0}
        - {type: fix,  owner: agent, position: [16, 12], spawn_point: 0}
        - {type: harv, owner: agent, position: [12, 16], spawn_point: 0}
        # FORWARD (doomed east)
        - {type: fact, owner: agent, position: [40, 12], spawn_point: 0}
        - {type: proc, owner: agent, position: [44, 12], spawn_point: 0}
        - {type: powr, owner: agent, position: [40, 16], spawn_point: 0}
        # ── SPAWN 1 (SOUTH bases, y=26) ───────────────────────────
        # HOME (safe west)
        - {type: fact, owner: agent, position: [8, 26],  spawn_point: 1}
        - {type: proc, owner: agent, position: [12, 26], spawn_point: 1}
        - {type: powr, owner: agent, position: [8, 30],  spawn_point: 1}
        - {type: fix,  owner: agent, position: [16, 26], spawn_point: 1}
        - {type: harv, owner: agent, position: [12, 30], spawn_point: 1}
        # FORWARD (doomed east)
        - {type: fact, owner: agent, position: [40, 26], spawn_point: 1}
        - {type: proc, owner: agent, position: [44, 26], spawn_point: 1}
        - {type: powr, owner: agent, position: [40, 30], spawn_point: 1}
        # Neutral ore patches — one per latitude.
        - {type: mine, owner: neutral, position: [20, 16]}
        - {type: mine, owner: neutral, position: [20, 30]}
        # Persistent far enemy marker — LOSS-not-DRAW guarantee.
        - {type: fact, owner: enemy, position: [56, 33]}
      scheduled_events:
        # Strike regions DUPLICATED per latitude (enemy/neutral and
        # scheduled events do not honour spawn_point). The region
        # matching the dormant latitude removes nothing; the one
        # matching the active base razes the forward zone there.
        - tick: 1200
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 14, radius: 8}
        - tick: 2400
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 14, radius: 8}
        - tick: 3600
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 14, radius: 8}
        - tick: 1200
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 28, radius: 8}
        - tick: 2400
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 28, radius: 8}
        - tick: 3600
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 42, y: 28, radius: 8}
    win_condition:
      all_of:
        - building_count_gte: {type: weap, n: 1}
        - unit_type_count_gte: {type: '2tnk', n: 3}
        - building_count_gte: {type: powr, n: 1}
        - building_count_gte: {type: fact, n: 1}
        - within_ticks: 4503
    fail_condition:
      any_of:
        - after_ticks: 4504
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 50
