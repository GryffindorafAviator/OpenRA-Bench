# Validate (no model / no network):
#   cd /Users/berta/Projects/OpenRA-Bench && \
#   python3 -m openra_bench.scenarios.validate \
#     openra_bench/scenarios/packs/tp-survive-n-turns.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# REASONING capability — PURE SURVIVAL under sustained attrition.
# The agent fields a fixed force (6× 2tnk + fact + powr, no economy
# tools) and must KEEP ≥N of those units AND its construction yard
# (fact) ALIVE until the survival tick T elapses. Relentless rusher
# waves arrive throughout the episode (a wave at t=0 plus
# scheduled-event reinforcement waves). There is NO offensive
# objective: no kill quota, no region to reach, no building to
# raze. The only thing that matters is what is still standing at
# tick T.
#
# The reasoning under test is RESTRAINT + POSITIONAL DISCIPLINE,
# not aggression:
#   - Hold the 6 tanks as ONE tight cluster on the fact so their
#     fire concentrates and the rushers — which charge the agent
#     centroid — are met by all six guns at once. A clustered
#     defence trades up: each arriving rusher is focus-killed
#     before it can spread damage.
#   - Do NOT charge out. The rusher bot concentrates its whole
#     band on the agent mass; a column that sallies forward is met
#     piecemeal in the open, loses tanks one at a time, and drops
#     below N — aggression is a TRAP here.
#   - Do NOT stall (observe-only). Passive Defend-stance tanks
#     auto-fire but never reposition or focus; the SUSTAINED wave
#     pressure grinds an unmanaged cluster down — a straggler gets
#     swarmed, the fact takes hits between waves, and either
#     own_units or the fact falls before T.
#
# DISCRIMINATIONS (no defect, no cheat):
#   - stall (observe only): LOSS — the sustained rusher waves wear
#     the unmanaged force down; a tank is lost and/or the fact is
#     razed before T ⇒ the win all-of is false at the survival
#     gate ⇒ the broad after_ticks fail bites (real LOSS).
#   - aggressive-charge (attack_move the column at the rushers):
#     LOSS — the column is met in the open and ground down piecemeal
#     by the concentrated band; own_units drops below N.
#   - intended hold-defence (keep the 6 tanks clustered on the fact,
#     focus-fire each arriving wave, never chase): WIN — the force
#     trades up against the piecemeal-arriving rushers, ≥N tanks and
#     the fact are still standing when T elapses.
#
# ENGINE FACTS (CLAUDE.md):
#   - PURE SURVIVAL idiom (proven by lh-100-turn-marathon-survival):
#     the win is the BAND [after_ticks: T, within_ticks: T+x]. The
#     `after_ticks: T` clause is the load-bearing SURVIVAL GATE — it
#     becomes true ONLY at tick T, and ONLY IF building_count_gte
#     fact AND own_units_gte N are ALSO still true then. Without it
#     the win (fact + units) would be satisfied on turn 1 and a
#     staller would win for free. The fail tree's broad
#     `after_ticks: T+1` then bites the instant the gate is reached
#     without the win all-of holding (win is evaluated FIRST in
#     eval_core ⇒ non-win at the gate is a real reachable LOSS,
#     never a DRAW — CLAUDE.md rule 3).
#   - tick budget: engine advances ~90 ticks per decision turn
#     (tick ≈ 93 + 90·(turn-1)). Every after_ticks / within_ticks
#     is reachable inside max_turns so a staller hits a real
#     reachable timeout LOSS. Re-verified per level.
#   - rusher bot: concentrates the whole band on the agent mass
#     (~8-tick re-target interval, see scripted_bot.rs::Rusher).
#   - scheduled_events spawn_actors: injects reinforcement waves
#     mid-episode (Wave-9 feature) — this is what makes the
#     pressure SUSTAINED rather than one-shot.
#   - persistent inert enemy `fact` far east: prevents the engine's
#     enemy-elimination auto-`done` from collapsing the
#     after_ticks-in-win survival gate to a DRAW.
#   - hard tier: 2 agent spawn_point groups (NORTH y=12 / SOUTH
#     y=28) so a single memorised hold cell cannot generalise; the
#     base fact/powr are duplicated across both groups (any agent
#     actor declaring spawn_point filters out unspawned agent
#     actors). The rusher band sits on the CENTRAL lane (y≈20),
#     equidistant from both base spawn latitudes, so the
#     stall-vs-hold discrimination is seed-symmetric.

meta:
  id: tp-survive-n-turns
  title: 'Timing Push — Survive N Turns of Sustained Attrition'
  capability: reasoning
  real_world_meaning: >
    Pure endurance under sustained attrition: a fixed defending
    force must keep a minimum number of units AND its key structure
    intact until a survival deadline elapses, against relentless
    waves that arrive throughout the window. There is no offensive
    objective — credit arrives only if enough of the force and the
    asset are still standing at the end. The capability under test
    is restraint and positional discipline: hold a concentrated
    defence so each wave is met with massed fire, never sally out
    into the open where the force is ground down piecemeal, and
    never sit idle while sustained pressure wears the line down.
    Aggression is a trap; passivity is a slow loss; only a managed
    hold survives.
  robotics_analogue: >
    Holding a defended perimeter through a sustained incident: a
    fixed response team must keep a minimum capacity and the core
    asset online until relief arrives, absorbing wave after wave of
    pressure. Committing the team forward into the open burns it
    down; leaving it unmanaged lets attrition erode the line. The
    discipline is to hold the concentrated defence and trade up on
    every wave until the clock runs out.
  benchmark_anchor:
    - "SC2 survival"
    - "military hold-the-line"
    - "sustained ops"
  author: openra-bench

base_map: rush-hour-arena

base:
  agent:
    faction: allies
    cash: 0
  # rusher: relentless concentrated charge at the agent's mass.
  enemy:
    faction: soviet
    cash: 0
    bot_type: rusher
  # No economy / build tools — this is a PURE survival hold with a
  # fixed force. The only verbs are positional: move/attack/stop.
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  # Re-decide the instant a rusher is spotted or a tank is lost —
  # survival is reactive, not on a fixed cadence.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination:
    max_ticks: 20000

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # The bare survival skill. N=4 (lose at most 2 of 6 tanks), T=2700
  # (~turn 31). One opening wave at t=0 plus ONE scheduled
  # reinforcement wave at tick 900. Stall LOSES (unmanaged cluster
  # ground down — a tank lost or the fact chipped); aggressive-charge
  # LOSES (column met in the open, dropped below 4); intended hold
  # WINS. max_turns 45 → reachable tick 93 + 90·44 = 4053 > the
  # within_ticks 3600 upper band and the after_ticks 3601 fail, so a
  # non-winner is a real reachable timeout LOSS.
  easy:
    description: >
      You hold a fixed force — 6 medium tanks (2tnk), a construction
      yard (fact) and a power plant (powr) at your west base. Enemy
      rifle infantry charge your base in waves: one at the start and
      two reinforcement waves across the game. There is NO objective
      to attack — just SURVIVE. To WIN you must, once tick 2700 has elapsed,
      STILL have your construction yard standing AND at least 4 of
      your own units alive (survive until tick 3600). Keep your
      tanks clustered on the construction yard and focus-fire each
      wave as it arrives. Charging out into the open gets your tanks
      ground down one by one (you drop below 4); sitting idle lets
      the sustained waves wear your line down. Both lose.
    overrides:
      actors:
        # ── Agent base (west): 6× 2tnk in a tight cluster ON the
        # fact so the rusher charge (which targets the agent mass)
        # is met with all six guns at once.
        - {type: fact, owner: agent, position: [12, 20]}
        - {type: powr, owner: agent, position: [9,  20]}
        - {type: 2tnk, owner: agent, position: [14, 18], stance: 2}
        - {type: 2tnk, owner: agent, position: [14, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [14, 22], stance: 2}
        - {type: 2tnk, owner: agent, position: [16, 18], stance: 2}
        - {type: 2tnk, owner: agent, position: [16, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [16, 22], stance: 2}
        # ── Opening rusher wave at the mid-map lane mouth (x=64,
        # same row as the base). Charges the agent centroid.
        - {type: e1, owner: enemy, position: [64, 18], stance: 3, count: 4}
        - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 4}
        - {type: e1, owner: enemy, position: [64, 22], stance: 3, count: 4}
        # Inert enemy `fact` marker far east (anti-DRAW): keeps the
        # episode alive past the last rusher death so the survival
        # gate is evaluated.
        - {type: fact, owner: enemy, position: [124, 20]}
      # TWO scheduled reinforcement waves — the pressure is
      # SUSTAINED, not one-shot. Spawned actors get fresh ids and
      # charge the agent mass like the opening wave. NOTE: the
      # scheduled_events block MUST sit inside `overrides:` — at the
      # level root the loader silently drops it (this was a latent
      # defect: the waves never fired). With the waves now firing,
      # two of them restore the cumulative pressure the engine
      # balance fixes drained: a single wave let the unmanaged
      # Defend-stance cluster clear everything and a stall WON for
      # free. Spread (stall) fire now falls behind and the fact is
      # razed before the survival gate, while focused fire (the
      # intended hold) clears each wave in time.
      scheduled_events:
        - tick: 600
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [64, 18], stance: 3, count: 4}
            - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 4}
            - {type: e1, owner: enemy, position: [64, 22], stance: 3, count: 4}
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [64, 18], stance: 3, count: 4}
            - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 4}
            - {type: e1, owner: enemy, position: [64, 22], stance: 3, count: 4}
    win_condition:
      all_of:
        - {building_count_gte: {type: fact, n: 1}}
        - {own_units_gte: 4}
        - {after_ticks: 2700}
        - {within_ticks: 3600}
    # Fail bites the moment the survival gate opens (after_ticks:
    # 3601) — win is evaluated FIRST, so the broad clock fail only
    # fires if the win all-of is unsatisfied at that tick
    # (CLAUDE.md rule 3: non-win must be a real LOSS, not a draw).
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {own_units_gte: 4}}
    max_turns: 45

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: HEAVIER sustained pressure (TWO scheduled
  # rifle waves) and a longer hold (T=3600, ~turn 41). N stays at 4
  # of 6. max_turns 55 → reachable tick 93 + 90·54 = 4953 > the
  # within_ticks 4500 band and the after_ticks 4501 fail.
  medium:
    description: >
      Same fixed force — 6 medium tanks (2tnk), a construction yard
      (fact) and a power plant (powr). The waves are heavier now:
      rifle infantry charge in three pulses — one at the start and
      two more across the game. There is NO objective to attack —
      just SURVIVE. To WIN you must, once tick
      3600 has elapsed, STILL have your construction yard standing
      AND at least 4 of your own units alive (survive until tick
      4500). Hold the tank cluster on the construction yard and
      focus each wave down. Charging out (ground down piecemeal)
      and sitting idle (worn down by sustained pressure) both lose.
    overrides:
      actors:
        - {type: fact, owner: agent, position: [12, 20]}
        - {type: powr, owner: agent, position: [9,  20]}
        - {type: 2tnk, owner: agent, position: [14, 18], stance: 2}
        - {type: 2tnk, owner: agent, position: [14, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [14, 22], stance: 2}
        - {type: 2tnk, owner: agent, position: [16, 18], stance: 2}
        - {type: 2tnk, owner: agent, position: [16, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [16, 22], stance: 2}
        # Opening wave — rifle infantry. The e3 rocket soldiers were
        # removed after the engine balance fixes: rockets carry a
        # building-damage bonus and razed the fact even under
        # focused fire, so the intended hold could not WIN. Pure e1
        # rifle pressure preserves the discrimination — spread
        # (stall) fire loses the fact, focused (hold) fire holds it.
        - {type: e1, owner: enemy, position: [64, 18], stance: 3, count: 4}
        - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 4}
        - {type: e1, owner: enemy, position: [64, 22], stance: 3, count: 4}
        - {type: fact, owner: enemy, position: [124, 20]}
      # TWO scheduled reinforcement waves — sustained pressure
      # across the whole window. Block sits inside `overrides:` (the
      # loader drops it at the level root). Pure e1 (no e3) for the
      # same reason as the opening wave: rocket soldiers raze the
      # fact even under focused fire and collapse the bar.
      scheduled_events:
        - tick: 1000
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [64, 18], stance: 3, count: 4}
            - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 4}
            - {type: e1, owner: enemy, position: [64, 22], stance: 3, count: 4}
        - tick: 2200
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [64, 18], stance: 3, count: 4}
            - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 4}
            - {type: e1, owner: enemy, position: [64, 22], stance: 3, count: 4}
    win_condition:
      all_of:
        - {building_count_gte: {type: fact, n: 1}}
        - {own_units_gte: 4}
        - {after_ticks: 3600}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {own_units_gte: 4}}
    max_turns: 55

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled variable: 2 seed-driven spawn_point groups (NORTH
  # y=12 / SOUTH y=28) so a single memorised hold cell cannot
  # generalise, plus the longest hold (T=4500, ~turn 51) and five
  # scheduled reinforcement waves. N stays 4 of 6. The base fact +
  # powr are duplicated across BOTH spawn groups (any agent actor
  # declaring spawn_point filters out unspawned agent actors). The
  # rusher band sits on the CENTRAL lane (y≈20) — equidistant from
  # both base spawn latitudes so the discrimination is seed-
  # symmetric (the rusher bot charges the agent mass regardless of
  # which latitude the base occupies). max_turns 65 → reachable
  # tick 93 + 90·64 = 5853 > the within_ticks 5400 band and the
  # after_ticks 5401 fail.
  hard:
    description: >
      Same fixed force — 6 medium tanks (2tnk), a construction yard
      (fact) and a power plant (powr) — but your base stages from a
      seed-chosen latitude (NORTH or SOUTH); a single memorised hold
      cell cannot generalise. Rifle waves charge in from the central
      lane throughout the game — one opening wave and five
      reinforcement waves. There is NO objective to attack — just
      SURVIVE. To WIN you must, once tick 4500 has
      elapsed, STILL have your construction yard standing AND at
      least 4 of your own units alive (survive until tick 5400).
      Hold the tank cluster on the construction yard and focus each
      wave down. Charging out and sitting idle both lose.
    overrides:
      actors:
        # ── NORTH base spawn (spawn_point 0).
        - {type: fact, owner: agent, position: [12, 12], spawn_point: 0}
        - {type: powr, owner: agent, position: [9,  12], spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 10], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 12], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 14], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [16, 10], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [16, 12], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [16, 14], stance: 2, spawn_point: 0}
        # ── SOUTH base spawn (spawn_point 1) — symmetric.
        - {type: fact, owner: agent, position: [12, 28], spawn_point: 1}
        - {type: powr, owner: agent, position: [9,  28], spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 26], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 28], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 30], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [16, 26], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [16, 28], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [16, 30], stance: 2, spawn_point: 1}
        # ── Opening rusher band on the CENTRAL lane (y=19..21), the
        # map mid-latitude — equidistant from BOTH the north (y=12)
        # and south (y=28) base spawns so the discrimination is
        # seed-symmetric. After the engine balance fixes, two
        # converging bands (the old north+south layout) scaled the
        # pressure non-linearly and seed-asymmetrically: the
        # intended hold won on one spawn and lost on the other.
        # A single central band charges whichever base latitude is
        # chosen at an equal reach. Pure e1 rifle (no e3 rockets —
        # rockets raze the fact even under focused fire).
        - {type: e1, owner: enemy, position: [64, 19], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 3}
        - {type: e1, owner: enemy, position: [64, 21], stance: 3, count: 3}
        # Inert enemy `fact` marker far east (anti-DRAW).
        - {type: fact, owner: enemy, position: [124, 20]}
      # FIVE scheduled reinforcement waves on the central lane —
      # sustained pressure across the whole 4500-tick hold. Block
      # sits inside `overrides:` (the loader drops it at the level
      # root). Each wave is light (6 rifle) so focused fire clears
      # it in time; the CUMULATIVE pressure of five waves is what an
      # unmanaged spread (stall) falls behind on, losing the fact
      # before the survival gate. Pure e1 (no e3) — see the
      # opening-wave note.
      scheduled_events:
        - tick: 1000
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [64, 19], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 21], stance: 3, count: 2}
        - tick: 1660
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [64, 19], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 21], stance: 3, count: 2}
        - tick: 2320
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [64, 19], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 21], stance: 3, count: 2}
        - tick: 2980
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [64, 19], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 21], stance: 3, count: 2}
        - tick: 3640
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [64, 19], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 20], stance: 3, count: 2}
            - {type: e1, owner: enemy, position: [64, 21], stance: 3, count: 2}
    win_condition:
      all_of:
        - {building_count_gte: {type: fact, n: 1}}
        - {own_units_gte: 4}
        - {after_ticks: 4500}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {own_units_gte: 4}}
    max_turns: 65
