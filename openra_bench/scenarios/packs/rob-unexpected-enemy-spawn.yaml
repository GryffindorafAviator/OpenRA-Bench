# rob-unexpected-enemy-spawn.yaml
#
# ENGINE NOTE (tier-progression audit, 2026-05-24): The audit flags
# this pack F-INVERT because max_losses grows m=5 → h=7 and
# survival_strictness drops m=0.29 → h=0.22. This is INTENTIONAL:
# hard has 9 starter units (vs medium's 7) to cover the SECOND
# wave corner (NE+SE vs medium's NE-only) and the seed-rotated
# spawn axis. The `own_units_gte:2` floor is the SAME absolute
# survival requirement; the fraction drops only because the
# denominator grew to staff the additional symmetric corner
# defence and seed rotation. The kill_quota also grows
# (m=8 → h=9) and the scheduled second wave fires on hard for an
# additional cluster. Not a real inversion.
#
# REASONING capability — Wave-6 ROBUSTNESS / adversarial robustness:
# surprise SECOND wave INJECTED MID-EPISODE. The agent has an obvious
# 4-unit hunter cluster (Wave 1) closing in from the centre on its
# starting vision row; a SECOND wave is INJECTED via
# `scheduled_events: spawn_actors` at tick 1500 at a fog corner (NE
# on easy/medium, both NE+SE on hard) and closes in by hunt pattern
# from a different bearing than Wave 1. The briefing does NOT
# pre-disclose the second wave — the agent must DISCOVER it via
# `enemy_unit_spotted` interrupt + the live `units_summary` channel
# once the new actors appear. Winning requires defeating BOTH waves
# (`units_killed_gte`), keeping the base (`has_building:fact`), AND
# keeping enough force alive (`own_units_gte:2`). The relevant
# capability is RESERVING capacity for a follow-on attack — keeping
# the defender screen centred on the base instead of chasing routers
# to the corner and leaving the base exposed.
#
# Real-world / benchmark anchors:
#   - Adversarial robustness: surprise wave / follow-on attack handling.
#   - Military follow-on wave doctrine ("the battle isn't over when
#     the enemy you see is dead"; second-echelon engagement).
#   - SC2 second-attack timing (the canonical "second push" the
#     defender must reserve forces against).
#   - Operations: incident-after-incident triage (the same operator is
#     immediately re-paged on a fresh incident from a different
#     subsystem — the relevant skill is reserving capacity).
#
# DISCRIMINATIONS (no defect, no cheat — every brute/lazy play LOSES):
#
#   • stall (observe only): the pre-placed defenders are stance:2
#     (Defend) — they auto-fire on a hostile inside their weapon arc
#     but never advance. An un-commanded garrison meets the hunters
#     piecemeal at melee, splits its fire, and is swarmed and wiped;
#     the `units_killed_gte` bar is never met AND own_units drops to
#     zero → fail-clause fires (LOSS, not a draw, before tick 5400).
#     (stance:3 / AttackAnything is deliberately NOT used — after the
#     engine stance-semantics fix a stance:3 garrison auto-HUNTS the
#     whole map and would clear both waves with zero agent input,
#     handing a stall a free WIN. stance:2 keeps the stall baseline
#     genuinely passive so the reserve-capacity skill is load-bearing.)
#
#   • forward-rush (chase Wave 1 deep east the moment it is spotted):
#     the defender screen attack-moves east into open ground; Wave 1
#     gets pulled into a long-range trade well east of the base,
#     defenders take attrition, and when Wave 2 INJECTS at tick 1500
#     at the fog corner the screen is no longer near the base — the
#     follow-on closes uncontested and finishes the depleted screen
#     before the kill bar is met → `own_units_gte:1` or
#     `after_ticks:5401` LOSS.
#
#   • intended discover-then-rebalance: engage Wave 1 with
#     `attack_move` but KEEP the screen base-adjacent (~12 cells
#     from the fact). When the `enemy_unit_spotted` interrupt fires
#     on the Wave-2 injection at ~tick 1500, redirect the surviving
#     screen to intercept the new bearing before fact contact. Both
#     waves dead (kill bar met), fact alive, own_units_gte:2
#     satisfied → WIN.
#
# ENGINE FACTS (CLAUDE.md / SCENARIO_QUALITY.md):
#   - Bot `hunt` (openra-sim/src/scripted_bot.rs::Hunt): each enemy
#     unit pursues the NEAREST agent target. Hunt-driven e1 cover
#     ~1 cell per 1.8 ticks, so the centre cluster at x=80 reaches
#     the defender outpost at x=14 in ~120 ticks (well before tick
#     200); the Wave-2 squads INJECTED at tick 1500 at (90, 8)
#     reach the base latitude in ~tick 1900..2300 depending on
#     path congestion — well inside the 5400 win window.
#   - Scheduled `spawn_actors` (Wave-9 engine feature): Wave 2 is
#     INJECTED at tick 1500, NOT pre-placed at t=0. The briefing
#     does not pre-disclose the second wave; the model must DISCOVER
#     it via the `enemy_unit_spotted` interrupt (fires the instant
#     the new actors close into vision) and the live `units_summary`
#     channel. This is a genuine discovery test, not a pre-told-rule
#     reaction test.
#   - The defender screen is 3× 2tnk (medium tank, durable + dual-
#     purpose anti-armor / anti-infantry cannon) + 2× e3 (rocket
#     soldier, range 7, high anti-vehicle DPS) on easy/medium, and
#     a heavier 4× 2tnk + 3× e3 on hard (the hard surprise is TWO
#     Wave-2 squads, so the actively-commanded screen needs the
#     extra mass to hold both spawn corners). 5× e1 alone get
#     overwhelmed by hunt-bot e1s at melee in the first 200 ticks
#     (verified — see git history); the 2tnk durability is needed
#     to absorb the opening rush, the e3 range is needed to bleed
#     the trailing waves.
#   - Pre-placed defenders are stance:2 (Defend) — they auto-fire
#     on an in-range hostile but never advance. This keeps the
#     "stall" baseline genuinely passive: an un-commanded garrison
#     is swarmed piecemeal and wiped. (stance:3 / AttackAnything
#     would auto-hunt the whole map and hand a stall a free win.)
#     The intended play issues explicit `attack_move` — which
#     overrides stance — to concentrate the whole screen's fire.
#   - Inert enemy `fact` marker far east (anti-DRAW): without a
#     persistent enemy actor the engine auto-`done`s on enemy-elim
#     once both waves die, before the win/fail evaluator runs
#     (CLAUDE.md rule 5).
#   - Tick budget: max_turns 90 with `enemy_unit_spotted` +
#     `own_unit_destroyed` interrupts → in practice ~60..75 ticks
#     per re-decision → reachable tick at max_turns ≈ 5400..6750.
#     `after_ticks: 5401` fires inside this band so a non-winner is
#     a real reachable timeout LOSS, never a draw.
#   - `enemy_unit_spotted` interrupt → re-decide the instant Wave 2
#     becomes visible (faster detection of the surprise axis).
#   - `own_unit_destroyed` interrupt → re-decide when a defender
#     falls.
#   - The pre-placed defenders (5 on easy/medium, 7 on hard) + fact
#     + proc (no tent / cash 0) means the model CANNOT train fresh
#     infantry — the binding decision is RESERVING the starting
#     force, not out-producing the threat.
#   - hard tier: 2 agent spawn_point groups (NORTH base y=12 /
#     SOUTH base y=28) so which corner has the same-latitude
#     follow-on flips per seed; both Wave-2 squads are injected at
#     tick 1500 (scheduled_events fire identically across seeds,
#     independent of spawn_point), so a single memorised "expect
#     Wave 2 from NE" disposition cannot generalise.

meta:
  id: rob-unexpected-enemy-spawn
  title: 'Surprise Second Wave — Reserve Forces for the Follow-On'
  capability: reasoning
  real_world_meaning: >
    Adversarial robustness on the temporal axis: the obvious threat
    (a 4-unit cluster near the agent's starting vision) is just the
    OPENING; an UNDISCLOSED follow-on wave is injected mid-episode
    from an unexpected bearing in a hunt pattern. The agent must
    DISCOVER the second wave from the live observation channel rather
    than from a pre-announced rule. Winning requires destroying both
    threats AND keeping the base AND keeping enough force alive. The
    relevant capability is RESERVING capacity for the follow-on — not
    committing every defender to the visible battle and chasing
    routers far from the base. "Battle finished, push deep" is the
    canonical military / SRE failure mode this trains against.
  robotics_analogue: >
    Incident-after-incident triage: a fresh page arrives from a
    different subsystem the moment the operator resolves the visible
    incident; the operator was NOT pre-warned about the second
    incident and must detect it from the live telemetry. The
    operator must keep enough on-call capacity in reserve to handle
    the follow-on instead of fully committing every responder to
    the first symptom. Adversarial robustness: treating the first
    observable threat as ground truth and over-fitting the response
    to it leaves the system exposed when the adversary stages a
    second engagement from a different angle.
  benchmark_anchor:
    - 'adversarial robustness: surprise wave handling'
    - 'military follow-on wave doctrine'
    - 'ops: incident-after-incident triage'
    - 'SC2 second-attack timing'
  author: openra-bench

base_map:
  generator: arena
  name: rob-unexpected-enemy-spawn-arena
  width: 128
  height: 40
# Cash 0: the model CANNOT train fresh defenders (no tent and no
# cash) — the binding decision is RESERVING the starting 5-unit
# garrison for the surprise 2nd wave, not out-producing the threat.
starting_cash: 0

base:
  agent:
    faction: allies
  # Hunt bot — each enemy unit pursues the nearest agent target. The
  # Wave-2 squad starts FAR from any agent unit at a fog corner; once
  # it closes inside vision the agent's defender centroid pulls it in.
  enemy:
    faction: soviet
    bot_type: hunt
  tools:
    - observe
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  # Re-decide the instant a fresh enemy unit becomes visible (the
  # surprise-wave detection signal) or a defender is lost.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination:
    max_ticks: 12000
  # Default actor list (overridden per-level). fact + proc at the
  # west base, no tent / no cash — the agent cannot train replacements.
  actors:
    - {type: fact, owner: agent, position: [10, 20]}
    - {type: proc, owner: agent, position: [6,  20]}

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # 2nd wave SMALLER (3 e1) than Wave 1 (4 e1). Kills bar 7 — the
  # full kill-able enemy force on this level — so the policy MUST
  # defeat BOTH waves (a forward chase that leaves the centre
  # cluster to bombard the screen at long range cannot reach kills=7
  # before the screen is wiped). max_turns 90 with interrupts
  # → reachable tick ~5400..6750; `after_ticks: 5401` bites well
  # inside this band so non-win is a reachable LOSS.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Adversarial robustness — surprise second wave (easy). An obvious
    # 4-unit rifle cluster sits at the centre of the arena and closes in
    # on your base. Your 5 pre-placed defenders (3 medium tanks + 2 rocket
    # soldiers) are your ENTIRE force — you have no barracks and no cash
    # so you cannot train replacements. To WIN you must, before tick 5400,
    # kill ≥7 enemy units AND still have your construction yard (fact)
    # standing AND still have ≥2 of your own units alive. The defenders
    # auto-fire on whatever enters their arc but never advance on their
    # own — you must actively command them to concentrate fire. Stalling
    # (passive defence — the garrison is swarmed piecemeal and wiped) or
    # busting the attrition floor LOSE.
    description: >
      An obvious 4-rifle cluster centred on the arena charges your base.
      Your five defenders (three tanks plus two rocket soldiers) are your
      ENTIRE force — no barracks, no cash. Actively concentrate fire and
      hold the line. Seven kills, yard alive, two units alive, within
      about 60 turns.
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: proc, owner: agent, position: [6,  20]}
        # 5 pre-placed defenders (3× 2tnk + 2× e3), stance:2
        # (Defend — auto-fire on an in-range hostile but never
        # advance). stance:2 is the load-bearing choice: a stall
        # baseline must be GENUINELY passive. After the engine
        # stance-semantics fix, stance:3 (AttackAnything) makes an
        # idle garrison auto-HUNT the whole map and clear both waves
        # with no agent input — a stall would WIN for free. With
        # stance:2 a stall garrison only trades with whatever walks
        # into its arc, gets swarmed piecemeal, and is wiped (kills
        # never reach the bar) ⇒ real LOSS. The intended play issues
        # explicit `attack_move` (which overrides stance) so the
        # whole screen CONCENTRATES fire and intercepts each wave.
        # 5× e1 alone cannot survive the opening hunt-bot rush
        # (verified — melee'd in ~200 ticks); the 2tnk durability +
        # e3 reach are both needed for the screen to hold the line.
        - {type: 2tnk, owner: agent, position: [14, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [14, 18], stance: 2}
        - {type: 2tnk, owner: agent, position: [14, 22], stance: 2}
        - {type: e3,   owner: agent, position: [16, 19], stance: 2}
        - {type: e3,   owner: agent, position: [16, 21], stance: 2}
        # Wave 1 — obvious 4-unit cluster at the centre on the
        # base latitude. Stance:3 + hunt bot drives them straight
        # at the agent centroid; they arrive at the defender
        # outpost by ~tick 150.
        - {type: e1, owner: enemy, position: [80, 20], stance: 3, count: 4}
        # Inert enemy `fact` marker far east (anti-DRAW): keeps the
        # episode alive past the last killed hunter so the win/fail
        # evaluator runs.
        - {type: fact, owner: enemy, position: [120, 20]}
      # Wave 2 — SMALLER (3 e1) INJECTED at tick 1500 at the NE fog
      # corner via scheduled_events. The agent has NO briefing
      # pre-disclosure of the second wave; discovery comes from the
      # `enemy_unit_spotted` interrupt firing once the hunt-bot
      # injectees close into vision, plus the live `units_summary`
      # channel. Hunt-bot e1 inject at y=8 (out of the centred
      # defender screen's initial fog) and arrive at base latitude
      # ~tick 1900..2300 — well inside the 5400 win window.
      scheduled_events:
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [90, 8], stance: 3, count: 3}
    win_condition:
      all_of:
        - units_killed_gte: 7
        - has_building: fact
        - own_units_gte: 2
        - within_ticks: 5400
    # Non-win must be a real LOSS, not a draw. `after_ticks: 5401`
    # is reachable inside max_turns (in practice ~5400..6750 with
    # interrupts); fact-loss and own-units-zero both fail explicitly.
    # NOTE: WIN requires ≥2 alive (the reserve-capacity test); FAIL
    # fires on full wipe (≥1 alive ensures the episode hasn't ended
    # in total elimination).
    fail_condition:
      any_of:
        - after_ticks: 5401
        - not: {has_building: fact}
        - not: {own_units_gte: 1}
    max_turns: 90

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: 2nd wave EQUAL to first (4 e1) → kills bar 8
  # (the canonical spec value). Same clock, same fail.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Adversarial robustness — surprise second wave (medium). An obvious
    # 4-unit rifle cluster sits at the centre and closes in on your base.
    # Your 5 pre-placed defenders (3 medium tanks + 2 rocket soldiers) are
    # your ENTIRE force — no barracks, no cash. To WIN you must, before
    # tick 5400, kill ≥8 enemy units AND still have your construction yard
    # (fact) standing AND still have ≥2 of your own units alive. The
    # defenders auto-fire in their arc but never advance on their own —
    # you must actively command them. Stalling (the passive garrison is
    # swarmed and wiped) or attrition-busting LOSE.
    description: >
      Same obvious 4-rifle centre wave. Same five defenders, no
      reinforcements. Command interceptions actively. Eight kills, yard
      alive, two units alive, within about 60 turns.
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: proc, owner: agent, position: [6,  20]}
        # 5 pre-placed defenders, stance:2 (Defend) — see the easy
        # level for the rationale (stance:3 would let a stall
        # auto-hunt and win for free; stance:2 keeps stall passive).
        - {type: 2tnk, owner: agent, position: [14, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [14, 18], stance: 2}
        - {type: 2tnk, owner: agent, position: [14, 22], stance: 2}
        - {type: e3,   owner: agent, position: [16, 19], stance: 2}
        - {type: e3,   owner: agent, position: [16, 21], stance: 2}
        # Wave 1 — 4-unit cluster (canonical spec count).
        - {type: e1, owner: enemy, position: [80, 20], stance: 3, count: 4}
        - {type: fact, owner: enemy, position: [120, 20]}
      # Wave 2 — EQUAL size (4 e1) INJECTED at tick 1500 at the NE
      # fog corner via scheduled_events. No briefing pre-disclosure —
      # discovery comes from `enemy_unit_spotted` + `units_summary`.
      scheduled_events:
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [90, 8], stance: 3, count: 4}
    win_condition:
      all_of:
        - units_killed_gte: 8
        - has_building: fact
        - own_units_gte: 2
        - within_ticks: 5400
    fail_condition:
      any_of:
        - after_ticks: 5401
        - not: {has_building: fact}
        - not: {own_units_gte: 1}
    max_turns: 90

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled variable: 2nd wave from TWO fog corners (NE + SE)
  # so the surprise direction flips per seed via 2 agent spawn_point
  # groups (NORTH base y=12 / SOUTH base y=28). Enemy actors ignore
  # spawn_point (CLAUDE.md) — both Wave-2 squads always place. The
  # AGENT spawn round-robins between NORTH and SOUTH, so the SAME-
  # latitude surprise hits FIRST (closer geometry) and the OPPOSITE-
  # latitude one is the late follow-on. The model cannot memorise a
  # single fog-corner heading.
  #
  # Wave-2 squads are 4 e1 each (4 + 4 = 8 wave-2 units + 4 wave-1 =
  # 12 total) and the kill bar is raised to 9 — both waves together
  # produce more than enough kills if the defender screen survives,
  # but a forward chase or attrition bust cannot reach 9 before the
  # screen is wiped. Same clock; same tick-aligned fail.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Adversarial robustness — surprise second wave (hard). The obvious
    # 4-unit cluster sits at the centre. Your base round-robins between a
    # NORTH and a SOUTH latitude per seed so the spatial disposition
    # cannot be memorised. Your 7 pre-placed defenders (4 medium tanks + 3
    # rocket soldiers) are your ENTIRE force — no barracks, no cash. To
    # WIN you must, before tick 5400, kill ≥9 enemy units AND still have
    # your construction yard (fact) standing AND still have ≥2 of your
    # own units alive. The defenders auto-fire on whatever enters their
    # arc but never advance on their own — you must actively command them
    # to concentrate fire. Stalling (the passive garrison is swarmed
    # piecemeal and wiped) or attrition bust LOSE.
    description: >
      Obvious 4-rifle centre wave. Your base flips north/south by seed.
      Seven defenders, no reinforcements. Command interceptions actively.
      Nine kills, yard alive, two units alive, within about 60 turns.
    overrides:
      actors:
        # ── spawn_point 0 — NORTH base (y=12). ─────────────────────
        # Hard fields a HEAVIER 7-unit garrison (4× 2tnk + 3× e3,
        # vs the 5 of easy/medium): hard's surprise is TWO Wave-2
        # squads (NE + SE corners), so the actively-commanded screen
        # needs the extra mass to hold both the opening rush and the
        # follow-on on either spawn corner. A stall stays a LOSS —
        # stance:2 keeps an idle 7-garrison just as passive (it is
        # swarmed piecemeal and wiped, kills never reach the bar).
        - {type: fact, owner: agent, position: [10, 12], spawn_point: 0}
        - {type: proc, owner: agent, position: [6,  12], spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 12], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 10], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 14], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14,  8], stance: 2, spawn_point: 0}
        - {type: e3,   owner: agent, position: [16, 11], stance: 2, spawn_point: 0}
        - {type: e3,   owner: agent, position: [16, 13], stance: 2, spawn_point: 0}
        - {type: e3,   owner: agent, position: [16,  9], stance: 2, spawn_point: 0}
        # ── spawn_point 1 — SOUTH base (y=28). ─────────────────────
        - {type: fact, owner: agent, position: [10, 28], spawn_point: 1}
        - {type: proc, owner: agent, position: [6,  28], spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 28], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 26], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 30], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 32], stance: 2, spawn_point: 1}
        - {type: e3,   owner: agent, position: [16, 27], stance: 2, spawn_point: 1}
        - {type: e3,   owner: agent, position: [16, 29], stance: 2, spawn_point: 1}
        - {type: e3,   owner: agent, position: [16, 31], stance: 2, spawn_point: 1}
        # Wave 1 — obvious 4-unit cluster at the centre on the mid
        # latitude (y=20). The hunt bot drives them toward the
        # nearest agent target so the cluster naturally engages
        # whichever base is occupied, after a ~one-second detour
        # toward the mid-latitude.
        - {type: e1, owner: enemy, position: [80, 20], stance: 3, count: 4}
        - {type: fact, owner: enemy, position: [120, 20]}
      # Wave 2 — TWO 4-unit squads INJECTED at tick 1500 at BOTH fog
      # corners (NE y=8 and SE y=32) via scheduled_events. No briefing
      # pre-disclosure — discovery comes from `enemy_unit_spotted` +
      # `units_summary`. Whichever corner is at the same latitude as
      # the agent's spawn group reaches the base FIRST (the EARLY
      # surprise), the OPPOSITE-latitude squad arrives LATER (the
      # LATE follow-on).
      scheduled_events:
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [90, 8],  stance: 3, count: 4}
            - {type: e1, owner: enemy, position: [90, 32], stance: 3, count: 4}
    win_condition:
      all_of:
        - units_killed_gte: 9
        - has_building: fact
        - own_units_gte: 2
        - within_ticks: 5400
    fail_condition:
      any_of:
        - after_ticks: 5401
        - not: {has_building: fact}
        - not: {own_units_gte: 1}
    max_turns: 90
