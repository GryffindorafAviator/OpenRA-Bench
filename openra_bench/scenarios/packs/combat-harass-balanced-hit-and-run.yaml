# combat-harass-balanced-hit-and-run — BALANCED pulsed harass (Wave-4)
#
# 2026-05-23 audit (Family-1 #10): map shrunk from rush-hour-arena
# (128x40) to a tailored 96x40 arena (3/4 the old width). The
# guard-aggro / leash / cluster-spread distances are load-bearing for
# this doctrine and can't compress below ~96 cells of width without
# breaking the discriminator: the kill bar is 3 and the COMMIT
# policy (charge the cluster, ignore the tank) can land 3 worker
# kills WHILE the slow 3tnk (speed 71 vs jeep 113) is still closing,
# unless the jeep has to spend ~12 turns transiting from the west
# edge to reach the cluster. The OLD geometry is preserved exactly
# in 96x40: workers along y=10 from x=72..92, the leashed 3tnk guard
# one bracket-row off at (82,5), rally line at x=50 (32 cells from
# the post — well past GUARD_LEASH=18). Briefing rewritten per
# audits/EDIT_PRINCIPLES.md.
#
# The win predicate makes RETREAT load-bearing — not merely allowed.
# Two fast jeeps (RAIDERS) must score N kills against a cluster of
# soft enemy infantry (e1 rifle workers, stance:0 — passive)
# overwatched by a leashed HEAVY TANK (3tnk) posted a few cells off
# the cluster. The jeep's M60mg is an anti-infantry weapon — it
# shreds the e1 workers but cannot dent the 3tnk's heavy armour; the
# 3tnk's cannon, conversely, one-shots a jeep inside a single
# decision turn. So a jeep that lingers in the guard's envelope until
# the kill bar is met is destroyed before it can disengage
# (units_lost_lte:0 = perfect retreat bar).
#
# Bar (no defect / no cheat — units_lost_lte:0 on EVERY level):
#   - stall (only observe)                -> LOSS (kill bar unmet)
#   - retreat-only (never engage)         -> LOSS (kill bar unmet)
#   - commit-and-stay (charge & sit)      -> LOSS (jeep dies to tank)
#   - brute (attack-nearest incl. guard)  -> LOSS (jeep lost to tank)
#   - intended hit-run-cycle (pulse)      -> WIN (zero losses)

meta:
  id: combat-harass-balanced-hit-and-run
  title: 'Balanced Hit-and-Run — Pulsed Worker Harass under a Leashed Defender'
  capability: reasoning
  real_world_meaning: >
    BALANCED pulsed harassment under a reactive defender. Two fast
    raiders (jeeps) must score N kills against a cluster of soft enemy
    workers overwatched by a leashed HEAVY TANK (anti-vehicle, immune
    to the jeeps' anti-infantry MG and lethal to them in one volley).
    The defender holds its post a few cells off the cluster but lunges
    at any foe within AGGRO=16 of the post and snaps back past
    LEASH=18. Committing inside the guard's cannon envelope until the
    workers die loses jeeps (cap is 0 on medium — the BALANCED bar is
    that retreat ACTUALLY worked). Sitting out of aggro never scores.
    The only winning policy is the pulse: approach to MG range of the
    workers → strike one → retreat past leash → guard snaps back →
    re-engage → repeat. Retreat is load-bearing — the first pack in
    the bench where it is required, not merely permitted.
  robotics_analogue: >
    Pulsed manipulation under a reactive guarding agent: the policy
    must complete a sequence of small reward-bearing actions inside
    the guard's intervention radius, then disengage past the leash
    before damage is taken, then re-enter — without taking any hit at
    all. A commit-until-done policy gets damaged; a stand-off policy
    never scores. The temporal structure of the reward (cycle of
    engage / disengage) is what is being tested.
  benchmark_anchor:
    - "SC2 muta-harass / sentry-harass (pulsed engagement)"
    - "military guerrilla warfare (hit-and-run doctrine)"
    - "pulsed-load attack with retaliation avoidance"
    - "RTS balanced harass: kill workers without losing raiders"
  author: openra-bench

# Tailored 96x40 open arena: cordon-only (no interior obstacles) so
# the pulse cycle's mobility is pure unit-on-unit geometry. Raiders
# start at x=6 on the worker latitude; workers spread along y=10 from
# x=72 to x=92; the 3tnk guard sits ONE bracket-row off the lane at
# (82,5); rally line at x=50 (32 cells from the post — past
# GUARD_LEASH=18).
base_map:
  generator: arena
  name: combat-harass-balanced-arena
  width: 96
  height: 40
  cordon: 2
  spawns: [[6, 20]]
  title: Combat Harass Balanced Arena 96x40

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: guard}
  tools: [move_units, attack_unit, stop]
  planning: true
  termination: {max_ticks: 6500}
  actors: []

levels:
  # ── EASY ── the bare hit-and-run skill: 5 soft workers (kill bar 3),
  # 1 guard, the BALANCED zero-loss bar. Idle and retreat-only lose on
  # the clock; commit-and-stay and brute both LOSE a jeep to the 3tnk
  # cannon before the 3-kill bar is met. The intended pulse — strike
  # one worker, retreat past the leash, re-engage — clears the bar
  # with zero losses.
  easy:
    description: >
      Commander, this is a worker-harass mission. You are given 2
      jeeps (fast wheeled MG vehicles) on the west edge at y=10. The
      enemy has 5 unarmed worker infantry along y=10 from x=72 to
      x=88. One enemy heavy tank stands one row north of the workers
      at (82,5) — your jeep machine guns CANNOT scratch its armour,
      and its cannon will one-shot a jeep in two turns. The tank
      guards its post: it lunges at any of your jeeps within about
      16 cells of (82,5), and snaps back past about 18 cells. Score
      3 kills and lose ZERO jeeps, within 5400 ticks.
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [6, 10], stance: 1, count: 2}
        - {type: e1, owner: enemy, position: [72, 10], stance: 0}
        - {type: e1, owner: enemy, position: [76, 10], stance: 0}
        - {type: e1, owner: enemy, position: [80, 10], stance: 0}
        - {type: e1, owner: enemy, position: [84, 10], stance: 0}
        - {type: e1, owner: enemy, position: [88, 10], stance: 0}
        - {type: 3tnk, owner: enemy, position: [82, 5], stance: 2}
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {units_lost_lte: 0}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {units_lost_lte: 0}}
        - {not: {own_units_gte: 1}}
    max_turns: 62

  # ── MEDIUM ── +1 controlled variable vs easy: a larger 6-worker
  # cluster (kill bar 3 of 6 — more soft targets to cherry-pick).
  # Same BALANCED zero-loss bar. The guard one bracket-row off the
  # lane lunges into cannon range fast; committing is strictly fatal.
  medium:
    description: >
      Commander, this is a worker-harass mission with a larger
      target cluster. You are given 2 jeeps (fast wheeled MG
      vehicles) on the west edge at y=10. Six enemy unarmed worker
      infantry stretch along y=10 from x=72 to x=92. One enemy heavy
      tank stands one row north at (82,5) — your machine guns cannot
      dent it, its cannon one-shots a jeep. The tank guards its
      post: it lunges at anything within about 16 cells of (82,5),
      and snaps back past about 18 cells. Score 3 kills and lose
      ZERO jeeps, within 5400 ticks.
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [6, 10], stance: 1, count: 2}
        - {type: e1, owner: enemy, position: [72, 10], stance: 0}
        - {type: e1, owner: enemy, position: [76, 10], stance: 0}
        - {type: e1, owner: enemy, position: [80, 10], stance: 0}
        - {type: e1, owner: enemy, position: [84, 10], stance: 0}
        - {type: e1, owner: enemy, position: [88, 10], stance: 0}
        - {type: e1, owner: enemy, position: [92, 10], stance: 0}
        - {type: 3tnk, owner: enemy, position: [82, 5], stance: 2}
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {units_lost_lte: 0}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {units_lost_lte: 0}}
        - {not: {own_units_gte: 1}}
    max_turns: 62

  # ── HARD ── +2 controlled variables vs medium: the worker cluster
  # is duplicated across TWO latitudes (NORTH y=10 and SOUTH y=30),
  # each with its own leashed 3tnk guard, and 2 spawn_point groups
  # round-robin the raider start latitude by seed. The BALANCED bar
  # holds: kill 3 workers, lose ZERO jeeps.
  hard:
    description: >
      Commander, this is a pulsed worker-harass mission with twin
      cluster lanes. You are given 4 jeeps staged in the north (y=10)
      or south (y=30) lane depending on seed. Each lane has six unarmed
      worker infantry along x=72..92 on the lane latitude, and a heavy
      tank one row off the lane (north lane: post (82,5); south lane:
      post (82,35)). Your jeep machine guns cannot scratch the heavy's
      armour, and its cannon will one-shot a jeep. It guards its post:
      any of your jeeps that comes within about 16 cells makes it lunge,
      and it snaps back past about 18. Engage whichever cluster your
      spawn opens onto: strike a worker, retreat west of the cluster,
      let the heavy snap back, then re-engage. Three kills, zero jeeps
      lost, within about 60 turns.
    overrides:
      actors:
        # spawn_point 0 — NORTHERN raider staging (y=10)
        - {type: jeep, owner: agent, position: [6, 10], stance: 1, count: 2,
           spawn_point: 0}
        # spawn_point 1 — SOUTHERN raider staging (y=30)
        - {type: jeep, owner: agent, position: [6, 30], stance: 1, count: 2,
           spawn_point: 1}
        # NORTH cluster — 6 e1 at y=10, guard 3tnk one row OUTSIDE
        # (north of) the lane at (82,5).
        - {type: e1, owner: enemy, position: [72, 10], stance: 0}
        - {type: e1, owner: enemy, position: [76, 10], stance: 0}
        - {type: e1, owner: enemy, position: [80, 10], stance: 0}
        - {type: e1, owner: enemy, position: [84, 10], stance: 0}
        - {type: e1, owner: enemy, position: [88, 10], stance: 0}
        - {type: e1, owner: enemy, position: [92, 10], stance: 0}
        - {type: 3tnk, owner: enemy, position: [82, 5], stance: 2}
        # SOUTH cluster — 6 e1 at y=30, guard 3tnk one row OUTSIDE
        # (south of) the lane at (82,35). Mirror across y=20.
        - {type: e1, owner: enemy, position: [72, 30], stance: 0}
        - {type: e1, owner: enemy, position: [76, 30], stance: 0}
        - {type: e1, owner: enemy, position: [80, 30], stance: 0}
        - {type: e1, owner: enemy, position: [84, 30], stance: 0}
        - {type: e1, owner: enemy, position: [88, 30], stance: 0}
        - {type: e1, owner: enemy, position: [92, 30], stance: 0}
        - {type: 3tnk, owner: enemy, position: [82, 35], stance: 2}
        # Far-east persistent marker (keeps episode alive past wipe).
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {units_lost_lte: 0}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {units_lost_lte: 0}}
        - {not: {own_units_gte: 1}}
    max_turns: 62
