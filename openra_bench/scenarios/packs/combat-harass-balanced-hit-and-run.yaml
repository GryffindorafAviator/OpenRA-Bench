# combat-harass-balanced-hit-and-run — BALANCED pulsed harass (Wave-4)
#
# The first pack in the bench whose win predicate makes RETREAT
# load-bearing — not merely allowed. Two fast jeeps (RAIDERS) must
# score N kills against a cluster of soft enemy infantry (e1 rifle
# workers, stance:0 — passive) overwatched by a leashed HEAVY TANK
# (3tnk) posted a few cells off the cluster. The jeep's M60mg is an
# anti-infantry weapon — it shreds the e1 workers but cannot dent the
# 3tnk's heavy armour; the 3tnk's cannon, conversely, one-shots a jeep
# inside a single decision turn. So a jeep that lingers in the guard's
# envelope until the kill bar is met is destroyed before it can
# disengage (units_lost_lte:0 on medium/hard = perfect retreat bar).
# The only winning policy is the pulsed (BALANCED) harass-retreat
# cycle:
#
#   1. Approach the worker cluster from the west (along the cluster
#      latitude).
#   2. STRIKE — fire MG into the soft workers from MG range.
#   3. The guard is posted off the cluster — when the jeep enters
#      AGGRO=16 of the post, the guard LUNGES toward the jeep.
#   4. RETREAT west past the leash (>18 from post) so the guard
#      snaps back to its post.
#   5. RE-ENGAGE the next worker. Cycle until the kill bar is met
#      WITHOUT losing any jeep.
#
# Armour-class mechanics make this work (engine balance fix — armour-
# class weapon selection): the jeep MG is anti-infantry, so it cannot
# kill the 3tnk guard head-on — committing trades the jeep's life for
# nothing. The offset geometry (guard a few cells off the workers)
# gives a strike window before the lunging guard's cannon bears —
# exactly long enough for the pulse to score and disengage.
#
# This is the BALANCED variant of the harass-retreat triple — neither
# all-in commit (combat-harass-aggressive) nor stand-off feint
# (combat-harass-conservative); the pulse cadence is the controlled
# variable.
#
# Bar (no defect / no cheat):
#   • stall (only observe)                → LOSS (kill bar unmet, clock)
#   • commit-and-stay (charge & sit)      → LOSS (jeep dies to the tank)
#   • brute (attack-nearest incl. guard)  → LOSS (jeep lost to the tank)
#   • retreat-only (never engage)         → LOSS (kill bar unmet)
#   • intended hit-run-cycle              → WIN
#
# Recalibrated 2026-05-20 after the engine balance fixes (armour-class
# weapon selection, stance semantics): the previous design used
# harvesters as score targets, but post-fix the jeep MG cannot damage
# a harvester's heavy armour (and harvesters crush jeeps), so the kill
# bar became unsatisfiable. Score targets are now soft e1 workers (the
# jeep MG one-shots them); the leashed guard is a 3tnk heavy tank (the
# genuine un-killable threat that mandates retreat).
#
# Real-world anchor:
#   SC2 muta-harass / sentry-harass (pulsed engagement with mandatory
#   disengage on enemy reinforcement); guerrilla warfare; pulsed-load
#   attack with retaliation avoidance. Harassment whose ROI is
#   measured in "kill workers without losing raiders" — a strictly
#   stronger bar than damage-traded harass.

meta:
  id: combat-harass-balanced-hit-and-run
  title: 'Balanced Hit-and-Run — Pulsed Worker Harass under a Leashed Defender'
  capability: reasoning
  real_world_meaning: >
    BALANCED pulsed harassment under a reactive defender. Two fast
    raiders (jeeps) must score N kills against a cluster of soft enemy
    workers overwatched by a leashed HEAVY TANK (anti-vehicle, immune
    to the jeeps' anti-infantry MG and lethal to them in one volley).
    The defender holds its post a few cells off the cluster but lunges
    at any foe within AGGRO=16 of the post and snaps back past
    LEASH=18. Committing inside the guard's cannon envelope until the
    workers die loses jeeps (cap is 0 on medium — the BALANCED bar is
    that retreat ACTUALLY worked). Sitting out of aggro never scores.
    The only winning policy is the pulse: approach to MG range of the
    workers → strike one → retreat past leash → guard snaps back →
    re-engage → repeat. Retreat is load-bearing — the first pack in
    the bench where it is required, not merely permitted.
  robotics_analogue: >
    Pulsed manipulation under a reactive guarding agent: the policy
    must complete a sequence of small reward-bearing actions inside
    the guard's intervention radius, then disengage past the leash
    before damage is taken, then re-enter — without taking any hit at
    all. A commit-until-done policy gets damaged; a stand-off policy
    never scores. The temporal structure of the reward (cycle of
    engage / disengage) is what is being tested.
  benchmark_anchor:
    - "SC2 muta-harass / sentry-harass (pulsed engagement)"
    - "military guerrilla warfare (hit-and-run doctrine)"
    - "pulsed-load attack with retaliation avoidance"
    - "RTS balanced harass: kill workers without losing raiders"
  author: openra-bench

base_map: rush-hour-arena

# Topology (rush-hour-arena 128x40, playable x in [2..126], y in [2..38]):
#   Raiders (jeeps) start at the west (x=6) on the worker-cluster
#   latitude. The worker cluster (soft e1, stance:0) sits centre-east
#   spread along the cluster latitude; the leashed 3tnk guard is posted
#   a few cells off the cluster — close enough that a jeep at the
#   cluster gets the guard LUNGING into cannon range within a decision
#   turn (AGGRO=16) but offset enough to leave a one-strike window
#   before the cannon bears. Retreating west past the leash (>18 from
#   the post) triggers snap-back.
#   Far-east `fact` keeps the episode alive past the kill moment so
#   the win/fail evaluator sees the terminal state (no auto-done on
#   enemy wipe collapsing to DRAW).
base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: guard}
  tools: [move_units, attack_unit, stop]
  planning: true
  termination: {max_ticks: 6500}
  actors:
    # RAIDERS — 2 jeeps at the west on the worker-cluster latitude.
    # Fast (the only reason hit-and-run is feasible) and fragile (the
    # reason retreat is mandatory against the heavy tank).
    - {type: jeep, owner: agent, position: [6, 10], stance: 1, count: 2}
    # SCORE TARGETS — soft e1 rifle workers, stance:0 (passive).
    - {type: e1, owner: enemy, position: [74, 10], stance: 0}
    - {type: e1, owner: enemy, position: [80, 10], stance: 0}
    - {type: e1, owner: enemy, position: [86, 10], stance: 0}
    - {type: e1, owner: enemy, position: [92, 10], stance: 0}
    # THE LEASHED GUARD — one 3tnk heavy tank (anti-vehicle cannon,
    # heavy armour) posted off the cluster. AGGRO=16 ⇒ guard lunges at
    # any foe within 16 of its post; LEASH=18 ⇒ snaps back past 18.
    # The jeep MG cannot dent the 3tnk; the 3tnk cannon one-shots a
    # jeep — so a lingering jeep dies, a retreating one survives.
    - {type: 3tnk, owner: enemy, position: [83, 22], stance: 2}
    # Persistent enemy `fact` marker (far east, unarmed high-HP) keeps
    # the episode alive past the moment the last worker dies — the win/
    # fail evaluator must see the terminal units_killed=N + units_lost
    # state instead of engine auto-done on enemy wipe collapsing to
    # DRAW.
    - {type: fact, owner: enemy, position: [124, 20]}

levels:
  # ── EASY ── the bare hit-and-run skill: 4 soft workers (kill bar 2),
  # 1 guard, attrition cap of 1 (allows ONE mistake — a single jeep
  # loss is still winnable if the surviving jeep finishes the bar).
  # Idle and retreat-only lose on the clock; brute (charge east into
  # the guard / attack the lunging tank) loses both jeeps before the
  # bar is met.
  easy:
    description: >
      Two jeeps (RAIDERS) at the west (y=10) must kill TWO of FOUR soft
      enemy workers (e1) spread along x=74..92 at y=10. One leashed
      heavy tank (3tnk) posts off the cluster at (83,22): it lunges at
      any foe within 16 cells of its post and snaps back past 18. The
      jeep MG cannot dent the tank's heavy armour; the tank's cannon
      one-shots a jeep. Pulse: approach east along y=10 to MG range of
      a worker, strike, retreat west past x=58 so the guard snaps back,
      re-approach. Lose at most 1 jeep — before tick 5400. Idling,
      charge-into-the-guard, and retreat-only all LOSE.
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [6, 10], stance: 1, count: 2}
        - {type: e1, owner: enemy, position: [74, 10], stance: 0}
        - {type: e1, owner: enemy, position: [80, 10], stance: 0}
        - {type: e1, owner: enemy, position: [86, 10], stance: 0}
        - {type: e1, owner: enemy, position: [92, 10], stance: 0}
        - {type: 3tnk, owner: enemy, position: [83, 22], stance: 2}
        - {type: fact, owner: enemy, position: [124, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 2}
        - {units_lost_lte: 1}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {units_lost_lte: 1}}
        - {not: {own_units_gte: 1}}
    max_turns: 62

  # ── MEDIUM ── +1 controlled variable: 6 workers (kill bar 3) and the
  # BALANCED bar — units_lost_lte: 0 (perfect retreat). The guard is
  # posted close to the cluster so it lunges into cannon range fast;
  # committing is strictly fatal (the 3tnk will kill a jeep before the
  # 3rd worker falls). The policy must pulse — strike, disengage past
  # the leash, re-engage — without taking the cannon.
  medium:
    description: >
      Two jeeps (RAIDERS) at the west (y=10) must kill THREE of SIX
      soft enemy workers (e1) spread along x=74..94 at y=10. One
      leashed heavy tank (3tnk) posts close off the cluster at (84,14):
      aggro 16, leash 18. The BALANCED bar: lose ZERO jeeps — retreat
      must actually work. The jeep MG cannot dent the tank; the tank
      one-shots a jeep. Pulse: approach east along y=10 to MG range of
      a worker, strike, retreat west past the leash so the guard snaps
      back, re-engage. Idling, commit-and-stay (a jeep dies), brute
      charge (attacks the un-killable tank and dies), and retreat-only
      (kill bar unmet) all LOSE — before tick 5400.
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [6, 10], stance: 1, count: 2}
        - {type: e1, owner: enemy, position: [74, 10], stance: 0}
        - {type: e1, owner: enemy, position: [78, 10], stance: 0}
        - {type: e1, owner: enemy, position: [82, 10], stance: 0}
        - {type: e1, owner: enemy, position: [86, 10], stance: 0}
        - {type: e1, owner: enemy, position: [90, 10], stance: 0}
        - {type: e1, owner: enemy, position: [94, 10], stance: 0}
        - {type: 3tnk, owner: enemy, position: [84, 14], stance: 2}
        - {type: fact, owner: enemy, position: [124, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {units_lost_lte: 0}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {units_lost_lte: 0}}
        - {not: {own_units_gte: 1}}
    max_turns: 62

  # ── HARD ── +2 controlled variables vs medium: the worker cluster is
  # duplicated across TWO latitudes (NORTH y=10 and SOUTH y=30), each
  # with its own leashed 3tnk guard, and 2 spawn_point groups
  # round-robin the raider start latitude by seed — so the approach
  # vector and the per-cluster retreat line vary by seed and the
  # raiders engage whichever cluster their spawn faces. The BALANCED
  # bar holds: kill 3 workers, lose ZERO jeeps. Brute (attack-nearest,
  # which switches onto the lunging tank) loses a jeep.
  hard:
    description: >
      Two jeeps must kill THREE soft enemy workers (e1). The worker
      cluster is mirrored across two latitudes (NORTH y=10 and SOUTH
      y=30), each cluster of SIX e1 overwatched by a leashed 3tnk heavy
      tank posted close off it (aggro 16, leash 18). Raider start
      latitude varies by seed (north y=10 or south y=30) — the raiders
      face whichever cluster their spawn opens onto. The BALANCED bar:
      lose ZERO jeeps. Pulse: approach east to MG range of a worker,
      strike, retreat past the leash, re-engage. The jeep MG cannot
      dent the tank — brute-charging it loses a jeep. Before tick 5400.
      Idling, commit-and-stay, and retreat-only all LOSE.
    overrides:
      actors:
        # spawn_point 0 — NORTHERN raider staging (y=10)
        - {type: jeep, owner: agent, position: [6, 10], stance: 1, count: 2,
           spawn_point: 0}
        # spawn_point 1 — SOUTHERN raider staging (y=30)
        - {type: jeep, owner: agent, position: [6, 30], stance: 1, count: 2,
           spawn_point: 1}
        # NORTH cluster — 6 e1 at y=10, guard 3tnk at (84,14).
        - {type: e1, owner: enemy, position: [74, 10], stance: 0}
        - {type: e1, owner: enemy, position: [78, 10], stance: 0}
        - {type: e1, owner: enemy, position: [82, 10], stance: 0}
        - {type: e1, owner: enemy, position: [86, 10], stance: 0}
        - {type: e1, owner: enemy, position: [90, 10], stance: 0}
        - {type: e1, owner: enemy, position: [94, 10], stance: 0}
        - {type: 3tnk, owner: enemy, position: [84, 14], stance: 2}
        # SOUTH cluster — 6 e1 at y=30, guard 3tnk at (84,26). Mirror
        # of the north cluster across y=20 so either raider spawn
        # faces an equivalent leashed-guard pulse target.
        - {type: e1, owner: enemy, position: [74, 30], stance: 0}
        - {type: e1, owner: enemy, position: [78, 30], stance: 0}
        - {type: e1, owner: enemy, position: [82, 30], stance: 0}
        - {type: e1, owner: enemy, position: [86, 30], stance: 0}
        - {type: e1, owner: enemy, position: [90, 30], stance: 0}
        - {type: e1, owner: enemy, position: [94, 30], stance: 0}
        - {type: 3tnk, owner: enemy, position: [84, 26], stance: 2}
        # Far-east persistent marker (keeps episode alive past wipe).
        - {type: fact, owner: enemy, position: [124, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {units_lost_lte: 0}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {units_lost_lte: 0}}
        - {not: {own_units_gte: 1}}
    max_turns: 62
