# def-pre-position-mobile-reserve.yaml
#
# REASONING capability — Group C "defence positioning" seed: pre-
# positioning a MOBILE armoured reserve at the CENTRE of the
# engagement zone so it can MOVE FORWARD and intercept rushers at
# their lane mouth. Sibling of `def-position-expected-direction`
# (commit pbox to the *expected* flank; build-based) and
# `def-surprise-flank-react` (replan when the expected flank was
# wrong). This pack is the COMBAT-ONLY counterpart: no build tools —
# the model only moves an armoured reserve, and the decision is
# WHERE to commit it forward.
#
# Real-world anchors:
#   - Military "general reserve" / "covering force" doctrine: the
#     reserve is held centrally, uncommitted, until the threat
#     direction localises; then it commits FORWARD, as a unit, toward
#     the lane that materialised.
#   - Chess-piece centralization: a centralised knight/queen REACHES
#     more squares than a flank-committed one. A centralised reserve
#     can REACH either flank in equal time; a flank-committed reserve
#     cannot reach the opposite flank fast enough.
#   - Rapid-response force doctrine (fire brigade, QRF, on-call SRE):
#     responders are staged at a hub; on alert they MOVE OUT to the
#     localised site. Staying at the hub satisfies no objective.
#   - MicroRTS reactive defence from centre.
#
# DISCRIMINATIONS (the bar — every lazy / wrong-commit play LOSES,
# the intended centre-then-react play WINS):
#
#   • stall (observe only): the stance:2 reserve auto-fires only on
#     whatever closes into the static cluster, but NEVER MOVES OUT
#     of its starting cell. The FORWARD-zone clause
#     (`units_in_region_gte` at the lane-mouth intercept point) is
#     therefore never satisfied → LOSS on the position clause.
#
#   • commit-NORTH (whole reserve sent north on turn 1): on easy
#     (rush IS from NORTH) this matches the lane and satisfies the
#     N forward zone → WIN. On medium (BOTH flanks active) only the
#     N zone is satisfied — the S forward-zone clause fails → LOSS.
#     On hard (three flanks N/S/E active) only the N zone is
#     satisfied → S and E clauses fail → LOSS.
#
#   • commit-SOUTH: symmetric to commit-NORTH — LOSS on easy
#     (NORTH-only rush; S zone is wrong + N zone empty) and LOSS on
#     medium/hard (other flanks unaddressed).
#
#   • intended centre-then-react: on easy, send the whole reserve
#     toward the spotted N band — tanks reach the N forward zone
#     (60,12) r=10. On medium, SPLIT the reserve (or stagger) so
#     ≥1 tank lands in EACH of the N (60,14) r=12 and S (60,26)
#     r=12 forward zones. On hard, split THREE ways so ≥1 tank
#     lands in EACH of the N (60,12) r=10, CENTRE (65,20) r=12,
#     and S (60,28) r=10 forward zones. WIN on every seed.
#
# ENGINE FACTS used (CLAUDE.md / SCENARIO_QUALITY.md):
#   - `hunt` bot — each enemy unit attacks the NEAREST agent unit,
#     so a band placed in lane Y engages whichever reserve
#     detachment the agent committed to lane Y; the flanks are
#     genuinely independent.
#   - Agent tanks are `stance:2` (Defend): they auto-fire on an
#     in-range enemy but NEVER advance — so a stall reserve cannot
#     self-deliver across the map.
#   - Inert enemy `fact` marker far east (anti-DRAW): without a
#     persistent enemy actor the engine auto-`done`s on enemy-elim
#     before the win/fail evaluator runs.
#   - `enemy_unit_spotted` interrupt → reserve re-decides the instant
#     a rusher band becomes visible.
#   - `own_unit_destroyed` interrupt → re-decide on tank loss.
#   - `units_in_region_gte: {x, y, radius, n}` — load-bearing
#     position clause: forces the reserve to MOVE FORWARD (not just
#     auto-defend at the centre).
#   - 2tnk vs e1: tanks dominate per-shot (CLAUDE.md /
#     combat-focus-fire-priority).
#
# Validate (no model / no network):
#   python3 -m pytest tests/test_def_pre_position_mobile_reserve.py -q

meta:
  id: def-pre-position-mobile-reserve
  title: 'Central Reserve — Stage Mobile Force at Centre, Move Out to Intercept'
  capability: reasoning
  real_world_meaning: >
    A rush is incoming, but the flank it will arrive from is uncertain
    at decision time. A small mobile armoured reserve is pre-staged
    at the centre of the engagement zone — equidistant from both
    candidate flanks. The reserve MUST move OUT of the centre toward
    the localised threat lane(s) to intercept the rush before it
    reaches the construction yard. Pre-committing to one flank wins
    only when the rush arrives on that flank and LOSES otherwise
    (the reserve cannot pivot back in time); holding passively at
    the centre lets the auto-engagement kill some attackers but
    satisfies no forward-zone objective. The canonical answer is
    centralisation + forward commitment — military "general reserve"
    / chess centralization doctrine.
  robotics_analogue: >
    Quick-reaction force / on-call incident responder: the responder
    is stationed at a hub equidistant from candidate incident sites,
    not committed to any one site in advance. When an alert localises
    the incident, the responder DEPLOYS FORWARD to that site —
    staying at the hub or committing in advance to the wrong site
    both fail the response SLA.
  benchmark_anchor:
    - "military reserve doctrine (central reserve responds to any flank)"
    - "chess-piece centralization principle"
    - "rapid-response force doctrine"
    - "MicroRTS reactive defense from centre"
  author: openra-bench

# Bespoke 80×40 arena (F3 §25 map-shrink). Agent base at the west
# (fact at x=10), rush spawns near the eastern lane mouths (x=68).
# The reserve stages at x=40 — the geometric centre of the
# engagement zone, equidistant in y from north (y=10) and south
# (y=30) flanks. Pre-shrink the pack used rush-hour-arena (128×40)
# with ~40 cells of empty east traversal east of the rush spawn —
# `large-trivial` per F3 audit. The shrunk arena keeps the
# reserve↔rush-mouth geometry intact while cutting the empty
# pre/post traversal.
base_map: rush-hour-arena
starting_cash: 0

base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    # `hunt`: each enemy unit attacks the NEAREST agent unit, so a
    # band placed in lane Y engages whatever reserve detachment the
    # agent committed to lane Y — each flank is an independent
    # threat.
    bot_type: hunt
  tools:
    - observe
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination:
    max_ticks: 6000
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare reserve-MOVE skill: ONE rush band, FIXED direction (NORTH
  # y=10 every seed). The capability is "move the reserve OUT to
  # intercept the rush at its lane mouth". stance:2 tanks auto-fire
  # only on whatever closes into the static cluster, but the
  # FORWARD-zone clause is the load-bearing discriminator: stall
  # keeps tanks at (40,20) → outside the (60,12) r=10 zone → LOSS.
  easy:
    description: >
      Your Construction Yard sits at the west edge; a four-tank reserve
      stands at the centre of the map, equidistant from both flanks. A
      rifle rush is inbound from the NORTH. Destroy at least four
      attackers, keep at least one tank alive, and have at least two
      tanks inside a forward intercept disc around the north lane mouth
      at the deadline, within about 27 turns.
    overrides:
      base_map:
        generator: arena
        name: def-pre-position-mr-easy-arena
        width: 80
        height: 40
        cordon: 2
        title: def-pre-position-mobile-reserve easy 80x40
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: 2tnk, owner: agent, position: [40, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [40, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [40, 21], stance: 2}
        - {type: 2tnk, owner: agent, position: [41, 20], stance: 2}
        - {type: e1, owner: enemy, position: [72, 10], stance: 3, count: 6}
        # Inert enemy `fact` marker far east (anti-DRAW).
        - {type: fact, owner: enemy, position: [76, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 4}
        - {own_units_gte: 1}
        - {units_in_region_gte: {x: 60, y: 12, radius: 10, n: 2}}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {has_building: fact}}
        - {not: {own_units_gte: 1}}
    max_turns: 50

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: TWO simultaneous bands from BOTH flanks
  # (NORTH y=10 and SOUTH y=30). The win clause requires `all_of`
  # BOTH forward zones to hold ≥1 tank — the reserve MUST SPLIT or
  # stagger sends so both lanes are addressed.
  medium:
    description: >
      Your Construction Yard sits at the west edge; a six-tank reserve
      stands at the centre. Two rush bands incoming — one from the
      NORTH lane (y≈10) and one from the SOUTH lane (y≈30). Destroy at
      least six attackers, keep at least two tanks alive, and have at
      least one tank in EACH of the north and south forward intercept
      discs at the deadline, within about 27 turns.
    overrides:
      base_map:
        generator: arena
        name: def-pre-position-mr-medium-arena
        width: 80
        height: 40
        cordon: 2
        title: def-pre-position-mobile-reserve medium 80x40
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: 2tnk, owner: agent, position: [40, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [40, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [40, 21], stance: 2}
        - {type: 2tnk, owner: agent, position: [41, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [41, 20], stance: 2}
        - {type: 2tnk, owner: agent, position: [41, 21], stance: 2}
        - {type: e1, owner: enemy, position: [72, 10], stance: 3, count: 5}
        - {type: e1, owner: enemy, position: [72, 30], stance: 3, count: 5}
        - {type: fact, owner: enemy, position: [76, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {own_units_gte: 2}
        - {units_in_region_gte: {x: 60, y: 14, radius: 12, n: 1}}
        - {units_in_region_gte: {x: 60, y: 26, radius: 12, n: 1}}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {has_building: fact}}
        - {not: {own_units_gte: 1}}
    max_turns: 50

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled variable on top of medium: THREE rush directions
  # (N y=10, S y=30, E y=20 head-on) AND a strict attrition cap
  # (units_lost_lte: 2) AND ≥2 agent spawn_point groups so the
  # reserve's starting cell varies per seed (x=40 vs x=50).
  hard:
    description: >
      Your Construction Yard sits at the west edge; a twelve-tank
      reserve stands at a seed-chosen central column. Three rush bands
      incoming — NORTH (y≈10), CENTRE (y≈20 head-on), and SOUTH
      (y≈30). Destroy at least six attackers, keep at least two tanks
      alive, lose no more than two, and have at least one tank in EACH
      of the north, centre, and south forward intercept discs at the
      deadline, within about 27 turns.
    overrides:
      base_map:
        generator: arena
        name: def-pre-position-mr-hard-arena
        width: 80
        height: 40
        cordon: 2
        title: def-pre-position-mobile-reserve hard 80x40
      actors:
        # Agent fact duplicated across BOTH spawn_point groups at the
        # SAME cell.
        - {type: fact, owner: agent, position: [10, 20], spawn_point: 0}
        - {type: fact, owner: agent, position: [10, 20], spawn_point: 1}
        # spawn_point 0 — reserve at centre column x=40.
        - {type: 2tnk, owner: agent, position: [40, 19], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [40, 20], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [40, 21], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [41, 19], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [41, 20], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [41, 21], stance: 2, spawn_point: 0}
        # spawn_point 1 — reserve at centre column x=50.
        - {type: 2tnk, owner: agent, position: [45, 19], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [45, 20], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [45, 21], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [46, 19], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [46, 20], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [46, 21], stance: 2, spawn_point: 1}
        # THREE rush bands — N (y=10), S (y=30), E (y=20 head-on).
        - {type: e1, owner: enemy, position: [72, 10], stance: 3, count: 4}
        - {type: e1, owner: enemy, position: [72, 30], stance: 3, count: 4}
        - {type: e1, owner: enemy, position: [74, 20], stance: 3, count: 4}
        # Inert enemy `fact` marker far east, off-axis so the head-on
        # east band doesn't path through it.
        - {type: fact, owner: enemy, position: [76, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {own_units_gte: 2}
        - {units_lost_lte: 2}
        - {units_in_region_gte: {x: 60, y: 12, radius: 10, n: 1}}
        - {units_in_region_gte: {x: 65, y: 20, radius: 12, n: 1}}
        - {units_in_region_gte: {x: 60, y: 28, radius: 10, n: 1}}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {has_building: fact}}
        - {not: {own_units_gte: 1}}
        - {not: {units_lost_lte: 2}}
    max_turns: 50
