# def-with-ambush.yaml
#
# REASONING capability — FOG-AMBUSH doctrine: hidden flanking
# defenders pre-positioned OFF the direct enemy axis on HoldFire
# (stance:0), concealed in silence. The agent's load-bearing
# decision is WHEN to TRIGGER the ambush — flip the flankers from
# HoldFire to AttackAnything (stance:3) once the enemy column has
# walked into the L-ambush crossfire envelope. A premature trigger
# fires through the screen at long range and trades poorly; a
# missed trigger leaves the flankers silent while the band rolls
# over the rifleman screen and razes the construction yard. The
# intended play is reactive: hold silence until the band is in the
# kill zone, THEN flip stance and let the engine's auto-engage do
# the work.
#
# Engine recalibration note (movement + stance fixes): the engine
# movement fixes — (A) attack_unit on an out-of-sight target paths
# at real speed instead of teleporting, and (B) a moving unit fires
# AND takes fire en route (no sprint-invincibility) — combined with
# the four-stance semantics (stance:0 HoldFire never auto-engages
# even when attacked) make a TRIGGER pack expressible: the flankers
# are placed at stance:0 so a stall / observe-only policy collects
# zero kills and the band reaches the base. The agent must issue
# `set_stance(<flanker_ids>, 3)` to open the engagement.
#
# Wrong-play taxonomy (every cell, every seed must LOSE):
#   • STALL — observe-only. stance:0 flankers stay silent; the
#     band walks past them, razes the rifleman screen, and either
#     destroys the fact or runs out the clock with zero kills.
#   • CHARGE — attack-move the flankers forward into the open.
#     With no sprint-invincibility the charging tanks take fire
#     while closing, string out, and meet the heavier band head-on
#     with no crossfire → out-attritioned, kill bar missed.
#   • PILE-ON-FACT — pull the flankers back and stack them on
#     the construction yard. The crossfire envelope at the lane
#     is abandoned; the thin stacked force is crowded against
#     the building and ground down by the band → kill bar
#     missed / fact razed / attrition cap busted.
# The intended TRIGGER play (set_stance → 3 once the band closes
# into the crossfire envelope) WINS every level + seed.
#
# Real-world anchors:
#   - StarCraft 2 hidden defense / proxy-ambush doctrine.
#   - Classical military ambush doctrine (Roman Cannae flanks,
#     Vietnam jungle ambush, modern infantry L-ambush).
#   - Fog-of-war asymmetric warfare.
#
# Validate (no model / no network):
#   python3 -m pytest tests/test_def_with_ambush.py -q

meta:
  id: def-with-ambush
  title: 'Fog Ambush — Hold the Hidden Flank, Let the Enemy Walk Past'
  capability: reasoning
  real_world_meaning: >
    Defenders are pre-staged in concealment OFF the direct enemy
    axis, forming an L-ambush crossfire at the lane. A static
    fixing element at the choke draws the enemy push down the lane;
    the concealed flanking elements remain hidden until the band
    commits, then strike from BOTH flanks. Breaking the ambush —
    charging the flankers forward to meet the push in the open, or
    pulling them back onto the construction yard — abandons the
    crossfire geometry: the charging force strings out and is
    out-attritioned head-on, and the stacked force is crowded
    against the base and ground down. The canonical answer is to
    HOLD the ambush positions and let the engine auto-engage on
    sight as the band passes. SC2 hidden-defense / military
    ambush doctrine.
  robotics_analogue: >
    Concealed intrusion-detection sensors / honeypot networks /
    silent-alarm doctrine: instrumented assets remain off the
    intruder's primary path and trigger when the intruder commits
    past them. Moving the sensors out of their concealed
    positions — forward to confront the intruder, or back onto the
    asset being protected — defeats the asymmetry of concealment.
  benchmark_anchor:
    - "SC2 hidden defense"
    - "military ambush doctrine"
    - "fog warfare"
  author: openra-bench

base_map:
  generator: arena
  name: def-with-ambush-arena
  width: 128
  height: 48
starting_cash: 0

base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    # Rusher concentrates the band on the foe nearest the agent
    # centroid — the centroid sits on the base row, so the band
    # drives WEST on the base row and walks past the off-row
    # crossfire.
    bot_type: rusher
  tools:
    - observe
    - move_units
    - attack_unit
    - attack_move
    - stop
    - set_stance
  planning: true
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination:
    max_ticks: 6000
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare ambush-TRIGGER skill: ONE light rusher band on y=20. Four
  # 2tnk flankers — two at (35,17) and two at (35,23) — sit on
  # stance:0 (HoldFire). The agent must `set_stance(flankers, 3)`
  # once the band has walked into the crossfire envelope (within
  # the ~4-cell 2tnk weapon range of the flankers) to open the
  # engagement. Stall keeps stance:0 → no kills → LOSS.
  easy:
    description: >
      Your Construction Yard sits at the west edge. A single rifleman
      screens the choke just east of the yard. Four medium tanks hide
      off-axis on the north and south flanks of the central lane, four
      cells off the y=20 path. A light enemy band drives west on y=20.
      Kill at least six attackers, keep the yard intact, and lose no
      more than two tanks, within about 27 turns.
    overrides:
      base_map:
        generator: arena
        name: def-with-ambush-easy-arena
        width: 80
        height: 40
        cordon: 2
        title: def-with-ambush easy 80x40
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: e1, owner: agent, position: [15, 20], stance: 1}
        # Flankers — NORTH at (35,16)/(36,16) (4 cells off y=20).
        - {type: 2tnk, owner: agent, position: [35, 17], stance: 0}
        - {type: 2tnk, owner: agent, position: [36, 17], stance: 0}
        # Flankers — SOUTH at (35,24)/(36,24).
        - {type: 2tnk, owner: agent, position: [35, 23], stance: 0}
        - {type: 2tnk, owner: agent, position: [36, 23], stance: 0}
        # Rusher band — 4× 1tnk + 4× e3 + 4× e1 (12 total).
        - {type: 1tnk, owner: enemy, position: [65, 20], stance: 3, count: 4}
        - {type: e3, owner: enemy, position: [67, 20], stance: 3, count: 4}
        - {type: e1, owner: enemy, position: [69, 20], stance: 3, count: 4}
        # Inert enemy `fact` marker far east (anti-DRAW).
        - {type: fact, owner: enemy, position: [77, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_lost_lte: 2}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {units_lost_lte: 2}}
    max_turns: 50

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: HEAVIER band (more 1tnk + e3).
  medium:
    description: >
      Your Construction Yard sits at the west edge. A single rifleman
      screens the choke just east of the yard. Four medium tanks hide
      off-axis on the north and south flanks of the central lane, four
      cells off the y=20 path. A heavier enemy band — light tanks,
      rocket soldiers and rifles together — drives west on y=20. Kill
      at least eight attackers, keep the yard intact, and lose no more
      than three tanks, within about 27 turns.
    overrides:
      base_map:
        generator: arena
        name: def-with-ambush-medium-arena
        width: 80
        height: 40
        cordon: 2
        title: def-with-ambush medium 80x40
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: e1, owner: agent, position: [15, 20], stance: 1}
        # 6 flankers — 3 NORTH + 3 SOUTH (wider arc, more burst).
        - {type: 2tnk, owner: agent, position: [34, 17], stance: 0}
        - {type: 2tnk, owner: agent, position: [35, 17], stance: 0}
        - {type: 2tnk, owner: agent, position: [36, 17], stance: 0}
        - {type: 2tnk, owner: agent, position: [34, 23], stance: 0}
        - {type: 2tnk, owner: agent, position: [35, 23], stance: 0}
        - {type: 2tnk, owner: agent, position: [36, 23], stance: 0}
        # HEAVY band — 3× 1tnk + 6× e3 + 6× e1 (15 total). Lighter on
        # anti-vehicle so 6 flankers can sustain the crossfire long
        # enough to clear the kill bar without busting attrition.
        - {type: 1tnk, owner: enemy, position: [65, 20], stance: 3, count: 3}
        - {type: e3, owner: enemy, position: [67, 20], stance: 3, count: 6}
        - {type: e1, owner: enemy, position: [69, 20], stance: 3, count: 6}
        - {type: fact, owner: enemy, position: [77, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 8}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_lost_lte: 3}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {units_lost_lte: 3}}
    max_turns: 50

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled variable on top of medium: 2 spawn_point groups
  # (NORTH base y=8 / SOUTH base y=32 round-robined by seed). The
  # fact + fixing defender + flankers all flip latitude per seed,
  # and the enemy band declares the SAME spawn_point so exactly
  # ONE concentrated band places at the matching latitude.
  hard:
    description: >
      Your Construction Yard sits at the west edge in either the NORTH
      (y=8) or SOUTH (y=32) band by seed. A single rifleman screens the
      choke just east of the yard; four medium tanks hide off-axis on
      the two flanks of the base row, four cells off the lane. A heavy
      mixed band drives west on the base row. Kill at least eight
      attackers, keep the yard intact, and lose no more than three
      tanks, within about 27 turns.
    overrides:
      base_map:
        generator: arena
        name: def-with-ambush-hard-arena
        width: 80
        height: 40
        cordon: 2
        title: def-with-ambush hard 80x40
      actors:
        # ── spawn_point 0 — NORTH base at y=8 ──────────────────
        - {type: fact, owner: agent, position: [10, 8], spawn_point: 0}
        - {type: e1, owner: agent, position: [15, 8], stance: 1, spawn_point: 0}
        # 6 flankers — 3 north of the base row + 3 south of it
        # (3 cells off the base row).
        - {type: 2tnk, owner: agent, position: [34, 5], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [35, 5], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [36, 5], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [34, 11], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [35, 11], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [36, 11], stance: 0, spawn_point: 0}
        # ── spawn_point 1 — SOUTH base at y=32 ─────────────────
        - {type: fact, owner: agent, position: [10, 32], spawn_point: 1}
        - {type: e1, owner: agent, position: [15, 32], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [34, 29], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [35, 29], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [36, 29], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [34, 35], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [35, 35], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [36, 35], stance: 0, spawn_point: 1}
        # ── Enemy band per latitude, tagged with matching
        # spawn_point so exactly ONE band places at the active
        # latitude.
        - {type: 1tnk, owner: enemy, position: [65, 8], stance: 3, count: 3, spawn_point: 0}
        - {type: e3, owner: enemy, position: [67, 8], stance: 3, count: 6, spawn_point: 0}
        - {type: e1, owner: enemy, position: [69, 8], stance: 3, count: 6, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [65, 32], stance: 3, count: 3, spawn_point: 1}
        - {type: e3, owner: enemy, position: [67, 32], stance: 3, count: 6, spawn_point: 1}
        - {type: e1, owner: enemy, position: [69, 32], stance: 3, count: 6, spawn_point: 1}
        # Inert enemy `fact` marker far east (anti-DRAW) —
        # duplicated per enemy spawn_point group.
        - {type: fact, owner: enemy, position: [77, 8], spawn_point: 0}
        - {type: fact, owner: enemy, position: [77, 32], spawn_point: 1}
    win_condition:
      all_of:
        - {units_killed_gte: 8}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_lost_lte: 3}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {units_lost_lte: 3}}
    max_turns: 50
