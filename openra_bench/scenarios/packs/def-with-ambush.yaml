# def-with-ambush.yaml
#
# REASONING capability — FOG-AMBUSH doctrine: hidden flanking
# defenders pre-positioned OFF the direct enemy axis, holding their
# concealed crossfire positions, catch the enemy band in an L-ambush
# from BOTH flanks as it advances down the lane toward the
# construction yard. The held crossfire shreds the strung-out
# enemy column before it can consolidate; BREAKING the ambush —
# charging the flankers forward to meet the band in the open, or
# piling them back onto the construction yard — abandons the
# crossfire geometry and a thin defender force is out-attritioned.
#
# Engine recalibration note (movement fixes):
#   The engine movement fixes — (A) attack_unit on an out-of-sight
#   target now paths at real speed instead of teleporting, and
#   (B) a moving unit fires AND takes fire en route (no
#   sprint-invincibility) — shifted combat balance bench-wide. The
#   old discriminator ("centralise to the choke loses") inverted:
#   a tight tank cluster funnelled at a choke is now genuinely
#   strong RTS play and no longer a losing move, so it was retired
#   as a wrong policy. The pack now discriminates the held
#   crossfire ambush against the two genuine wrong plays the engine
#   fixes leave load-bearing:
#     • CHARGE — attack-move the flankers forward out of the
#       ambush to meet the band in the open. With no
#       sprint-invincibility the charging tanks take fire while
#       closing, string out, and meet the heavier band head-on
#       with no crossfire → out-attritioned, kill bar missed.
#     • PILE-ON-FACT — pull the flankers back and stack them on
#       the construction yard. The crossfire envelope at the lane
#       is abandoned; the thin stacked force is crowded against
#       the building (cannot all bring weapons to bear) and is
#       ground down by the band → kill bar missed / fact razed /
#       attrition cap busted.
#   The intended HOLD play keeps the flankers in their concealed
#   crossfire positions (observe-only — they are on Defend stance
#   and auto-engage in weapon range) and WINS every level + seed.
#
# Real-world anchors:
#   - StarCraft 2 hidden defense / proxy-ambush doctrine: defenders
#     in unscouted territory wait for the enemy push to commit
#     down-lane, then strike from the flank when the band is
#     committed. Charging the ambush force forward to meet the
#     push, or pulling it back onto the base, collapses the
#     positional advantage.
#   - Classical military ambush doctrine (Roman Cannae flanks,
#     Vietnam jungle ambush, modern infantry L-ambush): concealed
#     elements positioned outside the enemy's scout cone hold
#     until the column is committed, then engage from the
#     unexpected axis. Breaking concealment early (charging the
#     killing element forward) forfeits the ambush.
#   - Fog-of-war asymmetric warfare: the side with positional
#     concealment trades a numeric disadvantage for surprise. The
#     ambush is destroyed the instant the hidden element moves
#     out of position before the trap is sprung.
#
# DISCRIMINATIONS (the bar — every lazy / wrong policy LOSES, the
# intended hold-the-ambush-positions policy WINS):
#
#   • the intended HOLD policy is observe-only — the flankers
#     carry stance:2 (Defend) and auto-fire from their held
#     crossfire posts, so "do nothing / hold position" IS the
#     capability. The test is positional discipline (NOT moving
#     the flankers), not active micro.
#
#   • charge (attack-move all flankers EAST at the band): the
#     flankers LEAVE the (40,16)/(40,24) crossfire positions on
#     turn 1 and close on the band in the open. With the engine
#     no-sprint-invincibility fix they take fire while moving,
#     string out along the lane, and meet the heavier band
#     head-on with no crossfire — out-attritioned every level,
#     kill bar missed → LOSS.
#
#   • pile-on-fact (move all flankers to the fact at the west
#     edge): the flankers MOVE WEST, abandon the crossfire
#     envelope and stack against the construction yard. Crowded
#     against the building they cannot all bring weapons to
#     bear; the thin stacked force is ground down by the band →
#     kill bar missed / fact razed / attrition cap busted → LOSS.
#
#   • intended HOLD-AMBUSH-POSITIONS (do nothing, or explicitly
#     stop): the flankers REMAIN at (40,16)/(40,24). When the
#     band reaches x≈40 on y=20, both ambush groups have the
#     band's units inside 2tnk weapon range (4 cells from
#     y=16/24 to y=20). stance:2 (Defend) auto-fires from the
#     held post; the band takes flanking fire from BOTH sides
#     simultaneously (an L-ambush) while strung out in a column.
#     Fact survives, kill bar met, attrition cap held → WIN.
#
# ENGINE FACTS used (CLAUDE.md / SCENARIO_QUALITY.md):
#   - rush-hour-arena (128×40 playable, x in [2..126], y in [2..38]).
#   - `rusher` bot CONCENTRATES the band on the foe nearest the
#     agent CENTROID every ~8 ticks (openra-sim/src/scripted_bot.rs::
#     Rusher). The centroid (4 flankers + 1 fixing defender + fact,
#     all on/near y=20) sits on y=20, so the band drives WEST on
#     y=20 toward the choke — passing through the ambush kill zone
#     at x=40.
#   - 2tnk WEAPON range reaches ~4 cells off-axis: a stance:2 2tnk
#     held at y=16/y=24 auto-fires on the band passing x=40 on
#     y=20. The flankers are off the direct y=20 path (hidden
#     until the band commits) but in weapon range.
#   - stance:2 (Defend) on the flankers — the engine auto-fires
#     on any foe in WEAPON range while the tank HOLDS its post
#     (never advances). stance:3 (AttackAnything) is NOT used: it
#     would make the flankers HUNT the band and abandon the
#     crossfire zone. The DISCRIMINATOR is POSITION — the flankers
#     must REMAIN at the crossfire coordinates; the model does NOT
#     need to issue attack orders.
#   - Inert enemy `fact` marker far east (anti-DRAW): without a
#     persistent enemy actor the engine auto-`done`s on enemy-elim
#     before the win/fail evaluator runs (CLAUDE.md footgun).
#   - `enemy_unit_spotted` interrupt → re-decide the instant the
#     rusher band crosses into the fixing defender's sight.
#   - `own_unit_destroyed` interrupt → re-decide on any tank loss.
#   - `units_killed_gte` paired with `building_count_gte:{type:fact}`,
#     `units_lost_lte` and `within_ticks` — the brief's win predicate.
#   - `after_ticks` + `not building_count_gte:fact` +
#     `not units_lost_lte:N` as the fail clause — fact-razed,
#     deadline, and over-attrition are all real LOSSES.
#   - max_turns 50 → reachable tick ≈ 3000 in interrupt mode,
#     ≈ 4503 fixed-step; `within_ticks: 2400` and `after_ticks:
#     2401` are both reachable inside max_turns so the deadline
#     bites as a real LOSS (not a draw degeneracy).
#
# Validate (no model / no network):
#   python3 -m pytest tests/test_def_with_ambush.py -q

meta:
  id: def-with-ambush
  title: 'Fog Ambush — Hold the Hidden Flank, Let the Enemy Walk Past'
  capability: reasoning
  real_world_meaning: >
    Defenders are pre-staged in concealment OFF the direct enemy
    axis, forming an L-ambush crossfire at the lane. A static
    fixing element at the choke draws the enemy push down the lane;
    the concealed flanking elements remain hidden until the band
    commits, then strike from BOTH flanks. Breaking the ambush —
    charging the flankers forward to meet the push in the open, or
    pulling them back onto the construction yard — abandons the
    crossfire geometry: the charging force strings out and is
    out-attritioned head-on, and the stacked force is crowded
    against the base and ground down. The canonical answer is to
    HOLD the ambush positions and let the engine auto-engage on
    sight as the band passes. SC2 hidden-defense / military
    ambush doctrine.
  robotics_analogue: >
    Concealed intrusion-detection sensors / honeypot networks /
    silent-alarm doctrine: instrumented assets remain off the
    intruder's primary path and trigger when the intruder commits
    past them. Moving the sensors out of their concealed
    positions — forward to confront the intruder, or back onto the
    asset being protected — defeats the asymmetry of concealment.
  benchmark_anchor:
    - "SC2 hidden defense"
    - "military ambush doctrine"
    - "fog warfare"
  author: openra-bench

base_map:
  generator: arena
  name: def-with-ambush-arena
  width: 128
  height: 48
starting_cash: 0

base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    # Rusher concentrates the band on the foe nearest the agent
    # centroid — the centroid sits on y=20, so the band drives
    # WEST on y=20 and walks past the (40,16)/(40,24) crossfire.
    bot_type: rusher
  # Combat-only toolset (no build / no harvest): the test is the
  # HOLD / break-the-ambush positional decision, not production.
  tools:
    - observe
    - move_units
    - attack_unit
    - attack_move
    - stop
    - set_stance
  planning: true
  # React the instant a rusher unit is spotted by the fixing
  # defender (the "hold or break" decision boundary) and on any
  # own-unit loss.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination:
    max_ticks: 6000
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare ambush-HOLD skill: ONE light rusher band on y=20. Four
  # 2tnk flankers — two at (40,16)/(41,16) and two at
  # (40,24)/(41,24) — auto-fire from a HELD post (stance:2 Defend;
  # 4 cells off the y=20 lane is inside the ~4-cell 2tnk weapon
  # range). The fixing defender at (15,20) is a single e1 that
  # exists to (a) draw the centroid, (b) give the band a
  # nearest-foe target so it commits west, and (c) trip the
  # enemy_unit_spotted interrupt. CHARGE (attack-move the flankers
  # east) meets the band head-on with no crossfire and is
  # out-attritioned; PILE-ON-FACT (stack the flankers on the
  # construction yard) abandons the crossfire and the thin stacked
  # force misses the kill bar / busts the attrition cap.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Your construction yard (fact) sits at the west edge (10,20). A
    # single rifleman defender holds the choke at (15,20). Four 2tnk
    # flankers are concealed OFF the direct y=20 path — two at (40,16) and
    # two at (40,24), each group 4 cells off the y=20 lane (inside their
    # weapon range) but outside the enemy's scout cone. A light enemy
    # rusher band approaches from the east on y=20. HOLD the flankers in
    # their concealed crossfire positions (do not move them) — they are on
    # Defend stance and auto-engage from their held posts when the band
    # walks into the kill zone. Charging the flankers forward to meet the
    # band, or pulling them back onto the fact, abandons the crossfire
    # envelope and the thin force is out-attritioned. Win: ≥6 enemies
    # killed AND your fact still standing AND ≤2 tanks lost AND finish
    # before tick 2400. Lose on the deadline, if the fact is razed, or if
    # more than 2 tanks are lost.
    description: >
      Your yard at (10,20) is screened by one rifleman at (15,20); four
      medium tanks hide off-axis at (40,16) and (40,24), four cells off
      the y=20 lane. A light enemy band drives east on y=20. Hold the
      flankers on Defend stance in their crossfire pockets — moving them
      breaks the L-ambush. Six kills, loss cap two, yard intact, within
      about 27 turns.
    overrides:
      actors:
        # Agent construction yard — WEST, the band's target via
        # the rusher centroid.
        - {type: fact, owner: agent, position: [10, 20]}
        # Fixing defender — single e1 at the choke. stance:1
        # ReturnFire so it engages back when fired upon (but does
        # not chase).
        - {type: e1, owner: agent, position: [15, 20], stance: 1}
        # Flankers — NORTH group at (40,16)/(41,16). y=16 is 4
        # cells off the y=20 lane — INSIDE the 2tnk weapon range
        # (~4 cells) so a stance:2 (Defend) tank holding its post
        # auto-fires on the band as it passes x=40, while still
        # off the direct y=20 path. stance:2 (NOT stance:3):
        # stance:3 AttackAnything would make the flankers HUNT and
        # abandon the crossfire zone; stance:2 holds the post and
        # auto-fires in range — the ambush-HOLD behaviour.
        - {type: 2tnk, owner: agent, position: [40, 16], stance: 2}
        - {type: 2tnk, owner: agent, position: [41, 16], stance: 2}
        # Flankers — SOUTH group, mirror at y=24.
        - {type: 2tnk, owner: agent, position: [40, 24], stance: 2}
        - {type: 2tnk, owner: agent, position: [41, 24], stance: 2}
        # Rusher band — mixed light tanks + rocket/rifle infantry
        # on y=20. The 1tnk component lingers in the kill zone
        # long enough for the stance:2 crossfire to clear the kill
        # bar; the e3 rockets make a head-on CHARGE / a stacked
        # PILE-ON force out-attritioned. 4× 1tnk + 4× e3 + 4× e1
        # (12 total).
        - {type: 1tnk, owner: enemy, position: [78, 20], stance: 3, count: 4}
        - {type: e3, owner: enemy, position: [80, 20], stance: 3, count: 4}
        - {type: e1, owner: enemy, position: [82, 20], stance: 3, count: 4}
        # Inert enemy `fact` marker far east (anti-DRAW): without
        # it the engine auto-`done`s on enemy-elim before the
        # win/fail evaluator runs.
        - {type: fact, owner: enemy, position: [120, 20]}
    # HOLD keeps the stance:2 flankers in their (40,16)/(40,24)
    # crossfire positions — 4 cells off the y=20 lane, inside 2tnk
    # weapon range — so the L-ambush crossfire shreds the strung-
    # out band and trades only ~2 tanks (kill bar met, fact safe).
    # CHARGE meets the band head-on with no crossfire (kill bar
    # missed, ≥3 tanks lost); PILE-ON-FACT stacks the flankers on
    # the construction yard, crowded and ground down (kill bar
    # missed, ≥3 tanks lost). The attrition cap (units_lost_lte:2)
    # plus the kill bar make both wrong plays a real LOSS.
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_lost_lte: 2}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {units_lost_lte: 2}}
    max_turns: 50

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: HEAVIER band (more 1tnk + e3). The
  # break-the-ambush pathologies now bite HARD — a charging force
  # is out-attritioned in the open and a stacked PILE-ON force is
  # ground down and the fact is razed. HOLD-ambush still WINS
  # because the flanking stance:2 2tnk crossfire from
  # (40,16)/(40,24) shreds the band before the lead tanks reach
  # the choke.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Your construction yard (fact) sits at the west edge (10,20). A
    # single rifleman defender holds the choke at (15,20). Four 2tnk
    # flankers are concealed OFF the direct y=20 path at (40,16) and
    # (40,24). A HEAVIER enemy rusher band approaches from the east on
    # y=20 (mixed light tanks + rocket infantry + riflemen). HOLD the
    # flankers in their concealed crossfire positions so the L-ambush
    # catches the band from both sides as it commits to the choke.
    # Charging the flankers forward to meet the band, or pulling them back
    # onto the fact, abandons the crossfire: the thin force is out-
    # attritioned and the fact falls. Win: ≥8 enemies killed AND your fact
    # still standing AND ≤3 tanks lost AND finish before tick 2400. Lose
    # on the deadline, if the fact is razed, or if more than 3 tanks are
    # lost.
    description: >
      Same hidden flanker setup off the y=20 lane, but the inbound band is
      heavier — light tanks, rocket soldiers and rifles together. Keep the
      four tanks parked in their concealed crossfire positions so the
      L-ambush snaps shut on the column. Eight kills, loss cap three, yard
      intact, within about 27 turns.
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: e1, owner: agent, position: [15, 20], stance: 1}
        # Flankers — NORTH + SOUTH, stance:2 (Defend) HOLD at
        # y=16/y=24 (4 cells off the y=20 lane, inside 2tnk
        # weapon range), identical placement idiom to easy.
        - {type: 2tnk, owner: agent, position: [40, 16], stance: 2}
        - {type: 2tnk, owner: agent, position: [41, 16], stance: 2}
        - {type: 2tnk, owner: agent, position: [40, 24], stance: 2}
        - {type: 2tnk, owner: agent, position: [41, 24], stance: 2}
        # HEAVY band — 5× 1tnk + 6× e3 + 5× e1 (16 enemies). 1tnk
        # is fragile to 2tnk crossfire from y=16+y=24 (flanking
        # 2tnk salvos shred a 1tnk in 2-3 shots); the 6× e3 anti-
        # vehicle rockets out-attrition a CHARGE / a PILE-ON
        # stacked force at close range. Held in crossfire the band
        # is shredded strung-out before it can consolidate.
        - {type: 1tnk, owner: enemy, position: [78, 20], stance: 3, count: 5}
        - {type: e3, owner: enemy, position: [80, 20], stance: 3, count: 6}
        - {type: e1, owner: enemy, position: [82, 20], stance: 3, count: 5}
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 8}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_lost_lte: 3}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {units_lost_lte: 3}}
    max_turns: 50

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled variable on top of medium: 2 spawn_point groups
  # (NORTH base y=8 / SOUTH base y=32 round-robined by seed) — the
  # fact + fixing defender + flankers all flip latitude per seed,
  # and the enemy band declares the SAME spawn_point so exactly
  # ONE concentrated band places at the matching latitude (the
  # per-owner spawn_point filter, CLAUDE.md — the chosen
  # spawn_point keeps that owner's matching actors and drops the
  # rest, for BOTH owners). The band is the same heavy
  # composition as medium; only the base latitude varies. A
  # memorised "flankers at (40,16)/(40,24)" plan from one spawn
  # does not generalise: the matching crossfire coords are
  # (40,4)/(40,12) for NORTH-spawn at y=8 and (40,28)/(40,36) for
  # SOUTH-spawn at y=32. The HOLD-ambush doctrine generalises —
  # the model must keep the flankers AT THEIR SPAWN COORDS,
  # regardless of which latitude is active.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Your construction yard (fact) sits at the west edge — at either y=8
    # (NORTH base) or y=32 (SOUTH base), seed-dependent. A single rifleman
    # defender holds the choke 5 cells east of the fact. Four 2tnk
    # flankers are concealed off the direct base-row path — two on each
    # off-axis flank (4 cells off the base row). A HEAVY enemy rusher band
    # approaches from the east on the base row. HOLD the flankers in their
    # concealed crossfire positions so the L-ambush catches the band as it
    # commits to the choke. Charging the flankers forward to meet the
    # band, or pulling them back onto the fact, abandons the crossfire:
    # the thin force is out-attritioned. Win: ≥8 enemies killed AND your
    # fact still standing AND ≤3 tanks lost AND finish before tick 2400.
    # Lose on the deadline, if the fact is razed, or if more than 3 tanks
    # are lost.
    description: >
      Your yard sits at the west edge in either the NORTH (y=8) or SOUTH
      (y=32) band by seed; one rifleman screens the choke, four tanks hide
      off the base row. A heavy mixed band drives in on the base row. Hold
      the flankers in concealment — never charge or pull back — and let
      the crossfire trigger as the band commits. Eight kills, loss cap
      three, yard intact, within about 27 turns.
    overrides:
      actors:
        # ── spawn_point 0 — NORTH base at y=8 ──────────────────
        - {type: fact, owner: agent, position: [10, 8], spawn_point: 0}
        - {type: e1, owner: agent, position: [15, 8], stance: 1, spawn_point: 0}
        # Flankers — NORTH-of-base group at y=4 (4 cells off the
        # base row y=8 — INSIDE 2tnk weapon range; in-bounds y≥2).
        # stance:2 (Defend) HOLD.
        - {type: 2tnk, owner: agent, position: [40, 4], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [41, 4], stance: 2, spawn_point: 0}
        # Flankers — SOUTH-of-base group at y=12 (4 cells off the
        # base row y=8).
        - {type: 2tnk, owner: agent, position: [40, 12], stance: 2, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [41, 12], stance: 2, spawn_point: 0}
        # ── spawn_point 1 — SOUTH base at y=32 ─────────────────
        - {type: fact, owner: agent, position: [10, 32], spawn_point: 1}
        - {type: e1, owner: agent, position: [15, 32], stance: 1, spawn_point: 1}
        # Flankers — NORTH-of-base group at y=28 (4 cells off the
        # base row y=32).
        - {type: 2tnk, owner: agent, position: [40, 28], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [41, 28], stance: 2, spawn_point: 1}
        # Flankers — SOUTH-of-base group at y=36 (4 cells off the
        # base row y=32; in-bounds y ≤ 38).
        - {type: 2tnk, owner: agent, position: [40, 36], stance: 2, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [41, 36], stance: 2, spawn_point: 1}
        # ── Enemy band — one heavy band per latitude, each
        # tagged with the matching spawn_point so exactly ONE
        # concentrated band places at the active base latitude
        # (per-owner spawn_point filter — CLAUDE.md). Same heavy
        # composition as medium: 5× 1tnk + 6× e3 + 5× e1 (16
        # enemies) — heavy enough that CHARGE / PILE-ON LOSE but
        # light enough that the HOLD crossfire WINS.
        - {type: 1tnk, owner: enemy, position: [78, 8], stance: 3, count: 5, spawn_point: 0}
        - {type: e3, owner: enemy, position: [80, 8], stance: 3, count: 6, spawn_point: 0}
        - {type: e1, owner: enemy, position: [82, 8], stance: 3, count: 5, spawn_point: 0}
        - {type: 1tnk, owner: enemy, position: [78, 32], stance: 3, count: 5, spawn_point: 1}
        - {type: e3, owner: enemy, position: [80, 32], stance: 3, count: 6, spawn_point: 1}
        - {type: e1, owner: enemy, position: [82, 32], stance: 3, count: 5, spawn_point: 1}
        # Inert enemy `fact` marker far east (anti-DRAW) — must be
        # duplicated per enemy spawn_point group (the per-owner
        # filter would otherwise drop the unmatched one), one on
        # each base latitude so it stays clear of the kill path.
        - {type: fact, owner: enemy, position: [120, 8], spawn_point: 0}
        - {type: fact, owner: enemy, position: [120, 32], spawn_point: 1}
    win_condition:
      all_of:
        - {units_killed_gte: 8}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_lost_lte: 3}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
        - {not: {units_lost_lte: 3}}
    max_turns: 50
