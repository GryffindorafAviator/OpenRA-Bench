# rob-partial-base-loss-continue — continue operating after partial base loss
#
# REASONING capability — graceful degradation under partial loss. The
# agent starts with TWO bases: a FORWARD outpost (doomed: anything
# agent-owned inside the forward region is razed by a series of
# scheduled destroy pulses) and a HOME base further east on the map
# (safe: the destroy region never reaches it). HOME is seeded with a
# Construction Yard (fact) and Power Plant (powr) ONLY — it has no
# Refinery (proc) and no War Factory (weap) at start; those exist
# initially at FORWARD and are wiped out alongside everything else in
# the forward region. To "continue operating" the agent must
# RECONSTITUTE the production chain at HOME — a refinery and a war
# factory inside the home region, both alive at the deadline.
#
# Two-base strategic-retreat template (task #81):
#   START   — FORWARD (doomed) + HOME (safe), HOME unreachable by the
#             destroy region.
#   THREAT  — repeated scheduled `destroy_actors` pulses raze every
#             agent actor inside the FORWARD region (including any
#             REPLACEMENTS the agent tries to plant there).
#   WIN     — state-based at deadline: a `proc` AND a `weap` inside
#             the HOME region, plus a surviving `fact` somewhere.
#             Preemptive redundancy (building at HOME before the first
#             pulse) and reactive rebuild (building at HOME after the
#             pulse) both satisfy the predicate.
#   LOSS    — in-game and on the deadline. Stalling never builds proc
#             or weap → both region clauses unsatisfied → timeout
#             LOSS. Building at FORWARD → the next destroy pulse razes
#             it → still no region coverage → timeout LOSS. Building
#             at HOME → WIN.
#   BRIEFING (§9.5) — situation only; no scripted-policy spoilers.
#
# Real-world anchor: graceful degradation under partial system loss;
# strategic retreat from a doomed forward site to a safer rear site;
# multi-region disaster-recovery failover (the primary region keeps
# being knocked offline by an attacker; the operator must stand up
# the workload at the secondary region instead of fighting the
# attacker on the primary).
#
# DISCRIMINATION (the four-script no-cheat bar):
#   • stall (only `observe`): no proc or weap is ever built. The
#     FORWARD proc + weap are razed by the first destroy pulse, the
#     HOME base never had them → both region clauses busted →
#     after_ticks T+1 fires → timeout LOSS.
#   • build-at-forward (rebuild proc + weap inside the forward
#     region after the first pulse): the next destroy pulse razes
#     the replacements; the agent burns its cash and decision turns
#     on assets that don't survive → region clauses still busted →
#     timeout LOSS. This is the canonical strategic-retreat failure
#     the scenario is built to catch — fighting the attacker at the
#     doomed site instead of retreating to safety.
#   • build-at-home (queue proc + weap and place each inside the
#     HOME region): the destroy region never reaches them, both
#     region clauses latch the moment each building lands → WIN.
#   • do-both (preemptive redundancy: build proc + weap at HOME
#     BEFORE the first pulse, while the forward base is still alive):
#     the HOME copies survive every pulse → same WIN. The predicate
#     credits both the preemptive and the reactive path equally —
#     a rational operator who notices the threat would pre-build at
#     HOME; one who only reacts after the first pulse can still
#     recover. Both LOSS modes above remain LOSSES.
#
# ENGINE NOTES (CLAUDE.md / SCENARIO_QUALITY.md):
#  - `scheduled_events: destroy_actors` removes every actor matching
#    `filter: {owner, region:{x,y,radius}}` exactly once at its
#    declared tick (oramap.rs::read_scheduled_events /
#    env.rs::fire_scheduled_events, pinned by
#    openra-data/tests/test_scheduled_events.rs). To make REBUILDS
#    inside the same region also die, the pack declares a SERIES of
#    destroy pulses at staggered ticks. Each pulse fires only once,
#    so the timing axis is "between pulses the agent has a window
#    that's shorter than the proc+weap build cost". Easy/medium use
#    4 pulses; hard uses 5 (one extra late pulse to bite a late-game
#    rebuild attempt). The first pulse fires at tick 600 — after the
#    agent's first ~7 decision turns so the loss is observed
#    mid-episode.
#  - `proc` (cost 1400) and `weap` (cost 2000) both require `powr`
#    as a tech prereq (gamerules.rs). HOME is pre-placed with both
#    `fact` and `powr` so both items are buildable from tick 0; the
#    agent does NOT need to build powr at home first.
#  - `place_building` does NOT enforce build-adjacency (CLAUDE.md).
#    A proc or weap queued at the (shared) Building queue can be
#    placed at any in-bounds cell with one `place_building` order
#    — including the far HOME region from the FORWARD fact, or
#    vice-versa.
#  - Map: 128×40 with playable bounds (2,2,124,36). FORWARD region
#    centred at (20, 18), radius 10 — covers x∈[10,30], y∈[8,28].
#    HOME region centred at (100, 18), radius 10 — covers
#    x∈[90,110], y∈[8,28]. The two regions are ~80 cells apart so
#    the destroy radius cannot accidentally clip the HOME base.
#  - Persistent enemy `fact` far east at (120, 20) keeps the engine
#    from auto-`done`'ing on all-enemies-eliminated (CLAUDE.md). The
#    enemy `turtle` bot holds position — there is no roaming threat
#    that could confound the destroy-pulse discrimination.
#  - Tick budget: easy/medium max_turns 60 ⇒ ceiling 93 + 90·59 =
#    5403 ⇒ within_ticks 5400 + after_ticks 5401 are reachable, a
#    non-finisher LOSES (not draws), the win/fail windows don't
#    overlap. Hard max_turns 60 ⇒ same ceiling; the harder pulse
#    cadence makes the rebuild window tighter without changing the
#    deadline.
#  - The hard tier declares ≥2 agent `spawn_point` groups (NORTH-
#    flank scout at (50,10) on spawn 0; SOUTH-flank scout at (50,30)
#    on spawn 1). The FORWARD + HOME bases are SHARED across both
#    groups at identical cells (per the CLAUDE.md per-owner spawn
#    filter — any agent actor with a spawn_point forces every agent
#    actor without one to be filtered out). `scheduled_events` do
#    NOT honour spawn_point, so the destroy pulses fire on every
#    seed and target the same FORWARD region in both groups.
#
# Validate (no model / no network):
#   python3 -m pytest tests/test_rob_partial_base_loss_continue.py -q

meta:
  id: rob-partial-base-loss-continue
  title: 'Graceful Degradation — Continue Operating From the Safe Rear Base'
  capability: reasoning
  real_world_meaning: >
    Continue operating after the partial loss of a doomed forward
    site. The operator starts with two production sites: a FORWARD
    outpost that is repeatedly hit by an exogenous strike (anything
    placed there gets razed) and a HOME site further to the rear
    that the strike never reaches. The HOME site is seeded with only
    the construction yard and a power source — the agent must
    RECONSTITUTE its production chain (refinery and war factory) at
    HOME to continue operating. A rational operator either
    pre-positions the redundant production at HOME before the first
    pulse (preemptive redundancy) or RETREATS to HOME the moment the
    first pulse lands (reactive rebuild). The brittle failure mode is
    fighting the attacker on the doomed site — rebuilding refinery /
    war factory inside the forward region, where the next pulse razes
    them again.
  robotics_analogue: >
    Multi-region disaster-recovery failover. A workload's primary
    region keeps being knocked offline by an attacker the operator
    cannot evict. The standby region is safe but seeded only with
    the bare control plane (the equivalent of the construction yard
    and power) — the data plane (refinery / war factory) has to be
    stood up there from scratch to continue operating. The intended
    play is to stop fighting the attacker on the primary region and
    bring the missing services online in the secondary, either
    preemptively (continuous redundancy) or reactively (fail over
    after the first outage). The brittle play is to keep relaunching
    the data plane on the primary region after every outage.
  benchmark_anchor:
    - "graceful degradation"
    - "strategic retreat"
    - "two-base failover"
    - "multi-region disaster recovery"
    - "PlanBench replanning under exogenous loss"
  author: "openra-bench"

# rush-hour-arena: 128×40, playable bounds (2,2,124,36). FORWARD region
# centred at (20,18) r=10 contains the doomed outpost; HOME region
# centred at (100,18) r=10 contains the safe rear base. ~80 cells
# between centres so the destroy radius can never clip HOME.
base_map:
  generator: arena
  name: rob-partial-base-loss-continue-arena
  width: 128
  height: 40
starting_cash: 5000

base:
  agent:
    faction: allies
    cash: 5000
  enemy:
    faction: soviet
    # `turtle` (Wave-2 scripted bot) — no roaming offence. The only
    # threat is the scripted destroy pulses; the enemy `fact` marker
    # far east is the engine auto-done guard.
    bot_type: turtle
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  termination:
    max_ticks: 7000

levels:
  # ── EASY ────────────────────────────────────────────────────────
  # Bare retreat skill. FORWARD outpost (fact + proc + powr + weap +
  # harv) is razed by a series of four destroy pulses at ticks
  # 600 / 1800 / 3000 / 4200. HOME (fact + powr only) is safe. The
  # agent must build a Refinery (proc, cost 1400) AND a War Factory
  # (weap, cost 2000) and place each inside the HOME region —
  # 5000 cr is exactly enough for both (1400 + 2000 = 3400; the
  # remainder covers misclicks).
  easy:
    description: >
      Two bases. FORWARD at (20,18): construction yard, refinery, power,
      war factory, ore truck. HOME at (100,18): construction yard plus
      power only. Around tick 600 and every 1200 ticks after that, a
      hostile pulse razes everything you own inside the forward region
      (radius 10 around (20,18)); the home region (radius 10 around
      (100,18)) is never touched. Win by having a refinery inside the
      home region AND a war factory inside the home region, with at
      least one construction yard still standing, within about 60
      turns. Building only at the forward base never survives the
      pulses; stalling never builds anything.
    starting_cash: 5000
    overrides:
      actors:
        # FORWARD outpost (doomed). Everything inside the (20,18) r=10
        # circle is razed at every pulse.
        - {type: fact, owner: agent, position: [16, 18]}
        - {type: proc, owner: agent, position: [18, 16]}
        - {type: powr, owner: agent, position: [20, 18]}
        - {type: weap, owner: agent, position: [22, 16]}
        - {type: harv, owner: agent, position: [18, 18]}
        # HOME base (safe). fact + powr only — agent must BUILD the
        # proc + weap and place them inside this region.
        - {type: fact, owner: agent, position: [100, 18]}
        - {type: powr, owner: agent, position: [102, 18]}
        # Neutral ore mines near the forward outpost (feed the
        # original harv until the first pulse razes it).
        - {type: mine, owner: neutral, position: [18, 14]}
        - {type: mine, owner: neutral, position: [22, 14]}
        # Persistent enemy `fact` far east — engine auto-done guard.
        - {type: fact, owner: enemy, position: [120, 20]}
      # Series of destroy pulses razing every agent actor inside the
      # FORWARD region. Each pulse fires once at its declared tick,
      # so any replacement built before the next pulse also dies.
      scheduled_events:
        - tick: 600
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 20, y: 18, radius: 10}
        - tick: 1800
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 20, y: 18, radius: 10}
        - tick: 3000
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 20, y: 18, radius: 10}
        - tick: 4200
          type: destroy_actors
          filter:
            owner: agent
            region: {x: 20, y: 18, radius: 10}
    win_condition:
      all_of:
        - building_in_region:
            {x: 100, y: 18, radius: 10, type: proc, count: 1}
        - building_in_region:
            {x: 100, y: 18, radius: 10, type: weap, count: 1}
        - has_building: fact
        - within_ticks: 5403
    fail_condition:
      any_of:
        - after_ticks: 5404
        - not: {has_building: fact}
    max_turns: 60

  # ── MEDIUM ──────────────────────────────────────────────────────
  # +1 controlled variable: a TIGHTER pulse cadence (600 / 1500 /
  # 2400 / 3300 / 4200) so a late-arriving rebuilder at HOME has
  # less safety margin. The five pulses also tighten the cost of
  # any forward-rebuild attempt — every 900 ticks the replacements
  # die again. The cash budget and HOME seed are identical to easy
  # so the difficulty axis is purely pulse cadence.
  medium:
    description: >
      Same two bases as easy: forward at (20,18) with the full chain;
      home at (100,18) with only the construction yard and a power
      plant. The pulse cadence is tighter — destroy pulses fire around
      ticks 600, 1500, 2400, 3300, and 4200, razing everything inside
      the forward region each time. Win by having a refinery and a war
      factory inside the home region (radius 10 around (100,18)) with
      a construction yard still standing, within about 60 turns.
    starting_cash: 5000
    overrides:
      actors:
        - {type: fact, owner: agent, position: [16, 18]}
        - {type: proc, owner: agent, position: [18, 16]}
        - {type: powr, owner: agent, position: [20, 18]}
        - {type: weap, owner: agent, position: [22, 16]}
        - {type: harv, owner: agent, position: [18, 18]}
        - {type: fact, owner: agent, position: [100, 18]}
        - {type: powr, owner: agent, position: [102, 18]}
        - {type: mine, owner: neutral, position: [18, 14]}
        - {type: mine, owner: neutral, position: [22, 14]}
        - {type: fact, owner: enemy, position: [120, 20]}
      scheduled_events:
        - tick: 600
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
        - tick: 1500
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
        - tick: 2400
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
        - tick: 3300
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
        - tick: 4200
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
    win_condition:
      all_of:
        - building_in_region:
            {x: 100, y: 18, radius: 10, type: proc, count: 1}
        - building_in_region:
            {x: 100, y: 18, radius: 10, type: weap, count: 1}
        - has_building: fact
        - within_ticks: 5403
    fail_condition:
      any_of:
        - after_ticks: 5404
        - not: {has_building: fact}
    max_turns: 60

  # ── HARD ────────────────────────────────────────────────────────
  # +2 controlled variables vs medium:
  #   1. TWO seed-driven AGENT spawn_point groups (a NORTH-flank
  #      scout at (50,10) on spawn 0; a SOUTH-flank scout at (50,30)
  #      on spawn 1). The FORWARD + HOME bases are SHARED across
  #      both groups at identical cells so the destroy geometry is
  #      symmetric, but a memorised opening cannot generalise — the
  #      scout's flank flips per seed. (CLAUDE.md: enemy actors are
  #      NOT spawn-filtered; ANY agent actor with a spawn_point
  #      forces every agent actor WITHOUT one to be filtered out —
  #      so EVERY agent actor declares spawn_point and the shared
  #      bases are duplicated across BOTH groups. scheduled_events
  #      do NOT honour spawn_point — the single set of destroy
  #      pulses fires on both seeds.)
  #   2. A SIXTH pulse at tick 5100 — biting any late-game rebuild
  #      attempt at FORWARD that would otherwise sneak past pulse 5
  #      and satisfy the bar by the deadline. The HOME path is
  #      untouched.
  hard:
    description: >
      Same task on a seed-chosen north (y=10) or south (y=30) flank
      scout. Forward base at (20,18): full chain. Home base at
      (100,18): construction yard plus power only. Six destroy pulses
      fire on the forward region across the episode (around ticks
      600, 1500, 2400, 3300, 4200, and 5100). Win by having a
      refinery and a war factory inside the home region (radius 10
      around (100,18)) with a construction yard still standing,
      within about 60 turns.
    starting_cash: 5000
    overrides:
      actors:
        # SPAWN 0 — NORTH-flank scout at (50,10). FORWARD + HOME
        # bases duplicated across both groups (per CLAUDE.md: ANY
        # agent actor with a spawn_point forces agent actors WITHOUT
        # one to be filtered out).
        - {type: fact, owner: agent, position: [16, 18], spawn_point: 0}
        - {type: proc, owner: agent, position: [18, 16], spawn_point: 0}
        - {type: powr, owner: agent, position: [20, 18], spawn_point: 0}
        - {type: weap, owner: agent, position: [22, 16], spawn_point: 0}
        - {type: harv, owner: agent, position: [18, 18], spawn_point: 0}
        - {type: fact, owner: agent, position: [100, 18], spawn_point: 0}
        - {type: powr, owner: agent, position: [102, 18], spawn_point: 0}
        - {type: mine, owner: neutral, position: [18, 14], spawn_point: 0}
        - {type: mine, owner: neutral, position: [22, 14], spawn_point: 0}
        - {type: e1, owner: agent, position: [50, 10], stance: 0, spawn_point: 0}
        # SPAWN 1 — SOUTH-flank scout at (50,30). Symmetric.
        - {type: fact, owner: agent, position: [16, 18], spawn_point: 1}
        - {type: proc, owner: agent, position: [18, 16], spawn_point: 1}
        - {type: powr, owner: agent, position: [20, 18], spawn_point: 1}
        - {type: weap, owner: agent, position: [22, 16], spawn_point: 1}
        - {type: harv, owner: agent, position: [18, 18], spawn_point: 1}
        - {type: fact, owner: agent, position: [100, 18], spawn_point: 1}
        - {type: powr, owner: agent, position: [102, 18], spawn_point: 1}
        - {type: mine, owner: neutral, position: [18, 14], spawn_point: 1}
        - {type: mine, owner: neutral, position: [22, 14], spawn_point: 1}
        - {type: e1, owner: agent, position: [50, 30], stance: 0, spawn_point: 1}
        # Enemy actors place on every seed (enemy actors do NOT
        # honour spawn_point).
        - {type: fact, owner: enemy, position: [120, 20]}
      scheduled_events:
        - tick: 600
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
        - tick: 1500
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
        - tick: 2400
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
        - tick: 3300
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
        - tick: 4200
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
        - tick: 5100
          type: destroy_actors
          filter: {owner: agent, region: {x: 20, y: 18, radius: 10}}
    win_condition:
      all_of:
        - building_in_region:
            {x: 100, y: 18, radius: 10, type: proc, count: 1}
        - building_in_region:
            {x: 100, y: 18, radius: 10, type: weap, count: 1}
        - has_building: fact
        - within_ticks: 5403
    fail_condition:
      any_of:
        - after_ticks: 5404
        - not: {has_building: fact}
    max_turns: 60
