base:
  # Per-player cash plumbing (CLAUDE.md: per-player starting cash is
  # plumbed end-to-end and overrides the top-level when set). Setting
  # `cash: 2000` on BOTH sides is the explicit symmetric budget — no
  # `bot_type:''` ambiguity, no fallback path.
  agent: {faction: allies, cash: 2000, bot_type: ''}
  enemy: {faction: allies, cash: 2000, bot_type: ''}
  # Full macro tool palette — every verb the engine exposes that a
  # 1v1 agent might want. Both sides see this same list.
  tools:
    - observe
    - move_units
    - attack_unit
    - attack_move
    - build
    - place_building
    - harvest
    - set_stance
    - set_primary
    - sell
    - repair
    - power_down
    - stop
  spawn_mcvs: false
  planning: true
  # Re-decide as the world changes — combat contact, production
  # complete, unit lost. The 1v1 harness honours interrupts on both
  # sides independently.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
    production_complete: true
  # Generous budget — the deadline is the `max_turns` cap (200), so
  # reachable max tick ≈ 93 + 90·199 = 17 993. 20 000 ticks is ample
  # headroom for the harness.
  # 1v1 wipe-out objective: a side LOSES only when its combat units
  # AND its buildings are ALL gone. The engine's default
  # `_units_killed: true` auto-`done`s as soon as either side has
  # zero combat units (regardless of buildings) — which would end the
  # match before a true wipe-out and force a tie-break decision on
  # half-empty boards. Setting both flags `false` keeps the run alive
  # so the harness's `_alive` check (units OR buildings) is the only
  # death gate. Matches run until one side is fully razed or the
  # 200-turn deadline hits (then the kills→buildings→economy
  # tie-break applies).
  termination:
    max_ticks: 20000
    agent_units_killed: false
    enemy_units_killed: false
  # ── Canonical actor layout — TWO spawn_point variants ─────────
  # spawn_point 0 (the historical mirrored layout): agent NW, enemy
  # SE. spawn_point 1 (ablation variant): agent NE, enemy SW. Both
  # variants are horizontal flips of each other about x=32 and keep
  # the enemy as the exact rotational mirror of the agent about
  # (32, 24). The engine round-robins the spawn group by seed (env
  # `new_with_spawn_point`), so seeds 1-4 cycle through both variants
  # — distinct opening geometry on each seed, not just RNG.
  actors:
    # ── spawn_point 0: Agent (NW corner) ──
    - {type: fact, owner: agent, position: [6, 5],  spawn_point: 0}
    - {type: powr, owner: agent, position: [8, 5],  spawn_point: 0}
    - {type: proc, owner: agent, position: [6, 7],  spawn_point: 0}
    - {type: tent, owner: agent, position: [8, 7],  spawn_point: 0}
    - {type: weap, owner: agent, position: [6, 9],  spawn_point: 0}
    # Helipad (Allied air) — pre-placed so a model can BUILD heli/tran
    # without first building hpad themselves. Air axis is now active in
    # 1v1 (was land+navy only). Prereq for heli/tran: hpad (present).
    - {type: hpad, owner: agent, position: [4, 7],  spawn_point: 0}
    # Harv NORTH of tent (mirroring enemy harv's -y-of-tent arrangement).
    - {type: harv, owner: agent, position: [8, 6],  spawn_point: 0}
    - {type: syrd, owner: agent, position: [2, 6],  spawn_point: 0}
    - {type: 1tnk, owner: agent, position: [10, 6], spawn_point: 0}
    - {type: e1,   owner: agent, position: [10, 7], spawn_point: 0}
    # ── spawn_point 0: Enemy (SE corner) — mirror about (32, 24) ──
    - {type: fact, owner: enemy, position: [58, 43], spawn_point: 0}
    - {type: powr, owner: enemy, position: [56, 43], spawn_point: 0}
    - {type: proc, owner: enemy, position: [58, 41], spawn_point: 0}
    - {type: tent, owner: enemy, position: [56, 41], spawn_point: 0}
    - {type: weap, owner: enemy, position: [58, 39], spawn_point: 0}
    - {type: hpad, owner: enemy, position: [60, 41], spawn_point: 0}
    - {type: harv, owner: enemy, position: [56, 39], spawn_point: 0}
    - {type: syrd, owner: enemy, position: [62, 42], spawn_point: 0}
    - {type: 1tnk, owner: enemy, position: [54, 42], spawn_point: 0}
    - {type: e1,   owner: enemy, position: [54, 41], spawn_point: 0}
    # ── spawn_point 1: Agent (NE corner) — horizontal flip of V0 ──
    - {type: fact, owner: agent, position: [58, 5], spawn_point: 1}
    - {type: powr, owner: agent, position: [56, 5], spawn_point: 1}
    - {type: proc, owner: agent, position: [58, 7], spawn_point: 1}
    - {type: tent, owner: agent, position: [56, 7], spawn_point: 1}
    - {type: weap, owner: agent, position: [58, 9], spawn_point: 1}
    - {type: hpad, owner: agent, position: [60, 7], spawn_point: 1}
    - {type: harv, owner: agent, position: [56, 6], spawn_point: 1}
    - {type: syrd, owner: agent, position: [62, 6], spawn_point: 1}
    - {type: 1tnk, owner: agent, position: [54, 6], spawn_point: 1}
    - {type: e1,   owner: agent, position: [54, 7], spawn_point: 1}
    # ── spawn_point 1: Enemy (SW corner) — mirror about (32, 24) ──
    - {type: fact, owner: enemy, position: [6, 43],  spawn_point: 1}
    - {type: powr, owner: enemy, position: [8, 43],  spawn_point: 1}
    - {type: proc, owner: enemy, position: [6, 41],  spawn_point: 1}
    - {type: tent, owner: enemy, position: [8, 41],  spawn_point: 1}
    - {type: weap, owner: enemy, position: [6, 39],  spawn_point: 1}
    - {type: hpad, owner: enemy, position: [4, 41],  spawn_point: 1}
    - {type: harv, owner: enemy, position: [8, 39],  spawn_point: 1}
    - {type: syrd, owner: enemy, position: [2, 42],  spawn_point: 1}
    - {type: 1tnk, owner: enemy, position: [10, 42], spawn_point: 1}
    - {type: e1,   owner: enemy, position: [10, 41], spawn_point: 1}

# All three required level keys point at the SAME compiled scenario.
# The pack is effectively single-map; the `configs:` block below
# exposes ONE runnable cell (`main`, pinned to `medium`) so a
# default 1v1 eval produces one episode per seed.
levels:
  easy: &canonical
    description: >
      Commander, this is a 1v1 macro match on a 64x48 bridges
      arena. A horizontal water channel splits the NORTH lobe
      (your side) from the SOUTH lobe (your opponent's side);
      three bridges cross the channel. You hold a Construction
      Yard (fact), Refinery (proc), Power Plant (powr), War
      Factory (weap), Barracks (tent), one Shipyard (syrd, on a
      small shore-water band), one harvester (an unarmed Ore
      Truck) and two starter combat units (a light tank and a
      rifleman) in the NORTH-WEST corner. A second commander —
      your opponent — holds an identical base mirrored in the
      SOUTH-EAST corner. A safe ore patch sits next to your base;
      a mid-distance expansion patch sits about 13 cells out; a
      rich contested patch sits at the middle of the map astride
      the central bridge. You cannot see the contested patch or
      the opponent's base from your starting position. Build
      economy, field an army, cross the river when you can, and
      RAZE the opponent entirely — every building AND every
      combat unit must fall. (Destroying only the Construction
      Yard is not enough; surviving buildings keep the opponent
      in the game even if they can no longer rebuild a new one,
      since the Construction Yard is the only source of new
      buildings.) The naval lane is optional — the shipyard
      expands the action set (ships, transports) but a land-only
      macro game still works through the bridges. The match ends
      when one side is fully razed (zero units AND zero
      buildings) or after 200 decision turns; at the deadline
      victory goes by layered tie-break (kills then own
      buildings remaining then economy).
    starting_cash: 2000
    # Stub predicates — the 1v1 harness (`run_1v1`) decides the
    # winner from the final boards (base alive ⇒ in the game)
    # independent of these clauses. They serve TWO purposes:
    #   (a) hygiene-test compliance (schema requires both clauses);
    #   (b) make a single-player accidental run produce a real
    #       reachable LOSS (timeout) rather than a degenerate DRAW.
    #
    # F9 sweep audit fix (2026-05-25): the previous fail clause was
    # `not: {has_building: fact}` (mirror of win) — in single-player
    # the agent's fact predicate never flips (no scripted opponent
    # razes it) and the engine auto-terminates well before
    # `max_turns` for opaque reasons (ore depletion / power loss
    # cascade), so the episode ended as a degenerate DRAW. The new
    # fail clause adds an `after_ticks` arm at a tick reachable
    # IN SINGLE-PLAYER (1000, well below the typical auto-`done`
    # tick of ~12000 measured during the audit) so an accidental
    # single-player run terminates as a real LOSS instantly. The
    # 1v1 path is unaffected — `run_1v1` doesn't consult
    # `fail_condition`; it decides the outcome from final boards.
    win_condition:
      not: {has_building: fact}
    fail_condition:
      any_of:
        - not: {has_building: fact}
        - after_ticks: 1000
    max_turns: 200
  medium: *canonical
  hard: *canonical

# ONE runnable config — the canonical 1v1 cell. Pinned to `medium`
# (per the bench's level-name conventions, the "default" rung) so
# a `--mode 1v1 --packs adversarial-1v1-macro.yaml` invocation
# produces ONE episode per seed, not three identical ones. The
# `configs:` block is also the single-player filter — when a pack
# declares `configs:`, `run_eval.evaluate` iterates the configs
# instead of {easy, medium, hard}, so a default single-player sweep
# of this pack produces ONE cell (`:main`) rather than three. This
# pack is intended for `--mode 1v1`; the single-player `:main`
# cell relies on the `after_ticks` fail clause above so an
# accidental single-player run terminates as a real LOSS rather
# than a DRAW (mirror-fact win/fail predicates never fire when no
# one attacks the agent's base).
configs:
  - {name: main, level: medium, fog_mode: vision}
