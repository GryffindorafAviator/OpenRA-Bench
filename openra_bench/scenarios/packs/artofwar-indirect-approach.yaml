meta:
  id: artofwar-indirect-approach
  title: 'Art of War: The Indirect Approach'
  capability: reasoning
  real_world_meaning: >
    迂直之计 — "make the devious route the most direct." The short path
    to the objective is a killing ground; the only winning policy is a
    long detour that looks strictly worse for many turns (objective
    progress stays flat or dips) before it pays off. Tests temporal
    credit assignment over a long horizon against a greedy
    shortest-path bias.
  robotics_analogue: >
    Hazard-aware long-horizon routing: reject the locally optimal short
    path for a circuitous survivable one whose payoff is far delayed.
  author: openra-bench
base_map: rush-hour-arena
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  actors:
    - type: 1tnk
      owner: agent
      position: [6, 26]
      stance: 3
      health: 100
      facing: -1
      count: 3
    - type: e1            # gun line across the SHORT route
      owner: enemy
      position: [22, 26]
      stance: 3
      health: 100
      facing: -1
      count: 6
levels:
  easy:
    description: >
      The objective is due east but the direct lane is a gauntlet.
      Survive to the region — charging straight loses the force.
    win_condition:
      all_of:
        - reach_region: {x: 40, y: 26, radius: 4}
        - within_ticks: 18000
        - units_lost_lte: 1
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 80
  medium:
    description: 'Denser gun line; the detour is longer and costlier.'
    overrides:
      actors:
        - type: 1tnk
          owner: agent
          position: [6, 26]
          stance: 3
          health: 100
          facing: -1
          count: 3
        - type: e1
          owner: enemy
          position: [22, 26]
          stance: 3
          health: 100
          facing: -1
          count: 9
    win_condition:
      all_of:
        - reach_region: {x: 44, y: 26, radius: 4}
        - within_ticks: 16000
        - units_lost_lte: 1
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 90
  hard:
    description: >
      Zero-loss traversal, seed-chosen start latitude. Two spawn_point
      groups (y26 / y34); the gun line is split to span BOTH corridors
      so the short route is lethal from either start — the safe detour
      differs by seed and can't be memorised.
    overrides:
      actors:
        # spawn_point 0 — northern start
        - type: 1tnk
          owner: agent
          position: [6, 26]
          stance: 3
          health: 100
          facing: -1
          count: 3
          spawn_point: 0
          randomize:
            position: {base: [6, 26], offset: 2}
        # spawn_point 1 — southern start
        - type: 1tnk
          owner: agent
          position: [6, 34]
          stance: 3
          health: 100
          facing: -1
          count: 3
          spawn_point: 1
          randomize:
            position: {base: [6, 34], offset: 2}
        # gun line split across BOTH spawn corridors (short route
        # lethal regardless of seed → detour is the only zero-loss path)
        - type: e1
          owner: enemy
          position: [22, 26]
          stance: 3
          health: 100
          facing: -1
          count: 5
        - type: e1
          owner: enemy
          position: [22, 34]
          stance: 3
          health: 100
          facing: -1
          count: 5
    win_condition:
      all_of:
        - all_units_in_region: {x: 46, y: 26, radius: 4}
        - within_ticks: 14000
        - units_lost_lte: 0
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 95
