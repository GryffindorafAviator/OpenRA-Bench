# reasoning-frontier-commit.yaml
#
# REASONING-link scenario. Perception is trivially correct (the map is
# fog-of-war and a single scout discovers whatever it drives into); the
# hard part is the *decision*: given partial information and a finite
# tick budget, WHICH unexplored region do you commit your one scout to?
# Several regions look equally plausible from the corner; only one
# holds the survivor (the objective building marker). The deadline is
# tuned so that ONE decisive direct trip to the correct region wins,
# but any detour to a decoy region first (or sweeping every region, or
# stalling) overruns the clock and is a real LOSS. The commitment is
# un-hedgeable: a single body cannot split, so the model must read the
# frontier and commit to the right option the first time.
#
# Validate:
#   cd /Users/berta/Projects/OpenRA-Bench && \
#   python3 -m openra_bench.scenarios.validate \
#     openra_bench/scenarios/packs/reasoning-frontier-commit.yaml

meta:
  id: reasoning-frontier-commit
  title: 'Commit Under Uncertainty — Pick the One Region That Hides the Survivor'
  capability: reasoning
  real_world_meaning: >
    Path planning to any point is solved. The unsolved problem is
    deciding which of several unexplored regions to commit a
    time/fuel-limited searcher to when only one hides the target and
    going to the wrong one first means you never reach the right one in
    time. That commitment-under-uncertainty step is the real
    search-and-rescue problem, not the navigation.
  robotics_analogue: >
    UAV/UGV search-and-rescue frontier selection: with limited
    endurance and several candidate search cells, choose the cell most
    likely to contain the survivor before the battery dies.
  benchmark_anchor:
    - "PlanBench"
    - "ARC spatial reasoning"
    - "search-and-rescue frontier selection"
  author: "berta"

base_map: rush-hour-arena

base:
  agent: {faction: allies}
  enemy: {faction: soviet}
  tools: [move_units, attack_unit, stop_units]
  planning: true
  termination: {max_ticks: 8000}
  actors:
    # Single fast scout in the NW corner (x<25). One body, one
    # commitment — the decision cannot be hedged by splitting forces.
    - {type: jeep, owner: agent, position: [6, 6], count: 1}
    # The survivor: a static building marker, the only thing that
    # satisfies the win condition. Far-NE corner.
    - {type: gun, owner: enemy, position: [122, 5], stance: 0}

levels:
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Two candidate regions, one decoy. The objective marker (a building)
    # sits in the far-NE corner; a decoy enemy *unit* cluster sits in the
    # far-SE corner. Only the NE building counts toward the win. A single
    # decisive trip straight to the NE corner finishes well inside the
    # deadline; detouring to the SE decoy first, or sweeping both regions,
    # overruns the clock and LOSES. Perception is honest — the only task
    # is to commit to the correct region.
    description: >
      Fog-of-war search. One fast scout in the NW corner, several
      candidate frontiers across the map. Only ONE candidate hides a
      survivor — a building (not a unit cluster). The clock permits
      exactly one decisive trip; detouring or sweeping overruns it.
      Win = discover a building, within about 11 turns.
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [6, 6], count: 1}
        # Decoy: a passive enemy unit cluster in the far-SE corner.
        # Discovering it does NOT satisfy the buildings-based win.
        - {type: e1, owner: enemy, position: [122, 35], stance: 0, count: 2}
        # Real survivor marker: far-NE building.
        - {type: gun, owner: enemy, position: [122, 5], stance: 0}
      termination: {max_ticks: 6000}
    win_condition:
      all_of:
        - {buildings_discovered_gte: 1}
        - {within_ticks: 950}
    fail_condition:
      any_of:
        - {after_ticks: 951}
        - {not: {own_units_gte: 1}}
    max_turns: 14

  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Three candidate regions, two decoys, a tighter deadline. Decoy enemy
    # *unit* clusters sit in the far-SE corner and the mid-south edge; the
    # real survivor marker is the building in the far-NE corner. From the
    # start corner all three look equally plausible, but only the NE
    # building counts. The deadline now permits exactly one decisive trip
    # to the correct corner — committing to either decoy first, or
    # sweeping, overruns it and LOSES. The model must reason about which
    # region to commit to, not just navigate.
    description: >
      Fog-of-war search. One fast scout in the NW corner. Three
      candidate frontiers, only one of which hides a survivor (a
      building, not a unit cluster). The clock is tighter — the deadline
      permits exactly one decisive trip. Win = discover a building,
      within about 10 turns.
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [6, 6], count: 1}
        # Decoy A: passive unit cluster, far-SE corner.
        - {type: e1, owner: enemy, position: [122, 35], stance: 0, count: 2}
        # Decoy B: passive unit cluster, mid-south edge.
        - {type: e1, owner: enemy, position: [64, 36], stance: 0, count: 2}
        # Real survivor marker: far-NE building.
        - {type: gun, owner: enemy, position: [122, 5], stance: 0}
      termination: {max_ticks: 6000}
    win_condition:
      all_of:
        - {buildings_discovered_gte: 1}
        - {within_ticks: 880}
    fail_condition:
      any_of:
        - {after_ticks: 881}
        - {not: {own_units_gte: 1}}
    max_turns: 14

  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Three candidate regions, two decoys, a tight deadline, and an
    # attrition constraint. One decoy in the far-SE corner is a HOSTILE
    # cluster (stance 2) — a careless route into it gets the lone scout
    # killed; a passive decoy sits on the mid-south edge. The real
    # survivor marker is the building in the far-NE corner. The model must
    # pick the commitment that (a) finds the building, (b) fits the clock
    # — a detour to a decoy region first overruns it — and (c) avoids the
    # lethal frontier, all without splitting (only one unit). The scout
    # starts at a seed-chosen corner so the commitment decision must
    # generalise across start positions.
    description: >
      Fog-of-war search. One fast scout starting at a seed-chosen
      corner. Three candidate frontiers, only one of which hides a
      survivor (a building, not a unit cluster). One of the decoy
      frontiers contains a hostile cluster — careless routing kills the
      lone scout. ZERO losses allowed. Win = discover a building, within
      about 12 turns.
    overrides:
      actors:
        # Single scout, seed-chosen corner — the commitment decision
        # must generalise across start positions, not be memorised.
        - {type: jeep, owner: agent, position: [6, 6],  count: 1, spawn_point: 0}
        - {type: jeep, owner: agent, position: [6, 33], count: 1, spawn_point: 1}
        # Decoy A (far-SE) — hostile cluster; a route through it kills
        # the lone scout (units_lost_lte: 0 constraint below).
        - {type: e3, owner: enemy, position: [120, 35], stance: 2, count: 3}
        # Decoy B (mid-south) — passive distractor unit.
        - {type: e1, owner: enemy, position: [64, 36], stance: 0, count: 2}
        # Real survivor marker: far-NE building.
        - {type: gun, owner: enemy, position: [122, 5], stance: 0}
      termination: {max_ticks: 6000}
    win_condition:
      all_of:
        - {buildings_discovered_gte: 1}
        - {within_ticks: 1050}
        - {units_lost_lte: 0}
    fail_condition:
      any_of:
        - {after_ticks: 1051}
        - {not: {units_lost_lte: 0}}
        - {not: {own_units_gte: 1}}
    max_turns: 15
