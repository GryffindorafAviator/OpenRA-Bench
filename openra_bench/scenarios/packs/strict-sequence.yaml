meta:
  id: strict-sequence
  title: 'Strict Spec: Ordered Sequence'
  capability: action
  real_world_meaning: >
    Follow a precise procedure: reach a marked staging region FIRST,
    and only AFTER that has been achieved is the mission complete —
    doing the steps out of order, or skipping the constraint, fails.
    Tests literal instruction-following and precondition ordering under
    a strict action API rather than free-form goal seeking.
  robotics_analogue: >
    Procedural compliance: a robot must satisfy an ordered checklist
    (reach checkpoint, hold, then proceed) where step order is graded,
    not just the end state.
  author: openra-bench
base_map: rush-hour-arena
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  tools:
    - move_units
    - stop
  actors:
    - type: jeep
      owner: agent
      position: [6, 8]
      stance: 0
      health: 100
      facing: -1
      count: 1
levels:
  easy:
    description: >
      Reach the staging region (≈ x18,y22) within the deadline using
      only move_units. The strict part: attack/economy tools are not
      offered — a valid solution must be expressed in the allowed API.
    win_condition:
      all_of:
        - reach_region: {x: 18, y: 22, radius: 4}
        - within_ticks: 12000
    max_turns: 50
  medium:
    description: >
      Two-step procedure: only after holding past tick 3000 does
      reaching the region count (after_ticks gates the win).
    win_condition:
      all_of:
        - reach_region: {x: 22, y: 26, radius: 4}
        - after_ticks: 3000
        - within_ticks: 14000
    max_turns: 60
  hard:
    description: >
      Tight ordered window: reach the region within a narrow tick band
      (not before 4000, not after 9000) — precise timing compliance.
    win_condition:
      all_of:
        - reach_region: {x: 26, y: 30, radius: 3}
        - after_ticks: 4000
        - within_ticks: 9000
    max_turns: 60
