# combat-divide-and-conquer — Split a two-cluster enemy and beat them
# in detail (engage one while keeping the other unengaged), instead of
# pushing the midpoint where BOTH clusters bear on the strike force.
#
# Wave-7 reasoning seed (capability: reasoning).
#
# Real-world / benchmark anchors:
#   - Military divide-and-conquer / defeat-in-detail doctrine: never
#     engage two mutually-supporting enemy groups at once; position so
#     only one is in contact at a time.
#   - SMAC squad-isolation micro: split a coupled defender by drawing
#     one squad's aggro / staying outside the other's sight envelope,
#     then concentrate fire 4-vs-N(one cluster) instead of 4-vs-2N.
#   - CICERO "split the opposing coalition" tactic: temporarily isolate
#     a single opponent so your force ratio is favourable, then pivot
#     to the next opponent after the first is removed.
#
# Mechanism (engine-load-bearing geometry):
#   - The agent commands 4x medium tanks (2tnk) staging at the west
#     edge (x≈4, y≈20) plus a `fact` Construction Yard at (2,20)
#     anchoring the rear. Two enemy clusters sit at x=28 — Cluster A
#     (NORTH) at y=14..16 and Cluster B (SOUTH) at y=24..26, both
#     stance:3 (AttackAnything: auto-fire AND auto-advance on any
#     in-range agent). The clusters are 10 cells apart vertically;
#     e3 Dragon range ~5, 1tnk cannon range ~4-5.
#   - Engaging at the MIDPOINT (28,20): the lead tank sits ~5 cells
#     from EVERY enemy in BOTH clusters and is inside Manhattan-5 of
#     all rocketeers AND any enemy light tank simultaneously. Under
#     stance:3 the enemy units ALSO advance, so the converging mass
#     shreds the lead 2tnk in concentrated fire — the
#     own_units_gte:3 survival bar busts before the agent clears
#     either cluster.
#   - Flanking to (28,5) — well NORTH of Cluster A: agent enters
#     Manhattan-5 range of Cluster A only after pushing south on the
#     y axis; Cluster B at y=25 is Manhattan ≥20 away, so its
#     e3/1tnk are out of weapon range AND outside the stance:3-hunt
#     aggro lock-on for several turns. The 4-tank concentrated
#     focus-fire clears Cluster A while Cluster B is still closing
#     the gap. Once A is dead, the agent pivots to (28,35) — well
#     SOUTH of Cluster B — and repeats. Both kills happen in
#     1-vs-1-cluster geometry, preserving the survival bar.
#
# Discrimination bar (the four-script policy bar):
#   • stall (only observe)                → LOSS. Enemy clusters at
#     x=28 don't reach the agent at x=4 inside the budget AND the
#     kill bar is never met → after_ticks LOSS.
#   • brute attack_move east on y=20      → LOSS on medium/hard.
#     The column marches into the midpoint where BOTH clusters bear
#     simultaneously; lead tank dies in concentrated fire, agent
#     loses ≥2 tanks → own_units_gte:3 bar busts.
#   • greedy (charge cluster A's centre directly from y=20)
#                                          → LOSS on medium/hard.
#   • intended flank-A-then-flank-B-cycle → WIN.
#
# Engine guardrails (per CLAUDE.md / SCENARIO_REVIEW_CHECKLIST.md):
#   - Map: per-tier custom 64x40 arena (cordon 2 ⇒ playable
#     x in [2..61], y in [2..37]) with single explicit mpspawn at
#     (2,20) per Wave-13 footgun #6.
#       * easy   — Close clusters at (28,14..16) NORTH and (28,24..26)
#                  SOUTH; 2x e3 each (lightest).
#       * medium — Heavy clusters: 3x e3 + 1x 1tnk per team at
#                  y=14..16 and y=24..26.
#       * hard   — THREE corridors split by walls at y=9..15 and
#                  y=25..30; agent stages NORTH (y=4..7 sp0) or SOUTH
#                  (y=33..36 sp1). Three teams @ x=28: NE @y=5, MID
#                  @y=20, SW @y=35 (2x e3 + 1x 1tnk each). Sentinel
#                  in the mid corridor.
#   - Win predicate `has_building:fact` enforces base survival AND
#     keeps the episode alive past full enemy elimination (no DRAW
#     collapse on engine auto-`done`).
#   - All deadlines fit inside max_turns at the ~64 ticks/turn rate.
#   - Enemy stance:3 (AttackAnything) makes both clusters auto-fire
#     AND auto-advance on any in-range agent; the head-on midpoint
#     LOSS depends on BOTH clusters bearing on the lead tank.

meta:
  id: combat-divide-and-conquer
  title: 'Combat Reasoning — Divide and Conquer Two Mutually-Supporting Enemy Clusters'
  capability: reasoning
  real_world_meaning: >
    Four medium tanks (2tnk) at the west edge face TWO enemy clusters
    at x=28 — a NORTH cluster at y=14..16 and a SOUTH cluster at
    y=24..26 — each composed of anti-tank rocket soldiers (e3,
    Dragon, range ~5) and on medium/hard a light tank (1tnk). The
    clusters are 10 cells apart; pushing east on the midpoint axis
    (y=20) puts the lead tank inside weapon range of BOTH clusters
    at once, and under AttackAnything stance the converging mass
    concentrates fire on the lead, busting the survival bar before
    either cluster is cleared. The winning play is divide-and-conquer
    (defeat in detail): flank well NORTH (e.g. y=5) so only Cluster
    A's units are in range and line-of-sight; eliminate A while
    Cluster B is still ≥20 cells away and closing; then pivot SOUTH
    (y=35) and repeat against B in isolation. Each engagement is a
    clean 4-vs-N(one cluster) trade instead of a 4-vs-2N mass.
  robotics_analogue: >
    Two-front engagement with mutually-supporting defenders: hitting
    the midpoint between coupled adversaries lets BOTH fire on the
    leading agent simultaneously, doubling the incoming DPS share.
    Spatial positioning that breaks line-of-sight or stays outside
    the second adversary's aggro / weapon envelope sequences the
    encounter into two 1-vs-1 trades (favourable force ratio per
    trade), at the cost of route length and clock.
  benchmark_anchor:
    - "SMAC squad-isolation"
    - "CICERO splitting"
    - "military divide-and-conquer"
  author: openra-bench

base_map:
  generator: arena
  name: combat-divide-and-conquer-arena
  width: 128
  height: 40

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: ''}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  # React the instant a tank is lost or an enemy is spotted — the
  # divide-and-conquer micro is reactive; without these the model
  # only re-targets on the next turn boundary and any concentrated
  # volley is fatal to the tight survival bar.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 6000}
  actors: []   # every level supplies its own actor list via overrides.

levels:
  # ── EASY ────────────────────────────────────────────────────────────
  # Bare divide-and-conquer skill: lighter clusters (2x e3 each, no
  # enemy armour). Stall LOSES on the kill bar.
  easy:
    description: >
      Commander, this is a divide-and-conquer engagement. You are given
      4 medium tanks on the west edge and a Construction Yard at our
      rear. Two enemy rocket-infantry teams sit bracketed at the
      centre — one north at y=14-16, one south at y=24-26. A straight
      east push along y=20 puts the lead tank under fire from both
      teams at once and the column bleeds. Flank wide north (or south)
      to break line-of-sight on the far team, destroy the near team
      in isolation, then pivot to the other flank and finish the
      second team. Kill at least 4 enemies, keep at least 3 tanks
      alive AND hold the Construction Yard, within about 40 turns.
    overrides:
      base_map:
        generator: arena
        name: combat-divide-and-conquer-arena-easy
        width: 64
        height: 40
        cordon: 2
        spawns: [[2, 20]]
        title: 'Combat Divide-and-Conquer Arena 64x40 (Easy — Close Clusters)'
      actors:
        # STRIKE FORCE — 4 medium tanks at the west edge, stance:1
        # ReturnFire so they only engage when ordered.
        - {type: 2tnk, owner: agent, position: [4, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 21], stance: 1}
        # AGENT HQ — `fact` at (2,20).
        - {type: fact, owner: agent, position: [2, 20]}
        # CLUSTER A — NORTH at (28,14..16), 2x e3 stance:3.
        - {type: e3, owner: enemy, position: [28, 14], stance: 3}
        - {type: e3, owner: enemy, position: [28, 16], stance: 3}
        # CLUSTER B — SOUTH at (28,24..26), 2x e3 stance:3.
        - {type: e3, owner: enemy, position: [28, 24], stance: 3}
        - {type: e3, owner: enemy, position: [28, 26], stance: 3}
        # SENTINEL — far-east unarmed fact, keeps the engine alive
        # past full cluster elimination.
        - {type: fact, owner: enemy, position: [60, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 4}
        - {own_units_gte: 3}
        - {has_building: fact}
        - {within_ticks: 3000}
    fail_condition:
      any_of:
        - {after_ticks: 3001}
        - {not: {own_units_gte: 3}}
        - {not: {has_building: fact}}
    max_turns: 60

  # ── MEDIUM ──────────────────────────────────────────────────────────
  # Heavy clusters: 3x e3 + 1x 1tnk per side.
  medium:
    description: >
      Commander, this is a divide-and-conquer engagement. You are given
      4 medium tanks on the west edge and a Construction Yard at our
      rear. Two reinforced enemy teams sit bracketed at the centre —
      each with 3 rocket infantry plus a light tank, one team north
      at y=14-16 and one south at y=24-26. A head-on midpoint push
      eats fire from both teams at once. Flank wide, destroy one team
      in isolation, then pivot to the other side and finish the
      second. Kill all 8 enemies, keep at least 3 tanks alive AND
      hold the Construction Yard, within about 40 turns.
    overrides:
      base_map:
        generator: arena
        name: combat-divide-and-conquer-arena-medium
        width: 64
        height: 40
        cordon: 2
        spawns: [[2, 20]]
        title: 'Combat Divide-and-Conquer Arena 64x40 (Medium — Heavy Clusters)'
      actors:
        - {type: 2tnk, owner: agent, position: [4, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 21], stance: 1}
        - {type: fact, owner: agent, position: [2, 20]}
        # CLUSTER A — NORTH at y=14..16: 3x e3 + 1x 1tnk.
        - {type: e3,   owner: enemy, position: [28, 14], stance: 3}
        - {type: e3,   owner: enemy, position: [28, 15], stance: 3}
        - {type: e3,   owner: enemy, position: [28, 16], stance: 3}
        - {type: 1tnk, owner: enemy, position: [30, 15], stance: 3}
        # CLUSTER B — SOUTH at y=24..26: 3x e3 + 1x 1tnk.
        - {type: e3,   owner: enemy, position: [28, 24], stance: 3}
        - {type: e3,   owner: enemy, position: [28, 25], stance: 3}
        - {type: e3,   owner: enemy, position: [28, 26], stance: 3}
        - {type: 1tnk, owner: enemy, position: [30, 25], stance: 3}
        - {type: fact, owner: enemy, position: [60, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 8}
        - {own_units_gte: 3}
        - {has_building: fact}
        - {within_ticks: 3000}
    fail_condition:
      any_of:
        - {after_ticks: 3001}
        - {not: {own_units_gte: 3}}
        - {not: {has_building: fact}}
    max_turns: 60

  # ── HARD ────────────────────────────────────────────────────────────
  # Three corridors split by walls. Three teams at x=28 (NE/MID/SW).
  # Agent stages NORTH (y=4..7 sp0) or SOUTH (y=33..36 sp1).
  hard:
    description: >
      Commander, this is a divide-and-conquer engagement against three
      enemy teams. You are given 4 medium tanks staged in either the
      north corridor (y=4..7) or the south corridor (y=33..36)
      depending on seed, plus a Construction Yard at our rear in the
      same corridor. The arena is split into three lanes — north
      (y=2..8), middle (y=17..23), south (y=32..37) — by impassable
      walls. Three enemy teams sit at x=28: one in each corridor
      (NE, MID, SW), 3 units per team. A straight east push through
      the middle corridor's choke gets cooked. Engage your near
      corridor's team first, traverse to the opposite corridor via
      the open west sliver, then engage the remaining teams. Kill all
      9 enemies, keep at least 3 tanks alive AND hold the
      Construction Yard, within about 40 turns.
    overrides:
      base_map:
        generator: arena
        name: combat-divide-and-conquer-arena-hard
        width: 64
        height: 40
        cordon: 2
        spawns: [[2, 20]]
        title: 'Combat Divide-and-Conquer Arena 64x40 (Hard — 3 Corridors)'
        obstacles:
          # North wall band y=9..15 across x=10..61 — splits the north
          # corridor from the middle. West strip x=2..9 stays clear so
          # the agent can traverse between corridors via the west
          # sliver.
          - {x: 10, y: 9, w: 52, h: 7}
          # South wall band y=25..30 across x=10..61.
          - {x: 10, y: 25, w: 52, h: 6}
      actors:
        # spawn_point 0 — NORTH corridor (y=4..7).
        - {type: 2tnk, owner: agent, position: [4, 4], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 5], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 6], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 7], stance: 1, spawn_point: 0}
        - {type: fact, owner: agent, position: [2, 5], spawn_point: 0}
        # spawn_point 1 — SOUTH corridor (y=33..36).
        - {type: 2tnk, owner: agent, position: [4, 33], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 34], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 35], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 36], stance: 1, spawn_point: 1}
        - {type: fact, owner: agent, position: [2, 35], spawn_point: 1}
        # Three enemy teams — NE @y=5, MID @y=20, SW @y=35, each 2x e3 + 1x 1tnk.
        # NE
        - {type: e3,   owner: enemy, position: [28, 4], stance: 3}
        - {type: e3,   owner: enemy, position: [28, 6], stance: 3}
        - {type: 1tnk, owner: enemy, position: [30, 5], stance: 3}
        # MID
        - {type: e3,   owner: enemy, position: [28, 19], stance: 3}
        - {type: e3,   owner: enemy, position: [28, 21], stance: 3}
        - {type: 1tnk, owner: enemy, position: [30, 20], stance: 3}
        # SW
        - {type: e3,   owner: enemy, position: [28, 34], stance: 3}
        - {type: e3,   owner: enemy, position: [28, 36], stance: 3}
        - {type: 1tnk, owner: enemy, position: [30, 35], stance: 3}
        # Sentinel in the mid corridor (out of every engagement path).
        - {type: fact, owner: enemy, position: [60, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 9}
        - {own_units_gte: 3}
        - {has_building: fact}
        - {within_ticks: 3000}
    fail_condition:
      any_of:
        - {after_ticks: 3001}
        - {not: {own_units_gte: 3}}
        - {not: {has_building: fact}}
    max_turns: 60
