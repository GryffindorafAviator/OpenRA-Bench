meta:
  id: economy-harvest-investment
  title: "Harvest Economy — Investment & Storage"
  capability: reasoning
  real_world_meaning: >
    Given enough capital to either widen collection (a second
    refinery / more harvesters) or deepen storage (silos that raise the
    cap so burst yield is not lost), choose the allocation that
    maximizes banked economic value before the deadline — the
    investment decision, plus storage so harvest is not wasted.
  robotics_analogue: >
    Capital allocation for an autonomous resource operation: throughput
    vs. buffer capacity under a finite budget and mission clock.
  author: catalog-c13

base_map: rush-hour-arena
starting_cash: 3000

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
  tools:
    - build
    - place_building
    - harvest
    - move_units
    - deploy
    - stop
  planning: true
  termination:
    max_ticks: 40000
  actors:
    - type: fact
      owner: agent
      position:
      - 10
      - 18
    - type: powr
      owner: agent
      position:
      - 14
      - 18
    - type: proc
      owner: agent
      position:
      - 12
      - 22
    - type: harv
      owner: agent
      position:
      - 15
      - 22
    - type: mine
      owner: neutral
      position:
      - 40
      - 22
    - type: jeep
      owner: agent
      position:
      - 8
      - 16

levels:
  easy:
    description: >
      Budget covers a clear improvement; harvest + reinvest to clear a
      modest economy-value bar.
    win_condition:
      all_of:
        - economy_value_gte: 4000
        - within_ticks: 12000
    max_turns: 70
  medium:
    description: >
      Higher bar — a single refinery/harvester cannot keep up; widen
      collection (2nd refinery or more harvesters) with the budget.
    win_condition:
      all_of:
        - economy_value_gte: 6500
        - within_ticks: 12000
    max_turns: 75
  hard:
    description: >
      High banked-value target with a tight clock: bursts overflow the
      base storage and are lost — a silo (raising the cap) is required,
      and the budget must be split between collection and storage.
    win_condition:
      all_of:
        - economy_value_gte: 9000
        - has_building: silo
        - within_ticks: 11000
    max_turns: 85
