# combat-pincer-coordination.yaml
#
# ACTION capability — synchronised two-prong pincer attack. Two armoured
# squads start on the SAME west edge but at OPPOSING latitudes
# (north y≈8 and south y≈32). A central enemy cluster sits at the mid-
# map. The win predicate requires BOTH squads to engage simultaneously:
# `units_in_region_gte:{n:4}` cannot be satisfied by a single squad
# (only 3 tanks per squad — even arriving intact is 1 short of n=4),
# and `units_lost_lte:2` makes a serialised "Squad A engages first,
# Squad B follows" attempt fail because A is shredded by the cluster
# before B arrives.
#
# 2026-05-23 EDIT: map shrunk 144x40 → 72x40 per audits/EDIT_PRINCIPLES
# §10 (cut empty pre-engagement traversal). The pincer geometry is
# preserved — both squads still stage at opposing latitudes on the west
# edge and converge on a central cluster — but the cluster moves from
# x=50 to x=22 so the agent's spawn (x=5) is now ~17 cells from the
# objective instead of ~45. The win region scales with it
# ((50,20,r=8) → (22,20,r=8)); sentinel (120,4) → (60,4); cover rocks
# tightened to two purely-visual marker dots (the original 4-rock
# bracket squeezed converging tanks into pocket mouths on the smaller
# canvas and busted the loss cap).
#
# Real-world anchor: military pincer movement / SC2 two-prong attack /
# envelopment from two directions. The capability is the timing
# coordination — both prongs must commit at the same moment so the
# defender cannot focus on either prong in detail.
#
# Engine notes (per CLAUDE.md):
#   - Enemy cluster anchored at (22,19) / (22,21). CLAUDE.md flags
#     (50,20), (60,28), (90,30) as silently-failing cluster cells;
#     (22,19)/(22,21) are not on that list. The win region centre at
#     (22,20) r=8 covers both halves of the cluster.
#   - Far persistent enemy `fact` at (60,4) keeps the episode alive
#     past full enemy elimination so within_ticks / region predicates
#     evaluate on the terminal frame.
#   - `units_killed_gte: 6` is the kill bar on every level. Load-bearing
#     teeth: REGION clause (`units_in_region_gte:{n:4}` — only a two-
#     squad force can field 4 tanks) and `units_lost_lte:2`.
#   - Enemy cluster stance:2 (Defend — auto-fires the closest in-range
#     tank but never advances). Stationary defender keeps the cluster
#     anchored so the pincer geometry is deterministic.
#   - Tick budget unchanged at 4500 within / 4501 fail. max_turns 64
#     ⇒ max reachable tick 5763.
#
# Discrimination (the four-script bar; scripted-policy validation in
# tests/test_combat_pincer_coordination.py covers all 4 seeds per level):
#   • stall (Command.observe only) → kill bar unmet → after_ticks LOSS.
#   • single-squad-A → only 3 tanks can occupy the objective region while
#     n=4 is required → LOSS. On medium/hard A is also shredded.
#   • sequenced-A-then-B-late → A shredded before B arrives → LOSS
#     (medium/hard); easy may squeak by (inert-easy-teeth convention).
#   • intended pincer-sync → both squads attack_move turn 1; their
#     staging latitudes (y=8, y=32) put them equidistant from the
#     cluster so naive simultaneous launch arrives together → WIN.
#
# Validate:
#   cd /Users/berta/Projects/OpenRA-Bench && \
#   python3 -m openra_bench.scenarios.validate \
#     openra_bench/scenarios/packs/combat-pincer-coordination.yaml

meta:
  id: combat-pincer-coordination
  title: 'Pincer Attack — Two Squads Strike Simultaneously From Two Sides'
  capability: action
  real_world_meaning: >
    Two armoured squads start at OPPOSING latitudes on the west edge
    (one to the north, one to the south) and must converge on a
    central enemy cluster simultaneously, hitting the defender from
    two sides at once. Sending a single squad alone fails on two
    counts: only 3 tanks (not the required 4) can occupy the
    objective region, and the lone squad is shredded by the cluster's
    mass anti-armour before clearing it. Sending both squads but not
    synchronised (one held back, the other commits first) lets the
    cluster focus on the lead squad and destroy it before the trailing
    squad arrives, busting the attrition cap. Only a true
    simultaneous two-prong commit clears the cluster cleanly and
    leaves the joint force standing on the objective.
  robotics_analogue: >
    Synchronous two-team pincer attack on a contested objective: each
    team approaches on a different bearing and both must arrive within
    a common window so the defending agents cannot focus on either
    team in detail. Serialising one team behind the other lets the
    defender concentrate fire and destroy the lead team before
    reinforcement; only the joint simultaneous commit overwhelms
    the defence and preserves the strike force.
  benchmark_anchor:
    - "SC2 multi-prong / two-prong attack timing"
    - "military pincer movement doctrine"
    - "envelopment from multiple angles"
    - "synchronisation of dispersed forces"
  author: openra-bench

# Tight 72x40 pincer arena — half the original 144x40 width per
# audits/EDIT_PRINCIPLES §10 (cut empty pre-engagement traversal to
# ≤15 cells). The geometry under test is preserved:
#
#   NORTH corridor : y =  2 .. 17  (open across x=2..69)
#   SOUTH corridor : y = 22 .. 37  (open across x=2..69)
#
# The pincer mechanism is enforced by the WIN PREDICATE
# (`units_in_region_gte: {n:4}` requires at least 4 tanks inside the
# central 8-radius disc, impossible with one 3-tank squad), not by
# the map's walkability — the map's job is to put the two prongs on
# opposing latitudes and the cluster in the middle so the pincer
# geometry READS from the briefing image.
#
# Single explicit `spawns: [[5, 20]]` mpspawn pins per-seed actor-
# offset behaviour (CLAUDE.md ENGINE_FOLLOWUPS #6).
#
# Cover-rock marker dots at the far east bracket the central
# objective visually. Originally the YAML carried four cover rocks
# tightly bracketing the cluster (west, east, north, south); on the
# shrunk canvas they squeezed the converging tanks into pocket
# mouths and the lead tanks ate concentrated focus-fire while
# followers were still pathing in (intended pincer-sync was busting
# the loss cap). Two distant marker dots well clear of every
# approach lane preserve the visual "the centre is the objective"
# read without affecting movement.
base_map:
  generator: arena
  name: combat-pincer-coordination-arena-72x40
  width: 72
  height: 40
  cordon: 2
  spawns: [[5, 20]]
  obstacles:
    - {x: 40, y: 14, w: 2, h: 2}   # NE marker (far from win region)
    - {x: 40, y: 24, w: 2, h: 2}   # SE marker
  title: 'Pincer Coordination Arena 72x40 (N+S corridors)'

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: ''}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 6000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare pincer skill: lighter cluster (4× e1 + 2× e3, no enemy armour;
  # 6 enemies total, kill bar 6).
  easy:
    description: >
      You command two tank squads — three medium tanks in the north-west
      at (5,8) and three more in the south-west at (5,32). A mid-map
      enemy cluster of four riflemen and two rocket soldiers sits at
      (22,20). Send both squads at the same time so they hit from north
      and south together; one squad alone cannot satisfy the four-in-
      region clause. Six kills, four tanks in the (22,20) disc, no more
      than two losses, within about 50 turns.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [5, 8],  stance: 1, count: 3}
        - {type: 2tnk, owner: agent, position: [5, 32], stance: 1, count: 3}
        - {type: e1, owner: enemy, position: [22, 19], stance: 2, count: 2}
        - {type: e1, owner: enemy, position: [22, 21], stance: 2, count: 2}
        - {type: e3, owner: enemy, position: [22, 19], stance: 2}
        - {type: e3, owner: enemy, position: [22, 21], stance: 2}
        - {type: fact, owner: enemy, position: [60, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {units_in_region_gte: {x: 22, y: 20, radius: 8, n: 4}}
        - {units_lost_lte: 2}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {units_lost_lte: 2}}
        - {not: {own_units_gte: 1}}
    max_turns: 64

  # ── MEDIUM ───────────────────────────────────────────────────────
  # Full enemy cluster — 4× e1 + 2× e3 + 2× 2tnk (8 enemies; kill bar 6).
  # Enemy armour shreds a lone 3-tank squad → A-only or A-then-B-late
  # busts units_lost_lte:2. The 6-tank synchronised commit halves the
  # per-tank damage share, so the sync wins.
  medium:
    description: >
      Same north-west and south-west staging — three tanks each — but the
      mid-map cluster at (22,20) now adds an enemy medium tank alongside
      the four rifles and two rocket soldiers. A lone squad gets shredded
      by the armour before it can clear. Launch both squads on turn one
      for a true pincer: six kills, four tanks in the (22,20) disc, no
      more than two losses, within about 50 turns.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [5, 8],  stance: 1, count: 3}
        - {type: 2tnk, owner: agent, position: [5, 32], stance: 1, count: 3}
        - {type: e1, owner: enemy, position: [22, 19], stance: 2, count: 2}
        - {type: e1, owner: enemy, position: [22, 21], stance: 2, count: 2}
        - {type: e3, owner: enemy, position: [22, 19], stance: 2}
        - {type: e3, owner: enemy, position: [22, 21], stance: 2}
        # ONE enemy 2tnk (vs original 2) — on the tighter 72x40 canvas
        # 2× enemy 2tnks pushed the sync attrition above the cap; one
        # 2tnk preserves the "lone squad gets shredded" teeth (sequenced
        # still loses A before B arrives) while letting the synchronised
        # 6-tank commit clear inside the cap.
        - {type: 2tnk, owner: enemy, position: [22, 19], stance: 2}
        - {type: fact, owner: enemy, position: [60, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {units_in_region_gte: {x: 22, y: 20, radius: 8, n: 4}}
        - {units_lost_lte: 2}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {units_lost_lte: 2}}
        - {not: {own_units_gte: 1}}
    max_turns: 64

  # ── HARD ─────────────────────────────────────────────────────────
  # TWO seed-driven agent spawn groups with DIFFERENT cell coordinates.
  # Group 0: Squad A NORTH (5,8) / Squad B SOUTH (5,32). Group 1: shifted
  # to (3,5) / (3,35). Both stay equidistant from the cluster.
  hard:
    description: >
      Two tank squads stage north and south along the west edge — exact
      cells vary by seed. The mid-map enemy at (22,20) mixes infantry
      with two of their own medium tanks, which means a lone squad gets
      crushed before help arrives. Drive both squads in simultaneously so
      neither side bleeds out. Six kills, four tanks in the (22,20) disc,
      two losses or fewer, within about 50 turns.
    overrides:
      actors:
        # spawn_point 0 — Squad A NORTH (5,8), Squad B SOUTH (5,32).
        - {type: 2tnk, owner: agent, position: [5, 8],  stance: 1, count: 3, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [5, 32], stance: 1, count: 3, spawn_point: 0}
        # spawn_point 1 — SHIFTED layout: NORTH (3,5) / SOUTH (3,35).
        - {type: 2tnk, owner: agent, position: [3, 5],  stance: 1, count: 3, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [3, 35], stance: 1, count: 3, spawn_point: 1}
        - {type: e1, owner: enemy, position: [22, 19], stance: 2, count: 2}
        - {type: e1, owner: enemy, position: [22, 21], stance: 2, count: 2}
        - {type: e3, owner: enemy, position: [22, 19], stance: 2}
        - {type: e3, owner: enemy, position: [22, 21], stance: 2}
        # ONE enemy 2tnk on the hard tier (vs original 2) — matches the
        # medium-tier rescaling for the shrunk 72x40 canvas.
        - {type: 2tnk, owner: enemy, position: [22, 19], stance: 2}
        - {type: fact, owner: enemy, position: [60, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {units_in_region_gte: {x: 22, y: 20, radius: 8, n: 4}}
        - {units_lost_lte: 2}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {units_lost_lte: 2}}
        - {not: {own_units_gte: 1}}
    max_turns: 64
