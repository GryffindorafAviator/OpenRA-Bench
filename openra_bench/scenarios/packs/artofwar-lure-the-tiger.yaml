meta:
  id: artofwar-lure-the-tiger
  title: 'Lure the Guard Away — Bait a Mobile Defender, Then Slip the Main Force Through'
  capability: reasoning
  real_world_meaning: >
    调虎离山 — draw the enemy from its strong position. A mobile
    reactive defender sits astride the only lane to the objective.
    Phase 1 (send a probe to bait the defender out of position) yields
    ZERO objective progress; only in phase 2, through the vacated lane,
    does the main force score. Two-phase plan with no reward for the
    enabling first phase.
  robotics_analogue: >
    Two-phase manipulation: a no-reward enabling action (displace a
    reactive obstacle) must precede the rewarded objective action.
  author: openra-bench
base_map: rush-hour-arena
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  actors:
    - type: 2tnk          # main force, held back until the lane opens
      owner: agent
      position: [6, 24]
      stance: 3
      health: 100
      facing: -1
      count: 3
    - type: jeep          # the lure
      owner: agent
      position: [6, 16]
      stance: 3
      health: 100
      facing: -1
      count: 1
    - type: 3tnk          # the "tiger": mobile, reactive, blocks the lane
      owner: enemy
      position: [26, 24]
      stance: 3
      health: 100
      facing: -1
      count: 2
levels:
  easy:
    description: >
      The tiger guards the lane at (~26,24). Bait it north with the
      jeep, then run the main force east to the objective.
    win_condition:
      all_of:
        - reach_region: {x: 42, y: 24, radius: 4}
        - within_ticks: 16000
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 75
  medium:
    description: 'A heavier tiger; baiting must be more deliberate.'
    overrides:
      actors:
        - type: 2tnk
          owner: agent
          position: [6, 24]
          stance: 3
          health: 100
          facing: -1
          count: 3
        - type: jeep
          owner: agent
          position: [6, 16]
          stance: 3
          health: 100
          facing: -1
          count: 1
        - type: 3tnk
          owner: enemy
          position: [26, 24]
          stance: 3
          health: 100
          facing: -1
          count: 3
    win_condition:
      all_of:
        - reach_region: {x: 46, y: 24, radius: 4}
        - within_ticks: 14000
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 85
  hard:
    description: >
      Loss-capped: the bait may die, the main force may not. Force
      stages from a seed-chosen latitude (two spawn_point groups, same
      main+lure formation) — the lure path that works can't be
      memorised. The tiger blocks the lane beyond initial sight.
    overrides:
      actors:
        # spawn_point 0 — northern staging
        - type: 2tnk
          owner: agent
          position: [6, 24]
          stance: 3
          health: 100
          facing: -1
          count: 3
          spawn_point: 0
          randomize:
            position: {base: [6, 24], offset: 3}
        - type: jeep
          owner: agent
          position: [6, 16]
          stance: 3
          health: 100
          facing: -1
          count: 1
          spawn_point: 0
        # spawn_point 1 — southern staging
        - type: 2tnk
          owner: agent
          position: [6, 40]
          stance: 3
          health: 100
          facing: -1
          count: 3
          spawn_point: 1
          randomize:
            position: {base: [6, 40], offset: 3}
        - type: jeep
          owner: agent
          position: [6, 32]
          stance: 3
          health: 100
          facing: -1
          count: 1
          spawn_point: 1
        - type: 3tnk
          owner: enemy
          position: [26, 24]
          stance: 3
          health: 100
          facing: -1
          count: 3
        - type: e1
          owner: enemy
          position: [30, 20]
          stance: 3
          health: 100
          facing: -1
          count: 3
    win_condition:
      all_of:
        - reach_region: {x: 48, y: 24, radius: 3}
        - within_ticks: 12000
        - units_lost_lte: 1
    fail_condition:
      not:
        own_units_gte: 1
    max_turns: 95
