# def-in-depth-vs-single — Layered Defense Beats a Single Thick Wall
#
# REASONING focus: DEFENSE-IN-DEPTH topology. A heavy enemy wave drives
# straight at the agent construction yard (fact). The same finite
# pillbox budget can be deployed two ways:
#   • SINGLE THICK WALL — every pbox massed into ONE band on the rush
#     lane. It is dense, but it has no depth: when the heavy wave
#     punches a hole (and a massed rush concentrating its fire WILL
#     punch a hole), there is nothing behind the wall — the survivors
#     of the wave sail through the breach and raze the fact.
#   • TWO DEPTH BANDS — the SAME pbox count split into a FRONT line
#     (absorbs and thins the first impact) and a REAR line at greater
#     depth (shreds the survivors that break through the front). Same
#     resources, different topology, qualitatively different
#     survivability: the breach of the front band is contained by the
#     rear band instead of reaching the base.
#
# The win predicate makes the topology decision load-bearing — total
# pbox count alone is NOT enough. The pillboxes must be split across
# TWO non-overlapping depth bands (a `building_in_region` clause on the
# FRONT band AND a `building_in_region` clause on the REAR band), the
# fact must still stand, AND the wave must actually be destroyed
# (`units_killed_gte`) — a defence that merely absorbs without killing
# the wave has not held in depth.
#
# Sibling/inverse of build-defensive-tower-cluster (concentrate AT the
# asset): on THIS pack the threat is a heavy BREAKING wave, so the
# doctrine is DEPTH (front + rear), not a single concentrated wall —
# even a maximally thick single wall loses when the wave breaks it.
#
# Real-world anchor:
#   • military defense-in-depth doctrine — a forward line plus a second
#     line at depth; the breach of the forward line is contained, not
#     catastrophic;
#   • security layered defense (defense-in-depth) — a single perimeter
#     firewall, however thick, eventually gets breached; outer + inner
#     layers absorb the breach;
#   • MicroRTS defense — the classic RTS lesson that a wall with no
#     depth collapses to a focused push.
#
# Discrimination (four-script bar — scripted, no model needed):
#   • stall (observe-only): spends nothing, the wave razes the fact —
#     fact-alive fail clause fires → LOSS (no draw degeneracy because
#     `after_ticks` also fires as a backstop).
#   • single-thick-wall (ALL pbox massed in ONE band — front-only OR
#     rear-only): satisfies the count clause and ONE region clause but
#     FAILS the other region clause; the un-b-depthed wall is broken by
#     the heavy wave and the survivors raze the fact → LOSS.
#   • pure-army (only e1, no pbox): FAILS the count clause AND both
#     region clauses; the rifle wall alone cannot stop the heavy wave
#     either → LOSS.
#   • intended TWO-BAND DEPTH (pbox split FRONT band + REAR band):
#     front band thins the wave, rear band finishes the survivors at
#     depth → count + both region clauses + kill + fact-alive all
#     satisfied → WIN.
#
# Why the spec works (engine combat sheet, per CLAUDE.md):
#   • pbox = pillbox (anti-infantry base defence; cost 600cr; dps very
#     high vs rifle infantry; 1×1 footprint, easy to band). The defense
#     queue is SEPARATE from infantry so it builds without contention.
#   • The two band regions have non-overlapping radii (FRONT and REAR
#     centres are >2·radius apart) so a single tall band cannot satisfy
#     both region predicates — the model MUST physically split the pbox
#     across two depths.
#   • `building_count_gte:{fact,1}` (PRESENT-TENSE) is the fact-alive
#     check — `has_building` is a one-shot ever-seen set that stays
#     true after the fact is razed (documented CLAUDE.md footgun).
#   • `units_killed_gte:K` forces the depth to actually FIGHT and
#     destroy the wave — a defence that is bypassed, or that merely
#     soaks damage without killing, does not satisfy the bar.
#   • No interrupts ⇒ each step is exactly 90 ticks (max tick =
#     93+90·(N-1)); the `after_ticks` fail clause reliably bites for a
#     staller / non-finisher → real LOSS, never a draw.
#   • A persistent unarmed enemy `fact` far east keeps the episode
#     alive past full wave elimination so the win/fail evaluator sees
#     the terminal frame (no DRAW collapse on enemy-wipe auto-done).
#   • The `rusher` bot relentlessly charges the agent centroid (the
#     agent fact) — the wave converges down the lane through BOTH band
#     positions on the way to the fact, so the front band always takes
#     the first impact and the rear band always catches the breach.

meta:
  id: def-in-depth-vs-single
  title: 'Defense in Depth — Two Bands Beat One Thick Wall'
  capability: reasoning
  real_world_meaning: >
    A heavy enemy wave drives straight at your construction yard. The
    same finite pillbox budget massed into ONE thick wall has no depth:
    when the wave punches a hole, the survivors sail through the breach
    and raze the base. The SAME pillboxes split into a FRONT line (which
    absorbs and thins the first impact) plus a REAR line at greater
    depth (which shreds the survivors that break through) contains the
    breach instead of suffering it. Same resources, different topology,
    qualitatively different survivability. The win predicate makes the
    topology decision load-bearing: total pillbox count alone is not
    enough — the pillboxes must be split across two non-overlapping
    depth bands, the construction yard must survive, and the wave must
    actually be destroyed.
  robotics_analogue: >
    Layered security architecture (defense-in-depth): a single perimeter
    firewall, however thick, eventually gets breached; the same
    defensive capacity deployed as an outer layer plus an inner layer
    absorbs the breach — a single component failure is contained, not
    catastrophic. The same logic as a medieval keep behind an outer
    wall (the attacker must take BOTH), or redundant systems
    architecture where one failure does not bring down the system.
  benchmark_anchor:
    - 'military defense-in-depth'
    - 'security layered defense'
    - 'MicroRTS defense'
  author: 'openra-bench'

base_map: rush-hour-arena

base:
  agent: {faction: allies}
  enemy: {faction: soviet, bot_type: rusher}
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  # No interrupts — defense-in-depth is a STATIC up-front topology
  # decision; the threat axis is known a priori (the rusher always
  # charges the agent fact down the lane). Disabling interrupts also
  # makes the tick budget deterministic (exactly 90 ticks/step ⇒
  # max_turns is a hard tick budget the `after_ticks` fail clause
  # reliably bites in).
  interrupts: {}
  termination:
    max_ticks: 12000
  actors: []   # every level supplies its own actor list via overrides.

levels:
  # ── EASY ── bare DEFENSE-IN-DEPTH skill: budget covers exactly 4 pbox
  # (2400cr). Win requires 2 pbox in the FRONT band (35,20,r=4) AND 2
  # pbox in the REAR band (20,20,r=4). The two band regions do not
  # overlap (dx=15 > 2·4), so a single thick wall at one x satisfies at
  # most ONE region clause. Stall loses (clock OR fact razed); pure-army
  # loses (count). max_turns 60 ⇒ reachable tick 93+90·59 = 5403;
  # deadline 5400.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # A heavy rusher wave of rifle infantry charges your construction yard
    # (fact, at (10,20)). Build 4 pillboxes (pbox — 600cr each, budget
    # exactly 2400) and split them across TWO DEPTH BANDS: 2 in the FRONT
    # band near (35,20) AND 2 in the REAR band near (20,20), so the front
    # line thins the wave and the rear line shreds whatever breaks
    # through. A single thick wall — all 4 pboxes massed in one band — has
    # no depth: when the heavy wave punches a hole the survivors raze the
    # fact. Stall, pure-army, and single-wall layouts all LOSE. The fact
    # must survive; at least 4 enemy units must die before tick 5400.
    description: >
      A heavy rifle rush charges your construction yard at (10,20). Your
      $2400 budget covers exactly four pillboxes. Split them across two
      depth bands — two in the front near (35,20), two in the rear near
      (20,20) — so anything that breaks the front gets killed by the rear.
      One thick wall has no depth. Yard intact, four kills, within about
      60 turns.
    starting_cash: 2400
    overrides:
      actors:
        # Pre-placed agent base. Fact at (10,20); tent and powr WEST of
        # the fact (behind it) so they are not in the rush line of fire
        # and they leave the depth bands clear.
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: tent, owner: agent, position: [6,  18]}
        - {type: powr, owner: agent, position: [6,  22]}
        # 3 pre-placed e1 defenders flanking the fact (supporting fire
        # behind the rear band; the two pbox bands are the load-bearing
        # defence). stance:2 (return fire) so they hold position.
        - {type: e1,   owner: agent, position: [12, 19], stance: 2}
        - {type: e1,   owner: agent, position: [12, 20], stance: 2}
        - {type: e1,   owner: agent, position: [12, 21], stance: 2}
        # Heavy rusher wave at mid-east — forced through the y=20 lane
        # on the way to the agent fact, crossing BOTH band positions.
        # 6× e1 is enough to overwhelm a single un-bdepthed wall but a
        # FRONT+REAR split shreds it in depth. Off the (50,20)
        # silently-failing column.
        - {type: e1, owner: enemy, position: [60, 20], stance: 3, count: 6}
        # Unarmed high-HP marker (anti-DRAW): keeps the episode alive
        # past full wave elimination so the win/fail check fires.
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 4}}
        - {building_in_region: {type: pbox, x: 35, y: 20, radius: 4, count: 2}}
        - {building_in_region: {type: pbox, x: 20, y: 20, radius: 4, count: 2}}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_killed_gte: 4}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60

  # ── MEDIUM ── +1 axis: heavier wave (8× e1 + 2× e3 rocket soldiers)
  # AND the kill bar rises to 7 — the depth must actually destroy most
  # of the wave, not just soak it. Same 2400cr / 4 pbox / 2-front +
  # 2-rear topology. A single thick wall meets the count and one region
  # clause but breaks under the heavier wave and the survivors raze the
  # fact. max_turns 60 ⇒ reachable tick 5403; deadline 5400.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # A heavier rusher wave — 8 rifle infantry plus 2 rocket soldiers —
    # charges your construction yard (fact, at (10,20)). Build 4 pillboxes
    # (budget exactly 2400cr = 4 pbox at 600 each) and split them across
    # TWO DEPTH BANDS: 2 in the FRONT band near (35,20) AND 2 in the REAR
    # band near (20,20). A single thick wall — all 4 massed in one band —
    # meets a naive count but has no depth: the heavier wave punches
    # through and the survivors raze the fact. Stall, pure-army, and
    # single-wall layouts all LOSE. The fact must survive; at least 7
    # enemy units must die before tick 5400.
    description: >
      Same yard at (10,20), but the rush now includes two rocket soldiers
      behind eight rifles. The $2400 still buys exactly four pillboxes;
      split 2-front (35,20), 2-rear (20,20). A single wall meets the count
      but lets the rockets-led punch through. Yard intact, seven kills,
      within about 60 turns.
    starting_cash: 2400
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: tent, owner: agent, position: [6,  18]}
        - {type: powr, owner: agent, position: [6,  22]}
        # 4 pre-placed e1 defenders (one more than easy) — supporting
        # fire behind the rear band; the two pbox bands carry the load.
        - {type: e1,   owner: agent, position: [12, 19], stance: 2}
        - {type: e1,   owner: agent, position: [12, 20], stance: 2}
        - {type: e1,   owner: agent, position: [12, 21], stance: 2}
        - {type: e1,   owner: agent, position: [8,  20], stance: 2}
        # Heavier wave: 8× e1 + 2× e3 at x=60, all at y=20 so the wave
        # converges down the protected lane through BOTH band positions.
        # The heavier band overruns a single wall; the front+rear split
        # holds because the rear band catches the breach.
        - {type: e1, owner: enemy, position: [60, 20], stance: 3, count: 8}
        - {type: e3, owner: enemy, position: [62, 20], stance: 3, count: 2}
        # Anti-DRAW marker.
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 4}}
        - {building_in_region: {type: pbox, x: 35, y: 20, radius: 4, count: 2}}
        - {building_in_region: {type: pbox, x: 20, y: 20, radius: 4, count: 2}}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_killed_gte: 7}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60

  # ── HARD ── +1 axis: TWO seed-driven agent spawn_point groups so the
  # base (and therefore both depth bands) FLIP between NORTH y=14 and
  # SOUTH y=26 per seed. The win predicate's `any_of` accepts a
  # front+rear split at EITHER latitude — but a single memorised "build
  # bands at y=20" plan does NOT work because the base never sits at
  # y=20 on hard. The model has to READ the fact's latitude from
  # observation and place both bands relative to it. The heavy wave
  # arrives as TWO spawn_point enemy groups (a north band and a south
  # band) so the wave that bites varies and the depth topology must
  # generalise across the seed-chosen lane. Total pbox 4 (2400cr,
  # exact). Kill bar 6. max_turns 60 ⇒ reachable tick 5403; deadline
  # 5400.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # The agent construction yard (fact) flips between NORTH (y=14) and
    # SOUTH (y=26) by seed; both depth bands must follow. Build 4
    # pillboxes (budget 2400cr = 4 pbox at 600 each) and split them across
    # TWO DEPTH BANDS at the CURRENT latitude: 2 in the FRONT band near
    # (35,fact_y) AND 2 in the REAR band near (20,fact_y) — read fact_y
    # from the observation. A single thick wall, a split at the wrong
    # latitude, or any plan that does not follow the fact FAILS a region
    # clause and lets the heavy wave reach the fact. Stall, pure-army, and
    # single-wall layouts all LOSE. The fact must survive; at least 6
    # enemy units must die before tick 5400.
    description: >
      Heavy rifle-plus-rocket wave drives at your construction yard, whose
      latitude flips north or south by seed. Build four pillboxes split
      into a front band and a rear band. Keep the yard, kill six, within
      about 60 turns.
    starting_cash: 2400
    overrides:
      actors:
        # spawn_point 0 — NORTH base. Fact at (10,14); tent/powr WEST
        # of fact; pre-placed defenders behind the rear band.
        - {type: fact, owner: agent, position: [10, 14], spawn_point: 0}
        - {type: tent, owner: agent, position: [6,  12], spawn_point: 0}
        - {type: powr, owner: agent, position: [6,  16], spawn_point: 0}
        - {type: e1,   owner: agent, position: [12, 13], stance: 2, spawn_point: 0}
        - {type: e1,   owner: agent, position: [12, 14], stance: 2, spawn_point: 0}
        - {type: e1,   owner: agent, position: [12, 15], stance: 2, spawn_point: 0}
        - {type: e1,   owner: agent, position: [8,  14], stance: 2, spawn_point: 0}
        # spawn_point 1 — SOUTH base (mirror across y=20).
        - {type: fact, owner: agent, position: [10, 26], spawn_point: 1}
        - {type: tent, owner: agent, position: [6,  24], spawn_point: 1}
        - {type: powr, owner: agent, position: [6,  28], spawn_point: 1}
        - {type: e1,   owner: agent, position: [12, 25], stance: 2, spawn_point: 1}
        - {type: e1,   owner: agent, position: [12, 26], stance: 2, spawn_point: 1}
        - {type: e1,   owner: agent, position: [12, 27], stance: 2, spawn_point: 1}
        - {type: e1,   owner: agent, position: [8,  26], stance: 2, spawn_point: 1}
        # Heavy wave arrives as TWO seed-driven spawn_point enemy
        # groups: a NORTH wave (spawn_point 0) and a SOUTH wave
        # (spawn_point 1). The enemy spawn filter round-robins the wave
        # latitude by seed, so the lane that bites varies. The unarmed
        # anti-DRAW fact is duplicated across BOTH enemy spawn groups
        # (per CLAUDE.md the per-owner spawn filter would otherwise drop
        # an un-tagged enemy actor).
        - {type: e1, owner: enemy, position: [60, 14], stance: 3, count: 6, spawn_point: 0}
        - {type: e3, owner: enemy, position: [62, 14], stance: 3, count: 2, spawn_point: 0}
        - {type: fact, owner: enemy, position: [120, 14], spawn_point: 0}
        - {type: e1, owner: enemy, position: [60, 26], stance: 3, count: 6, spawn_point: 1}
        - {type: e3, owner: enemy, position: [62, 26], stance: 3, count: 2, spawn_point: 1}
        - {type: fact, owner: enemy, position: [120, 26], spawn_point: 1}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 4}}
        - any_of:
            - all_of:
                - {building_in_region: {type: pbox, x: 35, y: 14, radius: 4, count: 2}}
                - {building_in_region: {type: pbox, x: 20, y: 14, radius: 4, count: 2}}
            - all_of:
                - {building_in_region: {type: pbox, x: 35, y: 26, radius: 4, count: 2}}
                - {building_in_region: {type: pbox, x: 20, y: 26, radius: 4, count: 2}}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_killed_gte: 6}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60
