# coord-cover-and-move — bounding overwatch across a fire zone.
#
# ACTION focus: two squads must cross a centre-of-map fire zone — an
# anti-tank infantry cluster ANCHORED BY HEAVY TANKS. Charging both
# squads straight through the centre drives the column into the heavy-
# tank brawl plus the rocket fire and busts the attrition cap (≥2
# tanks lost). Sending one squad alone leaves the other idle (so the
# n=4 win region is unreachable) and the moving column still eats the
# centre fire. Stalling burns the clock. The intended idiom is
# military FIRE-AND-MANEUVER bounding overwatch: one squad anchors at
# the edge of the fire zone to DRAW fire while the other squad sweeps
# WIDE through the far periphery (y ≈ 6 / y ≈ 34 — outside the centre
# fire zone entirely), then the roles alternate so the cover team can
# also cross. Both squads converge on the eastern gathering region
# having routed AROUND the fire zone rather than through it.
#
# Engine movement-fix recalibration ((A) attack_unit on out-of-sight
# targets paths normally — no teleport; (B) a moving unit fires AND
# takes fire en route — no sprint-invincibility): a 6-tank column that
# attack_moves straight through the centre now genuinely trades fire
# with the cluster while crossing. The load-bearing punisher is the
# combination of e3 ANTI-TANK ROCKET soldiers (the real anti-armour
# DPS) AND 4tnk HEAVY-TANK anchors: probing shows e3 rockets alone or
# a single 4tnk only cost a charging column ONE tank, but FOUR e3 plus
# TWO 4tnk reliably cost it TWO. Every level therefore fields an e3
# rocket cluster anchored by TWO 4tnk (easy uses a smaller 3× e3
# cluster; medium/hard a 4× e3 cluster, hard adds e1 rifle screens).
# All enemy units are stance:2 Defend (auto-fire in range but
# STATIONARY) so a staller is a clean timeout LOSS rather than being
# chased down by hunters.
#
# Real-world anchor: US Army FM 3-21.8 bounding overwatch — one fire
# team in a stationary OVERWATCH posture provides suppressive fire
# while the BOUNDING fire team moves forward by short rushes through
# the danger zone; roles alternate ("leapfrog") as the bounding team
# reaches its next covered position and assumes overwatch for the
# previously-overwatching team. SC2 tank micro encodes the same
# pattern as the siege-tank "leapfrog" advance.
#
# Discrimination (the four script-policy bar):
#   • stall (observe-only): no squad crosses → win region empty →
#     after_ticks timeout LOSS.
#   • both-charge-together: all 6 tanks rush a single eastward column
#     straight through the centre fire zone; the rocket fire plus the
#     heavy-tank brawl bust the attrition cap → LOSS.
#   • single-squad-only: send Squad A through alone (Squad B idle
#     west); A absorbs the centre fire AND half the force never
#     reaches the win region (n=4 region clause unreachable) → LOSS.
#   • intended bound-and-cover: route both squads through the far
#     periphery (rise to y ≈ 6 / y ≈ 34 WEST of the fire zone, then
#     traverse the periphery, then converge on the win region),
#     alternating the cover/move roles. The squads cross OUTSIDE the
#     centre fire zone; ≥4 tanks land in the win region within the
#     deadline losing ≤ the cap → WIN.
#
# Why the spec works (engine combat sheet):
#   • e3 = anti-tank rocket soldier (rng4c, sight5c) — the real
#     anti-armour DPS of the fire zone; a 4× e3 cluster plus the two
#     heavy-tank anchors is what kills ≥2 of a 6-tank column charging
#     through the centre.
#   • 4tnk = heavy/mammoth tank — high HP and a heavy cannon; the
#     SECOND 4tnk anchor is what pushes a charging column's losses
#     from one tank to two. Held at the cluster centre (y=20) it
#     reaches a charging column on the y≈14..16 / y≈24..26 lanes.
#   • 2tnk = medium tank (rng4.75c, sight6c, hp400) — out-DPSes
#     infantry but is ground down by the e3 rockets + 4tnk anchors
#     when it crosses the centre.
#   • Periphery geometry: the centre fire zone occupies y≈13..27. A
#     squad that rises to y≈6 (NORTH) or y≈34 (SOUTH) BEFORE reaching
#     the fire zone's longitude (x≈50) routes entirely outside the
#     fire envelope and takes zero fire — the "bounding lane".
#
# Engine guardrails (per CLAUDE.md):
#   • Map: rush-hour-arena (128 × 40 playable; x in [2..126], y in
#     [2..38]). All actor / region cells are inside.
#   • CLAUDE.md footgun: enemy clusters at (50,20) silently FAIL to
#     place. Cluster cells are (49,19), (49,21), (51,19), (51,21) —
#     verified-placeable neighbours used by other packs.
#   • A persistent far enemy `fact` at (120,20) prevents engine auto-
#     done when the central cluster is cleaned out (so the win/fail
#     evaluator sees the terminal frame instead of a DRAW collapse).
#   • after_ticks fail clauses are reachable within max_turns
#     (tick ≤ 93 + 90·(max_turns-1)); within_ticks 4500 < 4503 at
#     max_turns 50; staller hits after_ticks 4501 and LOSES, not draws.

meta:
  id: coord-cover-and-move
  title: 'Bounding Overwatch — One Squad Covers While the Other Moves'
  capability: action
  real_world_meaning: >
    Two armoured squads must cross a centre-of-map FIRE ZONE held by
    static anti-tank infantry. Charging both squads through together
    stacks every enemy's fire onto a single dense column and busts the
    attrition cap. Sending one squad alone leaves the other idle and
    the lone column still absorbs ALL the cluster's fire. The intended
    capability is bounding overwatch: one squad stops just OUTSIDE the
    cluster's range and acts as the COVER team — firing on the cluster
    to draw its attention from the closer flank — while the BOUNDING
    team sweeps WIDE through the periphery (outside enemy sight) to a
    forward position; then the roles alternate so the cover team can
    also cross safely. The cluster's fire is split per phase rather
    than stacked on one column, so each squad takes at most one loss.
  robotics_analogue: >
    Multi-agent traversal of a contested corridor where defenders have
    a fixed effective range envelope and concentrate fire on whichever
    cluster is closest. Single-team traversal eats the full defensive
    fire envelope; the joint policy alternates an OVERWATCH role
    (suppressive fire drawing defender attention from a flank) with a
    BOUNDING role (sweep through the cleared periphery). The
    coordination is the role-alternation — leapfrogging cover and
    move — not just splitting the force.
  benchmark_anchor:
    - "US Army FM 3-21.8 bounding overwatch (fire-and-maneuver doctrine)"
    - "SC2 siege-tank leapfrog advance under enemy fire"
    - "SMAC coordinated cross of a danger zone with split defender fire"
    - "MicroRTS multi-squad alternating cover-and-move"
  author: "openra-bench"

base_map: rush-hour-arena

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: ''}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  # React the instant the moving squad takes a hit or first contact is
  # made — bounding overwatch is REACTIVE micro (the cover team must
  # re-target as bounding-team contact opens up). Without these
  # interrupts the role-alternation only re-evaluates on fixed turn
  # boundaries and the e3 cluster gets free shots through every gap.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 6000}
  actors: []   # every level supplies its own actor list via overrides.

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare bound-and-cover skill: a 3× e3 anti-tank-rocket cluster at the
  # centre anchored by TWO 4tnk heavy tanks. Engine movement-fix
  # recalibration: a charging column now genuinely trades fire while
  # crossing — probing shows e3 rockets are the real anti-armour DPS,
  # but it takes TWO heavy-tank anchors alongside them to cost a
  # 6-tank charge TWO tanks. A both-charge straight through the centre
  # eats the e3 rockets + the heavy-tank brawl and loses 2 tanks
  # (busts the cap); stall times out; single-squad leaves half the
  # force idle AND loses 2 crossing. The intended bound-and-cover
  # routes both squads through the far periphery (y≈6 / y≈34, outside
  # the centre fire zone) and converges east — taking zero losses.
  # Easy is the FORGIVING tier: a smaller 3× e3 cluster (medium/hard
  # field 4× e3), so the bounding-lane geometry is the bare skill.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Two squads (Squad A at (10,15), Squad B at (10,25), 3 medium tanks
    # each) must cross a centre-of-map fire zone — a small anti-tank
    # rocket-soldier (e3) cluster anchored by two heavy tanks (4tnk) at
    # roughly (50,20) — then land ≥4 tanks in the EAST gathering region (x
    # ≈ 100, y ≈ 20, radius 6) before tick 4500, losing ≤1 tank in total.
    # Charging both squads straight through the centre drives them into
    # the rocket fire and the heavy-tank brawl and busts the cap; a single
    # column alone absorbs every shot AND leaves half the force behind.
    # Alternate ROLES: one squad anchors at the edge of enemy range to
    # draw fire while the other sweeps through the periphery (y outside
    # the centre fire zone) and crosses; then switch.
    description: >
      Two squads of three medium tanks each stage at (10,15) and (10,25).
      The centre at (50,20) holds three rocket soldiers anchored by two
      heavy tanks. Charging both squads straight through busts the loss
      cap. Use bounding overwatch: one squad anchors and draws fire from
      the edge while the other sweeps the periphery, then swap. Four tanks
      at (100,20), one loss max, within about 50 turns.
    overrides:
      actors:
        # Squad A — northern fire team, staged at (10, 15).
        - {type: 2tnk, owner: agent, position: [10, 14], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 15], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 16], stance: 1}
        # Squad B — southern fire team, staged at (10, 25).
        - {type: 2tnk, owner: agent, position: [10, 24], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 25], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 26], stance: 1}
        # Centre fire zone: 3× anti-tank rocket soldiers + 2 heavy-
        # tank anchors, all stance:2 Defend (auto-fire in range but
        # STATIONARY — so a stall policy is a clean timeout LOSS, not
        # an attrition one). Cells avoid (50,20) — CLAUDE.md footgun:
        # enemy clusters at (50,20) silently fail to place. Off-axis
        # neighbours (49/51 × 19/21) are verified-placeable.
        - {type: e3,   owner: enemy, position: [49, 19], stance: 2}
        - {type: e3,   owner: enemy, position: [49, 21], stance: 2}
        - {type: e3,   owner: enemy, position: [51, 21], stance: 2}
        - {type: 4tnk, owner: enemy, position: [49, 20], stance: 2}
        - {type: 4tnk, owner: enemy, position: [51, 19], stance: 2}
        # Persistent far enemy `fact` — keeps the episode alive past
        # the central cluster being cleaned out so the win/fail
        # evaluator sees the terminal frame (no DRAW collapse).
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 100, y: 20, radius: 6, n: 4}}
        - {units_lost_lte: 1}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4500}
        - {not: {units_lost_lte: 1}}
        - {not: {own_units_gte: 1}}
    max_turns: 50

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 axis vs easy: the e3 anti-tank rocket cluster grows from 3 to
  # 4 (a wider, denser fire zone) while keeping the TWO 4tnk anchors.
  # The fire zone is genuinely lethal to a 2tnk column crossing the
  # centre. Both-charge-together LOSES (the centre brawl + rockets
  # bust units_lost_lte:1); single-squad alone LOSES (lone column
  # absorbs the centre fire AND half the force never reaches the win
  # region). Only true bound-and-cover (route the squads through the
  # far periphery, alternating cover/move roles) lands ≥4 tanks
  # losing ≤1.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Two squads (Squad A at (10,15), Squad B at (10,25), 3 medium tanks
    # each) must cross a centre-of-map FIRE ZONE — four static anti-tank
    # rocket soldiers (e3) anchored by two heavy tanks (4tnk) at roughly
    # (50,20) — then land ≥4 tanks in the EAST gathering region (x ≈ 100,
    # y ≈ 20, radius 6) before tick 4500, losing ≤1 tank in total.
    # Charging BOTH squads straight through the centre drives them into
    # the heavy-tank brawl and the e3 anti-armour fire and busts the cap.
    # Sending one squad alone leaves the other idle and the lone column
    # absorbs every shot. The intended idiom is BOUNDING OVERWATCH: one
    # squad anchors at the EDGE of enemy range drawing the cluster's
    # attention from the closer flank, while the other squad sweeps WIDE
    # through the periphery (around y ≈ 6..9 / y ≈ 31..34, OUTSIDE the
    # centre fire zone) to the east. Then the roles ALTERNATE — the team
    # that moved opens fire from the east edge of the cluster while the
    # original cover team relocates and crosses through the same periphery
    # band. Each squad takes ≤1 loss because the fire is SPLIT per phase,
    # not stacked.
    description: >
      Same two-squad setup, but the centre now packs four rocket soldiers
      and two heavy tanks. Drive one squad up to the edge of enemy range
      to draw fire while the other sweeps wide (y=6..9 or y=31..34) past
      the fire zone, then alternate roles. Four tanks at (100,20), at most
      one loss, within about 50 turns.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [10, 14], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 15], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 16], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 24], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 25], stance: 1}
        - {type: 2tnk, owner: agent, position: [10, 26], stance: 1}
        # Centre fire zone: 4× anti-tank rocket soldiers + 2 heavy-
        # tank anchors, all stance:2 Defend (auto-fire in range,
        # STATIONARY — a stall policy is a clean timeout LOSS).
        - {type: e3,   owner: enemy, position: [49, 19], stance: 2}
        - {type: e3,   owner: enemy, position: [49, 21], stance: 2}
        - {type: e3,   owner: enemy, position: [51, 19], stance: 2}
        - {type: e3,   owner: enemy, position: [51, 21], stance: 2}
        - {type: 4tnk, owner: enemy, position: [49, 20], stance: 2}
        - {type: 4tnk, owner: enemy, position: [51, 20], stance: 2}
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 100, y: 20, radius: 6, n: 4}}
        - {units_lost_lte: 1}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4500}
        - {not: {units_lost_lte: 1}}
        - {not: {own_units_gte: 1}}
    max_turns: 50

  # ── HARD ─────────────────────────────────────────────────────────
  # +2 axes vs medium:
  #   1. ZERO attrition cap (units_lost_lte: 0) — any tank loss
  #      fails. The bounding route must keep EVERY tank entirely
  #      outside the centre fire zone for the whole crossing (the
  #      zero-loss bar makes the periphery geometry load-bearing
  #      instead of a margin-of-error luxury).
  #   2. An additional e1 RIFLE-INFANTRY swarm extends the fire
  #      envelope (3× e1 north of the cluster + 3× e1 south),
  #      tightening the periphery-route corridor: a squad that drifts
  #      to y=12 or y=28 brushes the rifle screens. The bounding lane
  #      is narrower — bound through y=6..9 or y=31..34, not y=12+ or
  #      y=27-.
  #   3. Strike force stages from TWO seed-driven spawn_point groups
  #      (NORTH-WEST y=11..17 OR SOUTH-WEST y=23..29), round-robined
  #      by seed. The cluster and the win region are symmetric across
  #      y=20 so EITHER spawn faces an equivalent bounding decision
  #      (cover from the closer flank, bound around the FAR
  #      periphery), but a single memorised bound vector cannot
  #      generalise across seeds.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Two squads (3 medium tanks each, staged at the NW or SW corner,
    # chosen by seed for anti-memorisation) must cross a centre-of-map
    # FIRE ZONE — four anti-tank rocket soldiers (e3) anchored by two
    # heavy tanks (4tnk) at roughly (50,20), flanked by two rifle-infantry
    # SCREENS that extend the fire envelope north and south — and land ≥4
    # tanks in the EAST gathering region (x ≈ 100, y ≈ 20, radius 6)
    # before tick 4500, losing ZERO tanks in total. The intended idiom is
    # BOUNDING OVERWATCH with the wide-flank route tightened by the rifle
    # screens: one squad anchors at the edge of the fire zone to draw fire
    # while the bounding squad sweeps through the FAR periphery (around y
    # ≈ 6..9 from the NORTH spawn, or y ≈ 31..34 from the SOUTH spawn —
    # outside the centre fire zone AND the rifle-screen weapon range) to
    # the east. Then the roles alternate. Zero loss is only achievable by
    # routing every tank around the centre fire zone, never through it.
    description: >
      Two tank squads stage at the NW or SW corner by seed. The centre
      fire zone now adds rifle screens to the four rockets and two heavies
      — and the loss cap is zero. The only safe route is bounding
      overwatch through the FAR periphery, alternating cover and move on
      every leg. Four tanks at (100,20), no losses, within about 50 turns.
    overrides:
      actors:
        # spawn_point 0 — NORTH-WEST staging (Squad A at (10,12)
        # north, Squad B at (10,16) south of A but still north of
        # centre — they bound through the far NORTH periphery
        # y ≈ 6..9 outside both rifle-screen and rocket sight).
        - {type: 2tnk, owner: agent, position: [10, 11], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [10, 12], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [10, 13], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [10, 15], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [10, 16], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [10, 17], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH-WEST staging (mirrored across y=20).
        # The cover/bound decision is symmetric: cover at south
        # edge of e3 range, bound through y ≈ 31..34.
        - {type: 2tnk, owner: agent, position: [10, 23], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [10, 24], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [10, 25], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [10, 27], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [10, 28], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [10, 29], stance: 1, spawn_point: 1}
        # Centre rocket cluster + 2 heavy-tank anchors — the same
        # 4× e3 + 2× 4tnk fire zone as medium, symmetric across y=20
        # so EITHER spawn faces an equivalent geometry. All stance:2
        # Defend (auto-fire in range, STATIONARY — clean timeout
        # LOSS for a staller).
        - {type: e3,   owner: enemy, position: [49, 19], stance: 2}
        - {type: e3,   owner: enemy, position: [49, 21], stance: 2}
        - {type: e3,   owner: enemy, position: [51, 19], stance: 2}
        - {type: e3,   owner: enemy, position: [51, 21], stance: 2}
        - {type: 4tnk, owner: enemy, position: [49, 20], stance: 2}
        - {type: 4tnk, owner: enemy, position: [51, 20], stance: 2}
        # Rifle-infantry SCREENS — extend the fire envelope north
        # and south of the rocket cluster, tightening the bounding
        # lane. y=14 / y=26 are within e3 cluster's sight (5c) so
        # the screens reinforce the same envelope — a squad
        # bounding through y=12 or y=28 would be in screen range
        # (e1 rng4c sees out to ~y=10 from y=14). The intended
        # bounding lane is OUTSIDE that envelope: y ≈ 6..9 (NORTH)
        # or y ≈ 31..34 (SOUTH). stance:2 Defend (stationary).
        - {type: e1,   owner: enemy, position: [49, 14], stance: 2}
        - {type: e1,   owner: enemy, position: [51, 14], stance: 2}
        - {type: e1,   owner: enemy, position: [50, 13], stance: 2}
        - {type: e1,   owner: enemy, position: [49, 26], stance: 2}
        - {type: e1,   owner: enemy, position: [51, 26], stance: 2}
        - {type: e1,   owner: enemy, position: [50, 27], stance: 2}
        # Persistent far enemy fact — engine auto-done mitigation.
        - {type: fact, owner: enemy, position: [120, 20]}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 100, y: 20, radius: 6, n: 4}}
        - {units_lost_lte: 0}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4500}
        - {not: {units_lost_lte: 0}}
        - {not: {own_units_gte: 1}}
    max_turns: 50
