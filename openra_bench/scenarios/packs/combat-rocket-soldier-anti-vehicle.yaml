# combat-rocket-soldier-anti-vehicle — REASONING capability: RPS counter
# selection (inverse of combat-vehicle-vs-infantry-counter / sibling of
# combat-focus-fire-priority). The enemy is a pre-placed band of HEAVY
# tanks (3tnk on easy/medium, 4tnk mammoths on hard). Starting cash funds
# EXACTLY ONE coherent composition; the agent must pick the right unit
# TYPE to counter heavy armour:
#
#   • e3 (rocket soldier, anti-vehicle Dragon launcher, range 4, anti-
#     armour DPS) — the INTENDED counter. 6× e3 ($300 each = $1800)
#     shreds heavy armour at range; the heavies fire back (stance:2
#     Defend) but cannot close, so rocket DPS strips their HP first.
#   • 1tnk (light tank, $700) — WRONG counter. The cash budget only buys
#     ~2 light tanks; light cannons vs heavy armour lose attrition (3tnk
#     hp 450 / dps 30 vs 1tnk hp ~200) — the lights die before the heavy
#     stack does.
#   • e1 (rifle infantry, $100) — WRONG counter. e1 has no anti-armour
#     weapon (cannot scratch heavy tank armour); spamming 18× e1 racks
#     up zero kills and the kill bar fails.
#   • stall — kill bar never met; the timeout LOSES.
#
# 2026-05-23 audit (Family-1 #20): briefing rewritten per
# audits/EDIT_PRINCIPLES.md; map shrunk rush-hour-arena 128x40 →
# tailored arena 64x40 per tier so the base footprint and engagement
# distance fit in ~40 cells of corridor.
#
# POSTURE FIX (2026-05-23): enemy heavy tanks bumped from stance:0
# HoldFire to stance:2 Defend. Previously the heavies sat passive and
# absorbed fire without firing back — with no incoming damage, even
# 2× 1tnk could trade favourably vs 2× 3tnk and the e3 counter was
# not load-bearing. Defenders now auto-fire on the closest in-range
# attacker but never advance (st2 semantics — engine pinned by
# tests/test_stance_semantics_python.py), so light tanks lose
# attrition decisively and rocket-mass becomes the only winning
# composition.
#
# Real-world anchor: anti-armour procurement decision (TOW/Javelin/RPG
# vs armoured concentration) — the right asset class is determined by
# the threat composition, not by cost or volume. Buying a lot of the
# wrong asset (light AFVs vs main battle tanks) loses force-on-force.
# Benchmark anchor: SC2 hard-counter (mutalisk vs marine, marine vs
# zergling) — picking the matchup-winning unit type IS the decision.
# Sibling: mid-tech-switch-on-scout (scout-THEN-counter) and lh-tech-
# pivot-attack (scout-pivot-attack); THIS pack reveals the threat
# (heavy tanks visible on easy / fog-revealed on medium); the question
# is purely the RPS counter CHOICE, not the scout-first ordering.
#
# Engine guardrails:
#   • Map: tailored 64×40 arena per tier (single explicit mpspawn so
#     authored coords are not seed-rotated). Agent base x≈8; enemy
#     heavy band x≈40 (within e3 range-4 of the agent's eastward
#     attack-move column).
#   • Persistent far-east enemy `fact` keeps the episode alive past
#     the moment the heavies fall so the win predicate evaluates
#     (CLAUDE.md auto-done footgun).
#   • Pre-placed agent: fact + powr + tent + weap + fix so BOTH
#     counters are PRODUCIBLE — the RPS choice is not gated by
#     missing prereqs (build('1tnk') and build('e3') both compile).
#   • `not own_units_gte:1` is NOT used in fail_condition because
#     the agent starts unit-less (CLAUDE.md footgun from
#     economy-force-buildup); fact loss + after_ticks are the
#     fail clauses.
#   • after_ticks/within_ticks are inside max_turns budget
#     (tick ≤ 93 + 90·(max_turns-1)).
#   • Hard tier defines 2 spawn_point groups (NORTH base y=12 /
#     SOUTH base y=28) round-robined by seed — satisfies
#     test_hard_tier.py::UPGRADED. The enemy heavy band is
#     centre-mid (y=20) so both spawns face symmetric pursuit
#     geometry (e3 range 4 reaches across the y-gap once units
#     advance to the engagement column).

meta:
  id: combat-rocket-soldier-anti-vehicle
  title: 'Rocket Soldier vs Heavy Armour — Pick the Hard-Counter Unit Type'
  capability: reasoning
  real_world_meaning: >
    A starting cash budget that funds exactly one coherent composition
    must be allocated against a pre-placed enemy band of HEAVY TANKS
    (3tnk Soviet heavy on easy/medium, 4tnk Mammoth on hard). The agent
    must train ROCKET SOLDIERS (e3, the anti-vehicle Dragon launcher),
    not light tanks (1tnk — the budget buys only ~2, which lose
    attrition to heavy armour) and not rifle infantry (e1 — no
    anti-armour weapon, racks up zero kills against tank armour). The
    decision is the RPS counter CHOICE (matchup-winning unit type)
    given the visible threat composition.
  robotics_analogue: >
    Anti-armour procurement against an armoured concentration: a
    fielded inventory of TOW / Javelin / RPG launchers defeats a
    main-battle-tank column, while an equivalent budget spent on
    light AFVs or rifle squads is force-on-force inferior. Asset
    CLASS — not cost or count — determines the engagement outcome.
  benchmark_anchor:
    - "SC2 hard-counter"
    - "anti-armor procurement"
    - "military RPS"
  author: openra-bench

base_map:
  generator: arena
  name: combat-rocket-soldier-anti-vehicle-arena
  width: 128
  height: 40

base:
  agent: {faction: allies}
  enemy: {faction: soviet, bot_type: ''}
  tools:
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  termination:
    max_ticks: 8000
  actors: []

levels:
  # ── EASY ───────────────────────────────────────────────────────────
  # Bare RPS-counter skill. Enemy: 2 visible heavy tanks (3tnk),
  # stance:2 Defend — they auto-fire back on the closest in-range
  # attacker but never advance. Cash $1800 buys exactly 6× e3 (the
  # intended counter), OR ~2 1tnks (wrong: 2 light tanks die fast to
  # 2 heavies trading head-on), OR ~18 e1 (wrong: no anti-armour,
  # kills=0). Kill bar: ≥1 enemy heavy down. Generous clock
  # (≤4500 ticks).
  easy:
    description: >
      Commander, this is a counter-armour engagement on a 64x40
      arena. You are given a starter base on the west — Construction
      Yard, Power Plant, Infantry Barracks, War Factory, and Service
      Depot — plus $1800 starting cash. Two enemy heavy tanks hold
      position at (40, 18) and (40, 22) on Defend orders: they will
      auto-fire on the closest in-range attacker but won't chase.
      Field at least 6 rocket soldiers (anti-vehicle Dragon
      launchers, range 5, cost $300 each), score at least 1 enemy
      heavy kill, keep your Construction Yard intact, within 4500
      ticks.
    starting_cash: 1800
    overrides:
      base_map:
        generator: arena
        name: combat-rocket-soldier-easy-arena
        width: 64
        height: 40
        cordon: 2
        spawns: [[6, 20]]
        title: 'Rocket Soldier vs Heavy Armour — Easy 64x40'
      actors:
        # Agent base — both counters producible (weap for 1tnk,
        # tent for e3). Centre-west footprint at x=8..16.
        - {type: fact, owner: agent, position: [8, 20]}
        - {type: powr, owner: agent, position: [12, 20]}
        - {type: tent, owner: agent, position: [8, 24]}
        - {type: weap, owner: agent, position: [12, 24]}
        - {type: fix,  owner: agent, position: [16, 20]}
        # Enemy: 2 visible heavy tanks at the engagement column.
        # stance:2 (Defend) — they auto-fire on in-range attackers
        # but don't advance, so kiting with rockets works while a
        # 1tnk head-on trade decisively loses.
        - {type: 3tnk, owner: enemy, position: [40, 18], stance: 2}
        - {type: 3tnk, owner: enemy, position: [40, 22], stance: 2}
        # Persistent far-east enemy fact — prevents engine auto-done
        # on heavy-tank wipe collapsing the run to DRAW.
        - {type: fact, owner: enemy, position: [60, 20]}
        # Secondary off-axis MustBeDestroyed building (powr) tucked in
        # the far-north corner. Qwen-9B deep-dive (2026-05-23,
        # audits/qwen9b_draws_and_medium_dip.md) found seed:1 DREW
        # because the model targeted the visible (60,20) `fact` with
        # AttackUnit, killed it, and the engine auto-done'd on
        # enemy-elimination BEFORE the `unit_type_count_gte:e3:6` build
        # clause could fire. This second sentinel survives that race
        # so the win/fail evaluator sees the terminal frame regardless
        # of which sentinel is destroyed first.
        - {type: powr, owner: enemy, position: [62, 2]}
    win_condition:
      all_of:
        - {unit_type_count_gte: {type: e3, n: 6}}
        - {units_killed_gte: 1}
        - {own_units_gte: 1}
        - {has_building: fact}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {has_building: fact}}
    max_turns: 51

  # ── MEDIUM ─────────────────────────────────────────────────────────
  # +1 controlled variable vs easy: enemy heavies are FOG-CONCEALED
  # (no pre-placed visibility) AND a third heavy is added (3× 3tnk).
  # The agent still has line-of-sight to the engagement column once
  # the e3 stack advances; the brief still names "heavy tanks" so the
  # RPS choice is purely the counter axis, not "scout to learn what's
  # there". Cash $1800 still buys exactly the 6× e3 composition. Kill
  # bar tightens to ≥2 heavies down.
  medium:
    description: >
      Commander, this is a counter-armour engagement on a 64x40
      arena. You are given a starter base on the west — Construction
      Yard, Power Plant, Infantry Barracks, War Factory, and Service
      Depot — plus $1800 starting cash. Three enemy heavy tanks
      wait at (40, 18), (40, 20), and (40, 22) under fog on Defend
      orders: they will return fire on whatever comes into range
      but won't chase. Field at least 6 rocket soldiers (anti-
      vehicle Dragon launchers, range 5, cost $300 each), score at
      least 2 heavy kills, keep your Construction Yard intact,
      within 4500 ticks.
    starting_cash: 1800
    overrides:
      base_map:
        generator: arena
        name: combat-rocket-soldier-medium-arena
        width: 64
        height: 40
        cordon: 2
        spawns: [[6, 20]]
        title: 'Rocket Soldier vs Heavy Armour — Medium 64x40'
      actors:
        - {type: fact, owner: agent, position: [8, 20]}
        - {type: powr, owner: agent, position: [12, 20]}
        - {type: tent, owner: agent, position: [8, 24]}
        - {type: weap, owner: agent, position: [12, 24]}
        - {type: fix,  owner: agent, position: [16, 20]}
        # THREE heavy tanks at the engagement column (Defend).
        - {type: 3tnk, owner: enemy, position: [40, 18], stance: 2}
        - {type: 3tnk, owner: enemy, position: [40, 20], stance: 2}
        - {type: 3tnk, owner: enemy, position: [40, 22], stance: 2}
        - {type: fact, owner: enemy, position: [60, 20]}
        # Secondary off-axis MustBeDestroyed sentinel (Qwen-9B
        # draws triage — see easy/hard tiers for full rationale).
        - {type: powr, owner: enemy, position: [62, 2]}
    win_condition:
      all_of:
        - {unit_type_count_gte: {type: e3, n: 6}}
        - {units_killed_gte: 2}
        - {own_units_gte: 1}
        - {has_building: fact}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {has_building: fact}}
    max_turns: 51

  # ── HARD ───────────────────────────────────────────────────────────
  # +2 controlled variables vs medium:
  #   1. Enemy upgraded to 4tnk MAMMOTH (hp 600 / dps 40+) — even
  #      heavier armour, so the wrong-counter penalty is harsher
  #      (light tanks even more outclassed; e1 still zero-effect).
  #   2. TWO agent spawn_point groups (NORTH base y=12 / SOUTH base
  #      y=28) round-robined by seed — required by hard-tier curation
  #      contract (UPGRADED in tests/test_hard_tier.py). The enemy
  #      4tnk band is centred mid-map (y=20) so both spawns face
  #      symmetric pursuit geometry (each base's eastward column
  #      meets the heavies at the same x).
  # Kill bar: ≥2 mammoths down; tighter clock (≤3600 ticks).
  hard:
    description: >
      Commander, this is a counter-armour engagement on a 64x40
      arena against a denser heavy formation. You are given a
      starter base — Construction Yard, Power Plant, Infantry
      Barracks, War Factory, Service Depot, and a scout jeep —
      staged either north (y=12) or south (y=28) by seed, plus
      $1800 starting cash. FOUR enemy heavy tanks hold the centre
      engagement column at (40, 16), (40, 19), (40, 21), and
      (40, 24) on Defend orders: they will auto-fire on the
      closest in-range attacker but won't chase. Field at least 6
      rocket soldiers (anti-vehicle Dragon launchers, range 5,
      cost $300 each), score at least 2 heavy kills, keep your
      Construction Yard intact, within 3600 ticks.
    starting_cash: 1800
    overrides:
      base_map:
        generator: arena
        name: combat-rocket-soldier-hard-arena
        width: 64
        height: 40
        cordon: 2
        spawns: [[6, 12], [6, 28]]
        title: 'Rocket Soldier vs Mammoth — Hard 64x40 (NORTH/SOUTH)'
      actors:
        # NORTH base spawn (spawn_point 0).
        - {type: fact, owner: agent, position: [8, 12], spawn_point: 0}
        - {type: powr, owner: agent, position: [12, 12], spawn_point: 0}
        - {type: tent, owner: agent, position: [8, 16], spawn_point: 0}
        - {type: weap, owner: agent, position: [12, 16], spawn_point: 0}
        - {type: fix,  owner: agent, position: [16, 12], spawn_point: 0}
        # Single scout jeep at the base edge — a token unit so the
        # seed-driven spawn placement is observable in
        # `units_summary` (required by the hard-tier curation test
        # in tests/test_hard_tier.py). The jeep's MG cannot scratch
        # heavy armour so it does not alter the RPS-counter
        # decision; the load-bearing build is still e3.
        - {type: jeep, owner: agent, position: [16, 14], stance: 1, spawn_point: 0}
        # SOUTH base spawn (spawn_point 1).
        - {type: fact, owner: agent, position: [8, 28], spawn_point: 1}
        - {type: powr, owner: agent, position: [12, 28], spawn_point: 1}
        - {type: tent, owner: agent, position: [8, 24], spawn_point: 1}
        - {type: weap, owner: agent, position: [12, 24], spawn_point: 1}
        - {type: fix,  owner: agent, position: [16, 28], spawn_point: 1}
        - {type: jeep, owner: agent, position: [16, 26], stance: 1, spawn_point: 1}
        # Heavy enemy band — 4× heavy tanks (3tnk), centre-mid
        # latitude so both spawns face symmetric pursuit geometry.
        # Enemy actors without spawn_point ALWAYS place — CLAUDE.md.
        # We use 3tnk (not 4tnk Mammoth) on hard because Mammoth's
        # secondary MammothTusk anti-infantry weapon (range 6.5
        # cells) outranges Dragon (5 cells); with stance:2 the
        # mammoths shred any e3 stack that enters Dragon range
        # before it can fire. 3tnk carries only the 105mm cannon
        # (range 4.75) which is OUT-ranged by Dragon — so the
        # rocket-mass alpha-strike actually lands. Four 3tnks (vs
        # three on medium) compensate the difficulty bar.
        - {type: 3tnk, owner: enemy, position: [40, 16], stance: 2}
        - {type: 3tnk, owner: enemy, position: [40, 19], stance: 2}
        - {type: 3tnk, owner: enemy, position: [40, 21], stance: 2}
        - {type: 3tnk, owner: enemy, position: [40, 24], stance: 2}
        - {type: fact, owner: enemy, position: [60, 20]}
        # Secondary off-axis MustBeDestroyed sentinel (Qwen-9B
        # draws triage — see easy tier for full rationale).
        - {type: powr, owner: enemy, position: [62, 2]}
    win_condition:
      all_of:
        - {unit_type_count_gte: {type: e3, n: 6}}
        - {units_killed_gte: 2}
        - {own_units_gte: 1}
        - {has_building: fact}
        - {within_ticks: 3600}
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {has_building: fact}}
    max_turns: 41
