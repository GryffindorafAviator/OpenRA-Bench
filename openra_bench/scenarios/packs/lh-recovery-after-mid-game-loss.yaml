# lh-recovery-after-mid-game-loss — long-horizon two-base
# strategic-retreat: recover at the safe HOME base after a sustained
# in-world attack destroys the FORWARD base.
#
# Wave-11 / Wave-13 REDESIGN (task #81 two-base strategic-retreat
# template). The previous incarnation used a one-shot scheduled
# `destroy_actors` event at tick 1500 to externally raze the forward
# refinery and tanks; that punished a rational operator who would
# PREEMPTIVELY harden the forward economy (build a second refinery
# adjacent to it BEFORE the disaster, ride out the strike, keep the
# forward income channel) because the destroy event was unconditional
# and would also delete any redundant build inside its blast region.
# The redesign reframes the loss as an IN-WORLD sustained threat:
# a heavy enemy rush BAND (in-world ground forces) plus repeated
# `scheduled_events: spawn_actors` reinforcement waves grind the
# FORWARD base flat over the first half of the episode AND keep the
# forward region hostile so any rebuild attempted at the forward
# latitude is razed in turn. The HOME base (deep-west MCV + powr,
# unreachable by the rush bands inside the deadline) is the only
# safe rebuild site, and that is exactly what the WIN state encodes.
#
# This is the two-base strategic-retreat template (def-retreat-and-
# rebuild, def-evacuation, mid-concede-vs-hold). The LH-axis is the
# long deliberation horizon: the agent gets ~17 turns of working
# forward income before the first rush band arrives, sees the loss
# unfold in-world, and has another ~30 turns to deploy the HOME MCV,
# build a new refinery there, and stabilise — exactly the disaster-
# recovery / SC2-comeback / PlanBench-replanning anchor, but driven
# by an enemy that the model can OBSERVE rather than a deus-ex-
# machina deletion.
#
# Capability under test: NOTICE the forward base losing ground to
# the in-world rush, RECOGNISE that a forward rebuild will be razed
# by the next wave, and STAND UP the home-base refinery so the
# state-based win predicate (a fact AND a proc alive in the deep-
# west HOME radius at the deadline) is satisfied. Stall, hold-
# forward (try to defend), build-at-forward (rebuild forward —
# razed by the next wave), and deploy-but-no-proc all LOSE.
# Build-at-home and build-at-both both WIN: a preemptive HOME
# refinery built BEFORE the loss lands is FULLY credited (the
# operator who hardens the standby site early is the operator
# this pack rewards).
#
# Difficulty axis (one new controlled variable per tier):
#   • easy   — bare skill. One in-world rush band at tick 0
#              (6× e1 + 2× e3) plus one mid-wave reinforcement at
#              ~tick 1500 (3× e1 + 1× e3). HOME at x=10; FORWARD
#              at x=40 with fact + proc + powr + 2 defenders + harv
#              + ore patch. Generous clock (within_ticks 4500,
#              max_turns 60 ⇒ ceiling ~5150).
#   • medium — +1 axis: HEAVIER rush (6× e1 + 2× e3 from t=0) and
#              an EXTRA reinforcement wave (~tick 3000 — proves a
#              quick forward-rebuild is also razed) under the same
#              clock. The home-rebuild window remains comfortable
#              but the forward base falls faster and a hold-forward
#              attempt bleeds more obviously.
#   • hard   — +1 axis: TWO seed-driven AGENT spawn_point groups
#              (NORTH y=14 / SOUTH y=26). HOME, FORWARD and the
#              eastern garrison all shift latitude per seed. The
#              rush bands and reinforcement waves are declared at
#              BOTH latitudes (enemy / scheduled events ignore
#              spawn_point); the rusher bot commits each band to
#              the active centroid. A memorised "rebuild at y=20"
#              satisfies NEITHER safe region.
#
# Bar (the four-script discrimination — every level × every seed):
#   • stall (only `observe`): home MCV never deployed, no home proc
#     ever exists, the forward fact + forward proc fall to the
#     rush, total fact count drops to 0 → fact-loss fail clause
#     fires (LOSS) and the within_ticks gate would LOSS regardless
#     on the empty-radius state.
#   • build-at-forward (try to rebuild proc at the forward latitude
#     after the loss, never touch HOME MCV): the rebuilt forward
#     proc is razed by the NEXT reinforcement wave; meanwhile no
#     home fact ever exists; total fact count eventually drops to
#     0 → LOSS (or the deadline expires on an empty HOME radius).
#   • build-at-home (deploy the HOME MCV and build a home-radius
#     proc, even if the forward base falls): home fact AND home
#     proc alive at the deadline → WIN. This is the intended
#     play.
#   • build-at-both (deploy HOME + build HOME proc AND attempt a
#     forward rebuild on the side): the home rebuild satisfies the
#     win clause; the forward attempt is wasted cash but not
#     fatal → still WIN. Preemptive redundancy is fully credited
#     by the state-based predicate.
#
# Anchor: PlanBench replanning under exogenous failure; disaster
# recovery; the SC2 comeback (rebuild after a bad trade and still
# finish the operation on the original timeline); strategic
# withdrawal / business continuity failover (preserve the standby
# site, accept the loss of the primary).
#
# ENGINE FACTS APPLIED (CLAUDE.md, verified 2026-05-24):
#  - `scheduled_events: spawn_actors` injects new enemy actors
#    mid-episode (pinned by openra-data/tests/test_scheduled_events.
#    rs + tests/test_scheduled_events.py). Spawned actors get fresh
#    ids and merge into the engine's per-tick activity loop, so the
#    `rusher` bot picks them up on the next centroid scan and
#    drives them toward the agent centroid — keeping the forward
#    region hostile for the WHOLE episode, not just the first 1500
#    ticks. This is the "capable of destroying new FORWARD builds
#    too" requirement of the two-base strategic-retreat template.
#  - `rusher` scripted bot (openra-sim/src/scripted_bot.rs::Rusher)
#    concentrates the entire enemy ground force on the agent
#    CENTROID every ~8 ticks. The centroid is dominated by the
#    forward base mass (fact + proc + powr + defenders at x=40);
#    the deep-west HOME (x=10) is far behind the centroid and the
#    rusher band cannot reach it inside the deadline (a fresh e1
#    rusher takes ~2000 ticks to walk 90 cells across the map).
#  - `building_in_region: {type, x, y, radius, count}` predicate
#    (win_conditions.py:201): counts live agent buildings whose
#    cell is within `radius` of (x, y). The win clauses encode
#    HOME-radius fact + HOME-radius proc directly — a build at the
#    forward latitude does NOT satisfy them, and a build at HOME
#    DOES, regardless of when the forward base falls.
#  - `building_count_gte` re-counts LIVE buildings every frame
#    (win_conditions.py), so the `fact ≥ 1` fail clause flips true
#    the instant total fact count drops to 0 — a stall that loses
#    both the forward AND the home (un-deployed) base LOSES on the
#    fact-loss clause, not just on the deadline.
#  - `deploy` works for scenario-declared MCVs (Wave-2 fix in
#    openra-sim/src/gamerules.rs + env.rs `kind_for_unit_type`).
#    `Command.deploy([mcv_id])` removes the MCV and creates an
#    agent `fact` at offset (mcv_x-1, mcv_y-1), re-enabling the
#    Building / Defense production queues.
#  - `place_building` does NOT enforce build-adjacency
#    (CLAUDE.md) — `proc` can be placed at any in-bounds cell once
#    the post-deploy HOME fact is alive and the Building queue has
#    the item.
#  - `proc` cost = 1400; `e1` rifle cost = 100; `e3` rocket cost =
#    300. starting_cash 1600 funds exactly ONE proc (1400) + ~200
#    slack — no spare to mount a meaningful forward-base defence
#    (a few pbox / e1 cannot stop a 4× e1 + 1× e3 band, and
#    spending the rebuild cash on defenders forfeits the home
#    rebuild and LOSES the win clauses).
#  - Persistent unarmed enemy `fact` far east (x=125) keeps the
#    episode alive past any rush-band wipe so the win/fail
#    evaluator fires — anti-DRAW guard (CLAUDE.md
#    "Engine auto-done" footgun).
#  - `termination.enemy_units_killed: false` preserved from commit
#    d9ecc30c — keeps the run alive past an enemy-side wipe even
#    if the agent's forward defenders manage to kill the entire
#    visible rush before reinforcements land. The win clause is
#    state-based; an enemy wipe must not collapse the run to DRAW
#    before the state predicates evaluate.
#  - Tick budget (CLAUDE.md non-interrupt formula): max_turns 60 ⇒
#    ceiling ~5150 ≥ within_ticks 4500 / after_ticks 4501 ✓. The
#    HOME deploy + proc-build cycle resolves around tick 1100-1300
#    (well before the first reinforcement wave), so the win
#    typically latches early; the long-horizon character comes
#    from the deliberation window during which the forward base is
#    crumbling and the agent must commit to the home rebuild.
#  - Hard `spawn_point` rule (CLAUDE.md oramap.rs): ANY agent
#    actor with a `spawn_point` filters OUT every ungrouped agent
#    actor, so the FULL forward base + home base are duplicated
#    across both NORTH / SOUTH spawn groups. Enemy actors and
#    scheduled_events do NOT honour spawn_point, so the rush band
#    and reinforcement waves are declared at BOTH latitudes; the
#    rusher bot commits each band to the active centroid, the
#    dormant-latitude waves wander into empty space and never
#    threaten the home rebuild.
#  - §9.5 briefing rule: the description names the situation
#    (forward base under sustained attack; safe home with parked
#    MCV; objective: maintain a working production base alive at
#    deadline) WITHOUT prescribing the verb chain. The model must
#    derive "deploy HOME MCV + build HOME proc" from the toolset
#    and the topology.

meta:
  id: lh-recovery-after-mid-game-loss
  title: 'Disaster Recovery — Rebuild at the Home Base After a Mid-Game Loss'
  capability: reasoning
  real_world_meaning: >
    Long-horizon reactive replan after a sustained mid-mission
    attack overruns the operating forward base. The agent runs a
    working forward production base (Construction Yard + Refinery
    + Power Plant + Ore Truck + ore patch) AND a deeper home base
    (parked Mobile Construction Vehicle + Power Plant, well west
    of the rush ingress lane) at the start. An enemy ground rush
    closes from the east; reinforcement waves keep arriving so the
    forward region stays hostile for the whole episode. The
    objective is to keep a Construction Yard AND a Refinery alive
    at the deadline. Trying to hold the forward base, rebuilding
    the refinery at the forward latitude (which is then razed by
    the next wave), giving up after the loss, or deploying the
    home MCV without standing up the home refinery all miss the
    bar. Standing up the home Refinery — preemptively before the
    loss lands, or reactively after the forward base falls — is
    the recovery move.
  robotics_analogue: >
    Business-continuity disaster-recovery failover under a
    sustained external loss. The primary production / control site
    is under sustained attack and cannot be defended inside the
    cost-and-time budget; reinforcement attacks keep arriving so a
    repair-in-place on the primary site is also wiped out. The
    cold-standby site (DR site, backup datacentre, fall-back
    command post) is in a safe region the attacker cannot reach
    inside the operation deadline. Recovery requires standing up
    the standby site — preemptively before the loss completes, or
    reactively after — so that a working production / control
    surface is alive when the deadline evaluator runs. The
    PlanBench / CICERO / SC2-comeback anchor: the original plan
    becomes infeasible mid-flight; the agent must commit to a
    deeper, defensible posture instead of doubling down on the
    primary.
  benchmark_anchor:
    - "PlanBench replanning under exogenous loss"
    - "disaster recovery / business continuity failover"
    - "SC2 comeback (recover from a bad trade)"
    - "CICERO / strategic withdrawal doctrine"
  author: openra-bench-wave-11

base_map:
  generator: arena
  name: lh-recovery-after-mid-game-loss-arena
  width: 136
  height: 40
  cordon: 2
# 1600 funds exactly ONE proc (1400) + ~200 slack — enough to stand
# up the home-base refinery, NOT enough to mount a meaningful
# forward-base defence. Per-level may override.
starting_cash: 1600

base:
  agent:
    faction: soviet
  enemy:
    faction: allies
    # `rusher` bot concentrates the band on the agent centroid every
    # ~8 ticks (scripted_bot.rs::Rusher). Because the centroid is
    # dominated by the forward base mass at x=40, the band drives
    # straight west into the forward base and razes it; once the
    # forward base falls, the band continues toward the HOME base
    # but it cannot travel the additional ~30 cells west inside the
    # rebuild window (the deploy + proc cycle completes first).
    bot_type: rusher
  tools:
    - observe
    - build
    - place_building
    - deploy
    - harvest
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  # Re-decide as the rush closes AND when any forward asset falls
  # so the agent can commit to the home rebuild without burning a
  # full turn observing the loss.
  interrupts:
    enemy_unit_spotted: true
    own_building_destroyed: true
    own_unit_lost: true
  termination:
    max_ticks: 7000
    # Preserve commit d9ecc30c: keep the run alive past an enemy-
    # side wipe so the state-based win clause evaluates at the
    # deadline regardless of in-world enemy elimination.
    enemy_units_killed: false
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare two-base recovery skill: a light rush from t=0 (4× e1 + 1× e3)
  # plus one reinforcement wave (3× e1 + 1× e3) around tick 1500 to
  # prove a forward-rebuild is also razed. The HOME deploy + proc-
  # build cycle resolves around tick 1100-1300; the home rebuild
  # finishes well before the reinforcement wave reaches the active
  # latitude.
  # max_turns 60 ⇒ ceiling tick 5403 ≥ within_ticks 4500 / after_ticks 4501 ✓.
  # Tick budget (CLAUDE.md non-interrupt: ~86 ticks/turn observed
  # in this engine — slightly under the 90 nominal). max_turns 60 ⇒
  # observed ceiling ≈ 5150-5200 ticks. within_ticks 4500 /
  # after_ticks 4501 fits with comfortable slack (matches the
  # proven def-retreat-and-rebuild template). The home-rebuild
  # cycle resolves around tick 1100-1300 so the long-horizon
  # character comes from the ~30-turn deliberation window during
  # which the forward base crumbles.
  easy:
    description: >
      Commander, you hold a forward Soviet base at the middle of the
      map — Construction Yard, Ore Refinery, Power Plant, an Ore
      Truck and two rifle defenders, with a small ore patch beside
      it. You also have a parked Mobile Construction Vehicle and a
      second Power Plant at a deep-west safe zone, well clear of the
      east-edge ingress lane. A light enemy ground rush is closing
      from the east, and scout reports warn of follow-on waves
      through the run. Cash: $1600. Win bar: a Construction Yard
      AND an Ore Refinery, both standing inside the deep-west disc
      (radius 8 around the safe zone), AND at least one of your
      units alive, within about fifty turns. Total loss of every
      Construction Yard you own is an immediate fail.
    starting_cash: 1600
    overrides:
      actors:
        # ── HOME base (deep west, safe) — parked MCV + powr + a
        # lone garrison rifleman so own_units_gte:1 holds even
        # after the forward defenders die. The powr is required
        # because proc has positive power draw; without a pre-
        # placed home powr a build of proc stalls on power.
        - {type: mcv,  owner: agent, position: [10, 20]}
        - {type: powr, owner: agent, position: [6,  20]}
        - {type: e1,   owner: agent, position: [4,  20], stance: 0}
        # ── FORWARD base (mid-map x=40, will fall) — fact + proc
        # + powr + 2 defenders + harv + ore patch. A working base
        # the agent sees operate for ~17 turns before the rush
        # arrives.
        - {type: fact, owner: agent, position: [40, 20]}
        - {type: proc, owner: agent, position: [44, 20]}
        - {type: powr, owner: agent, position: [40, 23]}
        - {type: harv, owner: agent, position: [42, 22]}
        - {type: e1,   owner: agent, position: [42, 19], stance: 2}
        - {type: e1,   owner: agent, position: [42, 21], stance: 2}
        - {type: mine, owner: neutral, position: [46, 20]}
        # ── In-world rush band — 6× e1 + 2× e3 from x=100, ~60
        # cells west of the forward base. Fast enough that hold-
        # forward cannot survive but slow enough that the home
        # rebuild has comfortable time. Sized to match def-retreat-
        # and-rebuild medium (proven to raze a defended forward
        # fact + proc inside the deadline).
        - {type: e1, owner: enemy, position: [100, 20], stance: 3, count: 6}
        - {type: e3, owner: enemy, position: [102, 20], stance: 3, count: 2}
        # ── Persistent unarmed enemy `fact` far east — engine
        # auto-`done` guard (LOSS-not-DRAW).
        - {type: fact, owner: enemy, position: [125, 20]}
      scheduled_events:
        # ── REINFORCEMENT WAVE 1 (~tick 1500): proves the forward
        # region stays hostile. The rusher bot picks up the new
        # actors on its next centroid scan and drives them west
        # into the agent centroid — so any rebuild attempted at
        # the forward latitude is razed by this wave.
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [100, 20], stance: 3, count: 3}
            - {type: e3, owner: enemy, position: [102, 20], stance: 3, count: 1}
    # State-based win: a fact AND a proc inside the HOME disc
    # (radius 8 around (10,20)) at the deadline. The deploy-MCV
    # primitive creates the HOME fact; the build('proc') +
    # place_building('proc', ...) inside the home radius creates
    # the HOME proc. Either is reachable INDIVIDUALLY by a half-
    # task play; both together require the recovery plan. A
    # preemptive HOME proc built BEFORE the loss lands satisfies
    # the clause just the same as a reactive rebuild.
    win_condition:
      all_of:
        - building_in_region: {type: fact, x: 10, y: 20, radius: 8, count: 1}
        - building_in_region: {type: proc, x: 10, y: 20, radius: 8, count: 1}
        - own_units_gte: 1
        - within_ticks: 4500
    fail_condition:
      any_of:
        - after_ticks: 4501
        # Total fact extinction (both forward AND home) → real LOSS.
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 60

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: HEAVIER in-world rush (6× e1 + 2× e3
  # from t=0) AND an EXTRA reinforcement wave around tick 3000 —
  # so a quick forward rebuild that survived wave-1 (unlikely with
  # the heavier baseline) would also be razed. Same clock.
  medium:
    description: >
      Commander, you hold a forward Soviet base at mid-map —
      Construction Yard, Ore Refinery, Power Plant, an Ore Truck
      and two rifle defenders, with a small ore patch beside it.
      You also have a parked Mobile Construction Vehicle and a
      second Power Plant at a deep-west safe zone. A heavy enemy
      ground rush — six rifles and two rocket soldiers — is closing
      from the east; reinforcement waves keep arriving through the
      run, so the forward region will stay hostile. Cash: $1600.
      Win bar: a Construction Yard AND an Ore Refinery, both
      standing inside the deep-west disc (radius 8 around the safe
      zone), AND at least one of your units alive, within about
      fifty turns. Total loss of every Construction Yard you own is
      an immediate fail.
    starting_cash: 1600
    overrides:
      actors:
        - {type: mcv,  owner: agent, position: [10, 20]}
        - {type: powr, owner: agent, position: [6,  20]}
        - {type: e1,   owner: agent, position: [4,  20], stance: 0}
        - {type: fact, owner: agent, position: [40, 20]}
        - {type: proc, owner: agent, position: [44, 20]}
        - {type: powr, owner: agent, position: [40, 23]}
        - {type: harv, owner: agent, position: [42, 22]}
        - {type: e1,   owner: agent, position: [42, 19], stance: 2}
        - {type: e1,   owner: agent, position: [42, 21], stance: 2}
        - {type: mine, owner: neutral, position: [46, 20]}
        # Heavier baseline rush — 6× e1 + 2× e3 from x=100.
        - {type: e1, owner: enemy, position: [100, 20], stance: 3, count: 6}
        - {type: e3, owner: enemy, position: [102, 20], stance: 3, count: 2}
        - {type: fact, owner: enemy, position: [125, 20]}
      scheduled_events:
        # Wave 1 at tick 1500 — keeps the forward region hostile
        # past the loss of the original rush.
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [100, 20], stance: 3, count: 4}
            - {type: e3, owner: enemy, position: [102, 20], stance: 3, count: 1}
        # Wave 2 at tick 3000 — proves a forward rebuild attempt
        # is razed by the next wave even if the agent somehow
        # held until wave-1 cleared. Far behind the home rebuild
        # window so it does not bias the home-build policy.
        - tick: 3000
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [100, 20], stance: 3, count: 4}
            - {type: e3, owner: enemy, position: [102, 20], stance: 3, count: 1}
    win_condition:
      all_of:
        - building_in_region: {type: fact, x: 10, y: 20, radius: 8, count: 1}
        - building_in_region: {type: proc, x: 10, y: 20, radius: 8, count: 1}
        - own_units_gte: 1
        - within_ticks: 4500
    fail_condition:
      any_of:
        - after_ticks: 4501
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 60

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled variable on top of medium: TWO seed-driven AGENT
  # spawn_point groups (NORTH y=14 / SOUTH y=26). HOME and FORWARD
  # both shift latitude per seed; the win clause is an `any_of` over
  # the two candidate home regions so EITHER landing satisfies, but
  # the agent must DEPLOY+BUILD at the latitude that MATCHES its
  # spawn. Per-latitude rush intensity HALVED vs medium so the TOTAL
  # on-map firepower roughly matches medium (the rusher bot commits
  # both bands to the active centroid; the dormant band wanders into
  # an empty latitude). The controlled axis vs medium is the spawn
  # variation, NOT additional pressure.
  hard:
    description: >
      Commander, your forward Soviet base — Construction Yard, Ore
      Refinery, Power Plant, an Ore Truck and two rifle defenders —
      and your deep-west home base — parked Mobile Construction
      Vehicle, Power Plant, lone rifleman — both spawn at a seed-
      chosen latitude (NORTH or SOUTH band of the map). Enemy
      ground rush bands close from the east at both latitudes;
      reinforcement waves keep arriving at both latitudes through
      the run. Cash: $1600. Win bar: a Construction Yard AND an
      Ore Refinery, both standing inside the deep-west disc
      matched to YOUR latitude (radius 8 around the safe zone),
      AND at least one of your units alive, within about fifty
      turns. A memorised mid-map rebuild satisfies neither
      latitude. Total loss of every Construction Yard you own is
      an immediate fail.
    starting_cash: 1600
    overrides:
      actors:
        # ── SPAWN 0 (NORTH y=14) — full HOME + FORWARD duplicate.
        - {type: mcv,  owner: agent, position: [10, 14], spawn_point: 0}
        - {type: powr, owner: agent, position: [6,  14], spawn_point: 0}
        - {type: e1,   owner: agent, position: [4,  14], stance: 0, spawn_point: 0}
        - {type: fact, owner: agent, position: [40, 14], spawn_point: 0}
        - {type: proc, owner: agent, position: [44, 14], spawn_point: 0}
        - {type: powr, owner: agent, position: [40, 17], spawn_point: 0}
        - {type: harv, owner: agent, position: [42, 16], spawn_point: 0}
        - {type: e1,   owner: agent, position: [42, 13], stance: 2, spawn_point: 0}
        - {type: e1,   owner: agent, position: [42, 15], stance: 2, spawn_point: 0}
        # ── SPAWN 1 (SOUTH y=26) — full HOME + FORWARD duplicate.
        - {type: mcv,  owner: agent, position: [10, 26], spawn_point: 1}
        - {type: powr, owner: agent, position: [6,  26], spawn_point: 1}
        - {type: e1,   owner: agent, position: [4,  26], stance: 0, spawn_point: 1}
        - {type: fact, owner: agent, position: [40, 26], spawn_point: 1}
        - {type: proc, owner: agent, position: [44, 26], spawn_point: 1}
        - {type: powr, owner: agent, position: [40, 29], spawn_point: 1}
        - {type: harv, owner: agent, position: [42, 28], spawn_point: 1}
        - {type: e1,   owner: agent, position: [42, 25], stance: 2, spawn_point: 1}
        - {type: e1,   owner: agent, position: [42, 27], stance: 2, spawn_point: 1}
        # Neutral ore patches at BOTH latitudes (neutral actors
        # always place — same oramap.rs rule as enemy actors).
        - {type: mine, owner: neutral, position: [46, 14]}
        - {type: mine, owner: neutral, position: [46, 26]}
        # ── Two seed-symmetric in-world rush bands (one per
        # candidate latitude). Enemy actors don't honour
        # spawn_point so BOTH bands always place; the rusher bot
        # commits each to the agent centroid. Per-band intensity
        # is HALVED vs medium (3× e1 + 1× e3) so the TOTAL on-map
        # firepower roughly matches medium.
        - {type: e1, owner: enemy, position: [100, 14], stance: 3, count: 3}
        - {type: e3, owner: enemy, position: [102, 14], stance: 3, count: 1}
        - {type: e1, owner: enemy, position: [100, 26], stance: 3, count: 3}
        - {type: e3, owner: enemy, position: [102, 26], stance: 3, count: 1}
        # Persistent unarmed enemy `fact` far east — engine auto-
        # `done` guard. Mid-y placement is reachable from either
        # latitude (only used as the anti-DRAW sentinel — never
        # attacked by the agent).
        - {type: fact, owner: enemy, position: [125, 20]}
      scheduled_events:
        # Wave 1 declared at BOTH latitudes (scheduled_events do
        # NOT honour spawn_point — CLAUDE.md). Each wave drops at
        # its own latitude; the active-latitude wave drives into
        # the agent centroid, the dormant-latitude wave finds no
        # agent assets nearby and wanders.
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [100, 14], stance: 3, count: 2}
            - {type: e3, owner: enemy, position: [102, 14], stance: 3, count: 1}
        - tick: 1500
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [100, 26], stance: 3, count: 2}
            - {type: e3, owner: enemy, position: [102, 26], stance: 3, count: 1}
        # Wave 2 at tick 3000 — same two-latitude declaration.
        - tick: 3000
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [100, 14], stance: 3, count: 2}
            - {type: e3, owner: enemy, position: [102, 14], stance: 3, count: 1}
        - tick: 3000
          type: spawn_actors
          actors:
            - {type: e1, owner: enemy, position: [100, 26], stance: 3, count: 2}
            - {type: e3, owner: enemy, position: [102, 26], stance: 3, count: 1}
    win_condition:
      all_of:
        - any_of:
            # NORTH home zone (matches spawn_point 0).
            - all_of:
                - building_in_region: {type: fact, x: 10, y: 14, radius: 8, count: 1}
                - building_in_region: {type: proc, x: 10, y: 14, radius: 8, count: 1}
            # SOUTH home zone (matches spawn_point 1).
            - all_of:
                - building_in_region: {type: fact, x: 10, y: 26, radius: 8, count: 1}
                - building_in_region: {type: proc, x: 10, y: 26, radius: 8, count: 1}
        - own_units_gte: 1
        - within_ticks: 4500
    fail_condition:
      any_of:
        - after_ticks: 4501
        - not: {building_count_gte: {type: fact, n: 1}}
    max_turns: 60
