# econ-replace-dead-harvester — replan after exogenous worker death
#
# REASONING capability — mid-game REPLAN after an exogenous worker
# loss. The agent starts with 3 working harvesters on 2 ore patches
# (the income floor is already met) plus enough cash for EXACTLY one
# replacement harvester (starting_cash 1100 = 1× harv). A small enemy
# tank strike (a single 4tnk with the `raider` worker-priority bot)
# kills ONE specific harvester early in the episode; the pre-placed
# own 3tnk defenders neutralise the 4tnk after the harv kill lands.
# The scenario is the "what now" decision: the agent must
#   1. notice the harv died (units_summary shows only 2 harvs),
#   2. `build('harv')` to replace the dead one with the indivisible
#      reserve cash, AND
#   3. re-issue `harvest` to every harvester (the freshly-built one
#      AND the survivors whose harvest loop was interrupted by the
#      kill event), so throughput recovers before the deadline.
#
# Real-world anchor: PlanBench replanning under exogenous loss
# (gold-standard); ScienceWorld error recovery; SC2LE replace-killed-
# workers reflex; disaster-recovery: worker replacement.
#
# ENGINE NOTES (verified 2026-05-19 with /tmp/probe3.py + scripted
# /tmp/probe_econ_replace.py against installed openra_train wheel):
#  - The `raider` ScriptedBehavior (openra-sim/src/scripted_bot.rs)
#    targets the nearest agent harvester each tick (falls back to
#    nearest combat actor only when all harvs are dead). Binding the
#    attacker target to "harvester" cleanly defeats the auto-engage-
#    on-nearest-foe failure mode that defeats `hunt` here (with any
#    pre-placed defender closer to the attack group than the harvs,
#    `hunt` re-targets to the defender and the harv never dies).
#  - The own 3tnk defenders are pre-placed at distance 3-4 from
#    the 4tnk's firing position with explicit stance:2 (Defend):
#    they auto-fire on the inbound 4tnk the moment it is in weapon
#    range but never advance. The 4tnk lands enough fire to kill
#    exactly the nearest harv before the 3tnk pack wipes it. NOTE
#    (recalibration 2026-05-20): the engine's four-distinct stance
#    semantics make stance:3 (AttackAnything) an active HUNTER —
#    idle defenders on stance:3 walk the whole map and raze the
#    persistent far enemy fact, collapsing the run to a DRAW. All
#    3tnk defenders therefore carry explicit stance:2.
#  - Tick budget (CLAUDE.md): max_turns=60 ⇒ ceiling tick 5403 ⇒
#    within_ticks 5400 and after_ticks 5401 both fit (deadline bites
#    as a reachable LOSS, not a draw).

meta:
  id: econ-replace-dead-harvester
  title: 'Replace Dead Harvester — Replan Economy After Exogenous Loss'
  capability: reasoning
  real_world_meaning: >
    Reactive replan after an exogenous worker death. A productive
    operation suddenly loses a value-generating unit to an outside
    event; cash reserves are tuned for EXACTLY one replacement; the
    deadline is real. The agent must notice the loss, commit the
    reserve to rebuilding the dead worker (not to army units), and
    redirect production back to the same revenue loop — fast enough
    that the deadline still bites.
  robotics_analogue: >
    Pipeline / fleet operation where one autonomous collector is
    destroyed mid-mission by an external hazard. The remaining
    collectors stay in the loop; the supervisor has just enough
    budget for a single replacement; redirecting the new unit back
    to the same revenue source AND re-tasking the survivors (whose
    loop was interrupted by the loss event) is the test. Spending
    the reserve on defenders, or stalling, misses the throughput bar.
  benchmark_anchor:
    - "PlanBench replanning under exogenous loss"
    - "ScienceWorld error recovery"
    - "SC2 replace-killed-workers reflex"
    - "disaster recovery: worker replacement"
  author: "openra-bench"

base_map:
  generator: arena
  name: econ-replace-dead-harvester-arena
  width: 128
  height: 40
starting_cash: 1100  # EXACTLY one harv ⇒ indivisible replacement budget

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
    # `raider` (Wave-2 scripted bot) — worker-priority: each unit
    # specifically targets the nearest agent HARVESTER (falls back to
    # nearest combat actor only when no harvs are alive). Picked over
    # `hunt` because `hunt` retargets to whichever foe is geometrically
    # closest each tick — with any pre-placed defender closer to the
    # attack group than the harvs themselves, the attacker would
    # auto-engage the defender instead of the harv, defeating the
    # scenario. `raider` binds the target to the harvester category so
    # the attacker commits to the harv kill until the defenders
    # neutralise it.
    bot_type: raider
  tools:
    - observe
    - build
    - place_building
    - harvest
    - move_units
    - stop
  planning: true
  termination:
    max_ticks: 7000

levels:
  # ── EASY ────────────────────────────────────────────────────────
  # The bare skill: 1 harv dies, generous bar (1800 EV), need harv
  # count back to 3 (the freshly built harv counts). Stall and over-
  # build-army still LOSE; intended build-harv + redirect WINS.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # You start with 3 harvesters working two ore patches (mines at
    # (22,18) and (22,22)). An enemy heavy tank attacks from the east and
    # will kill ONE of your harvesters early in the episode; your pre-
    # placed heavy tanks will finish it off. Reserve cash is EXACTLY 1100
    # — enough for ONE replacement harvester. Win when economy value (cash
    # + stored resources) reaches 1800 AND you have ≥3 harvesters alive
    # AND your refinery is intact, before tick 5400. Stalling, ignoring
    # the dead harv, or spending the reserve on army units all LOSE; the
    # intended play is to build('harv') to replace the dead one and re-
    # issue `harvest` to every harvester (the death event interrupts the
    # surviving harvs' harvest loop).
    description: >
      Commander, this is a worker-replacement drill. You hold a
      Construction Yard (fact), Ore Refinery (proc), Allied Barracks
      (tent), War Factory (weap — produces vehicles including
      harvesters), three harvesters (harv, unarmed ore-collector
      trucks) on two near ore patches, and two heavy tanks (3tnk) on
      Defend stance, with $1100 in the bank. An enemy Mammoth tank
      (4tnk) attacks from the east and will kill ONE harvester before
      your defenders finish it. Within about 60 turns, reach economy
      value $1800 (cash plus stored ore), have at least three harvesters
      alive, and keep your Refinery standing.
    starting_cash: 1100
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: tent, owner: agent, position: [8, 22]}
        # War factory pre-placed — `build('harv')` requires `weap`
        # (PRODUCTION_TECH_AUDIT.md). The pack's reserve cash (1100)
        # is EXACTLY one harv; without `weap` the replacement order
        # silently fails and the harv-count clause is unsatisfiable.
        - {type: weap, owner: agent, position: [12, 22]}
        # Three pre-placed harvs on the patch lane. The eastern-most
        # (y=22) is the natural target for the raider 4tnk.
        - {type: harv, owner: agent, position: [14, 18]}
        - {type: harv, owner: agent, position: [14, 20]}
        - {type: harv, owner: agent, position: [14, 22]}
        # Two own 3tnk defenders flanking the patches at range 5,
        # explicitly stance:2 (Defend) — auto-fire on the inbound
        # 4tnk when it is in weapon range, but never advance on
        # their own (stance:3 would auto-HUNT the whole map and raze
        # the persistent far enemy fact, collapsing the run to a
        # DRAW on engine auto-done).
        # DPS race: 2× 3tnk (dps 60) vs 4tnk hp 600 = 10 ticks; 4tnk
        # (dps 40) lands ~10 ticks of fire first ⇒ exactly the
        # nearest harv (hp 600) dies, then the 4tnk is wiped.
        - {type: '3tnk', owner: agent, position: [15, 21], stance: 2}
        - {type: '3tnk', owner: agent, position: [15, 23], stance: 2}
        # Two ore patches east of the proc.
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 22]}
        # One enemy 4tnk staged adjacent to the eastern-most harv
        # (range 5, harv at (14,22) ⇒ 4tnk at (18,22) is in range and
        # the nearest agent harvester). The `raider` bot binds the
        # target to the harvester so the 4tnk commits to the harv kill
        # until the 3tnk pair neutralises it.
        - {type: '4tnk', owner: enemy, position: [18, 22]}
        # Persistent enemy marker on the far edge of the small arena
        # so the engine doesn't auto-`done` when the 4tnk is wiped
        # (CLAUDE.md auto-done footgun would collapse a clean run to
        # DRAW before the economy bar).
        - {type: fact, owner: enemy, position: [60, 34]}
    win_condition:
      all_of:
        - {economy_value_gte: 1800}
        - {unit_type_count_gte: {type: harv, n: 3}}
        - {has_building: proc}
        - {within_ticks: 5403}
    fail_condition:
      any_of:
        - {after_ticks: 5404}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
        - {not: {has_building: proc}}
    max_turns: 60

  # ── MEDIUM ──────────────────────────────────────────────────────
  # +1 controlled variable: TIGHTER BAR (2500 EV) so a replace-only-
  # no-redirect policy (build harv but forget to re-issue harvest)
  # LOSES. Same single-harv-dies attack profile as easy.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Same setup as easy — three harvesters on two ore patches; an enemy
    # heavy tank attacks from the east and kills ONE harvester early.
    # Reserve cash is EXACTLY 1100 (one harv). Win when economy value
    # reaches 2500 AND you have ≥3 harvesters alive AND your refinery is
    # intact, before tick 5400. Building the replacement but failing to
    # re-issue `harvest` to every harvester (the death event interrupts
    # the surviving harvs' harvest loop) leaves throughput too low to
    # clear the tighter bar in time. Over- building army units instead of
    # replacing the worker also misses the bar; stalling is the strict
    # floor.
    description: >
      Commander, this is a worker-replacement drill with a tighter
      throughput bar. You hold a Construction Yard (fact), Ore Refinery
      (proc), Allied Barracks (tent), War Factory (weap — produces
      vehicles including harvesters), three harvesters (harv, unarmed
      ore-collector trucks) on two near ore patches, and two heavy
      tanks (3tnk) on Defend stance, with $1100 in the bank. An enemy
      Mammoth tank (4tnk) attacks from the east and kills ONE harvester
      before your defenders wipe it.
      Within about 60 turns, reach economy value $2500 (cash plus
      stored ore), have at least three harvesters alive, and keep your
      Refinery standing.
    starting_cash: 1100
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: tent, owner: agent, position: [8, 22]}
        # War factory pre-placed — `build('harv')` requires `weap`.
        - {type: weap, owner: agent, position: [12, 22]}
        - {type: harv, owner: agent, position: [14, 18]}
        - {type: harv, owner: agent, position: [14, 20]}
        - {type: harv, owner: agent, position: [14, 22]}
        - {type: '3tnk', owner: agent, position: [15, 21], stance: 2}
        - {type: '3tnk', owner: agent, position: [15, 23], stance: 2}
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 22]}
        - {type: '4tnk', owner: enemy, position: [18, 22]}
        - {type: fact, owner: enemy, position: [60, 34]}
    win_condition:
      all_of:
        - {economy_value_gte: 2500}
        - {unit_type_count_gte: {type: harv, n: 3}}
        - {has_building: proc}
        - {within_ticks: 5403}
    fail_condition:
      any_of:
        - {after_ticks: 5404}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
        - {not: {has_building: proc}}
    max_turns: 60

  # ── HARD ────────────────────────────────────────────────────────
  # +2 controlled variables vs medium:
  #   1. Higher bar (3500 EV) with starting_cash funding TWO
  #      replacement harvs (2200) — because TWO harvs die in staggered
  #      raider waves (a first 4tnk near the patches, then a second
  #      4tnk staged further east that arrives after the defenders
  #      have wiped the first).
  #   2. TWO seed-driven AGENT spawn_point groups (north y=14 vs
  #      south y=22) so a memorised opening cannot generalise — the
  #      harv positions, defender positions, and patch geometry are
  #      symmetric but flipped per seed.
  # Spawn_point filter applies only to AGENT actors (oramap.rs) —
  # enemy actors are placed on every seed; the agent base orientation
  # flips.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Tougher version: TWO harvesters will die in staggered raider waves
    # (a first enemy 4tnk near the patches, then a second 4tnk staged
    # further east that arrives after the defenders have wiped the first).
    # Your reserve funds EXACTLY two replacement harvesters (2200 cr).
    # Your base orientation varies by seed (north-flank or south-flank) —
    # both halves cover the same patch column. Win when economy value
    # reaches 3500 AND you have ≥3 harvesters alive AND your refinery is
    # intact, before tick 5400. You must replace BOTH dead harvs and re-
    # issue `harvest` after each death (the death event interrupts the
    # surviving harvs' harvest loop). Stalling, replacing only one, or
    # spending the reserve on army units all LOSE.
    description: >
      Commander, this is a worker-replacement drill with two staggered
      raider waves and seed-rotated base latitude. You hold a
      Construction Yard (fact), Ore Refinery (proc), Allied Barracks
      (tent), War Factory (weap — produces vehicles including
      harvesters), three harvesters (harv, unarmed ore-collector
      trucks) on two near ore patches, and three heavy tanks (3tnk) on
      Defend stance at either the NORTH (y=14) or SOUTH (y=26)
      latitude, with $3300 in the bank. Two enemy Mammoth tanks (4tnk)
      attack from the east in sequence and will kill TWO of your
      harvesters. Within about 60
      turns, reach economy value $3500 (cash plus stored ore), have at
      least three harvesters alive, and keep your Refinery standing.
    starting_cash: 3300
    overrides:
      actors:
        # Spawn 0 — NORTH base. Same per-spawn structure as easy/medium
        # (harvs adjacent to proc on the base latitude, 2 defenders
        # flanking the harvs) — only the base y flips per seed. The
        # close 4tnk lands adjacent to the eastern-most harv on the
        # base's latitude; the far 4tnk arrives later as wave 2.
        - {type: fact, owner: agent, position: [8, 14], spawn_point: 0}
        - {type: proc, owner: agent, position: [12, 14], spawn_point: 0}
        - {type: tent, owner: agent, position: [8, 18], spawn_point: 0}
        # War factory pre-placed at each spawn — `build('harv')` requires
        # `weap`. The hard reserve (3300) funds two harv replacements.
        - {type: weap, owner: agent, position: [12, 18], spawn_point: 0}
        - {type: harv, owner: agent, position: [14, 14], spawn_point: 0}
        - {type: harv, owner: agent, position: [14, 16], spawn_point: 0}
        - {type: harv, owner: agent, position: [14, 18], spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [20, 15], stance: 2, spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [20, 17], stance: 2, spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [20, 19], stance: 2, spawn_point: 0}
        # Spawn-distinguishing rear guard at NORTH y=12.
        - {type: '3tnk', owner: agent, position: [13, 12], stance: 2, spawn_point: 0}
        - {type: mine, owner: neutral, position: [22, 14], spawn_point: 0}
        - {type: mine, owner: neutral, position: [22, 16], spawn_point: 0}
        # Spawn 1 — SOUTH base (mirror across y=20).
        - {type: fact, owner: agent, position: [8, 26], spawn_point: 1}
        - {type: proc, owner: agent, position: [12, 26], spawn_point: 1}
        - {type: tent, owner: agent, position: [8, 22], spawn_point: 1}
        # War factory pre-placed at SOUTH spawn.
        - {type: weap, owner: agent, position: [12, 22], spawn_point: 1}
        - {type: harv, owner: agent, position: [14, 26], spawn_point: 1}
        - {type: harv, owner: agent, position: [14, 24], spawn_point: 1}
        - {type: harv, owner: agent, position: [14, 22], spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [20, 21], stance: 2, spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [20, 23], stance: 2, spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [20, 25], stance: 2, spawn_point: 1}
        # Spawn-distinguishing rear guard at SOUTH y=28.
        - {type: '3tnk', owner: agent, position: [13, 28], stance: 2, spawn_point: 1}
        - {type: mine, owner: neutral, position: [22, 26], spawn_point: 1}
        - {type: mine, owner: neutral, position: [22, 24], spawn_point: 1}
        # TWO 4tnks placed adjacent to one harv on EACH possible spawn
        # latitude. Enemy actors don't honour spawn_point, so both
        # land every seed — for NORTH the 4tnk at (18,18) kills the
        # y=18 harv; for SOUTH the (18,22) 4tnk kills the y=22 harv.
        # The off-axis 4tnk just sits idle (its nearest harv is too
        # far away). Plus one far 4tnk as wave 2.
        - {type: '4tnk', owner: enemy, position: [18, 18]}
        - {type: '4tnk', owner: enemy, position: [18, 22]}
        # Wave-2 4tnk staged at x=60 (same as the historical
        # rush-hour-arena placement). The 64x40 bespoke arena preserves
        # the original arrival delay so wave-2 reaches the harvs only
        # AFTER the defenders neutralise wave-1.
        - {type: '4tnk', owner: enemy, position: [60, 20]}
        # Persistent enemy marker on the far edge of the small arena
        # (CLAUDE.md auto-done footgun guard).
        - {type: fact, owner: enemy, position: [60, 34]}
    win_condition:
      # Hard: `then:` gates the win on (a) being past tick 3600 (so
      # both raider waves have had time to bite and the agent has
      # had time to replace), and (b) reaching the EV bar AND keeping
      # 3 harvs alive at THAT moment. A stall play stays at 1-2
      # harvs after the waves bite — count fails AT t≥3600.
      all_of:
        - then:
            id: econ-replace-dead-harvester-hard
            clauses:
              - {after_ticks: 3600}
              - {economy_value_gte: 3500}
              - {unit_type_count_gte: {type: harv, n: 3}}
        - {has_building: proc}
        - {within_ticks: 5403}
    fail_condition:
      any_of:
        - {after_ticks: 5404}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
        - {not: {has_building: proc}}
    max_turns: 60
