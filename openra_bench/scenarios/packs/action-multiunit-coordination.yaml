# Validate: python -m openra_bench.scenarios.validate packs/action-multiunit-coordination.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# ACTION focus: the plan is trivial and stated outright — "split the
# force, put >=2 units in EACH region before the deadline". The hard
# part is EXECUTION: serialized one-group-at-a-time control (visit A,
# then B, then C) takes too long to tour the map and BLOWS the binding
# tick deadline; only genuine parallel dispatch (all groups moving at
# once) makes it. The split is enforced by units_in_region_gte (not
# reach_region, which one touring unit could satisfy). Missing the
# deadline is a real LOSS, not a draw.

meta:
  id: action-multiunit-coordination
  title: 'Multi-Squad Coordination — Drive Several Groups to Different Objectives at Once'
  capability: action
  real_world_meaning: >
    Multi-region task allocation under a shared deadline is not a
    planning problem here — the split is obvious. It tests whether the
    controller can actually drive several effector groups in parallel
    instead of completing one objective then the next, which serialized
    control fails to do in time.
  robotics_analogue: >
    Coordinated multi-robot fleet dispatch: a logistics swarm must
    place distinct sub-teams at separate depots within one delivery
    window; one-at-a-time control blows the schedule.
  author: "openra-bench"

# Single 48x40 arena shared by all three tiers (audit-tight).
base_map:
  generator: arena
  name: action-multiunit-coordination-arena
  width: 48
  height: 40
  cordon: 2
  spawns: [[4, 6]]
  title: 'Multi-Squad Coordination Arena 48x40'

base:
  agent: {faction: allies}
  enemy: {faction: soviet}
  tools: [move_units, attack_unit, stop]
  planning: true
  termination: {max_ticks: 8000}
  actors: []   # every level supplies its own actors via overrides.

levels:
  # ── EASY ── Two regions (NE + SE). 6 units split into two groups.
  easy:
    description: >
      Commander, this is a parallel strike mission. You are given a
      tank column on the west edge: 3 medium tanks and 3 light tanks.
      Two enemy buildings sit on the far east of the map — a
      Construction Yard at the north-east corner and an Ore Refinery
      at the south-east. Split your force into two groups and hit
      both at the same time, because a one-at-a-time push will not
      beat the clock.
    overrides:
      actors:
        # Two agent groups in the spawn corner that must be split.
        # `stance: 0` (HoldFire) is load-bearing: default-stance
        # units auto-HUNT the nearest visible enemy, so an
        # idle/observe-only policy would self-deliver the force
        # across the map, trigger enemy-elimination auto-`done`, and
        # collapse to a DRAW before the timeout LOSS can bite.
        - {type: 2tnk, owner: agent, position: [4, 6],  count: 3, stance: 0}
        - {type: 1tnk, owner: agent, position: [6, 10], count: 3, stance: 0}
        # Static enemy buildings mark the destination regions.
        - {type: fact, owner: enemy, position: [44, 4]}   # NE corner
        - {type: proc, owner: enemy, position: [44, 34]}  # SE corner
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 44, y: 4,  radius: 6, n: 2}}
        - {units_in_region_gte: {x: 44, y: 34, radius: 6, n: 2}}
        - {within_ticks: 2200}
    fail_condition:
      any_of:
        - {not: {own_units_gte: 1}}
        - {after_ticks: 2201}
    max_turns: 30

  # ── MEDIUM ── Three dispersed regions (NE + SE + SW). 8 units.
  # Attrition cap. Enemy pickets contest the eastern lanes.
  medium:
    description: >
      Commander, this is a three-front parallel strike mission. You
      are given 3 medium tanks, 3 light tanks, and 2 jeeps on the
      west side. Three enemy buildings must be reached at the same
      time: a Construction Yard in the north-east, an Ore Refinery
      in the south-east, and a Power Plant in the south-west. Small
      rifle-infantry pickets sit in the middle of the map. Split
      your force into three groups, drive in parallel, and hold
      losses to no more than two.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [4, 6],  count: 3, stance: 0}
        - {type: 1tnk, owner: agent, position: [6, 10], count: 3, stance: 0}
        # Jeeps staged at y=24 (south of centre) so the SW-bound
        # column does NOT route past the NE picket.
        - {type: jeep, owner: agent, position: [4, 24], count: 2, stance: 0}
        # Destination buildings.
        - {type: fact, owner: enemy, position: [44, 4]}    # NE
        - {type: proc, owner: enemy, position: [44, 34]}   # SE
        - {type: powr, owner: enemy, position: [12, 36]}   # SW
        # Mid-map pickets (contesting the east lanes).
        - {type: e1,   owner: enemy, position: [24, 6],  stance: 2, count: 2}
        - {type: e1,   owner: enemy, position: [24, 32], stance: 2, count: 2}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 44, y: 4,  radius: 6, n: 2}}
        - {units_in_region_gte: {x: 12, y: 36, radius: 6, n: 2}}
        - {units_in_region_gte: {x: 44, y: 34, radius: 6, n: 2}}
        - {within_ticks: 2800}
        - {units_lost_lte: 2}
    fail_condition:
      any_of:
        - {not: {own_units_gte: 1}}
        - {after_ticks: 2801}
    max_turns: 36

  # ── HARD ── Identical to medium except coordinates are HIDDEN.
  # objective_coords:relative names the enemy building TYPE in each
  # direction instead of (x,y). enemy_building_spotted interrupts
  # re-prompt the agent the instant a unit sights a marker, revealing
  # that building's exact position.
  hard:
    objective_coords: relative
    description: >
      Commander, this is a three-front parallel strike mission with no
      coordinates given. You are given 3 medium tanks, 3 light tanks,
      and 2 jeeps on the west side. Three enemy buildings must be
      reached at the same time, each labelled on your map by direction
      only: an enemy Construction Yard in the north-east, an enemy
      Power Plant in the south-west, and an enemy Ore Refinery in the
      south-east. Push columns toward each direction to scout for
      them; the instant a unit spots a target you will be interrupted
      and shown its exact location. Hold losses to no more than two.
    overrides:
      interrupts:
        enemy_building_spotted: true
      actors:
        - {type: 2tnk, owner: agent, position: [4, 6],  count: 3, stance: 0}
        - {type: 1tnk, owner: agent, position: [6, 10], count: 3, stance: 0}
        - {type: jeep, owner: agent, position: [4, 24], count: 2, stance: 0}
        - {type: fact, owner: enemy, position: [44, 4]}
        - {type: proc, owner: enemy, position: [44, 34]}
        - {type: powr, owner: enemy, position: [12, 36]}
        - {type: e1,   owner: enemy, position: [24, 6],  stance: 2, count: 2}
        - {type: e1,   owner: enemy, position: [24, 32], stance: 2, count: 2}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 44, y: 4,  radius: 6, n: 2,
            label: "the enemy Construction Yard (fact) in the NORTH-EAST"}}
        - {units_in_region_gte: {x: 12, y: 36, radius: 6, n: 2,
            label: "the enemy Power Plant (powr) in the SOUTH-WEST (bottom-left)"}}
        - {units_in_region_gte: {x: 44, y: 34, radius: 6, n: 2,
            label: "the enemy Ore Refinery (proc) in the SOUTH-EAST"}}
        # Triage B.1 fix: bumped from 2800 -> 3300 (and max_turns 36
        # -> 42) — under fogged objective_coords:relative the hard
        # tier carries per-turn scout overhead (interrupt re-prompts
        # on enemy_building_spotted), so the medium-tier 2800-tick
        # budget was too tight: Qwen-9B seed 3 satisfied all three
        # region predicates at tick 2853, only 53 ticks past the
        # deadline.
        - {within_ticks: 3300}
        - {units_lost_lte: 2}
    fail_condition:
      any_of:
        - {not: {own_units_gte: 1}}
        - {after_ticks: 3301}
    max_turns: 42
