# Validate: python -m openra_bench.scenarios.validate packs/action-multiunit-coordination.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# ACTION focus: the plan is trivial and stated outright — "split the force,
# put >=2 units in EACH region before the deadline". The hard part is
# EXECUTION: serialized one-group-at-a-time control (visit A, then B, then
# C) takes ~30+ turns to tour the map and BLOWS the binding tick deadline;
# only genuine parallel dispatch (all groups moving at once, ~17-20 turns)
# makes it. The split is enforced by units_in_region_gte (not reach_region,
# which one touring unit could satisfy). Missing the deadline is a LOSS,
# not a draw.

meta:
  id: action-multiunit-coordination
  title: 'Multi-Squad Coordination — Drive Several Groups to Different Objectives at Once'
  capability: action
  real_world_meaning: >
    Multi-region task allocation under a shared deadline is not a planning
    problem here — the split is obvious. It tests whether the controller can
    actually drive several effector groups in parallel instead of completing
    one objective then the next, which serialized control fails to do in
    time.
  robotics_analogue: >
    Coordinated multi-robot fleet dispatch: a logistics swarm must place
    distinct sub-teams at separate depots within one delivery window;
    one-at-a-time control blows the schedule.
  author: "openra-bench"

base_map: rush-hour-arena

base:
  agent: {faction: allies}
  enemy: {faction: soviet}
  tools: [move_units, attack_unit, stop]
  planning: true
  termination: {max_ticks: 8000}
  actors:
    # Two agent groups in the spawn corner (x < 25) that must be split
    # and driven to separate regions at the same time.
    - {type: 2tnk, owner: agent, position: [5, 6],  count: 3}
    - {type: 1tnk, owner: agent, position: [7, 10], count: 3}
    # Static enemy buildings mark the destination regions.
    - {type: fact, owner: enemy, position: [110, 6]}
    - {type: proc, owner: enemy, position: [110, 33]}

levels:
  easy:
    description: >
      Two regions, 6 units. Put >=2 units in EACH region (NE ~110,6 and
      SE ~110,33) before tick 2400. One direct parallel dispatch makes
      it (~17-20 turns); touring both with one column does not. Lose if
      the deadline passes or the force is wiped.
    overrides: {}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 110, y: 6,  radius: 8, n: 2}}
        - {units_in_region_gte: {x: 110, y: 33, radius: 8, n: 2}}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {not: {own_units_gte: 1}}
        - {after_ticks: 2401}
    max_turns: 30

  medium:
    description: >
      Three regions, 8 units, tighter deadline, attrition cap. Put >=2
      units in EACH of NE/SE/mid-east before tick 2800; enemy infantry
      contest the lanes (lose <=2 units). Serialized movement bleeds
      units and misses the clock.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [5, 6],  count: 3}
        - {type: 1tnk, owner: agent, position: [7, 10], count: 3}
        - {type: jeep, owner: agent, position: [5, 14], count: 2}
        - {type: fact, owner: enemy, position: [110, 5]}
        - {type: proc, owner: enemy, position: [110, 34]}
        - {type: powr, owner: enemy, position: [112, 20]}
        - {type: e1,   owner: enemy, position: [60, 8],  stance: 2, count: 2}
        - {type: e1,   owner: enemy, position: [60, 31], stance: 2, count: 2}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 110, y: 5,  radius: 7, n: 2}}
        - {units_in_region_gte: {x: 110, y: 34, radius: 7, n: 2}}
        - {units_in_region_gte: {x: 112, y: 20, radius: 7, n: 2}}
        - {within_ticks: 2800}
        - {units_lost_lte: 2}
    fail_condition:
      any_of:
        - {not: {own_units_gte: 1}}
        - {after_ticks: 2801}
    max_turns: 36

  hard:
    description: >
      Three regions, full force (~10 units) from a seed-chosen corner,
      gun turrets + infantry on the lanes, tight deadline + strict
      attrition. Put >=2 units in EACH region before tick 3300 losing
      <=2. Only genuine parallel multi-group control clears every clause.
    overrides:
      actors:
        # spawn_point 0 — full force, northern staging
        - {type: 2tnk, owner: agent, position: [5, 6],  count: 3, spawn_point: 0}
        - {type: 1tnk, owner: agent, position: [7, 10], count: 3, spawn_point: 0}
        - {type: jeep, owner: agent, position: [5, 14], count: 2, spawn_point: 0}
        - {type: apc,  owner: agent, position: [9, 18], count: 2, spawn_point: 0}
        # spawn_point 1 — full force, southern staging (same 3 fixed
        # regions to cover; seed picks the start cluster)
        - {type: 2tnk, owner: agent, position: [5, 20], count: 3, spawn_point: 1}
        - {type: 1tnk, owner: agent, position: [7, 24], count: 3, spawn_point: 1}
        - {type: jeep, owner: agent, position: [5, 28], count: 2, spawn_point: 1}
        - {type: apc,  owner: agent, position: [9, 32], count: 2, spawn_point: 1}
        - {type: fact, owner: enemy, position: [112, 5]}
        - {type: proc, owner: enemy, position: [112, 35]}
        - {type: powr, owner: enemy, position: [115, 20]}
        - {type: gun,  owner: enemy, position: [100, 6]}
        - {type: gun,  owner: enemy, position: [100, 34]}
        - {type: e3,   owner: enemy, position: [55, 9],  stance: 2, count: 2}
        - {type: e3,   owner: enemy, position: [55, 31], stance: 2, count: 2}
        - {type: e1,   owner: enemy, position: [58, 20], stance: 2, count: 2}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 112, y: 5,  radius: 7, n: 2}}
        - {units_in_region_gte: {x: 112, y: 35, radius: 7, n: 2}}
        - {units_in_region_gte: {x: 115, y: 20, radius: 7, n: 2}}
        - {within_ticks: 3300}
        - {units_lost_lte: 2}
    fail_condition:
      any_of:
        - {not: {own_units_gte: 1}}
        - {after_ticks: 3301}
    max_turns: 44
