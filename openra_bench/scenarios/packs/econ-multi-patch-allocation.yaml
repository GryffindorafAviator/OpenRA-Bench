# ECON-MULTI-PATCH-ALLOCATION — choose WHICH ore patches to claim.
#
# MAP WIDTH JUSTIFICATION (wide-justified, 128x40 kept by design):
# The capability is "pick WHICH subset of K candidate patches to
# commit refineries to under a CAPEX cap, so total throughput-over-
# deadline is maximised". Distinguishable patch distances ARE the
# spatial reasoning under test — patch A at x=20 (near, small), B/C
# at x=40 (medium ring), D at x=115 (far rich). The choice between
# "commit to two medium patches" vs "commit to the far rich patch
# with an unrecoverable round-trip cost" requires the FAR patch to
# be far enough that its lone-harv cycle-time defeats the cash bar
# inside the deadline. At 64x40 the "far rich" patch would sit at
# x≈60 — the round-trip would be short enough that single-proc-at-D
# becomes a viable cookbook play, collapsing the test.
#
# Distance audit:
#   - Home base (8, *) vs near patch A (20, *): ~12 cells — the
#     "single-proc-at-home" foil (loses on proc count, not throughput).
#   - Home vs medium ring B/C (40, *): ~32 cells — the intended
#     two-refinery placement.
#   - Home vs far rich D (115, *): ~107 cells — the "rich-patch
#     bait" foil (sole proc here = inadequate throughput in budget).
#   - Far-edge sentinel (125, 20) is the engine auto-`done`
#     mitigation.
# Per audit policy: WIDE is justified when distinguishable distance
# IS the capability under test.
#
# REASONING capability — mid-game resource allocation across multiple
# sites. The agent owns a Construction Yard + Power Plant (no home
# refinery, no home harvester clump) and looks out at FOUR ore patches
# scattered around the map, EACH with one pre-positioned idle Ore
# Truck waiting beside it. A patch's harvester deposits only once a
# refinery (`proc`) exists somewhere on the agent's side — the
# per-tick `auto_route_idle_harvesters` engine hook installs a
# Harvest activity on every idle owned harv the moment the owner has
# a refinery.
#
# The decision is WHICH subset of patches to spend cash on building
# refineries at: starting cash funds ONE refinery up front (1400 of
# the 1500 budget); a SECOND refinery needs the deposits from the
# first to clear. The win clause requires ≥ 2 refineries built AND a
# cash bar reached inside the clock — so any single-proc opening
# fails on the proc count, and stalling fails both clauses.
#
# ── Real-world / benchmark anchor ────────────────────────────────────
#   • SC2 macro "2-base vs 3-base" decision: opening with the right
#     number of mining bases (not too few, not too many for the
#     cash) is the load-bearing macro choice for the first 5 minutes.
#   • OR resource-allocation: pick a SUBSET of K candidate sites
#     under a CAPEX cap so total throughput-over-deadline is
#     maximised; the classic facility-location problem with a hard
#     budget.
#   • lmgame-Bench resource-streaming: maintain steady income across
#     turns when raw resources are spatially scattered and the
#     budget for processing units is finite.
#
# ── No-cheat bar (every losing play LOSES, the intended play WINS) ──
#   • stall (observe-only): no procs ever built; auto-route never
#     fires; cash stays at the 1500 starting wallet. Fails the
#     ≥2-proc and the cash clauses. LOSES on after_ticks.
#   • only-A (one proc dropped next to the near small patch): all
#     four pre-staffed harvs auto-route to the lone proc and
#     deposit (auto-route picks nearest free ore + ANY owned proc;
#     a single proc on the map is everyone's deposit). The proc
#     count is 1, the bar requires ≥2 — LOSES on the proc clause
#     (even though raw cash easily passes).
#   • only-B / only-C / only-D: same single-proc shape — proc count
#     1 < 2 required. LOSES.
#   • intended (build 2 procs and place each adjacent to a medium
#     patch, e.g. B + C): two procs in time, the four pre-staffed
#     harvs auto-route to nearest proc, ample patch supply means
#     all four cycle multiple times, cash clears the bar.
#     WINS.
#   • claim-all-four (queue 4 procs serially): the engine completes
#     the first ~3 procs in the time budget, sinking 3 × 1400 =
#     4200 cr of cash; the 4th queued proc holds the rest of the
#     cash buffer in the build queue. Final cash sits ~1600 — well
#     below the cash bar — so claim-all-four LOSES on the
#     `cash_gte` clause even though it has ≥ 2 procs. The
#     discrimination teeth this pack plants are: stall / single-
#     proc → LOSS on proc-count; claim-all-four → LOSS on cash;
#     intended (2 procs at productive medium patches) → WIN on
#     both clauses.
#
# ── Engine facts used (verified against installed openra_train wheel) ──
#  1. `ore_patches:` top-level YAML — each `{x, y, amount, radius}`
#     materialises a disk of ore on the terrain at world-build time
#     (`oramap.rs::read_ore_patches`). Cell density `clamp(amount /
#     cells, 1, 12)`; total extractable cr scales with `amount`.
#  2. `auto_route_idle_harvesters` (per-tick world hook) installs a
#     Harvest activity on any owned idle harvester whose owner owns
#     a `proc`. Pre-positioning one harv beside each patch means
#     placement of even ONE proc anywhere lights up all four
#     harvs simultaneously — they auto-route to the proc that
#     minimises round-trip.
#  3. `place_building` does NOT enforce build-adjacency (CLAUDE.md),
#     so a proc can be dropped at any in-bounds coord — the test is
#     WHERE to site (or how many to site), not the build chain.
#  4. `proc` cost 1400, `powr` cost 300 (gamerules.rs). The agent
#     pack ships a powr already; starting cash 1500 starts ONE proc
#     immediately and the second proc requires deposits from the
#     first.
#  5. ENGINE GAP — `place_building` for a NEW proc auto-spawns one
#     fresh harvester adjacent to the cell of the FIRST owned proc,
#     not adjacent to the new proc. So building a 2nd / 3rd / 4th
#     proc does NOT give the agent strictly-MORE distributed
#     harvesters per proc; the parallel-production speedup
#     hypothesis (more procs → more parallel cycles) is bounded by
#     this. The pack handles this by pre-positioning a separate
#     harv at every patch so the decision is WHICH patch's
#     deposit-chain to enable via a proc, not "where will my new
#     auto-spawned harv land". (A future engine fix that spawns
#     the new harv adjacent to the new proc would let this pack
#     re-introduce a sharp "claim-all-four LOSES on timing"
#     boundary; for now we document and accept.)
#  6. Per-player cash plumbing — bench-wide footgun: must set
#     `agent.cash` EXPLICITLY in `base.agent` (the engine reads
#     `agent.cash` for the per-player wallet; the top-level
#     `starting_cash` controls a separate parser default). Both
#     are set to 1500 here for clarity.
#  7. `cash_gte: N` reads `signals.cash` directly. Starting cash
#     1500 is BELOW the bar (4500 / 5000 / 5500), so the win is
#     reachable only via harvest deposits.
#  8. Tick alignment (CLAUDE.md): engine advances ~90 ticks per
#     decision turn, so `within_ticks ≤ 93 + 90·(max_turns − 1)`.
#     `max_turns: 40` ⇒ ceiling 3603; `within_ticks 3600` and
#     `after_ticks 3601` both fit so non-finishers LOSE (no DRAW).
#  9. Persistent unarmed enemy `fact` at the far edge prevents
#     `ConquestVictoryConditions` from auto-`done`-ing on enemy
#     wipe (CLAUDE.md auto-done footgun).
# 10. Hard tier — 2 distinct agent `spawn_point` groups (NORTH base
#     at y=12 / SOUTH base at y=28) with the pre-staffed harvs ALSO
#     declared per-spawn (per-owner spawn_point semantics filter
#     agent actors when at least one declares spawn_point), so the
#     agent's near-medium patches always sit at its OWN latitude.
#     The ore patches themselves are NOT spawn-filtered (a single
#     fixed map), but a memorised "always place at (40,8) and
#     (40,32)" opening fails on the wrong-spawn seed because the
#     four pre-staffed harvs are at different positions and the
#     spawn-relative geometry rotates.

meta:
  id: econ-multi-patch-allocation
  title: 'Multi-Patch Allocation — Pick Which Ore Patches To Commit To'
  capability: reasoning
  real_world_meaning: >
    Resource allocation across multiple candidate sites under a
    hard capital budget. The agent has a Construction Yard and a
    Power Plant in the west and looks out at four ore patches
    scattered around the map, each with an idle Ore Truck waiting
    beside it: one small near patch (depletes fast), two medium
    patches at the medium-distance ring, and one rich patch at
    the far east edge. Starting cash funds ONE refinery up front;
    the second requires deposits from the first. The decision is
    whether to commit to at least two refineries (the multi-patch
    allocation insight), and which patches to commit them to —
    stalling earns nothing and loses, a single-refinery opening
    fails the proc-count clause, and the intended efficient play
    is to commit to two medium-distance patches so parallel
    harvest cycles deposit ample cash inside the deadline.
  robotics_analogue: >
    A mining survey reports four candidate extraction sites with
    different size and travel-cost profiles, and the day's CAPEX
    budget covers no more than two processing depots up front.
    The autonomous operations planner must (a) commit to building
    more than one processing depot — running only one stalls the
    quota — and (b) site them next to patches whose harvester
    cycle-times stay short enough to deposit the quota before the
    shift deadline. The capability under test is the
    multi-site-investment decision under a small CAPEX cap, not a
    single-site optimisation.
  benchmark_anchor:
    - "OR resource-allocation"
    - "SC2 macro 2-base vs 3-base"
    - "lmgame-Bench resource-streaming"
  author: openra-bench

base_map: econ-multi-patch-arena
starting_cash: 1500

base:
  # agent.cash MUST be set explicitly — the bench's PlayerSetup
  # defaults `agent.cash: 0` and the engine reads `agent.cash` for
  # the per-player wallet (engine fix pinned by
  # `tests/test_per_player_starting_cash.py`). Without an explicit
  # `cash: 1500` on the agent side the agent starts the episode
  # broke and no proc build can ever complete.
  agent: {faction: allies, cash: 1500}
  enemy: {faction: soviet, cash: 0}
  tools: [observe, build, place_building, move_units, harvest, stop]
  spawn_mcvs: false
  planning: true
  termination: {max_ticks: 5000}
  actors: []  # every level supplies its own actor list via overrides.

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Four-patch geometry on the central y=20 latitude. Bar is
  # cash ≥ 4500 AND ≥ 2 refineries owned. Single-proc / stall
  # openings fail on the proc-count clause; any 2-proc opening
  # passes (claim-all-four ties intended on outcome — see engine
  # gap #5 above). max_turns 40 ⇒ ceiling 3603.
  easy:
    description: >
      Commander, this is a multi-patch allocation mission. You hold a
      Construction Yard (fact) and a Power Plant (powr) at your home
      base in the west, with $1500 in the bank. Four ore patches are
      visible, each with a pre-positioned idle harvester (harv, an
      unarmed ore-collector truck) waiting beside it: a small near
      patch A at (20,20) that drains fast, two medium patches B at
      (40,8) and C at (40,32), and a rich far patch D at (115,20)
      whose round-trip dominates throughput. A harvester only deposits
      when an Ore Refinery (proc) exists. $1500 starts one refinery
      ($1400); a second refinery needs income from the first. Within
      about 40 turns, own at least two refineries and finish with cash
      at least $4500. Commit to two productive medium patches — the
      single-refinery openings miss the count clause.
    starting_cash: 1500
    overrides:
      actors:
        # Home base — fact + powr only. No home proc, no home
        # harv. The home proc is intentionally absent: the
        # decision is exclusively WHERE / HOW MANY refineries to
        # build (mine-and-grow already covers the "build any
        # refinery at all" axis).
        - {type: fact, owner: agent, position: [8, 20]}
        - {type: powr, owner: agent, position: [8, 18]}
        # One harvester pre-positioned next to EACH patch.
        # auto_route_idle_harvesters routes each to the nearest
        # owned proc the moment one exists. Patches without a
        # sited proc have their harv idle indefinitely.
        - {type: harv, owner: agent, position: [22, 20]}    # near A
        - {type: harv, owner: agent, position: [38, 8]}     # near B
        - {type: harv, owner: agent, position: [38, 32]}    # near C
        - {type: harv, owner: agent, position: [113, 20]}   # near D
        # Persistent far-edge enemy marker — auto-done blocker.
        - {type: fact, owner: enemy, position: [125, 20]}
      ore_patches:
        - {x: 20, y: 20, amount: 500,  radius: 2}   # A — near, small
        - {x: 40, y: 8,  amount: 2000, radius: 3}   # B — N medium
        - {x: 40, y: 32, amount: 2000, radius: 3}   # C — S medium
        - {x: 115, y: 20, amount: 3500, radius: 3}  # D — far rich
    win_condition:
      all_of:
        - {building_count_gte: {type: proc, n: 2}}
        - {cash_gte: 4500}
        - {within_ticks: 3600}
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {has_building: fact}}
    max_turns: 40

  # ── MEDIUM ───────────────────────────────────────────────────────
  # Same four-patch geometry as easy, TIGHTER cash bar (≥ 5000).
  # Single-proc openings still fail on the proc-count clause; the
  # cash bar is high enough that a 2-proc play needs both procs
  # placed at productive patches (procs on patch A alone, where
  # patch A drains too fast, fall short on cash even at proc
  # count 2 — but the placement options are the same as easy).
  medium:
    description: >
      Commander, this is a multi-patch allocation mission with a
      tighter cash bar. You hold a Construction Yard (fact) and a
      Power Plant (powr) at your home base in the west, with $1500 in
      the bank. Four ore patches are visible, each with a pre-positioned
      idle harvester (harv, an unarmed ore-collector truck): a small
      near patch A at (20,20), two medium patches B at (40,8) and C at
      (40,32), and a rich far patch D at (115,20). A harvester only
      deposits when an Ore Refinery (proc) exists; $1500 funds one
      refinery, the second must come from income. Within about 40
      turns, own at least two refineries and finish with cash at least
      $5000. Commit to two productive medium patches.
    starting_cash: 1500
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 20]}
        - {type: powr, owner: agent, position: [8, 18]}
        - {type: harv, owner: agent, position: [22, 20]}
        - {type: harv, owner: agent, position: [38, 8]}
        - {type: harv, owner: agent, position: [38, 32]}
        - {type: harv, owner: agent, position: [113, 20]}
        - {type: fact, owner: enemy, position: [125, 20]}
      ore_patches:
        - {x: 20, y: 20, amount: 500,  radius: 2}
        - {x: 40, y: 8,  amount: 2000, radius: 3}
        - {x: 40, y: 32, amount: 2000, radius: 3}
        - {x: 115, y: 20, amount: 3500, radius: 3}
    win_condition:
      all_of:
        - {building_count_gte: {type: proc, n: 2}}
        - {cash_gte: 5000}
        - {within_ticks: 3600}
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {has_building: fact}}
    max_turns: 40

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 controlled axis: seed-driven agent `spawn_point` groups —
  # NORTH base (y=12) vs SOUTH base (y=28). The pre-staffed harvs
  # are ALSO declared per-spawn so the spawn-relative geometry
  # rotates cleanly: NORTH-spawn the agent's harvs sit at patches
  # at y≈4, y=12, y=20, and the shared D far patch; SOUTH-spawn
  # the harvs sit at patches at y=20, y=28, y=36, and the shared
  # D far patch. The ore patches themselves are not spawn-filtered
  # (a single fixed map), but a memorised "always place procs at
  # (40,8) and (40,32)" opening fails on the wrong-spawn seed
  # because the harvs are differently positioned and the
  # spawn-relative geometry rotates.
  hard:
    description: >
      Commander, this is a multi-patch allocation mission with
      seed-rotated base latitude. You hold a Construction Yard (fact)
      and a Power Plant (powr) at either the NORTH (y=12) or SOUTH
      (y=28) latitude, with $1500 in the bank. Four ore patches are
      visible, each with one pre-positioned idle harvester (harv, an
      unarmed ore-collector truck): a small near patch beside your
      base, two medium patches at the medium-distance ring relative
      to your latitude, and a rich patch far east whose round-trip
      dominates throughput. $1500 starts one refinery; income funds
      the second. Within about 40 turns, own at least two refineries
      and finish with cash at least $5500. Commit to the two MEDIUM
      patches closest to your spawn.
    starting_cash: 1500
    overrides:
      actors:
        # ── spawn_point 0 — NORTH base (y=12) ──────────────────
        - {type: fact, owner: agent, position: [8, 12],   spawn_point: 0}
        - {type: powr, owner: agent, position: [8, 10],   spawn_point: 0}
        # Pre-staffed harvs for NORTH spawn's four patches.
        - {type: harv, owner: agent, position: [22, 12],  spawn_point: 0}  # A_n near
        - {type: harv, owner: agent, position: [38, 4],   spawn_point: 0}  # B_n N-medium
        - {type: harv, owner: agent, position: [38, 20],  spawn_point: 0}  # C_n S-medium (centre row)
        - {type: harv, owner: agent, position: [113, 20], spawn_point: 0}  # D far rich
        # ── spawn_point 1 — SOUTH base (y=28) ──────────────────
        - {type: fact, owner: agent, position: [8, 28],   spawn_point: 1}
        - {type: powr, owner: agent, position: [8, 30],   spawn_point: 1}
        - {type: harv, owner: agent, position: [22, 28],  spawn_point: 1}  # A_s near
        - {type: harv, owner: agent, position: [38, 20],  spawn_point: 1}  # B_s N-medium (centre row)
        - {type: harv, owner: agent, position: [38, 36],  spawn_point: 1}  # C_s S-medium
        - {type: harv, owner: agent, position: [113, 20], spawn_point: 1}  # D far rich
        # Persistent far-edge enemy marker — no spawn_point key
        # so the enemy spawn filter stays inactive (CLAUDE.md
        # per-owner spawn_point semantics): one fact for all seeds.
        - {type: fact, owner: enemy, position: [125, 20]}
      ore_patches:
        # All seven latitude-rotated patches plus the shared rich
        # patch are materialised every seed (ore_patches is not
        # filtered by spawn_point), so the agent always sees the
        # same map. What rotates per seed is the BASE position
        # and the four PRE-STAFFED HARVS, which determine which
        # patches are practically reachable for a per-turn cycle.
        - {x: 20, y: 12,  amount: 500,  radius: 2}  # A_n near (NORTH)
        - {x: 20, y: 28,  amount: 500,  radius: 2}  # A_s near (SOUTH)
        - {x: 40, y: 4,   amount: 2000, radius: 3}  # B_n N-medium (NORTH)
        - {x: 40, y: 20,  amount: 2000, radius: 3}  # shared centre — C_n / B_s
        - {x: 40, y: 36,  amount: 2000, radius: 3}  # C_s S-medium (SOUTH)
        - {x: 115, y: 20, amount: 3500, radius: 3}  # D far rich (shared)
    win_condition:
      all_of:
        - {building_count_gte: {type: proc, n: 2}}
        - {cash_gte: 5500}
        - {within_ticks: 3600}
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {has_building: fact}}
    max_turns: 40
