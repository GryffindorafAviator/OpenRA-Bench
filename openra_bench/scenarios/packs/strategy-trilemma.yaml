meta:
  id: strategy-trilemma
  title: 'Capital Trilemma — Commit One Indivisible Quarter to Expand / Tech / Army'
  capability: reasoning
  real_world_meaning: >
    Capital allocation under one indivisible quarter-budget across three
    mutually exclusive product directions: a startup deciding between
    hiring (ARMY), R&D (TECH), or geographic expansion (a second base).
    Choosing two starves the third — and starves all three — because the
    quarter's burn funds exactly one full path. The test is the commit,
    not the mechanics of any single path: the binding budget makes
    hedging a strict loss.
  robotics_analogue: >
    Fixed-quarter budget allocation across mutually exclusive product
    directions in an autonomous fleet: the same burn buys EITHER a
    forward depot (expansion) OR a new capability module (R&D) OR a
    larger active worker complement (hiring) — and any split funds none
    of them before the deadline.
  benchmark_anchor:
    - PlanBench cost-optimal planning
    - lmgame-Bench resource-allocation tracking
    - ARC-AGI inductive choice under indivisible budget
    - 'capital allocation: hire vs R&D vs expansion'
  author: autonomous-loop

# ENGINE NOTES (verified 2026-05 on scripted run_level seeds 1-4):
# - Three-way mutual exclusion is enforced by `starting_cash` alone
#   (harvest income is 0 in a runnable pack today). With the medium
#   budget of 2400 cr:
#     * EXPAND  = build+place a proc in the far region (cost 1400)
#     * TECH    = build+place a `weap` war factory (cost 2000)
#     * ARMY    = field ≥12 e1 (12 × 100 = 1200) AND get one kill credit
#                 against the hunt harasser (defended harass).
#   Pairwise sums all exceed 2400 (1400+1200=2600; 2000+1200=3200;
#   1400+2000=3400), so a hedged spend funds NONE of the three arms in
#   time. A `proc` at (60,20) auto-spawns a harv (engine
#   behaviour), but the harv is non-combat and ARMY requires kill
#   credit — so EXPAND does NOT trivially also satisfy ARMY.
# - The agent base preplaces fact+powr+proc+tent so every production
#   prerequisite for every arm is satisfied at t=0 (weap needs proc,
#   e1 needs tent). Without `tent` a brute army-spam policy is blocked
#   by the tech tree (verified: a `build('e1')` policy on a base
#   missing `tent` produces zero units and times out).
# - An unarmed `fact` is placed on the enemy side at (115,32) as a
#   persistence marker: the engine auto-ends an episode the moment a
#   player has zero actors of any kind, which would convert a
#   defeated-harasser stall into a premature DRAW. The enemy fact has
#   no weapon and the agent's tools list omits attack so the marker
#   cannot be eliminated, preserving a real reachable timeout LOSS.
# - The hunt bot drives a small harasser cell at the agent's base; on
#   stall (`observe()` only) it whittles powr/proc/tent over the
#   episode but the high-HP fact survives — the loss arrives via the
#   tick deadline (`after_ticks > 4500`), which IS a real reachable
#   loss for max_turns=50 (deadline reaches tick 4503).
base_map:
  generator: arena
  name: strategy-trilemma-arena
  width: 128
  height: 40
starting_cash: 2400

# All tiers override `base_map` with a procedural 96x40 arena (the
# top-level rush-hour-arena reference is only the support-flag sentinel
# the loader resolves before per-level overrides apply). The decision
# footprint — base at x=10, forward target at x=60, harasser path
# x=85-90 — fits 96 cells; rush-hour-arena's 128x40 left ~30 cells of
# decision-free eastern traversal.

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
    bot_type: hunt
  tools:
    - build
    - place_building
    - move_units
    - stop
  planning: true
  termination:
    max_ticks: 30000
  actors:
    # Agent base — every production prerequisite met at t=0:
    #   weap needs proc (✓ at 10,22), e1 needs tent (✓ at 14,22),
    #   proc needs powr (✓ at 14,18), tent needs powr (✓).
    - {type: fact, owner: agent, position: [10, 18]}
    - {type: powr, owner: agent, position: [14, 18]}
    - {type: proc, owner: agent, position: [10, 22]}
    - {type: tent, owner: agent, position: [14, 22]}
    # Unarmed persistence marker (no weapon → cannot wipe the enemy
    # player; agent tools omit attack so it cannot be eliminated).
    - {type: fact, owner: enemy, position: [115, 32], stance: 0}
    # Hunt harasser — places stall under timer pressure; defeating it
    # gives the ARMY arm its required kill credit.
    - {type: e1,   owner: enemy, position: [95, 30], stance: 2}

levels:
  easy:
    # ENGINE NOTE (contributors): three mutually exclusive win arms
    # encoded in the win predicate — (a) a 2nd refinery in the far
    # region at (60,20), (b) a war factory, (c) ≥12 e1 plus one kill.
    # Costs: refinery 1400, war factory 2000, 12 e1 + harasser 1200.
    # Easy budget 3000 funds any ONE arm with slack but not any TWO
    # (1400+2000=3400; 1400+1200=2600; 2000+1200=3200). Briefing per
    # F1 §9.5 names the budget, threat, deadline and target region but
    # NOT the three arms as verb labels — the model derives them from
    # the production menu and observable map.
    description: >
      You command a fully-prereqed allies base (Construction Yard, Power
      Plant, Ore Refinery, Infantry Barracks) at the west edge. Cash is
      $3000 and there is no harvest income — that one purse is your
      entire campaign budget. A scripted hunt harasser will probe your
      base from the east. There is a marked target region at (60,20).
      Achieve ONE complete win condition (visible in the win predicate)
      within about 60 turns.
    starting_cash: 3000
    overrides:
      base_map:
        generator: arena
        name: strategy-trilemma-arena
        width: 96
        height: 40
        cordon: 4
      actors:
        - {type: fact, owner: agent, position: [10, 18]}
        - {type: powr, owner: agent, position: [14, 18]}
        - {type: proc, owner: agent, position: [10, 22]}
        - {type: tent, owner: agent, position: [14, 22]}
        - {type: fact, owner: enemy, position: [88, 32], stance: 0}
        - {type: e1,   owner: enemy, position: [75, 30], stance: 2}
    win_condition:
      any_of:
        - all_of:
            - building_in_region: {x: 60, y: 20, radius: 6, type: proc, count: 1}
            - within_ticks: 5400
        - all_of:
            - has_building: weap
            - within_ticks: 5400
        - all_of:
            - own_units_gte: 12
            - units_killed_gte: 1
            - within_ticks: 5400
    fail_condition:
      any_of:
        - after_ticks: 5401
        - not: {has_building: fact}
    max_turns: 60

  medium:
    # ENGINE NOTE (contributors): same three arms as easy under a
    # binding $2400 budget — funds EXACTLY one full arm. Any hedge
    # leaves every arm incomplete before the tighter deadline.
    description: >
      Same fully-prereqed allies base; same hunt harasser; same marked
      target region at (60,20). Cash is now $2400 with no income.
      Achieve ONE complete win condition (see the win predicate) within
      about 50 turns.
    starting_cash: 2400
    overrides:
      base_map:
        generator: arena
        name: strategy-trilemma-arena
        width: 96
        height: 40
        cordon: 4
      actors:
        - {type: fact, owner: agent, position: [10, 18]}
        - {type: powr, owner: agent, position: [14, 18]}
        - {type: proc, owner: agent, position: [10, 22]}
        - {type: tent, owner: agent, position: [14, 22]}
        - {type: fact, owner: enemy, position: [88, 32], stance: 0}
        - {type: e1,   owner: enemy, position: [75, 30], stance: 2}
    win_condition:
      any_of:
        - all_of:
            - building_in_region: {x: 60, y: 20, radius: 6, type: proc, count: 1}
            - within_ticks: 4500
        - all_of:
            - has_building: weap
            - within_ticks: 4500
        - all_of:
            - own_units_gte: 12
            - units_killed_gte: 1
            - within_ticks: 4500
    fail_condition:
      any_of:
        - after_ticks: 4501
        - not: {has_building: fact}
    max_turns: 50

  hard:
    # ENGINE NOTE (contributors): tightest trilemma — budget 2200, the
    # harasser is doubled, attrition cap added (units_lost_lte:3), and
    # spawn_point rotates the seed-varied scout staging.
    description: >
      Same fully-prereqed allies base. Cash is $2200 with no income.
      A doubled hunt harasser will probe the base. Marked target
      region at (60,20). Achieve ONE complete win condition (see the
      win predicate) within about 40 turns, losing no more than three
      units.
    starting_cash: 2200
    overrides:
      base_map:
        generator: arena
        name: strategy-trilemma-arena
        width: 96
        height: 40
        cordon: 4
      actors:
        # Base buildings duplicated under both spawn_point groups so the
        # filter (`if any agent actor has spawn_point: keep only the
        # selected group`) leaves the agent fully provisioned in either
        # seed branch. Positions are identical across groups — the only
        # seed-varied actor is the scout, which is enough to satisfy
        # the hard-tier ≥2-distinct-starts contract.
        - {type: fact, owner: agent, position: [10, 18], spawn_point: 0}
        - {type: powr, owner: agent, position: [14, 18], spawn_point: 0}
        - {type: proc, owner: agent, position: [10, 22], spawn_point: 0}
        - {type: tent, owner: agent, position: [14, 22], spawn_point: 0}
        # Seed-varied scout — staging position differs per seed.
        - {type: e1,   owner: agent, position: [16, 20], stance: 2, spawn_point: 0}
        - {type: fact, owner: agent, position: [10, 18], spawn_point: 1}
        - {type: powr, owner: agent, position: [14, 18], spawn_point: 1}
        - {type: proc, owner: agent, position: [10, 22], spawn_point: 1}
        - {type: tent, owner: agent, position: [14, 22], spawn_point: 1}
        - {type: e1,   owner: agent, position: [16, 24], stance: 2, spawn_point: 1}
        - {type: fact, owner: enemy, position: [88, 32], stance: 0}
        # Doubled hunt harasser — defended harass for the ARMY arm.
        - {type: e1, owner: enemy, position: [75, 30], stance: 2}
        - {type: e1, owner: enemy, position: [80, 28], stance: 2}
    win_condition:
      any_of:
        - all_of:
            - building_in_region: {x: 60, y: 20, radius: 6, type: proc, count: 1}
            - within_ticks: 3600
            - units_lost_lte: 3
        - all_of:
            - has_building: weap
            - within_ticks: 3600
            - units_lost_lte: 3
        - all_of:
            - own_units_gte: 12
            - units_killed_gte: 1
            - within_ticks: 3600
            - units_lost_lte: 3
    fail_condition:
      any_of:
        - after_ticks: 3601
        - not: {has_building: fact}
        - not: {units_lost_lte: 3}
    max_turns: 40
