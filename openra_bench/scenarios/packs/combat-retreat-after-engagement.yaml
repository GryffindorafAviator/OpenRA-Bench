# combat-retreat-after-engagement — disengage when battle goes poorly
# to PRESERVE the force (Wave-6 reasoning pack).
#
# 2026-05-23 EDIT: map shrunk 112x40 → 56x40 per audits/EDIT_PRINCIPLES
# §10 (cut empty pre-engagement traversal — the original was tagged
# `large-trivial`). Engagement line x=60 → x=30, 3tnk escort x=64 →
# x=34, sentinel (108,20) → (52,20), forward markers x=56/x=64 →
# x=28/x=34. Safe-zone discs (5,20) / (5,10) / (5,30) and the
# engagement / retreat / preservation teeth all preserved at half scale.
#
# Real-world anchors:
#   - SC2 retreat micro: when a fight is going poorly, pull units back
#     to a safe rally point before they die. The decision is timing —
#     too early and you don't score damage; too late and you lose the
#     force. "Live to fight another day."
#   - Military tactical-withdrawal doctrine (skirmish-and-pullback,
#     covering retreat, preservation of force). A small commitment
#     trades hits for intel/attrition, then breaks contact before the
#     enemy can encircle and destroy.
#
# Recalibrated 2026-05-20 after the OpenRA-Rust movement fixes (moving
# units fire AND take fire en route; attack_unit on out-of-sight target
# paths normally). Those fixes made the close-range trade far more
# lethal, and the interrupt-mode tick cadence means an action-heavy
# episode advances FEWER ticks per turn than a pure stall — so the old
# after_ticks:4501 deadline was inert. The enemy is now lighter and the
# deadline pulled down to 4000.
#
# Idiom (the four-policy bar):
#   • stall (only observe)                    → LOSS. Kill bar unmet,
#     after_ticks:4000 fires → real LOSS.
#   • brute attack-until-death (commit fully) → LOSS. The column
#     overshoots the e3 line into the set-back 3tnk and is out-traded.
#   • never-engage (sit at safe zone)         → LOSS. Kill bar unmet →
#     after_ticks LOSS.
#   • intended engage-then-retreat            → WIN.

meta:
  id: combat-retreat-after-engagement
  title: 'Combat Retreat — Disengage to Preserve the Force'
  capability: reasoning
  real_world_meaning: >
    Four medium tanks face a numerically superior enemy squad (rocket
    infantry + heavy tanks) at close range. The fight is unwinnable
    head-on: the rocket infantry and heavy cannons together out-trade
    the column inside the loss cap. The only winning play is the
    SC2 retreat-micro idiom: commit briefly to score the kill bar on
    the soft anti-tank infantry (rocket soldier), then break contact and pull
    the surviving tanks BACK to the safe rally point in the west
    before attrition busts the force-preservation cap.
  robotics_analogue: >
    Military tactical-withdrawal doctrine and the SC2 retreat-micro
    pattern — when a battle goes poorly, the policy must IDENTIFY
    the losing trade and pull back to a safe rally before the unit
    is destroyed. The skill is reading the engagement state and
    issuing a withdrawal order at the right moment; over- or
    under-commitment both fail.
  benchmark_anchor:
    - "SC2 retreat micro / disengage timing"
    - "military tactical withdrawal doctrine"
    - "preservation of force / live-to-fight-another-day"
    - "skirmish-and-pullback tactics"
  author: openra-bench

base_map:
  # Tailored 56x40 arena: half the original 112x40 (cordon 2 ⇒ playable
  # x in [2..53], y in [2..37]). Six small 2×2 water markers visually
  # demarcate the two functional zones:
  #   - safe REAR position in the WEST (markers at (10,4) and (10,34),
  #     framing the x=2..9 staging column where the tanks live);
  #   - forward ENGAGEMENT zone in the CENTRE (markers at (28,4),
  #     (34,4), (28,34), (34,34), bracketing the e3 firing line at
  #     x=30 and the 3tnk escort at x=34).
  # Every marker sits OUTSIDE every safe-zone disc (radius 6 from
  # (5,20) on easy/medium; from (5,10) and (5,30) on hard) and well
  # off the y=18..22 engagement corridor.
  generator: arena
  name: combat-retreat-after-engagement-arena-56x40
  width: 56
  height: 40
  cordon: 2
  title: Combat Retreat 56x40
  obstacles:
    - {x: 10, y: 4,  w: 2, h: 2}
    - {x: 10, y: 34, w: 2, h: 2}
    - {x: 28, y: 4,  w: 2, h: 2}
    - {x: 34, y: 4,  w: 2, h: 2}
    - {x: 28, y: 34, w: 2, h: 2}
    - {x: 34, y: 34, w: 2, h: 2}
  spawns:
    - [5, 20]

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: guard}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 6000}
  actors: []

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  easy:
    description: >
      Commander, this is a combat engagement on a 56x40 arena. You
      are given 4 medium tanks (Return-Fire orders) in the western
      safe-zone disc at (5,20) radius 6. The enemy holds the
      centre: 2 anti-tank rocket soldiers at the firing line at
      x=30, with 1 heavy tank set back at (34,20) on Defend orders.
      Score 2 kills, return at least 3 tanks to the (5,20) safe-
      zone disc (radius 6), keep at least 2 tanks alive, within
      4000 ticks.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [5, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [5, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [5, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [5, 21], stance: 1}
        - {type: e3,   owner: enemy, position: [30, 19], stance: 2}
        - {type: e3,   owner: enemy, position: [30, 21], stance: 2}
        - {type: 3tnk, owner: enemy, position: [34, 20], stance: 2}
        - {type: fact, owner: enemy, position: [52, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 2}
        - {units_in_region_gte: {x: 5, y: 20, radius: 6, n: 3}}
        - {own_units_gte: 2}
        - {within_ticks: 4000}
    fail_condition:
      any_of:
        - {after_ticks: 4000}
        - {not: {own_units_gte: 2}}
    max_turns: 51

  # ── MEDIUM ───────────────────────────────────────────────────────
  medium:
    description: >
      Commander, this is a combat engagement on a 56x40 arena. You
      are given 4 medium tanks (Return-Fire orders) in the western
      safe-zone disc at (5,20) radius 6. The enemy holds the
      centre: 3 anti-tank rocket soldiers at the firing line at
      x=30, with 1 heavy tank set back at (34,20) on Defend orders.
      Score 3 kills, return at least 3 tanks to the (5,20) safe-
      zone disc (radius 6), keep at least 3 tanks alive, within
      4000 ticks.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [5, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [5, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [5, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [5, 21], stance: 1}
        - {type: e3,   owner: enemy, position: [30, 18], stance: 2}
        - {type: e3,   owner: enemy, position: [30, 20], stance: 2}
        - {type: e3,   owner: enemy, position: [30, 22], stance: 2}
        - {type: 3tnk, owner: enemy, position: [34, 20], stance: 2}
        - {type: fact, owner: enemy, position: [52, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 3}
        - {units_in_region_gte: {x: 5, y: 20, radius: 6, n: 3}}
        - {own_units_gte: 3}
        - {within_ticks: 4000}
    fail_condition:
      any_of:
        - {after_ticks: 4000}
        - {not: {own_units_gte: 3}}
    max_turns: 51

  # ── HARD ─────────────────────────────────────────────────────────
  hard:
    description: >
      Commander, this is a combat engagement on a 56x40 arena. You
      are given 4 medium tanks (Return-Fire orders) staged in the
      north safe-zone disc at (5,10) or the south safe-zone disc at
      (5,30) depending on seed (each radius 6). The enemy holds the
      centre: 2 anti-tank rocket soldiers at (30,19) and (30,21),
      with 1 heavy tank set back at (34,20) on Defend orders. Score
      2 kills, return at least 3 tanks to either the (5,10) or
      (5,30) safe-zone disc, keep at least 3 tanks alive, within
      4000 ticks.
    overrides:
      actors:
        # spawn_point 0 — NORTH safe zone (y=8..11)
        - {type: 2tnk, owner: agent, position: [5, 8],  stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [5, 9],  stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [5, 10], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [5, 11], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH safe zone (y=28..31)
        - {type: 2tnk, owner: agent, position: [5, 28], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [5, 29], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [5, 30], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [5, 31], stance: 1, spawn_point: 1}
        - {type: e3,   owner: enemy, position: [30, 19], stance: 2}
        - {type: e3,   owner: enemy, position: [30, 21], stance: 2}
        - {type: 3tnk, owner: enemy, position: [34, 20], stance: 2}
        - {type: fact, owner: enemy, position: [52, 20]}
    win_condition:
      all_of:
        - {units_killed_gte: 2}
        - any_of:
            - {units_in_region_gte: {x: 5, y: 10, radius: 6, n: 3}}
            - {units_in_region_gte: {x: 5, y: 30, radius: 6, n: 3}}
        - {own_units_gte: 3}
        - {within_ticks: 4000}
    fail_condition:
      any_of:
        - {after_ticks: 4000}
        - {not: {own_units_gte: 3}}
    max_turns: 51
