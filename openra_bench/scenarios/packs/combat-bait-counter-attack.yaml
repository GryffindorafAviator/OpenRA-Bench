# combat-bait-counter-attack.yaml
#
# REASONING capability — bait-and-flank counter-attack micro. A
# leashed GUARD cluster (scripted `guard` bot, GUARD_AGGRO ≈ 16 /
# GUARD_LEASH ≈ 18 from spawn cell) sits clumped on the WEST face of
# the enemy construction yard (`fact`) and forms a wall of anti-tank
# rocket infantry (e3) directly between the agent and the objective.
# Drive the strike tanks straight in and every guard auto-fires on
# the approach — e3 anti-tank DPS shreds a 2tnk column before the
# fact falls and the attrition cap (units_lost_lte:N) trips. Sit
# still and the clock runs out (within_ticks 3600).
#
# The intended idiom is the SC2 bait-micro / military feint-and-flank
# doctrine: commit the cheap fast jeep as bait on a divergent vector
# that comes WITHIN aggro radius of a SEGMENT of the cluster (e.g.
# south-flank approach), pulling those guards OFF post; in the
# transient window while they're off-post chasing the jeep toward
# their leash, swing the strike tanks around through the now-vacated
# slot (north flank) to hit the briefly-undefended `fact`. Phase 1
# (the bait pull) yields zero objective progress and looks locally
# negative (the jeep is drawing fire); only phase 2, through the
# vacated slot, scores.
#
# Distinct from `artofwar-lure-the-tiger` (a LINE-of-guards walling
# a corridor: the bait pulls a segment off the wall to open a passage
# for the main body to TRAVERSE through to a far landmark) and
# `artofwar-decoy-sacrifice` (a HUNTING picket that actively pursues:
# bait spends to draw chasers off a corridor): here the cluster
# GUARDS a fixed objective `fact` and the win is the FACT BEING
# DESTROYED — the bait displaces a side of the cluster off post and
# the strike force exploits the gap to attack the objective itself,
# not pass through.
#
# Engine notes (per CLAUDE.md + Wave 12+13 footgun ledger):
#   - `fact` is `MustBeDestroyed`: razing it would auto-`done` the
#     engine. A SENTINEL enemy `fact` is placed in the far NE corner
#     so the episode persists past the objective `fact` destruction
#     until the engine evaluates win/fail predicates — including the
#     attrition cap (units_lost_lte) and the deadline (within_ticks).
#   - GUARD_AGGRO ≈ 16, GUARD_LEASH ≈ 18 from spawn_cell. The bait
#     vector must come WITHIN ≈16 of a guard's spawn cell to lunge.
#   - `move_units` auto-fires opportunistically and a moving unit is
#     a normal target (engine move-fire fix): the e3 anti-tank Dragon
#     bites the 2tnk Heavy armour HARD. A 3-tank strike can no longer
#     trade a 5+ guard cover within a 2-unit cap, so medium/hard field
#     a 5-tank strike (easy a 4-tank strike). The bait must pull a
#     SEGMENT of the cluster off post and the strike must focus-fire
#     the displaced remnant: the bait is genuinely load-bearing
#     (bait-only never razes the yard, brute frontal trades the force).
#   - The bait jeep cannot survive a sustained kite under the new
#     engine — it pulls a guard segment off post for a transient
#     window and is then spent; the strike must commit during that
#     window, not loop a long route while the jeep idles.
#   - Wave 13 tick-rate footgun: engine advances ~64 ticks/turn under
#     the bench's interrupt mode (NOT the CLAUDE.md ~90). The
#     within_ticks deadline is tightened from 5400 to 3600 so it
#     bites inside max_turns=62 (max reachable tick ≈ 64*62 ≈ 3968).
#   - Wave 13 mpspawn-rotation footgun: the `arena` generator's
#     default 4 corner mpspawns rotate per seed and OFFSET pre-placed
#     actor coords relative to the chosen spawn, so authored
#     coordinates don't land where you wrote them. This pack's
#     `base_map` declares an EXPLICIT single mpspawn at the west-mid
#     stage cell so every seed sees the same actor coordinates and
#     the bait/flank geometry is invariant.

meta:
  id: combat-bait-counter-attack
  title: 'Bait + Counter-Attack — Pull the Guards Off Post, Strike the Undefended Yard'
  capability: reasoning
  real_world_meaning: >
    A reactive defending cluster (scripted `guard` bot: holds its post,
    auto-fires in range, lunges at the nearest foe within an aggro
    radius, snaps back past a leash) is bunched on the approach side
    of the enemy construction yard. Driving the strike force straight
    in eats anti-tank fire from the whole cluster and runs the
    attrition cap before the objective falls. The winning policy
    commits a cheap fast bait (jeep) on a DIVERGENT vector that comes
    just close enough to make a SIDE of the cluster lunge off post
    after the bait, then runs the strike tanks around through the
    now-vacated flank to destroy the construction yard while it is
    briefly undefended. Phase 1 (the bait pull) yields zero objective
    progress and looks locally negative; phase 2, through the slot
    the bait opened, scores. The credit problem is FEINT-AND-FLANK:
    the bait must displace a segment of the cluster and the strike
    must exploit the reversible vacancy in time; bait-only never
    razes the yard, brute frontal trades the strike force against
    the full cluster, stalling loses the clock.
  robotics_analogue: >
    Sacrificial-decoy planning against a reactive guarding obstacle:
    a no-reward enabling action (entice a leashed interceptor off the
    objective with a decoy on a divergent vector) must precede and
    temporally overlap the rewarded objective action (commit the
    payload force on the briefly-cleared flank to destroy the
    objective before the interceptor snaps back).
  benchmark_anchor:
    - "SC2 bait micro / sacrificial pull"
    - "military feint-and-flank doctrine"
    - "CICERO / Diplomacy deception"
  author: openra-bench

# combat-bait-counter-arena: tailored 112×40 arena (playable x in
# [2..109], y in [2..37]). Generator: `arena` with three SMALL water-
# rock cover clusters arranged so the bait/flank geometry reads as
# two distinct corridors (decoy south + ambush north), without
# touching the actual tank-vs-guard engagement zone:
#   • SOUTH-FLANK decoy cover — TWO small rock clusters at (50,30)
#     and (70,33) along the bait jeep's south-east approach lane.
#     The jeep skirts past the cover into the south arc's
#     GUARD_AGGRO radius, presenting as an "easy target" pulling
#     the south guards off post. Y=30+ is well clear of the e3
#     cluster (y=18..24), so these rocks do NOT change the strike-
#     vs-guard engagement range from the north flank.
#   • NORTH-FLANK ambush visual — one small rock at (90,6) in the
#     NE corner marks the perpendicular "hidden ambush" axis. The
#     north corridor (y=10..14) the strike column swings through
#     is left fully OPEN: once the bait pulls the south arc off
#     post, the strike has an unimpeded swing-in lane to the yard's
#     now-undefended north face. The bait points the enemy at the
#     south; the strike commits from the north.
# Explicit single mpspawn at the west-mid stage cell (6,20): per
# Wave-13 footgun #6 the arena's default 4-corner mpspawns rotate
# per seed and OFFSET pre-placed actor coords; declaring one spawn
# pins coordinates seed-invariantly so the bait/flank geometry
# (guard positions, jeep aggro vector, fact location) is identical
# every seed.
base_map:
  generator: arena
  name: combat-bait-counter-arena
  width: 112
  height: 40
  cordon: 2
  spawns: [[6, 20]]
  obstacles:
    # SOUTH-FLANK decoy cover cluster: two small rock groups along
    # the bait jeep's south-east approach lane. These frame the
    # "easy target" decoy axis — the jeep skirts past the cover
    # into the south arc's GUARD_AGGRO radius, presenting as a soft
    # target pulling the south guards off post toward it. They are
    # placed well south of the e3 cover (y=30 and y=32, vs e3 at
    # y=18..24) so they do NOT alter the tank-vs-guard engagement
    # range from the NORTH flank — that combat zone stays clean
    # open ground, matching the baseline calibration.
    - {x: 50, y: 30, w: 3, h: 2}
    - {x: 70, y: 33, w: 3, h: 2}
    # NE corner rock — visual marker of the "hidden ambush" axis on
    # the perpendicular flank. Far enough from the north corridor
    # (y=12) that the strike column has fully unimpeded swing-in
    # lane to the yard's north face once the bait pulls the south
    # arc off post.
    - {x: 90, y: 6, w: 2, h: 2}
  title: Bait Counter-Attack Arena 112x40

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: guard}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  termination: {max_ticks: 12000}

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # The bare bait-and-flank skill: 3 leashed guards lined on the
  # WEST face of the enemy fact (the natural approach side, in the
  # gap between the two cover rocks at y=16 and y=24), generous loss
  # cap (3). After the engine move-fire fixes the e3 anti-tank Dragon
  # shreds tanks far harder, so the strike force is 4 medium tanks.
  # Brute frontal: the column eats anti-tank fire from the whole
  # guard line, never razes the yard before the clock — a real
  # timeout LOSS. Stall: clock runs out (within_ticks 3600). Bait-
  # only: the jeep pulls the guards south off post but no strike —
  # the fact survives, clock runs out. Intended: the jeep dives deep
  # south so the west-face guards lunge after it; while it kites
  # them at their leash the strike tanks focus-fire the nearest
  # guard and then drive onto the now-undefended yard.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Three leashed rocket-infantry guards stand on the west face of
    # the enemy construction yard (`fact` at 80,20), in the gap
    # between two terrain rocks, directly between you and the
    # objective. They hold post, auto-fire on units in range, lunge
    # at the nearest foe within ≈16 cells, and snap back past a
    # leash of ≈18. Destroy the enemy construction yard with at most
    # 3 of your units lost before tick 3600. Driving the tanks
    # straight east at the yard puts them in anti-tank fire from the
    # whole guard line; stalling runs the clock. Commit the fast
    # jeep on a divergent south-east vector so the guards lunge
    # south after it; while the jeep kites them at their leash, run
    # the strike tanks straight through the now-undefended west face
    # to destroy the yard.
    description: >
      Three leashed rocket-infantry guards wall the west face of the
      enemy construction yard at (80,20). Destroy the yard, losing at
      most three units, within about 62 turns.
    overrides:
      actors:
        # Strike force: 4 medium tanks staging at west-centre on the
        # NORTH-flank corridor (y=12). The north corridor is the
        # "hidden ambush" lane — left fully open by the map design,
        # the strike swings in above the cover once the bait has
        # pulled the guards south.
        - {type: 2tnk, owner: agent, position: [6, 12], stance: 1, count: 4}
        # Bait: 1 fast jeep staged at west-south (y=28). The south-
        # flank cover rock at (60,30) frames the divergent south-east
        # approach lane the jeep runs to pull the guards off post.
        - {type: jeep, owner: agent, position: [6, 28], stance: 1}
        # The OBJECTIVE: enemy construction yard at mid-map.
        - {type: fact, owner: enemy, position: [80, 20]}
        # The GUARDS: 3 leashed rocket infantry on the WEST face of
        # the fact, in the gap between the two terrain rocks at y=16
        # and y=24. A deep-south jeep bait is within aggro ≈16 cells
        # of all three, so all three lunge south after it, clearing
        # the west approach.
        - {type: e3, owner: enemy, position: [76, 18], stance: 2}
        - {type: e3, owner: enemy, position: [76, 20], stance: 2}
        - {type: e3, owner: enemy, position: [76, 22], stance: 2}
        # SENTINEL: persistent enemy fact in the NE corner (out of
        # the combat zone, agent can't reach it in budget) so the
        # engine does not auto-`done` the instant the objective fact
        # dies, letting the within_ticks / units_lost_lte predicates
        # evaluate cleanly on the terminal frame. NE corner instead
        # of the legacy (120,4): the tailored arena is 112 wide.
        - {type: fact, owner: enemy, position: [108, 4]}
    win_condition:
      all_of:
        - {enemy_key_buildings_destroyed: {types: [fact]}}
        - {within_ticks: 3600}
        - {units_lost_lte: 3}
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {units_lost_lte: 3}}
        - {not: {own_units_gte: 1}}
    max_turns: 62

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: 5 guards forming a south + west L-cover
  # of the yard. A single deep-south bait pulls the south arc off
  # post; the strike commits on the NORTH flank while that arc is
  # displaced, swinging in above the cover to reach the yard. After
  # the engine move-fire fixes the e3 Dragon bites the 2tnk Heavy
  # armour harder, so a 3-tank strike can no longer trade a 5-guard
  # cover within the cap — the strike force is 5 medium tanks, a
  # scale-up matching the denser cover. The strike stages on the
  # NORTH flank (y=12): the engine `count:` spawn-spread now
  # scatters the column across several cells, so a head-on stage
  # drives the spread column straight into the un-baited WEST arc
  # and trades too much armour; the north-flank stage lets the
  # column swing in above the cover once the bait has pulled the
  # south arc. Strict attrition cap stays 2 (the bait jeep + at
  # most one tank): the strike must still hit the yard essentially
  # intact; burning a second tank fails.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # A denser cluster of 5 leashed rocket-infantry guards covers
    # the enemy construction yard (`fact` at 80,20) on the WEST and
    # SOUTH faces (the two natural approaches from your west base).
    # A head-on push without first thinning the cover is decisively
    # fatal. You command 5 medium tanks staged on the NORTH flank
    # plus the bait jeep, but may spend at most 2 units — losing a
    # second tank fails. Commit the fast jeep on a deep south flank
    # vector to pull the south arc of guards off post after it; while
    # that arc is displaced, swing the strike tanks around the
    # now-vacated NORTH flank and onto the yard before tick 3600.
    # Bait-only (no strike) loses on the clock; brute frontal trades
    # the strike force.
    description: >
      Denser cover — five leashed rocket-infantry guards on the west
      and south faces of the enemy yard at (80,20). Destroy the yard,
      losing at most two units, within about 62 turns.
    overrides:
      actors:
        # Strike force: 5 medium tanks staged on the NORTH flank
        # (y=12) — the "hidden ambush" corridor left open by the
        # arena design. Once the bait pulls the SOUTH arc off post,
        # the column swings in above the WEST/SOUTH cover and
        # reaches the yard taking minimal anti-tank fire. A head-on
        # y=20 stage would drive straight into the un-baited WEST arc.
        - {type: 2tnk, owner: agent, position: [6, 12], stance: 1, count: 5}
        - {type: jeep, owner: agent, position: [6, 28], stance: 1}
        - {type: fact, owner: enemy, position: [80, 20]}
        # 5 guards on the WEST + SOUTH faces. A deep-south jeep bait
        # (driven past the (60,30) cover rock) pulls the SOUTH arc
        # (76,24), (80,24), (84,24) off post; the strike focus-fires
        # the WEST arc (76,18), (76,20) and the displaced remainder.
        - {type: e3, owner: enemy, position: [76, 18], stance: 2}
        - {type: e3, owner: enemy, position: [76, 20], stance: 2}
        - {type: e3, owner: enemy, position: [76, 24], stance: 2}
        - {type: e3, owner: enemy, position: [80, 24], stance: 2}
        - {type: e3, owner: enemy, position: [84, 24], stance: 2}
        - {type: fact, owner: enemy, position: [108, 4]}
    win_condition:
      all_of:
        - {enemy_key_buildings_destroyed: {types: [fact]}}
        - {within_ticks: 3600}
        - {units_lost_lte: 2}
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {units_lost_lte: 2}}
        - {not: {own_units_gte: 1}}
    max_turns: 62

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 more controlled variable on top of medium: TWO spawn_point
  # groups round-robin the agent's staging DISTANCE from the yard —
  # spawn 0 stages at the far west (x=6), spawn 1 stages well forward
  # (x=18). The bait/strike geometry is identical (same 5-guard L
  # cover, same north-flank y=12 stage, same fact at 80,20), but the
  # strike's run-in distance and the timing of the bait pull vary per
  # seed, so a memorised fixed-tick opening cannot generalise — the
  # agent must read its actual staging position. The spawn axis is
  # the staging distance, not latitude (a north/south staging split
  # collapses to a knife-edge under the engine move-fire fixes — the
  # closer guard arc engages the column before the bait can pull it).
  # Same 5-guard L cover, 5-tank strike, and loss cap 2 as medium.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # The same dense 5-guard L-cover of the enemy construction yard
    # (`fact` at 80,20) as the previous tier, but your force stages
    # from a seed-chosen distance — either the far west or well
    # forward — so a memorised fixed opening cannot generalise; read
    # your tanks' actual position from the observation. You command 5
    # medium tanks staged on the NORTH flank plus the bait jeep, but
    # may spend at most 2 units (the jeep + at most one tank) —
    # losing a second tank fails. Commit the fast jeep on a deep
    # south flank vector to pull the south arc of guards off post;
    # while that arc is displaced, swing the strike tanks around the
    # now-vacated NORTH flank and onto the yard before tick 3600.
    # Brute frontal trades armour and fails; bait-only never razes
    # the yard; stalling loses the clock.
    description: >
      Same task as medium, but your force stages from a seed-chosen
      distance (far west or well forward). Destroy the enemy yard,
      losing at most two units, within about 62 turns.
    overrides:
      actors:
        # spawn_point 0 — FAR-WEST staging (x=6): the strike has the
        # full run-in to the yard; the bait has time to pull the
        # south arc well off post before the column arrives. Staged
        # on the NORTH flank (y=12) so the column swings in above
        # the cover, as in medium.
        - {type: 2tnk, owner: agent, position: [6, 12], stance: 1, count: 5,
           spawn_point: 0}
        - {type: jeep, owner: agent, position: [6, 28], stance: 1,
           spawn_point: 0}
        # spawn_point 1 — FORWARD staging (x=18): the strike is much
        # closer to the yard, so the bait pull and the strike commit
        # are tighter together — the same north-flank idiom on a
        # compressed clock.
        - {type: 2tnk, owner: agent, position: [18, 12], stance: 1, count: 5,
           spawn_point: 1}
        - {type: jeep, owner: agent, position: [18, 28], stance: 1,
           spawn_point: 1}
        # The OBJECTIVE.
        - {type: fact, owner: enemy, position: [80, 20]}
        # 5 guards on the WEST + SOUTH faces (the medium L-cover).
        # Enemy actors are not spawn_point filtered (per CLAUDE.md)
        # so the cluster always places; the seed varies the agent's
        # staging distance.
        - {type: e3, owner: enemy, position: [76, 18], stance: 2}
        - {type: e3, owner: enemy, position: [76, 20], stance: 2}
        - {type: e3, owner: enemy, position: [76, 24], stance: 2}
        - {type: e3, owner: enemy, position: [80, 24], stance: 2}
        - {type: e3, owner: enemy, position: [84, 24], stance: 2}
        - {type: fact, owner: enemy, position: [108, 4]}
    win_condition:
      all_of:
        - {enemy_key_buildings_destroyed: {types: [fact]}}
        - {within_ticks: 3600}
        - {units_lost_lte: 2}
    fail_condition:
      any_of:
        - {after_ticks: 3601}
        - {not: {units_lost_lte: 2}}
        - {not: {own_units_gte: 1}}
    max_turns: 62
