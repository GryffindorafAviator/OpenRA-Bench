# econ-contention-with-enemy — contested central ore patch with enemy
#
# REASONING capability — shared resource contention. The agent and the
# enemy both lay claim to a mid-map ore patch. The bench-binding
# decision is the COMMON-POOL TRADEOFF: pure mining (no defense) lets
# the enemy `raider` bot pick off the agent's harvesters at the
# contested patch; pure defending (no harvest orders) abandons the
# revenue stream; stalling commits to neither and the economy bar
# never bites. The intended COMMITTED-BALANCE play sends the base
# defenders forward to intercept the raider AT the contested patch
# AND keeps the harvesters mining (the engine auto-routes pre-placed
# harvs once a proc exists, so the income loop runs as long as the
# harvs LIVE) — extracting THROUGH the contestation.
#
# Real-world anchors:
#   • SC2 contested expansion / split-mining (third-base dispute) —
#     committing to both mine AND defend instead of one-sided commit.
#   • Common-pool resource (Hardin "tragedy of the commons") — the
#     pasture / fishery is finite, both parties draw from it, and a
#     pure-extract policy that ignores the contender loses access.
#   • Competitive market entry / TAM contention — you and the
#     incumbent both pull from the same total addressable market;
#     pure-extraction without defending the channel loses share.
#   • Fishing common-resource dynamics — a contested patch yields
#     less per boat with more boats present; abandoning the patch
#     means the rival fully captures it.
#
# ENGINE NOTES:
# 1. Pre-placed `harv` actors are auto-routed by world.rs::
#    auto_route_idle_harvesters once their owner owns a `proc` — so
#    the agent's harvs cycle proc↔patch WITHOUT an explicit harvest
#    order. Income is steady AS LONG AS THE HARVS LIVE. The
#    `unit_type_count_gte:{harv,2}` clause is the load-bearing
#    survival predicate — let the raider kill harvs and the run
#    fails by harv count.
# 2. The `raider` ScriptedBehavior (openra-sim/src/scripted_bot.rs)
#    targets the nearest agent `harv` each turn; falls back to
#    nearest combat actor only when no harv is alive. With the
#    defenders pre-placed at BASE (not at the contested patch), the
#    raider has a clear approach lane to the harv at the patch and
#    will pick it off unless the agent actively intervenes.
# 3. Defenders are pre-placed at the agent's base (x≈15), not at
#    the contested patch (x≈22). Base sight (~5 cells) does NOT
#    cover the patch, so a stance:2 (Defend) defender at base will
#    NOT auto-engage a raider attacking the harvs at the patch —
#    the agent must explicitly attack_move / attack_unit them
#    forward to intercept the raider.
# 4. Win predicate compounds (a) cash bar (economy_value_gte —
#    requires the harvs to keep mining), (b) harv survival
#    (unit_type_count_gte:{harv,2} — requires defending), AND
#    (c) units_killed_gte:1 (requires the raider to be killed
#    explicitly — auto-harvest alone does not score). Together
#    these force the COMMITTED-BALANCE play: defenders must be
#    sent to intercept the raider AT or near the patch, AND the
#    harvs must keep running their (auto-routed) loop.
# 5. Persistent enemy `fact` far east (92,20) prevents engine
#    auto-`done` on raider squad wipe (would collapse a clean run
#    to DRAW before the economy bar evaluates).
# 6. Hard tier: seed-varied AGENT spawn_point groups (NORTH y=14 /
#    SOUTH y=26) with symmetric defender placement + shared harv-
#    patch geometry. Enemy raider + enemy economy ALWAYS place
#    (enemy actors don't honour spawn_point — CLAUDE.md), so each
#    seed faces the SAME contestation problem from a different
#    base orientation.

meta:
  id: econ-contention-with-enemy
  title: 'Contested Central Ore Patch — Common-Pool Resource vs Enemy Raider'
  capability: reasoning
  real_world_meaning: >
    Common-pool resource contention with an active rival. A shared
    ore patch sits in the middle of the map; the enemy fields its
    own harvesters AND a worker-priority raider bot that drives
    specifically at your harvesters. Pure extraction (mine only,
    don't defend) lets the raider pick off your harvs at the
    contested patch; pure defense (engage the raider, but stop
    mining) abandons the revenue stream; stalling commits to neither
    and the economy clock bites. The intended committed-balance play
    sends the defenders forward to intercept the raider AT the
    patch AND lets the harvs keep mining (the engine auto-routes
    pre-placed harvs as long as a refinery exists) — extracting
    THROUGH the contestation.
  robotics_analogue: >
    Multi-agent extraction from a shared resource zone with an
    actively-hostile rival fleet. The harvesters keep visiting the
    contested deposit; the defender fleet must intercept the
    rival's worker-priority raiders BEFORE they reach the
    collectors, without leaving the patch unmanned. Abandoning
    either function — extraction or interception — loses the day
    to a one-sided commit.
  benchmark_anchor:
    - "SC2 contested mining / split-base play"
    - "game theory common-pool resource (Hardin tragedy of commons)"
    - "competitive market entry / TAM contention"
    - "fishing common-resource dynamics"
  author: openra-bench

# MAP — per-scenario bespoke arena (replaces 128x40 rush-hour-arena).
# The contested-patch interception happens at x≈20-22, but the raider's
# long approach distance from the east IS the test point — it sets the
# lead time the agent has to pivot defenders forward before the harv
# dies. Hard tier raiders stage at x=90 (~75 cells from harv at x=14),
# so the arena must accommodate that approach. Enemy economy at x=70..78
# is the visible common-pool framing. Width 96 trims the empty buffer
# past x=92 (sentinel) while preserving every load-bearing distance
# (base→patch, raider→harv approach, enemy economy lookout).
# Cordon 2 ⇒ playable (2..92, 2..36).
base_map:
  generator: arena
  name: econ-contention-with-enemy-96x40
  width: 96
  height: 40
  cordon: 2
  title: Econ Contention With Enemy Arena 96x40
starting_cash: 500

base:
  agent: {faction: allies, cash: 500}
  enemy: {faction: soviet, cash: 0, bot_type: raider}
  tools: [observe, build, place_building, harvest, move_units, attack_unit, attack_move, stop]
  planning: true
  termination: {max_ticks: 7000}
  actors: []  # every level supplies its own actor list via overrides.

levels:
  # ── EASY ─────────────────────────────────────────────────────────
  # Bare skill: ONE 3tnk raider drives at the harvs from the east.
  # 2× 2tnk defenders pre-placed at BASE (x=15) on stance:2 — they
  # auto-fire on anything in weapon range but base sight doesn't
  # reach the contested patch at x=22, so the agent MUST attack-
  # move them forward to intercept the raider. Auto-harvest gives
  # the economy loop for free as long as the harvs LIVE.
  easy:
    description: >
      Commander, this is a contested-economy drill. Your Construction
      Yard (fact), Ore Refinery (proc) and two harvesters (harv, unarmed
      ore trucks) sit at the west base, with two medium tanks (2tnk) on
      garrison. A shared ore patch lies just east at x=22; an enemy heavy
      tank (3tnk) is approaching from mid-map and targeting your
      harvesters. Your tanks are too far back to see the patch from
      garrison. Within about 50 turns, drive the defenders forward to
      intercept the raider at the patch while the harvesters keep mining
      (they auto-route once a refinery exists). Win requires economy
      value 1500, at least one kill, and both harvesters still alive.
    overrides:
      actors:
        # Agent base — fact + proc + 2 harvs at the WEST edge.
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: harv, owner: agent, position: [14, 18]}
        - {type: harv, owner: agent, position: [14, 20]}
        # Defenders at the BASE, not at the patch. stance:2 — they
        # auto-fire if a foe walks into base sight, but base sight
        # is ~5 cells so they cannot see the raider's approach to
        # the patch at x=22 (raider engagement around x=20..22).
        # The agent must attack_move them forward.
        - {type: 2tnk, owner: agent, position: [6, 19], stance: 2}
        - {type: 2tnk, owner: agent, position: [6, 21], stance: 2}
        # Shared central ore patch.
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 20]}
        # Enemy economy — flavor; the agent SEES rival harvs at the
        # east of the contested zone (the "common-pool" framing).
        - {type: proc, owner: enemy, position: [80, 20]}
        - {type: harv, owner: enemy, position: [76, 18]}
        - {type: harv, owner: enemy, position: [76, 22]}
        # ONE raider heavy tank approaches from mid-map. With no
        # ringed defenders at the patch, the raider WILL reach the
        # harvs unless intercepted.
        - {type: '3tnk', owner: enemy, position: [40, 20]}
        # Persistent enemy marker — engine auto-done mitigation.
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {economy_value_gte: 1500}
        - {unit_type_count_gte: {type: harv, n: 2}}
        - {units_killed_gte: 1}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
    max_turns: 51

  # ── MEDIUM ───────────────────────────────────────────────────────
  # +1 controlled variable: TWO raider tanks attacking on two y-vectors,
  # tighter EV bar (2200). The defender pair must protect BOTH y-vectors
  # so an undirected single-axis push leaves one harv exposed. Also
  # bumps required kills to 2 (one per raider).
  medium:
    description: >
      Commander, this is a contested-economy drill with two raiders.
      Your Construction Yard (fact), Ore Refinery (proc) and two
      harvesters (harv, unarmed ore trucks) sit at the west base, with
      three heavy tanks (3tnk) on garrison. A shared ore patch lies just
      east at x=22; two enemy heavy tanks are approaching from the east
      on two separate latitudes (y=18 and y=22), each targeting your
      harvesters. Your garrison cannot see the patch from base. Within
      about 50 turns, drive the defenders forward to intercept both
      raiders while the harvesters auto-mine. Win requires economy value
      2200, at least two kills, and both harvesters still alive.
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: harv, owner: agent, position: [14, 18]}
        - {type: harv, owner: agent, position: [14, 20]}
        # MEDIUM gets THREE heavy defenders (3tnk) placed at the
        # WEST edge (x=9), out of weapon range of any raider that
        # approaches the harv lane at x=20..22. The agent must
        # explicitly attack-move them forward to intercept.
        - {type: '3tnk', owner: agent, position: [6, 18], stance: 2}
        - {type: '3tnk', owner: agent, position: [6, 20], stance: 2}
        - {type: '3tnk', owner: agent, position: [6, 22], stance: 2}
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 20]}
        - {type: proc, owner: enemy, position: [80, 20]}
        - {type: harv, owner: enemy, position: [76, 18]}
        - {type: harv, owner: enemy, position: [76, 22]}
        # TWO raiders on TWO y-vectors, staged at x=70 to give the
        # defender trio time to intercept on both latitudes.
        - {type: '3tnk', owner: enemy, position: [70, 18]}
        - {type: '3tnk', owner: enemy, position: [70, 22]}
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {economy_value_gte: 2200}
        - {unit_type_count_gte: {type: harv, n: 2}}
        - {units_killed_gte: 2}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
    max_turns: 51

  # ── HARD ─────────────────────────────────────────────────────────
  # +1 axis vs medium: TWO seed-driven AGENT spawn_point groups
  # (NORTH y=14 vs SOUTH y=26) with symmetric defender + harv geometry.
  # Enemy raiders + enemy economy ALWAYS place; the contestation task
  # is identical per spawn but the base orientation flips.
  hard:
    description: >
      Commander, this is a contested-economy drill with seed-rotated
      base latitude. Your Construction Yard (fact), Ore Refinery (proc),
      two harvesters (harv, unarmed ore trucks) and three heavy-tank
      (3tnk) defenders all stage at either the NORTH (y=14) or SOUTH
      (y=26) latitude — the seed picks. A shared ore patch sits at x=22
      on your base's latitude. Two enemy heavy tanks are approaching
      from the east targeting your harvesters. Within about 50 turns,
      drive the defenders forward to intercept both raiders while the
      harvesters auto-mine. Win requires economy value 2200, at least
      two kills, and both harvesters still alive.
    overrides:
      actors:
        # Spawn 0 — NORTH base. THREE heavy defenders (3tnk).
        - {type: fact, owner: agent, position: [8, 14], spawn_point: 0}
        - {type: proc, owner: agent, position: [12, 14], spawn_point: 0}
        - {type: harv, owner: agent, position: [14, 14], spawn_point: 0}
        - {type: harv, owner: agent, position: [14, 16], spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [6, 13], stance: 2, spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [6, 15], stance: 2, spawn_point: 0}
        - {type: '3tnk', owner: agent, position: [6, 17], stance: 2, spawn_point: 0}
        - {type: mine, owner: neutral, position: [22, 14], spawn_point: 0}
        - {type: mine, owner: neutral, position: [22, 16], spawn_point: 0}
        # Spawn 1 — SOUTH base.
        - {type: fact, owner: agent, position: [8, 26], spawn_point: 1}
        - {type: proc, owner: agent, position: [12, 26], spawn_point: 1}
        - {type: harv, owner: agent, position: [14, 26], spawn_point: 1}
        - {type: harv, owner: agent, position: [14, 24], spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [6, 25], stance: 2, spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [6, 27], stance: 2, spawn_point: 1}
        - {type: '3tnk', owner: agent, position: [6, 23], stance: 2, spawn_point: 1}
        - {type: mine, owner: neutral, position: [22, 26], spawn_point: 1}
        - {type: mine, owner: neutral, position: [22, 24], spawn_point: 1}
        # Enemy economy — always placed (enemy actors don't honour
        # spawn_point); flavor visible east of the contested zone.
        - {type: proc, owner: enemy, position: [80, 20]}
        - {type: harv, owner: enemy, position: [76, 16]}
        - {type: harv, owner: enemy, position: [76, 20]}
        - {type: harv, owner: enemy, position: [76, 24]}
        # TWO raiders staged FAR east (x=90) — long enough lead
        # time that the on-latitude defenders can pivot and
        # intercept on whichever latitude the seed picks for the
        # base spawn. The raider bot targets nearest harv on each
        # tick — the on-latitude raider goes for the on-latitude
        # harvs first; the off-latitude one tracks across the
        # longer diagonal.
        - {type: '3tnk', owner: enemy, position: [90, 14]}
        - {type: '3tnk', owner: enemy, position: [90, 26]}
        - {type: fact, owner: enemy, position: [92, 20]}
    win_condition:
      all_of:
        - {economy_value_gte: 2200}
        - {unit_type_count_gte: {type: harv, n: 2}}
        - {units_killed_gte: 2}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {unit_type_count_gte: {type: harv, n: 1}}}
    max_turns: 51
