# def-while-building — Defend AND Build Concurrently Under Active Attack
#
# REASONING focus: CONCURRENT defence + construction. While a heavy
# enemy rush is already pressuring the base, the agent must
# SIMULTANEOUSLY (a) queue new defensive PILLBOXES (pbox) AND (b)
# command the pre-placed tank defenders (HoldFire — they do NOT
# auto-engage) to attack the incoming units. Pausing construction
# to fully micro the defence loses the production race — the pbox
# bar is never met before the deadline. Pausing defence to focus
# on building loses the fact — the HoldFire tanks sit idle, the
# rush walks past them and razes the construction yard before the
# pbox cluster comes online. Only a play that PARALLELISES the
# two streams (queue pbox + dispatch tanks every turn from t=0)
# wins inside the budget.
#
# Real-world anchor:
#   • SRE simultaneous incident-response + capacity-add — the on-call
#     engineer must contain the live incident (defence) WHILE
#     provisioning additional capacity (construction); pausing one
#     to handle the other extends MTTR past the SLA window.
#   • Military business continuity during contact — combat engineers
#     emplace new fortifications under direct fire while the line
#     units engage; halting either stream collapses the position.
#   • Ops triage during incident — multiple work streams must
#     advance in parallel; serialising them busts the deadline.
#
# Discrimination (four-script bar — scripted, no model needed):
#   The rush carries TWO heavy tanks (3tnk, armoured). The pillbox
#   the agent builds is an ANTI-INFANTRY defence (M60mg) and cannot
#   kill a 3tnk in time — only the agent's pre-placed medium tanks
#   (2tnk, anti-armour TurretGun) can. This makes the "command the
#   defenders" stream structurally load-bearing: no amount of pbox
#   stops the heavy tanks.
#   • stall (observe-only): builds nothing, never moves the tanks.
#     The HoldFire 2tnk do NOT auto-engage; the rush reaches the
#     fact and razes it ⇒ `not building_count_gte:fact:1` fail
#     fires → LOSS.
#   • build-only (queue pbox, NEVER command the tanks): tanks sit
#     idle on stance:0 (HoldFire); the pillbox cluster mops the
#     rush's e1 infantry but CANNOT kill the two armoured 3tnk,
#     which raze the fact un-countered → LOSS via fact-alive fail
#     clause. (Staging distance no longer matters — the armour is
#     un-counterable by the pbox at any range, so the
#     discrimination is structural, not a knife-edge timing race.)
#   • defend-only (attack_unit the tanks on the rush every turn,
#     NEVER build): the commanded tanks kill the heavy armour and
#     hold the fact, but `building_count_gte:{pbox,3}` is never
#     satisfied ⇒ `within_ticks` unmet ⇒ `after_ticks` fires →
#     LOSS.
#   • intended CONCURRENT (queue pbox AND attack_unit tanks every
#     turn from t=0): commanded tanks kill the heavy armour while
#     the pbox cluster comes online to mop the infantry; pbox
#     count + fact-alive + kill bar all satisfied before the
#     deadline → WIN.
#
# Why the spec works (engine combat sheet, per CLAUDE.md):
#   • `pbox` (pillbox, anti-infantry base defence) costs 400cr; the
#     Defense queue is SEPARATE from Infantry / Vehicle queues so
#     parallel queueing is supported (engine: separate prod-queue
#     per kind; `build('pbox')` tolerates a backlog).
#   • `pbox` prereq is `tent` (which itself needs `powr`). Pre-
#     placing fact + powr + tent + proc keeps the Defense queue
#     hot from turn 1 — the model only needs to call
#     `build('pbox')` + `place_building` chains.
#   • `2tnk` (medium tank, anti-armour TurretGun) is the agent's
#     defender — and the ONLY counter to the rush's heavy tanks.
#     stance:0 means the tank will NOT return fire when shot —
#     only an explicit `attack_unit` / `attack_move` order makes
#     it engage. This is what makes the "command the defenders"
#     half of the concurrent test load-bearing: a model that only
#     builds and never issues a tank command sees idle 2tnk while
#     the un-counterable heavy tanks raze the fact.
#   • The rush band (2× 3tnk + 3× e1 on easy; 2× 3tnk + 6× e1 on
#     medium; 2× 3tnk + 5× e1 on hard) charges the agent fact on
#     stance:3 (AttackAnything). The two `3tnk` (Soviet heavy
#     tank, hp450, armoured) are the load-bearing element: the
#     anti-infantry pillbox cannot kill them, so only a commanded
#     2tnk line stops them. The e1 component is what the pillbox
#     cluster mops up, keeping the BUILD stream load-bearing on
#     the WIN path and supplying the kill floor.
#   • `building_count_gte:{type:fact,n:1}` is the PRESENT-TENSE
#     fact-alive check (NOT `has_building:fact`, which is a one-
#     shot ever-seen set that stays true after the fact is razed —
#     documented CLAUDE.md footgun).
#   • `after_ticks:5401`/`4501` fail clause is reachable within
#     max_turns 60 (no interrupts ⇒ exactly 90 ticks/step ⇒ max
#     tick = 93+90·59 = 5403); stallers / defend-only hit it and
#     LOSE rather than draw.
#   • A persistent unarmed enemy `fact` at (120,20) keeps the
#     episode alive past full rusher elimination so the win/fail
#     evaluator sees the terminal frame (no DRAW collapse on
#     enemy-wipe auto-done).
#   • Starting cash sized to fund the 3-pbox bar (3×400 = 1200) plus
#     a small operating buffer. Spending on extras beyond pbox can
#     still starve the bar depending on tier (see per-tier comments).

meta:
  id: def-while-building
  title: 'Defend While Building — Concurrent Defence + Construction Under Active Attack'
  capability: reasoning
  real_world_meaning: >
    While the enemy is already attacking your base, you must build
    new pillboxes AND command your pre-placed (HoldFire) tank
    defenders to attack the rush — IN PARALLEL, every turn. The
    tanks will NOT engage on their own; only an explicit
    attack_unit / attack_move order makes them fight. Pausing the
    pillbox queue to micro the tanks loses the production race
    (the pillbox bar is never met before the deadline). Pausing the
    tank defence to focus on building loses the construction yard (the idle
    HoldFire tanks let the rush walk through and raze the
    construction yard). Only a play that streams both — queue
    pillbox AND command tanks every turn from t=0 — wins inside the
    budget. The win predicate makes this load-bearing by
    requiring BOTH the pillbox count bar AND the construction yard-alive bar AND
    a kill floor, all before a tight deadline.
  robotics_analogue: >
    SRE simultaneous incident-response + capacity-add: the on-call
    must contain the live incident (defence) WHILE provisioning
    additional capacity (construction) to absorb the increased
    load; serialising the two — pause provisioning to fight the
    fire, then provision after — busts the MTTR / capacity-SLA
    window. Same pattern in military business-continuity (combat
    engineers emplace fortifications under direct fire while line
    units engage), ops triage during incident (multiple work
    streams must advance in parallel), and disaster-recovery
    failover (route traffic to the spare WHILE rebuilding the
    primary).
  benchmark_anchor:
    - "SRE simultaneous incident-response"
    - "business continuity"
    - "ops triage during incident"
  author: "openra-bench"

# Tailored 72×40 defense arena — shrunk from rush-hour-arena 128×40
# per F3 §25 / F1 §10 map-resize rule. The decision-relevant geometry
# (fact + base + HoldFire tank line + rush staging at x≈45-60) is
# preserved 1:1; the 60+ cells of empty east traversal east of the
# rush spawn cell are eliminated. The anti-DRAW enemy marker moves
# from (120,20) to (65,20) (still off the rush axis so the rusher
# bot keeps targeting the agent centroid).
base_map:
  generator: arena
  name: def-while-building-arena
  width: 72
  height: 40
  cordon: 2
  title: Defend While Building 72x40

base:
  agent: {faction: allies}
  enemy: {faction: soviet, bot_type: rusher}
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - stop
  planning: true
  # No interrupts — the concurrent-streams decision is a STATIC
  # up-front commitment (queue pbox + command tanks every turn);
  # the threat axis is known a priori (the rusher always charges
  # the agent fact). Disabling interrupts also keeps the tick
  # budget deterministic (exactly 90 ticks/step ⇒ max_turns is a
  # hard tick budget that the `after_ticks` fail clause reliably
  # bites in).
  interrupts: {}
  termination:
    max_ticks: 12000
  actors: []   # every level supplies its own actor list via overrides.

levels:
  # ── EASY ── bare CONCURRENT-STREAMS skill: rush (6× e1 + 2× e3
  # staged CLOSE at x=45) AND budget for exactly 3 pbox (1800cr,
  # no slack). Both streams must advance from t=0: building 3
  # pbox alone (~9-12 turns serial) consumes most of the budget
  # but the close-staged rush hits the fact in ~4 turns, so the
  # HoldFire tanks MUST be commanded to attack the rush from t=0
  # to delay it long enough for the pbox cluster to fire. Without
  # commands the tanks stay idle (stance:0) and build-only loses
  # the fact; without pbox the count bar fails. max_turns 60 ⇒
  # reachable tick 93+90·59 = 5403; deadline 5400.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # An enemy rush (6 rifle infantry + 2 rocket soldiers) is already
    # attacking your base at (10,20) — staged close, it reaches the
    # construction yard in ~4 turns. Your construction yard (fact),
    # refinery (proc), barracks (tent), and power (powr) are pre-placed,
    # along with 3 medium tanks (2tnk) on HOLDFIRE — they will NOT engage
    # on their own; only an explicit attack_unit/attack_move order makes
    # them fight. Build 3 pillboxes (pbox, 400cr each — budget 1800
    # funds 3 pbox at 1200cr + 600 residual)
    # CONCURRENTLY while commanding the 3 tanks to attack the rush.
    # Killing 3 enemy units, building 3 pbox, AND keeping the fact alive —
    # all before tick 5400 — wins. A serial 3-pbox build takes ~9-12
    # turns, far slower than the rush; build-only (never commanding the
    # tanks) loses the fact before the pbox cluster fires. Pausing
    # construction to fully micro the tanks busts the pbox bar. Only a
    # play that streams BOTH every turn — commanded tanks buying time
    # while the pbox cluster assembles — wins.
    description: >
      An enemy rush — three riflemen and two heavy tanks — is already
      closing on your base at (10,20); the column is staged at x=45 and
      reaches the yard in about four turns. Your base — yard, refinery,
      barracks, power plant, four medium tanks at (14, 18-22) — is in
      place; the medium tanks stand on HOLD-FIRE orders (they will not
      engage on their own, even when shot at). $1800 covers exactly three
      pillboxes (anti-infantry stationary turret, 600cr each — pillboxes
      barely scratch heavy tanks). Four kills, three pillboxes built,
      yard intact, within about 60 turns.
    starting_cash: 1800
    overrides:
      actors:
        # Pre-placed agent base — fact at (10,20); tent/powr/proc
        # WEST of the fact (behind it, off the rush lane); proc
        # gives a trickle of income; tent is the Defense-queue
        # prereq for pbox.
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: tent, owner: agent, position: [6,  18]}
        - {type: powr, owner: agent, position: [6,  22]}
        - {type: proc, owner: agent, position: [4,  20]}
        # 4 pre-placed 2tnk defenders flanking the fact at x=14
        # (between fact and rush). stance:0 = HOLDFIRE; they do
        # NOT auto-engage even when shot at. The agent MUST issue
        # an attack_unit (or attack_move) to make them fight —
        # otherwise they sit idle while the rush walks past.
        # The medium 2tnk (anti-armour TurretGun) are the ONLY
        # thing that can stop the rush's heavy tanks: the pillbox's
        # anti-infantry M60mg barely scratches a 3tnk.
        - {type: 2tnk, owner: agent, position: [14, 18], stance: 0}
        - {type: 2tnk, owner: agent, position: [14, 19], stance: 0}
        - {type: 2tnk, owner: agent, position: [14, 21], stance: 0}
        - {type: 2tnk, owner: agent, position: [14, 22], stance: 0}
        # Rush band — 2× 3tnk (Soviet HEAVY tank, hp450, armoured)
        # + 3× e1 rifle infantry on stance:3 (AttackAnything),
        # charging the agent fact down the y=20 lane. The 2 heavy
        # tanks are the load-bearing element: the pillbox the agent
        # builds is an ANTI-INFANTRY defence (M60mg, Versus armour
        # ≪ Versus infantry) and CANNOT kill a 3tnk in time — only
        # the agent's pre-placed 2tnk (anti-armour TurretGun) can.
        # So a BUILD-ONLY play (queue pbox, never command the
        # HoldFire tanks) watches its idle 2tnk stand by while the
        # un-counterable heavy tanks raze the fact; the pillbox
        # cluster mops the e1 but never the armour. The 3 e1 give
        # the kill-floor and keep the pillbox load-bearing on the
        # WIN path. Staged off the (50,20) silently-failing column
        # (CLAUDE.md footgun).
        - {type: 3tnk, owner: enemy, position: [45, 19], stance: 3}
        - {type: 3tnk, owner: enemy, position: [45, 21], stance: 3}
        - {type: e1, owner: enemy, position: [47, 20], stance: 3, count: 3}
        # Anti-DRAW marker: unarmed high-HP enemy fact at the far
        # east keeps the episode alive past full rusher
        # elimination so the win/fail check fires (engine
        # auto-done on enemy-wipe otherwise collapses to DRAW).
        - {type: fact, owner: enemy, position: [65, 20]}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 3}}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_killed_gte: 4}
        - {within_ticks: 5400}
    fail_condition:
      any_of:
        - {after_ticks: 5401}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60

  # ── MEDIUM ── +1 axis: HEAVIER rush (2× 3tnk + 6× e1, double
  # the easy infantry) AND tighter clock (within_ticks 4500 vs
  # easy's 5400). Same base; same 3-pbox bar (1800cr, no
  # slack — model that spends on extras starves the bar). The
  # heavier band means the commanded tanks need to grind the two
  # heavy 3tnk down WHILE the pillbox cluster assembles to mop the
  # six e1; the tighter clock means a build-only play that ignores
  # tank dispatch lets the un-counterable heavy tanks raze the
  # fact before the pillbox cluster matters. max_turns 60 ⇒
  # reachable tick 5403; deadline 4500.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # The full rush band — 2 heavy tanks + 6 rifle infantry — is already
    # attacking your base at (10,20). Your fact, proc, powr, tent, and 4
    # medium tanks (2tnk) on HOLDFIRE are pre-placed. Build 3 pillboxes
    # (1800cr — 3 pbox at 400 each = 1200, 600 residual) CONCURRENTLY
    # while commanding the
    # tanks to attack the rush. Kill ≥7 enemy units, build 3 pbox, AND
    # keep the fact alive — all before tick 4500. The pillbox is an ANTI-
    # INFANTRY defence and cannot kill the heavy tanks — only your medium
    # tanks can; so build-only (idle HoldFire tanks) loses the fact to the
    # un-counterable armour, while defend-only (tanks commanded, no pbox)
    # never satisfies the pillbox count bar. Only concurrent streaming —
    # commanded tanks killing the armour while the pbox cluster assembles
    # to mop the infantry — wins.
    description: >
      An enemy rush — six riflemen and two heavy tanks — is attacking
      your base at (10,20); the column is staged at x=45 and the
      composition is heavier than easy. Your base — yard, refinery,
      barracks, power plant, four medium tanks at (14, 18-22) on HOLD-
      FIRE — is in place. $1800 covers exactly three pillboxes
      (anti-infantry, 600cr each — pillboxes barely scratch heavy
      tanks). Seven kills, three pillboxes built, yard intact, within
      about 50 turns.
    starting_cash: 1800
    overrides:
      actors:
        - {type: fact, owner: agent, position: [10, 20]}
        - {type: tent, owner: agent, position: [6,  18]}
        - {type: powr, owner: agent, position: [6,  22]}
        - {type: proc, owner: agent, position: [4,  20]}
        - {type: 2tnk, owner: agent, position: [14, 18], stance: 0}
        - {type: 2tnk, owner: agent, position: [14, 19], stance: 0}
        - {type: 2tnk, owner: agent, position: [14, 21], stance: 0}
        - {type: 2tnk, owner: agent, position: [14, 22], stance: 0}
        # Heavy rush: 2× 3tnk (Soviet heavy tank, armoured) + 6× e1
        # at mid-map (x=45, y=20). Heavier than easy (double the
        # infantry). The 2 heavy tanks are un-counterable by the
        # anti-infantry pillbox, so a build-only play loses the
        # fact to the armour; a defend-only play (tanks commanded,
        # no pbox) never satisfies the pillbox count bar. Only
        # concurrent streaming keeps the fact alive AND meets the
        # bar.
        - {type: 3tnk, owner: enemy, position: [45, 19], stance: 3}
        - {type: 3tnk, owner: enemy, position: [45, 21], stance: 3}
        - {type: e1, owner: enemy, position: [47, 20], stance: 3, count: 6}
        - {type: fact, owner: enemy, position: [65, 20]}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 3}}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_killed_gte: 7}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60

  # ── HARD ── +1 axis: TWO seed-driven agent spawn_point groups
  # so the base (fact/tent/powr/proc/defenders) flips between
  # NORTH (y=14) and SOUTH (y=26) per seed. Enemies don't honour
  # spawn_point (engine: oramap.rs::expand_scenario_actors per
  # CLAUDE.md) so a single rush band is staged on the SYMMETRY
  # axis (y=20); the rusher bot concentrates on the agent
  # centroid, so the band converges on whichever latitude this
  # seed spawned. The agent must READ its fact's latitude from
  # observation and place pboxes NEAR the active fact AND command
  # its medium tanks onto the heavy-tank rush. A memorised "build
  # at (10,20)" plan misses the active cluster region.
  # max_turns 60 ⇒ reachable tick 5403; deadline 4500.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # The agent construction yard (fact) and its 4 HoldFire tank defenders
    # flip between NORTH (y=14) and SOUTH (y=26) per seed; the pbox
    # cluster must follow. A heavy rush (2 heavy tanks + 5 rifle infantry)
    # converges on the active fact. Build 3 pillboxes (budget 1800cr funds
    # 3 pbox at 400 each = 1200, 600 residual) CONCURRENTLY while
    # commanding the tanks to attack
    # the rush. Kill ≥5 enemy units, build 3 pbox, AND keep the fact alive
    # — all before tick 4500. The pillbox is an anti-infantry defence and
    # cannot kill the heavy tanks — only your medium tanks can; a
    # memorised "build at (10,20)" plan misses the active cluster region;
    # pausing either stream loses; only concurrent streaming at the
    # correct latitude wins.
    description: >
      Your base — yard, refinery, barracks, power plant, four HOLD-FIRE
      medium tanks — spawns in either the NORTH (y=14) or SOUTH (y=26)
      band by seed. A rush — five riflemen and two heavy tanks — drives
      at the live base (the rush converges on whichever latitude is
      active). $1800 covers exactly three pillboxes. Five kills, three
      pillboxes built, yard intact, within about 50 turns.
    starting_cash: 1800
    overrides:
      actors:
        # spawn_point 0 — NORTH base (y=14). All buildings/units
        # tagged spawn_point:0; same mirrored set for spawn 1.
        - {type: fact, owner: agent, position: [10, 14], spawn_point: 0}
        - {type: tent, owner: agent, position: [6,  12], spawn_point: 0}
        - {type: powr, owner: agent, position: [6,  16], spawn_point: 0}
        - {type: proc, owner: agent, position: [4,  14], spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 12], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 13], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 15], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [14, 16], stance: 0, spawn_point: 0}
        # spawn_point 1 — SOUTH base (y=26, mirror across y=20).
        - {type: fact, owner: agent, position: [10, 26], spawn_point: 1}
        - {type: tent, owner: agent, position: [6,  24], spawn_point: 1}
        - {type: powr, owner: agent, position: [6,  28], spawn_point: 1}
        - {type: proc, owner: agent, position: [4,  26], spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 24], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 25], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 27], stance: 0, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [14, 28], stance: 0, spawn_point: 1}
        # Enemies don't honour spawn_point (CLAUDE.md). A single
        # heavy rush band staged at the SYMMETRY-AXIS latitude
        # (y=20): 2× 3tnk (armoured heavy tanks) + 5× e1. The
        # rusher bot concentrates on the agent centroid (the
        # active fact at y=14 OR y=26 per seed), so the band turns
        # toward whichever latitude this seed spawned. The two
        # heavy tanks are un-counterable by the anti-infantry
        # pillbox — only the agent's medium tanks can kill them,
        # so the concurrent-streams discrimination holds from a
        # flipped approach axis per seed.
        - {type: 3tnk, owner: enemy, position: [60, 19], stance: 3}
        - {type: 3tnk, owner: enemy, position: [60, 21], stance: 3}
        - {type: e1, owner: enemy, position: [62, 20], stance: 3, count: 5}
        # Anti-DRAW marker on the symmetry axis.
        - {type: fact, owner: enemy, position: [65, 20]}
    win_condition:
      all_of:
        - {building_count_gte: {type: pbox, n: 3}}
        - {building_count_gte: {type: fact, n: 1}}
        - {units_killed_gte: 5}
        - {within_ticks: 4500}
    fail_condition:
      any_of:
        - {after_ticks: 4501}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 60
