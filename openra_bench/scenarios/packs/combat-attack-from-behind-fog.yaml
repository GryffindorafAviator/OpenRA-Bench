# combat-attack-from-behind-fog — Bypass a defensive line via an
# off-axis fog lane and strike the undefended HQ from behind. A
# frontal attack on the line loses; the fog flank wins.
#
# Wave-8 REASONING seed (capability: reasoning).
#
# Real-world / benchmark anchors:
#   - SC2 "hidden assault" / drop-behind-the-mineral-line doctrine
#     (refuse the prepared frontal trade; route around the defender's
#     vision and weapon envelope and surface inside his soft rear).
#   - Military "surprise attack" doctrine (mass at the point the
#     defender hasn't fortified — concentrate where he isn't, not
#     where he is — Sun Tzu / Liddell Hart indirect approach).
#   - "Fog warfare": the defender's static line cannot fire on what
#     it cannot see and cannot reach. The far latitudes of the map
#     (y=2 / y=37) are well outside the line's range AND outside the
#     line's vision; a strike force that travels via those lanes
#     emerges BEHIND the line, on an undefended axis to the HQ.
#
# Mechanism (engine-load-bearing physics):
#   - The enemy defensive line stands at x=24, vertically spanning
#     the engagement band: a stack of pillboxes (pbox — anti-infantry
#     range ~6) interleaved with rocket-infantry (e3, Dragon launcher,
#     range ~5). The line "faces west": every weapon covers the
#     engagement axis y=18..22 from x≈19..30.
#   - All defenders are stance:2 (Defend — auto-fire in range, no
#     chase) so the line stays POSTED. Tanks that enter range of the
#     y=15..25 latitude band take concentrated focused fire from
#     MULTIPLE pbox+e3 simultaneously and die before clearing.
#   - The agent's 4× 2tnk strike force stages at the WEST edge
#     (x=4, near y=20). The OBJECTIVE is an unarmed enemy fact at
#     (48,20) — behind the line — undefended (no garrison).
#   - The FOG flank lanes: y=2..5 (north edge) and y=35..37 (south
#     edge). A tank at y=3 is Manhattan-distance ≥12+ from the
#     nearest line defender — well outside every defender's range
#     (pbox ~6, e3 Dragon ~5). The line never fires on the flanker.
#     The flanker drives east along y=3 unimpeded, past x=24, then
#     turns south to descend on the fact at (48,20).
#
# Discrimination bar (four script-policy proxies in the test file):
#   • stall (only observe)              → LOSS. The line never
#     advances (stance:2 + no agent in range) so the fact at
#     (48,20) is never approached → after_ticks LOSS.
#   • brute attack_move east (y=20)     → LOSS. Column marches
#     down the engagement axis into the line's kill envelope; the
#     column stalls inside Dragon+pbox range while the fact
#     remains untouched → fact-destruction predicate unmet by
#     deadline.
#   • frontal-charge (move east on y=20 + attack nearest defender)
#                                       → LOSS. Same head-on
#     geometry; engagements pin the tanks AT the line; even if a
#     tank survives, the fact at x=48 is still 24 cells away with
#     turns burned.
#   • intended fog-flank (move strike force to y=3 or y=37, drive
#     east past x=48, descend onto the fact)
#                                       → WIN. Line never fires on
#     the flanker (out of range), fact is unguarded, raze in time.
#
# Engine guardrails (per CLAUDE.md / SCENARIO_REVIEW_CHECKLIST.md):
#   - Map: single shared 64×40 arena (cordon 2 ⇒ playable
#     x in [2..61], y in [2..37]). Strike force at x=4 (west);
#     line at x=24; fact at (48,20). All three tiers share the
#     same arena — per-tier line composition and (on hard)
#     seed-rotated spawn corridors are the varying levers.
#   - Single explicit mpspawn at (4,20) per Wave-13 footgun #6
#     (the default 4-corner mpspawns rotate per seed and offset
#     pre-placed coordinates).
#   - Win predicate uses `enemy_key_buildings_destroyed_in_region`
#     scoped to {x:48,y:20,radius:6,types:[fact]} so a stray kill
#     on the SENTINEL fact (far corner) doesn't satisfy the win.
#     AND `own_units_gte:2` so suicidal frontals (any 1-tank
#     survivor) cannot bypass the survival bar.
#   - SENTINEL: persistent unarmed enemy fact at the FAR corner of
#     the map (61,4) — keeps the engine alive past the moment the
#     objective fact falls so the win evaluator sees the terminal
#     frame (no DRAW collapse on enemy-key-building wipe). The
#     sentinel is well outside any intended-play tank path.
#   - All deadlines fit inside max_turns at the ~64 ticks/turn
#     interrupt-mode rate (verified per test).
#   - Defender stance:2 (Defend = auto-fire in range, no chase) is
#     critical: stance:3 would have the line CHASE the flanker
#     across the map and collapse the discrimination.
#   - The objective fact is UNDEFENDED — no garrison, no shield.
#     This is structural: the doctrine is "strike where the enemy
#     isn't". A defended fact would change the test to a different
#     capability (force concentration vs. surprise attack).

meta:
  id: combat-attack-from-behind-fog
  title: 'Reasoning — Attack from Behind via a Fog-Bypass of the Frontal Line'
  capability: reasoning
  real_world_meaning: >
    Four medium tanks (2tnk) at the west edge face a tight vertical
    wall of pillboxes (pbox) and anti-tank rocket soldiers (e3) at
    x=24, spanning the engagement band and facing west. The objective
    is an UNDEFENDED enemy construction yard (fact) at (48,20) —
    behind the line. Charging head-on along y=18..22 puts the lead
    tank inside the kill envelope of multiple defenders simultaneously
    and the column never clears the line in time to raze the fact.
    The winning play is the FOG FLANK: route the strike force to the
    far north (y=2..5) or far south (y=35..37) — well outside the
    line's range AND vision — drive east past the line's longitude,
    then turn inward to descend on the fact from BEHIND. Same enemy,
    same forces, but the route of approach controls whether the
    line's prepared fields of fire can engage at all.
  robotics_analogue: >
    Spatial-reasoning under prepared defenses: an intelligent
    attacker refuses the defender's chosen geometry (the frontal
    kill envelope) and routes via a corridor outside the defender's
    sensor + weapon coverage to reach an undefended high-value
    target. The decision under test is route planning — recognise
    that a static defensive line is fixed and bypass-able, not
    that it must be reduced face-to-face.
  benchmark_anchor:
    - "SC2 hidden assault"
    - "military surprise attack"
    - "fog warfare"
  author: openra-bench

# Single 64x40 arena shared by all three tiers (audit-tight).
base_map:
  generator: arena
  name: combat-attack-from-behind-fog-arena
  width: 64
  height: 40
  cordon: 2
  spawns: [[4, 20]]
  title: 'Attack-From-Behind-Fog Arena 64x40'

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: ''}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  # React the instant a tank is lost or an enemy is spotted — the
  # fog-flank cycle is reactive (the flanker has to notice if a
  # defender DOES come into range and either keep going or break
  # off). Without these the model only re-targets on the next turn
  # boundary and the route decision doesn't propagate.
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 6000}
  actors: []

levels:
  # ── EASY ────────────────────────────────────────────────────────────
  # Bare fog-flank skill: LIGHT line (3× e3 only, no pbox). Stall
  # LOSES (line is stance:2, never advances; fact never razed).
  # Fog flank cleanly WINS.
  easy:
    description: >
      Commander, this is a flanking strike against an undefended enemy
      Construction Yard. You are given 4 medium tanks on the west edge.
      A thin anti-tank line — 3 rocket infantry — covers the central
      corridor at x=24. Driving head-on through the corridor will burn
      the clock without reaching the yard at (48,20) behind the line.
      A clear NORTH fog lane runs above the central walls; take it,
      swing east past the line's longitude, then turn south to destroy
      the yard. Keep at least 3 tanks alive within about 60 turns.
    overrides:
      actors:
        # STRIKE FORCE — 4 medium tanks at the west edge, stance:1
        # ReturnFire so they only engage when ordered.
        - {type: 2tnk, owner: agent, position: [4, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 21], stance: 1}
        # LIGHT LINE — 3× e3 at x=24, y=19..21 facing west.
        - {type: e3, owner: enemy, position: [24, 19], stance: 2}
        - {type: e3, owner: enemy, position: [24, 20], stance: 2}
        - {type: e3, owner: enemy, position: [24, 21], stance: 2}
        # OBJECTIVE — undefended enemy fact at (48,20).
        - {type: fact, owner: enemy, position: [48, 20]}
        # SENTINEL — far-corner unarmed fact, keeps the engine
        # alive past objective-fact destruction so the win
        # evaluator sees the terminal frame.
        - {type: fact, owner: enemy, position: [60, 4]}
    win_condition:
      all_of:
        - enemy_key_buildings_destroyed_in_region:
            {x: 48, y: 20, radius: 6, types: [fact]}
        - {own_units_gte: 3}
        - {within_ticks: 4000}
    fail_condition:
      any_of:
        - {after_ticks: 4001}
        - {not: {own_units_gte: 3}}
    max_turns: 72

  # ── MEDIUM ──────────────────────────────────────────────────────────
  # 2 pbox bookends + 5 e3 core. Frontal decisively LOSES.
  medium:
    description: >
      Commander, this is a flanking strike against an undefended enemy
      Construction Yard. You are given 4 medium tanks on the west edge.
      A heavy line covers the central corridor at x=24 — 2 pillboxes
      (stationary defensive turrets) flanking 5 rocket infantry. A
      head-on push cooks the column in overlapping kill envelopes.
      Open fog lanes run above (north) and below (south) the central
      walls. Take one of them, drive east past the line's longitude,
      then turn in to destroy the yard at (48,20). Keep at least 3
      tanks alive within about 50 turns.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [4, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [4, 21], stance: 1}
        # HEAVY LINE at x=24, y=15..25 — pbox bookends + 5× e3 core.
        - {type: pbox, owner: enemy, position: [24, 15]}
        - {type: e3,   owner: enemy, position: [24, 17], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 19], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 20], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 21], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 23], stance: 2}
        - {type: pbox, owner: enemy, position: [24, 25]}
        # OBJECTIVE — undefended enemy fact at (48,20).
        - {type: fact, owner: enemy, position: [48, 20]}
        # SENTINEL — far-corner unarmed fact.
        - {type: fact, owner: enemy, position: [60, 4]}
    win_condition:
      all_of:
        - enemy_key_buildings_destroyed_in_region:
            {x: 48, y: 20, radius: 6, types: [fact]}
        - {own_units_gte: 3}
        - {within_ticks: 3500}
    fail_condition:
      any_of:
        - {after_ticks: 3501}
        - {not: {own_units_gte: 3}}
    max_turns: 60

  # ── HARD ────────────────────────────────────────────────────────────
  # 3 pbox + 8 e3 dense wall y=15..25. Agent stages NORTH (y=14..17)
  # or SOUTH (y=23..26) per seed (spawn_point round-robin). Symmetric
  # across y=20 so either spawn faces an equivalent fog-flank decision.
  hard:
    description: >
      Commander, this is a flanking strike against an undefended enemy
      Construction Yard. You are given 4 medium tanks staged in either
      the north corridor (y=14..17) or the south corridor (y=23..26)
      depending on seed. A dense wall — 3 pillboxes interleaved with
      8 rocket infantry — covers the central corridor at x=24. A
      head-on charge dies in the crossfire. Loop wide via your nearest
      fog lane (north y=2..5 if you staged north, south y=35..37 if
      you staged south), drive east past the line, then turn in to
      destroy the enemy yard at (48,20). Keep at least 3 tanks alive
      within about 50 turns.
    overrides:
      actors:
        # spawn_point 0 — NORTH staging corridor (y=14..17). Fog
        # flank latitude from this spawn is y=2..5 (north edge).
        - {type: 2tnk, owner: agent, position: [4, 14], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 15], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 16], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [4, 17], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH staging corridor (y=23..26). Fog
        # flank latitude from this spawn is y=35..37 (south edge).
        - {type: 2tnk, owner: agent, position: [4, 23], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 24], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 25], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [4, 26], stance: 1, spawn_point: 1}
        # DENSE LINE at x=24, y=15..25 — 3× pbox + 8× e3.
        - {type: pbox, owner: enemy, position: [24, 15]}
        - {type: e3,   owner: enemy, position: [24, 16], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 17], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 18], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 19], stance: 2}
        - {type: pbox, owner: enemy, position: [24, 20]}
        - {type: e3,   owner: enemy, position: [24, 21], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 22], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 23], stance: 2}
        - {type: e3,   owner: enemy, position: [24, 24], stance: 2}
        - {type: pbox, owner: enemy, position: [24, 25]}
        # OBJECTIVE — undefended enemy fact at (48,20).
        - {type: fact, owner: enemy, position: [48, 20]}
        # SENTINEL — far-corner unarmed fact.
        - {type: fact, owner: enemy, position: [60, 4]}
    win_condition:
      all_of:
        - enemy_key_buildings_destroyed_in_region:
            {x: 48, y: 20, radius: 6, types: [fact]}
        - {own_units_gte: 3}
        - {within_ticks: 3500}
    fail_condition:
      any_of:
        - {after_ticks: 3501}
        - {not: {own_units_gte: 3}}
    max_turns: 60
