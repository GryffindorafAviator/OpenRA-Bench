meta:
  id: custom-map-no-enemy
  title: 'Pure Navigation — Reach the Goal Zone in a Confined Map (No Enemy)'
  capability: perception
  real_world_meaning: >
    Pure spatial navigation inside a confined custom region with no
    adversary: read the map, plan a route through the bounded playable
    area, and reach the designated zone. Success depends only on
    perceiving the terrain and committing a path — not on combat.
  robotics_analogue: >
    Confined-space autonomous navigation (warehouse aisle, indoor map):
    reach a goal cell within a bounded region from a map read alone.
  author: autonomous-loop

# Custom terrain (NOT rush-hour); singles-maginot has the smallest
# playable region (bounds 2,2,80,32). Everything below is read from
# this YAML — no enemy actors at all.
base_map: singles-maginot
starting_cash: 0

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
  tools:
    - move_units
    - stop
  planning: true
  termination:
    max_ticks: 20000
  actors:
    - type: jeep
      owner: agent
      position:
      - 8
      - 12
    - type: e1
      owner: agent
      position:
      - 9
      - 14
      count: 2

levels:
  easy:
    description: >
      Move your units to the goal zone near (30,16). No enemy on this
      map — success is purely reading the terrain and committing a
      route. Win: a unit reaches the zone within the time limit.
    win_condition:
      all_of:
        - reach_region: {x: 30, y: 16, radius: 6}
        - within_ticks: 12000
    max_turns: 50
  medium:
    description: >
      Same task, harder: the goal zone is farther at (55,18) and the
      clock is tighter. Plan the longer route and go directly. Win: a
      unit reaches the zone in time.
    win_condition:
      all_of:
        - reach_region: {x: 55, y: 18, radius: 5}
        - within_ticks: 10000
    max_turns: 55
  hard:
    description: >
      Whole squad must reach the far corner of the playable bounds
      together within a short deadline, starting from a seed-chosen
      position (two spawn_point groups) so the route can't be replayed
      from memory. (No adversary on this map → no force-loss fail; the
      only failure mode is missing the deadline.)
    overrides:
      actors:
        - {type: jeep, owner: agent, position: [8, 12], spawn_point: 0}
        - {type: e1,   owner: agent, position: [9, 14], count: 2, spawn_point: 0}
        - {type: jeep, owner: agent, position: [8, 28], spawn_point: 1}
        - {type: e1,   owner: agent, position: [9, 26], count: 2, spawn_point: 1}
    win_condition:
      all_of:
        - all_units_in_region: {x: 70, y: 24, radius: 6}
        - within_ticks: 9000
    max_turns: 60
