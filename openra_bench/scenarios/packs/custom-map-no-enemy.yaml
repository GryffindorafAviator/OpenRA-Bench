meta:
  id: custom-map-no-enemy
  title: "Confined-Region Navigation (Custom Map, No Enemy)"
  capability: perception
  real_world_meaning: >
    Pure spatial navigation inside a confined custom region with no
    adversary: read the map, plan a route through the bounded playable
    area, and reach the designated zone. Success depends only on
    perceiving the terrain and committing a path — not on combat.
  robotics_analogue: >
    Confined-space autonomous navigation (warehouse aisle, indoor map):
    reach a goal cell within a bounded region from a map read alone.
  author: autonomous-loop

# Custom terrain (NOT rush-hour); singles-maginot has the smallest
# playable region (bounds 2,2,80,32). Everything below is read from
# this YAML — no enemy actors at all.
base_map: singles-maginot
starting_cash: 0

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
  tools:
    - move_units
    - stop
  planning: true
  termination:
    max_ticks: 20000
  actors:
    - type: jeep
      owner: agent
      position:
      - 8
      - 12
    - type: e1
      owner: agent
      position:
      - 9
      - 14
      count: 2

levels:
  easy:
    description: >
      Reach the goal zone in the near part of the confined region. No
      enemy — only perception + a committed route matters.
    win_condition:
      all_of:
        - reach_region: {x: 30, y: 16, radius: 6}
        - within_ticks: 12000
    max_turns: 50
  medium:
    description: >
      Goal zone is farther across the bounded region; tighter clock.
    win_condition:
      all_of:
        - reach_region: {x: 55, y: 18, radius: 5}
        - within_ticks: 10000
    max_turns: 55
  hard:
    description: >
      Whole squad must reach the far corner of the playable bounds
      together within a short deadline.
    win_condition:
      all_of:
        - all_units_in_region: {x: 70, y: 24, radius: 6}
        - within_ticks: 9000
    max_turns: 60
