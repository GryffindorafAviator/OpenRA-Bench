meta:
  id: economy-harvest-timebox
  title: "Harvest Economy — Time-Boxed"
  capability: reasoning
  real_world_meaning: >
    Within a fixed time budget, earn as much economic value as possible
    by running and growing a harvesting operation, then keep the
    harvesters productive — the decision is committing to harvest
    promptly and expanding capacity rather than idling.
  robotics_analogue: >
    Autonomous resource-collection under a mission clock: maximize
    yield by dispatching and scaling collectors instead of dithering.
  author: catalog-c13

base_map: rush-hour-arena
starting_cash: 200

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
  tools:
    - harvest
    - move_units
    - build
    - stop
  planning: true
  termination:
    max_ticks: 40000
  actors:
    - type: proc
      owner: agent
      position:
      - 12
      - 18
    - type: harv
      owner: agent
      position:
      - 14
      - 18
    - type: mine
      owner: neutral
      position:
      - 22
      - 18
    - type: jeep
      owner: agent
      position:
      - 8
      - 16

levels:
  easy:
    description: >
      Loose clock — just start harvesting promptly; idling fails the
      economy-value target.
    win_condition:
      all_of:
        - economy_value_gte: 1000
        - within_ticks: 7000
    max_turns: 60
  medium:
    description: >
      Tighter clock and a higher target — the harvester must stay
      productive (not lost / not idle).
    win_condition:
      all_of:
        - economy_value_gte: 2500
        - harvesters_gte: 1
        - within_ticks: 6000
    max_turns: 60
  hard:
    description: >
      High target, short clock — a single harvester cannot reach it;
      must expand harvesting capacity.
    win_condition:
      all_of:
        - economy_value_gte: 3500
        - harvesters_gte: 2
        - within_ticks: 5000
    max_turns: 70
