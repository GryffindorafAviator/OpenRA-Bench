meta:
  id: economy-harvest-timebox
  title: 'Harvest Economy — Time-Boxed Greenfield Revenue Ramp'
  capability: reasoning
  real_world_meaning: >
    Time-boxed greenfield revenue ramp from a bootstrapped pipeline: a
    pre-placed harvester + refinery + ore patch is the starter
    operation, and the model must commit to running it (and at higher
    tiers, expanding it: build extra harvesters and feed multiple
    patches) so the cumulative economy value clears a target before a
    hard tick deadline. Idling, spending the budget on non-harvesters,
    or running a single harvester at the higher tiers all miss the bar.
  robotics_analogue: >
    Autonomous warehouse / mining pipeline that must hit a throughput
    target by deadline: route collectors to known sources, return loads
    to the depot, and scale the collector fleet when one collector
    can't meet the rate. The decision is committing to the harvest loop
    and scaling collectors — not building unrelated capability.
  author: autonomous-loop
  benchmark_anchor:
    - SC2LE CollectMineralsAndGas
    - MineRL Diamond resource collection
    - lmgame-Bench resource-streaming
    - greenfield revenue-ramp under deadline

# ENGINE NOTE (verified 2026-05-19, scripted run_level seeds 1-4):
# task #14 wired harvest income end-to-end (a placed `mine` actor seeds
# ore patches around it, harvesters refine into `proc`, and economy_
# value = cash + resources surfaces in signals). Budgets here are tuned
# against the measured income rate (~1.05 ore/tick per active
# harvester/patch pair, harv build cost 1400cr, weap-required) so the
# starting_cash + 1 active pre-placed harvester cannot satisfy the
# medium/hard bars: a 2nd (medium) / 3rd (hard) harvester must be
# built. Stall, "build units instead", and "1 pre-placed harvester
# only" all LOSE on every level and every hard seed.
base_map:
  generator: arena
  name: economy-harvest-timebox-arena
  width: 40
  height: 40
starting_cash: 300

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
  tools:
    - harvest
    - move_units
    - build
    - place_building
    - stop
  planning: true
  termination:
    max_ticks: 40000
  actors:
    - {type: proc, owner: agent, position: [12, 18]}
    - {type: harv, owner: agent, position: [14, 18]}
    - {type: mine, owner: neutral, position: [22, 18]}
    - {type: mine, owner: neutral, position: [22, 22]}

levels:
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Loose clock. A refinery and one harvester are already placed next to
    # two ore patches; just commit to harvesting promptly. The starting
    # cash (300) is well below the bar (1500), so idling cannot satisfy it
    # — only the harvest income closes the gap. The intended scripted
    # harvester wins by ~tick 1350.
    description: >
      Commander, this is a fixed-deadline revenue ramp. You start with
      an Ore Refinery ('proc'), a Construction Yard ('fact'), a War
      Factory ('weap'), and ONE Harvester ('harv'). Two ore patches sit
      east of your base. Your reserve is $1100. Reach economy value
      6500 within about 30 turns.
    starting_cash: 1100
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: powr, owner: agent, position: [8, 22]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: weap, owner: agent, position: [12, 22]}
        - {type: harv, owner: agent, position: [14, 18]}
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 22]}
    win_condition:
      all_of:
        - economy_value_gte: 6500
        - within_ticks: 2700
    fail_condition:
      any_of:
        - after_ticks: 2701
        - not: {own_units_gte: 1}
    max_turns: 30
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Tighter clock and a higher bar (5500 economy value by tick 3000).
    # Starting cash (1500) is well below the bar, and a single harvester
    # at this map only produces ~3150 ore over 3000 ticks (total ~4650) —
    # that misses the bar. A war factory and a construction yard are pre-
    # placed: the intended play is to build one extra harvester (cost
    # 1100) while the first keeps harvesting, then run both. Spending the
    # budget on infantry / other units starves the income channel and
    # loses; stalling loses.
    description: >
      Commander, this is a tighter time-boxed revenue ramp. You start
      with a Construction Yard ('fact'), Power Plant ('powr'), Ore
      Refinery ('proc'), War Factory ('weap'), and ONE Harvester
      ('harv'). Two ore patches sit east of your base. Your reserve is
      $1100. Reach economy value 8000 within about 34 turns.
    starting_cash: 1100
    overrides:
      actors:
        - {type: fact, owner: agent, position: [8, 18]}
        - {type: powr, owner: agent, position: [8, 22]}
        - {type: proc, owner: agent, position: [12, 18]}
        - {type: weap, owner: agent, position: [12, 22]}
        - {type: harv, owner: agent, position: [14, 18]}
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 22]}
    win_condition:
      all_of:
        - economy_value_gte: 8000
        - within_ticks: 3000
    fail_condition:
      any_of:
        - after_ticks: 3001
        - not: {own_units_gte: 1}
    max_turns: 35
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # High bar (7500) and a short clock (3600 ticks). Starting cash (1200)
    # is well below the bar; a single pre-placed harvester only reaches
    # ~3200-5200 ore over 3600 ticks — that misses. The intended play is
    # to build TWO extra harvesters (3 total) and feed all three ore
    # patches in parallel. The starting position varies by seed (two
    # spawn_point groups: NW or SW base) so a memorised single fixed plan
    # can't generalise — the model must locate the pre-placed patches
    # relative to its base each episode.
    description: >
      Commander, this is the leanest time-boxed revenue ramp under a
      tight clock. You start with a Construction Yard, Power Plant, Ore
      Refinery, War Factory, and ONE Harvester. Three ore patches sit
      in your spawn's local cluster (your spawn is NW or SW by seed,
      each with its own three-patch layout). Your reserve is $2200.
      Reach economy value 12000 within about 40 turns. Locate your
      patches relative to your base.
    starting_cash: 2200
    overrides:
      actors:
        # spawn_point 0 — north base; ore patches to the east
        - {type: fact, owner: agent, position: [8, 10], spawn_point: 0}
        - {type: powr, owner: agent, position: [8, 14], spawn_point: 0}
        - {type: proc, owner: agent, position: [12, 10], spawn_point: 0}
        - {type: weap, owner: agent, position: [12, 14], spawn_point: 0}
        - {type: harv, owner: agent, position: [14, 10], spawn_point: 0}
        - {type: mine, owner: neutral, position: [22, 10], spawn_point: 0}
        - {type: mine, owner: neutral, position: [22, 14], spawn_point: 0}
        - {type: mine, owner: neutral, position: [26, 12], spawn_point: 0}
        # spawn_point 1 — south base; ore patches to the east
        - {type: fact, owner: agent, position: [8, 28], spawn_point: 1}
        - {type: powr, owner: agent, position: [8, 32], spawn_point: 1}
        - {type: proc, owner: agent, position: [12, 28], spawn_point: 1}
        - {type: weap, owner: agent, position: [12, 32], spawn_point: 1}
        - {type: harv, owner: agent, position: [14, 28], spawn_point: 1}
        - {type: mine, owner: neutral, position: [22, 28], spawn_point: 1}
        - {type: mine, owner: neutral, position: [22, 32], spawn_point: 1}
        - {type: mine, owner: neutral, position: [26, 30], spawn_point: 1}
    win_condition:
      all_of:
        - economy_value_gte: 12000
        - within_ticks: 3600
    # after_ticks ≤ 93+90·41 = 3783 ⇒ deadline bites inside max_turns.
    fail_condition:
      any_of:
        - after_ticks: 3601
        - not: {own_units_gte: 1}
    max_turns: 42
