# f11-rebuild-after-attrition — Family-11 (full-game) recovery idiom
# pack: the agent inherits a doomed FORWARD production cell and a safe
# HOME production stack. An in-world enemy strike force grinds the
# FORWARD assets in the opening turns and will continue to grind
# anything rebuilt at the forward cell. The agent must REBUILD the
# lost production capability at the HOME base, recover the strike
# force, and still finish the offensive on the ORIGINAL deadline.
#
# DESIGN — two-base strategic-retreat template (task #81):
#   START: TWO bases.
#     • FORWARD at x≈50 (mid-map) — exposed `weap` (and on hard also
#       `proc`) at LOW HEALTH, no/token defenders, in the engagement
#       arc of a heavy enemy strike force pre-placed at x≈56-58.
#       Anything BUILT at this cell ALSO gets destroyed by the
#       persistent stance:3 enemy column (the strikers don't go
#       away after the opening kills — they linger and hunt).
#     • HOME at x≈12 (deep west) — full production stack: `fact`,
#       `powr`, `proc`, `tent`, `weap`, `hpad`, `fix`, two harvs,
#       two starter `2tnk` on hold-fire. Out of the strike force's
#       reach — a build issued at HOME completes and survives.
#   THREAT: an in-world enemy strike force (3-5× `4tnk`, stance:3
#     AttackAnything) sits adjacent to the FORWARD buildings; they
#     auto-engage the moment the episode starts and remain a
#     persistent threat across the whole map mid-zone. The HOME
#     base is geometrically out of their natural hunt arc (they're
#     east of forward; west of forward is empty after the forward
#     buildings fall).
#   WIN: STATE-BASED at deadline — agent must have:
#     • a `weap` alive (HOME weap is safe; a rebuilt HOME weap
#       also counts; a rebuilt FORWARD weap is destroyed by the
#       strikers and so does NOT count toward the live floor),
#     • a force of N+ `2tnk` alive (only HOME production funds
#       enough tanks under the cash + clock budget),
#     • K+ enemy buildings destroyed (the strike-home offensive),
#     • `fact` alive (HOME fact survives — basic survival floor).
#   LOSS (in-game, not externally scripted):
#     • stall — no production, no army, no kills → deadline LOSS.
#     • build-at-forward — cash burned on `weap`/`proc` placed in
#       the strike arc gets razed; the army quota AND kill quota
#       both miss → deadline LOSS.
#     • brute — push starter tanks east; the strike force chews
#       them in passing and the army quota is unmet → LOSS.
#     • intended — build at HOME, fund the strike package, push
#       east → WIN.
#
# Why this is the right shape for F11 rebuild-after-attrition:
#   The capability is "recover production / army after losing part
#   of the force mid-episode". The doomed-forward construction
#   produces an in-game LOSS (the strike force eats the forward
#   weap in turns 1-3, in real-time observable combat) — not an
#   exogenous `destroy_actors` event that punishes preemptive
#   redundancy. A preemptive operator who immediately produces at
#   HOME wins even more comfortably; the win is purely state-based
#   at the deadline.
#
# ENGINE NOTES (CLAUDE.md, verified 2026-05-24):
#  - `health:` on a pre-placed actor is an HP PERCENTAGE (1-100)
#    applied via the `Health` trait. A `weap` placed at `health: 20`
#    starts at 20% HP and falls to one 4tnk salvo (~25-30 dps)
#    inside the first decision turn.
#  - `4tnk` at `stance:3` (AttackAnything) auto-engages the nearest
#    visible enemy and ADVANCES toward visible enemies that are out
#    of weapon range — the right stance for a persistent hunt arc
#    that punishes any forward rebuild. Documented in CLAUDE.md
#    "Stance semantics are now four behaviourally-distinct gates".
#  - `place_building` does NOT enforce build-adjacency, so an agent
#    can place a rebuilt `weap` at ANY in-bounds cell — including
#    HOME (safe) or FORWARD (doomed). The model's choice between
#    safe/doomed cells is the load-bearing decision.
#  - `building_count_gte` is a LIVE per-frame count (drops to 0 on
#    destruction, latches on rebuild) — the right predicate for
#    "alive at deadline" state checks. `has_building` accumulates
#    forever and cannot test alive-at-deadline (CLAUDE.md footgun).
#  - `termination.enemy_units_killed: false` keeps the run alive
#    past the strike force's full-wipe (so the offensive can land
#    on enemy buildings). Required by §79 because the win predicate
#    includes `enemy_buildings_destroyed_gte`.
#  - `termination.agent_units_killed: false` keeps the run alive
#    past a FORWARD-only wipe (the FORWARD weap/proc + any tokens
#    placed at forward all dying mid-episode is normal play — the
#    HOME base keeps producing).
#  - Engine commit 493898e wires `termination.max_ticks` through
#    end-to-end; the historical 10000-tick hard cap is removed. The
#    hard tier runs at `max_turns: 160` (reachable max ≈ 14403) and
#    declares `termination.max_ticks: 14500`.
#  - The persistent unarmed enemy `fact` marker far east at (92,38)
#    keeps the engine's all-enemies-eliminated auto-`done` gated, so
#    a stall/brute scenario reaches the deadline as LOSS not DRAW.
#    (Belt-and-braces alongside `enemy_units_killed: false`.)
#
# Difficulty axis (one new controlled variable per tier):
#   • easy   — single FORWARD weap to lose; 3× 4tnk striker column;
#              3 tanks + 1 enemy building kill bar; $5500 reserve.
#   • medium — single FORWARD weap to lose; 4× 4tnk striker column +
#              a tick-2500 e3 harass raid (in-game scripted reinforce-
#              ment, NOT an agent-asset destroyer); 4 tanks + 2
#              enemy buildings; $8000 reserve.
#   • hard   — TWO FORWARD assets to lose (weap + proc); 5× 4tnk
#              striker column + the harass raid; 5 tanks + 2 enemy
#              buildings; $8500 reserve; PLUS two seed-driven AGENT
#              `spawn_point` groups (NORTH y=12 / SOUTH y=28) — both
#              HOME and FORWARD shift latitude per seed and the enemy
#              striker column is duplicated at both latitudes so the
#              active-latitude FORWARD assets always fall.

meta:
  id: f11-rebuild-after-attrition
  title: 'F11 Rebuild After Attrition — Disaster Recovery'
  capability: reasoning
  real_world_meaning: >
    Disaster recovery / industrial-accident replanning: the
    commander inherits a doomed exposed production cell that the
    enemy is already grinding down, and a safe rear production
    stack. The exposed cell will fall regardless of action; rebuild
    discipline at the SAFE site (not the exposed one) is the only
    way to restart production, rebuild the strike force, and still
    finish the offensive on the ORIGINAL deadline. The PlanBench
    replanning idiom: the FORWARD-position plan is invalidated by
    in-game enemy action, and the repair plus the original goal
    must both fit inside the unchanged budget.
  robotics_analogue: >
    Mission resilience under a station-loss event: a multi-robot
    warehouse where an exposed charging station is being depleted
    by an adversary and a rear safe station is intact; the system
    must redirect, recharge from the safe capacity, and still hit
    the day's throughput.
  benchmark_anchor:
    - "PlanBench replanning under exogenous failure"
    - "SC2 comeback (rebuild after bad trade, keep timing)"
    - "SRE disaster recovery / industrial-accident response"
  author: openra-bench

base_map:
  generator: arena
  name: f11-rebuild-after-attrition-arena-96
  width: 96
  height: 40
  cordon: 2

base:
  agent: {faction: allies}
  enemy: {faction: soviet, bot_type: turtle}
  tools:
    - observe
    - build
    - place_building
    - move_units
    - attack_unit
    - attack_move
    - set_stance
    - stop
  planning: true
  interrupts: {}
  termination:
    # Engine commit 493898e wires `termination.max_ticks` through
    # end-to-end; hard tier restores the original
    # audits/family11_full_game.csv design at max_turns 160 /
    # within_ticks 14000 / reachable max 14403.
    max_ticks: 14500
    # BOTH flags are load-bearing — see header notes.
    agent_units_killed: false
    enemy_units_killed: false
  actors: []

levels:
  # ── EASY ────────────────────────────────────────────────────────────
  # FORWARD: a low-HP `weap` at (50,20); the only forward asset.
  # Striker column: 3× 4tnk at (56-58, 19-21), stance:3 — they grind
  # the forward weap in the opening turns (~tick 50-150) and remain a
  # persistent hunt arc in the mid-map for any forward rebuild.
  # HOME: full production stack at x=12 (fact, powr×2, proc, dome,
  # tent, weap, hpad, fix), 2 harvs, 2 starter tanks (hold-fire).
  # Enemy main base at (80,20); win bar 3 tanks + 1 enemy building.
  easy:
    description: >
      Commander, you hold two bases. A HOME base in the deep west
      around (12,20) has the full production stack — Construction
      Yard, Power Plants, Ore Refinery, Barracks, War Factory,
      Helipad, Service Depot — plus two Harvesters and two Medium
      Tanks on hold-fire. A FORWARD War Factory sits exposed near
      (50,20); it is at low health and three enemy heavy tanks are
      already engaging it. An enemy base sits at (80,20), lightly
      defended. Cash on hand: $5500. Win bar: at the deadline you
      must have a War Factory standing, at least three Medium Tanks
      alive, AND have razed at least one enemy production building —
      all within about 100 turns. Keep your HOME Construction Yard
      standing.
    starting_cash: 5500
    overrides:
      base_map:
        generator: arena
        name: f11-rebuild-after-attrition-arena-96
        width: 96
        height: 40
        cordon: 2
      actors:
        # ─ HOME base — safe, deep west. Full production stack.
        - {type: fact, owner: agent, position: [12, 20]}
        - {type: powr, owner: agent, position: [8, 18]}
        - {type: powr, owner: agent, position: [8, 22]}
        - {type: proc, owner: agent, position: [12, 16]}
        - {type: dome, owner: agent, position: [12, 24]}
        - {type: tent, owner: agent, position: [9, 14]}
        - {type: weap, owner: agent, position: [15, 22]}
        - {type: hpad, owner: agent, position: [9, 28]}
        - {type: fix,  owner: agent, position: [15, 16]}
        - {type: harv, owner: agent, position: [16, 18]}
        - {type: harv, owner: agent, position: [16, 20]}
        # Starter tanks — hold-fire so they don't auto-rush the
        # FORWARD striker column and die in passing.
        - {type: 2tnk, owner: agent, position: [20, 19], stance: 0}
        - {type: 2tnk, owner: agent, position: [20, 21], stance: 0}
        # Ore patches near HOME (income credible).
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 20]}
        # ─ FORWARD exposed weap. health:20 = 20% HP; the adjacent
        # 4tnk column eats it inside the first decision turn.
        - {type: weap, owner: agent, position: [50, 20], health: 20}
        # ─ Enemy strike force flanking the FORWARD weap (north +
        # south offset so an east-bound y=20 corridor isn't fully
        # walled off); persistent stance:3 hunters that also punish
        # a forward rebuild. 3 tanks for easy.
        - {type: '4tnk', owner: enemy, position: [52, 17], stance: 3}
        - {type: '4tnk', owner: enemy, position: [52, 23], stance: 3}
        - {type: '4tnk', owner: enemy, position: [54, 20], stance: 3}
        # ─ Enemy main base — strike-home target, lightly defended.
        - {type: fact, owner: enemy, position: [80, 20]}
        - {type: powr, owner: enemy, position: [83, 18]}
        - {type: tent, owner: enemy, position: [83, 22]}
        - {type: e1,   owner: enemy, position: [78, 19], stance: 2}
        - {type: e1,   owner: enemy, position: [78, 21], stance: 2}
        - {type: e3,   owner: enemy, position: [80, 17], stance: 2}
        # Anti-DRAW sentinel.
        - {type: fact, owner: enemy, position: [92, 38]}
    win_condition:
      all_of:
        # State-based at the deadline. EACH clause is a live floor
        # the agent must satisfy when the within_ticks window closes
        # — no `then:` chain, no after_ticks gate. HOME assets count.
        - {building_count_gte: {type: weap, n: 1}}
        - {unit_type_count_gte: {type: 2tnk, n: 3}}
        - {enemy_buildings_destroyed_gte: 1}
        - {building_count_gte: {type: fact, n: 1}}
        # max_turns 100 ⇒ reachable max = 93+90·99 = 9003;
        # deadline 8900 leaves a ~100-tick buffer.
        - {within_ticks: 8900}
    fail_condition:
      any_of:
        - {after_ticks: 8901}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 100

  # ── MEDIUM ──────────────────────────────────────────────────────────
  # +1 controlled variable vs easy: HEAVIER striker column (4× 4tnk
  # vs 3) AND a tick-2500 e3 harass raid hits the mid-map (scripted
  # reinforcement, NOT an agent-asset destroyer — it spawns enemy
  # units, no destroy_actors). Force quota tightens to ≥4 tanks AND
  # ≥2 enemy buildings.
  medium:
    description: >
      Commander, you hold two bases. A HOME base in the deep west
      around (12,20) has the full production stack — Construction
      Yard, Power Plants, Ore Refinery, Barracks, War Factory,
      Helipad, Service Depot — plus two Harvesters and two Medium
      Tanks on hold-fire. A FORWARD War Factory sits exposed near
      (50,20); it is at low health and four enemy heavy tanks are
      already engaging it. Around tick 2500 a rocket-soldier raid
      arrives at mid-map. An enemy base sits at (82,20), defended
      by riflemen and a rocket soldier. Cash on hand: $8000. Win
      bar: at the deadline you must have a War Factory standing, at
      least four Medium Tanks alive, AND have razed at least two
      enemy buildings — all within about 115 turns. Keep your HOME
      Construction Yard standing.
    starting_cash: 8000
    overrides:
      base_map:
        generator: arena
        name: f11-rebuild-after-attrition-arena-96
        width: 96
        height: 40
        cordon: 2
      actors:
        - {type: fact, owner: agent, position: [12, 20]}
        - {type: powr, owner: agent, position: [8, 18]}
        - {type: powr, owner: agent, position: [8, 22]}
        - {type: proc, owner: agent, position: [12, 16]}
        - {type: dome, owner: agent, position: [12, 24]}
        - {type: tent, owner: agent, position: [9, 14]}
        - {type: weap, owner: agent, position: [15, 22]}
        - {type: hpad, owner: agent, position: [9, 28]}
        - {type: fix,  owner: agent, position: [15, 16]}
        - {type: harv, owner: agent, position: [16, 18]}
        - {type: harv, owner: agent, position: [16, 20]}
        - {type: 2tnk, owner: agent, position: [20, 19], stance: 0}
        - {type: 2tnk, owner: agent, position: [20, 21], stance: 0}
        - {type: mine, owner: neutral, position: [22, 18]}
        - {type: mine, owner: neutral, position: [22, 20]}
        - {type: mine, owner: neutral, position: [24, 19]}
        # FORWARD exposed weap.
        - {type: weap, owner: agent, position: [50, 20], health: 20}
        # HEAVIER striker column (4× 4tnk vs easy's 3); flanking the
        # forward weap north + south so the y=20 east corridor isn't
        # fully walled off.
        - {type: '4tnk', owner: enemy, position: [52, 17], stance: 3}
        - {type: '4tnk', owner: enemy, position: [52, 23], stance: 3}
        - {type: '4tnk', owner: enemy, position: [54, 17], stance: 3}
        - {type: '4tnk', owner: enemy, position: [54, 23], stance: 3}
        # Enemy main base — riflemen + rocket soldier garrison.
        - {type: fact, owner: enemy, position: [82, 20]}
        - {type: powr, owner: enemy, position: [85, 18]}
        - {type: tent, owner: enemy, position: [85, 22]}
        - {type: e1,   owner: enemy, position: [78, 18], stance: 2}
        - {type: e1,   owner: enemy, position: [78, 22], stance: 2}
        - {type: e1,   owner: enemy, position: [80, 18], stance: 2}
        - {type: e1,   owner: enemy, position: [80, 22], stance: 2}
        - {type: fact, owner: enemy, position: [92, 38]}
      scheduled_events:
        # Harass raid — 2× e3 hunt-stance at mid-map. NOTE: this is
        # a scripted ENEMY REINFORCEMENT, not an agent-asset
        # destroyer. The two-base template forbids externally-scripted
        # destruction of agent assets; spawning enemy units that
        # apply mid-map pressure is fine (and matches the template's
        # "in-world enemy or scheduled events destroying FORWARD
        # assets" thread).
        - tick: 2500
          type: spawn_actors
          actors:
            - {type: e3, owner: enemy, position: [55, 20], stance: 3, count: 2}
    win_condition:
      all_of:
        - {building_count_gte: {type: weap, n: 1}}
        - {unit_type_count_gte: {type: 2tnk, n: 4}}
        - {enemy_buildings_destroyed_gte: 2}
        - {building_count_gte: {type: fact, n: 1}}
        # max_turns 115 ⇒ reachable max = 93+90·114 = 10353; deadline
        # 9900 leaves ample buffer (under both reachable and the
        # engine cap of 14500).
        - {within_ticks: 9900}
    fail_condition:
      any_of:
        - {after_ticks: 9901}
        - {not: {building_count_gte: {type: fact, n: 1}}}
    max_turns: 115

  # ── HARD ────────────────────────────────────────────────────────────
  # +1 controlled variable vs medium: TWO FORWARD assets exposed
  # (weap + proc, both at low HP) — the agent must rebuild MORE
  # production at HOME to make the force quota. PLUS seed-rotated
  # NORTH/SOUTH base spawn (sp 0/1): both HOME and FORWARD shift
  # latitude per seed. Enemy striker column is duplicated at both
  # latitudes (enemy actors don't honour spawn_point) so the
  # active-latitude FORWARD always falls.
  hard:
    description: >
      Commander, you hold two bases. Your western HOME base spawns
      NORTH (y=12) or SOUTH (y=28) by seed — read your actual
      starting band from the observation. Each HOME spawn holds the
      full production stack (Construction Yard, Power Plants, Ore
      Refinery, Barracks, War Factory, Helipad, Service Depot), two
      Harvesters, and two Medium Tanks on hold-fire. A FORWARD War
      Factory AND a FORWARD Ore Refinery sit exposed near (50, y)
      on the same latitude; both are at low health and a five-tank
      enemy column is already engaging them. Around tick 2500 a
      rocket-soldier raid arrives at mid-map. An enemy base sits at
      (82,20). Cash on hand: $8500. Win bar: at the deadline you
      must have a War Factory standing, at least five Medium Tanks
      alive, AND have razed at least two enemy buildings — all
      within about 160 turns. Keep your HOME Construction Yard
      standing.
    starting_cash: 8500
    overrides:
      base_map:
        generator: arena
        name: f11-rebuild-after-attrition-arena-96
        width: 96
        height: 40
        cordon: 2
      actors:
        # ─ spawn_point 0 — NORTH layout @ y=12 ─────────────────────
        - {type: fact, owner: agent, position: [12, 12], spawn_point: 0}
        - {type: powr, owner: agent, position: [8, 10], spawn_point: 0}
        - {type: powr, owner: agent, position: [8, 14], spawn_point: 0}
        - {type: proc, owner: agent, position: [12, 8],  spawn_point: 0}
        - {type: dome, owner: agent, position: [12, 16], spawn_point: 0}
        - {type: tent, owner: agent, position: [9,  6],  spawn_point: 0}
        - {type: weap, owner: agent, position: [15, 14], spawn_point: 0}
        - {type: hpad, owner: agent, position: [9, 18],  spawn_point: 0}
        - {type: fix,  owner: agent, position: [15, 8],  spawn_point: 0}
        - {type: harv, owner: agent, position: [16, 10], spawn_point: 0}
        - {type: harv, owner: agent, position: [16, 12], spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [20, 11], stance: 0, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [20, 13], stance: 0, spawn_point: 0}
        - {type: mine, owner: neutral, position: [22, 10], spawn_point: 0}
        - {type: mine, owner: neutral, position: [22, 12], spawn_point: 0}
        - {type: mine, owner: neutral, position: [24, 11], spawn_point: 0}
        # FORWARD exposed weap + proc at NORTH latitude.
