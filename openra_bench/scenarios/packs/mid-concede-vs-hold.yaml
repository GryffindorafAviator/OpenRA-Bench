# Validate: python -m openra_bench.scenarios.validate \
#   openra_bench/scenarios/packs/mid-concede-vs-hold.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# CONCEDE-vs-HOLD reasoning. The operations-triage call: under a
# partial outage you cannot save every shard at once, so you must
# CHOOSE which datacentre to drain and which to defend, accept the
# loss of the conceded one cleanly, and save the defended one cleanly.
# The benchmark anchor is PlanBench under a partial-observability
# constraint relaxation ("which goal to drop?") and CICERO/Diplomacy's
# tactical-retreat call ("concede a province to save the front").
#
# Concretely: the agent owns TWO bases (fact+proc each) at WEST (24,20)
# and EAST (78,20), each with a small tank garrison; a 5-unit flex
# squad parks at the centre (51,20). A scripted `hunt` enemy pushes
# BOTH bases simultaneously, asymmetrically — one push is light
# (WEST, 20 rifles), one is heavy (EAST, 72 rifles). The HEAVY
# push fully razes the east base even against a wrong-side
# consolidation; the LIGHT push overruns a bare WEST garrison but
# the WEST garrison + FULL flex, ordered to attack-move into the
# push, holds it past the survival floor. The win is keeping
# fact+proc alive at AT LEAST ONE base in the [after_ticks,
# within_ticks] band; the loss is the timeout (5401) OR no complete
# base left (no fact OR no proc — both bases razed).
#
# RECALIBRATION (engine MOVEMENT fixes): two engine fixes shifted
# combat bench-wide — (A) `attack_unit` on an out-of-sight target
# now paths normally instead of teleporting; (B) a unit executing a
# move both FIRES and TAKES FIRE en route (no sprint-invincibility),
# respecting stance. The net effect here: a fully-consolidated force
# that ATTACK-MOVES into a push is far more effective than before,
# and — critically — agent units left at `stance:3` AttackAnything
# now auto-advance to intercept any visible enemy, so a STALL policy
# self-played the scenario (the flex + garrisons hunted the pushes
# unaided) and won for free. Re-tuned:
#   * every agent mobile unit set to `stance:1` ReturnFire — it
#     fires back when shot but never advances/initiates on its own,
#     so the capability (explicitly committing the flex) is
#     load-bearing again; the intended policy must ATTACK-MOVE.
#   * WEST light push 16→20, EAST heavy push 36/42/34→72 (uniform).
#     The buffed consolidated attack-move force could hold the EAST
#     base against the old 34-42 e1 heavy push (wrong-side
#     consolidate WON); 72 e1 razes the conceded base before the
#     force clears it, on every level and seed.
# (Earlier recalibration, still in effect: `enemy_units_killed`
# termination dropped — the win is a survival-band check; a
# `not proc:1` fail clause; a persistent unarmed enemy `fact`
# marker (anti auto-DRAW); the hard survival floor at tick 2400.)
#
#   * Stall ⇒ stance:1 units only return fire, never advance: the
#     bare west garrison is overrun by the light push, the east
#     garrison falls to the heavy push ⇒ both razed ⇒ LOSS.
#   * Split-defend (half flex to each side) ⇒ each base gets too few
#     reinforcements; both fall ⇒ LOSS.
#   * Reinforce-both-back-and-forth ⇒ flex never lands long enough
#     anywhere to make the trade; both fall ⇒ LOSS.
#   * Consolidate flex on the WRONG (heavy EAST) side ⇒ the heavy
#     72-e1 push razes the east base anyway AND the un-garrisoned
#     west base falls ⇒ every refinery lost ⇒ LOSS.
#   * Consolidate flex on the WEST (light) side and ATTACK-MOVE into
#     the push ⇒ west holds, east base falls (conceded by design)
#     ⇒ ONE base saved ⇒ WIN.
#
# Map: arena 160x60, cordon 4 (generated on demand via mapgen). The
# rush-hour-arena top-level base_map is only the support-flag sentinel
# (a known-supported string the loader can resolve before per-level
# overrides replace it with the actual generator spec).

meta:
  id: mid-concede-vs-hold
  title: 'Concede One, Save the Other — Partial-Outage Triage Under a Clock'
  capability: reasoning
  real_world_meaning: >
    Operations triage during a partial outage: the on-call engineer
    cannot save every shard, so they pick which datacentre to drain
    (concede) and which to defend, accept the loss of the conceded
    one, and save the defended one cleanly. Trying to save both
    simultaneously fails both.
  robotics_analogue: >
    Multi-site facility ops under acute load — when two sites are
    failing in parallel and the defender pool can only cover one,
    consolidating on a single site beats spreading thin across both.
  benchmark_anchor:
    - 'PlanBench partial-observability constraint relaxation'
    - 'CICERO/Diplomacy tactical retreat'
    - 'operations triage during partial outage'
    - 'datacentre drain decision under failover'
  author: openra-bench

base_map: mid-concede-arena

base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    # `hunt` per spec: every enemy unit attacks the nearest agent
    # unit/building. With a small push starting far west and a heavy
    # push starting far east, the attack mass is asymmetric out of
    # the gate; the AI's only job is to march on the nearest agent.
    bot_type: hunt
  tools:
    - move_units
    - attack_unit
    - attack_move
    - stop_units
  planning: true
  termination:
    max_ticks: 12000
    agent_units_killed: true
    # enemy_units_killed is deliberately OFF. The win is a
    # SURVIVAL-BAND check ([after_ticks 3000, within_ticks 5400]):
    # the held base must still own fact+proc inside that window. The
    # engine combat rebalance made the agent's consolidated force
    # strong enough to eventually grind down even a heavy push — so
    # an `enemy_units_killed` auto-`done` ended the episode the
    # moment the last raider fell, often BEFORE tick 3000, collapsing
    # a held-base run to a DRAW. With it off, the episode runs until
    # the survival-band win fires or the deadline LOSS bites.

levels:

  # ── EASY ─────────────────────────────────────────────────────────
  # Asymmetric push visible from start (both pushes pre-placed in the
  # open within agent vision early). Heavier push EAST, light push
  # WEST. Concede east, hold west. Lenient clock (within 5400, max
  # turns 65 → tick reach 5853); a staller times out at 5401 and
  # LOSES, but well before that the unprotected fact buildings are
  # destroyed and the `not building_count_gte:fact` clause LOSES.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Two-Base Triage (easy). You own TWO bases at WEST (24,20) and EAST
    # (78,20), each a fact + proc with a small tank garrison; a 5-unit
    # flex squad parks at the centre (51,20). A scripted hunting enemy is
    # attacking BOTH simultaneously — but the EAST push is much heavier
    # than the WEST push. You CANNOT save both: any split or back-and-
    # forth defence loses both bases to the clock. Pick the lighter (WEST)
    # side, consolidate your flex squad onto it, let the heavier side
    # fall, and keep fact+proc alive at the saved base in the late
    # survival band. WIN = both fact AND proc still standing at EITHER the
    # west base OR the east base, between tick 3000 and 5400. LOSE =
    # timeout (both bases inevitably razed) or losing BOTH bases (no fact
    # buildings remaining).
    description: >
      Two bases — WEST (24,20) and EAST (78,20), each yard plus refinery
      with a small tank garrison — and a 5-unit flex squad at the centre
      (51,20). A scripted hunt hits BOTH bases simultaneously; the two
      pushes are asymmetric (one is heavier than the other). Saving both
      is not on the table. Keep yard and refinery alive at AT LEAST ONE
      base through the late survival band (tick 3000-5400). Within about
      60 turns.
    overrides:
      base_map:
        generator: arena
        name: mid-concede-arena
        width: 160
        height: 60
        cordon: 4
      actors:
        # ── WEST agent base ──
        # fact/proc/powr at stance:2 so they don't trigger any
        # spurious movement; the agent's mobile garrison and the
        # flex squad are stance:1 ReturnFire — they fire back when
        # shot but never advance/initiate, so the agent must
        # explicitly ATTACK-MOVE the consolidated force into the
        # push for the concede-vs-hold capability to be load-bearing
        # (a stall policy cannot self-play the defence).
        - {type: fact, owner: agent, position: [24, 20], stance: 2, health: 100}
        - {type: proc, owner: agent, position: [24, 23], stance: 2, health: 100}
        - {type: powr, owner: agent, position: [22, 20], stance: 2, health: 100}
        - {type: 2tnk, owner: agent, position: [27, 19], stance: 1, count: 2, health: 100}
        - {type: 1tnk, owner: agent, position: [27, 21], stance: 1, count: 2, health: 100}
        - {type: e3,   owner: agent, position: [26, 20], stance: 1, count: 2, health: 100}
        # ── EAST agent base — symmetric layout ──
        - {type: fact, owner: agent, position: [78, 20], stance: 2, health: 100}
        - {type: proc, owner: agent, position: [78, 23], stance: 2, health: 100}
        - {type: powr, owner: agent, position: [80, 20], stance: 2, health: 100}
        - {type: 2tnk, owner: agent, position: [75, 19], stance: 1, count: 2, health: 100}
        - {type: 1tnk, owner: agent, position: [75, 21], stance: 1, count: 2, health: 100}
        - {type: e3,   owner: agent, position: [76, 20], stance: 1, count: 2, health: 100}
        # ── Flex squad — parked centre, must be committed to ONE side
        - {type: 2tnk, owner: agent, position: [51, 20], stance: 1, count: 2, health: 100}
        - {type: 1tnk, owner: agent, position: [51, 22], stance: 1, count: 2, health: 100}
        - {type: jeep, owner: agent, position: [51, 18], stance: 1, health: 100}
        # ── WEST enemy push (LIGHT) — far west edge. Sized (20 e1)
        # so the bare WEST garrison (return-fire only — see the
        # stance note) is overrun, but the WEST garrison + the
        # consolidated flex, ordered to ATTACK-MOVE into the push,
        # clears it and holds the base past the survival floor.
        - {type: e1, owner: enemy, position: [5, 20], stance: 3, count: 20, health: 100}
        # ── EAST enemy push (HEAVY) — far east edge. Sized (72 e1)
        # so it FULLY razes the east base (fact + proc) even against
        # a wrong-side full consolidation: the heavy side is genuinely
        # unsavable. Re-tuned UP after the engine MOVEMENT fixes
        # (attack_unit no longer teleports; a moving unit both fires
        # and takes fire en route) made a consolidated stance:1
        # attack-move force strong enough to hold the EAST base
        # against the old 34-42 e1 push — at that size a wrong-side
        # consolidate WON, collapsing the concede-vs-hold bar. 72 e1
        # razes the EAST base before the force can clear it.
        # EAST push split into two stacked actor entries (36+36=72)
        # because the scenario schema caps a single actor count at 50.
        - {type: e1, owner: enemy, position: [155, 21], stance: 3, count: 36, health: 100}
        - {type: e1, owner: enemy, position: [155, 24], stance: 3, count: 36, health: 100}
        # Persistent unarmed enemy `fact` marker far off-map (anti
        # auto-DRAW): keeps the episode alive past the survival floor
        # so the building-survival win/fail evaluates instead of the
        # engine auto-`done`ing the instant the last raider falls.
        - {type: fact, owner: enemy, position: [150, 5]}
    # Survival band [after_ticks 3000, within_ticks 5400]: the saved
    # base must still have fact+proc inside this window, so a turn-1
    # snapshot of "both still alive" cannot win. Reachable within
    # max_turns 65 (tick reach 5853 ≥ 5401).
    win_condition:
      any_of:
        - all_of:
          - building_in_region: {x: 24, y: 20, radius: 8, type: fact, count: 1}
          - building_in_region: {x: 24, y: 20, radius: 8, type: proc, count: 1}
          - after_ticks: 3000
          - within_ticks: 5400
        - all_of:
          - building_in_region: {x: 78, y: 20, radius: 8, type: fact, count: 1}
          - building_in_region: {x: 78, y: 20, radius: 8, type: proc, count: 1}
          - after_ticks: 3000
          - within_ticks: 5400
    # Timeout is a real reachable LOSS: max_turns 65 → tick reach 5853
    # ≥ 5401 (after_ticks fail). The fail fires the moment the agent
    # has no COMPLETE base left — `not fact:1` OR `not proc:1`. The
    # `not proc:1` clause is the load-bearing one: a wrong-side
    # consolidate (defend the HEAVY east) loses BOTH refineries (the
    # un-garrisoned west proc and the over-run east proc) — without
    # the proc clause that play kept a lone fact alive, satisfying
    # neither the win (needs fact+proc as a PAIR) nor `not fact:1`,
    # and silently DREW. With `not proc:1`, losing every refinery is
    # an immediate, real LOSS. The `not own_units_gte:1` clause
    # likewise converts a full force-wipe into a reachable LOSS.
    fail_condition:
      any_of:
        - after_ticks: 5401
        - not: {building_count_gte: {type: fact, n: 1}}
        - not: {building_count_gte: {type: proc, n: 1}}
        - not: {own_units_gte: 1}
    max_turns: 65

  # ── MEDIUM ───────────────────────────────────────────────────────
  # Same asymmetric design as easy, but the HEAVY push is larger
  # (12 e1 vs easy's 8) so the trade window is tighter and the
  # heavy-side trade is even more clearly unwinnable. Survival band
  # identical. Tighter max_turns budget keeps the staller honest.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Two-Base Triage (medium). Same two-base layout. The east push is
    # heavier than easy — split or reinforce-both loses both bases to the
    # tighter trade. Commit the flex squad to the LIGHT (west) side, let
    # the heavy side fall, and keep fact+proc alive at the saved base in
    # the late survival band.
    description: >
      Same two-base triage. The asymmetry between the two pushes is even
      more pronounced — splitting or oscillating the flex squad loses
      both bases. Keep yard and refinery alive at AT LEAST ONE base
      through tick 3000-5400. Within about 60 turns.
    overrides:
      base_map:
        generator: arena
        name: mid-concede-arena
        width: 160
        height: 60
        cordon: 4
      actors:
        # ── WEST agent base ──
        - {type: fact, owner: agent, position: [24, 20], stance: 2, health: 100}
        - {type: proc, owner: agent, position: [24, 23], stance: 2, health: 100}
        - {type: powr, owner: agent, position: [22, 20], stance: 2, health: 100}
        - {type: 2tnk, owner: agent, position: [27, 19], stance: 1, count: 2, health: 100}
        - {type: 1tnk, owner: agent, position: [27, 21], stance: 1, count: 2, health: 100}
        - {type: e3,   owner: agent, position: [26, 20], stance: 1, count: 2, health: 100}
        # ── EAST agent base ──
        - {type: fact, owner: agent, position: [78, 20], stance: 2, health: 100}
        - {type: proc, owner: agent, position: [78, 23], stance: 2, health: 100}
        - {type: powr, owner: agent, position: [80, 20], stance: 2, health: 100}
        - {type: 2tnk, owner: agent, position: [75, 19], stance: 1, count: 2, health: 100}
        - {type: 1tnk, owner: agent, position: [75, 21], stance: 1, count: 2, health: 100}
        - {type: e3,   owner: agent, position: [76, 20], stance: 1, count: 2, health: 100}
        # ── Flex squad ──
        - {type: 2tnk, owner: agent, position: [51, 20], stance: 1, count: 2, health: 100}
        - {type: 1tnk, owner: agent, position: [51, 22], stance: 1, count: 2, health: 100}
        - {type: jeep, owner: agent, position: [51, 18], stance: 1, health: 100}
        # ── WEST enemy push (LIGHT) — same 20-rifle band as easy:
        # overruns the bare garrison, held by the consolidated force.
        - {type: e1, owner: enemy, position: [5, 20], stance: 3, count: 20, health: 100}
        # ── EAST enemy push (HEAVY) — same 72-rifle unsavable band
        # as easy: a wrong-side full consolidation still loses the
        # EAST base (and the un-garrisoned WEST base falls too).
        # EAST push split into two stacked actor entries (36+36=72)
        # because the scenario schema caps a single actor count at 50.
        - {type: e1, owner: enemy, position: [155, 21], stance: 3, count: 36, health: 100}
        - {type: e1, owner: enemy, position: [155, 24], stance: 3, count: 36, health: 100}
        # Persistent unarmed enemy `fact` marker (anti auto-DRAW).
        - {type: fact, owner: enemy, position: [150, 5]}
    # Same survival band as easy; max_turns 60 → tick reach 5403 ≥ 5401.
    win_condition:
      any_of:
        - all_of:
          - building_in_region: {x: 24, y: 20, radius: 8, type: fact, count: 1}
          - building_in_region: {x: 24, y: 20, radius: 8, type: proc, count: 1}
          - after_ticks: 3000
          - within_ticks: 5400
        - all_of:
          - building_in_region: {x: 78, y: 20, radius: 8, type: fact, count: 1}
          - building_in_region: {x: 78, y: 20, radius: 8, type: proc, count: 1}
          - after_ticks: 3000
          - within_ticks: 5400
    # Same fail as easy: no complete base (`not fact:1` OR
    # `not proc:1`) or a full force-wipe is an immediate real LOSS;
    # `after_ticks 5401` is the reachable timeout. See the easy
    # fail note for why `not proc:1` is the load-bearing clause.
    fail_condition:
      any_of:
        - after_ticks: 5401
        - not: {building_count_gte: {type: fact, n: 1}}
        - not: {building_count_gte: {type: proc, n: 1}}
        - not: {own_units_gte: 1}
    max_turns: 60

  # ── HARD ─────────────────────────────────────────────────────────
  # Seed-varied flex-squad start. Two agent spawn_point groups: in
  # each one, the agent's flex squad starts pre-positioned closer to
  # ONE side, signalling-but-not-determining the intended commit. The
  # actual asymmetry is read from the enemy mass which the agent
  # still has to scout (the relative-coord objective disclosure means
  # the model cannot blindly memorise a coordinate). Plus a strict
  # attrition cap (units_lost_lte:8) so a Pyrrhic "save the base but
  # bleed the garrison dry" outcome LOSES.
  #
  # NOTE on spawn_point semantics in the Rust engine
  # (openra-data/src/oramap.rs::expand_scenario_actors): when ANY
  # agent actor declares a spawn_point, ALL agent actors WITHOUT a
  # spawn_point are filtered OUT (a `None != Some(selected)` skip,
  # different from the Python rollout's `None` passthrough). So we
  # must tag every agent actor with a spawn_point — base/garrison
  # actors get BOTH (duplicated entries with spawn_point 0 and 1) so
  # the bases and garrisons are present under either seed, and only
  # the flex squad's start position rotates.
  #
  # The enemy push composition stays identical between spawn groups
  # (enemy actors don't accept spawn_point in the Rust engine — see
  # openra-data/src/oramap.rs), so the weak side stays WEST. The
  # seed-varied piece is whether the agent's flex spawns NEAR the
  # weak side (spawn_point 0, west-flex) or FAR from it (spawn_point
  # 1, east-flex): the wrong-side start punishes a memorised
  # "always commit where I spawn" heuristic — on spawn_point 1 the
  # model must travel across the map to reach the saveable base.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Two-Base Triage (hard). Two bases, two simultaneous pushes; your
    # flex squad's start position varies by seed. Scout BOTH pushes (heavy
    # vs light), commit the flex squad to the LIGHT side, let the HEAVY
    # side fall, and SAVE fact+proc at the defended base under the
    # deadline — without bleeding the garrison dry (a strict attrition cap
    # rules out a Pyrrhic save). Splitting, oscillating, or stalling all
    # lose both bases.
    description: >
      Same triage. The flex squad's start position varies by seed. Save
      yard and refinery at AT LEAST ONE base — without losing more than
      18 own units (a Pyrrhic save fails the cap). Hold through tick
      2400-5400. Within about 60 turns.
    objective_coords: relative
    overrides:
      base_map:
        generator: arena
        name: mid-concede-arena
        width: 160
        height: 60
        cordon: 4
      actors:
        # ── WEST agent base — spawn_point 0 copy ──
        - {type: fact, owner: agent, position: [24, 20], stance: 2, health: 100, spawn_point: 0}
        - {type: proc, owner: agent, position: [24, 23], stance: 2, health: 100, spawn_point: 0}
        - {type: powr, owner: agent, position: [22, 20], stance: 2, health: 100, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [27, 19], stance: 1, count: 2, health: 100, spawn_point: 0}
        - {type: 1tnk, owner: agent, position: [27, 21], stance: 1, count: 2, health: 100, spawn_point: 0}
        - {type: e3,   owner: agent, position: [26, 20], stance: 1, count: 2, health: 100, spawn_point: 0}
        # ── WEST agent base — spawn_point 1 copy ──
        - {type: fact, owner: agent, position: [24, 20], stance: 2, health: 100, spawn_point: 1}
        - {type: proc, owner: agent, position: [24, 23], stance: 2, health: 100, spawn_point: 1}
        - {type: powr, owner: agent, position: [22, 20], stance: 2, health: 100, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [27, 19], stance: 1, count: 2, health: 100, spawn_point: 1}
        - {type: 1tnk, owner: agent, position: [27, 21], stance: 1, count: 2, health: 100, spawn_point: 1}
        - {type: e3,   owner: agent, position: [26, 20], stance: 1, count: 2, health: 100, spawn_point: 1}
        # ── EAST agent base — spawn_point 0 copy ──
        - {type: fact, owner: agent, position: [78, 20], stance: 2, health: 100, spawn_point: 0}
        - {type: proc, owner: agent, position: [78, 23], stance: 2, health: 100, spawn_point: 0}
        - {type: powr, owner: agent, position: [80, 20], stance: 2, health: 100, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [75, 19], stance: 1, count: 2, health: 100, spawn_point: 0}
        - {type: 1tnk, owner: agent, position: [75, 21], stance: 1, count: 2, health: 100, spawn_point: 0}
        - {type: e3,   owner: agent, position: [76, 20], stance: 1, count: 2, health: 100, spawn_point: 0}
        # ── EAST agent base — spawn_point 1 copy ──
        - {type: fact, owner: agent, position: [78, 20], stance: 2, health: 100, spawn_point: 1}
        - {type: proc, owner: agent, position: [78, 23], stance: 2, health: 100, spawn_point: 1}
        - {type: powr, owner: agent, position: [80, 20], stance: 2, health: 100, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [75, 19], stance: 1, count: 2, health: 100, spawn_point: 1}
        - {type: 1tnk, owner: agent, position: [75, 21], stance: 1, count: 2, health: 100, spawn_point: 1}
        - {type: e3,   owner: agent, position: [76, 20], stance: 1, count: 2, health: 100, spawn_point: 1}
        # ── Flex squad, spawn_point 0 — pre-positioned WEST of centre
        # (closer to the weak-side base). The model still has to scout
        # and decide; the start nudges the right policy.
        - {type: 2tnk, owner: agent, position: [48, 20], stance: 1, count: 2, health: 100, spawn_point: 0}
        - {type: 1tnk, owner: agent, position: [48, 22], stance: 1, count: 2, health: 100, spawn_point: 0}
        - {type: jeep, owner: agent, position: [48, 18], stance: 1, health: 100, spawn_point: 0}
        # ── Flex squad, spawn_point 1 — pre-positioned EAST of centre
        # (x=54), on the far side of the centre line from the weak
        # WEST base: a "wrong-side" start that punishes a memorised
        # "always commit to wherever I spawn" heuristic and forces
        # the model to read the enemy mass. Kept at x=54 (not the
        # far x=60 of an earlier draft) so the flex still has enough
        # travel time to join the WEST consolidation before the
        # conceded-east push's survivors cross the map — the engine
        # combat rebalance made those survivors numerous enough that
        # a too-distant flex arrived after the WEST base was already
        # being overrun.
        - {type: 2tnk, owner: agent, position: [54, 20], stance: 1, count: 2, health: 100, spawn_point: 1}
        - {type: 1tnk, owner: agent, position: [54, 22], stance: 1, count: 2, health: 100, spawn_point: 1}
        - {type: jeep, owner: agent, position: [54, 18], stance: 1, health: 100, spawn_point: 1}
        # ── WEST enemy push (LIGHT) — far west. Raised 20->26 on
        # HARD ONLY: the engine `count:` spawn-spread fix scatters the
        # 5-unit flex squad across distinct cells instead of stacking
        # it, which slightly improved the WEST garrison + HALF-flex
        # trade — a split-defend (3 of 5 flex sent WEST) suddenly held
        # the base and WON. 26 e1 re-tightens the WEST trade so the
        # bare garrison + any partial flex (split / oscillate) is
        # overrun, while the garrison + the FULL consolidated flex,
        # ordered to ATTACK-MOVE in, still clears it and holds past
        # the 2400 survival floor.
        - {type: e1, owner: enemy, position: [5, 20], stance: 3, count: 26, health: 100}
        # ── EAST enemy push (HEAVY) — far east, same 72-rifle band
        # as easy/medium. Hard's earlier survival floor (2400 vs
        # easy/medium's 3000) is what makes the heavy push need to be
        # this large: a wrong-side full consolidation can hold the
        # EAST base intact past tick 2400 against a lighter push
        # (a 34-58 e1 EAST push was still standing at tick 2400 → a
        # wrong-side consolidate snapshotted a WIN), so the EAST push
        # must be heavy enough to RAZE the EAST base before the
        # 2400 floor. 72 e1 does — `cons_east` loses every refinery
        # on every seed — while the LIGHT west push stays winnable
        # by the consolidated attack-move force.
        # EAST push split into two stacked actor entries (36+36=72)
        # because the scenario schema caps a single actor count at 50.
        - {type: e1, owner: enemy, position: [155, 21], stance: 3, count: 36, health: 100}
        - {type: e1, owner: enemy, position: [155, 24], stance: 3, count: 36, health: 100}
        # Persistent unarmed enemy `fact` marker (anti auto-DRAW).
        # Enemy actors do not honour spawn_point, so a single marker
        # (no spawn_point) places under either seed.
        - {type: fact, owner: enemy, position: [150, 5]}
    # Survival band [after_ticks 2400, within_ticks 5400] PLUS a
    # strict attrition cap (units_lost_lte:18). The survival FLOOR
    # is 2400 (earlier than easy/medium's 3000): hard's seed-varied
    # flex start slows the WEST consolidation, and the conceded-EAST
    # push's survivors march on the held WEST base — so the held
    # base must register the win BEFORE those survivors finish
    # crossing the map. 2400 is still well past the tick where a
    # stalling / splitting / oscillating play has lost both bases
    # (those collapse by tick ~1700), so it stays anti-degenerate.
    # The attrition cap was re-tuned UP from 8 after the engine
    # combat rebalance — defending the consolidated base against
    # the (now necessarily larger) 16-rifle west push costs ~11-14
    # units, so 8 was no longer survivable by any winning play; 18
    # still rules out a near-total wipe (the agent fields 28 units
    # across both bases plus the flex) while leaving the genuine
    # consolidate-and-hold play winnable.
    win_condition:
      any_of:
        - all_of:
          - building_in_region: {x: 24, y: 20, radius: 8, type: fact, count: 1}
          - building_in_region: {x: 24, y: 20, radius: 8, type: proc, count: 1}
          - after_ticks: 2400
          - within_ticks: 5400
          - units_lost_lte: 18
        - all_of:
          - building_in_region: {x: 78, y: 20, radius: 8, type: fact, count: 1}
          - building_in_region: {x: 78, y: 20, radius: 8, type: proc, count: 1}
          - after_ticks: 2400
          - within_ticks: 5400
          - units_lost_lte: 18
    # Same fail as easy/medium (`not fact:1` OR `not proc:1` — no
    # complete base — OR a force-wipe OR the timeout) plus the
    # hard-tier attrition cap.
    fail_condition:
      any_of:
        - after_ticks: 5401
        - not: {building_count_gte: {type: fact, n: 1}}
        - not: {building_count_gte: {type: proc, n: 1}}
        - not: {own_units_gte: 1}
        - not: {units_lost_lte: 18}
    max_turns: 60
