# mid-tech-switch-on-scout.yaml
#
# REASONING capability — mid-game tech-switch REACTIVE on scouted
# information. The agent starts mid-game with a small base + a scout
# jeep; an enemy fact + composition sits at a far corner; cash is
# tuned so the budget funds EXACTLY ONE of the two viable counters
# (anti-infantry: 4× e3, OR anti-vehicle: gun + 2× 2tnk). The correct
# counter depends on what's at the far corner — which is only
# knowable by driving the scout into the fog. The win predicates use
# the Wave-2 `then:` happened-before composite to enforce
# scout-BEFORE-counter: a chain-of-thought trace that pre-picks a
# counter and skips the scout cannot satisfy the chain (the first
# clause `buildings_discovered_gte: 1` must latch BEFORE the second
# counter clause is checked). All_of with `units_killed_gte: 3`
# requires the counter to actually beat what's there — funded but
# wrong-counter loses on the kill bar.
#
# Real-world anchor: PlanBench replanning (gold-standard); ALFWorld
# goal-conditional adaptation; ScienceWorld inventory adaptation;
# production replanning when a supplier reveals a new component
# lead-time — original BOM is no longer optimal, switch the active
# build target mid-episode without burning the prerequisites already
# paid for.
#
# ENGINE NOTE (per CLAUDE.md): the spawn_point filter applies ONLY
# to agent actors — enemy actors with `spawn_point` are NOT reliably
# filtered per-seed. The "composition varies by seed" axis is
# therefore expressed by varying the AGENT spawn corner (NW vs SW):
# the near far-corner contains a different physically-placed enemy
# composition (both compositions are always on the map at distinct
# corners), so the scouted-near composition determines the right
# counter. A pre-pick policy can't tell which corner is the
# threat-near corner without scouting.
#
# Validate:
#   cd /Users/berta/Projects/OpenRA-Bench && \
#   python3 -m openra_bench.scenarios.validate \
#     openra_bench/scenarios/packs/mid-tech-switch-on-scout.yaml

meta:
  id: mid-tech-switch-on-scout
  title: 'Tech-Switch on Scout — Replan the Counter Mid-Episode'
  capability: reasoning
  real_world_meaning: >
    Reactive replan on scouted information. The original build-of-materials is no longer optimal once partial observation reveals
    the enemy composition; the agent must switch the active counter
    mid-episode WITHOUT wasting the production prerequisites already
    paid for. Pre-committing without scouting wins only ~50% of the
    time on a hidden composition; hedging (build both counters)
    overruns a tight budget and finishes neither.
  robotics_analogue: >
    Production-line BOM pivot when a supplier reveals a new component
    lead-time partway through a run — the originally-scheduled bill of
    materials is no longer the cost-optimal mix, but the upstream
    prerequisites (power plant + barracks + war factory) are sunk and reusable; the
    plan must be revised, not restarted.
  benchmark_anchor:
    - "PlanBench replanning (gold-standard)"
    - "ALFWorld goal-conditional adaptation"
    - "ScienceWorld inventory adaptation"
    - "production replanning on supplier reveal"
  author: "openra-bench"

base_map:
  generator: arena
  name: mid-tech-switch-on-scout-arena
  width: 136
  height: 48

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
    bot_type: ''
  tools:
    - build
    - place_building
    - train
    - cancel_production
    - move_units
    - attack_unit
    - attack_move
    - stop_units
  planning: true
  termination:
    max_ticks: 40000

levels:
  # ── EASY ────────────────────────────────────────────────────────
  # Plan-and-execute rehearsal. ONE fixed enemy composition (6× e1 at
  # the far-east corner). The "switch" axis is muted — there's no
  # hedge decision because the brief explicitly names the enemy
  # composition. Cash is generous (funds either counter with slack)
  # so even a slow / sub-optimal counter wins as long as it ACTUALLY
  # produces ≥4 e3 OR (gun + ≥2 2tnk) AFTER discovering the enemy
  # base (the then-composite still enforces scout-first to teach the
  # idiom). A stall / build-without-scout / wrong-counter that never
  # produces enough units LOSES on the clock or the kill bar.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Pre-placed: fact + powr + tent + weap + fix + your scout jeep and an
    # enemy soviet fact + 6 rifle infantry (e1) at the far east. Drive the
    # scout east to confirm the composition (this latches the scout
    # clause), then commit your generous budget to a counter: either 4× e3
    # (rocket soldiers — anti-vehicle, also shred e1 in numbers) or build
    # a gun turret AND 2× medium tanks (2tnk). Either counter, applied
    # AFTER scouting, satisfies the WIN — but you must also destroy ≥3
    # enemy units. Pre-picking (skip the scout) cannot satisfy the then-
    # chain. Stalling loses on the clock; building neither full counter
    # loses on the kill bar.
    description: >
      Full mid-game base (yard, power, barracks, war factory, depot,
      refinery) plus a scout jeep. Six enemy rifles guard an enemy yard
      far east. Drive the scout east to confirm the composition first —
      that latches the scout clause — then commit your budget to either
      four rocket soldiers OR a gun turret plus two medium tanks. Three
      kills, within about 60 turns. Pre-picking before scouting fails the
      then-chain.
    starting_cash: 4500
    overrides:
      base_map:
        generator: arena
        name: mid-tech-switch-on-scout-arena
        width: 96
        height: 40
        cordon: 4
      actors:
        # Agent base + production chain, mid-game start.
        - {type: fact, owner: agent, position: [10, 18]}
        - {type: powr, owner: agent, position: [14, 18]}
        - {type: tent, owner: agent, position: [10, 22]}
        - {type: weap, owner: agent, position: [16, 18]}
        - {type: fix,  owner: agent, position: [20, 18]}
        - {type: proc, owner: agent, position: [14, 22]}
        # Scout: a single jeep at the base edge.
        - {type: jeep, owner: agent, position: [22, 20], stance: 1}
        # Enemy: passive infantry composition at the far east + their
        # fact so destroying the units cannot auto-end the episode.
        - {type: fact, owner: enemy, position: [88, 18]}
        - {type: e1,   owner: enemy, position: [84, 18], stance: 0, count: 6}
    win_condition:
      any_of:
        - all_of:
            - then:
                id: scout-then-counter-A-easy
                clauses:
                  - {buildings_discovered_gte: 1}
                  - {unit_type_count_gte: {type: e3, n: 4}}
            - {units_killed_gte: 3}
            - {within_ticks: 5403}
        - all_of:
            - then:
                id: scout-then-counter-B-easy
                clauses:
                  - {buildings_discovered_gte: 1}
                  - all_of:
                      - {has_building: gun}
                      - {unit_type_count_gte: {type: 2tnk, n: 2}}
            - {units_killed_gte: 3}
            - {within_ticks: 5403}
    fail_condition:
      any_of:
        - {after_ticks: 5404}
        - {not: {own_units_gte: 1}}
        - {not: {has_building: fact}}
    max_turns: 60

  # ── MEDIUM ──────────────────────────────────────────────────────
  # +1 controlled variable: HIDDEN COMPOSITION + TIGHT CASH. Two
  # physically-placed compositions sit at NE and SE far corners
  # (6× e1 NE, 4× 2tnk SE). The agent's spawn_point round-robins
  # the start base between NORTH (close to NE) and SOUTH (close to
  # SE) — so the "near composition" (the one the scout reaches
  # first within the clock) flips by seed. Cash funds EXACTLY ONE
  # counter; hedging (build half of each) finishes neither (≤2 e3
  # AND no second 2tnk) → neither then-chain advances past clause 2.
  # Pre-picking the wrong counter still might satisfy the chain if
  # 4 e3 / gun+2 2tnk are produced, but `units_killed_gte: 3`
  # requires actually beating the NEAR composition — wrong counter
  # vs the threat band loses time/clock before kills land. Stalling
  # never advances the chain.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # You hold a mid-game base (fact + powr + tent + weap + fix) and a
    # scout jeep. Two enemy compositions sit hidden at the far NE and far
    # SE corners; cash funds EXACTLY one of two counters: 4× rocket
    # soldiers (e3) OR a gun turret + 2× medium tanks (2tnk). Drive the
    # scout east to identify the near enemy composition FIRST (that
    # latches the scout clause), then commit to the matching counter and
    # destroy at least 3 enemy units before the deadline. Pre-picking
    # without scouting wins about half the time; hedging the budget
    # finishes neither counter and loses on the kill bar; stalling loses
    # on the clock.
    description: >
      Same mid-game base and scout jeep. Two enemy compositions hide at
      the NE and SE corners; the two viable counters are four rocket
      soldiers OR a gun turret plus two medium tanks. Scout the near
      composition first, commit the matching counter, kill three.
      Within about 70 turns. Pre-picking wins only half the time;
      hedging finishes neither counter.
    starting_cash: 2700
    overrides:
      base_map:
        generator: arena
        name: mid-tech-switch-on-scout-arena
        width: 96
        height: 40
        cordon: 4
      actors:
        # North-base spawn (spawn_point 0).
        - {type: fact, owner: agent, position: [10, 10], spawn_point: 0}
        - {type: powr, owner: agent, position: [14, 10], spawn_point: 0}
        - {type: tent, owner: agent, position: [10, 14], spawn_point: 0}
        - {type: weap, owner: agent, position: [16, 10], spawn_point: 0}
        - {type: fix,  owner: agent, position: [20, 10], spawn_point: 0}
        - {type: proc, owner: agent, position: [14, 14], spawn_point: 0}
        - {type: jeep, owner: agent, position: [22, 12], stance: 1, spawn_point: 0}
        # South-base spawn (spawn_point 1).
        - {type: fact, owner: agent, position: [10, 30], spawn_point: 1}
        - {type: powr, owner: agent, position: [14, 30], spawn_point: 1}
        - {type: tent, owner: agent, position: [10, 26], spawn_point: 1}
        - {type: weap, owner: agent, position: [16, 30], spawn_point: 1}
        - {type: fix,  owner: agent, position: [20, 30], spawn_point: 1}
        - {type: proc, owner: agent, position: [14, 26], spawn_point: 1}
        - {type: jeep, owner: agent, position: [22, 28], stance: 1, spawn_point: 1}
        # Two enemy compositions placed UNCONDITIONALLY (enemy
        # spawn_point is engine-unreliable per CLAUDE.md). Each at
        # its own corner with its own fact, both far enough from the
        # near base that a stall loses on the clock.
        # Unit clusters set ≥13 cells off the matching fact along Y
        # so a pre-pick attack on a cluster does NOT incidentally
        # surface the fact (2tnk/e3 RevealsShroud range 6c0) — the
        # `buildings_discovered_gte:1` clause must be latched by the
        # jeep scout, which is the load-bearing capability test.
        - {type: fact, owner: enemy, position: [92, 5]}
        - {type: e1,   owner: enemy, position: [90, 18], stance: 0, count: 6}
        - {type: fact, owner: enemy, position: [92, 34]}
        - {type: 2tnk, owner: enemy, position: [90, 22], stance: 0, count: 4}
    win_condition:
      any_of:
        - all_of:
            - then:
                id: scout-then-counter-A-medium
                clauses:
                  - {buildings_discovered_gte: 1}
                  - {unit_type_count_gte: {type: e3, n: 4}}
            - {units_killed_gte: 3}
            - {within_ticks: 6303}
        - all_of:
            - then:
                id: scout-then-counter-B-medium
                clauses:
                  - {buildings_discovered_gte: 1}
                  - all_of:
                      - {has_building: gun}
                      - {unit_type_count_gte: {type: 2tnk, n: 2}}
            - {units_killed_gte: 3}
            - {within_ticks: 6303}
    fail_condition:
      any_of:
        - {after_ticks: 6304}
        - {not: {own_units_gte: 1}}
        - {not: {has_building: fact}}
    max_turns: 70

  # ── HARD ────────────────────────────────────────────────────────
  # +1 controlled variable: relative coords + tighter attrition cap.
  # Same two-composition layout as medium, but the brief gives only
  # compass descriptions (the agent must localise the threat band on
  # the minimap) and `units_lost_lte: 4` punishes a thrashing
  # detour-then-pivot policy. ≥2 agent spawn_point groups satisfies
  # `tests/test_hard_tier.py::UPGRADED`. Hedging still fails the
  # tight budget; pre-pick still loses ~half the time; over-scout
  # bleeds the clock AND the attrition cap.
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Mid-game base with the standard production chain plus a scout jeep,
    # round-robined between a NORTH and a SOUTH base by seed. Two hidden
    # enemy compositions sit at the eastern corners — a rifle-infantry
    # horde at one corner and an armoured-tank squad at the other. Cash
    # funds exactly ONE of two counters: 4× rocket soldiers (e3) or a gun
    # turret + 2× medium tanks (2tnk). Drive the scout east to identify
    # the NEAR composition first (the brief gives compass directions, not
    # coordinates), then commit and destroy at least 3 enemy units while
    # losing no more than four of your own. Pre-pick wins half the time;
    # hedge finishes neither counter; over-scout bleeds the clock and the
    # attrition cap; stall never advances the scout-then-counter chain.
    description: >
      Same scout-and-counter setup, but your base spawns NORTH or SOUTH by
      seed and the compositions also flip by seed. Compass-only briefing:
      scout the near corner, commit the matching counter, kill three
      without losing more than four of your own. Within about 70 turns.
    starting_cash: 2700
    objective_coords: relative
    overrides:
      base_map:
        generator: arena
        name: mid-tech-switch-on-scout-arena
        width: 96
        height: 40
        cordon: 4
      actors:
        # North-base spawn (spawn_point 0).
        - {type: fact, owner: agent, position: [10, 10], spawn_point: 0}
        - {type: powr, owner: agent, position: [14, 10], spawn_point: 0}
        - {type: tent, owner: agent, position: [10, 14], spawn_point: 0}
        - {type: weap, owner: agent, position: [16, 10], spawn_point: 0}
        - {type: fix,  owner: agent, position: [20, 10], spawn_point: 0}
        - {type: proc, owner: agent, position: [14, 14], spawn_point: 0}
        - {type: jeep, owner: agent, position: [22, 12], stance: 1, spawn_point: 0}
        # South-base spawn (spawn_point 1).
        - {type: fact, owner: agent, position: [10, 30], spawn_point: 1}
        - {type: powr, owner: agent, position: [14, 30], spawn_point: 1}
        - {type: tent, owner: agent, position: [10, 26], spawn_point: 1}
        - {type: weap, owner: agent, position: [16, 30], spawn_point: 1}
        - {type: fix,  owner: agent, position: [20, 30], spawn_point: 1}
        - {type: proc, owner: agent, position: [14, 26], spawn_point: 1}
        - {type: jeep, owner: agent, position: [22, 28], stance: 1, spawn_point: 1}
        # Two enemy compositions placed unconditionally — both
        # always on the map. The agent's spawn determines which is
        # the natural "near" reachable inside the deadline.
        # Unit clusters offset ≥13 cells from the matching fact along
        # Y (same reason as medium): pre-pick attacks on (90, *)
        # cluster cells do NOT incidentally surface the fact, forcing
        # the jeep scout to latch `buildings_discovered_gte:1`.
        - {type: fact, owner: enemy, position: [92, 5]}
        - {type: e1,   owner: enemy, position: [90, 18], stance: 0, count: 6}
        - {type: fact, owner: enemy, position: [92, 34]}
        - {type: 2tnk, owner: enemy, position: [90, 22], stance: 0, count: 4}
    win_condition:
      any_of:
        - all_of:
            - then:
                id: scout-then-counter-A-hard
                clauses:
                  - {buildings_discovered_gte: 1}
                  - {unit_type_count_gte: {type: e3, n: 4}}
            - {units_killed_gte: 3}
            - {units_lost_lte: 4}
            - {within_ticks: 6303}
        - all_of:
            - then:
                id: scout-then-counter-B-hard
                clauses:
                  - {buildings_discovered_gte: 1}
                  - all_of:
                      - {has_building: gun}
                      - {unit_type_count_gte: {type: 2tnk, n: 2}}
            - {units_killed_gte: 3}
            - {units_lost_lte: 4}
            - {within_ticks: 6303}
    fail_condition:
      any_of:
        - {after_ticks: 6304}
        - {not: {own_units_gte: 1}}
        - {not: {has_building: fact}}
        - {not: {units_lost_lte: 4}}
    max_turns: 70
