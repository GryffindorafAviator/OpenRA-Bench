# Validate: python -m openra_bench.scenarios.validate packs/action-sequenced-execution.yaml
# See ../CONTRIBUTING.md for the full win-condition grammar.
#
# ACTION focus: the ordered route is GIVEN — the model must EXECUTE it
# faithfully, in order, without idling or skipping. Order is enforced
# by the stateful `waypoint_sequence` predicate (latched, monotonic):
# Wk+1 only counts after Wk was reached, so a beeline-to-final or an
# idle can never satisfy it. The within_ticks budget is the non-
# stalling teeth; overrun / attrition-bust / wipe are real LOSSES.
# Each waypoint is marked by an enemy building (a visible landmark;
# on hard they are fogged and revealed by the enemy_building_spotted
# interrupt, so the route must genuinely be scouted).

meta:
  id: action-sequenced-execution
  title: 'Non-Stop Ordered Route Execution — Run Given Waypoints In Order Without Stalling'
  capability: action
  real_world_meaning: >
    The route is already planned; the open problem is faithful,
    non-stalling execution of an ORDERED objective sequence — reaching
    each waypoint in turn and issuing the next move the instant a leg
    completes, rather than idling, re-deliberating, skipping a
    waypoint, or rushing straight to the end.
  robotics_analogue: >
    Manipulator / mobile-base task sequencing: a robot must hit a
    fixed ORDERED set of stations (pick → transit → place) within a
    cycle-time budget; pausing, reordering, or skipping a station
    misses the takt.
  author: "openra-bench"

base_map:
  generator: arena
  name: action-sequenced-execution-arena
  width: 128
  height: 40

base:
  agent: {faction: allies}
  enemy: {faction: soviet}
  tools: [move_units, attack_unit, stop]
  planning: true
  termination: {max_ticks: 8000}
  actors: []

levels:
  # ── EASY ── one column, ONE ordered 3-waypoint route on a 48x32
  # arena. Tests pure "go in the given order, don't idle."
  easy:
    description: >
      Commander, this is an ordered patrol mission. You are given 2
      medium tanks and 2 light tanks on the west edge, on hold-fire
      orders. A three-stop ordered route through enemy territory has
      been plotted: an enemy Power Plant in the mid-south first, then
      an Ore Refinery in the north, then a Construction Yard in the
      far south-east. The waypoints must be visited in that order
      within 2400 ticks.
    overrides:
      base_map:
        generator: arena
        name: action-sequenced-execution-arena-easy
        width: 48
        height: 32
        cordon: 2
        spawns: [[4, 8]]
        title: 'Sequenced Execution Arena 48x32 (Easy)'
      actors:
        - {type: 2tnk, owner: agent, stance: 0, position: [4, 8],  count: 2}
        - {type: 1tnk, owner: agent, stance: 0, position: [6, 12], count: 2}
        - {type: powr, owner: enemy, position: [16, 24]}   # W1
        - {type: proc, owner: enemy, position: [32, 6]}    # W2
        - {type: fact, owner: enemy, position: [44, 28]}   # W3 / final
    win_condition:
      all_of:
        - waypoint_sequence:
            id: R
            radius: 6
            points:
              - {x: 16, y: 24}
              - {x: 32, y: 6}
              - {x: 44, y: 28}
        - {within_ticks: 2400}
    fail_condition:
      any_of:
        - {after_ticks: 2401}
        - {not: {own_units_gte: 1}}
    max_turns: 30

  # ── MEDIUM ── TWO independent ordered routes on a 48x40 arena.
  # The routes cross at mid-map, so one column cannot serve both and
  # serial execution overruns the budget — only a genuine two-column
  # parallel split clears it. Attrition cap of 1.
  medium:
    description: >
      Commander, this is a two-column ordered patrol. You are given
      one north column (2 medium tanks + 1 light tank) and one south
      column (2 light tanks + 1 jeep), all on hold-fire orders. Each
      column has its own ordered route, each waypoint marked by an
      enemy building. The north column's route runs
      north→south→north; the south column's route runs
      south→north→south. Both ordered routes must be completed
      within 3000 ticks, holding losses to one or fewer.
    overrides:
      base_map:
        generator: arena
        name: action-sequenced-execution-arena-medium
        width: 48
        height: 40
        cordon: 2
        spawns: [[4, 8]]
        title: 'Sequenced Execution Arena 48x40 (Medium)'
      actors:
        # North column.
        - {type: 2tnk, owner: agent, stance: 0, position: [4, 8],  count: 2}
        - {type: 1tnk, owner: agent, stance: 0, position: [6, 10]}
        # South column.
        - {type: 1tnk, owner: agent, stance: 0, position: [4, 32], count: 2}
        - {type: jeep, owner: agent, stance: 0, position: [6, 30]}
        # Route N markers (N1 NW, N2 mid-SOUTH, N3 far-E NORTH).
        - {type: powr, owner: enemy, position: [16, 8]}    # N1
        - {type: proc, owner: enemy, position: [32, 32]}   # N2
        - {type: fact, owner: enemy, position: [44, 8]}    # N3
        # Route S markers (S1 SW, S2 mid-NORTH, S3 far-E SOUTH).
        - {type: dome, owner: enemy, position: [16, 32]}   # S1
        - {type: powr, owner: enemy, position: [32, 8]}    # S2
        - {type: proc, owner: enemy, position: [44, 32]}   # S3
        # Mid-screen pickets at the cross point.
        - {type: e1, owner: enemy, position: [28, 20], stance: 2, count: 2}
    win_condition:
      all_of:
        - waypoint_sequence:
            id: N
            radius: 6
            points:
              - {x: 16, y: 8}
              - {x: 32, y: 32}
              - {x: 44, y: 8}
        - waypoint_sequence:
            id: S
            radius: 6
            points:
              - {x: 16, y: 32}
              - {x: 32, y: 8}
              - {x: 44, y: 32}
        - {within_ticks: 3000}
        - {units_lost_lte: 1}
    fail_condition:
      any_of:
        - {after_ticks: 3001}
        - {not: {units_lost_lte: 1}}
        - {not: {own_units_gte: 1}}
    max_turns: 36

  # ── HARD ── TWO ordered 4-waypoint serpentine routes on a larger
  # 80x48 fogged arena, given only by RELATIVE compass direction
  # (no coordinates). The marker buildings start fogged; the
  # enemy_building_spotted interrupt re-prompts the instant a unit
  # sights one. Seed picks the staging corner (NORTH or SOUTH).
  hard:
    objective_coords: relative
    description: >
      Commander, this is a long-range ordered patrol on a large 80x48
      map. You are given two columns of 6 units each (2 medium tanks
      + 2 light tanks + 2 jeeps), one deployed far north and one far
      south, all on hold-fire orders. Each column must run a four-stop
      ordered route, with stops labelled by relative direction
      (north, centre, east, far corner). Coordinates are NOT given —
      each waypoint is an enemy building hidden in fog. When a unit
      sights one, an interrupt will reveal its exact location. Both
      ordered routes must be completed within 5000 ticks, holding
      losses to one or fewer.
    overrides:
      base_map:
        generator: arena
        name: action-sequenced-execution-arena-hard
        width: 80
        height: 48
        cordon: 2
        spawns: [[10, 10]]
        title: 'Sequenced Execution Arena 80x48 (Hard)'
      interrupts:
        enemy_building_spotted: true
      actors:
        # spawn_point 0 — north-west staging.
        - {type: 2tnk, owner: agent, stance: 0, position: [10, 10], count: 2, spawn_point: 0}
        - {type: 1tnk, owner: agent, stance: 0, position: [12, 14], count: 2, spawn_point: 0}
        - {type: jeep, owner: agent, stance: 0, position: [10, 18], count: 2, spawn_point: 0}
        # spawn_point 1 — south-west staging.
        - {type: 2tnk, owner: agent, stance: 0, position: [10, 38], count: 2, spawn_point: 1}
        - {type: 1tnk, owner: agent, stance: 0, position: [12, 34], count: 2, spawn_point: 1}
        - {type: jeep, owner: agent, stance: 0, position: [10, 30], count: 2, spawn_point: 1}
        # Route A markers (dispersed enemy bases, fogged).
        - {type: powr, owner: enemy, position: [20, 8]}    # A1 NW
        - {type: proc, owner: enemy, position: [40, 38]}   # A2 S-centre
        - {type: dome, owner: enemy, position: [62, 10]}   # A3 E-mid north
        - {type: fact, owner: enemy, position: [72, 40]}   # A4 far SE
        # Route B markers.
        - {type: dome, owner: enemy, position: [20, 40]}   # B1 SW
        - {type: powr, owner: enemy, position: [40, 8]}    # B2 N-centre
        - {type: proc, owner: enemy, position: [62, 38]}   # B3 E-mid south
        - {type: fact, owner: enemy, position: [72, 8]}    # B4 far NE
        # Light contest along the cross.
        - {type: e1, owner: enemy, position: [42, 24], stance: 2, count: 2}
        - {type: e3, owner: enemy, position: [56, 24], stance: 2, count: 2}
    win_condition:
      all_of:
        - waypoint_sequence:
            id: A
            radius: 6
            points:
              - {x: 20, y: 8,  label: "the far NORTH-WEST — western edge, northern band"}
              - {x: 40, y: 38, label: "the SOUTH-CENTRE — mid map left-to-right, southern band"}
              - {x: 62, y: 10, label: "the EAST side — eastern third, northern band"}
              - {x: 72, y: 40, label: "the far SOUTH-EAST corner — extreme east, extreme south"}
        - waypoint_sequence:
            id: B
            radius: 6
            points:
              - {x: 20, y: 40, label: "the far SOUTH-WEST — western edge, southern band"}
              - {x: 40, y: 8,  label: "the NORTH-CENTRE — mid map left-to-right, northern band"}
              - {x: 62, y: 38, label: "the EAST side — eastern third, southern band"}
              - {x: 72, y: 8,  label: "the far NORTH-EAST corner — extreme east, extreme north"}
        # Triage finding (all 4 hard seeds DRAW): the pack inherits
        # `interrupts:` from the base via enemy_building_spotted, so
        # the engine advances 1-`max_ticks` ticks per turn (variable;
        # default max_ticks=5 in run_level → ~85 ticks/turn empirically
        # at this map size). With max_turns=70 the engine reaches only
        # ~tick 5928, well below the old `after_ticks: 6001` — the
        # deadline never bit, every hard-seed non-win was a DRAW
        # rather than the LOSS the no-cheat bar requires (CLAUDE.md
        # rule #2). Lowering within_ticks 6000 -> 5000 and after_ticks
        # 6001 -> 5001 makes the deadline reachable inside the existing
        # 70-turn budget so a stall genuinely LOSES.
        - {within_ticks: 5000}
        - {units_lost_lte: 1}
    fail_condition:
      any_of:
        - {after_ticks: 5001}
        - {not: {units_lost_lte: 1}}
        - {not: {own_units_gte: 1}}
    max_turns: 70
