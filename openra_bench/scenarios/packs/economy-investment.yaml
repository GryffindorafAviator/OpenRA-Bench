meta:
  id: economy-investment
  title: 'Capital Allocation — Commit One Indivisible Budget to a Single Path'
  capability: reasoning
  real_world_meaning: >
    A capital-allocation decision under a single indivisible budget that
    is razor-tight: the cash buys EXACTLY ONE coherent path — a WIDE
    economy (a second refinery plus supporting power: added
    depot/throughput capacity) OR a DEEP one (keep the single refinery
    and convert the whole budget into a larger forward force:
    collection/utilisation). The budget cannot fund both, and any
    credit diverted to the other path starves the required one so it
    never completes in time. The test is committing to and finishing
    the one correct allocation; a split (hedged) budget builds neither
    and loses.
  robotics_analogue: >
    Fleet capital allocation under a hard, indivisible budget: the same
    funds buy EITHER added depot/processing capacity OR added
    collector/worker agents — the classic throughput-versus-collection
    trade in an autonomous foraging fleet, where a hedged (split)
    budget yields neither and the mission deadline is missed.
  benchmark_anchor:
    - "SC2 capital allocation"
    - "PlanBench indivisible budget commit"
    - "fleet capital allocation depth-vs-breadth"
  author: autonomous-loop

# ENGINE NOTE (verified 2026-05-19, scripted run_level seeds 1-4):
# harvest income is 0 in a runnable pack today (no schema-valid ore
# source; .oramap files embed no resource tiles; `silo`
# resource_capacity is hardcoded 0). Without income the ONLY scarcity
# lever is `starting_cash`, so each level's budget is set to the EXACT
# cost of its one correct path (proc 1400, powr 300, e1 100, verified
# against openra-sim/src/gamerules.rs). Any credit spent on the other
# path leaves too little to complete the required one before the
# deadline → the wide/deep trade is mutually exclusive and binding
# (proven: a "split"/"do-both" policy LOSES every level, every seed).
# Newly produced infantry block the barracks exit cells if they are
# not moved away — a competent deep policy must scatter its force
# (verified: naive non-scattering builder stalls at ~14 units; a
# scatter policy reaches 26+). The full harvest-throughput version is
# specified in SCENARIO_BRAINSTORM.md, gated on engine S0/S1.
base_map:
  generator: arena
  name: economy-investment-arena
  width: 128
  height: 48
starting_cash: 1700

base:
  agent:
    faction: allies
  enemy:
    faction: soviet
  tools:
    - build
    - place_building
    - move_units
    - deploy
    - stop
  planning: true
  termination:
    max_ticks: 12000
  actors:
    - type: fact
      owner: agent
      position: [10, 18]
    - type: powr
      owner: agent
      position: [14, 18]
    - type: proc
      owner: agent
      position: [10, 22]
    # Allied infantry production requires `tent`, not the Soviet `barr`
    # (faction: allies above). PR #15 spotted the prereq mismatch — a
    # mis-faction barracks blocks every e1 build and silently breaks
    # the "deep" path on every level.
    - type: tent
      owner: agent
      position: [14, 22]
    # Persistent inert enemy marker — far east of the small arena,
    # HoldFire so it can't attack. Keeps ConquestVictoryConditions from
    # auto-`done`-ing on enemy-wipe before the win/fail evaluator runs.
    - type: e1
      owner: enemy
      position: [42, 34]
      stance: 0

levels:
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # WIDE path. The budget is exactly the cost of a second refinery plus
    # its supporting power plant (1400 + 300 = 1700) and nothing more.
    # Build and place a 2nd refinery and a 2nd power plant. Any credit
    # spent on units instead leaves too little to finish both structures —
    # a split budget builds neither in time.
    description: >
      Commander, this is a one-shot capital allocation. You hold a
      Construction Yard (fact), an Ore Refinery (proc), one Power Plant
      (powr) and an Allied Barracks (tent), with $1700 cash. Within
      about 24 turns, own at least two Ore Refineries and at least two
      Power Plants.
    starting_cash: 1700
    win_condition:
      all_of:
        - building_count_gte: {type: proc, n: 2}
        - building_count_gte: {type: powr, n: 2}
        - within_ticks: 1893
    # after_ticks == within_ticks and both ≤ 93+90·(24-1)=2163:
    # a non-finisher (stall / wrong-or-split allocation) LOSES, not
    # draws. Wide completes ~tick 1263 (measured) — comfortable slack.
    fail_condition:
      after_ticks: 1893
    max_turns: 24
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # WIDE path under a tighter clock, plus a small utilising force. The
    # budget is exactly the wide expansion (1400 + 300) plus three
    # infantry (3 × 100 = 2000) and nothing more. Build the 2nd refinery,
    # 2nd power plant, AND three units. A fourth unit (or any other
    # diversion) overspends and the second refinery never completes in
    # time.
    description: >
      Commander, this is a capital-allocation drill with a small
      utilising force. You hold a Construction Yard (fact), an Ore
      Refinery (proc), a Power Plant (powr) and an Allied Barracks
      (tent), with $2000 cash. Within about 26 turns, own at least two
      Ore Refineries, at least two Power Plants, and field at least
      three units.
    starting_cash: 2000
    win_condition:
      all_of:
        - building_count_gte: {type: proc, n: 2}
        - building_count_gte: {type: powr, n: 2}
        - own_units_gte: 3
        - within_ticks: 2073
    fail_condition:
      after_ticks: 2073
    max_turns: 26
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # DEEP path. The budget converts entirely into a forward force: keep
    # the single refinery and field 22 infantry (22 × 100 = 2200, the
    # whole budget). Building a second refinery or power plant consumes
    # credits the force needs and the bar is missed. Newly produced units
    # must be moved clear of the barracks or production stalls.
    description: >
      Commander, this is a deep capital-allocation drill — convert
      the budget into a forward force. You hold a Construction Yard
      (fact), a single Ore Refinery (proc), a Power Plant (powr) and
      an Allied Barracks (tent), with $2200 cash. Within about 32
      turns, field at least 22 units and keep your Refinery standing.
      Newly produced units must be moved clear of the barracks exit
      cells or production stalls.
    starting_cash: 2200
    win_condition:
      all_of:
        - own_units_gte: 22
        - building_count_gte: {type: proc, n: 1}
        - within_ticks: 2613
    fail_condition:
      after_ticks: 2613
    max_turns: 32
