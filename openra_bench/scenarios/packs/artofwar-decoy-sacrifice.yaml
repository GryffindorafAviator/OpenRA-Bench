meta:
  id: artofwar-decoy-sacrifice
  title: 'Decoy Sacrifice — Spend a Bait Unit to Pull Defenders Off the Objective'
  capability: reasoning
  real_world_meaning: >
    以利动之 — "move the enemy with the prospect of gain." A small bait
    detachment must be deliberately spent to pull a reactive guarding
    force off the objective so the main body can reach it. An agent
    that keeps every unit safe and pushes head-on is destroyed; the
    winning policy accepts an early, local loss for the delayed mission
    payoff — long-horizon credit assignment, not greedy unit
    preservation.
  robotics_analogue: >
    Sacrificial-decoy planning: expend a cheap agent to divert a
    reactive obstacle/defender, accepting negative short-term reward
    for a later objective gain.
  author: openra-bench
base_map: rush-hour-arena
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  actors:
    - type: 2tnk          # main body — must reach the objective
      owner: agent
      position: [6, 22]
      stance: 3
      health: 100
      facing: -1
      count: 3
    - type: jeep          # the bait — fast, expendable
      owner: agent
      position: [6, 30]
      stance: 3
      health: 100
      facing: -1
      count: 2
    - type: e1            # reactive guards sitting on the objective
      owner: enemy
      position: [40, 24]
      stance: 3
      health: 100
      facing: -1
      count: 5
    - type: fact          # objective marker — episode can't end on guard-wipe
      owner: enemy
      position: [44, 24]
levels:
  easy:
    description: >
      Reach the objective region with the main body. The guards will
      chase whatever they see — bait them aside, then drive through.
    win_condition:
      all_of:
        - reach_region: {x: 44, y: 24, radius: 4}
        - within_ticks: 6000
    # Deadline reachable within max_turns (tick ≈ 93+90·(70-1) = 6303);
    # after_ticks 6001 makes a staller LOSE instead of drawing. The
    # intended bait-then-drive-through win lands far inside 6000.
    fail_condition:
      any_of:
      - after_ticks: 6001
      - {not: {own_units_gte: 1}}
    max_turns: 70
  medium:
    description: 'More guards; the head-on route is now clearly fatal.'
    overrides:
      actors:
        - type: 2tnk
          owner: agent
          position: [6, 22]
          stance: 3
          health: 100
          facing: -1
          count: 3
        - type: jeep
          owner: agent
          position: [6, 30]
          stance: 3
          health: 100
          facing: -1
          count: 2
        - type: e1
          owner: enemy
          position: [40, 24]
          stance: 3
          health: 100
          facing: -1
          count: 7
        - type: fact      # objective marker (see easy)
          owner: enemy
          position: [44, 24]
    win_condition:
      all_of:
        - reach_region: {x: 44, y: 24, radius: 4}
        - within_ticks: 7000
    # Deadline reachable within max_turns (tick ≈ 93+90·(80-1) = 7203);
    # after_ticks 7001 makes a staller LOSE instead of drawing. The
    # head-on route is fatal here — the decoy maneuver wins well under
    # 7000.
    fail_condition:
      any_of:
      - after_ticks: 7001
      - {not: {own_units_gte: 1}}
    max_turns: 80
  hard:
    description: >
      The main body must arrive nearly intact (loss cap) — only the
      bait may be spent. The force stages from a seed-chosen latitude
      (two spawn_point groups, same main+bait formation) so the decoy
      line that works can't be memorised; guards sit on the objective
      beyond initial sight.
    overrides:
      actors:
        # spawn_point 0 — northern staging
        - type: 2tnk
          owner: agent
          position: [6, 22]
          stance: 3
          health: 100
          facing: -1
          count: 3
          spawn_point: 0
          randomize:
            position: {base: [6, 22], offset: 3}
        - type: jeep
          owner: agent
          position: [6, 30]
          stance: 3
          health: 100
          facing: -1
          count: 2
          spawn_point: 0
        # spawn_point 1 — southern staging (same formation, shifted)
        # spawn_point 1 — northern staging. WAS y=40/48 which is
        # OFF-MAP on rush-hour-arena (MapSize 128x40, playable y≈2..37):
        # cell (6,40) indexed past the 128*40 grid and panicked the
        # engine. Relocated in-bounds, kept distinct from spawn_point
        # 0's mid/south staging so the ≥2-spawn contract still holds.
        - type: 2tnk
          owner: agent
          position: [6, 8]
          stance: 3
          health: 100
          facing: -1
          count: 3
          spawn_point: 1
          randomize:
            position: {base: [6, 8], offset: 3}
        - type: jeep
          owner: agent
          position: [6, 14]
          stance: 3
          health: 100
          facing: -1
          count: 2
          spawn_point: 1
        - type: e1
          owner: enemy
          position: [40, 24]
          stance: 3
          health: 100
          facing: -1
          count: 8
        - type: fact      # objective marker (see easy)
          owner: enemy
          position: [44, 24]
    win_condition:
      all_of:
        - reach_region: {x: 44, y: 24, radius: 3}
        - within_ticks: 8000
        - units_lost_lte: 2          # bait only; losing armour fails
    # Deadline reachable within max_turns (tick ≈ 93+90·(90-1) = 8103);
    # after_ticks 8001 makes a staller LOSE. Exceeding the bait-only
    # loss cap (units_lost > 2 ⇒ a tank was spent) also loses
    # immediately rather than drawing — this is what makes the
    # credit-assignment capability load-bearing: a brute-force push
    # that arrives but burned the armour is a LOSS, not a draw.
    fail_condition:
      any_of:
      - after_ticks: 8001
      - {not: {units_lost_lte: 2}}
      - {not: {own_units_gte: 1}}
    max_turns: 90
