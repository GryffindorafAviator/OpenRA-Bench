# combat-prevent-retreat — Establish an EASTERN CUT-OFF before engaging
# from the west: a fixed encirclement (anvil + hammer).
#
# 2026-05-23 EDITS:
#   1. POSTURE DEFECT FIX (Option B from the audit). The previous
#      briefing claimed "infantry will run east the moment we strike",
#      but every enemy cluster member carries stance:2 (Defend) and
#      enemy has no `bot_type`, so the cluster never moves — the flee
#      premise was false. Briefing rewritten as a FIXED encirclement:
#      the cluster holds its ground; the agent must STILL post a
#      cut-off tank east of the cluster while clearing it from the
#      west, because the win predicate explicitly requires
#      (a) a tank inside the eastern cut-off disc AND (b) the cluster
#      destroyed AND (c) ≥3 tanks alive. The geometry teeth are
#      unchanged — the only change is the prose framing (no false
#      claim about enemy flee behaviour). The pack now tests "anvil
#      placement before the hammer falls" rather than "preventing an
#      escape" — same engineering decision (post a unit east before
#      the engagement), honest about the enemy mechanic.
#   2. MAP SHRUNK 112x40 → 56x40 per audits/EDIT_PRINCIPLES §10 (cut
#      empty pre-engagement traversal). Cluster x=60 → x=30, cut-off
#      disc (85,20,r=8) → (43,20,r=8), pinch baffles x=70..83 →
#      x=35..40, NE/SE rocks (100,*) → (50,*), sentinel (105,4) →
#      (52,4). The encirclement geometry is preserved at half scale.
#
# Real-world anchors:
#   - Military encirclement / Cannae doctrine: pin the enemy on the
#     anvil and close the back door before the hammer falls. (In the
#     original Cannae the encirclement was active because the enemy
#     was advancing; here the enemy is stationary, but the doctrinal
#     decision — post the cut-off BEFORE engaging — is the same.)
#   - SC2 encirclement micro: a head-on attack from one bearing alone
#     bleeds the strike force; the winning play is to position a
#     blocker/anvil unit on the far side FIRST, then engage from the
#     near side. The win predicate enforces this sequencing.
#   - "The hammer needs an anvil." Without the anvil, a frontal
#     hammer pushes the cluster instead of breaking it.
#
# Mechanism (engine-load-bearing geometry — verified by scripted-policy
# smoke runs, all seeds 1–4 × every tier):
#   - 4× medium tanks (2tnk) pre-placed at the west edge.
#   - Mixed enemy infantry cluster at the centre column (x=30):
#       easy   3× e3 + 3× e1 (6 enemies, y=17..22)
#       medium 3× e3 + 4× e1 (7 enemies, y=16..22)
#       hard   3× e3 + 5× e1 (8 enemies, y=16..23)
#     `e3` (rocket infantry) is anti-armour and BITES tanks within ~5
#     cells of the cluster. A frontal column charge entering e3 range
#     (x≈29) takes concentrated fire from every e3 at once and bleeds
#     ≥2 tanks below the survival cap before it can fight back.
#   - The enemy cluster carries an EXPLICIT `stance: 2` (Defend) —
#     stationary, auto-fires on the closest in-range foe but never
#     advances. The cluster does NOT flee or chase — it holds the
#     centre as a stationary firewall.
#   - The win predicate requires THREE things AT THE SAME EVALUATION:
#       (1) `units_killed_gte: K`              — all centre enemies dead
#       (2) `units_in_region_gte:{43,20,r=8,n=1}` — cutoff tank present
#       (3) `own_units_gte: 3`                   — at least 3 tanks alive
#     plus `within_ticks: 3500` to deny stallers.
#
# Discrimination bar (five scripted-policy proxies in the test file;
# every level × every seed 1–4 must hold):
#   • stall (only observe)            → LOSS.
#   • brute attack_move-east (all 4 tanks toward 43,20) → LOSS.
#   • brute attack_move-centre (all 4 tanks toward 30,20) → LOSS.
#   • east-only (send ONE tank east, hold the rest) → LOSS.
#   • intended cut-off-then-engage → WIN.

meta:
  id: combat-prevent-retreat
  title: 'Combat Encirclement — Establish the Eastern Anvil Before You Strike'
  capability: action
  real_world_meaning: >
    A cluster of enemy rifle + rocket infantry holds the centre of
    the map (stationary, on Defend stance — they do not flee or chase).
    A head-on column charge brings every tank within rocket range of
    the cluster and bleeds the strike force below the survival cap.
    The winning play is the encirclement idiom (anvil + hammer):
    detach ONE tank on a flank route (around the cluster via y=5..10
    or y=30..35, out of rocket range) to take the eastern anvil
    position at (43,20), then commit the main body of THREE tanks
    from the west. The win predicate explicitly requires the agent
    to have ESTABLISHED an eastern cut-off (≥1 own unit at (43,20,r=8))
    at the moment the kill bar is met AND to have ≥3 tanks alive.
    Brute charging without the cut-off bleeds the force under the
    survival cap; stalling never opens fire, also a LOSS on the clock.
  robotics_analogue: >
    Multi-agent strike geometry: the placement of a "blocker" / "anvil"
    unit on the opposite side of the target BEFORE the main engagement
    opens is what converts a shove into a kill. The decision under test
    is spatial sequencing — establish the cut-off via a path that
    avoids the enemy's effective weapon envelope, THEN engage;
    reversing the order forfeits the capability that the cut-off
    enables.
  benchmark_anchor:
    - "military encirclement"
    - "Cannae doctrine"
    - "SC2 encirclement"
    - "the hammer needs an anvil"
  author: openra-bench

base_map:
  generator: arena
  name: combat-prevent-retreat-arena-56x40
  width: 56
  height: 40
  cordon: 2
  spawns: [[6, 20]]
  obstacles:
    # NORTH pinch baffle — east of cluster, north wall of the cut-off
    # channel. Does NOT block the NORTH flank route (y=3..10):
    # baffle starts at y=12.
    - {x: 35, y: 12, w: 6, h: 3}
    # SOUTH pinch baffle — mirror, south wall (y=25..27). Does NOT
    # block the SOUTH flank route (y=30..37).
    - {x: 35, y: 25, w: 6, h: 3}
    # NE / SE corner rocks — visual markers of the eastern mouth.
    - {x: 50, y: 8, w: 2, h: 2}
    - {x: 50, y: 30, w: 2, h: 2}
  title: 'Prevent-Retreat Encirclement Arena 56x40'

base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0}
  tools: [move_units, attack_unit, attack_move, stop]
  planning: true
  interrupts:
    enemy_unit_spotted: true
    own_unit_destroyed: true
  termination: {max_ticks: 6000}
  actors: []

levels:
  # ── EASY ──────────────────────────────────────────────────────────
  easy:
    description: >
      Commander, this is a combat engagement on a 56x40 arena. You
      are given 4 medium tanks (Return-Fire orders) at the west
      edge (x=6, y=18..21). A six-strong enemy cluster of 3 rocket
      soldiers and 3 rifles holds the centre at x=30, y=17..22 on
      Defend stance — they auto-fire what enters range but never
      advance. North flank ground (y=5..10) and south flank ground
      (y=30..35) are clear. Score 6 kills, place at least 1 tank
      inside the disc at (43,20) radius 8, and keep at least 3
      tanks alive, within 3500 ticks.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [6, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 21], stance: 1}
        - {type: e3, owner: enemy, position: [30, 17], stance: 2}
        - {type: e1, owner: enemy, position: [30, 18], stance: 2}
        - {type: e3, owner: enemy, position: [30, 19], stance: 2}
        - {type: e1, owner: enemy, position: [30, 20], stance: 2}
        - {type: e3, owner: enemy, position: [30, 21], stance: 2}
        - {type: e1, owner: enemy, position: [30, 22], stance: 2}
        - {type: fact, owner: enemy, position: [52, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 6}
        - {units_in_region_gte: {x: 43, y: 20, radius: 8, n: 1}}
        - {own_units_gte: 3}
        - {within_ticks: 3500}
    fail_condition:
      any_of:
        - {after_ticks: 3501}
        - {not: {own_units_gte: 3}}
    max_turns: 60

  # ── MEDIUM ────────────────────────────────────────────────────────
  medium:
    description: >
      Commander, this is a combat engagement on a 56x40 arena. You
      are given 4 medium tanks (Return-Fire orders) at the west
      edge (x=6, y=18..21). A seven-strong enemy cluster of 3
      rocket soldiers and 4 rifles holds the centre at x=30,
      y=16..22 on Defend stance. North flank ground (y=5..10) and
      south flank ground (y=30..35) are clear. Score 7 kills,
      place at least 1 tank inside the disc at (43,20) radius 8,
      and keep at least 3 tanks alive, within 3500 ticks.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [6, 18], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 19], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 20], stance: 1}
        - {type: 2tnk, owner: agent, position: [6, 21], stance: 1}
        - {type: e3, owner: enemy, position: [30, 16], stance: 2}
        - {type: e1, owner: enemy, position: [30, 17], stance: 2}
        - {type: e3, owner: enemy, position: [30, 18], stance: 2}
        - {type: e1, owner: enemy, position: [30, 19], stance: 2}
        - {type: e3, owner: enemy, position: [30, 20], stance: 2}
        - {type: e1, owner: enemy, position: [30, 21], stance: 2}
        - {type: e1, owner: enemy, position: [30, 22], stance: 2}
        - {type: fact, owner: enemy, position: [52, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 7}
        - {units_in_region_gte: {x: 43, y: 20, radius: 8, n: 1}}
        - {own_units_gte: 3}
        - {within_ticks: 3500}
    fail_condition:
      any_of:
        - {after_ticks: 3501}
        - {not: {own_units_gte: 3}}
    max_turns: 60

  # ── HARD ──────────────────────────────────────────────────────────
  hard:
    description: >
      Commander, this is a combat engagement on a 56x40 arena. You
      are given 4 medium tanks (Return-Fire orders) staged in the
      north corridor (x=6, y=12..15) or the south corridor (x=6,
      y=25..28) depending on seed. An eight-strong enemy block of
      2 rocket soldiers and 6 rifles holds the centre at x=30,
      y=16..23 on Defend stance. North flank ground (y=5..10) and
      south flank ground (y=30..35) are clear. Score 8 kills,
      place at least 1 tank inside the disc at (43,20) radius 8,
      and keep at least 3 tanks alive, within 3500 ticks.
    overrides:
      actors:
        # spawn_point 0 — NORTH staging corridor (y=12..15).
        - {type: 2tnk, owner: agent, position: [6, 12], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 13], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 14], stance: 1, spawn_point: 0}
        - {type: 2tnk, owner: agent, position: [6, 15], stance: 1, spawn_point: 0}
        # spawn_point 1 — SOUTH staging corridor (y=25..28).
        - {type: 2tnk, owner: agent, position: [6, 25], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 26], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 27], stance: 1, spawn_point: 1}
        - {type: 2tnk, owner: agent, position: [6, 28], stance: 1, spawn_point: 1}
        # 8× cluster — post-2026-05-23 shrink reduces from 3×e3+5×e1
        # to 2×e3+6×e1. On the smaller 56x40 canvas the 3-tank engaging
        # body arrives at the cluster simultaneously (vs piecemeal on
        # the original 112x40); 3 e3 firing in concert at close range
        # busts the survival cap even on the intended focus-fire play.
        # Two e3 still bleed a brute charge while letting the focus-
        # fire intended play clear the cluster inside the loss cap.
        - {type: e1, owner: enemy, position: [30, 16], stance: 2}
        - {type: e3, owner: enemy, position: [30, 17], stance: 2}
        - {type: e1, owner: enemy, position: [30, 18], stance: 2}
        - {type: e1, owner: enemy, position: [30, 19], stance: 2}
        - {type: e1, owner: enemy, position: [30, 20], stance: 2}
        - {type: e3, owner: enemy, position: [30, 21], stance: 2}
        - {type: e1, owner: enemy, position: [30, 22], stance: 2}
        - {type: e1, owner: enemy, position: [30, 23], stance: 2}
        - {type: fact, owner: enemy, position: [52, 4]}
    win_condition:
      all_of:
        - {units_killed_gte: 8}
        - {units_in_region_gte: {x: 43, y: 20, radius: 8, n: 1}}
        - {own_units_gte: 3}
        - {within_ticks: 3500}
    fail_condition:
      any_of:
        - {after_ticks: 3501}
        - {not: {own_units_gte: 3}}
    max_turns: 60
