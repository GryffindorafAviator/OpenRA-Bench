meta:
  id: artofwar-decoy-sacrifice
  title: 'Decoy Sacrifice — Divert Hunting Defenders So the Main Body Reaches the Objective'
  capability: reasoning
  real_world_meaning: >
    以利动之 — "move the enemy with the prospect of gain." A reactive
    HUNTING force (it actively pursues the nearest of your units) sits
    astride the only corridor to the objective. Push the durable main
    body straight through and the hunters converge and destroy it
    before three of them arrive. The winning policy commits the fast,
    expendable bait on a divergent vector so the hunters lock onto and
    chase IT — clearing the corridor for the main body. This is
    long-horizon credit assignment: a decoy maneuver whose payoff is
    delayed and whose cost (the bait drawing fire / dying) looks
    locally negative; greedy "keep everyone safe, push head-on" and
    "do nothing" both fail.
  robotics_analogue: >
    Sacrificial-decoy planning against a pursuing adversary: expend or
    risk a cheap agent to draw a reactive interceptor off the protected
    corridor, accepting negative short-term reward for the delayed
    arrival of the main payload.
  author: openra-bench
  status: quarantine
  quarantine_reason: archived to _archive/ — pack retired from the active
    catalog; on disk for explicit --packs / historical reference. The
    sister art-of-war packs (artofwar-indirect-approach / -lure-the-tiger
    / -sequenced-citadel) cover the decoy/sacrifice idiom in the active
    set.

base_map:
  generator: arena
  name: artofwar-decoy-sacrifice-arena
  width: 120
  height: 48

# The enemy is a LEASHED GUARD line (engine scripted bot 'guard'):
# each e3 holds its post and auto-fires in range, lunges at a foe
# within an aggro radius, and SNAPS BACK past a leash. Drive the
# column straight through and the whole line engages it (anti-tank
# rockets) — it dies before three arrive. Send the fast jeeps in as a
# decoy against one segment: those guards lunge off post after the
# bait, opening a transient gap the main body sprints through before
# they snap back. Greedy head-on / do-nothing both fail.
base:
  agent: {faction: allies, cash: 0}
  enemy: {faction: soviet, cash: 0, bot_type: guard}
  tools: [move_units, attack_unit, stop]
  planning: true
  termination: {max_ticks: 12000}
  actors:
    # Main body — durable but slow; THREE must reach the far objective.
    - {type: 2tnk, owner: agent, position: [6, 20], stance: 1, count: 3}
    # Bait — fast (kites the foot hunters), expendable. The decoy.
    - {type: jeep, owner: agent, position: [6, 24], stance: 1, count: 2}
    # Hunting picket astride the direct line spawn(6,20)→objective.
    # e3 = anti-tank rockets: lethal to an unsupported tank column.
    - {type: e3, owner: enemy, position: [60, 6],  stance: 2}
    - {type: e3, owner: enemy, position: [60, 11], stance: 2}
    - {type: e3, owner: enemy, position: [60, 16], stance: 2}
    - {type: e3, owner: enemy, position: [60, 21], stance: 2}
    - {type: e3, owner: enemy, position: [60, 26], stance: 2}
    - {type: e3, owner: enemy, position: [60, 31], stance: 2}
    - {type: e3, owner: enemy, position: [60, 36], stance: 2}
    - {type: e1, owner: enemy, position: [60, 20], stance: 2, count: 4}
    # Objective marker (far east). Unarmed, high-HP: keeps the episode
    # alive (no enemy-elimination auto-terminal) and is the landmark.
    - {type: fact, owner: enemy, position: [112, 20]}

levels:
  # ── EASY ── the bare decoy skill: a modest hunting picket. A naive
  # head-on column loses too many tanks to land 3 at the objective;
  # leading the hunters off with the jeeps clears the way. Generous
  # clock.
  easy:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # A hunting picket (rocket infantry + riflemen) blocks the lane to
    # the objective and chases your nearest unit. Get THREE tanks to
    # the objective (far east). Driving the column straight in gets it
    # shot apart before three arrive; send the fast jeeps in as bait on
    # a separate vector to pull the hunters off, then run the tanks
    # through. Idling or never committing loses on the clock.
    description: >
      A hunting rocket-and-rifle picket blocks the corridor to the far
      east objective. Get three tanks to the objective within about 65
      turns. The picket chases the nearest unit, so an unsupported
      head-on push is fatal.
    overrides: {}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 112, y: 20, radius: 6, n: 3}}
        - {within_ticks: 5800}
    fail_condition:
      any_of:
        - {after_ticks: 5801}
        - {not: {own_units_gte: 1}}
    max_turns: 66

  # ── MEDIUM ── +1 controlled variable: a heavier anti-armor picket
  # (more e3) so a head-on push is decisively fatal; tighter clock.
  medium:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Heavier rocket-infantry picket — a head-on push is now decisively
    # fatal. Same task: divert the hunters with the bait, land THREE
    # tanks on the objective before the (tighter) deadline.
    description: >
      Heavier rocket-infantry picket. Land three tanks on the far east
      objective within about 75 turns.
    overrides:
      actors:
        - {type: 2tnk, owner: agent, position: [6, 20], stance: 1, count: 3}
        - {type: jeep, owner: agent, position: [6, 24], stance: 1, count: 2}
        - {type: e3, owner: enemy, position: [60, 6],  stance: 2}
        - {type: e3, owner: enemy, position: [60, 11], stance: 2}
        - {type: e3, owner: enemy, position: [60, 16], stance: 2}
        - {type: e3, owner: enemy, position: [60, 21], stance: 2}
        - {type: e3, owner: enemy, position: [60, 26], stance: 2}
        - {type: e3, owner: enemy, position: [60, 31], stance: 2}
        - {type: e3, owner: enemy, position: [60, 36], stance: 2}
        - {type: e1, owner: enemy, position: [60, 20], stance: 2, count: 5}
        - {type: fact, owner: enemy, position: [112, 20]}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 112, y: 20, radius: 6, n: 3}}
        - {within_ticks: 6600}
    fail_condition:
      any_of:
        - {after_ticks: 6601}
        - {not: {own_units_gte: 1}}
    max_turns: 76

  # ── HARD ── +1 controlled variable: seed-chosen staging latitude
  # (two spawn_point groups, in-bounds) so the working decoy line can't
  # be memorised; strongest picket; strict attrition cap on top (the
  # main body must arrive nearly whole — only the bait may be spent).
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Strongest hunting picket; the force stages from a seed-chosen
    # latitude (the decoy line that works varies by seed, so it can't
    # be memorised). Land THREE tanks on the objective AND lose ≤2
    # units (only the two bait jeeps may be spent — burning armour
    # fails) before the tight deadline.
    description: >
      Strongest hunting picket. The force stages from a seed-chosen
      latitude. Land three tanks on the far east objective, losing at
      most two units, within about 82 turns.
    overrides:
      actors:
        # spawn_point 0 — northern staging
        - {type: 2tnk, owner: agent, position: [6, 10], stance: 1, count: 3, spawn_point: 0}
        - {type: jeep, owner: agent, position: [6, 14], stance: 1, count: 2, spawn_point: 0}
        # spawn_point 1 — southern staging (same formation, in-bounds)
        - {type: 2tnk, owner: agent, position: [6, 30], stance: 1, count: 3, spawn_point: 1}
        - {type: jeep, owner: agent, position: [6, 34], stance: 1, count: 2, spawn_point: 1}
        - {type: e3, owner: enemy, position: [60, 6],  stance: 2}
        - {type: e3, owner: enemy, position: [60, 11], stance: 2}
        - {type: e3, owner: enemy, position: [60, 16], stance: 2}
        - {type: e3, owner: enemy, position: [60, 21], stance: 2}
        - {type: e3, owner: enemy, position: [60, 26], stance: 2}
        - {type: e3, owner: enemy, position: [60, 31], stance: 2}
        - {type: e3, owner: enemy, position: [60, 36], stance: 2}
        - {type: e1, owner: enemy, position: [60, 20], stance: 2, count: 6}
        - {type: fact, owner: enemy, position: [112, 20]}
    win_condition:
      all_of:
        - {units_in_region_gte: {x: 112, y: 20, radius: 6, n: 3}}
        - {within_ticks: 7400}
        - {units_lost_lte: 2}
    fail_condition:
      any_of:
        - {after_ticks: 7401}
        - {not: {units_lost_lte: 2}}
        - {not: {own_units_gte: 1}}
    max_turns: 84
