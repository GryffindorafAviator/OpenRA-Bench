meta:
  id: adversarial-siege
  title: Break a Defended Position — Assault Entrenched Reactive Defenders
  capability: adversarial
  real_world_meaning: 'Dislodge a reactive force holding a prepared position: commit, absorb the defended
    ground, and break it before the clock — assaulting an opponent with the terrain advantage.'
  robotics_analogue: 'Adversarial objective seizure: overcome a reactive defending team entrenched at
    the goal under a time budget.'
  author: openra-bench
  status: quarantine
  quarantine_reason: consolidated into adversarial-duel — same map (rush-hour-arena), same win signature,
    same adversarial skill; duel's easy→hard ladder + configs already cover even→outnumbered→entrenched.
    On disk for explicit --packs.
base_map: rush-hour-arena
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  actors:
  - type: 2tnk
    owner: agent
    position:
    - 6
    - 10
    stance: 3
    health: 100
    facing: -1
    count: 4
  - type: e1
    owner: enemy
    position:
    - 40
    - 26
    stance: 3
    health: 100
    facing: -1
    count: 4
levels:
  easy:
    description: >
      Commander, this is an assault on an entrenched enemy position.
      You have 4 medium tanks on the west edge. Four enemy rifle infantry
      hold a position at (40,26). Destroy all 4 defenders with at least
      1 tank surviving, within about 60 turns.
    win_condition:
      all_of:
      - units_killed_gte: 4
      - within_ticks: 5400
    fail_condition:
      any_of:
      - after_ticks: 5401
      - not: {own_units_gte: 1}
    max_turns: 60
  medium:
    description: >
      Commander, this is an assault on a reinforced enemy position.
      You have 4 medium tanks on the west edge. Five enemy rifle infantry
      hold a position at (40,26), backed by 2 medium tanks at (43,29).
      Destroy all 7 defenders with at least 1 tank surviving, within
      about 75 turns.
