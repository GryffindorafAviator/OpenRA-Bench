meta:
  id: adversarial-skirmish
  title: Win While Outnumbered — Defeat a Larger Reactive Force by Maneuver
  capability: adversarial
  real_world_meaning: 'Win while outnumbered by trading space for time: pick fights, retreat, and re-engage
    a reactive enemy on favourable terms instead of a head-on brawl — asymmetric tactical reasoning.'
  robotics_analogue: 'Asymmetric adversarial control: a smaller agent team must defeat a larger reactive
    force by engagement selection.'
  author: openra-bench
  status: quarantine
  quarantine_reason: consolidated into adversarial-duel — same map, same win signature, same skill (outnumbered
    = duel's hard rung). On disk for explicit --packs.
base_map: rush-hour-arena
base:
  agent:
    faction: allies
    cash: 0
  enemy:
    faction: soviet
    cash: 0
    bot_type: ''
  actors:
  - type: 2tnk
    owner: agent
    position:
    - 6
    - 9
    stance: 3
    health: 100
    facing: -1
    count: 2
  - type: e1
    owner: enemy
    position:
    - 30
    - 20
    stance: 3
    health: 100
    facing: -1
    count: 4
levels:
  easy:
    description: >
      Commander, you are outnumbered and must win by maneuver. You have
      2 medium tanks on the west edge. Four enemy rifle infantry hold a
      position at (30,20) on AttackAnything stance — they will advance
      toward you. Destroy all 4 with at least 1 tank surviving, within
      about 60 turns.
    win_condition:
      all_of:
      - units_killed_gte: 4
      - within_ticks: 5400
    fail_condition:
      any_of:
      - after_ticks: 5400
      - not: {own_units_gte: 1}
    max_turns: 60
  medium:
    description: >
      Commander, you are outnumbered and must win by maneuver. You have
      2 medium tanks on the west edge. Four enemy rifle infantry at
      (30,20) and 2 light tanks at (35,24) hold mid-map on
      AttackAnything stance — they will advance toward you. Destroy all
      6 with at least 1 tank surviving, within about 70 turns.
    overrides:
      actors:
      - type: 2tnk
        owner: agent
        position:
        - 6
        - 9
        stance: 3
        health: 100
        facing: -1
        count: 2
      - type: e1
        owner: enemy
        position:
        - 30
        - 20
        stance: 3
        health: 100
        facing: -1
        count: 4
      - type: 1tnk
        owner: enemy
        position:
        - 35
        - 24
        stance: 3
        health: 100
        facing: -1
        count: 2
    win_condition:
      all_of:
      - units_killed_gte: 6
      - within_ticks: 6300
    fail_condition:
      any_of:
      - after_ticks: 6300
      - not: {own_units_gte: 1}
    max_turns: 70
  hard:
    # Original (pre-verbosity-sweep) description preserved for
    # contributors. The trimmed version below removes scripted-policy
    # spoilers and cell-coord dumps; load-bearing intent kept.
    #
    # Rung 3 — 3 tanks vs 8, loss-capped, and the outnumbered force
    # starts from a seed-chosen corner (two spawn_point groups → start
    # axis varies by seed, so a memorised kite line can't generalise).
    # Enemy is mid-map beyond initial sight: engage selection under fog.
    description: >
      Commander, you are outnumbered and must win by maneuver. You have
      3 medium tanks staged from a seed-chosen corner (north or south
      west edge). Five enemy rifle infantry at (30,20) and 3 light tanks
      at (35,24) hold mid-map on AttackAnything stance — they will
      advance toward you. Destroy all 8, losing at most 2, within about
      80 turns.
    overrides:
      actors:
      - type: 2tnk
        owner: agent
        position:
        - 6
        - 9
        stance: 3
        health: 100
        facing: -1
        count: 3
        spawn_point: 0
        randomize:
          position:
            base:
            - 6
            - 9
            offset: 3
      - type: 2tnk
        owner: agent
        position:
        - 6
        - 40
        stance: 3
        health: 100
        facing: -1
        count: 3
        spawn_point: 1
        randomize:
          position:
            base:
            - 6
            - 40
            offset: 3
      - type: e1
        owner: enemy
        position:
        - 30
        - 20
        stance: 3
        health: 100
        facing: -1
        count: 5
      - type: 1tnk
        owner: enemy
        position:
        - 35
        - 24
        stance: 3
        health: 100
        facing: -1
        count: 3
    win_condition:
      all_of:
      - units_killed_gte: 8
      - within_ticks: 7200
      - units_lost_lte: 2
    fail_condition:
      any_of:
      - after_ticks: 7200
      - not: {own_units_gte: 1}
    max_turns: 80
